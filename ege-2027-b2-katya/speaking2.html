<meta charset="utf-8">
<title>Speaking · Task 2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=PT+Serif+Caption&display=swap">
<style>
/* Layout: one fixed screen — compact bar on top, a hub of blocks, each activity fills the rest of the window without page scroll. Exam-paper palette: cool paper, ink blue, amber for time. */
:root{
  --paper:#F2F4F7; --surface:#FFFFFF; --ink:#1E2433; --muted:#596277; --line:#D6DCE5;
  --accent:#1F5A85; --accent-soft:#E3ECF5; --time:#B4691F; --time-soft:#F7EBDD;
  --good:#2D7A4E; --good-soft:#E2F1E8; --bad:#B03A3A; --bad-soft:#F7E3E3;
  --serif:"PT Serif", Georgia, "Times New Roman", serif;
  --cap:"PT Serif Caption", "PT Serif", Georgia, serif;
  color-scheme: light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.35;margin:0;overflow:hidden}
button{font-family:var(--serif);font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--time);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column}
.bar{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding-block:6px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.brand{font-family:var(--cap);font-size:17px;letter-spacing:.02em;white-space:nowrap}
.brand b{color:var(--accent)}
.crumb{font-size:18px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;font-size:17px;line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.time{background:var(--time);border-color:var(--time);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.main{flex:1;min-height:0;padding-block:10px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));overflow:auto}
.view{height:100%;min-height:0}
.label{font-family:var(--cap);font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* HUB */
.hub{height:100%;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:auto 1fr 1fr;gap:10px}
.hub-head{grid-column:1/-1;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
.hub-head h1{font-size:26px;margin:0;text-wrap:balance}
.hub-head p{margin:0;color:var(--muted);font-size:17px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:4px;transition:border-color .15s, transform .15s;min-height:0}
.tile:hover{border-color:var(--accent);transform:translateY(-2px)}
.tile .n{font-family:var(--cap);font-size:15px;color:var(--accent)}
.tile .t{font-size:22px;font-weight:700;line-height:1.15}
.tile .d{font-size:16px;color:var(--muted)}
.tile .m{margin-top:auto;font-size:14px;color:var(--muted);font-family:var(--cap)}
.tile.exam{grid-column:span 2;background:var(--accent);border-color:var(--accent);color:#fff}
.tile.exam .n,.tile.exam .d,.tile.exam .m{color:#D7E5F2}

/* Two-panel layouts */
.split{height:100%;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:0;overflow:auto}

/* Quizlet card */
.qz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:0}
.flip{perspective:1400px;width:min(100%,560px);height:min(300px,58vh);cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 18px rgba(30,36,51,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px 24px;text-align:center;overflow:auto}
.face.back{transform:rotateY(180deg);background:#FBFCFE}
.face .big{font-size:30px;font-weight:700;line-height:1.2;text-wrap:balance}
.face .sub{font-size:18px;color:var(--muted);margin-top:6px}
.face .hint{position:absolute;bottom:8px;right:12px;font-size:13px;color:var(--muted);font-family:var(--cap)}
.face .txt{font-size:20px;line-height:1.4;text-align:left;width:100%}
.face .qs{font-size:22px;line-height:1.45}
.face .qs div{padding:2px 0}
.ex{margin-top:6px;padding:4px 10px;border-radius:6px;font-size:19px}
.ex.ok{background:var(--good-soft);color:var(--good)}
.ex.ok::before{content:"✓ ";font-weight:700}
.ex.no{background:var(--bad-soft);color:var(--bad);text-decoration:line-through;text-decoration-thickness:1px}
.ex.no::before{content:"✕ ";font-weight:700;display:inline-block;text-decoration:none}
.nav{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px}
.arrow{width:46px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1}
.arrow:hover{border-color:var(--accent)}
.count{font-family:var(--cap);font-size:17px;min-width:72px;text-align:center;font-variant-numeric:tabular-nums}

/* accordion of oral tasks */
.acc{display:flex;flex-direction:column;gap:8px}
.acc h3{margin:0 0 2px;font-size:19px}
.acc .ab{width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:8px 12px;font-size:17px;font-weight:700;display:flex;gap:10px;align-items:center}
.acc .ab .k{font-family:var(--cap);color:var(--accent);font-weight:400}
.acc .ab[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.acc .ac{padding:6px 12px 8px;font-size:17px;line-height:1.45}
.acc .ac b{color:var(--accent)}
.mini-ring{display:inline-flex;align-items:center;gap:10px}

/* Ring timer */
.ring{position:relative;width:var(--s,84px);height:var(--s,84px);flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:8}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--time);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--s,84px)*.3);font-weight:700;font-variant-numeric:tabular-nums}

/* Hunt cards (2x2) */
.hunt{height:100%;display:grid;grid-template-rows:auto 1fr;gap:8px}
.hunt-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.score{font-family:var(--cap);font-size:17px;font-variant-numeric:tabular-nums}
.score b{font-family:var(--serif);font-size:20px;color:var(--accent)}
.grid4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px;min-height:0}
.hc{perspective:1200px;min-height:0}
.hc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.hc.on .in{transform:rotateY(180deg)}
.hc .face{padding:10px 16px;gap:6px}
.hc .ctx{font-size:15px;color:var(--muted);font-family:var(--cap)}
.hc .q{font-size:22px;font-weight:700;line-height:1.25;text-wrap:balance}
.hc .row{display:flex;gap:10px;margin-top:4px}
.verdict{font-size:20px;font-weight:700}
.verdict.g{color:var(--good)} .verdict.b{color:var(--bad)}
.hc .why{font-size:16px;line-height:1.35}
.hc .fix{font-size:19px;font-weight:700;color:var(--good)}
.face.hit{border-color:var(--good);box-shadow:0 0 0 2px var(--good-soft)}
.face.miss{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-soft)}

/* Order */
.olist{display:grid;grid-template-rows:repeat(3,1fr);gap:10px;min-height:0}
.oc{perspective:1200px;min-height:0}
.oc .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.oc.on .in{transform:rotateY(180deg)}
.oc .face{align-items:stretch;justify-content:flex-start;padding:8px 14px;gap:6px;text-align:left}
.line{min-height:42px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-bottom:4px}
.line:empty::before{content:"tap the words in order";color:var(--muted);font-size:15px;font-style:italic}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 11px;font-size:20px}
.chip:hover{border-color:var(--accent)}
.line .chip{background:var(--accent-soft);border-color:var(--accent)}
.oc .ctl{display:flex;gap:8px;align-items:center}
.oc .num{font-family:var(--cap);color:var(--accent);font-size:15px}
.oc .back .ans{font-size:23px;font-weight:700;color:var(--good)}
.oc .back .yours{font-size:17px;color:var(--muted)}
.oc .back{justify-content:center}

/* Match */
.match{height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px}
.mcols{display:grid;grid-template-columns:1fr 1.6fr;gap:18px;align-content:center}
.mcol{display:flex;flex-direction:column;gap:10px}
.mi{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px 16px;font-size:22px;text-align:left;transition:background .15s,border-color .15s}
.mi:hover{border-color:var(--accent)}
.mi.sel{background:var(--accent-soft);border-color:var(--accent)}
.mi.done{background:var(--good-soft);border-color:var(--good);color:var(--good);cursor:default}
.mi.err{animation:shake .35s;background:var(--bad-soft);border-color:var(--bad)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}

/* Bomb */
.bomb{height:100%;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.bcard{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;overflow:hidden}
.bcard .obj{font-size:19px;color:var(--muted)}
.bcard .obj b{color:var(--ink)}
.bcard .kw{font-size:34px;font-weight:700;color:var(--accent)}
.bcard .model{font-size:22px;font-weight:700;color:var(--good);min-height:30px}
.bcard.boom{animation:boom .6s}
@keyframes boom{0%{background:#fff}20%{background:var(--time)}100%{background:var(--surface)}}
.boomtxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;font-weight:700;color:var(--bad);pointer-events:none;animation:pop .9s forwards}
@keyframes pop{0%{transform:scale(.4);opacity:0}30%{transform:scale(1.15);opacity:1}100%{transform:scale(1.4);opacity:0}}
.fuse{width:100%;max-width:420px;height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.fuse i{display:block;height:100%;background:var(--time);width:100%;transition:width .2s linear}
.log{display:flex;flex-direction:column;gap:5px;font-size:16px}
.log div{display:flex;gap:8px;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:3px}
.log .m{font-weight:700;width:16px;flex:0 0 auto}
.log .m.g{color:var(--good)} .log .m.b{color:var(--bad)}

/* Exam */
.exam{height:100%;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px}
.ad{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:0}
.ad .tsk{align-self:flex-start;font-size:17px}
.ad .tsk b{display:inline-block;border:1.5px solid var(--ink);padding:0 7px;margin-right:6px}
.ad .slogan{font-size:22px;font-weight:700;text-align:center;text-wrap:balance}
.ad img{max-height:calc(100% - 80px);max-width:100%;object-fit:contain;border-radius:4px;flex:1 1 auto;min-height:0}
.ex-right{display:flex;flex-direction:column;gap:8px;min-height:0}
.pick{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;font-size:16px}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
select{width:auto;font-family:var(--serif);font-size:17px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);max-width:100%}
.sit{font-size:17px;line-height:1.4;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.pts{display:grid;grid-template-columns:1fr 1fr;gap:8px;min-height:0;flex:1}
.pt{perspective:1000px;min-height:68px}
.pt .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.pt.on .in{transform:rotateY(180deg)}
.pt .face{padding:6px 10px;align-items:flex-start;text-align:left;justify-content:center;gap:2px}
.pt .face .k{font-family:var(--cap);color:var(--accent);font-size:14px}
.pt .face .w{font-size:20px;font-weight:700;line-height:1.2}
.pt .back .w{color:var(--good);font-size:18px}
.pt.now .front{border-color:var(--time);box-shadow:0 0 0 3px var(--time-soft)}
.pt.past .front{opacity:.6}
.sc{display:flex;gap:4px;margin-top:2px}
.sc button{border:1px solid var(--line);background:var(--surface);border-radius:5px;padding:1px 14px;font-size:17px}
.sc button[aria-pressed="true"].y{background:var(--good);border-color:var(--good);color:#fff}
.sc button[aria-pressed="true"].n{background:var(--bad);border-color:var(--bad);color:#fff}
.run{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px}
.run .st{font-size:18px;flex:1;min-width:0}
.run .st b{color:var(--time)}

/* Final summary */
.fin{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.fin .big{font-size:40px;font-weight:700;color:var(--accent)}
.fin .errs{max-height:46vh;overflow:auto;text-align:left;font-size:17px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;width:min(100%,720px)}
.fin .errs div{border-bottom:1px solid var(--line);padding:4px 0}
.fin .errs s{color:var(--bad)} .fin .errs b{color:var(--good)}

/* Teacher modal */
.modal{position:fixed;inset:0;background:rgba(30,36,51,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.sheet{background:var(--surface);border-radius:14px;max-width:880px;width:100%;max-height:92%;overflow:auto;padding:16px 22px;font-size:17px;line-height:1.45}
.sheet h2{margin:0 0 6px;font-size:23px}
.sheet h3{margin:12px 0 4px;font-size:19px;color:var(--accent)}
.sheet table{border-collapse:collapse;width:100%;font-size:16px}
.sheet td,.sheet th{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.sheet ul{margin:4px 0;padding-left:22px}

@media (max-width:820px){
  body{overflow:auto}
  .hub{grid-template-columns:1fr 1fr;grid-template-rows:auto}
  .tile.exam{grid-column:span 2}
  .split,.exam,.bomb{grid-template-columns:1fr;height:auto}
  .grid4{grid-template-columns:1fr;grid-template-rows:none}
  .hc{height:180px}
  .olist{grid-template-rows:none}.oc{height:190px}
  .mcols{grid-template-columns:1fr}
  .pts{grid-template-columns:1fr}
  .brand{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <div class="bar">
    <button class="btn" id="siteHome">← Главная</button><div class="brand">Speaking · <b>Task 2</b></div>
    <div class="crumb" id="crumb">Asking for information</div>
    <button class="btn" id="homeBtn" hidden>All activities</button>
    <button class="btn" id="teachBtn">Для учителя</button>
  </div>
  <div class="main"><div class="view" id="view"></div></div>
</div>
<div class="modal" id="modal" hidden></div>

<script>
/* Варианты задания 2. Ситуации, слоганы и опорные пункты — из материалов: ФИПИ 2027 (20 типовых вариантов, ред. М. В. Вербицкой) и сборник «ЕГЭ ФИПИ. Устная часть. Задание 2» (52 варианта). Образцы вопросов составлены по правилам методических рекомендаций. */
const BANKS = {
  fipi: { name: "FIPI 2027", img: n => `s2img/f${String(n).padStart(2,"0")}.jpg`, items: [
    ["Winter Adventures Await!", "going to the winter camp", ["camp's location","accommodation","equipment provided","discounts for students"],
     ["Where is your winter camp located?","What kind of accommodation do you offer?","What equipment do you provide?","Do you have any discounts for students?"]],
    ["The world of fun!", "visiting the new playground with your younger sister", ["number of slides","busiest hours","price for one","age restrictions"],
     ["How many slides are there on the new playground?","What are the busiest hours on the playground?","How much does a ticket for one person cost?","Are there any age restrictions?"]],
    ["It's time for a change!", "having a new haircut to change your image", ["hairdresser's location","working hours","average price","payment options"],
     ["Where is your hairdresser's located?","What are your working hours?","What is the average price of a haircut?","What payment options are available?"]],
    ["Freshly baked: come and buy!", "going to the bakery", ["bakery's location","kinds of bread sold","sugar-free cakes","payment options"],
     ["Where is your bakery located?","What kinds of bread do you sell?","Do you sell sugar-free cakes?","Can I pay by credit card?"]],
    ["Play hard, win smart!", "taking part in the local volleyball competition with your school team", ["competition venue","number of games","prizes for winners","participation fee"],
     ["Where will the volleyball competition take place?","How many games will there be?","What prizes will the winners get?","How much is the participation fee?"]],
    ["Try a new sport in our sports camp!", "going to the sports camp", ["sports facilities","duration of a camp session","range of activities","age limitations"],
     ["What sports facilities are there in your sports camp?","How long does a camp session last?","What activities do you offer?","Are there any age limitations?"]],
    ["New funfair — come and enjoy!", "going to the new funfair", ["location","variety of entertainments","parking facilities","discounts for group visits"],
     ["Where is the new funfair located?","What entertainments do you offer?","Is there a car park near the funfair?","Do you have any discounts for group visits?"]],
    ["Solve a mystery with our quest team!", "playing the quest game with your friends", ["programmes available","payment options","possibility to bring food","discounts for a birthday person"],
     ["What quest programmes do you offer?","What payment options do you have?","Can we bring our own food?","Do you have any discounts for a birthday person?"]],
    ["Get in touch in a real way!", "sending a postcard to your friend (questions to your local post office)", ["working hours","prices of stamps","postboxes nearby","average time of delivery"],
     ["What are the working hours of your post office?","How much do stamps cost?","Are there any postboxes nearby?","How long does it usually take to deliver a postcard?"]],
    ["Travel to China with us!", "booking the tour with your friends", ["possible dates","duration","payment options","group discounts"],
     ["What are the possible dates of the tour to China?","How long does the tour last?","What payment options do you offer?","Do you have any group discounts?"]],
    ["Find what you need at our gift shop!", "buying a gift for your friend", ["opening hours","kinds of gifts","payment methods","special offers"],
     ["What are the opening hours of your gift shop?","What kinds of gifts do you sell?","Can I pay by credit card?","Do you have any special offers?"]],
    ["Summer camp adventures await!", "going to the language summer camp", ["camp's location","dates of camp sessions","accommodation","languages taught"],
     ["Where is the language summer camp located?","What are the dates of the camp sessions?","What kind of accommodation do you offer?","What languages do you teach?"]],
    ["Music & Fun Under the Sun!", "visiting the summer music festival", ["bands performing","dates of the festival","price for one person","safety measures"],
     ["What bands are performing at the summer music festival?","What are the dates of the festival?","How much does a ticket for one person cost?","What safety measures do you take?"]],
    ["Keep fit with us!", "joining the gym", ["equipment available","special clothes needed","public transport to get there","membership fee"],
     ["What equipment is available in your gym?","Do I need any special clothes?","What public transport can I use to get to your gym?","How much is the membership fee?"]],
    ["Healthy mind in a healthy body!", "doing a medical check-up", ["specialists available","waiting time for medical tests","making an appointment online","full check-up price"],
     ["What specialists are available for a medical check-up in your centre?","What is the waiting time for medical tests?","Can I make an appointment online?","How much does a full check-up cost?"]],
    ["Enjoy music with us!", "going to the open-air music concert", ["location","ways to get there","group discounts","accommodation nearby"],
     ["Where will the open-air concert take place?","How can I get there?","Do you have any group discounts?","Is there any accommodation nearby?"]],
    ["Art workshop: come & enjoy!", "joining the art workshop", ["location","price for one","skills needed","age limitations"],

/* English version for the students' sites */
RULES.length = 0; RULES.push(

const KEY_EN = {"location":"where it is","location of the event":"where the event is","opening hours":"when it is open","working / operation hours":"when it works","price / cost of":"how much","price for one":"for one person","admission / entrance fee":"to get in","tuition fee":"to study","membership fee":"to be a member","duration":"how long","available":"you can get it","discounts":"lower price","group / family discounts":"for groups, families","number of":"how many","minimum age":"how old","age restrictions / limitations":"age limits","accommodation":"where to stay","facilities":"what there is","special clothes":"what to wear","special equipment":"what to bring","equipment rental":"hire","evening classes":"after work","types / kinds of":"what kinds","variety of":"choice","skills needed":"what I must be able to do","experience":"what I've done before","payment options / methods":"how to pay","transportation / public transport":"how to get there","starting point":"where it starts","dates / departure dates":"when","timetable / schedule":"when classes are","delivery / delivery service":"bring to my home","delivery time":"how long delivery takes","possibility to":"can I…?","staff qualification / qualified coaches":"how good the staff are","health requirements":"health","guarantee period":"warranty","venue":"place","safety measures":"safety","whom to contact":"who to ask"};

<script>
const $ = (s, r=document) => r.querySelector(s);
const view = $("#view"), crumb = $("#crumb"), homeBtn = $("#homeBtn");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
let timers = [];
function clearTimers(){ timers.forEach(t=>{clearInterval(t);clearTimeout(t);}); timers=[]; }

/* звуковой сигнал как на экзамене (тон, не голос) */
let actx;
function beep(f=880, d=.35){
  try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain(); o.frequency.value=f; o.type="sine";
    g.gain.setValueAtTime(.0001,actx.currentTime); g.gain.exponentialRampToValueAtTime(.25,actx.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+d+.05);
  }catch(e){}
}
function ringHTML(size, id){ const r=40, c=2*Math.PI*r;
  return `<div class="ring" style="--s:${size}px" id="${id}"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="${r}"/><circle class="fg" cx="50" cy="50" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="0"/></svg><div class="num">—</div></div>`; }
function setRing(el, left, total){ if(!el) return; const c=2*Math.PI*40;
  el.querySelector(".fg").style.strokeDashoffset = c*(1-left/total);
  const m=Math.floor(left/60), s=Math.ceil(left%60);
  el.querySelector(".num").textContent = left>=60 ? `${m}:${String(Math.ceil(left)-m*60).padStart(2,"0")}` : Math.ceil(left); }
function countdown(el, total, onEnd, onTick){
  const t0=performance.now(); setRing(el,total,total);
  const id=setInterval(()=>{ const left=Math.max(0,total-(performance.now()-t0)/1000); setRing(el,left,total); onTick&&onTick(left);
    if(left<=0){clearInterval(id); onEnd&&onEnd();} },200);
  timers.push(id); return id;
}

/* ---------- HUB ---------- */
const ACTS = [
  ["rules","1","Rules","Flashcards: what counts and what gets 0", `${RULES.length} cards`],
  ["keys","2","Key words","Flashcards: key word → ready questions", `${KEYS.length} cards`],
  ["order","3","Build the question","Word order: tap the words, one may be extra", `${ORDER.length} questions`],
  ["match","4","Question starters","Match the key word to the start of the question", `${PAIRS.length} pairs`],
  ["hunt","5","Does it count?","You are the examiner: 1 point or 0", `${HUNT.length} questions`],
  ["bomb","6","Bomb","15 seconds to ask the question aloud", "12 questions a round"],
  ["exam","7","Exam","Advert, 1.5 minutes to prepare, 4 questions × 20 seconds, model answers", "72 tasks: FIPI 2027 and the collection"]
];
function hub(){
  clearTimers(); homeBtn.hidden=true; crumb.textContent="Asking for information";
  view.innerHTML = `<div class="hub"><div class="hub-head"><h1>Task 2: four direct questions about an advert</h1><p>20 seconds a question · 1 point a question · maximum 4</p></div>
  ${ACTS.map(a=>`<button class="tile ${a[0]==="exam"?"exam":""}" data-go="${a[0]}"><span class="n">${a[1]}</span><span class="t">${a[2]}</span><span class="d">${a[3]}</span><span class="m">${a[4]}</span></button>`).join("")}</div>`;
  view.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>open(b.dataset.go));
}
function open(k){ clearTimers(); homeBtn.hidden=false; const a=ACTS.find(x=>x[0]===k); crumb.textContent=`${a[1]}. ${a[2]}`; ({rules,keys,order,match,hunt,bomb,exam})[k](); }
homeBtn.onclick=hub;
document.getElementById("siteHome").onclick=()=>{ if(window.parent!==window){ window.parent.postMessage("ege-home", location.origin); } else { location.href="index.html"; } };

/* ---------- Quizlet deck ---------- */
function deck(cards, front, back, side){
  let i=0;
  view.innerHTML=`<div class="split"><div class="qz">
    <div class="flip" id="fc" role="button" tabindex="0" aria-label="Flip the card"><div class="in"><div class="face front" id="ff"></div><div class="face back" id="fb"></div></div></div>
    <div class="nav"><button class="arrow" id="pv" aria-label="Back">‹</button><button class="btn" id="fl">Flip</button><span class="count" id="ct"></span><button class="arrow" id="nx" aria-label="Next">›</button><button class="btn" id="mix">Shuffle</button></div>
  </div><div class="panel">${side}</div></div>`;
  const fc=$("#fc");
  const show=()=>{ fc.classList.remove("on"); $("#ff").innerHTML=front(cards[i])+`<span class="hint">tap to flip</span>`; $("#fb").innerHTML=back(cards[i]); $("#ct").textContent=`${i+1} / ${cards.length}`; };
  const flip=()=>fc.classList.toggle("on");
  fc.onclick=flip; fc.onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault();flip();} };
  $("#fl").onclick=flip;
  $("#pv").onclick=()=>{ i=(i-1+cards.length)%cards.length; show(); };
  $("#nx").onclick=()=>{ i=(i+1)%cards.length; show(); };
  $("#mix").onclick=()=>{ cards=shuffle(cards); i=0; show(); };
  show(); wireAcc();
}
function acc(title, items){
  return `<div class="acc"><h3>${title}</h3>${items.map((it,k)=>`<div><button class="ab" aria-expanded="false" data-a="${k}"><span class="k">${k+1}</span>${it[0]}</button><div class="ac" hidden>${it[1]}</div></div>`).join("")}</div>`;
}
function wireAcc(){
  view.querySelectorAll(".ab").forEach(b=>b.onclick=()=>{
    const open=b.getAttribute("aria-expanded")==="true";
    view.querySelectorAll(".ab").forEach(x=>{x.setAttribute("aria-expanded","false"); x.nextElementSibling.hidden=true;});
    if(!open){ b.setAttribute("aria-expanded","true"); b.nextElementSibling.hidden=false; const f=b.nextElementSibling.querySelector("[data-init]"); f&&window[f.dataset.init]&&window[f.dataset.init](f); }
  });
}
function rules(){
  deck(RULES.slice(), r=>`<div class="label">Rule</div><div class="big">${r[0]}</div>`, r=>`<div class="txt"><div class="label">${r[0]}</div>${r[1]}</div>`,
    acc("How to build a question", [
      ["Know what you ask", "Point: <i>location</i> of the swimming pool. You want to know <b>where it is</b>."],
      ["Find subject + verb", "<b>the swimming pool — is located</b> → <b>the swimming pool is located</b>. The task itself gives you the words."],
      ["Move the verb", "am, is, are, was, were, will, can go before the subject: <b>Is the swimming pool located?</b><br>No such verb? Use <b>do / does</b>: <b>Does the tour start…?</b>"],
      ["Add the question word", "<b>Where</b> · <b>When</b> · <b>What</b> · <b>How many</b> (countable) · <b>How much</b> (uncountable) · <b>How long</b><br>→ <b>Where is the swimming pool located?</b>"]
    ]));
}
const OBJECTS = ["the new ice rink","your gym","your clinic","the new bookstore","your dance school","the summer camp","your café","the art workshop","your driving school","the new aqua park","your yoga classes","the sea trip"];
window.objInit = el => { el.innerHTML = `Ask the question on this card about: <b>${OBJECTS[Math.floor(Math.random()*OBJECTS.length)]}</b> <button class="btn" onclick="objInit(this.parentNode)">Another place</button>`; };
window.miniInit = el => { clearTimers(); el.innerHTML = `<span class="mini-ring">${ringHTML(64,"mr")}<span>Ask the question aloud before time runs out, then flip the card.</span></span>`; beep(); countdown($("#mr"),20,()=>beep(520,.5)); };
function keys(){
  deck(KEYS.slice(), k=>`<div class="label">Key word</div><div class="big">${k[0]}</div><div class="sub">${k[1]}</div>`,
    k=>`<div class="label">${k[0]}</div><div class="qs">${k[2].map(q=>`<div>${q}</div>`).join("")}</div>`,
    acc("Say it aloud", [
      ["20 seconds", `<div data-init="miniInit"></div>`],
      ["Place from the advert", `<div data-init="objInit"></div>`],
      ["Another start", "Ask the same question another way: <b>Do you…?</b> · <b>Is there / Are there…?</b> · <b>Can I…?</b> · <b>What / How…?</b>"],
      ["Intonation", "General question (<b>Do you…? Is there…?</b>): voice ↗ up.<br>Special question (<b>What…? Where…? How much…?</b>): voice ↘ down."]
    ]));
}

/* ---------- Order ---------- */
function order(){
  let items=shuffle(ORDER), page=0, score=0, done=0;
  const words = q => q.replace(/\?$/,"").split(" ");
  function render(){
    if(page*3>=items.length) return finish();
    const set=items.slice(page*3,page*3+3);
    view.innerHTML=`<div class="hunt"><div class="hunt-top"><span class="score">Correct: <b>${score}</b> of ${done}</span><span class="label">Questions ${page*3+1}–${page*3+set.length} of ${items.length}</span><span style="flex:1"></span><button class="btn pri" id="nxt" disabled>Next 3</button></div>
    <div class="olist">${set.map((it,k)=>`<div class="oc" id="oc${k}"><div class="in"><div class="face front"><div class="bank" id="bk${k}"></div><div class="line" id="ln${k}"></div><div class="ctl"><button class="btn pri" id="ck${k}">Check</button><button class="btn" id="rs${k}">Reset</button>${it[1]?`<span class="label">one word is extra</span>`:""}</div></div><div class="face back" id="bb${k}"></div></div></div>`).join("")}</div></div>`;
    let checked=0;
    set.forEach((it,k)=>{
      const tiles=shuffle(words(it[0]).concat(it[1]?[it[1]]:[])).map((w,j)=>({w,j}));
      const bk=$("#bk"+k), ln=$("#ln"+k);
      const draw=()=>{};
      tiles.forEach(t=>{ const b=document.createElement("button"); b.className="chip"; b.textContent=t.w; b.onclick=()=>{ (b.parentNode===bk?ln:bk).appendChild(b); }; bk.appendChild(b); });
      $("#rs"+k).onclick=()=>[...ln.children].forEach(c=>bk.appendChild(c));
      $("#ck"+k).onclick=()=>{
        const built=[...ln.children].map(c=>c.textContent).join(" ")+"?";
        const ok=built===it[0]; done++; if(ok) score++; checked++;
        $("#bb"+k).innerHTML=`<div class="verdict ${ok?"g":"b"}">${ok?"Correct":"Wrong"}</div>${ok?"":`<div class="yours">Your answer: ${esc(built==="?"?"—":built)}</div>`}<div class="ans">${esc(it[0])}</div>${it[1]?`<div class="yours">Extra word: <b>${esc(it[1])}</b></div>`:""}`;
        $("#bb"+k).classList.add(ok?"hit":"miss"); $("#oc"+k).classList.add("on");
        if(!ok) misses.push([built,it[0]]);
        view.querySelector(".score").innerHTML=`Correct: <b>${score}</b> of ${done}`;
        if(checked===set.length) $("#nxt").disabled=false;
      };
    });
    $("#nxt").onclick=()=>{page++;render();};
  }
  const misses=[];
  function finish(){
    view.innerHTML=`<div class="fin"><div class="label">Result</div><div class="big">${score} of ${items.length}</div>${misses.length?`<div class="errs">${misses.map(m=>`<div><s>${esc(m[0])}</s> → <b>${esc(m[1])}</b></div>`).join("")}</div>`:"<div>No mistakes.</div>"}<button class="btn pri" id="again">Again</button></div>`;
    $("#again").onclick=order;
  }
  render();
}

/* ---------- Match ---------- */
function match(){
  const rounds=[]; const all=shuffle(PAIRS); for(let i=0;i<all.length;i+=4) rounds.push(all.slice(i,i+4));
  let r=0, errors=0, errList=[];
  function render(){
    if(r>=rounds.length){
      view.innerHTML=`<div class="fin"><div class="label">All pairs found</div><div class="big">Mistakes: ${errors}</div>${errList.length?`<div class="errs">${errList.map(e=>`<div><b>${esc(e[0])}</b> — ${esc(e[1])}</div>`).join("")}</div>`:""}<button class="btn pri" id="again">Play again</button></div>`;
      $("#again").onclick=match; return;
    }
    const set=rounds[r];
    view.innerHTML=`<div class="match"><div class="hunt-top"><span class="label">Round ${r+1} of ${rounds.length}</span><span class="dots">${rounds.map((_,k)=>`<i class="${k<=r?"on":""}"></i>`).join("")}</span><span class="score">Mistakes: <b>${errors}</b></span></div>
    <div class="mcols"><div class="mcol" id="L">${set.map((p,k)=>`<button class="mi" data-k="${k}">${esc(p[0])}</button>`).join("")}</div><div class="mcol" id="R">${shuffle(set.map((p,k)=>[p[1],k])).map(p=>`<button class="mi" data-k="${p[1]}">${esc(p[0])}</button>`).join("")}</div></div></div>`;
    let selL=null, found=0;
    view.querySelectorAll("#L .mi").forEach(b=>b.onclick=()=>{ if(b.classList.contains("done"))return; view.querySelectorAll("#L .mi").forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); selL=b; });
    view.querySelectorAll("#R .mi").forEach(b=>b.onclick=()=>{
      if(b.classList.contains("done")||!selL) return;
      if(b.dataset.k===selL.dataset.k){ b.classList.add("done"); selL.classList.add("done"); selL.classList.remove("sel"); selL=null; found++;
        if(found===set.length){ const t=setTimeout(()=>{r++;render();},700); timers.push(t);} }
      else { errors++; errList.push(set[+selL.dataset.k]); b.classList.remove("err"); void b.offsetWidth; b.classList.add("err"); view.querySelector(".score").innerHTML=`Mistakes: <b>${errors}</b>`; }
    });
  }
  render();
}

/* ---------- Hunt ---------- */
function hunt(){
  let items=shuffle(HUNT), page=0, score=0, done=0; const misses=[];
  function render(){
    if(page*4>=items.length){
      view.innerHTML=`<div class="fin"><div class="label">Your marking</div><div class="big">${score} of ${items.length}</div>${misses.length?`<div class="errs">${misses.map(m=>`<div>${esc(m[1])} — ${m[2]?"counts":"0 points"}. ${esc(m[3])} <b>${esc(m[4])}</b></div>`).join("")}</div>`:"<div>All your decisions were right.</div>"}<button class="btn pri" id="again">Again</button></div>`;
      $("#again").onclick=hunt; return;
    }
    const set=items.slice(page*4,page*4+4); let answered=0;
    view.innerHTML=`<div class="hunt"><div class="hunt-top"><span class="score">Right decisions: <b>${score}</b> of ${done}</span><span class="label">${page*4+1}–${page*4+set.length} of ${items.length}</span><span style="flex:1"></span><button class="btn pri" id="nxt" disabled>Next 4</button></div>
    <div class="grid4">${set.map((h,k)=>`<div class="hc" id="hc${k}"><div class="in"><div class="face front"><div class="ctx">${esc(h[0])}</div><div class="q">${esc(h[1])}</div><div class="row"><button class="btn good" data-k="${k}" data-v="1">1 point</button><button class="btn bad" data-k="${k}" data-v="0">0 points</button></div></div><div class="face back" id="hb${k}"></div></div></div>`).join("")}</div></div>`;
    view.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>{
      const k=+b.dataset.k, h=set[k], ok=(+b.dataset.v)===h[2]; done++; if(ok) score++; else misses.push(h); answered++;
      $("#hb"+k).innerHTML=`<div class="verdict ${h[2]?"g":"b"}">${h[2]?"1 point":"0 points"}</div><div class="why">${esc(h[3])}</div><div class="fix">${esc(h[4])}</div><div class="label">${ok?"you marked it right":"you marked it wrong"}</div>`;
      $("#hb"+k).classList.add(ok?"hit":"miss"); $("#hc"+k).classList.add("on");
      view.querySelector(".score").innerHTML=`Right decisions: <b>${score}</b> of ${done}`;
      if(answered===set.length) $("#nxt").disabled=false;
    });
    $("#nxt").onclick=()=>{page++;render();};
  }
  render();
}

/* ---------- Bomb ---------- */
function bombPool(){
  const pool=[];
  for(const key of ["fipi","sb"]) BANKS[key].items.forEach((v,n)=>v[2].forEach((p,j)=>pool.push({slogan:v[0],sit:v[1],kw:p,model:v[3][j],bank:key,n:n+1})));
  return pool;
}
function bomb(){
  const items=shuffle(bombPool()).slice(0,12); let i=0, score=0; const log=[];
  view.innerHTML=`<div class="bomb"><div class="bcard" id="bc"></div><div class="panel"><div class="hunt-top" style="margin-bottom:6px"><span class="score">Counted: <b id="bs">0</b> of 12</span></div><div class="log" id="lg"></div></div></div>`;
  function draw(){
    clearTimers();
    if(i>=items.length){ $("#bc").innerHTML=`<div class="label">Round over</div><div class="kw">${score} of 12</div><button class="btn pri" id="again">New round</button>`; $("#again").onclick=bomb; return; }
    const it=items[i];
    $("#bc").innerHTML=`<div class="label">Question ${i+1} of 12 · you are considering ${esc(it.sit)}</div><div class="obj">Advert: <b>${esc(it.slogan||"—")}</b></div><div class="kw">${esc(it.kw)}</div><div class="fuse"><i id="fz"></i></div><div class="model" id="md"></div><div class="nav"><button class="btn time" id="go">Light the fuse · 15 s</button><button class="btn good" id="yes" disabled>Counts</button><button class="btn bad" id="no" disabled>Doesn't count</button><button class="btn" id="nx" hidden>Next</button></div>`;
    $("#go").onclick=()=>{ $("#go").disabled=true; $("#yes").disabled=false; $("#no").disabled=false; beep(); const t0=performance.now();
      const id=setInterval(()=>{ const left=Math.max(0,15-(performance.now()-t0)/1000); $("#fz").style.width=(left/15*100)+"%"; if(left<=0){ clearInterval(id); explode(); } },100); timers.push(id); };
    const finishQ=ok=>{ clearTimers(); if(ok){score++;} log.push([ok,it.kw,it.model]); $("#bs").textContent=score;
      $("#md").textContent=it.model; $("#yes").disabled=true; $("#no").disabled=true; $("#go").hidden=true; $("#nx").hidden=false;
      $("#lg").innerHTML=log.map(l=>`<div><span class="m ${l[0]?"g":"b"}">${l[0]?"✓":"✕"}</span><span><b>${esc(l[1])}</b> — ${esc(l[2])}</span></div>`).join(""); };
    const explode=()=>{ beep(160,.7); const c=$("#bc"); c.classList.remove("boom"); void c.offsetWidth; c.classList.add("boom"); const t=document.createElement("div"); t.className="boomtxt"; t.textContent="BOOM!"; c.appendChild(t); finishQ(false); };
    $("#yes").onclick=()=>finishQ(true); $("#no").onclick=()=>finishQ(false);
    $("#nx").onclick=()=>{i++;draw();};
  }
  draw();
}

/* ---------- Exam ---------- */
let exState={bank:"fipi", n:1};
function exam(){
  clearTimers();
  const B=BANKS[exState.bank], v=B.items[exState.n-1];
  const opts=B.items.map((x,k)=>`<option value="${k+1}" ${k+1===exState.n?"selected":""}>Task ${k+1}</option>`).join("");
  view.innerHTML=`<div class="exam"><div class="ad"><div class="tsk"><b>2</b>Task 2. Study the advertisement.</div>${v[0]?`<div class="slogan">${esc(v[0])}</div>`:""}<img src="${B.img(exState.n)}" alt="Advert picture, task ${exState.n}"></div>
  <div class="ex-right">
    <div class="pick"><div class="seg"><button aria-pressed="${exState.bank==="fipi"}" data-b="fipi">FIPI 2027</button><button aria-pressed="${exState.bank==="sb"}" data-b="sb">Collection</button></div>
      <button class="arrow" id="vp" aria-label="Previous task">‹</button><select id="vs" aria-label="Task">${opts}</select><button class="arrow" id="vn" aria-label="Next task">›</button><button class="btn" id="rnd">Random</button></div>
    <div class="sit">You are considering ${esc(v[1])} and now you'd like to get more information. In 1.5 minutes you are to ask <b>four direct questions</b> to find out about the following:</div>
    <div class="pts">${v[2].map((p,k)=>`<div class="pt" id="pt${k}"><div class="in"><div class="face front"><span class="k">${k+1})</span><span class="w">${esc(p)}</span></div><div class="face back"><span class="k">${k+1}) ${esc(p)}</span><span class="w">${esc(v[3][k])}</span><div class="sc"><button class="y" data-s="${k}" data-v="1" aria-pressed="false">1</button><button class="n" data-s="${k}" data-v="0" aria-pressed="false">0</button></div></div></div></div>`).join("")}</div>
    <div class="run">${ringHTML(62,"er")}<div class="st" id="st">You have 20 seconds to ask each question.</div><button class="btn time" id="start">Start</button><button class="btn" id="skip" hidden>Skip</button><button class="btn pri" id="ans">Model answers</button></div>
  </div></div>`;
  view.querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{ exState={bank:b.dataset.b,n:1}; exam(); });
  $("#vs").onchange=e=>{ exState.n=+e.target.value; exam(); };
  $("#vp").onclick=()=>{ exState.n=exState.n>1?exState.n-1:B.items.length; exam(); };
  $("#vn").onclick=()=>{ exState.n=exState.n<B.items.length?exState.n+1:1; exam(); };
  $("#rnd").onclick=()=>{ exState.n=1+Math.floor(Math.random()*B.items.length); exam(); };
  const scores=[null,null,null,null];
  view.querySelectorAll("[data-s]").forEach(b=>b.onclick=e=>{ e.stopPropagation(); const k=+b.dataset.s; scores[k]=+b.dataset.v;
    b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed", x===b)); total(); });
  const total=()=>{ const s=scores.filter(x=>x!==null); if(s.length) $("#st").innerHTML=`Score: <b>${s.reduce((a,b)=>a+b,0)} of 4</b>${s.length<4?` (${s.length} marked)`:""}`; };
  view.querySelectorAll(".pt").forEach(p=>p.onclick=()=>p.classList.toggle("on"));
  let showing=false;
  $("#ans").onclick=()=>{ showing=!showing; view.querySelectorAll(".pt").forEach(p=>p.classList.toggle("on",showing)); $("#ans").textContent=showing?"Hide answers":"Model answers"; };
  let phase=-1;
  const ring=$("#er"), st=$("#st");
  setRing(ring,20,20); ring.querySelector(".num").textContent="20";
  function step(){
    clearTimers();
    view.querySelectorAll(".pt").forEach((p,k)=>{p.classList.toggle("now",k===phase); p.classList.toggle("past",k<phase);});
    if(phase<0){ st.innerHTML=`<b>Preparation.</b> Study the advert and the points.`; countdown(ring,90,()=>{phase=0;step();}); return; }
    if(phase>3){ st.innerHTML=`<b>Time is up.</b> Open the model answers and mark each question.`; $("#skip").hidden=true; $("#start").hidden=false; $("#start").textContent="Again"; beep(520,.6); return; }
    beep(); st.innerHTML=`<b>Question ${phase+1}:</b> ${esc(v[2][phase])}`;
    countdown(ring,20,()=>{phase++;step();});
  }
  $("#start").onclick=()=>{ phase=-1; $("#start").hidden=true; $("#skip").hidden=false; step(); };
  $("#skip").onclick=()=>{ if(phase<=3){ phase++; step(); } };
}
