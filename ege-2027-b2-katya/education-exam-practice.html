const config={"id":"katya-ege:education-skills-2026-11","title":"Education · Exam Practice","label":"Катя · Education · Exam Practice","url":"https://lzxcmrlubhjfdhtqvqzt.supabase.co","key":"sb_publishable_PmyZRwzWne8lqprej4XJQA_XiujtjEI"};
const sections=[{"title":"Listening · Tasks 3–9","audio":"https://altatiana7.github.io/Tatyana-English-Hub/katerina-ege-2027/audio/listening-variant-4.mp3","note":"In the recording, skip to the interview about learning languages after Task 2.","items":[["3. What do we learn about the presenter at the beginning of the radio show?",["She runs the show every afternoon.","She has over ten years of experience.","She has learnt English with the ETL Co."]],["4. How old was the speaker when he started learning languages?",["2","6","19"]],["5. The speaker believes that learning French helped him to...",["develop in a positive way.","keep engaged with friends.","miss out on travel experience."]],["6. Before getting into teaching, the speaker worked as a...",["lawyer.","tour guide.","jazz musician."]],["7. According to the speaker, what prevents people from moving to another country?",["Age.","Desires.","Responsibilities."]],["8. What does the speaker NOT mention as a benefit of teaching online?",["Good salary.","Career opportunities.","Flexible working hours."]],["9. What would the speaker do differently if he could?",["Go to another country.","Invest into a community.","Start his own business."]]]},{"title":"Reading · Attendance requirements","text":["Studying at university can be very different from school, sixth form or college. Your term time will be different, as will your classes. Whether attendance is mandatory or not will also vary. Your classes will be divided into lectures and seminars. You will also have study sessions and inductions each year. Failure to attend mandatory sessions could have implications on your progression towards your degree, so it is important to understand what is mandatory and what is not.","Most universities do care about attendance. Universities generally associate good attendance with good academic performance, and therefore strongly encourage students to attend all of their seminars and lectures. Many universities will have an attendance threshold which students must reach. Likewise, module tutors may use a register to log and monitor the attendance of students for each seminar and lecture.","The real world has attendance requirements, too. If you don’t meet those expectations, you will get penalized. Jobs, for example, have required attendance. If you skip a day of work because you’re not up to it, you will probably face consequences. You have to be actively present to achieve your career goals, you can’t coast through your career like you may in college. College prepares you for the real world, so class attendance benefits your education and your future. That’s why many people think class attendance should be mandatory – to ensure students are engaged in their academic studies.","But, even without required attendance, it is your job to show up. Tests often reflect lectures, so being in class can help you more easily answer test questions. Most classes use participation to discuss topics in class, which goes beyond just needing to know it for tests. Attendance also makes it easier to work with fellow students and professors, so as to better understand the topics.","Active participation is not just for jobs and school. It can help you in life as well. Attending class would help emphasize that people need to be active in their role in society. This includes participating in things like elections, community service, and volunteering.","Most notably, we must pay for the classes we take, so missing a class means we hurt ourselves by wasting money, time, and educational opportunities. Not everyone gets to attend a uni, so why not take advantage of this opportunity?","On the other hand, if attendance is not required, you can choose whether or not to get out of bed in the morning and make your way to class. I must admit that there are days I may really want to choose not to go to class. But it is required, so","I feel as though I have no choice at all. Maybe I feel a cold coming on but can’t make it to a doctor for a sick note, or I had to work extra late at my part-time job the night before. Most frequently I need some extra time to catch up on the overwhelming amount of homework I have been assigned in all of my classes.","Regardless of the reason, the choice should be mine. I understand that going to class is beneficial in many ways. But burnout is real. Many full-time students work just to make ends meet, and you can’t always predict illnesses well enough to get a university approved absence.","The requirement to attend classes can negatively affect grades and cause a great deal of stress for students that are under enough stress already. Many students who are not able to attend every single class still deserve a decent grade, and they work very hard to maintain one. We are adults. We are choosing to further our education. Therefore, we should also be given the choice to attend class or not – without it being detrimental to our grades."],"items":[["12. According to the text, attendance at university …",["is similar to that in college or school.","can greatly influence your final result.","depends mainly on your preferences.","is not obligatory for the majority of universities."]],["13. Which is NOT mentioned about university attendance in the text?",["Attendance is considered to be connected with achievement.","Teachers use a special document to mark students’ attendance.","Failure to attend all lectures may result in dropping out of school.","There is usually a minimum number of classes students must attend."]],["14. The verb coast through in “you can’t coast through your career” (paragraph 3) is closest in meaning to …",["succeeding without much effort.","working hard.","planning your next steps.","making a choice."]],["15. According to the text, many people think that class attendance is a must because…",["students get used to the requirements of adult life.","higher education is rather expensive.","it is what employers often check.","one is punished for missing classes."]],["16. It is implied that attending classes helps you …",["get answers to tests beforehand.","pay your education fee faster.","become more involved in the community.","learn about volunteer opportunities."]],["17. The author needs to skip classes most often because he …",["dislikes studying in the mornings.","has some health problems.","combines work and studies.","has to finish his other academic tasks."]],["18. What is the author’s overall attitude to attendance requirements?",["Absence should be approved by university or by responsible adults.","It is up to students to decide whether they must attend each class.","Serious cases like illnesses shouldn’t influence your attendance grade.","Attendance requirements have more positive than negative consequences."]]]},{"title":"Word formation · Auckland University","note":"Complete each gap with a word formed from the word in capitals.","items":[["25. The University of Auckland is New Zealand’s leading university. ___, it’s among the top 200 universities of the world. (ACTUAL)"],["26. The University of Auckland has a strong focus on legal and ___ programmes welcoming students from all parts of the world. (BUSY)"],["27. The student ___ of the University of Auckland is 40,000, about 4,000 of whom have come to study from abroad. (POPULATE)"],["28. The University of Auckland also offers postgraduate studies, which will certainly broaden your academic and ___ horizons. (EMPLOY)"],["29. It will be ___ for your CV with specialist skills and knowledge provided. (VALUE)"]]},{"title":"Word formation · Libraries and education","note":"Complete each gap with a word formed from the word in capitals.","items":[["25. Public libraries play an important role in supporting education and literacy. They provide ___ valuable resources to their visitors. (COUNT)"],["26. Modern libraries contain a lot of ___ materials, scientific publications, newspapers and magazines which may not be available anywhere else. (EDUCATION)"],["27. They are ___ important for school and university students. (REAL)"],["28. Libraries encourage them to become more ___ readers. (ACT)"],["29. They also allow students to explore literature outside of their curriculum, thus expanding their knowledge. Many students also use their school or university library as a reading room, though prior ___ will probably have to be asked to bring external books into the library. (PERMIT)"]]},{"title":"Vocabulary · At the library","note":"Choose one option for each gap (30–36).","text":["It was early morning. Jason stood in the library at Norwood House, [30] _____ up at the painting above the fireplace. What an extraordinary portrait it was, of a handsome man in the prime of his life. The great Horace Winton. His grandfather. His mother, Horace’s eldest daughter, Laura, had always [31] _____ him that he would grow up to look like her father. She had been proved right.","This painting had been finished just a short time before Horace’s fortieth birthday, and in a few days’ time, he himself would be forty years old. And he was the spitting [32] _____ of his grandfather; six foot four, broad of chest, with red-gold hair and blue eyes. He knew that if Horas Winton could step out of the portrait, come to stand next to him, they would look like twins, so close was their [33] _____.","Jason Casey finally turned away and walked out onto the terrace, headed through the hanging gardens, making for the ruined stronghold. His mother had constantly taken him there as a child, explaining that it had been her father’s favourite spot at Norwood, and [34] _____ hers. She had [35] _____ him up on Winton lore, and most of it had been about his grandfather. Jason knew so much about his grandfather and [36] _____ never meeting him in person."],"items":[["30",["seeing","watching","blinking","staring"]],["31",["said","told","talked","spoke"]],["32",["replica","image","twin","double"]],["33",["resemblance","reproduction","recollection","responsibility"]],["34",["however","moreover","although","therefore"]],["35",["raised","grown","brought","risen"]],["36",["regretted","revealed","remained","registered"]]]},{"title":"Vocabulary · At the lecture","note":"Choose one option for each gap (30–36).","text":["The opening lecture in Grand Hall was on the subject of British Literature. It was delivered by Professor Carlson. During the summer holidays, Emily and Peter had read all the authors on the assigned list. The list [30] _____ of 20 thick books. So, by the time they took their places in the lecture hall that Tuesday morning, they both felt [31] _____ that they were well prepared. Within moments of Professor Carlson starting his lecture, they both realized that they had done little more than read the texts. They had not [32] _____ the different influences on the authors that birth, upbringing, education, religion and mere circumstance had brought to their work, not given any thought to the fact that the gift of storytelling was not bestowed on any particular class, colour or creed.","Professor Carlson continued his speech. Peter looked [33] _____ from his notes and saw the back of his head. He felt sick. He stopped listening to Professor Carlson’s views on Byron and continued to stare for some time before the student turned and began [34] _____ to his neighbour. Peter’s worst fears were [35] _____.","It was Conrad. He was at the same university. [36] _____, he was taking the same course. Peter waited until Conrad had left the lecture theatre before he collected up his books and rose from his place. Emily followed him quickly."],"items":[["30",["consisted","included","contained","involved"]],["31",["competent","confident","excellent","efficient"]],["32",["reasoned","reflected","considered","expected"]],["33",["down","up","beside","across"]],["34",["talking","telling","looking","saying"]],["35",["convinced","ensured","approved","confirmed"]],["36",["However","Although","Otherwise","Moreover"]]]}];
const id=config.id, headers={apikey:config.key,Authorization:'Bearer '+config.key,'Content-Type':'application/json'};
const form=document.querySelector('form'), nav=document.querySelector('nav'), title=document.querySelector('h1'), note=document.querySelector('#note'), passage=document.querySelector('#passage'), prompts=document.querySelector('#prompts'), status=document.querySelector('#status'), audio=document.querySelector('audio');
let state={answers:{},current:0}, busy=false, remoteReady=false;
try{state=JSON.parse(localStorage.getItem(id))||state}catch{}
function save(){try{localStorage.setItem(id,JSON.stringify(state))}catch{}}
function node(tag,text){const el=document.createElement(tag);el.textContent=text;return el}
function request(method,body){return fetch(config.url+'/rest/v1/rpc/'+method,{method:'POST',headers,body:JSON.stringify(body)})}
async function send(){
 if(busy||state.sent||!state.pending)return;
 busy=true;render();
 try{
  const check=await request('get_arina_done',{});
  const sent=check.ok&&(await check.json()).some(row=>row.test_id===id);
  if(!sent){
   const response=await request('submit_arina_homework',{p_test_id:id,p_test_title:config.label,p_score:0,p_max_score:1,p_answers:{responses:Object.fromEntries(Object.entries(state.answers).map(([key,value])=>{const [i,j]=key.split('-').map(Number);return [sections[i].title+' · '+sections[i].items[j][0],value]})),type:'teacher-review'},p_details:[]});
   if(!response.ok)throw Error('Send failed');
  }
  state.sent=true;state.pending=false;save();
 }catch{status.textContent='Saved on this device. Sending failed. Try again.'}
 finally{busy=false;render()}
}
function go(i){audio.pause();state.current=i;save();render();title.focus()}
function render(){
 const i=state.current, section=sections[i], locked=state.sent||state.pending;
 nav.querySelectorAll('button').forEach((el,j)=>el.setAttribute('aria-current',j===i?'step':'false'));
 title.textContent=section?.title||'Review and send';note.textContent=section?.note||'Open any section to review your answers before sending.';
 if(section?.audio!==audio.getAttribute('src')){if(section?.audio)audio.src=section.audio;else{audio.removeAttribute('src');audio.load()}}
 audio.hidden=!section?.audio;passage.replaceChildren();prompts.replaceChildren();
 passage.hidden=!(section?.text||section?.choices);
 section?.text?.forEach(text=>passage.append(node('p',text)));
 section?.choices?.forEach((text,k)=>passage.append(node('p',(k+1)+'. '+text)));
 if(section){section.items.forEach(([q,options],j)=>{
  const field=node('label',q), control=document.createElement(options?'select':'input'), key=i+'-'+j;
  if(options){control.add(new Option('Choose an answer',''));options.forEach(o=>control.add(new Option(o,o)))}
  else{control.autocomplete='off';control.spellcheck=false}
  control.value=state.answers[key]||'';control.disabled=locked;
  control.addEventListener('input',()=>{if(control.value.trim())state.answers[key]=control.value;else delete state.answers[key];save()});
  field.append(control);prompts.append(field);
 })}else{
  sections.forEach((s,j)=>{
   const count=s.items.filter((_,k)=>state.answers[j+'-'+k]).length;
   prompts.append(node('p',s.title+' · '+count+' / '+s.items.length+' answered'));
  });
  if(!state.sent){const submit=node('button',state.pending?'Retry sending':'Send to your teacher');submit.disabled=busy||(!state.pending&&!remoteReady);prompts.append(submit)}
 }
 document.querySelector('#back').disabled=i===0;
 document.querySelector('#next').disabled=i===sections.length;
 status.textContent=state.sent?'Sent to your teacher.':busy?'Sending…':state.pending?'Saved on this device. Retry sending to finish.':'';
}
sections.concat({title:'Review and send'}).forEach((s,i)=>{const button=node('button',s.title);button.type='button';button.onclick=()=>go(i);nav.append(button)});
document.querySelector('#back').onclick=()=>go(state.current-1);
document.querySelector('#next').onclick=()=>go(state.current+1);
form.onsubmit=e=>{
 e.preventDefault();
 if(state.sent||busy)return;
 if(!state.pending){
  const answered=Object.keys(state.answers).length,total=sections.reduce((n,s)=>n+s.items.length,0);
  if(answered===0){status.textContent='Answer at least one question before sending.';return}
  if(!confirm('Send '+answered+' of '+total+' answers? You cannot edit them afterwards.'))return;
  state.pending=true;save();
 }
 send();
};
async function sync(){
 if(state.pending){send();return}
 if(!state.sent)try{const r=await request('get_arina_done',{});if(r.ok){state.sent=(await r.json()).some(row=>row.test_id===id);save()}}catch{}
 remoteReady=true;render();
}
window.addEventListener('online',sync);render();sync();
</script></body></html>
