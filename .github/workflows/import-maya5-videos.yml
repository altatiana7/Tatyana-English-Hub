name: Import Maya EF5 videos

on:
  push:
    paths:
      - ".github/workflows/import-maya5-videos.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download Maya 5th edition videos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p maya-course/media
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://sdmntprnortheu.oaiusercontent.com/files/00000000-c814-81f4-8151-843ad44a244d/raw?se=2026-10-04T05%3A09%3A48Z&sp=r&sv=2026-02-06&sr=b&scid=d9e3b63d-ad61-5ff4-b0a8-67de0b748dcf&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T17%3A59%3A36Z&ske=2026-10-04T17%3A59%3A36Z&sks=b&skv=2026-02-06&sig=Oru5Z18BYJvg53bQr89tYmAsMCXfPLEuUeKO0AfGOPw%3D" \
            -o maya-course/media/ef5e-preint-pe1-recap.mp4
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-b558-8210-95fd-7455c1e090fa/raw?se=2026-10-04T05%3A09%3A47Z&sp=r&sv=2026-02-06&sr=b&scid=00aabca8-58bb-5e7d-9fe7-f3469d67d993&skoid=56822d8b-6cfd-42ed-a00d-1452dca42036&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-03T18%3A49%3A37Z&ske=2026-10-04T18%3A49%3A37Z&sks=b&skv=2026-02-06&sig=Yq8v4pbQwh7HVmzgLKesZJLoTjPPrRCObr9KoGRJFuc%3D" \
            -o maya-course/media/ef5e-preint-pe1-main.mp4
          ls -lh maya-course/media/ef5e-preint-pe1-*.mp4
      - name: Commit videos
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add maya-course/media/ef5e-preint-pe1-recap.mp4 maya-course/media/ef5e-preint-pe1-main.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Add Maya English File 5th edition PE1 videos"
          git push
