name: Assemble exact Katya cover

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble exact Katya cover
        shell: bash
        run: |
          set -euo pipefail
          DIR="w-4n8q7m2p9x6k3r5t/exact-cover"
          cat "$DIR"/0*.b64 > "$DIR/cover.b64"
          base64 --decode "$DIR/cover.b64" > "w-4n8q7m2p9x6k3r5t/katya-cover-exact.webp"
          rm "$DIR/cover.b64"
          file "w-4n8q7m2p9x6k3r5t/katya-cover-exact.webp"
          test -s "w-4n8q7m2p9x6k3r5t/katya-cover-exact.webp"

      - name: Commit cover
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "w-4n8q7m2p9x6k3r5t/katya-cover-exact.webp"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build exact Katya cover"
          git push
