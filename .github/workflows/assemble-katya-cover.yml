name: Assemble Katya cover
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-cover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble local cover image
        shell: bash
        run: |
          set -euo pipefail
          DIR="w-4n8q7m2p9x6k3r5t/assets"
          cat "$DIR/cover.part1" "$DIR/cover.part2" "$DIR/cover.part3" "$DIR/cover.part4" > "$DIR/cover.b64"
          base64 --decode "$DIR/cover.b64" > "$DIR/cover.webp"
          rm "$DIR/cover.b64"

      - name: Point homepage to local cover
        shell: python
        run: |
          from pathlib import Path
          p = Path("w-4n8q7m2p9x6k3r5t/index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              "https://wise.com/imaginary-v2/03e3aa97e37b0630b686ee2abe01c55d.jpg?width=1600",
              "./assets/cover.webp"
          )
          p.write_text(s, encoding="utf-8")

      - name: Commit assembled cover
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "w-4n8q7m2p9x6k3r5t/assets/cover.webp" "w-4n8q7m2p9x6k3r5t/index.html"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Build local Katya teacher hub cover"
          git push
