name: One-time Nikita modules label

on:
  push:
    paths:
      - '.github/workflows/nikita-modules-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Modules heading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('nikita-course/index.html')
          s = p.read_text(encoding='utf-8')
          old = '  <button class="homebtn" onclick="showCourseHome()">⌂ Course Cover</button>\n  <div id="moduleMenu"></div>'
          new = '  <button class="homebtn" onclick="showCourseHome()">⌂ Course Cover</button>\n  <div class="modulesHeading" style="font-size:14px;font-weight:900;color:#f0c98f;letter-spacing:.06em;margin:2px 10px 8px;">Модули</div>\n  <div id="moduleMenu"></div>'
          if 'class="modulesHeading"' not in s:
              if old not in s:
                  raise SystemExit('Target sidebar block not found')
              s = s.replace(old, new, 1)
          home_old = 'body.courseHomeMode #moduleMenu{height:100%;display:flex;flex-direction:column;gap:clamp(3px,.55vh,7px)}'
          home_new = 'body.courseHomeMode .modulesHeading{height:clamp(18px,2.6vh,30px);margin:0 0 clamp(3px,.55vh,7px)!important;display:flex;align-items:center;justify-content:center;font-size:clamp(9px,.9vw,14px)!important;color:#f0c98f!important}\\nbody.courseHomeMode #moduleMenu{height:calc(100% - clamp(22px,3.2vh,37px));display:flex;flex-direction:column;gap:clamp(3px,.55vh,7px)}'
          if home_old in s:
              s = s.replace(home_old, home_new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit site change and remove one-time workflow
        run: |
          rm .github/workflows/nikita-modules-label.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nikita-course/index.html .github/workflows/nikita-modules-label.yml
          git commit -m "Add Modules heading to Nikita course"
          git push
