name: Nikita add Modules label

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/nikita-add-modules-label.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Modules label without touching lesson content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('nikita-course/index.html')
          s = path.read_text(encoding='utf-8')
          marker = 'nikita-modules-label-v1'
          if marker in s:
              print('Label script already present; no change needed.')
              raise SystemExit(0)

          patch = r'''
<script id="nikita-modules-label-v1">
(function(){
  function addModulesLabel(){
    if(document.getElementById('nikita-modules-heading')) return true;
    const vw = window.innerWidth || document.documentElement.clientWidth;
    const selectors = ['aside','nav','.sidebar','[class*="sidebar"]','[class*="side-bar"]','[class*="side_menu"]','[class*="sidemenu"]','[class*="menu"]','[class*="nav"]'];
    const seen = new Set();
    const candidates = [];
    selectors.forEach(sel => {
      document.querySelectorAll(sel).forEach(el => {
        if(seen.has(el)) return;
        seen.add(el);
        const r = el.getBoundingClientRect();
        const st = getComputedStyle(el);
        if(st.display === 'none' || st.visibility === 'hidden' || r.width < 90 || r.height < 120) return;
        if(r.left > vw * 0.34 || r.width > Math.min(460, vw * 0.42)) return;
        const clicks = [...el.querySelectorAll('a,button,[role="button"]')].filter(x => {
          const q=x.getBoundingClientRect();
          return q.width > 45 && q.height > 20 && getComputedStyle(x).display !== 'none';
        });
        if(clicks.length < 2) return;
        let score = clicks.length * 4 + Math.min(r.height,800)/100;
        const cls = String(el.className || '').toLowerCase();
        if(cls.includes('sidebar') || cls.includes('side-menu') || cls.includes('sidemenu')) score += 30;
        if(el.tagName === 'ASIDE') score += 20;
        if(r.height > r.width * 1.15) score += 10;
        candidates.push({el, clicks, score});
      });
    });
    candidates.sort((a,b)=>b.score-a.score);
    if(!candidates.length) return false;
    const {el, clicks} = candidates[0];
    const firstLesson = clicks.find(x => {
      const t=(x.textContent||'').trim().toLowerCase();
      return t && !/^(home|главная|назад|back|menu|меню|close|закрыть)$/i.test(t);
    }) || clicks[0];
    const heading = document.createElement('div');
    heading.id = 'nikita-modules-heading';
    heading.textContent = 'Модули';
    heading.setAttribute('aria-label','Модули');
    heading.style.cssText = 'font:800 15px/1.2 inherit;letter-spacing:.08em;text-transform:none;margin:8px 10px 7px;padding:0 2px;opacity:.88;';
    if(firstLesson && firstLesson.parentNode){
      firstLesson.parentNode.insertBefore(heading, firstLesson);
    }else{
      el.insertBefore(heading, el.firstChild);
    }
    return true;
  }
  let tries=0;
  function run(){
    tries++;
    if(addModulesLabel() || tries>20) return;
    setTimeout(run,250);
  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded',run,{once:true}); else run();
})();
</script>
'''
          m = list(re.finditer(r'</body\s*>', s, flags=re.I))
          if m:
              pos = m[-1].start()
              s = s[:pos] + patch + s[pos:]
          else:
              s += patch
          path.write_text(s, encoding='utf-8')
          print('Patched', path)
          PY

          if git diff --quiet -- nikita-course/index.html; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nikita-course/index.html
          git commit -m "Add Modules label to Nikita course sidebar"
          git push
