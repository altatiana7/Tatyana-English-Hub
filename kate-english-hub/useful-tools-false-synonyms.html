<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ложные синонимы · ЕГЭ</title>
<style>
:root{--p1:#667eea;--p2:#764ba2;--pink:#f5576c;--cyan:#20c6df;--ink:#253047;--muted:#708096;--line:#e1e7f0;--ok:#dff7e7;--bad:#ffe3e8}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(135deg,#667eea,#764ba2 55%,#f093fb)}
button{font:inherit;cursor:pointer}.shell{max-width:1120px;margin:0 auto;padding:18px}.top{color:#fff;text-align:center;margin-bottom:14px}.top h1{margin:0;font-size:32px}.top p{margin:5px 0 0;opacity:.9}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 14px 35px rgba(0,0,0,.14)}
.groupA{background:linear-gradient(135deg,#f093fb,#f5576c);color:#fff}.groupB{background:linear-gradient(135deg,#4facfe,#00cfe8);color:#fff}.group h2{margin:0 0 5px;font-size:25px}.group p{margin:0 0 10px;line-height:1.45}.group .count{display:inline-block;background:rgba(255,255,255,.2);padding:6px 10px;border-radius:999px;font-weight:800;font-size:12px}
.final{grid-column:1/-1;background:linear-gradient(135deg,#ffce45,#ff7e4f);color:#fff}.final h2{margin:0}.final p{margin:5px 0 0}.menu{display:none}.menu.on{display:block}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.toolbar button{border:0;border-radius:999px;padding:9px 13px;background:rgba(255,255,255,.25);color:#fff;font-weight:800}.title{color:#fff;font-weight:900;font-size:22px}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.mode{background:#fff;border:0;border-radius:18px;padding:18px;text-align:left;box-shadow:0 10px 25px rgba(0,0,0,.10)}.mode h3{margin:7px 0 5px;color:#5b4bb7}.mode p{margin:0;color:var(--muted);font-size:13px;line-height:1.4}.screen{display:none}.screen.on{display:block}.progress{height:8px;background:rgba(255,255,255,.3);border-radius:999px;overflow:hidden;margin:10px 0 16px}.progress>div{height:100%;background:#fff;transition:.3s}.flash{background:#fff;border-radius:24px;min-height:380px;display:grid;place-items:center;text-align:center;padding:30px;box-shadow:0 18px 40px rgba(0,0,0,.16)}.flash .word{font-size:54px;font-weight:900;color:#6845bd}.flash .ru{font-size:35px;font-weight:900;color:#6845bd}.flash .ex{margin-top:14px;background:#f7f4ff;border-radius:14px;padding:12px 16px;font-style:italic}.audio{border:0;background:linear-gradient(135deg,#7a5cff,#f05bc7);color:#fff;border-radius:999px;padding:10px 15px;font-weight:900;margin-top:13px}.nav{display:flex;justify-content:center;gap:8px;margin-top:12px}.nav button{border:0;border-radius:999px;padding:10px 16px;font-weight:800}.question{background:#fff;border-radius:22px;padding:22px;box-shadow:0 14px 35px rgba(0,0,0,.12)}.prompt{text-align:center;font-size:14px;color:var(--muted)}.qword{text-align:center;font-size:42px;font-weight:900;color:#6845bd;margin:7px 0 16px}.options{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opt{border:2px solid #e2e6ee;background:#fbfcfe;border-radius:14px;padding:12px;text-align:left;font-weight:700}.opt.correct{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#fff;border-color:transparent}.opt.wrong{background:linear-gradient(135deg,#f5576c,#fa709a);color:#fff;border-color:transparent}.feedback{margin-top:10px;padding:11px;border-radius:12px;background:#f7f4ff;font-size:13px}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.match-col{background:#fff;border-radius:18px;padding:14px}.match-col h3{text-align:center;margin:0 0 9px}.match-btn{width:100%;border:1px solid #dbe1ec;background:#f8fbfe;border-radius:11px;padding:9px;margin:4px 0;font-weight:700}.match-btn.sel{outline:3px solid #7a67df}.fill-sent{font-size:20px;line-height:1.5;text-align:center;margin:12px 0}.result{background:#fff;border-radius:24px;padding:26px;text-align:center}.result .big{font-size:54px;font-weight:900;color:#6845bd}.result button{border:0;border-radius:999px;padding:10px 15px;font-weight:900;margin:5px}.tiny{font-size:12px;color:var(--muted)}
@media(max-width:760px){.home-grid,.modes,.options,.match-grid{grid-template-columns:1fr}.flash{min-height:300px}.flash .word{font-size:40px}.shell{padding:12px}}
</style>
</head>
<body>
<div class="shell">
  <div id="home" class="screen on">
    <div class="top"><h1>Ложные синонимы</h1><p>Подготовка к ЕГЭ · 11 класс</p></div>
    <div class="home-grid">
      <button class="card group groupA" onclick="selectGroup('A')"><h2>Группа А</h2><p>attend, admit, accept, adapt, adopt, consider, pretend, prevent и др.</p><span class="count">34 слова</span></button>
      <button class="card group groupB" onclick="selectGroup('B')"><h2>Группа Б</h2><p>improve, impress, prepare, receive, resemble, resolve, remind, rely и др.</p><span class="count">43 слова</span></button>
      <button class="card final" onclick="startFinal()"><h2>Финальный тест</h2><p>20 вопросов из обеих групп вперемешку.</p></button>
    </div>
  </div>

  <div id="menu" class="screen">
    <div class="toolbar"><button onclick="goHome()">← На главную</button><div class="title" id="groupTitle"></div><div></div></div>
    <div class="modes">
      <button class="mode" onclick="startLearn()"><div>📝</div><h3>Изучение</h3><p>Карточки: слово, перевод и пример.</p></button>
      <button class="mode" onclick="startQuiz()"><div>🎯</div><h3>Тест</h3><p>Выбери правильный перевод.</p></button>
      <button class="mode" onclick="startMatch()"><div>🔗</div><h3>Сопоставление</h3><p>Соедини английское слово с переводом.</p></button>
      <button class="mode" onclick="startFill()"><div>✏️</div><h3>Вставь слово</h3><p>Выбери слово, которое подходит по смыслу.</p></button>
    </div>
  </div>

  <div id="learn" class="screen">
    <div class="toolbar"><button onclick="backMenu()">← Назад</button><div class="title" id="learnCount"></div><div></div></div>
    <div class="progress"><div id="learnProgress"></div></div>
    <div class="flash" id="flash" onclick="flipCard()"></div>
    <div class="nav"><button onclick="prevCard()">←</button><button onclick="nextCard()">→</button></div>
  </div>

  <div id="quiz" class="screen"><div class="toolbar"><button onclick="backMenu()">← Назад</button><div class="title" id="quizCount"></div><div></div></div><div class="progress"><div id="quizProgress"></div></div><div class="question" id="quizBox"></div></div>
  <div id="match" class="screen"><div class="toolbar"><button onclick="backMenu()">← Назад</button><div class="title">Сопоставление</div><div></div></div><div class="match-grid" id="matchGrid"></div></div>
  <div id="fill" class="screen"><div class="toolbar"><button onclick="backMenu()">← Назад</button><div class="title" id="fillCount"></div><div></div></div><div class="question" id="fillBox"></div></div>
  <div id="results" class="screen"><div class="result"><div class="big" id="resultScore"></div><p id="resultText"></p><button onclick="goHome()">На главную</button><button onclick="backMenu()">К группе</button></div></div>
</div>

<script>
const A=[{"en":"attend","ru":"посещать","ex":"I attend English classes every day."},{"en":"admit","ru":"признавать","ex":"He admitted his mistake."},{"en":"accept","ru":"принимать","ex":"She accepted the invitation."},{"en":"approve (of)","ru":"одобрять","ex":"My parents approve of my choice."},{"en":"amuse","ru":"развлекать, радовать","ex":"The clown amused the children."},{"en":"attract","ru":"привлекать","ex":"Bright colors attract attention."},{"en":"amaze","ru":"поражать","ex":"Your progress amazes me."},{"en":"appeal (to)","ru":"привлекать, нравиться","ex":"This idea appeals to me."},{"en":"wonder","ru":"удивляться","ex":"I wonder why he is late."},{"en":"wander","ru":"бродить","ex":"We wandered around the city."},{"en":"warn","ru":"предупреждать","ex":"I warned you about the test."},{"en":"waste","ru":"тратить впустую","ex":"Don't waste your time."},{"en":"adapt","ru":"адаптировать","ex":"You must adapt to new conditions."},{"en":"adopt","ru":"перенять, усыновлять","ex":"They adopted a new method."},{"en":"assume","ru":"предполагать","ex":"I assume you are right."},{"en":"agree (with)","ru":"соглашаться","ex":"I agree with your opinion."},{"en":"allow","ru":"позволять","ex":"My parents allow me to go out."},{"en":"consider","ru":"считать, рассматривать","ex":"I consider him a friend."},{"en":"confirm","ru":"подтверждать","ex":"Please confirm your reservation."},{"en":"convince","ru":"убеждать","ex":"She convinced me to try."},{"en":"concern (about)","ru":"обеспокоенный","ex":"I'm concerned about your health."},{"en":"confess","ru":"признаться","ex":"He confessed his love."},{"en":"pretend","ru":"делать вид","ex":"Don't pretend you don't know."},{"en":"prevent (from)","ru":"предотвратить","ex":"Rain prevented us from going."},{"en":"preserve","ru":"сохранить","ex":"We must preserve nature."},{"en":"predict","ru":"предсказывать","ex":"It's hard to predict the future."},{"en":"deceive","ru":"вводить в заблуждение","ex":"Appearances can deceive."},{"en":"develop","ru":"развивать","ex":"We develop new skills."},{"en":"defend","ru":"защищать","ex":"We must defend our country."},{"en":"demand (from)","ru":"требовать","ex":"The teacher demands effort from students."},{"en":"disappear","ru":"исчезнуть","ex":"The sun disappeared behind clouds."},{"en":"depart","ru":"уезжать","ex":"The train departs at 6."},{"en":"digress","ru":"отклоняться (от темы)","ex":"Let me digress for a moment."},{"en":"distract","ru":"отвлекать","ex":"Don't distract me while I study."}];
const B=[{"en":"improve","ru":"улучшать","ex":"I want to improve my English."},{"en":"impress","ru":"впечатлять","ex":"Your essay impressed the teacher."},{"en":"influence (on)","ru":"влияние на","ex":"Music has a great influence on me."},{"en":"interested (in)","ru":"заинтересованный","ex":"I'm interested in history."},{"en":"insist (on)","ru":"настаивать","ex":"She insisted on going alone."},{"en":"install","ru":"установить","ex":"We installed a new program."},{"en":"involve (in)","ru":"вовлекать","ex":"The project involves many people."},{"en":"invade","ru":"вторгаться","ex":"Enemies invaded the country."},{"en":"prepare (for)","ru":"готовиться (к)","ex":"I'm preparing for the exam."},{"en":"propose (to)","ru":"предлагать","ex":"He proposed a new plan."},{"en":"persuade","ru":"убеждать","ex":"I persuaded him to come."},{"en":"receive","ru":"получать","ex":"I received your letter."},{"en":"regard","ru":"рассматривать","ex":"I regard him as a genius."},{"en":"require","ru":"требоваться, нуждаться","ex":"This job requires experience."},{"en":"request","ru":"запрашивать","ex":"They requested more information."},{"en":"resemble","ru":"напоминать (внешне)","ex":"She resembles her mother."},{"en":"regain","ru":"вернуть, отвоевать","ex":"He regained his strength."},{"en":"remain","ru":"оставаться","ex":"Please remain seated."},{"en":"respect","ru":"уважать","ex":"We must respect elders."},{"en":"resolve","ru":"решить (конфликт)","ex":"They resolved the conflict."},{"en":"remove","ru":"убрать","ex":"Please remove your shoes."},{"en":"realise","ru":"осознать","ex":"I realised my mistake."},{"en":"recognise","ru":"узнать, признать","ex":"I didn't recognise you!"},{"en":"regret (about)","ru":"жалеть о","ex":"I regret my decision."},{"en":"reveal","ru":"обнародовать, раскрывать","ex":"He revealed the secret."},{"en":"register","ru":"зарегистрировать","ex":"I registered for the course."},{"en":"remind (of)","ru":"напоминать","ex":"You remind me of my friend."},{"en":"rely (on)","ru":"полагаться на","ex":"You can rely on me."},{"en":"recall","ru":"вспомнить","ex":"I can't recall his name."},{"en":"refer (to)","ru":"ссылаться на","ex":"He referred to the book."},{"en":"reply (to)","ru":"ответить на","ex":"Please reply to my email."},{"en":"submit","ru":"покориться, представлять","ex":"Submit your essay on Friday."},{"en":"suggest","ru":"предлагать","ex":"I suggest we start now."},{"en":"supply","ru":"снабжать","ex":"We supply fresh products."},{"en":"suppose","ru":"предполагать","ex":"I suppose you're right."},{"en":"exception","ru":"исключение","ex":"There is an exception to every rule."},{"en":"exchange","ru":"обмен","ex":"We had an exchange of ideas."},{"en":"excellence","ru":"превосходительство","ex":"She won an award for excellence."},{"en":"example","ru":"пример","ex":"Let me give you an example."},{"en":"destruction","ru":"разрушение","ex":"The storm caused great destruction."},{"en":"demonstration","ru":"демонстрация","ex":"The demonstration was impressive."},{"en":"departure","ru":"отъезд","ex":"The departure time is 8 am."},{"en":"determination","ru":"решительность","ex":"His determination is admirable."}];
let group='A',data=A,idx=0,flipped=false,qi=0,score=0,current=null,match=null;

function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function selectGroup(g){group=g;data=g==='A'?A:B;document.getElementById('groupTitle').textContent='Группа '+g+' · '+data.length+' слов';show('menu')}
function goHome(){show('home')}
function backMenu(){if(group){document.getElementById('groupTitle').textContent='Группа '+group+' · '+data.length+' слов';show('menu')}else show('home')}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}}

function startLearn(){idx=0;flipped=false;show('learn');renderCard()}
function renderCard(){const w=data[idx];document.getElementById('learnCount').textContent=(idx+1)+' / '+data.length;document.getElementById('learnProgress').style.width=((idx+1)/data.length*100)+'%';document.getElementById('flash').innerHTML=flipped?'<div><div class="ru">'+w.ru+'</div><div class="ex">'+w.ex+'</div><button class="audio" onclick="event.stopPropagation();speak('+JSON.stringify(w.en)+')">🔊 '+w.en+'</button></div>':'<div><div class="tiny">Нажми карточку, чтобы увидеть перевод</div><div class="word">'+w.en+'</div><button class="audio" onclick="event.stopPropagation();speak('+JSON.stringify(w.en)+')">🔊 Прослушать слово</button></div>'}
function flipCard(){flipped=!flipped;renderCard()}function nextCard(){if(idx<data.length-1){idx++;flipped=false;renderCard()}}function prevCard(){if(idx>0){idx--;flipped=false;renderCard()}}

function mkQuestion(pool){const s=shuffle(pool);const w=s[0];const opts=shuffle([w.ru,...s.slice(1,4).map(x=>x.ru)]);return{w,opts,ans:w.ru}}
function startQuiz(){qi=0;score=0;current=mkQuestion(data);show('quiz');renderQuiz()}
function renderQuiz(){document.getElementById('quizCount').textContent='Вопрос '+(qi+1)+' / 10';document.getElementById('quizProgress').style.width=((qi+1)/10*100)+'%';document.getElementById('quizBox').innerHTML='<div class="prompt">Выбери правильный перевод:</div><div class="qword">'+current.w.en+'</div><div class="options">'+current.opts.map((x,i)=>'<button class="opt" onclick="answerQuiz('+i+')">'+x+'</button>').join('')+'</div><div id="fb"></div>'}
function answerQuiz(i){const btns=[...document.querySelectorAll('#quizBox .opt')];btns.forEach(b=>b.disabled=true);const ok=current.opts[i]===current.ans;if(ok){btns[i].classList.add('correct');score++}else{btns[i].classList.add('wrong');btns[current.opts.indexOf(current.ans)].classList.add('correct')}document.getElementById('fb').innerHTML='<div class="feedback"><b>'+current.w.en+'</b> — '+current.w.ru+'<br><span class="tiny">'+current.w.ex+'</span></div>';setTimeout(()=>{qi++;if(qi>=10)return finish(score,10);current=mkQuestion(data);renderQuiz()},1300)}

function startMatch(){const s=shuffle(data).slice(0,6);match={left:shuffle(s),right:shuffle(s),selL:null,selR:null,done:0};show('match');renderMatch()}
function renderMatch(){document.getElementById('matchGrid').innerHTML='<div class="match-col"><h3>English</h3>'+match.left.map((w,i)=>'<button class="match-btn '+(match.selL===i?'sel':'')+'" onclick="selL('+i+')">'+w.en+'</button>').join('')+'</div><div class="match-col"><h3>Русский</h3>'+match.right.map((w,i)=>'<button class="match-btn '+(match.selR===i?'sel':'')+'" onclick="selR('+i+')">'+w.ru+'</button>').join('')+'</div>'}
function selL(i){match.selL=i;renderMatch();tryPair()}function selR(i){match.selR=i;renderMatch();tryPair()}
function tryPair(){if(match.selL===null||match.selR===null)return;const a=match.left[match.selL],b=match.right[match.selR];if(a.en===b.en){match.left.splice(match.selL,1);match.right.splice(match.selR,1);match.done++;match.selL=match.selR=null;if(match.done===6)return finish(6,6)}else{match.selL=match.selR=null}renderMatch()}

function mkFill(pool){const s=shuffle(pool);const w=s[0];const first=w.en.split(' ')[0];return{w,sentence:w.ex.replace(new RegExp(first,'i'),'______'),opts:shuffle([first,...s.slice(1,4).map(x=>x.en.split(' ')[0])]),ans:first}}
function startFill(){qi=0;score=0;current=mkFill(data);show('fill');renderFill()}
function renderFill(){document.getElementById('fillCount').textContent='Задание '+(qi+1)+' / 8';document.getElementById('fillBox').innerHTML='<div class="prompt">Вставь подходящее слово:</div><div class="fill-sent">“'+current.sentence+'”</div><div class="tiny" style="text-align:center;margin-bottom:10px">Подсказка: '+current.w.ru+'</div><div class="options">'+current.opts.map((x,i)=>'<button class="opt" onclick="answerFill('+i+')">'+x+'</button>').join('')+'</div>'}
function answerFill(i){const btns=[...document.querySelectorAll('#fillBox .opt')];btns.forEach(b=>b.disabled=true);const ok=current.opts[i]===current.ans;if(ok){btns[i].classList.add('correct');score++}else{btns[i].classList.add('wrong');btns[current.opts.indexOf(current.ans)].classList.add('correct')}setTimeout(()=>{qi++;if(qi>=8)return finish(score,8);current=mkFill(data);renderFill()},1100)}

function startFinal(){group='';data=[...A,...B];qi=0;score=0;current=mkQuestion(data);show('quiz');document.getElementById('quizCount').textContent='Финальный тест';renderFinalQ()}
function renderFinalQ(){document.getElementById('quizCount').textContent='Финальный тест · '+(qi+1)+' / 20';document.getElementById('quizProgress').style.width=((qi+1)/20*100)+'%';document.getElementById('quizBox').innerHTML='<div class="prompt">Выбери правильный перевод:</div><div class="qword">'+current.w.en+'</div><div class="options">'+current.opts.map((x,i)=>'<button class="opt" onclick="answerFinal('+i+')">'+x+'</button>').join('')+'</div>'}
function answerFinal(i){const btns=[...document.querySelectorAll('#quizBox .opt')];btns.forEach(b=>b.disabled=true);const ok=current.opts[i]===current.ans;if(ok){btns[i].classList.add('correct');score++}else{btns[i].classList.add('wrong');btns[current.opts.indexOf(current.ans)].classList.add('correct')}setTimeout(()=>{qi++;if(qi>=20)return finish(score,20);current=mkQuestion(data);renderFinalQ()},1000)}
function finish(s,t){document.getElementById('resultScore').textContent=s+' / '+t;document.getElementById('resultText').textContent=Math.round(s/t*100)+'%';show('results')}
</script>
</body>
</html>
