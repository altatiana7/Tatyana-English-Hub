<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grammar Lab · Homework</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#243c4b;background:#f5f8f7}*{box-sizing:border-box}body{margin:0}header{height:62px;padding:10px 22px;background:#fff;border-bottom:1px solid #dce6e4;display:flex;align-items:center;gap:14px}header h1{font-size:20px;margin:0}button{cursor:pointer;font:inherit}header button,.btn{border:1px solid #bfd6d2;border-radius:12px;padding:10px 16px;background:#fff;color:#20544e;font-weight:700}.btn.primary{background:#156b60;color:#fff}main{max-width:1000px;margin:auto;padding:22px}.eyebrow{font-size:12px;letter-spacing:.13em;color:#497c76;font-weight:800}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.tabs button{background:#fff;padding:12px 18px;border:1px solid #c8ddda;border-radius:12px;font-weight:700}.tabs button.active{background:#156b60;color:white}.panel{background:#fff;border:1px solid #d9e7e4;border-radius:22px;padding:25px;min-height:360px;box-shadow:0 10px 24px #15382e0b}h2{margin:8px 0 18px;font-size:25px}p{line-height:1.65}.rule{display:grid;grid-template-columns:1fr 1fr;gap:14px}.rule>div{background:#eef7f4;border-radius:14px;padding:16px}.rule b{color:#135e53}.example{font-size:17px;margin:8px 0}.small{color:#58716d;font-size:14px}.qtext{font-size:23px;font-weight:700;line-height:1.5;margin:26px 0}.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.option{border:2px solid #d8e5e3;border-radius:14px;padding:17px;background:#fff;text-align:left;font-size:17px}.option.selected{background:#e0f5ef;border-color:#156b60}.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:24px}.progress{height:8px;border-radius:20px;background:#e4eeea;overflow:hidden;margin-top:13px}.progress>i{display:block;height:100%;background:#156b60}.warning{color:#9a641e}.result{font-size:27px;font-weight:800}.hide{display:none!important}@media(max-width:650px){main{padding:12px}.panel{padding:17px}.rule,.options{grid-template-columns:1fr}.qtext{font- </style></head><body><header><button onclick="home()">← Home</button><h1>11 / GRAMMAR LAB · HOMEWORK</h1></header><main><div class="eyebrow">B2 · DIGITAL LIFE, SOCIAL MEDIA & MONEY</div><div class="tabs" id="tabs"></div><section class="panel" id="screen"></section></main><script>
const QUESTIONS=[{"q":"Rarely ___ people think about what happens to their data.","options":["are","have","did","do"],"correct":3},{"q":"Never ___ I seen a brand lose trust so quickly.","options":["have","do","had","am"],"correct":0},{"q":"Only after the story went viral ___ the creator apologise.","options":["does","did","had","was"],"correct":1},{"q":"Not only ___ influencers sell products, but they also shape trends.","options":["are","did","do","have"],"correct":2},{"q":"Hardly ___ she uploaded the video when the comments appeared.","options":["has","did","was","had"],"correct":3},{"q":"Seldom ___ teenagers question personalised advertising.","options":["do","are","have","did"],"correct":0},{"q":"Under no circumstances ___ you share your banking password.","options":["have","should","do","would"],"correct":1},{"q":"Only when she deleted the app ___ she realise how often she checked it.","options":["was","has","did","had"],"correct":2},{"q":"Not until the following morning ___ the company respond.","options":["was","had","has","did"],"correct":3},{"q":"No sooner ___ I logged in than I noticed the security warning.","options":["had","have","did","was"],"correct":0},{"q":"The creator is said ___ several sponsorship deals recently.","options":["have lost","to have lost","to lose","losing"],"correct":1},{"q":"The post is believed ___ by the influencer last night.","options":["to be deleting","having deleted","to have been deleted","to delete"],"correct":2},{"q":"Teenagers are thought ___ more time on social platforms than on news websites.","options":["to have spent","spending","have spent","to spend"],"correct":3},{"q":"The app is reported ___ users' location data right now.","options":["to be collecting","to have collected","collect","being collected"],"correct":0},{"q":"The company is known ___ influencers for sponsored content last year.","options":["to be paying","to have paid","to pay","paying"],"correct":1},{"q":"The brand is expected ___ a statement tomorrow.","options":["releasing","released","to release","to have released"],"correct":2},{"q":"The video is said ___ over ten million times since Friday.","options":["to be viewing","to view","having viewed","to have been viewed"],"correct":3},{"q":"She is considered ___ one of the most influential creators in her field.","options":["to be","being","to have been","been"],"correct":0},{"q":"The celebrity is alleged ___ fake followers before the campaign began.","options":["to be buying","to have bought","to buy","buying"],"correct":1},{"q":"The trend is thought ___ in South Korea several years ago.","options":["starting","to be starting","to have started","to start"],"correct":2},{"q":"If I ___ more about targeted advertising, I would change my privacy settings.","options":["know","had known","will know","knew"],"correct":3},{"q":"If she had checked the source, she ___ the fake story.","options":["wouldn't have shared","won't share","wouldn't share","hadn't shared"],"correct":0},{"q":"If social media disappeared tomorrow, many brands ___ their strategy.","options":["would have rethought","would rethink","will rethink","had rethought"],"correct":1},{"q":"If I'd saved more money last year, I ___ less stressed about expenses now.","options":["would have felt","had felt","would feel","will feel"],"correct":2},{"q":"___ she known the consequences, she would never have published the post.","options":["If","Were","Should","Had"],"correct":3}];
const SECTIONS=[{name:'Rule',start:-1,end:-1},{name:'Inversion',start:0,end:10},{name:'Passive reporting',start:10,end:20},{name:'Conditionals',start:20,end:25}];
const KEY='kate_grammar_lab_hw_20261027';let responses=Array(QUESTIONS.length).fill(-1),section=0,position=0,submitted=false;
try{let saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.responses)&&saved.responses.length===QUESTIONS.length){responses=saved.responses.map(x=>Number.isInteger(x)&&x>=0&&x<4?x:-1);submitted=!!saved.submitted}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({responses,submitted}))}catch(e){}}
function home(){try{if(parent!==window&&parent.closeLessonView){parent.closeLessonView();return}}catch(e){}location.href='index.html'}
function el(s){return document.createElement(s)}function b(label,fn,cls='btn'){let x=el('button');x.textContent=label;x.className=cls;x.onclick=fn;return x}
function nav(n){section=n;position=0;render()}function render(){const tab=document.getElementById('tabs');tab.replaceChildren();SECTIONS.forEach((s,i)=>tab.append(b(s.name,()=>nav(i),' '+(section===i?'active':''))));const x=document.getElementById('screen');x.replaceChildren();if(section===0){x.innerHTML='<h2>Grammar reference</h2><div class="rule"><div><b>1 · Inversion</b><p>After negative or restrictive adverbials at the beginning of a sentence, invert the auxiliary verb and subject: <b>Never have I…</b>; <b>Rarely do people…</b>.</p><p>With <b>only after / only when / not until</b>, inversion occurs in the main clause: <b>Only after the post went viral did she apologise.</b></p><p>Other patterns: <b>Hardly had…when</b>, <b>No sooner had…than</b>, <b>Not only… but also</b>, <b>Under no circumstances should…</b>.</p></div><div><b>2 · Passive reporting</b><p>Use <b>subject + is/are + reporting participle + to-infinitive</b> to report what people believe, say or expect.</p><p><b>to do</b> = same or future time; <b>to be doing</b> = ongoing action; <b>to have done</b> = earlier action; <b>to have been done</b> = earlier passive event.</p><p class="example">She is believed <b>to have deleted</b> the post.</p></div><div><b>3 · Conditionals</b><p><b>Second:</b> If + Past Simple, would + infinitive (unreal present / future).</p><p><b>Third:</b> If + Past Perfect, would have + past participle (unreal past).</p><p><b>Mixed:</b> If + Past Perfect, would + infinitive (past cause, present result).</p><p>Formal inversion: <b>Had she known…</b> = If she had known…</p></div><div><b>Test format</b><p>25 multiple-choice questions · one answer per question · work through all three sections.</p><p>The test saves your choices in this browser. After submission, you will see only your score, not the answer key.</p></div></div>';x.append(b('Start test →',()=>nav(1),'btn primary'));return}if(submitted){const score=responses.reduce((s,v,i)=>s+(v===QUESTIONS[i].correct?1:0),0);x.innerHTML='<p class="eyebrow">SUBMITTED</p><h2>Grammar Lab complete</h2><p class="result">'+score+' / 25</p><p>No answer key is displayed.</p>';x.append(b('Restart test',()=>{submitted=false;responses.fill(-1);save();nav(1)},'btn primary'));return}const s=SECTIONS[section],i=s.start+position,q=QUESTIONS[i],done=responses.slice(s.start,s.end).filter(v=>v>=0).length;x.innerHTML='<div class="eyebrow">'+s.name.toUpperCase()+' · '+(position+1)+' / '+(s.end-s.start)+'</div><div class="progress"><i style="width:'+(done/(s.end-s.start)*100)+'%"></i></div><div class="qtext"></div><div class="options"></div>';x.querySelector('.qtext').textContent=q.q;const box=x.querySelector('.options');q.options.forEach((o,j)=>{let bt=b(String.fromCharCode(65+j)+'.  '+o,()=>{responses[i]=j;save();render()},'option'+(responses[i]===j?' selected':''));bt.setAttribute('aria-pressed',String(responses[i]===j));box.append(bt)});const foot=el('div');foot.className='foot';foot.append(b('← Previous',()=>{if(position>0)position--;else if(section>1){section--;position=9}render()},'btn'));const right=el('div');right.append(b(position<s.end-s.start-1?'Next →':section<3?'Next section →':'Submit test',()=>{if(position<s.end-s.start-1)position++;else if(section<3){section++;position=0}else{const missing=responses.filter(v=>v<0).length;if(missing){alert('Please answer all questions before submitting. Remaining: '+missing);return}submitted=true;save()}render()},'btn primary'));foot.append(right);x.append(foot);const n=el('p');n.className='small';n.textContent=responses.filter(v=>v>=0).length+' of 25 answered';x.append(n)}
render();
</script></body></html>
