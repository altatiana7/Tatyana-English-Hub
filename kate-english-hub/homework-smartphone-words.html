<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><script>/* open-from-main-screen */(function(){try{if(window.top!==window)return;var r=document.referrer;if(r&&new URL(r).origin===location.origin)return}catch(e){return}location.replace("index.html")})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Kate · Homework · Smartphone Words</title>
<style>
:root{--ink:#223d3c;--navy:#155e61;--muted:#66756f;--line:#dfe6e0;--bg:#f5f5f0;--accent:#c57e67;--soft:#f2f5ef;--ok:#e0f2e5;--okb:#5fa37a;--bad:#fbe7e3;--badb:#cf7b67}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;width:100%;height:100%;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.fc:focus-visible{outline:3px solid #50a49c;outline-offset:2px}
.app{height:100dvh;display:grid;grid-template-rows:54px minmax(0,1fr)}
header{display:flex;align-items:center;gap:12px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line)}
header h1{font-size:20px;letter-spacing:-.03em;margin:0;font-weight:800;color:var(--navy);white-space:nowrap}
header p{font-size:13px;color:var(--muted);margin:1px 0 0;white-space:nowrap}
.grow{flex:1}
.pill{font-size:13px;font-weight:800;letter-spacing:.04em;border-radius:6px;background:#e4eee8;color:var(--navy);padding:6px 9px;white-space:nowrap}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:clamp(10px,1.2vw,16px);padding:clamp(10px,1.8vh,18px) clamp(12px,1.6vw,24px);min-height:0;max-width:1400px;width:100%;margin:0 auto}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:clamp(10px,1.6vh,16px) clamp(12px,1.2vw,18px);display:flex;flex-direction:column;gap:clamp(6px,1.2vh,11px);min-height:0;min-width:0}
.head{display:flex;align-items:center;gap:10px;padding-bottom:clamp(5px,1vh,9px);border-bottom:1px solid var(--line)}
.head>div:first-child{flex:1;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.13em;font-weight:800;color:var(--accent);margin:0}
.btn{border:1px solid var(--navy);border-radius:8px;background:var(--navy);color:#fff;padding:8px 14px;font-size:15px;font-weight:800;white-space:nowrap}
.btn.light{background:var(--soft);border-color:#d5e0d7;color:var(--navy)}
.btn:disabled{opacity:.35;cursor:default}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid #d5e0d7;background:var(--soft);color:var(--navy);border-radius:8px;padding:6px 11px;font-size:14px;font-weight:700}
.seg button.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* Quizlet card */
.cardwrap{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px;align-items:center}
.fc{perspective:1200px;width:100%;max-width:480px;height:clamp(170px,40vh,260px);cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.fc.flipped .fc-in{transform:rotateY(180deg)}
.fc-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 22px;gap:9px}
.fc-front{background:#eaf2ee;border:2px solid #a9c8bb}
.fc-front strong{font-size:clamp(24px,4.4vh,30px);color:var(--navy);letter-spacing:-.02em}
.fc-front small{font-size:13px;color:var(--muted);letter-spacing:.08em;font-weight:700}
.fc-back{background:#fff;border:2px solid var(--navy);transform:rotateY(180deg)}
.fc-back .m{font-size:clamp(17px,2.8vh,19px);font-weight:700;line-height:1.3}
.fc-back .e{font-size:clamp(16px,2.6vh,18px);font-style:italic;color:#3d5654;line-height:1.35}
.fc-back .r{font-size:15px;color:var(--muted)}
.fcnav{display:flex;align-items:center;justify-content:center;gap:8px}
.cnt{min-width:64px;text-align:center;font-weight:800;color:var(--navy)}
.note{font-size:15px;color:var(--muted);text-align:center}
/* Exercises */
.score{display:flex;gap:6px}
.score span{font-size:13px;font-weight:800;letter-spacing:.04em;border-radius:6px;background:#fbf1e8;color:#7a4b39;padding:6px 9px;white-space:nowrap}
.instr{font-size:clamp(15px,2.4vh,17px);color:var(--muted);margin:0}
.items{flex:1;min-height:0;display:flex;flex-direction:column;gap:clamp(6px,1.1vh,10px);overflow:auto}
.item{border:1px solid #e3e9e3;border-radius:9px;padding:clamp(7px,1.2vh,10px) 12px;display:flex;flex-direction:column;gap:7px;background:#fff}
.item.done-ok{border-color:var(--okb);background:#f6fbf7}
.item.done-bad{border-color:var(--badb);background:#fdf8f6}
.q{font-size:clamp(16px,2.6vh,18px);line-height:1.35}
.q b{color:var(--navy)}
.gap{display:inline-block;min-width:80px;border-bottom:2px solid #9bb8ad;text-align:center;font-weight:800;color:var(--navy)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opt{border:1px solid #cfdcd3;background:var(--soft);color:var(--ink);border-radius:8px;padding:6px 11px;font-size:clamp(15px,2.4vh,16px);font-weight:600}
.opt:hover:not(:disabled){border-color:var(--navy)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok);border-color:var(--okb);color:#1d4a30;font-weight:800}
.opt.bad{background:var(--bad);border-color:var(--badb);color:#7a2f20}
.foot{display:flex;align-items:center;gap:10px}
.prog{flex:1;height:8px;border-radius:5px;background:#e8eee9;overflow:hidden}
.prog i{display:block;height:100%;background:var(--navy);width:0;transition:width .3s}
.result{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:8px}
.result h3{margin:0;font-size:22px;color:var(--navy)}
.miss{font-size:16px;line-height:1.35;border-left:3px solid var(--badb);padding:4px 10px;background:#fdf8f6;border-radius:0 6px 6px 0}
.miss s{color:#a3523f}.miss b{color:#1d4a30}
.pop{position:fixed;left:50%;bottom:70px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:7px 14px;border-radius:8px;font-weight:800;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none}
.pop.on{opacity:1}
@media(max-height:640px){.app{grid-template-rows:44px minmax(0,1fr)}header p{display:none}.instr#instr{display:none}main{padding-top:8px;padding-bottom:8px}.item{padding:6px 11px;gap:5px}.items{gap:6px}.opt{padding:4px 10px}.q{font-size:16px}.fc{height:clamp(160px,38vh,230px)}}
@media(max-width:860px){body{overflow:auto}.app{height:auto;min-height:100dvh;grid-template-rows:auto 1fr}header{flex-wrap:wrap;padding:8px 12px}main{grid-template-columns:1fr}header p{display:none}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>HOMEWORK · SMARTPHONES</h1><p>Who controls whom? Words for digital habits</p></div>
  <span class="grow"></span>
  <span class="pill">17 WORDS · 3 GAMES</span>
</header>
<main>
  <div class="card">
    <div class="head"><div><p class="eyebrow">STEP 1 · QUIZLET</p><div class="seg" id="sets" style="margin-top:4px"></div></div><button class="btn light" type="button" id="shuffle">Shuffle</button></div>
    <div class="cardwrap">
      <div class="fc" id="fc" tabindex="0" role="button" aria-label="Flip the card"><div class="fc-in"><div class="fc-face fc-front"><strong id="word"></strong><small>CLICK TO FLIP</small></div><div class="fc-face fc-back"><div class="m" id="mean"></div><div class="e" id="ex"></div><div class="r" id="ru"></div></div></div></div>
      <div class="fcnav"><button class="btn light" type="button" id="prev">←</button><span class="cnt" id="cnt"></span><button class="btn light" type="button" id="next">→</button></div>
      <div class="note">Say the word, guess the meaning, then flip.</div>
    </div>
  </div>

  <div class="card">
    <div class="head"><div><p class="eyebrow">STEP 2 · WORD GAMES</p><div class="seg" id="games" style="margin-top:4px"></div></div><div class="score"><span id="pts">0 PTS</span><span id="streak">STREAK 0</span></div></div>
    <p class="instr" id="instr"></p>
    <div class="items" id="items"></div>
    <div class="result" id="result" hidden></div>
    <div class="foot"><div class="prog"><i id="bar"></i></div><span class="cnt" id="round"></span><button class="btn" type="button" id="nextRound" disabled>Next round →</button></div>
  </div>
</main>
</div>
<div class="pop" id="pop"></div>
<script>
const $=id=>document.getElementById(id);
/* [word, meaning, example, Russian] */
const HABITS=[
 ['doomscrolling','spending too much time scrolling through bad or negative news online','I lost an hour last night doomscrolling instead of sleeping.','бесконечное листание (обычно плохих) новостей'],
 ['screen time','the amount of time you spend looking at a phone, computer or TV','My phone tells me my screen time is six hours a day.','экранное время'],
 ['compulsive checking','checking your phone again and again without really deciding to','Endless content may encourage compulsive checking.','навязчивая проверка (телефона)'],
 ['displace sleep','to take the place of time you would normally spend sleeping','Heavy phone use can displace sleep.','вытеснять сон'],
 ['a digital detox','a period when you stop using phones and social media','She went on a digital detox for a whole weekend.','цифровой детокс'],
 ['digital wellbeing','being healthy and balanced in the way you use technology','Some apps now have tools for digital wellbeing.','цифровое благополучие'],
 ['the attention economy','a system in which companies compete for people’s time and attention to make money','In the attention economy, your time is the product.','экономика внимания'],
 ['a natural stopping point','a moment when it feels normal to stop an activity','Infinite feeds have no natural stopping point.','естественная точка остановки'],
 ['strike a balance','to find a sensible middle point between two things','It’s hard to strike a balance between study and social media.','найти баланс']
];
const DESIGN=[
 ['infinite scrolling','a design where new content keeps loading, so the feed never ends','Infinite scrolling keeps people on the app for hours.','бесконечная лента'],
 ['autoplay','a feature that starts the next video automatically','Autoplay lets you watch videos without choosing the next one.','автовоспроизведение'],
 ['personalised recommendations','content chosen for you based on what you watched or liked before','Personalised recommendations persuade people to keep watching.','персональные рекомендации'],
 ['maximise engagement','to make people use an app as much as possible','Some features are designed to maximise engagement.','максимально увеличить вовлечённость'],
 ['exploit users’ vulnerabilities','to use people’s weaknesses unfairly for your own profit','Critics say some apps exploit users’ vulnerabilities.','использовать уязвимости пользователей'],
 ['reinforce compulsive behaviour','to make a habit you can’t control even stronger','Constant rewards can reinforce compulsive behaviour.','подкреплять навязчивое поведение'],
 ['undermine self-control','to gradually weaken your ability to control yourself','Notifications can undermine self-control.','подрывать самоконтроль'],
 ['prioritise user wellbeing','to put people’s health and happiness first','An ethical app should prioritise user wellbeing.','ставить благополучие пользователя на первое место']
];
const SETS=[['Digital habits · 9',HABITS],['App design · 8',DESIGN],['All · 17',HABITS.concat(DESIGN)]];
let CARDS,order,ci;
function setDeck(k){CARDS=SETS[k][1];order=CARDS.map((_,j)=>j);ci=0;[...$('sets').children].forEach((b,j)=>b.classList.toggle('on',j===k));renderCard()}
SETS.forEach((st,k)=>{const b=document.createElement('button');b.type='button';b.textContent=st[0];b.onclick=()=>setDeck(k);$('sets').appendChild(b)});
function renderCard(){const c=CARDS[order[ci]];$('fc').classList.remove('flipped');$('word').textContent=c[0];$('mean').textContent=c[1];$('ex').textContent=c[2];$('ru').textContent=c[3];$('cnt').textContent=(ci+1)+' / '+CARDS.length}
$('fc').onclick=()=>$('fc').classList.toggle('flipped');
$('fc').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('fc').classList.toggle('flipped')}};
$('prev').onclick=()=>{ci=(ci+CARDS.length-1)%CARDS.length;renderCard()};
$('next').onclick=()=>{ci=(ci+1)%CARDS.length;renderCard()};
$('shuffle').onclick=()=>{order=order.slice().sort(()=>Math.random()-.5);ci=0;renderCard()};
document.addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('.opt'))return;if(e.key==='ArrowRight')$('next').click();if(e.key==='ArrowLeft')$('prev').click()});
setDeck(0);

/* ---------- games: [prompt, correct, wrong1, wrong2] ---------- */
const GAMES=[
 {name:'1 · Meaning match',instr:'Read the meaning and choose the right word.',items:[
  ['spending too much time scrolling through bad news online','doomscrolling','screen time','autoplay'],
  ['a feature that starts the next video automatically','autoplay','infinite scrolling','a digital detox'],
  ['a period when you stop using phones and social media','a digital detox','digital wellbeing','screen time'],
  ['a design where the feed never ends','infinite scrolling','autoplay','a natural stopping point'],
  ['to make people use an app as much as possible','maximise engagement','strike a balance','displace sleep'],
  ['to gradually weaken your ability to control yourself','undermine self-control','prioritise user wellbeing','reinforce compulsive behaviour'],
  ['a moment when it feels normal to stop an activity','a natural stopping point','compulsive checking','screen time'],
  ['to find a sensible middle point between two things','strike a balance','maximise engagement','displace sleep'],
  ['to put people’s health and happiness first','prioritise user wellbeing','exploit users’ vulnerabilities','undermine self-control'],
  ['companies competing for people’s time to make money','the attention economy','digital wellbeing','personalised recommendations'],
  ['to use people’s weaknesses unfairly for profit','exploit users’ vulnerabilities','reinforce compulsive behaviour','maximise engagement'],
  ['checking your phone again and again without deciding to','compulsive checking','doomscrolling','a digital detox']
 ]},
 {name:'2 · Fill the gap',instr:'Choose the word that completes the sentence.',items:[
  ['Notifications constantly compete for our ___.','attention','balance','wellbeing'],
  ['I stayed up until 2 a.m. ___ through terrible news.','doomscrolling','autoplaying','detoxing'],
  ['Heavy phone use can ___ sleep and face-to-face interaction.','displace','prioritise','strike'],
  ['Endless content may encourage compulsive ___.','checking','engagement','economy'],
  ['Infinite feeds have no natural stopping ___.','point','line','time'],
  ['Investors want the team to ___ engagement.','maximise','undermine','displace'],
  ['___ makes it possible to watch videos without choosing the next one.','Autoplay','Screen time','Doomscrolling'],
  ['Personalised ___ persuade people to keep watching.','recommendations','vulnerabilities','detoxes'],
  ['My weekly ___ time report was a shock: 40 hours!','screen','stopping','detox'],
  ['An ethical app should prioritise user ___.','wellbeing','engagement','vulnerabilities'],
  ['Constant rewards can ___ compulsive behaviour.','reinforce','strike','prioritise'],
  ['After exams, she went on a digital ___ for a week.','detox','economy','balance']
 ]},
 {name:'3 · Collocations',instr:'Which word goes with the phrase?',items:[
  ['___ a balance','strike','hit','make'],
  ['___ users’ vulnerabilities','exploit','abuse of','use up'],
  ['___ self-control','undermine','underline','overtake'],
  ['___ compulsive behaviour','reinforce','enforce','inform'],
  ['___ user wellbeing','prioritise','prefer','promote to'],
  ['___ engagement','maximise','enlarge','grow up'],
  ['go on a digital ___','detox','diet','break-off'],
  ['spend hours ___ through the feed','scrolling','skating','swiping off'],
  ['___ for our attention','compete','fight with','contest'],
  ['cut ___ on screen time','down','off','out'],
  ['infinite ___','scrolling','scroll-time','scrolls'],
  ['the attention ___','economy','economics','market place']
 ]}
];
const PER=innerHeight<640?3:4;let G,deck,r,pts=0,streak=0,answered,misses;
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function pop(t){$('pop').textContent=t;$('pop').classList.add('on');clearTimeout(pop.t);pop.t=setTimeout(()=>$('pop').classList.remove('on'),900)}
function setGame(k){G=GAMES[k];pts=0;streak=0;score();deck=shuffle(G.items);r=0;misses=[];[...$('games').children].forEach((b,j)=>b.classList.toggle('on',j===k));$('instr').textContent=G.instr;$('result').hidden=true;$('items').hidden=false;$('instr').hidden=false;renderRound()}
GAMES.forEach((g,k)=>{const b=document.createElement('button');b.type='button';b.textContent=g.name;b.onclick=()=>setGame(k);$('games').appendChild(b)});
function rounds(){return Math.ceil(deck.length/PER)}
function score(){$('pts').textContent=pts+' PTS';$('streak').textContent='STREAK '+streak}
function renderRound(){
  const box=$('items');box.innerHTML='';answered=0;
  const part=deck.slice(r*PER,r*PER+PER);
  part.forEach(it=>{
    const d=document.createElement('div');d.className='item';
    const q=document.createElement('div');q.className='q';
    q.innerHTML=it[0].includes('___')?it[0].replace('___','<span class="gap">?</span>'):'<b>'+it[0]+'</b>';
    const o=document.createElement('div');o.className='opts';
    shuffle(it.slice(1)).forEach(t=>{const b=document.createElement('button');b.type='button';b.className='opt';b.textContent=t;
      b.onclick=()=>{
        const right=t===it[1];
        o.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(x.textContent===it[1])x.classList.add('ok')});
        if(right){streak++;const gain=streak>=3?20:10;pts+=gain;d.classList.add('done-ok');if(streak>=3)pop('Streak x'+streak+' · +20');}
        else{streak=0;b.classList.add('bad');d.classList.add('done-bad');misses.push([it[0],t,it[1]])}
        const g=q.querySelector('.gap');if(g)g.textContent=it[1];
        score();answered++;if(answered===part.length)$('nextRound').disabled=false;
      };o.appendChild(b)});
    d.appendChild(q);d.appendChild(o);box.appendChild(d);
  });
  $('round').textContent='Round '+(r+1)+' / '+rounds();
  $('bar').style.width=(r/rounds()*100)+'%';
  $('nextRound').disabled=true;
  $('nextRound').textContent=r===rounds()-1?'See result':'Next round →';
}
$('nextRound').onclick=()=>{if(r<rounds()-1){r++;renderRound()}else showResult()};
function showResult(){
  $('items').hidden=true;$('instr').hidden=true;$('bar').style.width='100%';
  const ok=deck.length-misses.length;
  let h='<h3>'+ok+' / '+deck.length+' correct</h3>';
  if(misses.length){h+='<p class="instr">Look at your mistakes:</p>';misses.forEach(m=>{h+='<div class="miss">'+m[0].replace('___','<b>'+m[2]+'</b>')+(m[0].includes('___')?'':' — <b>'+m[2]+'</b>')+' &nbsp;<s>'+m[1]+'</s></div>'})}
  else h+='<p class="instr">Perfect round — no mistakes!</p>';
  $('result').innerHTML=h;$('result').hidden=false;
  $('round').textContent='';
  $('nextRound').disabled=false;$('nextRound').textContent='Play again';
  $('nextRound').onclick=()=>{$('nextRound').onclick=nextHandler;setGame(GAMES.indexOf(G))};
}
const nextHandler=$('nextRound').onclick;
setGame(0);score();
</script>
<script src="../card-audio.js?v=1"></script>
</body>
</html>
