{title:"Reading A · The quiet library",text:`When the city council announced plans to turn an old public library into a 'digital experience centre', the reaction was unexpectedly emotional. The building had never been particularly beautiful. Its windows were small, its heating unreliable and its collection of books rather modest. Yet residents insisted it was one of the few places where they could spend time without feeling obliged to buy something.

At first, the council dismissed the objections as nostalgia. Officials pointed out that fewer books were being borrowed every year and argued that a modern centre would attract more young visitors. But when a local researcher interviewed regular library users, a different picture emerged. Teenagers went there to study because home was crowded; pensioners read newspapers and talked to neighbours; people looking for work used computers and received practical assistance from librarians.

The researcher also discovered that the number of loans was a poor measure of the building's value. Many users came regularly without borrowing a single book. In response, the council altered its proposal. The library would keep its reading rooms and staff, while one section would be redesigned for workshops and digital skills classes. The compromise was neither revolutionary nor particularly cheap, but it recognised that a public space can serve more than one purpose.

Perhaps the most revealing part of the debate was the language used to describe the library. The officials saw an outdated service in need of an upgrade. The residents saw a place where nobody had to explain why they were there. Neither description was entirely wrong, but only when both were taken seriously did a workable solution appear.`,qs:[
["Why did local people oppose the original plan?",["They disliked the appearance of the proposed centre.","They valued being able to stay somewhere without spending money.","They wanted the library to buy a larger collection.","They thought young people should use fewer computers."],1],
["The council initially interpreted criticism as",["a concern about unemployment.","a disagreement over the research method.","an emotional attachment to the past.","an objection to digital technology."],2],
["Which fact challenged the council's statistics?",["Many visitors did not borrow books.","Library books were frequently lost.","Young visitors preferred printed newspapers.","The building had lower costs than expected."],0],
["What does 'emerged' suggest in paragraph two?",["A previously unnoticed reality became clear.","The council immediately changed its decision.","The library opened a new department.","The researcher abandoned the interviews."],0],
["What was retained in the revised proposal?",["Only the original book collection.","Reading areas and library employees.","All rooms exactly as they were.","The planned digital centre in its entirety."],1],
["The author describes the compromise as",["perfect but too expensive.","surprising and radical.","practical despite its limitations.","likely to create new disputes."],2],
["What is the main idea of the final paragraph?",["Public services should never be modernised.","Officials are generally less informed than residents.","Different interpretations need to be considered.","Digital centres are more important than libraries."],2]]},
{title:"Reading B · A different way to learn",text:`On her first day at the repair café, Maya expected to be taught how to fix a bicycle. Instead, she was given a broken toaster and asked what she thought might be wrong with it. She had never taken apart an electrical appliance and was reluctant to touch it. The volunteer supervising her did not provide instructions immediately. He asked questions, listened to her guesses and encouraged her to inspect the object carefully.

The repair café was run by volunteers who wanted to reduce waste, but the organisers soon realised that people were gaining something other than practical skills. Visitors who had always considered themselves 'bad at technology' began to attempt minor repairs at home. Several reported that their attitude to mistakes had changed: a failed attempt was no longer proof that they lacked ability.

Not everyone appreciated the approach. Some visitors wanted a quick repair and found the discussions frustrating. They had brought in an object that did not work and expected to leave with one that did. The organisers responded by introducing two different sessions: a drop-off repair service and a learning workshop. This separation made expectations clearer without abandoning the café's original environmental aim.

Maya eventually fixed the toaster, although it took far longer than she had imagined. Months later, she remembered almost nothing about the wiring. What stayed with her was the confidence to face a problem she did not immediately understand. She now describes the experience not as a lesson in electronics but as a lesson in persistence.`,qs:[
["What surprised Maya at the beginning?",["She was asked to examine a different appliance.","There were no volunteers at the café.","She had to repair her own bicycle.","The workshop was already full."],0],
["Why did the volunteer ask questions?",["To test her existing technical qualifications.","To encourage independent observation and reasoning.","To persuade her to buy a new appliance.","To save time during the repair."],1],
["What additional benefit did participants experience?",["They earned money by repairing appliances.","They became more confident about attempting repairs.","They stopped making mistakes altogether.","They developed professional engineering skills."],1],
["How did some visitors feel about the original format?",["They were disappointed by its slow pace.","They believed it created too much waste.","They wanted more theoretical lectures.","They disliked the volunteers' technical knowledge."],0],
["Why were two types of session introduced?",["To increase membership fees.","To allow only experts to join workshops.","To accommodate different visitors' expectations.","To prevent people repairing electrical items."],2],
["What did Maya remember most clearly?",["The exact technical steps she followed.","The first bicycle she repaired.","The ability to approach unfamiliar problems.","The names of all the volunteers."],2],
["The author's attitude to the café is best described as",["supportive but aware of practical challenges.","critical of its environmental goals.","indifferent to its educational value.","certain that every visitor should learn repairs."],0]]}

const storeKey="kate-ege-recovery-20261109";let state={};try{state=JSON.parse(localStorage.getItem(storeKey)||"{}")}catch(e){}state.answers=state.answers||{};state.checked=state.checked||{};state.writing=state.writing||{};let active=sections[0][0];
const save=()=>{localStorage.setItem(storeKey,JSON.stringify(state));try{P.refresh()}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function opts(id,items){return items.map((x,i)=>{let sel=state.answers[id]===i;return '<label><input type="radio" name="'+id+'" value="'+i+'" '+(sel?'checked':'')+' '+(state.checked[active]||P.isSent(active)?'disabled':'')+' onchange="setAnswer(\''+id+'\','+i+')">'+esc(x)+'</label>'}).join('')}
function setAnswer(id,v){state.answers[id]=v;save()}

function getQuestions(){return active==="reading1"?R[0].qs:active==="reading2"?R[1].qs:active==="vocab"?V:active==="grammar"?G:[]}
function correct(){let list=getQuestions();if(active==="word")return W.filter((x,i)=>norm(state.answers["word"+i])===norm(x[2])).length;return list.filter((x,i)=>state.answers[active+i]===x[2]).length}
function norm(s){return String(s||"").toLowerCase().trim().replace(/\s+/g," ")}
function count(){return active==="word"?W.length:getQuestions().length}
function done(id){if(id==="writing")return WR.every((x,i)=>(state.writing["w"+i]||"").trim().length>=90);if(id==="speaking")return OR.every((x,i)=>(state.writing["o"+i]||"").trim().length>=35);return !!state.checked[id]}
const P=HWParts.make({id:"kate:ege-recovery-20261109",testId:"kate:ege-recovery-20261109",title:"Катя · ЕГЭ коррекция 9 ноября",lang:"ru",units:()=>sections.map(([id,name])=>({id,label:name,done:done(id),errors:state.checked[id] ? (id==="word"?W.length: id==="vocab"?V.length:id==="grammar"?G.length:7) - score(id):null})),snapshot:()=>({responses:state.answers,written:state.writing,checked:state.checked}),onUpdate:()=>render()});
function score(id){let old=active;active=id;let n=correct();active=old;return n}
function check(){if(P.isSent(active))return;state.checked[active]=true;save();render()}
function quizText(list,reading){let html=reading?'<div class="card reading">'+esc(reading.text)+'</div>':"";html+='<div class="card"><h2>'+esc(reading?reading.title:active==="vocab"?"Lexical choice": "Grammar refresh")+'</h2><p class="note">Choose the best answer. Check the whole unit when finished.</p>';list.forEach((q,i)=>{const id=active+i;html+='<div class="q"><strong>'+(i+1)+'. '+esc(q[0])+'</strong>'+opts(id,q[1])+(state.checked[active]?'<p class="'+(state.answers[id]===q[2]?'good':'bad')+'">Correct: '+esc(q[1][q[2]])+'</p>':'')+'</div>'});return html+'</div>'}
function wordText(){let h='<div class="card"><h2>Word formation · 15 transformations</h2><p class="note">Change each capitalised word. Every answer requires a different form.</p>';W.forEach((q,i)=>{let id="word"+i;h+='<div class="q"><strong>'+(i+1)+'. '+esc(q[0])+' <span class="muted">('+q[1]+')</span></strong><input type="text" value="'+esc(state.answers[id]||"")+'" '+(state.checked.word||P.isSent("word")?"disabled":"")+' oninput="setAnswer(\''+id+'\',this.value)">'+(state.checked.word?'<p class="'+(norm(state.answers[id])===norm(q[2])?'good':'bad')+'">Answer: '+q[2]+'</p>':'')+'</div>'});return h+'</div>'}
function written(kind){let isW=kind==="writing",list=isW?WR:OR;let html='<div class="card"><h2>'+(isW?"EGE Writing · 3 tasks":"EGE Speaking · 3 tasks")+'</h2><p class="note">Your teacher checks these tasks. Save a draft here; send completed parts to your teacher with the green button at the top. For speaking, record audio on your phone and paste a shareable recording link below each task.</p></div>';list.forEach((x,i)=>{let id=(isW?"w":"o")+i;html+='<div class="card"><h2>'+esc(x.title||x[0])+'</h2>'+(isW?'<p>'+esc(x.prompt)+'</p>':'<p>'+x.slice(1).map(esc).join('</p><p>')+'</p>')+'<textarea '+(P.isSent(kind)?"disabled":"")+' placeholder="'+(isW?"Write your complete answer here...":"Paste the link to your recording and, if needed, notes...")+'" oninput="setWriting(\''+id+'\',this.value)">'+esc(state.writing[id]||"")+'</textarea><div class="note">'+(isW?"Words: "+(state.writing[id]||"").trim().split(/\s+/).filter(Boolean).length:"Recording link / transcript")+'</div></div>'});return html}
function render(){document.getElementById("tabs").innerHTML=sections.map(([id,name],i)=>'<button class="tab '+(active===id?"active":"")+'" onclick="go(\''+id+'\')">'+(i+1)+'. '+esc(name)+(P.isSent(id)?" ✓":"")+'</button>').join("");let h="";if(active==="reading1"||active==="reading2"){let r=R[active==="reading1"?0:1];h='<div class="grid"><div>'+quizText([],r).replace(/<div class="card"><h2>[^]*?<\/div>$/,"")+'</div><div>'+quizText(r.qs,null)+'</div></div>'}else if(active==="vocab"||active==="grammar"){h=quizText(getQuestions(),null)}else if(active==="word"){h=wordText()}else{h=written(active)}if(!["writing","speaking"].includes(active)){h+='<div class="card bar"><div>'+(state.checked[active]?'<span class="status">Score: '+score(active)+' / '+count()+'</span>':'<span class="muted">Your choices are saved automatically.</span>')+'</div>'+(state.checked[active]||P.isSent(active)?"":'<button class="btn primary" onclick="check()">Check this unit</button>')+'</div>'}else{h+='<div class="card note">Complete all three answers to enable sending this section. Written tasks are assessed by your teacher.</div>'}document.getElementById("panel").innerHTML='<section class="panel on">'+h+'</section>';document.getElementById("send").innerHTML="";document.getElementById("send").appendChild(P.bar(()=>active))}
