<script>
const $id=id=>document.getElementById(id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pop(id){const e=$id(id);if(!e)return;e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')}
const SHAPES=['▲','◆','●','■'];

const VERBS=[
 {v:'cut back (on)',ru:'сокращать расходы (на что-то)',def:'spend less on something',ex:'We’re cutting back on takeaways this month.',note:'cut – cut – cut'},
 {v:'give away',ru:'отдавать даром, раздавать',def:'give something to someone for free',ex:'She gave her old bike away.',note:'SEPARABLE · give it away'},
 {v:'pay back',ru:'возвращать долг',def:'return money you borrowed',ex:'I’ll pay you back on Friday.',note:'SEPARABLE · pay me back'},
 {v:'rip off',ru:'обдирать, брать втридорога (разг.)',def:'charge someone far too much; cheat',ex:'That taxi driver ripped us off.',note:'INFORMAL · rip sb off'},
 {v:'run up',ru:'накопить (долг, большой счёт)',def:'let a bill or debt grow bigger and bigger',ex:'He ran up a huge phone bill.',note:'run – ran – run'},
 {v:'save up (for)',ru:'копить (на что-то)',def:'keep money so you can buy something later',ex:'I’m saving up for a laptop.',note:'save up FOR + noun'},
 {v:'sell out (of)',ru:'распродать(ся)',def:'have nothing left to sell',ex:'The tickets sold out in an hour.',note:'sell – sold – sold'},
 {v:'shop around',ru:'сравнивать цены, прицениваться',def:'compare prices in different places before buying',ex:'Shop around before you choose a phone plan.',note:'NO OBJECT'},
 {v:'splurge on',ru:'раскошелиться на что-то',def:'spend a lot on something special as a treat',ex:'We splurged on a fancy dinner.',note:'splurge ON + noun'},
 {v:'take back',ru:'вернуть покупку в магазин',def:'return something to the shop where you bought it',ex:'These shoes are too small — I’ll take them back.',note:'SEPARABLE · take it back'}
];
const BASE=VERBS.map(x=>x.v.replace(/ \(.*\)/,''));
function opts4(correct){const others=shuffle(BASE.filter(b=>b!==correct)).slice(0,3);return shuffle([correct,...others])}

const SITUATIONS=[
 ['The headphones you ordered stopped working after two days. Luckily, you still have the receipt.','take back'],

 ['A café next to the station charges £9 for a small bottle of water.','rip off'],

 ['Energy prices have gone up, so you decide to use the heating less.','cut back'],

];

 ['The limited-edition trainers <u>were all gone</u> within an hour.',['ran up','sold out','gave away'],1,'sold out = none left to buy.'],
 ['I’ll <u>return the money to you</u> on Friday, I promise.',['take you back','give you away','pay you back'],2,'pay sb back = return borrowed money.'],
 ['That tour guide <u>overcharged us</u> — £40 for a ten-minute walk!',['ripped us off','ran us up','sold us out'],0,'rip sb off = charge far too much.'],
 ['She’s <u>putting money aside</u> for a gap year.',['shopping around','saving up','cutting back'],1,'save up (for) = keep money for a goal.'],

const ACTS=[
 {id:'learn',n:'Meet the Verbs',s:'Tap to discover',ico:'💡',c:'t1'},
 {id:'cards',n:'Flashcards',s:'Quick recall',ico:'⚡',c:'t2'},

];
const KEY='katya_pv_money_v1';
let save={done:{},best:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.done&&s.best)save=s}catch(e){}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}}
function complete(id,score){save.done[id]=true;if(score!==undefined&&score>(save.best[id]||0))save.best[id]=score;persist();header()}
function header(){
 $id('dots').innerHTML=ACTS.map(a=>'<i class="'+(save.done[a.id]?'on':'')+'"></i>').join('');
 $id('progNum').textContent=ACTS.filter(a=>save.done[a.id]).length+'/'+ACTS.length;
}
function resetAll(){save={done:{},best:{}};persist();header();home()}

/* ---------- home ---------- */
let timerId=null;
function stopTimers(){if(timerId){clearInterval(timerId);timerId=null}}
function home(){
 stopTimers();
 $id('view').innerHTML='<p class="home-h">Choose an activity. Left to right is the best order — the Final Test comes last.</p><div class="tiles">'+ACTS.map(a=>'<button type="button" class="tile '+a.c+'" onclick="openAct(\''+a.id+'\')">'+(save.done[a.id]?'<span class="done">DONE</span>':'')+(save.best[a.id]?'<span class="rec">BEST '+save.best[a.id].toLocaleString('en-GB')+'</span>':'')+'<span class="ico">'+a.ico+'</span><b>'+a.n+'</b><small>'+a.s+'</small></button>').join('')+'</div>';
}
function frame(id,sub,hud){
 const a=ACTS.find(x=>x.id===id);
 $id('view').innerHTML='<div class="title"><div><h2>'+a.n+'</h2><p>'+sub+'</p></div><button class="navbtn" type="button" onclick="home()">← ALL ACTIVITIES</button></div>'+(hud||'')+'<div id="body"></div>';
}
function openAct(id){stopTimers();({learn:actLearn,cards:actCards,sit:actSit,swap:actSwap,story:actStory,type:actType,speak:actSpeak,final:actFinal})[id]()}
function nextAct(id){const i=ACTS.findIndex(a=>a.id===id);return i<ACTS.length-1?'<button class="navbtn g-start" type="button" onclick="openAct(\''+ACTS[i+1].id+'\')">NEXT: '+ACTS[i+1].n.toUpperCase()+' →</button>':'<button class="navbtn g-start" type="button" onclick="home()">ALL ACTIVITIES</button>'}

/* ---------- 1 learn ---------- */
function actLearn(){
 frame('learn','Guess the meaning first, then tap the card to check. Open all ten.');
 $id('body').innerHTML='<div class="learn">'+VERBS.map((x,i)=>'<button type="button" class="lc" data-i="'+i+'"><b>'+x.v+'</b><span class="def">'+x.def+'</span><span class="ru">'+x.ru+'</span><span class="ex">'+x.ex+'</span><span class="note">'+x.note+'</span><span class="hint">TAP TO REVEAL</span></button>').join('')+'</div><div class="g-row"><div class="g-msg" id="lmsg">0 / 10 opened</div><span id="lnext"></span></div>';
 document.querySelectorAll('.lc').forEach(c=>c.onclick=()=>{c.classList.add('open');const n=document.querySelectorAll('.lc.open').length;$id('lmsg').textContent=n+' / 10 opened';if(n===10){complete('learn');$id('lnext').innerHTML=nextAct('learn')}});
}

/* ---------- 2 flashcards ---------- */
function actCards(){
 frame('cards','Read the meaning, say the phrasal verb aloud, then flip. “Again” cards come back until you know them all.','<div class="g-hud"><div class="g-stat" id="cKnown"><small>KNOWN</small><b id="cK">0 / 10</b></div><div class="g-goal"><small><span>DECK</span><span id="cLeft"></span></small><div class="g-track"><i id="cBar"></i></div></div></div>');
 let deck=shuffle(VERBS),known=0;
 const draw=()=>{
  $id('cK').textContent=known+' / 10';$id('cBar').style.width=known*10+'%';$id('cLeft').textContent=deck.length+' LEFT';
  if(!deck.length){complete('cards');$id('body').innerHTML='<div class="g-stage"><div class="g-end"><p class="g-kicker">DECK CLEARED</p><h3>10 / 10 known</h3><p>Now use them under pressure.</p>'+nextAct('cards')+'</div></div>';return}
  const x=deck[0];
  $id('body').innerHTML='<div class="flip" id="flip"><button type="button" class="flip-in" aria-label="Flip the card"><span class="face"><small>WHICH PHRASAL VERB?</small><span class="mid">'+x.def+'</span><small>TAP TO FLIP</small></span><span class="face back"><span class="big">'+x.v+'</span><span class="ru">'+x.ru+'</span><span class="mid" style="font-size:15px;font-weight:500">'+x.ex+'</span></span></button></div><div class="fbtns"><button type="button" class="navbtn again" id="again" disabled>↺ AGAIN</button><button type="button" class="navbtn know" id="know" disabled>✓ I KNEW IT</button></div>';
  document.querySelector('.flip-in').onclick=()=>{$id('flip').classList.toggle('on');$id('again').disabled=$id('know').disabled=false};
  $id('again').onclick=()=>{deck.push(deck.shift());draw()};
  $id('know').onclick=()=>{deck.shift();known++;pop('cKnown');draw()};
 };
 draw();
}

/* ---------- quiz engine ---------- */
function quiz(cfg){
 // cfg: id, sub, items[{q,o,a,why,pre}], timed(ms), cols, kicker, after(i)
 frame(cfg.id,cfg.sub,'<div class="g-hud"><div class="g-stat" id="qP"><small>POINTS</small><b id="qPts">0</b></div><div class="g-stat" id="qS"><small>STREAK</small><b id="qStk">0</b></div><div class="g-stat"><small>BEST</small><b>'+(save.best[cfg.id]||0).toLocaleString('en-GB')+'</b></div><div class="g-goal"><small><span>'+cfg.kicker+'</span><span id="qCnt"></span></small><div class="g-track"><i id="qBar"></i></div></div></div>');
 let i=0,pts=0,stk=0,right=0,t0=0;const misses=[],items=cfg.items,MS=cfg.timed||20000;
 const hud=()=>{$id('qPts').textContent=pts.toLocaleString('en-GB');$id('qStk').textContent=stk>=2?'×'+stk:stk;$id('qCnt').textContent=Math.min(i+1,items.length)+' / '+items.length;$id('qBar').style.width=(i/items.length*100)+'%'};
 const show=()=>{
  hud();
  if(i>=items.length){
   const pass=right>=Math.ceil(items.length*.8);if(!cfg.needPass||pass)complete(cfg.id,pts);else{if(pts>(save.best[cfg.id]||0)){save.best[cfg.id]=pts;persist()}}
   $id('qBar').style.width='100%';
   $id('body').innerHTML='<div class="g-stage"><div class="g-end"><p class="g-kicker">'+right+' / '+items.length+' CORRECT'+(cfg.needPass?(pass?' · PASSED':' · 8 NEEDED TO PASS'):'')+'</p><h3>'+(cfg.needPass&&pass?'🏆 ':'')+pts.toLocaleString('en-GB')+' points</h3><p>'+(right===items.length?'Flawless.':right>=items.length*.8?'Strong round.':'Open “Meet the Verbs” again, then replay.')+'</p>'+(misses.length?'<div class="g-review">'+misses.join('')+'</div>':'')+'<button class="navbtn primary g-start" type="button" id="qAgain">PLAY AGAIN</button> '+nextAct(cfg.id)+'</div></div>';
   $id('qAgain').onclick=cfg.restart;return;
  }
  const it=items[i];
  $id('body').innerHTML=(cfg.pre?cfg.pre(i):'')+'<div class="g-stage" id="qStage"><div class="g-timer"><i id="qT"></i></div><p class="g-kicker">'+cfg.kicker+' '+(i+1)+' / '+items.length+'</p><p class="g-sentence" id="qQ">'+it.q+'</p><div class="g-opts'+(it.o.length===3?' three':'')+'" id="qO">'+it.o.map((o,k)=>'<button type="button" class="g-opt k'+k+'" data-i="'+k+'"><i>'+SHAPES[k]+'</i>'+o+'</button>').join('')+'</div><div class="g-row"><div class="g-msg" id="qM">The orange bar is your speed bonus.</div><button class="navbtn primary" id="qN" type="button" hidden>NEXT →</button></div></div>';
  $id('qO').querySelectorAll('.g-opt').forEach(b=>b.onclick=()=>pick(b));
  $id('qN').onclick=()=>{i++;show()};
  t0=Date.now();const t=$id('qT');t.style.width='100%';void t.offsetWidth;t.style.transition='width '+MS+'ms linear';t.style.width='0%';
 };
 const pick=btn=>{
  const it=items[i],ok=Number(btn.dataset.i)===it.a,m=$id('qM'),t=$id('qT');
  t.style.transition='none';t.style.width=getComputedStyle(t).width;
  $id('qO').querySelectorAll('.g-opt').forEach(b=>{b.disabled=true;b.classList.add(Number(b.dataset.i)===it.a?'hit':b===btn?'missed':'dim')});
  if(it.done)$id('qQ').innerHTML=it.done(ok);
  if(ok){stk++;right++;const p=500+Math.round(Math.max(0,1-(Date.now()-t0)/MS)*50)*10+Math.min(stk-1,5)*100;pts+=p;m.className='g-msg';m.innerHTML='<b>+'+p+'</b>'+(it.why?' · '+it.why:'');const f=document.createElement('div');f.className='g-float';f.textContent='+'+p;$id('qStage').appendChild(f);setTimeout(()=>f.remove(),1000);pop('qP');if(stk>=2)pop('qS')}
  else{stk=0;misses.push('<div>'+it.review+'</div>');m.className='g-msg bad';m.innerHTML='The answer is <b>'+it.o[it.a]+'</b>.'+(it.why?' '+it.why:'');$id('qStage').classList.add('shake')}
  hud();$id('qBar').style.width=((i+1)/items.length*100)+'%';
  const n=$id('qN');n.hidden=false;n.textContent=i===items.length-1?'SEE RESULT →':'NEXT →';n.focus();
 };
 show();
}
const gap=(s,w,cls)=>s.replace('___','<span class="blank '+(cls||'')+'">'+(w||'&nbsp;?&nbsp;')+'</span>');

function actSit(){
 const items=shuffle(SITUATIONS).map(([q,a])=>{const o=opts4(a);const d=VERBS[BASE.indexOf(a)];return {q,o,a:o.indexOf(a),why:d.v+' = '+d.def+'. <span class="ru">'+d.ru+'</span>',review:q+'<br><b>'+a+'</b> — '+d.def}});
 quiz({id:'sit',sub:'Read the situation and pick the phrasal verb that fits. Faster = more points.',items,kicker:'SITUATION',restart:actSit});
}
function actSwap(){
 const items=shuffle(SWAPS).map(([q,o,a,why])=>({q,o,a,why,review:q+'<br><b>'+o[a]+'</b> — '+why}));
 quiz({id:'swap',sub:'Replace the highlighted words with a phrasal verb in the right form.',items,kicker:'SENTENCE',restart:actSwap});
}
function actStory(){
 const items=STORY.map(([q,o,a],k)=>({q:gap(q.replace(' ___ to the shop',' to the shop').replace(' her ___.',' her.')),o,a,done:ok=>gap(q.replace(' it ___ to the shop',' to the shop').replace('___ her ___','___').replace('___ it','___'),STORY_FILL[k],ok?'good':'miss'),review:gap(q.replace(' it ___ to the shop',' to the shop').replace('___ her ___','___').replace('___ it','___'),STORY_FILL[k],'good')}));
 quiz({id:'story',sub:'Eight gaps, one story. The finished sentences build up above.',items,kicker:'PART',timed:25000,restart:actStory,
  pre:i=>i?'<p class="story">'+STORY.slice(0,i).map((s,k)=>s[0].replace(' it ___ to the shop',' to the shop').replace('___ her ___','___').replace('___ it','___').replace('___','<b>'+STORY_FILL[k]+'</b>')).join(' ')+'</p>':''});
}
function actFinal(){
 const items=shuffle(FINAL).map(([q,o,a])=>({q:gap(q),o,a,done:ok=>gap(q,o[a],ok?'good':'miss'),review:gap(q,o[a],'good')}));
 quiz({id:'final',sub:'Ten mixed questions. Get 8 right to pass and collect the trophy.',items,kicker:'QUESTION',timed:15000,needPass:true,restart:actFinal});
}

/* ---------- 6 type it ---------- */
function norm(s){return s.toLowerCase().replace(/[’‘`]/g,"'").replace(/[.!?,]+$/,'').replace(/\s+/g,' ').trim()}
function actType(){
 frame('type','No options this time. Type the phrasal verb in the right tense — and put the object in the right place.','<div class="g-hud"><div class="g-stat" id="tR"><small>CORRECT</small><b id="tRight">0</b></div><div class="g-stat"><small>BEST</small><b>'+(save.best.type||0)+' / 10</b></div><div class="g-goal"><small><span>SENTENCE</span><span id="tCnt"></span></small><div class="g-track"><i id="tBar"></i></div></div></div>');
 const items=shuffle(TYPES);let i=0,right=0,tries=0;const misses=[];
 const show=()=>{
  $id('tRight').textContent=right;$id('tCnt').textContent=Math.min(i+1,10)+' / 10';$id('tBar').style.width=i*10+'%';
  if(i>=10){complete('type',right);$id('body').innerHTML='<div class="g-stage"><div class="g-end"><p class="g-kicker">TYPING ROUND OVER</p><h3>'+right+' / 10</h3><p>'+(right>=9?'Tenses and word order under control.':'Check the forms below, then try again.')+'</p>'+(misses.length?'<div class="g-review">'+misses.join('')+'</div>':'')+'<button class="navbtn primary g-start" type="button" onclick="actType()">PLAY AGAIN</button> '+nextAct('type')+'</div></div>';return}
  const [q,hint]=items[i];tries=0;
  $id('body').innerHTML='<div class="g-stage" id="tStage"><p class="g-kicker">SENTENCE '+(i+1)+' / 10 · USE: '+hint.toUpperCase()+'</p><p class="g-sentence" id="tQ">'+gap(q)+'</p><form class="type-row" id="tForm" autocomplete="off"><input id="tIn" aria-label="Your answer" placeholder="Type the missing words…" autocapitalize="off" spellcheck="false"><button class="navbtn primary" id="tGo">CHECK</button></form><div class="g-row"><div class="g-msg" id="tM">Two tries per sentence.</div><button class="navbtn primary" id="tN" type="button" hidden>NEXT →</button></div><p class="bank">'+BASE.join(' · ')+'</p></div>';
  $id('tIn').focus();
  $id('tForm').onsubmit=e=>{e.preventDefault();check()};
  $id('tN').onclick=()=>{i++;show()};
 };
 const check=()=>{
  const [q,hint,acc]=items[i],inp=$id('tIn'),val=norm(inp.value),m=$id('tM');if(!val)return;
  const ok=acc.some(a=>norm(a)===val);tries++;
  if(ok||tries>=2){
   inp.disabled=true;$id('tGo').disabled=true;inp.className=ok?'good':'miss';
   $id('tQ').innerHTML=gap(q,acc[0],ok?'good':'miss');
   if(ok){right++;pop('tR');m.className='g-msg';m.innerHTML='<b>Correct'+(tries===1?' on the first try.':'.')+'</b>'}
   else{misses.push('<div>'+gap(q,acc[0],'good')+'</div>');m.className='g-msg bad';m.innerHTML='The answer is <b>'+acc[0]+'</b>.'}
   $id('tRight').textContent=right;$id('tBar').style.width=(i+1)*10+'%';
   const n=$id('tN');n.hidden=false;n.textContent=i===9?'SEE RESULT →':'NEXT →';n.focus();
  }else{inp.className='miss';m.className='g-msg bad';m.textContent='Not quite — check the tense and where the object goes. One more try.';$id('tStage').classList.add('shake');setTimeout(()=>$id('tStage').classList.remove('shake'),400);inp.select()}
 };
 show();
}

/* ---------- 7 speaking ---------- */
function actSpeak(){
 frame('speak','Draw a question and speak for 60 seconds. You must use the phrasal verb at least once. Three questions complete the round.','<div class="g-hud"><div class="g-stat" id="sA"><small>ANSWERED</small><b id="sN">0 / 3</b></div><div class="g-goal"><small><span>HOT SEAT</span><span>TEACHER DECIDES IF THE VERB WAS USED</span></small><div class="g-track"><i id="sBar"></i></div></div></div>');
 let deck=shuffle(SPEAK),n=0;
 const draw=()=>{
  stopTimers();$id('sN').textContent=n+' / 3';$id('sBar').style.width=Math.min(100,n/3*100)+'%';
  if(!deck.length)deck=shuffle(SPEAK);const [q,v]=deck.shift();let left=60,run=false;
  $id('body').innerHTML='<div class="g-stage"><div class="speak"><div class="ring" id="ring"><span id="sec">60</span></div><div><p class="g-kicker">YOUR QUESTION</p><p class="g-sentence">'+q+'</p><span class="must">MUST USE: '+v.toUpperCase()+'</span></div></div><div class="g-row" style="margin-top:16px"><div class="g-msg" id="sM">Press START when you’re ready.</div><div style="display:flex;gap:8px"><button class="navbtn" type="button" id="sSkip">ANOTHER QUESTION</button><button class="navbtn primary" type="button" id="sGo">START 60s</button><button class="navbtn know" type="button" id="sOk">✓ VERB USED</button></div></div>'+(n>=3?'<div class="g-end" style="padding-top:14px">'+nextAct('speak')+'</div>':'')+'</div>';
  const tick=()=>{left--;$id('sec').textContent=left;$id('ring').style.setProperty('--p',((60-left)/60*100)+'%');if(left<=0){stopTimers();$id('sM').textContent='Time! Did you use the verb?'}};
  $id('sGo').onclick=()=>{if(run)return;run=true;$id('sGo').disabled=true;$id('sM').textContent='Speak! Give a reason and an example.';timerId=setInterval(tick,1000)};
  $id('sSkip').onclick=draw;
  $id('sOk').onclick=()=>{n++;pop('sA');if(n>=3)complete('speak');draw()};
 };
 draw();
}

header();home();
</script>
</body>
</html>
