<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chat Reply: Across Generations</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:linear-gradient(135deg,#e8f0ff,#f6eef7 85%);--card:#fff;--ink:#14213d;--mute:#5b6784;--line:#d6deee;--blue:#2563eb;--ok:#1f9d55;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:linear-gradient(135deg,#0f1830,#1a1428);--card:#18223b;--ink:#e8eefc;--mute:#9fb0d3;--line:#2c3a5e}}
:root[data-theme="dark"]{--bg:linear-gradient(135deg,#0f1830,#1a1428);--card:#18223b;--ink:#e8eefc;--mute:#9fb0d3;--line:#2c3a5e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg) fixed;color:var(--ink);font:600 16px/1.45 "Nunito","Segoe UI",system-ui,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
h1,h2,.ttl,.pill,.see,.done{font-family:"Fredoka","Nunito","Segoe UI",sans-serif}
h1{margin:0;font-size:34px;line-height:1.1;font-weight:600}
.hd{display:flex;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.lg{position:relative;width:56px;height:56px;border-radius:16px;background:var(--blue);display:grid;place-items:center;font-size:28px}
.bd{position:absolute;top:-6px;right:-6px;background:#f0711f;color:#fff;border-radius:99px;min-width:22px;height:22px;font:800 13px/22px inherit;text-align:center}
.sub{margin:2px 0 0;color:var(--mute)}.vol{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:1px 10px;font-size:13px;font-weight:800;color:var(--ink)}
.hb{margin-left:auto;display:flex;gap:8px}
.pb{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:10px 16px;font:800 15px inherit;color:var(--ink);cursor:pointer}
.score{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:800;margin-bottom:14px;display:inline-block}
.sec{border-radius:20px;padding:12px;margin-bottom:16px}
.sec.Easy{background:rgba(31,167,90,.13)}.sec.Medium{background:rgba(240,138,36,.15)}.sec.Hard{background:rgba(225,45,80,.12)}.sec.G{background:rgba(37,99,235,.10)}
.st{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-weight:800}
.pill{color:#fff;padding:3px 16px;border-radius:99px;font-size:16px;font-weight:600;display:inline-block}
.pill.Easy{background:#1fa75a}.pill.Medium{background:#e08a1a}.pill.Hard{background:#e11d48}.pill.G{background:var(--blue)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{position:relative;display:flex;padding:0;height:148px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;color:inherit;font:inherit}
.card:hover,.card:focus-visible{border-color:var(--blue)}
.ph{flex:none;width:104px}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ct{flex:1;min-width:0;padding:10px 12px;display:flex;flex-direction:column}
.ct b{font-size:17px;font-weight:800}
.rl{font-style:normal;font-size:13px;font-weight:800;color:#b42350}
.pv{font-weight:800;margin-top:4px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-size:15px}
.ct em{margin-top:auto;align-self:flex-end;font-style:normal;color:var(--mute);font-size:13px}
.dot{position:absolute;top:10px;right:10px;width:14px;height:14px;border-radius:50%;background:var(--blue);border:2px solid var(--card)}
.gb{display:flex;gap:10px;flex-wrap:wrap}.gb .go{margin:0;width:auto;padding:12px 20px}
.top,.ch{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.ch .ttl{margin:0 auto;font-size:22px;font-weight:600}
.back{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:9px 16px;font:800 15px inherit;cursor:pointer}
.layout{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}
@media (max-width:780px){.layout{grid-template-columns:1fr}}
.chat{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.head{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.av{flex:none;width:48px;height:48px;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:24px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who{font-weight:800;font-size:18px}.age{color:var(--mute);font-weight:700;font-size:14px}
.msgs{padding:16px;min-height:240px;display:flex;flex-direction:column;gap:10px;background:rgba(37,99,235,.05)}
.chip{align-self:center;background:var(--card);border-radius:99px;padding:1px 12px;font-size:12px;font-weight:800;color:var(--mute)}
.b{max-width:84%;padding:10px 14px;border-radius:16px;font-weight:700}
.in{background:var(--card);border-bottom-left-radius:4px;align-self:flex-start}
.out{background:var(--blue);color:#fff;border-bottom-right-radius:4px;align-self:flex-end}
.tag{display:inline-block;font-size:12px;font-weight:800;background:rgba(255,255,255,.22);border-radius:99px;padding:0 8px;margin-bottom:4px}
.tm2{display:block;text-align:right;font-size:12px;opacity:.7;margin-top:2px}
.out u{text-decoration-thickness:2px;text-underline-offset:3px}
.cm{margin-top:12px;border:2px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--mute);font-weight:800;background:var(--card)}
.cm.col{flex-direction:column;align-items:stretch;justify-content:flex-start}
.tb{border:0;border-radius:99px;background:rgba(37,99,235,.14);color:var(--blue);padding:8px 14px;font:800 14px inherit;cursor:pointer;white-space:nowrap}
textarea{width:100%;min-height:80px;border:1px solid var(--line);border-radius:12px;padding:10px;background:transparent;color:var(--ink);font:inherit;resize:vertical}
.btns{display:flex;gap:8px;margin-top:8px}
.p{border:0;border-radius:12px;padding:10px 18px;font:800 15px inherit;background:var(--blue);color:#fff;cursor:pointer}
.side{display:grid;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.panel h3{margin:0;padding:8px 14px;font:600 16px "Fredoka","Nunito",sans-serif;color:#fff;background:linear-gradient(90deg,#fb923c,#ea580c)}
.panel.chk h3{background:linear-gradient(90deg,#3b82f6,#2563eb)}
.panel p{margin:0;padding:12px 14px 6px;font-weight:800;font-size:19px;line-height:1.3}
.panel label{display:flex;gap:10px;align-items:center;padding:9px 14px;font-weight:800;cursor:pointer}
.panel input{width:20px;height:20px;accent-color:var(--ok)}
.panel h3.gh{background:linear-gradient(90deg,#34d399,#059669)}.chps{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px}.chp{background:rgba(31,157,85,.14);color:var(--ink);border-radius:99px;padding:4px 12px;font-weight:800;font-size:15px}.fc{perspective:1000px;max-width:560px;margin:0 auto}.fi{position:relative;height:300px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}.fi.fl{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.fi{transition:none}}
.ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--card);border:1px solid var(--line);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;box-shadow:0 6px 24px rgba(37,99,235,.12)}
.ff.bk{transform:rotateY(180deg);background:linear-gradient(135deg,#eff6ff,#e0ecff);color:#14213d}
.ft{font:600 30px/1.25 "Fredoka","Nunito",sans-serif}.fs{color:var(--mute);font-size:14px;font-weight:800}
.ff.bk .fs{color:#51607f}
.sp{border:0;background:rgba(37,99,235,.14);color:var(--blue);border-radius:99px;padding:10px 18px;font:800 16px inherit;cursor:pointer}
.fn{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:16px;flex-wrap:wrap}
.pr{height:8px;background:var(--line);border-radius:99px;max-width:560px;margin:0 auto 16px;overflow:hidden}.pr i{display:block;height:100%;background:var(--blue);transition:width .3s}
.pb.kn{background:#1f9d55;color:#fff;border-color:#1f9d55}.pb.dk{background:#e11d48;color:#fff;border-color:#e11d48}
.note{color:var(--mute);font-size:14px;padding:0 14px 12px;font-weight:700}
.cm .note{padding:6px 0 0}
.see,.done{width:100%;border:0;border-radius:14px;padding:15px;font-size:19px;font-weight:600;color:#fff;cursor:pointer;margin-top:12px}
.see{background:linear-gradient(135deg,#3b82f6,#1d4ed8)}.done{background:linear-gradient(135deg,#22c55e,#15803d)}.done.sm{width:auto;margin:0;padding:10px 22px;font-size:16px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px 16px}
.opt{display:flex;align-items:center;gap:10px;background:transparent;border:2px solid var(--line);border-radius:12px;padding:8px;font:800 15px inherit;color:var(--ink);cursor:pointer}
.opt.good{border-color:var(--ok)}.opt.bad{border-color:#e11d48}
.clue{padding:0 16px 14px;color:var(--mute);font-weight:700}
.go{display:block;width:100%;margin-top:14px;padding:12px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:800 16px inherit;cursor:pointer}
.tm{margin-left:auto;font-weight:800;color:#e0701a}
.ov{position:fixed;inset:0;background:rgba(10,20,40,.5);display:grid;place-items:center;padding:16px;z-index:9}
.md{background:var(--card);border-radius:22px;max-width:860px;max-height:92vh;overflow:auto;width:100%}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line)}.mh h2{margin:0;font-size:24px;font-weight:600}
.mb{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding:18px 22px}
@media (max-width:700px){.mb{grid-template-columns:1fr}}
.mb ol,.mb ul{margin:8px 0 0;padding-left:20px}.mb li{margin-bottom:8px}
.tg{background:rgba(37,99,235,.14);color:var(--blue);border-radius:99px;padding:2px 14px;font-weight:800}.tg.t2{background:rgba(240,113,31,.18);color:#c2501a}
.wsi{border-bottom:1px solid var(--line);padding:10px 0;break-inside:avoid}.wsi p{margin:4px 0}.mu{color:var(--mute)}.mo{color:var(--ok)}
.ln{border-bottom:1px solid var(--mute);height:26px}
@media print{.np,.hb,.score{display:none!important}body{background:#fff;color:#000}}
</style>
</head>

 if(reset||!fc.l.length){fc.l=cardsList();fc.i=0;fc.fl=false;fc.kn={}}
 var c=fc.l[fc.i];
 if(!c){var n=Object.keys(fc.kn).length;app.innerHTML='<div class="top"><button class="back" id="bk">‹ Inbox</button></div><div class="chat"><div class="msgs"><div class="who">All cards done! You know '+n+' of '+fc.l.length+'.</div><button class="go" id="again">Study the cards you missed</button><button class="go" id="all">Start again</button></div></div>';
  document.getElementById("bk").onclick=inbox;
  document.getElementById("all").onclick=function(){cards(true)};
  document.getElementById("again").onclick=function(){var m=fc.l.filter(function(x){return !fc.kn[x.en]});if(!m.length)return cards(true);fc.l=m;fc.i=0;fc.fl=false;fc.kn={};cards()};return}
 app.innerHTML='<div class="top"><button class="back" id="bk">‹ Inbox</button><span class="age" style="margin-left:auto">'+(fc.i+1)+' / '+fc.l.length+'</span></div><div class="pr"><i style="width:'+(fc.i/fc.l.length*100)+'%"></i></div><div class="fc"><div class="fi'+(fc.fl?' fl':'')+'" id="fi"><div class="ff"><span class="fs">English · tap to flip</span><div class="ft">'+esc(c.en)+'</div><button class="sp" id="sp">🔊 Listen</button></div><div class="ff bk"><span class="fs">Перевод</span><div class="ft">'+esc(c.ru)+'</div><span class="fs">from the chat with '+esc(c.who)+'</span><button class="sp" id="sp2">🔊 Listen</button></div></div></div><div class="fn"><button class="pb" id="pv">‹ Back</button><button class="pb dk" id="dk">Still learning</button><button class="pb kn" id="kw">I know it</button><button class="pb" id="nx">Next ›</button></div><div class="fn"><button class="pb" id="sh">Shuffle</button></div>';
 document.getElementById("bk").onclick=function(){try{speechSynthesis.cancel()}catch(e){}inbox()};
 document.getElementById("fi").onclick=function(){fc.fl=!fc.fl;this.classList.toggle("fl")};
 function sp(id){document.getElementById(id).onclick=function(e){e.stopPropagation();say(c.en)}}
 sp("sp");sp("sp2");
 function go(n){fc.i=Math.max(0,Math.min(fc.l.length,fc.i+n));fc.fl=false;cards()}
 document.getElementById("pv").onclick=function(){go(-1)};
 document.getElementById("nx").onclick=function(){go(1)};
 document.getElementById("kw").onclick=function(){fc.kn[c.en]=1;go(1)};
 document.getElementById("dk").onclick=function(){delete fc.kn[c.en];go(1)};
 document.getElementById("sh").onclick=function(){fc.l.sort(function(){return Math.random()-.5});fc.i=0;fc.fl=false;cards()};
}
var app=document.getElementById("app"),view="inbox",TYPE=/[?&]type/.test(location.search);
S.read={};
var T={1:"6:42 PM",2:"5:15 PM",3:"1:04 AM",4:"4:03 PM",5:"2:30 PM",6:"7:10 PM",7:"4:47 PM",8:"10:40 AM",9:"1:30 PM",10:"9:12 PM"};
var LV=[["Easy","Everyday messages"],["Medium","Mixed situations"],["Hard","Tricky situations"]],ORD=[];
function esc(s){return s.replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function rel(d){return d.age.split(", ")[1]}
function now(){return new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})}
function get(id){return D.filter(function(x){return x.id===id})[0]}
function hd(){var u=D.filter(function(d){return !S.read[d.id]}).length;
 return '<header class="hd"><div class="lg">💬'+(u?'<span class="bd">'+u+'</span>':'')+'</div><div><h1>Chat Reply</h1><p class="sub">What would you say? <span class="vol">B2</span></p></div><div class="hb"><button class="pb" id="hp">? How to use</button><button class="pb" id="ws">🖨 Worksheet</button></div></header>'}
function wire(){document.getElementById("hp").onclick=help;document.getElementById("ws").onclick=sheet}
function inbox(){
 view="inbox";ORD=[];
 var h=hd()+'<div class="score">Total score: '+tot()+' / '+MX()+'</div>';
 LV.forEach(function(L){var l=D.filter(function(d){return d.lvl===L[0]});
  h+='<section class="sec '+L[0]+'"><div class="st"><span class="pill '+L[0]+'">'+L[0]+'</span>'+L[1]+'</div><div class="grid">';
  l.forEach(function(d){ORD.push(d.id);h+='<button class="card" data-id="'+d.id+'"><span class="ph"><img src="'+IMG[d.id]+'" alt=""></span><span class="ct"><b>'+d.name+'</b><i class="rl">'+rel(d)+'</i><span class="pv">'+esc(d.msg)+'</span><em>'+(S.c[d.id]!=null?'✓ '+S.c[d.id]+'/'+d.chk.length+'  ':'')+T[d.id]+'</em></span>'+(S.read[d.id]?'':'<span class="dot"></span>')+'</button>'});
  h+='</div></section>'});
 h+='<section class="sec G"><div class="st"><span class="pill G">Cards</span>Useful language</div><div class="gb"><button class="go" id="wc2">🔊 Flashcards: phrases, audio, translation</button></div></section>'+'<section class="sec G"><div class="st"><span class="pill G">Game</span>Who is replying?</div><div class="gb"><button class="go" id="wq">Guess the generation</button><button class="go" id="wt">Timed round: 15 seconds</button></div></section>';
 app.innerHTML=h;wire();
 app.querySelectorAll(".card").forEach(function(b){b.onclick=function(){chat(+b.dataset.id)}});
 document.getElementById("wc2").onclick=function(){cards(true)};
 document.getElementById("wq").onclick=function(){view="quiz";start(false)};
 document.getElementById("wt").onclick=function(){view="quiz";start(true)};
}
function chat(id){
 view="chat";var d=get(id);S.read[id]=1;
 app.innerHTML='<header class="ch"><button class="back" id="bk">‹ Inbox</button><div class="ttl">💬 Chat Reply</div><span class="pill '+d.lvl+'">'+d.lvl+'</span></header><div class="layout"><div><div class="chat"><div class="head">'+A(d)+'<div><div class="who">'+d.name+'</div><div class="age">'+d.age+'</div></div></div><div class="msgs" id="m"><span class="chip">Today</span><div class="b in">'+esc(d.msg)+'<span class="tm2">'+T[id]+'</span></div></div></div><div class="cm" id="cm"></div></div><div class="side"><div class="panel"><h3>🎯 Your situation</h3><p>'+d.sit+'</p></div><div class="panel"><h3 class="gh">💡 Useful language</h3><div class="chps">'+d.ph.map(function(x){return '<span class="chp">'+esc(x)+'</span>'}).join('')+'</div></div><div id="act"><button class="see" id="ex">👁 See an example</button></div></div></div>';
 document.getElementById("bk").onclick=inbox;
 var m=document.getElementById("m"),cm=document.getElementById("cm");
 function box(){
  cm.className="cm col";
  cm.innerHTML='<textarea id="t" placeholder="Type your reply here."></textarea><div class="note" id="wc">Words: 0 (aim for 35 to 55)</div><div class="btns"><button class="p" id="send">Send</button></div>';
  var t=document.getElementById("t"),wc=document.getElementById("wc");
  t.oninput=function(){var n=t.value.trim()?t.value.trim().split(/\s+/).length:0;wc.textContent="Words: "+n+" (aim for 35 to 55)";wc.style.color=(n>=35&&n<=55)?"var(--ok)":""};
  document.getElementById("send").onclick=function(){var v=t.value.trim();if(!v)return;m.insertAdjacentHTML("beforeend",'<div class="b out">'+esc(v)+'<span class="tm2">'+now()+' ✓✓</span></div>');t.value="";t.oninput()};
 }
 if(TYPE)box();else{cm.innerHTML='<span>✎ Write your reply first, on paper or in your notebook.</span><button class="tb" id="ty">⌨ Type it instead</button>';document.getElementById("ty").onclick=box}
 document.getElementById("ex").onclick=function(){
  m.insertAdjacentHTML("beforeend",'<div class="b out"><span class="tag">☆ One example</span><br>'+d.ex+'<span class="tm2">'+now()+' ✓✓</span></div>');
  var a=document.getElementById("act"),h='<div class="panel chk"><h3>✓ Check your reply</h3>';
  d.chk.forEach(function(c){h+='<label><input type="checkbox">'+c+'</label>'});
  a.innerHTML=h+'</div><button class="done" id="dn">✓ Done</button>';
  a.querySelectorAll("input").forEach(function(c){c.onchange=function(){S.c[id]=a.querySelectorAll("input:checked").length}});
  document.getElementById("dn").onclick=inbox;
 };
}
function help(){
 if(document.getElementById("hv"))return;
 var o=document.createElement("div");o.className="ov";o.id="hv";
 o.innerHTML='<div class="md"><div class="mh"><h2>How to use Chat Reply</h2><button class="done sm" id="gi">Got it</button></div><div class="mb"><div><span class="tg">Students</span><ol><li><b>Pick a message.</b> Easy ones are on top, Hard ones below.</li><li><b>Read the message</b> and <b>Your situation</b>. Who is it from? What do you know?</li><li><b>Write your reply</b> on paper (35 to 55 words). Tap <b>Type it instead</b> to count words on screen.</li><li><b>Tap See an example.</b> Compare it with your reply, then tick the boxes in <b>Check your reply</b>.</li><li><b>Tap Done.</b> Then try the <b>Who is replying?</b> game.</li></ol></div><div><span class="tg t2">Teachers</span><ul><li><b>One message at a time.</b> Give a few minutes to write, then show the example and discuss.</li><li><b>No single right answer.</b> Use the check boxes to talk about replies.</li><li><b>Useful language</b> gives B2 phrases for each message.</li><li><b>Worksheet</b> prints all 10 messages. Tick Show model replies for an answer key.</li><li><b>Homework link:</b> add ?type to the end of the link and the typing box is already open.</li><li><b>New class?</b> Reload the page and every message is unread again.</li><li><b>Keys:</b> 1 to 9 and 0 open a message, Esc back, H help, W worksheet.</li></ul></div></div></div>';
 document.body.appendChild(o);
 function cl(){o.remove()}
 document.getElementById("gi").onclick=cl;o.onclick=function(e){if(e.target===o)cl()};
}
function sheet(){
 view="sheet";var mo=false;
 function draw(){
  var h='<div class="top np"><button class="back" id="bk">‹ Inbox</button><label><input type="checkbox" id="sm"'+(mo?' checked':'')+'> Show model replies</label><button class="done sm" id="pr" style="margin-left:auto">🖨 Print</button></div><h1>Chat Reply: worksheet</h1><p class="sub">Name: ____________________ Write a reply of 35 to 55 words.</p>';
  D.forEach(function(d,i){h+='<div class="wsi"><b>'+(i+1)+'. '+d.name+' ('+rel(d)+')</b><p>'+esc(d.msg)+'</p><p class="mu">'+d.sit+'</p>'+(mo?'<p class="mo">Model: '+d.ex+'</p>':'<div class="ln"></div><div class="ln"></div><div class="ln"></div>')+'</div>'});
  app.innerHTML=h;
  document.getElementById("bk").onclick=inbox;
  document.getElementById("sm").onchange=function(){mo=this.checked;draw()};
  document.getElementById("pr").onclick=function(){try{window.print()}catch(e){}};
 }
 draw();
}
document.addEventListener("keydown",function(e){
 var t=e.target.tagName;if(t==="TEXTAREA"||t==="INPUT")return;var k=e.key;
 if(k==="Escape"){var o=document.getElementById("hv");if(o)o.remove();else if(view!=="inbox"){clearInterval(tm);try{speechSynthesis.cancel()}catch(x){}inbox()}return}
 if(k==="h"||k==="H")return help();
 if(k==="w"||k==="W")return sheet();
 if(view==="cards"){if(k===" "){e.preventDefault();var f=document.getElementById("fi");if(f)f.click()}else if(k==="ArrowRight"){var n=document.getElementById("nx");if(n)n.click()}else if(k==="ArrowLeft"){var b=document.getElementById("pv");if(b)b.click()}return}
 if(view==="inbox"&&/^[0-9]$/.test(k)){var i=k==="0"?9:+k-1;if(ORD[i])chat(ORD[i])}
});
function quiz(){
 clearInterval(tm);
 var a=Q.a[qi];
 if(!a){
  if(timed)S.t=Math.max(S.t,qs);else S.q=Math.max(S.q,qs);
  app.innerHTML='<div class="top"><button class="back" id="bk">‹ Inbox</button></div><div class="chat"><div class="msgs"><div class="who">Done! Round score: '+qs+' / '+Q.a.length+'</div><div class="who">Total score: '+tot()+' / '+MX()+'</div><div class="age">Tip: notice greetings, slang, sentence length and emojis.</div></div></div>';
  document.getElementById("bk").onclick=inbox;return}
 var h='<div class="top"><button class="back" id="bk">‹ Inbox</button><span class="age" style="margin-left:auto">'+(qi+1)+' / '+Q.a.length+'</span></div><div class="chat"><div class="head"><div><div class="who">Who is replying?</div><div class="age">Everyone got the same message. Guess who wrote the answer.</div></div>'+(timed?'<span class="tm" id="tmr">15 s</span>':'')+'</div><div class="msgs"><div class="b in">'+esc(Q.ask)+'</div><div class="b out">'+esc(a.t)+'</div></div><div class="opts">';
 D.forEach(function(d){h+='<button class="opt" data-id="'+d.id+'">'+A(d)+'<span>'+d.name+'</span></button>'});
 app.innerHTML=h+'</div><div class="clue" id="cl"></div></div>';
 document.getElementById("bk").onclick=function(){clearInterval(tm);inbox()};
 function reveal(id){
  clearInterval(tm);
  var ok=id===a.w;if(ok)qs++;
  app.querySelectorAll(".opt").forEach(function(o){o.disabled=true;if(+o.dataset.id===a.w)o.classList.add("good");else if(+o.dataset.id===id)o.classList.add("bad")});
  document.getElementById("cl").innerHTML=(id===null?"Time is up. ":ok?"Correct! ":"Not quite. ")+esc(a.c)+'<button class="go" id="nx">Next</button>';
  document.getElementById("nx").onclick=function(){qi++;quiz()};
 }
 app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){reveal(+b.dataset.id)}});
 if(timed){left=15;var el=document.getElementById("tmr");tm=setInterval(function(){left--;el.textContent=left+" s";if(left<=0)reveal(null)},1000)}
}
inbox();
</script>
</body>
</html>
