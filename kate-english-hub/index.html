<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kate's Homework</title>
<style>
:root{
  --teal:#1197a5;
  --teal-dark:#087d89;
  --ink:#182229;
  --muted:#5b6970;
  --line:rgba(20,65,72,.14);
  --shadow:0 18px 50px rgba(13,37,43,.20);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#d8e3e4}
button,a{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}
.sidebar{
  position:sticky;top:0;height:100vh;z-index:10;background:rgba(255,255,255,.97);
  border-right:1px solid rgba(0,0,0,.08);padding:10px 10px 14px;
  display:flex;flex-direction:column;gap:7px;box-shadow:10px 0 30px rgba(0,0,0,.08);
  overflow-y:auto
}
.logo{
  background:#fff;border-radius:0 0 16px 16px;padding:8px 7px 7px;text-align:center;
  box-shadow:0 7px 18px rgba(0,0,0,.06);border:1px solid #e5eaeb
}
.logo .kate{font-size:16px;font-weight:900;color:var(--teal);letter-spacing:.04em}
.logo .homework-title{font-size:15px;font-weight:900;line-height:1.05}
.logo .motto{font-size:6.8px;font-weight:800;letter-spacing:.07em;margin-top:5px}
.big-btn{
  width:100%;border:0;border-radius:10px;padding:9px 10px;text-align:left;font-weight:900;color:#263238;
  background:#eef4f4;display:flex;align-items:center;justify-content:space-between;gap:9px
}
.big-btn.active{background:linear-gradient(135deg,var(--teal),#39adba);color:white}
.big-btn.homework{background:linear-gradient(135deg,#ffef9c,#ffe276);color:#3a3425;border:1px solid rgba(172,136,0,.22)}
.big-btn:hover{filter:brightness(.98)}
.modules-panel{
  display:none;
  padding:3px 0 6px;
}
.modules-panel.open{display:block}
.module-item{margin:4px 0}
.module-toggle{
  width:100%;border:0;border-radius:9px;padding:7px 9px;background:#dceff1;color:#28464b;
  font-weight:900;text-align:left;display:flex;justify-content:space-between;align-items:center
}
.module-toggle.open{background:#bfe5e8;color:#0b6872}
.lesson-list{display:none;padding:5px 4px 1px 9px}
.lesson-list.open{display:grid;gap:4px}
.lesson-list button{
  width:100%;border:1px solid #d9e6e8;background:#fff;border-radius:8px;padding:7px 8px;
  font-size:12px;font-weight:800;color:#30494e;text-align:left;display:flex;justify-content:space-between;align-items:center
}
.lesson-list button:hover{background:#f5fbfb}
.side-bottom{margin-top:auto;display:grid;gap:4px}
.side-simple{border:0;background:transparent;text-align:left;padding:7px 7px;border-radius:8px;font-weight:700;color:#263238}
.side-simple:hover{background:#eef4f4}
.homework-focus{
  position:relative;background:linear-gradient(135deg,#fff1a8,#ffd85e)!important;
  color:#4b3a00!important;border:2px solid #f0bd24!important;font-weight:900!important;
  box-shadow:0 0 0 0 rgba(240,189,36,.45);animation:homeworkPulse 1.8s infinite
}
.hw-badge{
  display:inline-block;margin-left:5px;padding:2px 5px;border-radius:999px;
  background:#c72b3d;color:#fff;font-size:8px;letter-spacing:.07em;vertical-align:1px
}
@keyframes homeworkPulse{0%,100%{box-shadow:0 0 0 0 rgba(240,189,36,.42)}50%{box-shadow:0 0 0 8px rgba(240,189,36,0)}}

.workspace{position:relative;min-height:100vh;overflow:hidden;background:#253036}
.photo-bg{
  position:absolute;inset:0;background:
    linear-gradient(90deg,rgba(28,41,45,.28),rgba(19,29,32,.02) 32%,rgba(15,24,27,.08)),
    linear-gradient(0deg,rgba(12,20,22,.24),transparent 33%),
    radial-gradient(circle at 56% 36%,#9ca9a2,#39484a 72%);
  background-size:cover;background-position:center;transform:scale(1.01)
}
.photo-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.13),transparent 35%,rgba(0,0,0,.05))}
.welcome{
  position:absolute;z-index:3;left:36px;top:28px;max-width:540px;color:white;
  text-shadow:0 3px 12px rgba(0,0,0,.38)
}
.welcome h1{font-size:25px;margin:0 0 4px}
.welcome p{margin:0;font-size:15px;font-weight:700}
.top-note{
  position:absolute;right:28px;top:24px;z-index:3;width:255px;background:rgba(255,255,255,.90);
  border:1px solid rgba(255,255,255,.8);padding:16px 18px;border-radius:3px;transform:rotate(-2deg);
  box-shadow:var(--shadow);text-align:center
}
.top-note .line1{font-family:Georgia,serif;font-style:italic;font-size:21px;line-height:1.05}
.top-note .line2{font-size:11px;font-weight:700;color:#53656b;margin-top:8px}
.bottom-nav{
  position:absolute;z-index:5;left:28px;right:25px;bottom:18px;height:150px;
  background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.9);
  border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;
  box-shadow:0 12px 30px rgba(0,0,0,.16);backdrop-filter:blur(9px)
}
.skill{
  border:1px solid rgba(20,65,72,.12);background:linear-gradient(#fff,#edf6f6);
  border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center
}
.skill:hover{transform:translateY(-2px);transition:.16s}
.skill .ico{font-size:28px;color:var(--teal);height:33px}
.skill strong{font-size:15px;margin-top:5px}
.skill small{font-size:11px;color:#66747a;line-height:1.16;margin-top:4px}

/* Full-screen lesson viewer */
.lesson-view{
  position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:120;background:#fff;
  display:none;flex-direction:column;overflow:hidden
}
.lesson-view.on{display:flex}
.lesson-view-bar{
  flex:0 0 58px;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 14px;background:linear-gradient(135deg,#0d7f8b,#169ca9);color:#fff;
  box-shadow:0 4px 16px rgba(0,0,0,.14)
}
.lesson-view-title{
  min-width:0;font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.lesson-view-actions{display:flex;gap:8px;flex:none}
.lesson-view-actions button{
  border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.95);color:#155961;font-weight:900
}
.lesson-frame{display:block;width:100%;flex:1 1 auto;min-height:0;border:0;background:#fff}
body.lesson-open{overflow:hidden}

.modal{position:fixed;inset:0;z-index:80;background:rgba(4,18,22,.58);display:none;place-items:center;padding:24px}
.modal.on{display:grid}
.modal-card{width:min(600px,92vw);background:#fff;border-radius:22px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.28)}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-card h2{margin:0;color:#106f79}
.close{border:0;background:#edf5f5;border-radius:9px;padding:7px 10px;font-weight:800}
.modal-card p{color:#5b6970;line-height:1.55}
.modal-actions button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:#edf4f4;color:#2f4449}


.schedule-strip{
  position:absolute;z-index:6;top:22px;left:50%;transform:translateX(-50%);
  display:flex;gap:7px;align-items:center;justify-content:center;
  padding:6px 8px;border:1px solid rgba(255,255,255,.70);
  border-radius:14px;background:rgba(255,255,255,.88);
  box-shadow:0 10px 26px rgba(0,0,0,.13);backdrop-filter:blur(10px)
}
.schedule-strip .slot{
  display:flex;align-items:center;gap:6px;white-space:nowrap;
  padding:6px 9px;border-radius:10px;background:rgba(238,247,247,.95);
  color:#24464c;font-size:11px;font-weight:900
}
.schedule-strip .day{color:var(--teal-dark);letter-spacing:.02em}
.schedule-strip .time{color:#53656b;font-weight:800}
@media(max-width:1000px){.schedule-strip{top:78px}.schedule-strip .slot{font-size:10px;padding:5px 7px}}
@media(max-width:760px){.schedule-strip{position:absolute;top:82px;left:18px;right:18px;transform:none;flex-wrap:wrap}.schedule-strip .slot{flex:1 1 auto;justify-content:center}}

@media(max-width:1000px){
  .app{grid-template-columns:190px 1fr}
  .top-note{right:18px;width:220px}
  .skill strong{font-size:13px}.skill small{font-size:10px}
}
@media(max-width:760px){
  .app{display:block}.sidebar{position:relative;width:100%;height:auto;max-height:none}
  .workspace{min-height:980px}.top-note{display:none}  .welcome{left:18px}
  .bottom-nav{left:18px;right:18px;height:auto;grid-template-columns:repeat(2,1fr)}
}
</style>

<style id="teacherModeStyle">

}

    linear-gradient(180deg,rgba(255,255,255,.03),rgba(20,37,41,.08)),

}
#teacherRoot .t-cover:after{
  content:"KATYA · ENGLISH";

  letter-spacing:.18em;text-shadow:0 2px 10px rgba(0,0,0,.34)
}
#teacherRoot .t-view{position:absolute;inset:0;display:none;background:#fff;z-index:4}
#teacherRoot .t-view.on{display:grid;grid-template-rows:44px 1fr}
#teacherRoot .t-top{display:flex;align-items:center;gap:8px;background:#173f49;color:#fff;padding:6px 9px}
#teacherRoot .t-back,#teacherRoot .t-notesbtn{

}
#teacherRoot .t-back{background:#719da8;color:#fff}
#teacherRoot .t-notesbtn{margin-left:auto;background:rgba(255,255,255,.12);color:#fff}
#teacherRoot .t-title{font-size:11px;font-weight:800}
#teacherRoot .t-framewrap{position:relative;min-height:0}
#teacherRoot iframe{width:100%;height:100%;border:0;background:#fff}
#teacherRoot .t-placeholder{position:absolute;inset:0;display:none;place-items:center;background:#f5f7f6}
#teacherRoot .t-placeholder.on{display:grid}
#teacherRoot .t-placeholder>div{
  background:#fff;border:1px solid #d8e2e1;border-radius:16px;
  padding:24px;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.08)
}
#teacherRoot .t-placeholder h2{margin:0 0 7px}
#teacherRoot .t-placeholder p{margin:0;color:#6b777a;font-size:12px}

  display:none;flex-direction:column;box-shadow:0 14px 35px rgba(0,0,0,.16)
}
#teacherRoot .t-notes.on{display:flex}
#teacherRoot .t-notes h3{margin:0 0 7px;font-size:13px}
#teacherRoot .t-notes textarea{
  flex:1;min-height:0;border:1px solid #d8e2e1;border-radius:9px;padding:9px;resize:none
}
#teacherRoot .t-noteactions{display:flex;gap:6px;margin-top:7px}
#teacherRoot .t-noteactions button{border:0;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:800}
#teacherRoot .t-save{background:#5f959f;color:#fff}
#teacherRoot .t-clear{background:#eef2f1;color:#385158}
@media(max-width:820px){
  #teacherRoot .t-side{width:185px}
}

/* Uploaded Katya design: original artwork with accessible live controls. */
#teacherRoot{color:#352323;background:#f3e8df;height:100dvh}
#teacherRoot .t-cover{background:none;transform:none}
#teacherRoot .t-cover::before,#teacherRoot .t-cover::after{display:none}
#teacherRoot .t-art{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}

#teacherRoot .t-notes textarea{font-size:16px}
#teacherRoot .t-noteactions button{font-size:14px}

#teacherRoot .t-module-dialog{position:absolute;z-index:15;left:19%;top:20%;width:min(400px,77vw);padding:22px;background:#fff7f2;border:1px solid #dfc2b8;border-radius:18px;box-shadow:0 16px 55px #35232333}

#teacherRoot .t-module-dialog button{border:0;background:#c99186;color:white;border-radius:9px;padding:10px 18px}
</style>
<script>
(function(){
  const teacherMode = new URLSearchParams(location.search).get('teacher') === 'tatiana-katya';
  if(!teacherMode) return;
  document.documentElement.classList.add('teacher-mode');
  document.title='Katya · Teacher Hub';

  document.addEventListener('DOMContentLoaded', function(){
    const root=document.createElement('div');
    root.id='teacherRoot';
    root.innerHTML = `
      <aside class="t-side"><img class="t-sidebar-art" id="tSidebarArt" alt="">
        <div class="t-brand"><b>Katya · Teacher Hub</b><span>Teacher workspace</span></div>
        <button class="t-home" id="tHome">Home</button>
        <div id="tModules"></div><button class="t-covernotes" id="tCoverNotes" aria-label="Teacher Notes">Teacher Notes</button>
      </aside>
      <main class="t-work"><button class="t-board-fullscreen" id="tBoardFullscreen">На весь экран</button>
        <section class="t-cover"><img class="t-art" id="tArt" alt="Katya English Hub — Small steps. Big progress."></section><section class="t-module-dialog" id="tModuleDialog" role="dialog" aria-modal="true" aria-labelledby="tModuleTitle" hidden><h2 id="tModuleTitle"></h2><p>Материалы этого модуля пока не добавлены.</p><button id="tModuleClose">Назад</button></section>
        <section class="t-view" id="tView">
          <div class="t-top">
            <button class="t-back" id="tBack">← Назад</button>
            <div class="t-title" id="tTitle">Lesson</div>
            <button class="t-notesbtn" id="tNotesBtn">Teacher Notes</button>
          </div>
          <div class="t-framewrap">
            <iframe id="tFrame" title="Katya teacher lesson"></iframe>
            <div class="t-placeholder" id="tPlaceholder"><div><h2 id="tPhTitle">Lesson</h2><p>Этот слот готов для следующего урока.</p></div></div>
            <aside class="t-notes" id="tNotes">
              <h3 id="tNotesTitle">Teacher Notes</h3>
              <textarea id="tNoteText" placeholder="Ошибки, ответы, идеи, homework..."></textarea>
              <div class="t-noteactions">
                <button class="t-save" id="tSave">Сохранить</button>
                <button class="t-clear" id="tClear">Очистить</button><button class="t-noteclose" id="tNoteClose">Закрыть</button>
              </div>
            </aside>
          </div>
        </section>
      </main>`;
    document.body.appendChild(root);
    document.getElementById('tBoardFullscreen').onclick=async()=>{try{await root.requestFullscreen()}catch(e){document.getElementById('tBoardFullscreen').textContent='Нажмите F11'}};
    Promise.all(Array.from({length:8},(_,i)=>new Promise((resolve,reject)=>{
      const script=document.createElement('script');
      script.src='katya-cover-20260928-'+i+'.js';
      script.onload=resolve;script.onerror=reject;document.head.appendChild(script);
    }))).then(()=>{
      const artwork='data:image/png;base64,'+window.KATYA_COVER_PARTS.join('');
      document.getElementById('tArt').src=artwork;
      document.getElementById('tSidebarArt').src=artwork;
      delete window.KATYA_COVER_PARTS;
    }).catch(()=>{
      const message=document.createElement('p');message.textContent='Обложка не загрузилась. Обновите страницу.';message.style.cssText='position:absolute;left:25%;top:40%';root.appendChild(message);
    });

    const course=[
      {module:'Module 1',lessons:[
        {id:'m1l1',title:'Lesson 1 · Elections in Russia',url:'extra-practice-elections-russia.html'},
        {id:'m1l2',title:'Lesson 2 · Generations',url:'homework-lesson2-generations.html'},
        {id:'m1l3',title:'Lesson 3 · Useful Tools',url:'useful-tools-false-synonyms.html'}
      ]},
      ...Array.from({length:7},(_,i)=>({module:'Module '+(i+2),lessons:[
        {id:'m'+(i+2)+'l1',title:'Lesson 1',url:''},
        {id:'m'+(i+2)+'l2',title:'Lesson 2',url:''},
        {id:'m'+(i+2)+'l3',title:'Lesson 3',url:''}
      ]}))
    ];

    let current='';
    const modules=document.getElementById('tModules');
    course.forEach((m,mi)=>{
      const wrap=document.createElement('div');wrap.className='t-modwrap';
      const mb=document.createElement('button');mb.className='t-module'+(mi===0?' open':'');
      mb.innerHTML='<span>'+m.module+'</span><span>›</span>';
      mb.setAttribute('aria-label',m.module);
      mb.style.top=([18.5,42.5,48.8,55.1,61.4,67.7,74,80.3][mi])+'%';
      const list=document.createElement('div');list.className='t-lessons'+(mi===0?' open':'');
      mb.onclick=()=>{if(mi===0){document.getElementById('tModuleDialog').hidden=true;return;}document.getElementById('tModuleTitle').textContent=m.module;document.getElementById('tModuleDialog').hidden=false;document.getElementById('tModuleClose').focus()};
      m.lessons.forEach(l=>{
        const b=document.createElement('button');
        b.className='t-lesson'+(!l.url?' empty':'');
        b.textContent=l.title;
        b.setAttribute('aria-label',l.title);
        b.dataset.id=l.id;
        b.onclick=()=>openLesson(mi,l);
        list.appendChild(b);
      });
      wrap.appendChild(mb);wrap.appendChild(list);modules.appendChild(wrap);
    });

    function openLesson(mi,l){
      document.getElementById('tModuleDialog').hidden=true;
      current=l.id;
      document.querySelectorAll('#teacherRoot .t-lesson').forEach(x=>x.classList.remove('active'));
      const active=document.querySelector('#teacherRoot [data-id="'+l.id+'"]');
      if(active)active.classList.add('active');
      document.getElementById('tTitle').textContent=course[mi].module+' · '+l.title;
      document.getElementById('tNotesTitle').textContent=l.title+' · Notes';
      document.getElementById('tNoteText').value=localStorage.getItem('katya_teacher_'+l.id)||'';
      document.getElementById('tNotes').classList.remove('on');
      document.getElementById('tView').classList.add('on');
      const fr=document.getElementById('tFrame'), ph=document.getElementById('tPlaceholder');
      if(l.url){ph.classList.remove('on');fr.style.display='block';fr.src=l.url}
      else{fr.src='about:blank';fr.style.display='none';document.getElementById('tPhTitle').textContent=course[mi].module+' · '+l.title;ph.classList.add('on')}
    }
    function goHome(){
      document.getElementById('tView').classList.remove('on');
      document.getElementById('tFrame').src='about:blank';
      document.getElementById('tNotes').classList.remove('on');
      document.querySelectorAll('#teacherRoot .t-lesson').forEach(x=>x.classList.remove('active'));
      current='';
      document.getElementById('tModuleDialog').hidden=true;
    }
    const notes=document.getElementById('tNotes');
    root.appendChild(notes);
    document.getElementById('tHome').setAttribute('aria-label','Home');
    document.getElementById('tModuleClose').onclick=()=>{document.getElementById('tModuleDialog').hidden=true};
    document.getElementById('tNoteClose').onclick=()=>notes.classList.remove('on');
    document.getElementById('tCoverNotes').onclick=()=>{current='general';document.getElementById('tNotesTitle').textContent='Teacher Notes';document.getElementById('tNoteText').value=localStorage.getItem('katya_teacher_general')||'';notes.classList.add('on');document.getElementById('tNoteText').focus()};
    document.addEventListener('keydown',e=>{if(e.key==='Escape'){notes.classList.remove('on');document.getElementById('tModuleDialog').hidden=true;goHome()}});
    document.getElementById('tHome').onclick=goHome;
    document.getElementById('tBack').onclick=goHome;
    document.getElementById('tNotesBtn').onclick=()=>document.getElementById('tNotes').classList.toggle('on');
    document.getElementById('tSave').onclick=()=>{if(current)localStorage.setItem('katya_teacher_'+current,document.getElementById('tNoteText').value)};
    document.getElementById('tClear').onclick=()=>{if(current){document.getElementById('tNoteText').value='';localStorage.removeItem('katya_teacher_'+current)}};
  }, {once:true});
})();
</script>

<script>
(function(){
  var bg=document.getElementById('photoBg');

  }
})();

function buildModules(){
  const panel=document.getElementById('modulesPanel');
  let html='';
  for(let m=1;m<=12;m++){
    const lesson1='Lesson 1';
    html += '<div class="module-item">';
    html += '<button class="module-toggle" id="moduleToggle'+m+'" onclick="toggleModule('+m+')"><span>Module '+m+'</span><span>⌄</span></button>';
    html += '<div class="lesson-list" id="module-'+m+'">';
    html += '<button onclick="openLesson('+m+',1)"><span>'+lesson1+'</span><span>›</span></button>';
    html += '<button onclick="openLesson('+m+',2)"><span>Lesson 2</span><span>›</span></button>';
    html += '<button onclick="openLesson('+m+',3)"><span>Lesson 3</span><span>›</span></button>';
    html += '</div></div>';
  }
  panel.innerHTML=html;
}

function toggleModulesPanel(){
  document.getElementById('modulesPanel').classList.toggle('open');
}
function toggleHomeworkPanel(){
  document.getElementById('homeworkPanel').classList.toggle('open');
}
function toggleExtraPractice(){
  document.getElementById('extraPracticePanel').classList.toggle('open');
}
function toggleUsefulTools(){
  document.getElementById('usefulToolsPanel').classList.toggle('open');
}
function closeModules(){
  document.getElementById('modulesPanel').classList.remove('open');
  document.getElementById('homeworkPanel').classList.remove('open');
  const u=document.getElementById('usefulToolsPanel'); if(u) u.classList.remove('open');
  const e=document.getElementById('extraPracticePanel'); if(e) e.classList.remove('open');
  document.querySelectorAll('.lesson-list').forEach(x=>x.classList.remove('open'));
  document.querySelectorAll('.module-toggle').forEach(x=>x.classList.remove('open'));
}
function toggleModule(n){
  const list=document.getElementById('module-'+n);
  const toggle=document.getElementById('moduleToggle'+n);
  const willOpen=!list.classList.contains('open');
  document.querySelectorAll('.lesson-list').forEach(x=>x.classList.remove('open'));
  document.querySelectorAll('.module-toggle').forEach(x=>x.classList.remove('open'));
  if(willOpen){
    list.classList.add('open');
    toggle.classList.add('open');
  }
}

function openUsefulTool(type){
  const view=document.getElementById('lessonView');
  const frame=document.getElementById('lessonFrame');
  const title=document.getElementById('lessonViewTitle');
  document.body.classList.add('lesson-open');
  view.classList.add('on');
  view.setAttribute('aria-hidden','false');
  if(type==='false-synonyms'){
    title.textContent='Useful Tools — False Synonyms · EGE';
    frame.removeAttribute('srcdoc');
    frame.src='useful-tools-false-synonyms.html';
  }
}

function openExtraPractice(type){
  const view=document.getElementById('lessonView');
  const frame=document.getElementById('lessonFrame');
  const title=document.getElementById('lessonViewTitle');
  document.body.classList.add('lesson-open');
  view.classList.add('on');
  view.setAttribute('aria-hidden','false');
  if(type==='elections'){
    title.textContent='Extra Practice — Elections in Russia';
    frame.removeAttribute('srcdoc');
    frame.src='extra-practice-elections-russia.html';
  }
}

function openHomeworkLesson(lesson){
  const view=document.getElementById('lessonView');
  const frame=document.getElementById('lessonFrame');
  const title=document.getElementById('lessonViewTitle');
  document.body.classList.add('lesson-open');
  view.classList.add('on');
  view.setAttribute('aria-hidden','false');
  if(lesson===2){
    title.textContent='Homework · Lesson 2 — Generations';
    frame.removeAttribute('srcdoc');
    frame.src='homework-lesson2-generations.html';
  }else if(lesson===3){
    title.textContent='Homework · Lesson 3 — Music & Study';
    frame.removeAttribute('srcdoc');
    frame.src='speaking-music-studying.html?v=20260928-hw3h';
  }
}

function openLesson(module,lesson){
  const view=document.getElementById('lessonView');
  const frame=document.getElementById('lessonFrame');
  const title=document.getElementById('lessonViewTitle');
  document.body.classList.add('lesson-open');
  view.classList.add('on');
  view.setAttribute('aria-hidden','false');

  {
    title.textContent='Module '+module+' · Lesson '+lesson;
    frame.removeAttribute('src');
    frame.srcdoc='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:linear-gradient(#fbfefe,#edf6f7);color:#17343a}.wrap{min-height:100vh;display:grid;place-items:center;padding:30px}.card{width:min(900px,92vw);background:#fff;border:1px solid #d8e8e9;border-radius:26px;padding:34px;box-shadow:0 16px 38px rgba(23,54,67,.10);text-align:center}h1{margin:0 0 10px;color:#0f7782;font-size:34px}p{color:#62787d;font-size:17px;line-height:1.55}</style></head><body><div class="wrap"><div class="card"><h1>Module '+module+' · Lesson '+lesson+'</h1><p>This lesson opens in a full-screen workspace and is ready for future materials.</p></div></div></body></html>';
  }
}
function closeLessonView(){
  const view=document.getElementById('lessonView');
  const frame=document.getElementById('lessonFrame');
  view.classList.remove('on');
  view.setAttribute('aria-hidden','true');
  document.body.classList.remove('lesson-open');
  frame.src='about:blank';
  frame.removeAttribute('srcdoc');
}
async function toggleLessonFullscreen(){
  const view=document.getElementById('lessonView');
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
    else await view.requestFullscreen();
  }catch(e){}
}
function openInfo(name){
  document.getElementById('modalTitle').textContent=name;
  document.getElementById('modalText').textContent='This section is ready for Kate’s next materials.';
  document.getElementById('modal').classList.add('on');
}
function closeModal(){document.getElementById('modal').classList.remove('on')}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && document.getElementById('lessonView').classList.contains('on')) closeLessonView();
});
buildModules();
</script>
