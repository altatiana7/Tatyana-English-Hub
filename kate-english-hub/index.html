<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Kate's Homework</title>
<style>
:root{
  --teal:#1197a5;
  --teal-dark:#087d89;
  --ink:#182229;
  --muted:#5b6970;
  --line:rgba(20,65,72,.14);
  --shadow:0 18px 50px rgba(13,37,43,.20);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#d8e3e4}
button,a{font:inherit}
button{cursor:pointer}
.app{min-height:100vh;display:grid;grid-template-columns:220px 1fr}
.sidebar{
  position:sticky;top:0;height:100vh;z-index:10;background:rgba(255,255,255,.97);
  border-right:1px solid rgba(0,0,0,.08);padding:10px 10px 14px;
  display:flex;flex-direction:column;gap:7px;box-shadow:10px 0 30px rgba(0,0,0,.08);
  overflow-y:auto
}
.logo{
  background:#fff;border-radius:0 0 16px 16px;padding:8px 7px 7px;text-align:center;
  box-shadow:0 7px 18px rgba(0,0,0,.06);border:1px solid #e5eaeb
}
.logo .kate{font-size:16px;font-weight:900;color:var(--teal);letter-spacing:.04em}
.logo .homework-title{font-size:15px;font-weight:900;line-height:1.05}
.logo .motto{font-size:6.8px;font-weight:800;letter-spacing:.07em;margin-top:5px}
.big-btn{
  width:100%;border:0;border-radius:10px;padding:9px 10px;text-align:left;font-weight:900;color:#263238;
  background:#eef4f4;display:flex;align-items:center;justify-content:space-between;gap:9px
}
.big-btn.active{background:linear-gradient(135deg,var(--teal),#39adba);color:white}
.big-btn.homework{background:linear-gradient(135deg,#ffef9c,#ffe276);color:#3a3425;border:1px solid rgba(172,136,0,.22)}
.big-btn:hover{filter:brightness(.98)}
.modules-panel{
  display:none;
  padding:3px 0 6px;
}
.modules-panel.open{display:block}
.module-item{margin:4px 0}
.module-toggle{
  width:100%;border:0;border-radius:9px;padding:7px 9px;background:#dceff1;color:#28464b;
  font-weight:900;text-align:left;display:flex;justify-content:space-between;align-items:center
}
.module-toggle.open{background:#bfe5e8;color:#0b6872}
.lesson-list{display:none;padding:5px 4px 1px 9px}
.lesson-list.open{display:grid;gap:4px}
.lesson-list button{
  width:100%;border:1px solid #d9e6e8;background:#fff;border-radius:8px;padding:7px 8px;
  font-size:12px;font-weight:800;color:#30494e;text-align:left;display:flex;justify-content:space-between;align-items:center
}
.lesson-list button:hover{background:#f5fbfb}
.side-bottom{margin-top:auto;display:grid;gap:4px}
.side-simple{border:0;background:transparent;text-align:left;padding:7px 7px;border-radius:8px;font-weight:700;color:#263238}
.side-simple:hover{background:#eef4f4}

.workspace{position:relative;min-height:100vh;overflow:hidden;background:#253036}
.photo-bg{
  position:absolute;inset:0;background:
    linear-gradient(90deg,rgba(28,41,45,.28),rgba(19,29,32,.02) 32%,rgba(15,24,27,.08)),
    linear-gradient(0deg,rgba(12,20,22,.24),transparent 33%),
    radial-gradient(circle at 56% 36%,#9ca9a2,#39484a 72%);
  background-size:cover;background-position:center;transform:scale(1.01)
}
.photo-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.13),transparent 35%,rgba(0,0,0,.05))}
.welcome{
  position:absolute;z-index:3;left:36px;top:28px;max-width:540px;color:white;
  text-shadow:0 3px 12px rgba(0,0,0,.38)
}
.welcome h1{font-size:25px;margin:0 0 4px}
.welcome p{margin:0;font-size:15px;font-weight:700}
.top-note{
  position:absolute;right:28px;top:24px;z-index:3;width:255px;background:rgba(255,255,255,.90);
  border:1px solid rgba(255,255,255,.8);padding:16px 18px;border-radius:3px;transform:rotate(-2deg);
  box-shadow:var(--shadow);text-align:center
}
.top-note .line1{font-family:Georgia,serif;font-style:italic;font-size:21px;line-height:1.05}
.top-note .line2{font-size:11px;font-weight:700;color:#53656b;margin-top:8px}
.bottom-nav{
  position:absolute;z-index:5;left:28px;right:25px;bottom:18px;height:150px;
  background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.9);
  border-radius:16px;padding:10px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;
  box-shadow:0 12px 30px rgba(0,0,0,.16);backdrop-filter:blur(9px)
}
.skill{
  border:1px solid rgba(20,65,72,.12);background:linear-gradient(#fff,#edf6f6);
  border-radius:12px;padding:10px 8px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center
}
.skill:hover{transform:translateY(-2px);transition:.16s}
.skill .ico{font-size:28px;color:var(--teal);height:33px}
.skill strong{font-size:15px;margin-top:5px}
.skill small{font-size:11px;color:#66747a;line-height:1.16;margin-top:4px}

/* Full-screen lesson viewer */
.lesson-view{
  position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:120;background:#fff;
  display:none;flex-direction:column;overflow:hidden
}
.lesson-view.on{display:flex}
.lesson-view-bar{
  flex:0 0 58px;min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:8px 14px;background:linear-gradient(135deg,#0d7f8b,#169ca9);color:#fff;
  box-shadow:0 4px 16px rgba(0,0,0,.14)
}
.lesson-view-title{
  min-width:0;font-weight:900;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.lesson-view-actions{display:flex;gap:8px;flex:none}
.lesson-view-actions button{
  border:0;border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.95);color:#155961;font-weight:900
}
.lesson-frame{display:block;width:100%;flex:1 1 auto;min-height:0;border:0;background:#fff}
body.lesson-open{overflow:hidden}

.modal{position:fixed;inset:0;z-index:80;background:rgba(4,18,22,.58);display:none;place-items:center;padding:24px}
.modal.on{display:grid}
.modal-card{width:min(600px,92vw);background:#fff;border-radius:22px;padding:24px;box-shadow:0 25px 70px rgba(0,0,0,.28)}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.modal-card h2{margin:0;color:#106f79}
.close{border:0;background:#edf5f5;border-radius:9px;padding:7px 10px;font-weight:800}
.modal-card p{color:#5b6970;line-height:1.55}
.modal-actions button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:#edf4f4;color:#2f4449}

@media(max-width:1000px){
  .app{grid-template-columns:190px 1fr}
  .top-note{right:18px;width:220px}
  .skill strong{font-size:13px}.skill small{font-size:10px}
}
@media(max-width:760px){
  .app{display:block}.sidebar{position:relative;width:100%;height:auto;max-height:none}
  .workspace{min-height:980px}.top-note{display:none}  .welcome{left:18px}
  .bottom-nav{left:18px;right:18px;height:auto;grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <div class="kate">KATE'S</div>
      <div class="homework-title">HOMEWORK</div>
      <div class="motto">LEARN · EXPLORE · ACHIEVE</div>
    </div>

    <button class="big-btn" onclick="closeModules()">⌂ <span>Home</span><span></span></button>
    <button class="big-btn active" id="modulesBtn" onclick="toggleModulesPanel()">▤ <span>Modules</span><span>⌄</span></button>

    <div class="modules-panel" id="modulesPanel"></div>

    <button class="big-btn homework" id="homeworkBtn" onclick="toggleHomeworkPanel()">★ <span>Homework</span><span>⌄</span></button>
    <div class="modules-panel" id="homeworkPanel">
      <div class="lesson-list open" style="display:grid;padding:3px 4px 6px 9px">
        <button onclick="openInfo('Homework · Lesson 1')"><span>Lesson 1</span><span>›</span></button>
        <button onclick="openInfo('Homework · Lesson 2')"><span>Lesson 2</span><span>›</span></button>
      </div>
    </div>

    <div class="side-bottom">
      <button class="side-simple" onclick="openInfo('Extra Practice')">★ Extra Practice</button>
      <button class="side-simple" onclick="openInfo('Useful Tools')">⚒ Useful Tools</button>
      <button class="side-simple" onclick="openInfo('My Progress')">♥ My Progress</button>
    </div>
  </aside>

  <main class="workspace">
    <div class="photo-bg" id="photoBg"></div>

    <div class="welcome">
      <h1>Welcome back, Kate!</h1>
      <p>Same language. A bigger world.</p>
    </div>

    <div class="top-note">
      <div class="line1">Same language<br>A bigger world ♡</div>
      <div class="line2">EXPLORE · LEARN · GROW</div>
    </div>

    <nav class="bottom-nav">
      <button class="skill" onclick="openInfo('Listening')"><div class="ico">◉</div><strong>Listening</strong><small>Real English<br>Real Life</small></button>
      <button class="skill" onclick="openInfo('Reading')"><div class="ico">▤</div><strong>Reading</strong><small>Ideas from<br>the real world</small></button>
      <button class="skill" onclick="openInfo('Writing')"><div class="ico">✎</div><strong>Writing</strong><small>Clear ideas<br>Stronger texts</small></button>
      <button class="skill" onclick="openInfo('Speaking')"><div class="ico">●</div><strong>Speaking</strong><small>More confidence<br>every day</small></button>
      <button class="skill" onclick="openInfo('Exam Practice')"><div class="ico">◆</div><strong>Exam Practice</strong><small>Skills for success</small></button>
      <button class="skill" onclick="openInfo('Culture & Life')"><div class="ico">◎</div><strong>Culture & Life</strong><small>People · Places<br>Perspectives</small></button>
    </nav>
  </main>
</div>

<section class="lesson-view" id="lessonView" aria-hidden="true">
  <div class="lesson-view-bar">
    <div class="lesson-view-title" id="lessonViewTitle">Lesson</div>
    <div class="lesson-view-actions">
      <button onclick="closeLessonView()">← Back</button>
      <button onclick="toggleLessonFullscreen()">⛶ Full screen</button>
      <button onclick="closeLessonView()">✕ Close</button>
    </div>
  </div>
  <iframe class="lesson-frame" id="lessonFrame" title="Kate lesson"></iframe>
</section>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal-card">
    <div class="modal-top"><h2 id="modalTitle">Section</h2><button class="close" onclick="closeModal()">Close</button></div>
    <p id="modalText"></p>
    <div class="modal-actions"><button onclick="closeModal()">Back</button></div>
  </div>
</div>

<script src="bg1.js"></script>
<script src="bg2.js"></script>
<script src="bg3.js"></script>
<script src="bg4.js"></script>
<script src="bg5.js"></script>
<script>
(function(){
  var bg=document.getElementById('photoBg');
  if(window.KATE_BG){
    bg.style.backgroundImage='linear-gradient(90deg,rgba(20,32,35,.28),rgba(20,32,35,.03) 35%,rgba(20,32,35,.08)),url("data:image/webp;base64,'+window.KATE_BG+'")';
  }
})();

function buildModules(){
  const panel=document.getElementById('modulesPanel');
  let html='';
  for(let m=1;m<=12;m++){
    const lesson1=m===2?'Lesson 1 · Generations':'Lesson 1';
    html += '<div class="module-item">';
    html += '<button class="module-toggle" id="moduleToggle'+m+'" onclick="toggleModule('+m+')"><span>Module '+m+'</span><span>⌄</span></button>';
    html += '<div class="lesson-list" id="module-'+m+'">';
    html += '<button onclick="openLesson('+m+',1)"><span>'+lesson1+'</span><span>›</span></button>';
    html += '<button onclick="openLesson('+m+',2)"><span>Lesson 2</span><span>›</span></button>';
    html += '<button onclick="openLesson('+m+',3)"><span>Lesson 3</span><span>›</span></button>';
    html += '</div></div>';
  }
  panel.innerHTML=html;
}

function toggleModulesPanel(){
  document.getElementById('modulesPanel').classList.toggle('open');
}
function toggleHomeworkPanel(){
  document.getElementById('homeworkPanel').classList.toggle('open');
}
function closeModules(){
  document.getElementById('modulesPanel').classList.remove('open');
  document.getElementById('homeworkPanel').classList.remove('open');
  document.querySelectorAll('.lesson-list').forEach(x=>x.classList.remove('open'));
  document.querySelectorAll('.module-toggle').forEach(x=>x.classList.remove('open'));
}
function toggleModule(n){
  const list=document.getElementById('module-'+n);
  const toggle=document.getElementById('moduleToggle'+n);
  const willOpen=!list.classList.contains('open');
  document.querySelectorAll('.lesson-list').forEach(x=>x.classList.remove('open'));
  document.querySelectorAll('.module-toggle').forEach(x=>x.classList.remove('open'));
  if(willOpen){
    list.classList.add('open');
    toggle.classList.add('open');
  }
}

function openLesson(module,lesson){
  const view=document.getElementById('lessonView');
  const frame=document.getElementById('lessonFrame');
  const title=document.getElementById('lessonViewTitle');
  document.body.classList.add('lesson-open');
  view.classList.add('on');
  view.setAttribute('aria-hidden','false');

  if(module===2 && lesson===1){
    title.textContent='Module 2 · Lesson 1 — Generations';
    frame.removeAttribute('srcdoc');
    frame.src='module2-lesson1-generations.html';
  }else{
    title.textContent='Module '+module+' · Lesson '+lesson;
    frame.removeAttribute('src');
    frame.srcdoc='<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:linear-gradient(#fbfefe,#edf6f7);color:#17343a}.wrap{min-height:100vh;display:grid;place-items:center;padding:30px}.card{width:min(900px,92vw);background:#fff;border:1px solid #d8e8e9;border-radius:26px;padding:34px;box-shadow:0 16px 38px rgba(23,54,67,.10);text-align:center}h1{margin:0 0 10px;color:#0f7782;font-size:34px}p{color:#62787d;font-size:17px;line-height:1.55}</style></head><body><div class="wrap"><div class="card"><h1>Module '+module+' · Lesson '+lesson+'</h1><p>This lesson opens in a full-screen workspace and is ready for future materials.</p></div></div></body></html>';
  }
}
function closeLessonView(){
  const view=document.getElementById('lessonView');
  const frame=document.getElementById('lessonFrame');
  view.classList.remove('on');
  view.setAttribute('aria-hidden','true');
  document.body.classList.remove('lesson-open');
  frame.src='about:blank';
  frame.removeAttribute('srcdoc');
}
async function toggleLessonFullscreen(){
  const view=document.getElementById('lessonView');
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
    else await view.requestFullscreen();
  }catch(e){}
}
function openInfo(name){
  document.getElementById('modalTitle').textContent=name;
  document.getElementById('modalText').textContent='This section is ready for Kate’s next materials.';
  document.getElementById('modal').classList.add('on');
}
function closeModal(){document.getElementById('modal').classList.remove('on')}
document.addEventListener('keydown',function(e){
  if(e.key==='Escape' && document.getElementById('lessonView').classList.contains('on')) closeLessonView();
});
buildModules();
</script>
</body>
</html>
