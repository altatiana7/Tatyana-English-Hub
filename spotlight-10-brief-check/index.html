<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotlight 10 · Brief Checking</title>
<style>
:root{--ink:#15333d;--paper:#f5f3eb;--teal:#147c84;--blue:#5b9fc8;--sand:#d9b47e;--white:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;overflow:hidden}
button,a{font:inherit}
button{cursor:pointer}
a{color:inherit}
header{position:fixed;top:0;left:0;right:0;z-index:20;height:58px;padding:0 2vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff55;background:#f5f3ebc7;backdrop-filter:blur(12px)}
.brand{font-weight:900;letter-spacing:-1px;font-size:24px}.brand span{background:#bfe3df;padding:5px 9px;border-radius:8px;margin-left:6px}
.small{font-size:11px;letter-spacing:1.7px;font-weight:800}
.tools{display:flex;gap:10px;align-items:center}
.tools a,.tools button,.back{border:1px solid #17333233;background:transparent;border-radius:999px;padding:10px 15px;text-decoration:none;color:var(--ink)}
.tools a:hover,.tools button:hover,.back:hover{background:white}
#home{height:100svh;display:grid;place-items:center;padding:0;background:#dbe8e7}
.cover-shell{position:relative;width:100vw;height:100svh;border-radius:0;overflow:hidden;background:#d9e7e7}
#cover{display:block;width:100%;height:100%;object-fit:contain;object-position:center;background:#d9e7e7}
.hotspot{position:absolute;border:2px solid transparent;background:transparent;border-radius:18px;cursor:pointer;transition:.18s ease}
.hotspot:hover{border-color:white;box-shadow:0 0 0 4px #ffffff55,0 16px 34px #0c354a44;background:#ffffff0f;transform:translateY(-2px)}
.hotspot:focus-visible{outline:4px solid #fff;outline-offset:-8px;background:#ffffff22}
.hotspot span{position:absolute;inset:auto 10px 10px 10px;background:#102e38dc;color:white;padding:8px 10px;border-radius:10px;font-size:12px;font-weight:800;letter-spacing:.5px;opacity:0;transform:translateY(5px);transition:.18s}
.hotspot:hover span,.hotspot:focus-visible span{opacity:1;transform:none}
#stage{display:none;height:100svh;padding:82px 4vw 28px;background:linear-gradient(145deg,#f5f3eb,#e4efed)}
#stage.active{display:flex;flex-direction:column}
.stagebar{display:flex;justify-content:space-between;align-items:center;gap:16px}
.stage-main{width:min(1080px,100%);margin:auto;background:#ffffffcc;border:1px solid #17333218;border-radius:26px;padding:clamp(28px,5vw,58px);box-shadow:0 20px 60px #17333216}
.kicker{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--teal)}
h1{font-size:clamp(48px,7vw,88px);letter-spacing:-4px;line-height:.92;margin:16px 0}
.sub{max-width:620px;font-size:18px;line-height:1.55;color:#536763}
.placeholder{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap}
.pill{border:1px solid #17333222;border-radius:14px;padding:13px 16px;background:#f8faf9;font-weight:700}
.loading{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(145deg,#dbeceb,#dce8f1);font-weight:800;letter-spacing:1px;color:#47636b}
.loaded .loading{display:none}
@media(max-width:700px){header{height:54px;padding:0 10px}.small{display:none}.brand{font-size:19px}#home,#stage{height:100svh}#home{padding:0}.cover-shell{width:100vw;height:100svh;border-radius:0}.tools a,.tools button{padding:7px 9px;font-size:11px}.hotspot{border-radius:10px}.hotspot span{display:none}#stage{padding:72px 16px 16px}.stage-main{padding:28px 22px}h1{letter-spacing:-2px}}
</style>
</head>
<body>
<header>
  <div class="brand">SPOTLIGHT <span>10</span></div>
  <div class="small">ENGLISH / BRIEF CHECKING</div>
  <div class="tools">
    <a href="../spotlight-brief-check/">All grades</a>
    <button id="fullscreen">Full screen</button>
  </div>
</header>

<main id="home">
  <div class="cover-shell" id="coverShell">
    <div class="loading">LOADING COVER</div>
    <img id="cover" alt="Spotlight 10 Brief Checking interactive cover">
    <button class="hotspot" data-index="0" style="left:3.4%;top:43.4%;width:30.8%;height:22.3%" aria-label="Open Listening"><span>Open Listening</span></button>
    <button class="hotspot" data-index="1" style="left:35.3%;top:43.4%;width:28.9%;height:22.3%" aria-label="Open Vocabulary"><span>Open Vocabulary</span></button>
    <button class="hotspot" data-index="2" style="left:65.2%;top:43.4%;width:30.9%;height:22.3%" aria-label="Open Grammar"><span>Open Grammar</span></button>
    <button class="hotspot" data-index="3" style="left:3.4%;top:67.2%;width:30.8%;height:22.7%" aria-label="Open Word Formation"><span>Open Word Formation</span></button>
    <button class="hotspot" data-index="4" style="left:35.3%;top:67.2%;width:28.9%;height:22.7%" aria-label="Open Student Book"><span>Open Student Book</span></button>
    <button class="hotspot" data-index="5" style="left:65.2%;top:67.2%;width:30.9%;height:22.7%" aria-label="Open Lesson Check"><span>Open Lesson Check</span></button>
  </div>
</main>

<section id="stage" aria-labelledby="stageTitle">
  <div class="stagebar">
    <button class="back" id="back">← Back to cover</button>
    <a href="../spotlight-brief-check/">All grades</a>
  </div>
  <div class="stage-main">
    <div class="kicker">SPOTLIGHT 10 · BRIEF CHECKING</div>
    <h1 id="stageTitle"></h1>
    <p class="sub" id="stageSub"></p>
    <div class="placeholder">
      <span class="pill">Ready for lesson materials</span>
      <span class="pill">Full-screen activity area</span>
      <span class="pill">Fast student access</span>
    </div>
  </div>
</section>

<script>
const sections=[
  ['Listening','Audio tasks, quick listening checks and lesson listening activities will open here.'],
  ['Vocabulary','Active vocabulary, flashcards and short practice will live here.'],
  ['Grammar','Compact grammar checks and interactive practice will open here.'],
  ['Word Formation','Word-building tasks and short word-formation drills will open here.'],
  ['Student Book','Student Book lesson material and class activities will open here.'],
  ['Lesson Check','A quick end-of-lesson check and revision area will open here.']
];
const $=id=>document.getElementById(id);
let current=0;

document.querySelectorAll('.hotspot').forEach(btn=>{
  btn.addEventListener('click',()=>{
    current=Number(btn.dataset.index);
    $('stageTitle').textContent=sections[current][0];
    $('stageSub').textContent=sections[current][1];
    $('home').style.display='none';
    $('stage').classList.add('active');
    $('back').focus();
  });
});

function backHome(){
  $('stage').classList.remove('active');
  $('home').style.display='grid';
  const target=document.querySelector('.hotspot[data-index="'+current+'"]');
  if(target) target.focus();
}
$('back').addEventListener('click',backHome);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('stage').classList.contains('active'))backHome()});

$('fullscreen').addEventListener('click',async()=>{
  try{
    if(document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  }catch(e){
    $('fullscreen').textContent='Use browser full screen';
  }
});
document.addEventListener('fullscreenchange',()=>{
  $('fullscreen').textContent=document.fullscreenElement?'Exit full screen':'Full screen';
});

Promise.all(['cover-1.b64','cover-2.b64','cover-3.b64','cover-4.b64'].map(f=>fetch(f).then(r=>{
  if(!r.ok) throw new Error(f);
  return r.text();
}))).then(parts=>{
  $('cover').src='data:image/webp;base64,'+parts.join('');
  $('coverShell').classList.add('loaded');
}).catch(()=>{
  document.querySelector('.loading').textContent='Cover failed to load · refresh page';
});
</script>
</body>
</html>
