<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nikita · Outcomes · Classroom View</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#18130f}
  #courseFrame{display:block;width:100%;height:100%;border:0;background:#18130f}
</style>
</head>
<body>
<iframe id="courseFrame" src="./course.html" title="Nikita Outcomes course"></iframe>
<script>
(function(){
  const frame=document.getElementById('courseFrame');
  const css=`
    :root{
      --nikita-sidebar:320px;
    }

    html,body{
      min-width:100% !important;
    }

    .app{
      grid-template-columns:var(--nikita-sidebar) minmax(0,1fr) !important;
    }

    .sidebar{
      width:var(--nikita-sidebar) !important;
      min-width:var(--nikita-sidebar) !important;
      padding:18px 16px 18px !important;
      overflow-y:auto !important;
      scrollbar-width:thin !important;
    }

    .logo{
      margin-bottom:12px !important;
    }

    .logo b{
      font-size:26px !important;
      line-height:1 !important;
    }

    .logo span{
      font-size:13px !important;
      line-height:1.25 !important;
      letter-spacing:.06em !important;
    }

    .homebtn{
      min-height:48px !important;
      font-size:17px !important;
      font-weight:800 !important;
      margin:7px 0 12px !important;
    }

    .modulesHeading{
      font-size:18px !important;
      font-weight:900 !important;
      letter-spacing:.08em !important;
      margin:8px 0 10px !important;
    }

    #moduleMenu{
      display:grid !important;
      gap:7px !important;
    }

    .moduleBtn{
      width:100% !important;
      min-height:50px !important;
      height:auto !important;
      padding:9px 12px !important;
      border-radius:14px !important;
      font-size:18px !important;
      line-height:1.15 !important;
      font-weight:800 !important;
      text-align:left !important;
      gap:10px !important;
    }

    .moduleBtn .moduleNum{
      min-width:39px !important;
      font-size:16px !important;
      font-weight:900 !important;
      letter-spacing:.04em !important;
    }

    .moduleBtn .chev{
      margin-left:auto !important;
      font-size:25px !important;
      line-height:1 !important;
    }

    .lessonNav button,
    .lessonNav a{
      min-height:44px !important;
      font-size:16px !important;
    }

    #header.header{
      position:relative !important;
      min-height:100vh !important;
      height:100vh !important;
      overflow:hidden !important;
      background:#1c1510 !important;
    }

    #headerImage{
      position:absolute !important;
      inset:0 !important;
      width:100% !important;
      height:100% !important;
      max-width:none !important;
      max-height:none !important;
      object-fit:contain !important;
      object-position:center center !important;
      transform:none !important;
      background:#1c1510 !important;
    }

    .headerOverlay{
      position:absolute !important;
      inset:auto 0 0 0 !important;
      padding:26px 34px 30px !important;
      background:linear-gradient(180deg,transparent 0%,rgba(18,12,8,.80) 45%,rgba(18,12,8,.94) 100%) !important;
    }

    #headerTitle,
    .headerTitle{
      font-size:clamp(38px,4.5vw,68px) !important;
      line-height:.98 !important;
      max-width:900px !important;
    }

    #headerText,
    .headerText{
      font-size:clamp(18px,1.5vw,24px) !important;
      line-height:1.35 !important;
      max-width:850px !important;
    }

    #headerEyebrow,
    .eyebrow{
      font-size:15px !important;
      letter-spacing:.13em !important;
    }

    @media (max-width:1000px){
      :root{--nikita-sidebar:280px}
      .moduleBtn{font-size:16px !important;min-height:46px !important}
      .moduleBtn .moduleNum{font-size:15px !important}
    }

    @media (max-width:760px){
      :root{--nikita-sidebar:250px}
      .moduleBtn{font-size:15px !important}
    }
  `;

  function enhance(){
    try{
      const d=frame.contentDocument || frame.contentWindow.document;
      if(!d || !d.head) return;
      let style=d.getElementById('nikita-classroom-view-fix');
      if(!style){
        style=d.createElement('style');
        style.id='nikita-classroom-view-fix';
        d.head.appendChild(style);
      }
      style.textContent=css;
      d.documentElement.classList.add('nikitaClassroomView');
    }catch(e){
      console.error('Classroom view enhancement failed',e);
    }
  }

  frame.addEventListener('load',()=>{
    enhance();
    setTimeout(enhance,250);
    setTimeout(enhance,900);
  });
})();
</script>
</body>
</html>
