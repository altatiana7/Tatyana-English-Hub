p:7px;min-height:0;flex:1}.word{background:#f7fafc;border:1px solid #c7d2dc;border-radius:8px;text-align:left;padding:8px;font-size:clamp(13px,1.1vw,16px);font-weight:700}.word.on{border-color:#c09a47;background:#fff1c8}.flash{flex:1;min-height:0;width:100%;border:2px solid #d6bd75;background:#fff9e9;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:13px;padding:15px}.flash strong{font:750 clamp(29px,3.3vw,48px) Georgia,serif}.flash span{font-size:clamp(17px,1.8vw,24px)}.input{flex:1;min-width:0;padding:9px;border:1px solid #aebfcf;border-radius:8px}.reading{overflow:auto;font-size:clamp(15px,1.33vw,18px);line-height:1.5}.reading p{margin:0 0 12px}.passage{background:#f8fafb;border-left:4px solid #76a3c3;padding:9px 11px;border-radius:4px}.headinggrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.pair{display:flex;align-items:center;gap:9px}.pair b{width:23px}.pair select{min-width:0;flex:1;padding:8px;border:1px solid #a9bccd;border-radius:7px;font:inherit}.tf{display:grid;grid-template-columns:1fr 80px 80px;gap:7px;align-items:center;font-size:clamp(14px,1.28vw,17px);padding:6px;border-bottom:1px solid #e7edf1}.tf button{border:1px solid #b9c8d3;background:white;border-radius:7px;padding:6px}.tf button.on{background:var(--gold);border-color:#a37e32}.tf.correct{background:var(--good)}.tf.incorrect{background:var(--bad)}.gapline{display:grid;grid-template-columns:1fr 220px;gap:9px;align-items:center;border-bottom:1px solid #e5edf1;padding:7px 0;font-size:clamp(14px,1.25vw,17px)}.gapline input{min-width:0;width:100%;border:1px solid #afbeca;border-radius:7px;padding:8px}.gapline.correct{background:var(--good)}.gapline.incorrect{background:var(--bad)}.talk{font:700 clamp(23px,2.5vw,35px) Georgia,serif}.prompt{background:#f5f8fc;border:1px solid #c8d5e1;border-radius:8px;padding:10px;font-size:clamp(16px,1.5vw,19px)}.writing{width:100%;flex:1;resize:none;border:1px solid #aebfcf;border-radius:8px;padding:10px;font-size:17px}.colour{height:110px;border-radius:12px;background:linear-gradient(90deg,#15357c 0%,#224aab 48%,#66b7f5 52%,#9ed8fa 100%);flex-shrink:0;display:flex;align-items:end;justify-content:space-between;padding:10px;color:white;font-weight:800;text-shadow:0 1px 3px #123}.timer{font:800 48px Georgia,serif;text-align:center}.hidden{display:none!important}

</style></head><body><header><div class="logo">LANGUAGE & THINKING · B1</div><nav class="nav" id="nav"></nav><button class="go" id="back" onclick="go(-1)">Back</button><button class="go" id="next" onclick="go(1)">Next</button></header><main id="app"></main><script>
const words=[['to shape','влиять на формирование','A language may shape how we describe an event.'],['perception','восприятие','Words can influence our perception of colour.'],['cardinal directions','стороны света','North, south, east and west are cardinal directions.'],['by accident','случайно','He broke the vase by accident.'],['to blame','винить','We should not blame someone without evidence.'],['pay attention to','обращать внимание на','Pay attention to the differences in these colours.'],['bilingual','владеющий двумя языками','She is bilingual: she speaks Russian and English.']];
const headings=['Who broke it?','Blue or light blue?','No “left” or “right”','Time moves differently'];
const paras=[
'In English, people often describe space with left, right, front and back. But speakers of Kuuk Thaayorre, an Aboriginal language in Australia, commonly use cardinal directions: north, south, east and west. For example, they can describe an object as being to the southeast. This requires them to pay attention to direction in everyday life.',
'Language may also influence how people arrange time. English speakers often put pictures of events from left to right. Some speakers of languages written from right to left may prefer the opposite direction. In experiments, Kuuk Thaayorre speakers arranged time from east to west, depending on the direction they were facing.',
'English has one basic colour word for blue. Russian has two basic words: siniy for dark blue and goluboy for light blue. In some experiments, Russian speakers were faster at distinguishing certain shades across this boundary. This suggests that colour words may influence attention in particular tasks.',
'Imagine that a man breaks a vase by accident. English speakers may say, “He broke the vase.” In Spanish, people may instead say, “The vase broke.” In experiments on describing accidents, wording sometimes influenced what people remembered about who caused an event. But the effect depends on the situation.'
];
const matches=[2,3,1,0];
const tfs=[
['Kuuk Thaayorre speakers commonly describe directions using north, south, east and west.',true,'The text says cardinal directions are used in everyday descriptions.'],
['Everyone who writes from right to left always imagines time moving that way.',false,'The text says some speakers may prefer this direction; “always” is too strong.'],
['English and Russian use exactly the same basic words for blue.',false,'Russian has siniy and goluboy as two basic words.'],
['Some experiments found a difference in speed for particular blue shades.',true,'The text describes task-specific differences in speed.'],
['Both “He broke the vase” and “The vase broke” describe a possible accident.',true,'The sentences highlight different aspects of the same event.'],
['Language makes it impossible to learn new ideas.',false,'The text does not support such a strong conclusion.']
];
const gaps=[
['I dropped the cup ________. I didn’t mean to!','by accident'],['Learning another language can ________ the way we think.','shape'],['Children who grow up ________ may switch between languages easily.','bilingual'],['You must ________ the signs when you drive.','pay attention to'],['Please don’t ________ me for the broken computer.','blame'],['North and south are two ________.','cardinal directions'],['Our ________ of an event may change when we hear different descriptions.','perception']
];
const warm=['How many languages do you speak or learn?','Point to north. Was it easy? Why?','English says “blue”, but Russian distinguishes “синий” and “голубой”. Does this mean people see different colours?'];
const debate=['Does speaking English make you feel different? Why?','Do articles (a/the) make you pay attention to information differently?','Would a world with just one language be better or worse?','How has English changed the way you enjoy films, music or the internet?','Can the way we describe an accident change who we blame?'];
const terms=[['тоска','a deep feeling of sadness or longing'],['сутки','a period of 24 hours'],['авось','hoping something will work out without a clear plan'],['подснежник','a small flower that grows early in spring'],['кипяток','water that is boiling or has just boiled']];
const tabs=['Warm-up','Words','Match','Reading','Headings','True/False','Use words','Untranslatable','Debate','Wrap-up'];
const minutes=[7,6,4,7,6,5,5,5,10,5];
let step=0,word=0,back=false,matchValues=[-1,-1,-1,-1,-1,-1,-1],readIndex=0,headValues=[-1,-1,-1,-1],headChecked=false,tfValues={},tfChecked=false,gapValues=['','','','','','',''],gapChecked=false,term=0,deb=0,debTime=60,debTimer=null,homeworkChoice=0,essay='';
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'),normal=s=>String(s).trim().toLowerCase().replace(/[.!?]+$/,'').replace(/\s+/g,' ');
function head(title,label,content){return '<div class="head"><span class="tag">'+label+'</span><h1>'+title+'</h1><span class="mins">'+minutes[step]+' MIN</span></div><div class="work">'+content+'</div>'}
function button(label,action,cls=''){return '<button class="btn '+cls+'" onclick="'+action+'">'+label+'</button>'}
function say(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.85;let vs=speechSynthesis.getVoices();u.voice=vs.find(x=>x.lang.startsWith('en-GB'))||vs.find(x=>x.lang.startsWith('en'))||null;speechSynthesis.speak(u)}
function render(){$('nav').innerHTML=tabs.map((t,i)=>'<button class="'+(step===i?'on':'')+'" onclick="openStep('+i+')">'+(i+1)+'. '+t+'</button>').join('');$('back').disabled=step===0;$('next').disabled=step===9;$('app').innerHTML=[start,flash,matching,read,chooseHead,trueFalse,fill,translate,discussion,wrap][step]();$('nav').querySelector('.on')?.scrollIntoView({inline:'nearest',block:'nearest'})}
function openStep(i){if(i<0||i>=tabs.length)return;clearInterval(debTimer);debTimer=null;speechSynthesis?.cancel();step=i;render()}function go(d){openStep(step+d)}
function start(){return head('Does your language control your brain?','01 · WARM-UP','<section class="pane aside"><h2>Think about your own experience</h2><p class="lead">Can two people look at the same world but pay attention to different things?</p><div class="colour"><span>DARK BLUE</span><span>LIGHT BLUE</span></div><p class="muted">One English word. Two common Russian colour terms.</p></section><section class="pane"><span class="tag">DISCUSS · 3 QUESTIONS</span>'+warm.map((t,i)=>'<div class="box"><b>'+(i+1)+'.</b> '+t+'</div>').join('')+'<div class="bottom"><span class="muted">Predict before reading. No right or wrong personal answers.</span>'+button('Learn the vocabulary →','go(1)','yellow')+'</div></section>')}
function flash(){let w=words[word];return head('Seven useful expressions','02 · VOCABULARY','<section class="pane aside"><span class="tag">CHOOSE A WORD</span><div class="cards">'+words.map((v,i)=>'<button class="word '+(word===i?'on':'')+'" onclick="selectWord('+i+')">'+(i+1)+'. '+v[0]+'</button>').join('')+'</div></section><section class="pane"><div class="row"><span class="tag">CARD '+(word+1)+'/7</span>'+button('▶ Listen','say(words[word][0])','yellow')+'</div><button class="flash" onclick="flip()"><small>'+(back?'TRANSLATION + EXAMPLE':'ENGLISH · CLICK TO FLIP')+'</small><strong>'+(back?w[1]:w[0])+'</strong><span>'+(back?w[2]:'Explain the expression in your own words.')+'</span></button><div class="row">'+button('← Previous','selectWord((word+6)%7)','light')+button('Flip','flip()','yellow')+button('Next →','selectWord((word+1)%7)')+button('▶ Example','say(words[word][2])','light')+'</div></section>')}
function selectWord(i){word=i;back=false;render()}function flip(){back=!back;render()}
function matching(){return head('Match words to their meanings','03 · CONTROLLED PRACTICE','<section class="pane aside"><h2>Check the meaning</h2><p>Choose the best definition for all seven expressions.</p><div class="gold">Then give an example with <b>by accident</b> and <b>pay attention to</b>.</div></section><section class="pane"><div class="scrolly">'+words.map((w,i)=>'<div class="pair" style="padding:5px 0"><b>'+(i+1)+'.</b><span style="width:165px;font-weight:700">'+w[0]+'</span><select onchange="matchSet('+i+',this.value)" aria-label="Definition '+w[0]+'"><option value="-1">Choose a definition...</option>'+['influence how something develops','the way we notice and understand things','north, south, east and west','not on purpose','say someone is responsible for something wrong','watch or think about something carefully','able to use two languages'].map((d,j)=>'<option value="'+j+'" '+(matchValues[i]===j?'selected':'')+'>'+d+'</option>').join('')+'</select></div>').join('')+'</div><div id="matchFb" class="feedback">Select definitions, then check all seven.</div><div class="bottom">'+button('Check answers','checkMatch()','yellow')+button('Show correct answers','showMatch()','light')+'</div></section>')}
function matchSet(i,v){matchValues[i]=Number(v)}function checkMatch(){let n=matchValues.filter((x,i)=>x===i).length;$('matchFb').textContent=n+'/7 correct. '+(n===7?'Great!':'Review the definitions that do not match.')}function showMatch(){$('matchFb').textContent=words.map((w,i)=>(i+1)+'. '+['influence development','understanding','north / south / east / west','not on purpose','hold responsible','focus carefully','speak two languages'][i]).join(' · ')}
function read(){return head('Does language shape thought?','04 · READING','<section class="pane aside"><h2>Read for the main idea</h2><div class="gold">About 7,000 languages are spoken around the world. They use different sounds, words and grammar.</div><p>Cognitive scientist Lera Boroditsky studies how language may shape attention, memory and perception.</p><div class="box"><b>Big question:</b> Does language control our thoughts, or can it influence some ways of thinking?</div></section><section class="pane"><div class="reading"><p><b>Does Your Language Control Your Brain?</b></p>'+paras.map((p,i)=>'<p class="passage"><b>Paragraph '+String.fromCharCode(65+i)+'</b> · '+p+'</p>').join('')+'<p><b>Conclusion:</b> Language does not prevent us from learning new ideas. But the words and grammar we use may direct our attention to certain details.</p></div><div class="bottom"><span class="muted">Adapted B1 teaching text; not a verbatim scientific article.</span>'+button('Headings →','go(1)','yellow')+'</div></section>')}
function chooseHead(){let p=readIndex;return head('Give every paragraph a heading','05 · READING CHECK','<section class="pane aside"><span class="tag">PARAGRAPH '+String.fromCharCode(65+p)+'/D</span><p class="lead">'+paras[p]+'</p><div class="bottom">'+button('← Previous','readMove(-1)','light')+button('Next paragraph →','readMove(1)','yellow')+'</div></section><section class="pane"><h2>Choose the best heading</h2><div class="answers">'+headings.map((h,i)=>'<button class="ans '+(headValues[p]===i?'good':'')+'" onclick="setHead('+i+')">'+(i+1)+'. '+h+'</button>').join('')+'</div><div class="feedback" id="headFb">'+(headValues[p]<0?'Choose a heading for this paragraph.':'Saved: '+headings[headValues[p]])+'</div><div class="bottom">'+button('Check all four','checkHeads()','yellow')+'<span class="muted">'+headValues.filter(x=>x>=0).length+'/4 selected</span></div></section>')}
function readMove(d){readIndex=(readIndex+d+4)%4;render()}function setHead(i){headValues[readIndex]=i;render()}function checkHeads(){$('headFb').textContent=headValues.filter((v,i)=>v===matches[i]).length+'/4 correct. Correct order: A–3, B–4, C–2, D–1.'}
function trueFalse(){return head('Fact, exaggeration or myth?','06 · TRUE / FALSE','<section class="pane aside"><h2>Go back to the text</h2><div class="box">Decide whether each statement matches the text.</div><div class="gold">Be careful with <b>always</b>, <b>never</b> and <b>everyone</b>. Scientific claims often need limits.</div><div class="bottom">'+button('Check all','checkTF()','yellow')+'</div></section><section class="pane"><div class="scrolly">'+tfs.map((x,i)=>'<div class="tf '+(tfChecked?(tfValues[i]===x[1]?'correct':'incorrect'):'')+'"><span><b>'+(i+1)+'.</b> '+x[0]+'</span>'+[true,false].map(v=>'<button class="'+(tfValues[i]===v?'on':'')+'" onclick="setTF('+i+','+v+')">'+(v?'True':'False')+'</button>').join('')+'</div>').join('')+'</div><div class="feedback" id="tfFb">'+(tfChecked?tfs.filter((v,i)=>tfValues[i]===v[1]).length+'/6 correct. '+tfs.map((v,i)=>(i+1)+'. '+(v[1]?'T':'F')).join(' · '):'Make your choices, then check.')+'</div></section>')}
function setTF(i,v){tfValues[i]=v;tfChecked=false;render()}function checkTF(){tfChecked=true;render()}
function fill(){return head('Use the vocabulary in context','07 · WORDS IN USE','<section class="pane aside"><h2>Complete all seven sentences</h2><p class="gold">Word bank: shape · perception · cardinal directions · by accident · blame · pay attention to · bilingual</p><p class="muted">Use the expression in the correct form.</p><div class="bottom">'+button('Check answers','checkGaps()','yellow')+'</div></section><section class="pane"><div class="scrolly">'+gaps.map((v,i)=>'<div class="gapline '+(gapChecked?(normal(gapValues[i])===normal(v[1])?'correct':'incorrect'):'')+'"><span><b>'+(i+1)+'.</b> '+v[0]+'</span><input aria-label="Answer '+(i+1)+'" value="'+esc(gapValues[i])+'" oninput="setGap('+i+',this.value)" placeholder="Type answer"></div>').join('')+'</div><div id="gapFb" class="feedback">'+(gapChecked?gaps.filter((v,i)=>normal(gapValues[i])===normal(v[1])).length+'/7 correct. Expected: '+gaps.map((v,i)=>(i+1)+'. '+v[1]).join(' · '):'Complete the sentences and press Check.')+'</div></section>')}
function setGap(i,v){gapValues[i]=v;gapChecked=false}function checkGaps(){gapChecked=true;render()}
function translate(){let v=terms[term];return head('Explain the untranslatable','08 · SPEAKING · TASK A','<section class="pane aside"><h2>Can you explain this Russian word?</h2><p class="lead">'+v[0]+'</p><p class="muted">Explain it in simple English without giving a one-word translation.</p><div class="box">Try: <b>It means…</b> / <b>It is a feeling of…</b> / <b>We use this when…</b></div><div class="bottom">'+button('← Previous','termMove(-1)','light')+button('Next word →','termMove(1)','yellow')+'</div></section><section class="pane"><h2>Guess → Describe → Compare</h2><div class="gold">Imagine you need to explain <b>'+v[0]+'</b> to someone who does not speak Russian.</div><textarea class="writing" id="termAnswer" placeholder="Write an explanation or discuss it orally…"></textarea><div id="termFb" class="feedback hidden"></div><div class="bottom">'+button('Show model explanation','termShow()','yellow')+button('Hear model','say(terms[term][1])','light')+'</div></section>')}
function termMove(d){term=(term+d+5)%5;render()}function termShow(){let e=$('termFb');e.classList.remove('hidden');e.textContent=terms[term][1]}
function discussion(){return head('Does language change who we are?','09 · SPEAKING · TASK B','<section class="pane aside"><span class="tag">QUESTION '+(deb+1)+'/5</span><h2>'+debate[deb]+'</h2><div class="gold">Use at least two words: <b>shape, perception, bilingual, pay attention to</b>.</div><div class="bottom">'+button('← Previous','debMove(-1)','light')+button('Next question →','debMove(1)','yellow')+'</div></section><section class="pane"><h2>Speak for one minute</h2><div class="timer" id="clock">'+String(Math.floor(debTime/60)).padStart(2,'0')+':'+String(debTime%60).padStart(2,'0')+'</div><div class="row">'+button('Start timer','startTimer()','yellow')+button('Reset','resetTimer()','light')+button('Show support','toggleHelp()','light')+'</div><div class="box hidden" id="speakingHelp"><b>Structure:</b> I think… because… / For example… / However… / In my experience… / In conclusion…</div><div class="gold">Give a real example from your experience rather than a general statement about all speakers.</div></section>')}
function debMove(d){deb=(deb+d+5)%5;resetTimer();render()}function startTimer(){clearInterval(debTimer);debTimer=setInterval(()=>{debTime=Math.max(0,debTime-1);if($('clock'))$('clock').textContent=String(Math.floor(debTime/60)).padStart(2,'0')+':'+String(debTime%60).padStart(2,'0');if(!debTime)clearInterval(debTimer)},1000)}function resetTimer(){clearInterval(debTimer);debTimer=null;debTime=60;if($('clock'))$('clock').textContent='01:00'}function toggleHelp(){$('speakingHelp').classList.toggle('hidden')}
