<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nikita · Teacher Check</title><style>*{box-sizing:border-box}body{margin:0;background:#eef5f3;font-family:Inter,Segoe UI,Arial,sans-serif;color:#102b3b}.wrap{max-width:1120px;margin:auto;padding:28px 18px 60px}.hero{background:linear-gradient(120deg,#0d3448,#1b6f69);color:white;border-radius:22px;padding:24px;box-shadow:0 14px 34px #0002}.hero b{font-size:12px;letter-spacing:.12em;color:#74dfdc}.hero h1{margin:7px 0 4px;font-size:34px}.card{background:#fff;border-radius:18px;padding:20px;margin-top:18px;box-shadow:0 8px 24px #0001}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}textarea,input{width:100%;border:1px solid #bdd0d7;border-radius:12px;padding:12px;font:14px/1.45 monospace;background:#fbfdfc}textarea{min-height:145px;margin:10px 0}.btn{border:0;border-radius:11px;padding:12px 16px;font-weight:900;cursor:pointer;background:#f4b928;color:#211707}.muted{color:#607681;font-size:13px}.bad{background:#fff0f0;color:#8d1b1b;border:1px solid #f1caca;border-radius:12px;padding:12px;margin-top:12px}.score{font-size:24px;font-weight:950;margin:2px 0 14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.pill{background:#eaf4f2;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #e7eeee;text-align:left;vertical-align:top}.ok{color:#16845b;font-weight:950}.no{color:#b51f25;font-weight:950}@media(max-width:700px){.hero h1{font-size:27px}table{font-size:12px}th:nth-child(4),td:nth-child(4){display:none}}</style></head><body><main class="wrap"><section class="hero"><b>TEACHER ONLY</b><h1>Nikita · Homework Check</h1><div>26 August 2026</div></section><section class="card"><div id="gate"><p><b>Teacher PIN</b></p><input id="pin" type="password" inputmode="numeric" placeholder="Enter PIN"><div style="margin-top:10px"><button class="btn" onclick="unlock()">OPEN CHECKER</button></div><div id="pinMsg"></div></div><div id="checker" style="display:none"><p><b>Paste Nikita's submission code</b></p><p class="muted">Paste the whole code exactly as Nikita sent it. Spaces or line breaks around the code are ignored.</p><textarea id="code" placeholder="eyJkYXRlIjo..."></textarea><button class="btn" onclick="grade()">CHECK ANSWERS</button><div id="out"></div></div></section></main><script>const KEY={ted:{1:['was'],2:['became'],3:['had studied'],4:['had not felt',"hadn't felt"],5:['changed'],6:['started'],7:['was becoming'],8:['wanted'],9:['moved'],10:['had discovered','had already discovered'],11:['was learning'],12:['used'],13:['did not simply memorise',"didn't simply memorise"],14:['tried'],15:['began'],16:['had studied'],17:['had been spending'],18:['had realised','had realized']},case1:{1:['investigation'],2:['offender'],3:['evidence'],4:['connection'],5:['discovery'],6:['contamination'],7:['unreliable'],8:['carefully']},case2:{1:['suspect'],2:['evidence'],3:['conviction'],4:['innocence'],5:['unreliable'],6:['offender'],7:['conviction','convictions'],8:['investigation']},lexis:{1:['charge'],2:['plead'],3:['sentenced'],4:['convicted'],5:['crime scene'],6:['evidence'],7:['suspect'],8:['culprit'],9:['serve'],10:['verify']}};function norm(v){return String(v||'').trim().toLowerCase().replace(/\s+/g,' ')}function unlock(){if(pin.value!=='2512'){pinMsg.innerHTML='<div class="bad">Wrong PIN</div>';return}gate.style.display='none';checker.style.display='block';code.focus()}function decodeSubmission(s){s=String(s||'').trim().replace(/\s+/g,'');const raw=decodeURIComponent(escape(atob(s)));return JSON.parse(raw)}function grade(){try{const d=decodeSubmission(code.value);if(!d||!d.answers)throw new Error('No answers');let total=0,okn=0,done=0;let h='<div class="tabs"><span class="pill">Submission date: '+(d.date||'—')+'</span></div><table><tr><th>Task</th><th>#</th><th>Nikita</th><th>Expected</th><th></th></tr>';Object.entries(KEY).forEach(([t,rows])=>Object.entries(rows).forEach(([n,v])=>{total++;const a=d.answers?.[t]?.[n]||'';if(norm(a))done++;const ok=v.map(norm).includes(norm(a));if(ok)okn++;h+=`<tr><td>${t}</td><td>${n}</td><td><b>${a||'—'}</b></td><td>${v.join(' / ')}</td><td class="${ok?'ok':'no'}">${ok?'✓':'✗'}</td></tr>`}));out.innerHTML=`<div class="score">${okn} / ${total} correct</div><div class="muted" style="margin-bottom:12px">Completed: ${done} / ${total}</div>`+h+'</table>'}catch(e){out.innerHTML='<div class="bad"><b>The submission code could not be read.</b><br>Make sure you pasted the full code, not the PIN or only part of the code.</div>'}}</script></body></html>
