['An unfamiliar expression may require cultural explanation.','REASONABLE CLAIM','Some phrases are best explained with context and examples.'],

['I can understand Arabic podcasts, but I cannot speak fluently yet.','I can understand Arabic podcasts, but I cannot yet.','speak fluently','A repeated verb phrase can be omitted after an auxiliary.'],
['I enjoy discussing languages, and my friend enjoys discussing languages too.','I enjoy discussing languages, and my friend does too.','enjoys discussing languages','Use does to stand for a repeated lexical verb phrase.'],

const el=id=>document.getElementById(id);const norm=s=>String(s).trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'');const escapeHTML=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.86;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>/^en-GB/.test(v.lang))||voices.find(v=>/^en/.test(v.lang))||null;speechSynthesis.speak(u)}

function draw(){el('nav').innerHTML=TABS.map((s,i)=>'<button class="'+(current===i?'active':'')+'" onclick="goto('+i+')">'+s+'</button>').join('');el('prev').disabled=current===0;el('next').disabled=current===9;el('app').innerHTML=[recall,context,predict,video,colours,identity,ellipsis,practice,surveyPage,debate][current]();el('nav').querySelector('.active')?.scrollIntoView({inline:'nearest',block:'nearest'});}
function recall(){let w=WORDS[cardNo];return shell('Build the language before the debate','VOCABULARY · 12 EXPRESSIONS','<section class="panel side"><span class="pill">ALL HOMEWORK WORDS · SELECT ONE</span><div class="shortlist">'+WORDS.map((v,i)=>'<button class="'+(i===cardNo?'active': '')+'" onclick="cardGo('+i+')">'+String(i+1).padStart(2,'0')+' · '+v[0]+'</button>').join('')+'</div><p class="tiny">Click a phrase, pronounce it, flip it, then make your own sentence.</p></section><section class="panel"><div class="toolbar"><span class="pill">QUIZLET-STYLE CARD · '+(cardNo+1)+'/12</span>'+btn('▶ Hear word','speak(WORDS[cardNo][0])','gold')+'</div><button class="card" onclick="flip()"><span class="tiny">'+(flipped?'MEANING + EXAMPLE':'ACTIVE RECALL · FLIP TO CHECK')+'</span><strong>'+(flipped?w[1]:w[0])+'</strong><em>'+(flipped?w[2]:'What does it mean? Where could you use it?')+'</em></button><div class="toolbar">'+btn('◀ Previous','cardGo((cardNo+11)%12)','alt')+btn('Flip','flip()','gold')+btn('Next ▶','cardGo((cardNo+1)%12)')+btn('▶ Example','speak(WORDS[cardNo][2])','alt')+'</div></section>')}

function context(){const c=CASES[caseNo],correct=c[1],opts=[WORDS[correct][0],WORDS[(correct+5)%12][0],WORDS[(correct+8)%12][0]];const chosen=caseDone[caseNo];return shell('Use it in a real situation','CONTROLLED PRACTICE · 12 CASES','<section class="panel side"><span class="pill">SITUATION '+(caseNo+1)+'/12</span><p class="lead">'+c[0]+'</p><div class="goldbox">'+c[2]+'</div><p class="sub">After choosing, say one original sentence about language learning, religion, communication or culture.</p></section><section class="panel"><h2>Which phrase fits best?</h2>'+chooseMarkup(opts,'casePick',chosen,0)+'<div class="notice '+(chosen!==undefined?(chosen===0?'good':'bad'):'')+'">'+(chosen===undefined?'Choose a phrase to see the meaning and model.':escapeHTML(WORDS[correct][1]+' — '+WORDS[correct][2]))+'</div><div class="foot">'+btn('← Previous','caseGo(-1)','alt')+'<span class="counter">'+Object.keys(caseDone).length+' /12 checked</span>'+btn('Next case →','caseGo(1)','gold')+'</div></section>')}
function caseGo(d){caseNo=(caseNo+d+12)%12;draw()}function casePick(n){caseDone[caseNo]=n;draw()}
function predict(){return shell('Before you watch: take a position','WARM-UP · PREDICTION','<section class="panel side"><h2>Three hypotheses</h2><p class="lead">Does the language we speak change the way we think?</p><p class="sub">Choose a position for each claim. Support it with one reason, not just “yes” or “no”.</p><div class="box">Useful phrases:<br><b>There may be some evidence that…</b><br><b>To some extent…</b><br><b>It depends on…</b></div></section><section class="panel"><div class="slots"><div class="goldbox">A · Different languages may categorise colours differently.</div><div class="goldbox">B · Bilingual people always have two personalities.</div><div class="goldbox">C · Grammatical gender might affect some associations.</div><div class="goldbox">D · Learning Arabic could change how I notice cultural norms.</div></div><div class="notice">Discuss: Which claims sound plausible? Which are too absolute? What evidence would convince you?</div><div class="foot"><span class="sub">Prediction → watch → revisit</span>'+btn('Go to video →','goto(3)','gold')+'</div></section>')}
function video(){const q=VIDEO_Q[quizNo],done=quizDone[quizNo];const opts=q[1];return shell('Do we think differently in different languages?','BBC IDEAS · VIDEO + CHECK','<section class="panel" style="flex:1.15"><div class="toolbar"><span class="pill">WATCH · ONLINE CONNECTION REQUIRED</span><span class="sub">Original BBC Ideas video</span></div><div class="video"><iframe title="BBC Ideas: Do we think differently in different languages?" loading="lazy" src="https://www.youtube-nocookie.com/embed/XINQvKbqzq0" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen></iframe></div><div class="toolbar"><a class="btn alt" target="_blank" rel="noopener" href="https://www.youtube.com/watch?v=XINQvKbqzq0">Open on YouTube</a><span class="sub">Watch first; then answer the five questions.</span></div></section><section class="panel" style="flex:.85"><span class="pill">VIDEO CHECK · '+(quizNo+1)+'/5</span><h3>'+q[0]+'</h3>'+chooseMarkup(opts,'videoPick',done,q[2])+'<div class="notice">'+(done===undefined?'Choose the best answer.':q[3])+'</div><div class="foot">'+btn('← Previous','quizGo(-1)','alt')+btn('Next question →','quizGo(1)','gold')+'</div></section>')}

const shades=['#1b8878','#168b79','#198c7a','#1a8b7a','#188b76','#178a77','#1b8a79','#1c8979','#198a78','#168978','#1a8978','#198c79'];const targetIndex=[4,9,2,7][0];
function colours(){let target=[4,9,2,7][colourRound],pick=colourDone[colourRound];return shell('The colour experiment','VISUAL CHALLENGE · NOT A DIAGNOSTIC TEST','<section class="panel side"><span class="pill">ROUND '+(colourRound+1)+'/4</span><h2>Can you spot the odd shade?</h2><div class="box">All squares are similar. One differs slightly. Choose the square you think is different.</div><div class="notice '+(pick!==undefined?'good':'')+'">'+(pick===undefined?'No time limit: try once, then compare.':pick===target?'You found the target square.':'The target was square '+(target+1)+'.')+'</div><p class="tiny">This is a classroom visual demonstration, not a replication of the Himba study. Display settings and individual vision affect results.</p><div class="foot">'+btn('New round →','colourNext()','gold')+'</div></section><section class="panel"><div class="colorgrid">'+shades.map((s,i)=>{let col=(i===target?['#2c9d86','#2c9d86','#2c9d86','#2c9d86'][0]:'#198a79');return '<button style="background:'+col+'" aria-label="Colour '+(i+1)+'" class="swatch '+(pick===i?'picked':'')+'" '+(pick!==undefined?'disabled':'')+' onclick="colourPick('+i+')"><strong>'+(i+1)+'</strong></button>'}).join('')+'</div><div class="goldbox"><b>Debrief:</b> If someone performs differently, does that prove their native language caused it? What other explanations should we consider?</div></section>')}

function identity(){let x=IDENT[identNo],v=identDone[identNo],correct=x[1];return shell('The Personality Switch','CRITICAL THINKING · PERSONAL EXPERIENCE','<section class="panel side"><span class="pill">STATEMENT '+(identNo+1)+'/6</span><h2>What sort of claim is this?</h2><p class="lead">“'+x[0]+'”</p><div class="box">Do not confuse a personal report with a universal scientific conclusion.</div><div class="foot">'+btn('← Previous','identMove(-1)','alt')+btn('Next →','identMove(1)','gold')+'</div></section><section class="panel"><div class="options">'+['PERSONAL REPORT','REASONABLE CLAIM','OVERCLAIM'].map((v,i)=>'<button class="opt '+(identDone[identNo]!==undefined?(v===correct?'correct':v===identDone[identNo]?'wrong':''):'')+'" onclick="identPick('+i+')" '+(identDone[identNo]!==undefined?'disabled':'')+'>'+v+'</button>').join('')+'</div><div class="notice">'+(v===undefined?'Select a category and justify your decision.':x[2])+'</div><div class="goldbox"><b>Discuss:</b> Have you felt different using English or another language? Give a concrete example. If not, explain why that could also be normal.</div></section>')}
function identPick(i){identDone[identNo]=['PERSONAL REPORT','REASONABLE CLAIM','OVERCLAIM'][i];draw()}function identMove(d){identNo=(identNo+d+6)%6;draw()}
function ellipsis(){let x=ELL[ellNo],a=ellDone[ellNo],rule=ruleDone[ellNo];return shell('What words have disappeared?','ELLIPSIS · GUIDED DISCOVERY','<section class="panel side"><span class="pill">DISCOVER '+(ellNo+1)+'/5</span><h3>Full statement</h3><div class="box">'+x[0]+'</div><h3>Shorter statement</h3><div class="goldbox">'+x[1]+'</div><div class="foot">'+btn('← Previous','ellMove(-1)','alt')+btn('Next →','ellMove(1)','gold')+'</div></section><section class="panel"><h3>1 · Recover the omitted words</h3><div class="toolbar"><input class="input" id="ellInput" placeholder="Type the missing words" value="'+escapeHTML(a?.typed||'')+'">'+btn('Check','ellCheck()','gold')+btn('Reveal','ellReveal()','alt')+'</div><div class="notice" id="ellMsg">'+(a?(a.good?'Correct. ':'Model: ')+x[2]:'Compare the full and shortened statements.')+'</div><h3>2 · Which rule explains this example?</h3>'+chooseMarkup([x[3],'Any word may be omitted even if the sentence becomes unclear.','Ellipsis is only possible in questions.'],'rulePick',rule,0)+'<div class="notice">'+(rule!==undefined?x[3]:'Choose the rule before moving on.')+'</div></section>')}
function ellMove(d){ellNo=(ellNo+d+5)%5;draw()}function ellCheck(){let typed=el('ellInput').value;ellDone[ellNo]={typed,good:norm(typed)===norm(ELL[ellNo][2])};draw()}function ellReveal(){el('ellMsg').textContent='Omitted words: '+ELL[ellNo][2]}function rulePick(i){ruleDone[ellNo]=i;draw()}
function practice(){const x=ELLP[ellpNo],v=ellpDone[ellpNo];const order=ellpNo%2===0?[0,1,2]:[2,0,1];const choices=[x[0],x[1],x[2]];return shell('Say the same thing with fewer words','ELLIPSIS · CONTROLLED PRACTICE','<section class="panel side"><span class="pill">QUESTION '+(ellpNo+1)+'/8</span><h2>Original</h2><div class="goldbox">'+x[0]+'</div><p class="sub">Which shorter version keeps the meaning and grammar?</p><div class="foot">'+btn('← Previous','practiceMove(-1)','alt')+btn('Next →','practiceMove(1)','gold')+'</div></section><section class="panel"><h3>Select the best rewrite</h3>'+chooseMarkup([x[1],x[2],x[0]],'practicePick',v,0)+'<div class="notice">'+(v===undefined?'Keep an auxiliary when the repeated verb phrase is omitted.':v===0?'Correct. The repeated information is recoverable.':'Review the auxiliary or the repeated words; the shorter correct sentence is: '+x[1])+'</div><div class="goldbox">Now make one comparison about English, Russian or Arabic using the same pattern.</div></section>')}
function practicePick(i){ellpDone[ellpNo]=i;draw()}function practiceMove(d){ellpNo=(ellpNo+d+8)%8;draw()}
function setSurvey(i,j,v){survey[i][j]=v}
function surveyPage(){return shell('Compare the languages you know','PERSONALISED SPEAKING · TABLE','<section class="panel"><div class="toolbar"><span class="pill">COMPLETE WHILE TALKING</span><span class="sub">Your own experience · no single correct answer</span></div><div class="tablehead"><span>Language</span><span>Learning challenge</span><span>Personality / feelings</span><span>Cultural expression</span></div><div class="tablelist">'+survey.map((r,i)=>'<div class="tablerow">'+r.map((v,j)=>'<input aria-label="Row '+i+' field '+j+'" oninput="setSurvey('+i+','+j+',this.value)" value="'+escapeHTML(v)+'" placeholder="'+['Name','What is hardest?','How do you feel?','Untranslatable phrase?'][j]+'">').join('')+'</div>').join('')+'</div><div class="notice"><b>Questions:</b> Which language is easiest to argue in? Can you express anger or humour equally well? What gets lost in translation? Can you get your point across in Arabic?</div></section><section class="panel side narrow"><h2>Follow-up prompts</h2><div class="goldbox">Can you give an example?</div><div class="goldbox">Would that be true for everyone?</div><div class="goldbox">Which phrase is culturally embedded?</div><div class="goldbox">What might shape your perception?</div><div class="push sub">Next: use your table to make five statements with ellipsis.</div></section>')}
function debate(){let s=claims[claimsNo];return shell('The Language Paradox — defend your view','SPEAKING CHALLENGE · 90 SEC + WRITING','<section class="panel side narrow"><span class="pill">CLAIM '+(claimsNo+1)+'/5</span><p class="lead">“'+s+'”</p><div id="timer" class="bigtime">'+timeStr()+'</div><div class="toolbar">'+btn('Start 90 sec','startClock()','gold')+btn('Reset','resetClock()','alt')+'</div><div class="toolbar">'+btn('← Claim','claimMove(-1)','alt')+btn('Next claim →','claimMove(1)')+'</div><button class="btn alt" onclick="toggleSupport()">Show / hide speaking support</button>'+(support?'<div class="box">Position → Evidence → Counterargument → Conclusion.<br><br>Use: <b>to some extent; get your point across; culturally embedded; shape perception</b>.</div>':'')+'</section><section class="panel"><div class="toolbar"><span class="pill">FINAL OUTPUT · FIVE STATEMENTS</span><span class="sub">Make each comparison shorter with ellipsis</span></div><div class="statements">'+sentences.map((v,i)=>'<label class="statement"><b>'+(i+1)+'.</b><textarea placeholder="Write your comparison..." oninput="setSentence('+i+',this.value)">'+escapeHTML(v)+'</textarea></label>').join('')+'</div><div class="toolbar">'+btn('Show two models','showModels()','alt')+btn('Check 5 sentences','checkSentences()','gold')+'</div><div id="finalmsg" class="notice">Write five conclusions about languages you know. Use at least three active phrases and ellipsis.</div></section>')}
function timeStr(){return String(Math.floor(clock/60)).padStart(2,'0')+':'+String(clock%60).padStart(2,'0')}function startClock(){clearInterval(interval);interval=setInterval(()=>{clock=Math.max(0,clock-1);if(el('timer'))el('timer').textContent=timeStr();if(clock===0)clearInterval(interval)},1000)}
function resetClock(){clearInterval(interval);interval=null;clock=90;if(el('timer'))el('timer').textContent=timeStr()}
function claimMove(d){claimsNo=(claimsNo+d+5)%5;resetClock();draw()}function toggleSupport(){support=!support;draw()}function setSentence(i,t){sentences[i]=t}
function showModels(){el('finalmsg').textContent='I can explain complex ideas in English, but in Arabic I cannot yet. | Russian uses some colour categories differently, and English does too.'}
function checkSentences(){let n=sentences.filter(s=>s.trim()).length;el('finalmsg').textContent=n===5?'Five statements completed. Check each omitted phrase and the three active expressions.':'You have written '+n+'/5 statements. Complete the rest.'}
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;if(e.altKey&&e.key==='ArrowRight')goto(current+1);if(e.altKey&&e.key==='ArrowLeft')goto(current-1)});
draw();
</script></body></html>
