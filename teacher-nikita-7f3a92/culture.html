to find the right word under pressure."],["be culturally embedded","быть укоренённым в культуре","Some expressions are culturally embedded."],["switch between languages","переключаться между языками","Bilingual speakers switch between languages."],["shape our perception","влиять на наше восприятие","Words may shape our perception of colour."]],"MC":[["When progress stops despite regular practice, you have…",["hit a plateau","picked up a language","conveyed a meaning"],0],["To communicate your idea successfully is to…",["lose something in translation","get your point across","hit a plateau"],1],["To understand a complicated grammar rule is to…",["get your head around it","switch between languages","have a knack for languages"],0],["When a joke does not work in another language, it may…",["shape perception","lose something in translation","overcome a barrier"],1],["To learn phrases naturally through exposure is to…",["pick up a language","convey a subtle meaning","hit a plateau"],0],["Someone naturally talented at languages…",["struggles to find words","has a knack for languages","loses meaning"],1],["To express a delicate nuance is to…",["convey a subtle meaning","switch between languages","overcome a barrier"],0],["An expression closely tied to local customs is…",["culturally embedded","fluent in","at a plateau"],0],["Moving from Russian to English during a conversation means…",["shaping perception","switching between languages","losing translation"],1],["To get past difficulty communicating abroad is to…",["overcome a language barrier","hit a plateau","pick up a word"],0],["When you cannot remember the exact expression, you…",["have a knack for languages","struggle to find the right word","convey a subtle meaning"],1],["Words may influence how we categorise experiences: they can…",["shape our perception","lose a barrier","hit a nuance"],0]],"CLOZE":[["After months of study, I finally ____ and needed a new approach.","hit a plateau"],["Even with mistakes, she managed to ____.","get her point across"],["I cannot ____ the grammar of this sentence.","get my head around"],["Some humour can ____ when translated.","lose something in translation"],["He tends to ____ new expressions from podcasts.","pick up"],["She has always ____ foreign languages.","had a knack for"],["It is hard to ____ the emotional nuance in English.","convey"],["These greetings are deeply ____ in local customs.","culturally embedded"],["A beginner may need time to ____ the language barrier.","overcome"],["I often ____ when speaking under pressure.","struggle to find the right word"],["Bilinguals may ____ depending on context.","switch between languages"],["The words we use can sometimes ____ our perception.","shape"]],"READING":"Imagine explaining a joke that makes perfect sense in Russian but falls flat in English. You may translate every word accurately and still fail to convey the humour. That is because meaning depends on shared experiences, cultural references and context, not just vocabulary.\n\nSome researchers study linguistic relativity: the possibility that language influences certain aspects of attention, memory or categorisation. For example, languages differ in how they label colours, space and time. Such differences may affect performance on particular tasks. However, the strong claim that language determines what people can think is not supported by the evidence. People can learn new concepts even when their language lacks a single word for them.\n\nAnother interesting question is whether we feel different when speaking a foreign language. Some bilingual speakers report feeling more emotionally distant when discussing sensitive topics in a second language. Yet this varies with proficiency, experience, setting and personal history. It would be misleading to claim that everyone becomes more rational or develops a new personality.\n\nFor an adult learning Arabic, the challenge is more than memorising grammar. A learner may need to get their head around unfamiliar writing conventions, expressions and social contexts. A useful strategy is to notice what gets lost in translation, ask speakers what phrases imply, and practise explaining ideas in several ways. Fluency is not perfect imitation: it is the ability to get your point across while remaining curious about nuance.","RQUEST":[["Why can an accurately translated joke fail?",["Because context and shared knowledge matter","Because grammar always changes","Because jokes cannot be translated"],0],["What does linguistic relativity investigate?",["Whether language influences some cognitive processes","Whether all languages are equally old","Whether adults can learn languages"],0],["Which claim is described as unsupported?",["Language determines everything people can think","Language may influence some tasks","Languages label colours differently"],0],["What can people do without a single word for a concept?",["Still learn and discuss the concept","Never understand it","Only understand it in childhood"],0],["How do some bilinguals describe using a second language?",["Feeling more emotionally distant in some situations","Always feeling more intelligent","Losing all emotional reactions"],0],["What affects emotional responses in another language?",["Experience, proficiency and context","Only grammar rules","Only vocabulary size"],0],["What is suggested for learners of Arabic?",["Explore implied meanings and social contexts","Avoid asking native speakers questions","Translate each word literally"],0],["What does fluency mean in the final paragraph?",["Communicating effectively while noticing nuance","Speaking with zero errors","Knowing every dictionary definition"],0],["What is the author tone?",["Balanced and cautious","Certain and absolute","Dismissive of research"],0],["What is the central argument?",["Language, culture and thought interact in complex ways","Translation is always impossible","Learning a language changes personality in every case"],0]],"CLAIMS":["Language shapes the way we see the world.","You can never fully understand a culture without speaking its language.","People are more honest when they speak a foreign language.","Some feelings are impossible to translate.","Learning a new language gives you a new personality.","AI translation will make learning foreign languages unnecessary.","A foreign language makes difficult decisions less emotional.","An accent is part of someone’s identity.","Learning Arabic would change how I interpret everyday politeness.","Being fluent means never needing to translate in your head."],"CASES":[["The silent learner","A learner understands podcasts but freezes in conversation."],["The endless plateau","A motivated adult has stopped noticing progress."],["The literal translator","A student translates jokes word for word and nobody laughs."],["The anxious speaker","A fluent learner avoids speaking because of an accent."],["The culture shock","A learner knows the vocabulary but misreads polite requests."]],"TRANSLATIONS":[["saudade","Portuguese","A deep sense of longing, often for someone or something absent."],["hygge","Danish","A sense of cosy comfort and togetherness."],["wasta","Arabic","Connections or influence used to navigate social or institutional situations; usage and connotations vary."],["tarab","Arabic","A state of musical enchantment or emotional absorption, often linked to performance."],["komorebi","Japanese","Sunlight filtering through leaves."],["toska","Russian","A broad feeling of yearning, melancholy or spiritual anguish, depending on context."]],"REPAIR":[["The pun was easy to translate, but the humour was lost ____ translation.","in","by","through","“Lost in translation” is the conventional expression for meaning that disappears in translation."],["It took me months to get my head ____ the Arabic alphabet.","around","on","over","“Get your head around” = understand something difficult."],["I have hit a ____ because I keep revising the same easy phrases.","plateau","barrier","meaning","“Hit a plateau” means progress has temporarily stalled."],["We had different opinions, but I got my point ____.","across","over","off","“Get your point across” means communicate your message successfully."],["Arabic greetings are deeply embedded ____ social customs.","in","on","with","“Embedded in” means closely connected to an established context."],["I picked ____ some expressions just by listening to colleagues.","up","off","out","“Pick up” language naturally means acquire it through exposure."],["It is hard to convey the ____ meaning of this word.","subtle","tiny","little","“Subtle meaning” is a natural collocation for a fine distinction."],["Fluent speakers often switch ____ languages without noticing.","between","among","through","“Switch between” is used for alternating two options."],["I struggle to find the right word when I am ____ pressure.","under","below","by","The fixed collocation is “under pressure”."],["The new phrase may shape how we ____ everyday events.","perceive","convey","overcome","“Perceive” means interpret or become aware of something."]],"HEDGES":[["Learning a second language always changes your personality.","may influence how some people express themselves","proves people become new personalities","must change everyone equally","Evidence supports cautious, context-dependent claims, not universal transformation."],["Russian speakers see more shades of blue than English speakers.","may distinguish certain blue shades faster in some tasks","have biologically superior eyesight","cannot confuse two shades","The studied advantage concerns task speed, not visual capacity."],["Translating jokes word for word never works.","can sometimes fail because cultural context differs","is impossible in all languages","proves grammar causes humour","Absolute claims about all jokes cannot be justified."],["The second language makes people completely rational.","may alter emotional distance in some situations","removes all emotional responses","guarantees better decisions","The effect varies by person, proficiency and context."],["Arabic has no direct English equivalents for certain concepts.","some Arabic concepts require explanation beyond a single English word","Arabic cannot be translated","English speakers cannot understand Arabic culture","Translatability exists on a spectrum; explanations are possible."],["Language determines what every person can think.","can influence attention in certain tasks","fully controls every idea","makes abstract thought impossible","The strong deterministic claim is not supported."],["Everyone who learns Arabic thinks differently.","some learners notice differences in social conventions","all Arabic learners become more polite","learning Arabic completely reshapes morality","Avoid stereotypes and all-or-nothing quantifiers."],["A native accent proves you are fluent.","an accent alone is not a reliable measure of fluency","an accent guarantees comprehension","no accent means native-level fluency","Fluency concerns communication, not the absence of an accent."],["When words are untranslatable, ideas are unknowable.","ideas can often be explained using several words or examples","ideas stay inaccessible forever","dictionary entries cannot describe culture","Concepts can be learned even without a one-word equivalent."],["A person should never translate mentally.","translating mentally may be useful at some stages of learning","mental translation always prevents fluency","real bilinguals never translate","Mental translation is a strategy, not proof of failure."]],"EVIDENCE":[["If language shapes thought, it determines everything we can imagine.","overstated","“Influence” does not mean “determine”."],["Russian blue terms may affect the speed of some colour-comparison tasks.","plausible","Some experiments have found task-specific effects; not a universal advantage."],["Every bilingual has a distinct personality for each language.","overstated","Anecdotes do not support  and safe speaking opportunities, not accent erasure.","Refuse to speak until the accent disappears.","Stop practising complex topics.","An accent does not imply poor communication."],["The culture shock","A learner knows the vocabulary but misreads polite requests.","Ask about the social intention and compare contexts.","Assume every member of the culture behaves identically.","Translate all requests word for word.","Pragmatic meaning varies by relationship and situation."],["The Arabic discussion","Two speakers disagree about a religious interpretation.","Distinguish a text, an interpretation, and a follower’s belief.","Treat all followers as having the same interpretation.","Say disagreement proves someone does not understand language.","Use neutral language to discuss different readings and avoid stereotyping."]],"WALL":[["get your head around","understand"],["make sense of","understand"],["figure out","understand"],["pick up","learning"],["hit a plateau","learning"],["overcome a barrier","learning"],["have a knack for","learning"],["get your point across","communicate"],["convey a nuance","communicate"],["speak up","communicate"],["express yourself","communicate"],["lose in translation","communicate"],["shape perception","perception"],["distinguish shades","perception"],["categorise experience","perception"],["perceive the world","perception"],["think it through","understand"],["struggle for words","learning"],["switch languages","communicate"],["recognise patterns","perception"]],"EXIT":[["What is linguistic relativity?",["A hypothesis that language can influence some thinking processes","A claim that grammar defines intelligence","A method for learning Arabic"],0,"The careful claim is influence, not total determination."],["Which expression means understand a complex idea?",["hit a plateau","get your head around","get across a language"],1,"“Get your head around” means understand a difficult idea."],["What is a key problem with literal translation?",["It may miss cultural or pragmatic meaning","It always changes the alphabet","It requires perfect pronunciation"],0,"Communication depends on implication and social context."],["Which sentence is appropriately cautious?",["Language always changes identity","Language can influence attention in some tasks","Everyone thinks the same"],1,"Hedging accurately reflects uncertainty."],["Which concept describes longing or melancholy in Russian?",["hygge","tarab","toska"],2,"“Toska” covers a broad range of melancholy, depending on context."],["Which is a natural collocation?",["convey a subtle meaning","convey a barrier","hit a translation"],0,"“Convey a subtle meaning” is the established collocation."],["How might a plateau be overcome?",["By varying practice and doing purposeful output tasks","By stopping speaking","By memorising unrelated lists only"],0,"A new challenge can make the skill work more purposeful."],["Why is “language determines thought” too strong?",["Evidence shows limited, task-specific effects","Nobody studies language and cognition","All languages use identical colours"],0,"Task effects do not prove mental impossibility."],["Which is a fair claim about Arabic politeness?",["Every speaker follows one rule","Usage varies across relationships and settings","Culture cannot be discussed in English"],1,"Pragmatic conventions are contextual, not universal."],["What does it mean to get your point across?",["To express your idea clearly","To forget your words","To pronounce everything perfectly"],0,"Success depends on communication, not perfection."]]};

function bar(a,total){return `<div class="progress"><div style="width:${100*a/total}%"></div></div>`}
function feedback(text,good=true){return `<div class="feedback ${good?'ok':'bad'}">${text}</div>`}
function scene(){return `<div class="photo-grid">${[0,1,2,3,4,5].map((n)=>`<div class="photo p${n} ${factN%6===n?'on':''}" onclick="selectWarmPhoto(${n})" role="button" tabindex="0" aria-label="Select scene ${n+1}"><span class="caption">${['Blue & categories','Arabic & learning','Who broke the vase?','Space & direction','Talk across cultures','Emotion & identity'][n]}</span></div>`).join('')}</div>`}
function render(){clearInterval(wallTimer);clearInterval(debateTimer);$('steps').innerHTML=stages.map((n,i)=>`<button class="${i===current?'on':''}" onclick="openStage(${i})">${i+1}. ${n}</button>`).join('');$('back').disabled=current===0;$('next').disabled=current===stages.length-1;const views=[warm,cards,meaning,clozes,culture,dialogue,reading,grammar,evidence,cases,wordwall,debate,exit];$('stage').innerHTML=views[current]();$('steps').querySelector('.on')?.scrollIntoView({block:'nearest',inline:'nearest'});}
function openStage(i){current=Math.min(stages.length-1,Math.max(0,i));render()}function go(d){openStage(current+d)}
// Warm-up: prediction, photo, research nuance and connection to last lesson
function warm(){const f=facts[factN];return shell('01 / DISCOVER · 6 MIN','Do we see the same world in every language?',`<div class="panel w45">${scene()}</div><div class="panel wide"><div class="toolbar"><span class="badge">RESEARCH FACT ${factN+1}/3</span><span class="muted small">Predict → reveal → explain</span></div><h2>${f.q}</h2><p class="big">Is this supported, exaggerated, or a myth?</p><div class="fact-selects">${['Supported','Exaggerated','Not sure'].map(a=>btn(a,`pickFact('${a}')`,'secondary')).join('')}</div><div id="factreply" class="feedback ${selectFact?'ok':'hidden'}">${selectFact?'Prediction: '+selectFact+' — now reveal the finding.':''}</div>${btn('Reveal what the research says','revealFact()','gold')}<div id="factinfo" class="hidden"></div><div class="toolbar">${btn('Previous fact','changeFact(-1)','secondary small')}${btn('Next fact','changeFact(1)','small')}</div><div class="spacer"></div><p class="helper"><b>Transition:</b> Last time we explored what gets lost in translation. Could our words also affect what we notice?</p></div>`,'Choose a prediction first.');}
function selectWarmPhoto(n){$('factreply').classList.remove('hidden');$('factreply').textContent='Look at the selected image. Can you describe the experience using one phrase from last lesson?';}
function pickFact(a){selectFact=a;$('factreply').classList.remove('hidden');$('factreply').textContent='Your prediction: '+a+'. Give one reason before revealing.';}
function revealFact(){const f=facts[factN];$('factinfo').classList.remove('hidden');$('factinfo').innerHTML=`${feedback(`<b>Research note:</b> ${f.why}<p style="margin-top:8px"><b>Recycle this expression:</b> ${f.link}</p>`)}<p class="helper">Can you explain this finding in 2 sentences using <b>may</b>, <b>might</b> or <b>in some cases</b>?</p>`}
function changeFact(d){factN=(factN+d+facts.length)%facts.length;selectFact=null;render()}
// Quizlet cards
function cards(){const v=D.VOCAB[cardOrder[cardN]];return shell('02 / RECALL · 9 MIN','The same 12 expressions from last lesson',`<div class="panel w37">${photo(1,'Language learning is more than memorising words')}<p class="helper">Look at the expression. Explain it in English, make your own sentence, then flip for the meaning and model.</p><div class="toolbar">${btn('Hear the phrase','sayPhrase()','gold')}${btn('Shuffle cards','shuffleCards()','secondary')}</div></div><div class="panel wide"><div class="toolbar"><span class="badge">CARD ${cardN+1} / 12</span><span class="muted">Click the card to flip it.</span></div><button class="flash" onclick="flipCard()"><span class="label">${cardBack?'MEANING + MODEL':'ENGLISH · ACTIVE RECALL'}</span><span class="front">${cardBack?v[1]:v[0]}</span>${cardBack?`<span class="example">${v[2]}</span>`:`<span class="small muted">What does it mean? How would you use it?</span>`}</button>${bar(cardN+1,12)}<div class="toolbar">${btn('◀ Previous','moveCard(-1)','secondary')}${btn('Flip','flipCard()','gold')}${btn('Next ▶','moveCard(1)')}${btn('Speak example','sayExample()','secondary')}</div><div class="spacer"></div><p class="helper">Target output: one original sentence about Arabic, culture or communication.</p></div>`)}
function flipCard(){cardBack=!cardBack;render()}function moveCard(d){cardN=(cardN+d+12)%12;cardBack=false;render()}function shuffleCards(){for(let i=cardOrder.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cardOrder[i],cardOrder[j]]=[cardOrder[j],cardOrder[i]]}cardN=0;cardBack=false;render()}
function speak(text){if(!('speechSynthesis' in window)){alert('Speech synthesis is not available on this device.');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.88;const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith('en-GB'))||speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));if(v)u.voice=v;speechSynthesis.speak(u)}function sayPhrase(){speak(D.VOCAB[cardOrder[cardN]][0])}function sayExample(){speak(D.VOCAB[cardOrder[cardN]][2])}
// 12 questions, one activity per screen
function choiceScreen(k,name,q,options,ans,explain,checkFn){return shell(k,name,`<div class="panel w37">${photo((choiceN+1)%6,'Think before you choose')}<div class="pull">${explain||'Use the meaning and context, not a guess.'}</div><div class="spacer"></div><p class="count">Question ${choiceN+1} / ${D.MC.length}</p>${bar(choiceN+1,D.MC.length)}</div><div class="panel wide"><div class="badge">CHOOSE THE NATURAL EXPRESSION</div><h2>${q}</h2><div class="answers">${[0,1,2].map(j=>(j+choiceN)%3).map(i=>`<button class="answer" data-opt="${i}" onclick="answerMeaning(${i})">${options[i]}</button>`).join('')}</div><div id="choicefb"></div><div class="spacer"></div><div class="footer">${btn('Previous','stepChoice(-1)','secondary')}${btn('Next question','stepChoice(1)')}</div></div>`)}
function meaning(){const [q,opts,ans]=D.MC[choiceN];const v=D.VOCAB.find(x=>opts.includes(x[0]));return choiceScreen('03 / CONTROLLED PRACTICE · 8 MIN','Choose the best expression',q,opts,ans,`Choose by meaning and context. Explain why two distractors are wrong.`)}
function answerMeaning(i){const x=D.MC[choiceN];const ok=i===x[2];if(!selected['meaning'+choiceN]){score.meaning+=ok?1:0;selected['meaning'+choiceN]=true}const v=D.VOCAB.find(v=>v[0]===x[1][x[2]]);$('choicefb').innerHTML=feedback(`${ok?'Correct.':'Not quite.'} Correct: <b>${x[1][x[2]]}</b>. ${v?v[1]+' — '+v[2]:'This expression best matches the situation.'}`,ok);document.querySelectorAll('.answer').forEach((b)=>{let j=Number(b.dataset.opt);b.disabled=true;b.classList.toggle('good',j===x[2]);b.classList.toggle('bad',i===j&&j!==x[2])})}
function stepChoice(d){choiceN=(choiceN+d+D.MC.length)%D.MC.length;render()}
// 12 cloze in 3 rounds of 4
function clozes(){const start=repairRound*4;return shell('04 / OUTPUT PRACTICE · 9 MIN','Use the phrase — don’t just recognise it',`<div class="panel wide"><div class="toolbar"><span class="badge">ROUND ${repairRound+1}/3 · 4 SENTENCES</span><span class="helper">Type the full missing expression.</span></div><div class="scroll">${D.CLOZE.slice(start,start+4).map(([sentence,answer],i)=>`<div class="fieldline" id="cl${i}"><div><b>${start+i+1}.</b> ${sentence}</div><input data-q="${start+i}" autocomplete="off" placeholder="Type the expression" aria-label="Question ${start+i+1}"></div>`).join('')}</div><div id="clozefb"></div><div class="footer">${btn('Previous set','roundCloze(-1)','secondary')}${btn('Check these 4','checkCloze()','gold')}${btn('Next set','roundCloze(1)')}</div></div><div class="panel w37">${photo(1,'From recognition to real communication')}<h3>Teacher prompt</h3><p>After checking, ask Nikita to choose <b>two expressions</b> and use them to talk about Arabic or communication.</p><p class="helper">Accept meaningful grammatical variants, e.g. <i>gets the point across</i> in a different sentence. The automatic check uses the expected form in this context.</p><span class="badge">12 original expressions</span></div>`)}
function norm(s){return String(s).trim().toLowerCase().replace(/[’]/g,"'").replace(/\s+/g,' ').replace(/[.!?]+$/,'')}
function checkCloze(){let rows=[],correct=0;document.querySelectorAll('[data-q]').forEach((input,i)=>{const n=Number(input.dataset.q),target=D.CLOZE[n][1],ok=norm(input.value)===norm(target);rows.push(`${ok?'✓':'✗'} ${n+1}: ${target}`);correct+=Number(ok);$('cl'+i).classList.toggle('good',ok);$('cl'+i).classList.toggle('bad',!ok);if(!selected['cloze'+n]){score.cloze+=Number(ok);selected['cloze'+n]=true}});$('clozefb').innerHTML=feedback(`<b>${correct}/4 correct.</b> ${rows.join(' · ')}. Check the tense, particles and fixed collocations.`,correct===4)}function roundCloze(d){repairRound=(repairRound+d+3)%3;render()}
// cultural words, 6 with reveal and discussion
let cultureN=0;function culture(){let [term,language,meaning]=D.TRANSLATIONS[cultureN];return shell('05 / CULTURAL MEANING · 8 MIN','Some ideas take more than one word',`<div class="panel w40">${photo(cultureN%2?5:4,'Culture lives in context')}<div class="pull">Which expression from our original cards describes this situation?</div><p class="helper">After revealing, use a phrase from our original cards to explain why a literal translation may miss the nuance.</p></div><div class="panel wide"><div class="badge">${language.toUpperCase()} · ${cultureN+1}/6</div><h2 style="font-size:clamp(32px,4vw,53px)">${term}</h2><p class="big">Explain this to an English speaker without using a one-word translation.</p><div class="toolbar">${btn('Reveal cultural meaning','revealCulture()','gold')}${btn('Hear the term','speak(D.TRANSLATIONS[cultureN][0])','secondary small')}</div><div id="culture-reveal" class="hidden"></div><div class="spacer"></div><div class="footer">${btn('Previous','moveCulture(-1)','secondary')}${btn('Next concept','moveCulture(1)')}</div></div>`)}
function revealCulture(){let x=D.TRANSLATIONS[cultureN];$('culture-reveal').classList.remove('hidden');$('culture-reveal').innerHTML=feedback(`<b>Meaning:</b> ${x[2]}<p style="margin-top:8px"><b>Useful expressions:</b> <i>be culturally embedded</i> / <i>lose something in translation</i>. <b>Your challenge:</b> Explain the meaning using <i>convey</i>, <i>cultural context</i> or <i>subtle nuance</i>.</p>`)}function moveCulture(d){cultureN=(cultureN+d+6)%6;render()}
// dialogue repair, 10 single MC with feedback
let dialogueN=0;function dialogue(){let x=D.REPAIR[dialogueN];return shell('06 / LANGUAGE IN USE · 8 MIN','Repair the conversation',`<div class="panel w37">${photo(4,'A real conversation across cultures')}<p class="pull">“I can translate every word, but I still can’t get my point across.”</p><p class="helper">What particle, collocation or word makes the sentence natural?</p></div><div class="panel wide"><div class="badge">SENTENCE ${dialogueN+1}/10</div><h2>${x[0]}</h2><div class="answers">${[0,1,2].map(j=>(j+dialogueN)%3).map(i=>`<button class="answer" data-opt="${i}" onclick="dialogueAnswer(${i})">${x[i+1]}</button>`).join('')}</div><div id="dialogue-fb"></div><div class="spacer"></div><div class="footer">${btn('Previous','moveDialogue(-1)','secondary')}${btn('Next','moveDialogue(1)')}</div></div>`)}
function dialogueAnswer(i){let x=D.REPAIR[dialogueN],ok=i===0;if(!selected['dlg'+dialogueN]){score.dialogue+=Number(ok);selected['dlg'+dialogueN]=true}$('dialogue-fb').innerHTML=feedback(`<b>${ok?'Correct.':'Not quite.'}</b> ${x[4]}`,ok);document.querySelectorAll('.answer').forEach(el=>{let n=Number(el.dataset.opt);el.disabled=true;el.classList.toggle('good',n===0);el.classList.toggle('bad',n===i&&i!==0)})}function moveDialogue(d){dialogueN=(dialogueN+d+10)%10;render()}
// reading and original 10 comprehension items
function reading(){let x=D.RQUEST[readN];return shell('07 / READING · 10 MIN','Does language shape thought?',`<div class="panel wide"><div class="toolbar"><h2>Lost in Translation</h2><span class="badge">B2–C1 · ORIGINAL TEXT</span></div><div class="scroll reading">${D.READING.split('\n\n').map(s=>`<p>${s}</p>`).join('')}</div><div class="footer"><span class="small muted">Search for evidence in the text — don’t guess.</span></div></div><div class="panel w40"><div class="badge">INFERENCE & DETAIL · ${readN+1}/10</div><h3>${x[0]}</h3><div class="single-choice">${[0,1,2].map(j=>(j+readN)%3).map(i=>`<button class="answer" data-opt="${i}" onclick="answerRead(${i})">${x[1][i]}</button>`).join('')}</div><div id="reading-fb"></div><div class="spacer"></div><div class="footer">${btn('Previous','moveRead(-1)','secondary')}${btn('Next question','moveRead(1)')}</div></div>`)}
function answerRead(i){const x=D.RQUEST[readN],ok=i===x[2];if(!selected['read'+readN]){score.reading+=Number(ok);selected['read'+readN]=true}$('reading-fb').innerHTML=feedback(`<b>${ok?'Correct.':'Not quite.'}</b> ${x[1][x[2]]}. Find the exact sentence supporting this answer.`,ok);document.querySelectorAll('#stage .w40 .answer').forEach((e,j)=>{e.disabled=true;e.classList.toggle('good',j===x[2]);e.classList.toggle('bad',j===i&&i!==x[2])})}function moveRead(d){readN=(readN+d+10)%10;render()}
// cautious language / grammar 10
function grammar(){let x=D.HEDGES[hedgeN];return shell('08 / GRAMMAR & ARGUMENT · 8 MIN','Hedging: make a claim scientifically careful',`<div class="panel w37">${photo(0,'Science needs precise claims')}<div class="pull">Strong words to question: <b>always, never, everyone, completely, proves</b>.</div><h3>Useful language</h3><p><b>may / might / can / in some contexts / appears to / tends to</b></p><p class="helper">These structures show the strength of available evidence. They don’t weaken a well-argued point.</p></div><div class="panel wide"><span class="badge">REWRITE THE CLAIM · ${hedgeN+1}/10</span><div class="feedback bad"><b>Overstatement:</b> ${x[0]}</div><h3>Which version is the most defensible?</h3><div class="single-choice">${[0,1,2].map(j=>(j+hedgeN)%3).map(i=>`<button class="answer" data-opt="${i}" onclick="hedgeAnswer(${i})">${x[i+1]}</button>`).join('')}</div><div id="grammar-fb"></div><div class="spacer"></div><div class="footer">${btn('Previous','moveHedge(-1)','secondary')}${btn('Next','moveHedge(1)')}</div></div>`)}
function hedgeAnswer(i){let x=D.HEDGES[hedgeN],ok=i===0;if(!selected['hedge'+hedgeN]){score.grammar+=Number(ok);selected['hedge'+hedgeN]=true}$('grammar-fb').innerHTML=feedback(`<b>${ok?'Correct.':'Not quite.'}</b> ${x[4]}`,ok);document.querySelectorAll('.single-choice .answer').forEach(e=>{let j=Number(e.dataset.opt);e.disabled=true;e.classList.toggle('good',j===0);e.classList.toggle('bad',j===i&&i!==0)})}function moveHedge(d){hedgeN=(hedgeN+d+10)%10;render()}
// evidence verification: two-button judging
function evidence(){const x=D.EVIDENCE[evidenceN];return shell('09 / CRITICAL THINKING · 8 MIN','What can the evidence really support?',`<div class="panel w40">${photo(2,'Observe, interpret, question')}<h3>Research detective</h3><p>Decide if the claim is <b>plausible and qualified</b> or an <b>overstatement</b>.</p><p class="helper">Give one reason before choosing. Use: <i>There is some evidence that…</i> / <i>This goes beyond the evidence because…</i></p></div><div class="panel wide"><div class="badge">CLAIM ${evidenceN+1}/10</div><p class="debate-claim">${x[0]}</p><div class="answers"><button class="answer" onclick="evidenceAnswer('plausible')">Plausible / qualified</button><button class="answer" onclick="evidenceAnswer('overstated')">Overstated</button></div><div id="evidence-fb"></div><div class="spacer"></div><div class="footer">${btn('Previous','moveEvidence(-1)','secondary')}${btn('Next claim','moveEvidence(1)')}</div></div>`)}
function evidenceAnswer(val){let x=D.EVIDENCE[evidenceN],ok=val===x[1];if(!selected['evidence'+evidenceN]){score.evidence+=Number(ok);selected['evidence'+evidenceN]=true}$('evidence-fb').innerHTML=feedback(`<b>${ok?'Correct.':'Not quite.'}</b> ${x[2]}`,ok);document.querySelectorAll('.answers .answer').forEach(e=>e.disabled=true)}function moveEvidence(d){evidenceN=(evidenceN+d+10)%10;render()}
// practical scenarios
function cases(){let x=D.SCENARIOS[caseN];return shell('10 / REAL-LIFE CASES · 8 MIN','Choose the most useful response',`<div class="panel w37">${photo(caseN%2?1:4,'Pragmatics in real life')}<p class="pull">Use at least one active phrase: <i>get your point across, overcome a language barrier, convey meaning</i>.</p><p class="helper">There is a best pedagogical response, but people and cultures vary.</p></div><div class="panel wide"><div class="badge">CASE ${caseN+1}/6 · ${x[0]}</div><h2>${x[1]}</h2><div class="single-choice">${[0,1,2].map(j=>(j+caseN)%3).map(i=>`<button class="answer" data-opt="${i}" onclick="caseAnswer(${i})">${x[i+2]}</button>`).join('')}</div><div id="case-fb"></div><div class="spacer"></div><div class="footer">${btn('Previous','moveCase(-1)','secondary')}${btn('Next situation','moveCase(1)')}</div></div>`)}
function caseAnswer(i){let x=D.SCENARIOS[caseN],ok=i===0;if(!selected['case'+caseN]){score.cases+=Number(ok);selected['case'+caseN]=true}$('case-fb').innerHTML=feedback(`<b>${ok?'Well reasoned.':'Consider a more constructive option.'}</b> ${x[5]}`,ok);document.querySelectorAll('.single-choice .answer').forEach(e=>{let j=Number(e.dataset.opt);e.disabled=true;e.classList.toggle('good',j===0);e.classList.toggle('bad',j===i&&i!==0)})}function moveCase(d){caseN=(caseN+d+6)%6;render()}
// word wall rapid sort (no memory)
function wordwall(){return shell('11 / GAME · 45 SEC','Word Wall — classify in context',`<div class="panel w37">${photo(3,'Can you respond before the clock runs out?')}<div class="center timer" id="wall-clock">00:${String(wallTime).padStart(2,'0')}</div><div class="toolbar">${btn('Start 45 seconds','startWall()','gold')}${btn('Reset','resetWall()','secondary')}</div><p class="helper">20 expressions · four categories. Read the expression and choose its main function.</p></div><div class="panel wide"><div class="badge">${wallN+1}/20 · CORRECT ${wallCorrect}</div><div class="wall-word" id="wall-word">${D.WALL[wallN][0]}</div><div class="quad">${[['understand','Understanding'],['learning','Learning progress'],['communicate','Communication'],['perception','Perception']].map(([k,v])=>`<button class="wall-cat" onclick="wallPick('${k}')">${v}</button>`).join('')}</div><div id="wall-fb" class="feedback hidden"></div><div class="spacer"></div><div class="footer">${btn('Skip','skipWall()','secondary')}<span class="helper">Score: <b id="wall-points">${wallCorrect}</b> / 20</span></div></div>`)}
function startWall(){clearInterval(wallTimer);wallTime=45;$('wall-clock').textContent='00:45';wallTimer=setInterval(()=>{wallTime--;$('wall-clock').textContent=`00:${String(Math.max(0,wallTime)).padStart(2,'0')}`;if(wallTime<=0){clearInterval(wallTimer);$('wall-fb').classList.remove('hidden');$('wall-fb').innerHTML='Time! You got '+wallCorrect+' of '+Math.max(1,wallN+1)+' expressions correct.'}},1000)}function wallPick(k){if(wallTime<=0)return;let x=D.WALL[wallN],ok=k===x[1];if(ok){wallCorrect++;score.wall=wallCorrect}$('wall-fb').classList.remove('hidden');$('wall-fb').className='feedback '+(ok?'ok':'bad');$('wall-fb').textContent=ok?'Correct! '+x[0]+' → '+x[1]:'Correct category: '+x[1]+' · '+x[0];document.querySelectorAll('.wall-cat').forEach(b=>b.disabled=true);setTimeout(()=>{if(current===10)skipWall()},750)}function skipWall(){if(wallN>=19){clearInterval(wallTimer);$('wall-fb').classList.remove('hidden');$('wall-fb').textContent='Round complete! Final score: '+wallCorrect+'/20';return}wallN++;renderWallWithoutReset()}function renderWallWithoutReset(){let run=wallTimer?true:false;let oldtime=wallTime;clearInterval(wallTimer);let tmp=current;render();wallTime=oldtime;if(run&&oldtime>0)startWallResume();$('wall-clock').textContent=`00:${String(wallTime).padStart(2,'0')}`}
function startWallResume(){wallTimer=setInterval(()=>{wallTime--;$('wall-clock').textContent=`00:${String(Math.max(0,wallTime)).padStart(2,'0')}`;if(wallTime<=0){clearInterval(wallTimer);$('wall-fb').classList.remove('hidden');$('wall-fb').textContent='Time! Score: '+wallCorrect+'/20.'}},1000)}function resetWall(){wallN=0;wallCorrect=0;wallTime=45;score.wall=0;render()}
// 60-second debate, real-language scaffold reveal
function debate(){let x=D.CLAIMS[debateN];return shell('12 / SPEAKING · 10 MIN','The Language Paradox — defend your position',`<div class="panel w40">${photo(debateN%2?5:4,'Your ideas deserve nuance')}<div class="center timer" id="debateclock">${String(Math.floor(debateSec/60)).padStart(2,'0')}:${String(debateSec%60).padStart(2,'0')}</div><div class="toolbar">${btn('Start 60 sec','startDebate()','gold')}${btn('Reset','resetDebate()','secondary')}</div><p class="helper">Argument → example → counterargument → conclusion. Use at least three expressions from the cards.</p></div><div class="panel wide"><span class="badge">DEBATE ${debateN+1}/10</span><div class="debate-claim">“${x}”</div><div class="toolbar">${btn('Show language support','toggleSupport()','secondary')}${btn('Show sample reasoning','showSample()','secondary')}</div><div id="support" class="hidden pull"><b>Structure:</b> “To some extent, …” · “There is evidence to suggest …” · “However, the opposite argument is …” · “It depends on …” · “I would distinguish between …”<p class="small" style="margin-top:7px"><b>Recycle:</b> get my point across · convey subtle meaning · shape perception · be culturally embedded.</p></div><div id="sample" class="hidden explanation">A balanced argument should distinguish language, thought and cultural context, avoid absolute claims, and include a specific example.</div><div class="spacer"></div><div class="footer">${btn('Previous','moveDebate(-1)','secondary')}${btn('Next statement','moveDebate(1)')}</div></div>`)}
function startDebate(){clearInterval(debateTimer);debateSec=60;debateTimer=setInterval(()=>{debateSec--;$('debateclock').textContent='00:'+String(Math.max(0,debateSec)).padStart(2,'0');if(debateSec===0)clearInterval(debateTimer)},1000)}function resetDebate(){clearInterval(debateTimer);debateSec=60;$('debateclock').textContent='01:00'}function moveDebate(d){debateN=(debateN+d+10)%10;debateSec=60;render()}
function toggleSupport(){$('support').classList.toggle('hidden')}function showSample(){$('sample').classList.toggle('hidden')}
// exit quiz
function exit(){let x=D.EXIT[exitN];return shell('13 / CONSOLIDATION · 5 MIN','Exit ticket — prove you can use it',`<div class="panel w37">${photo(5,'What changed in your thinking?')}<div class="center"><div class="kpi">${score.exit} / 10</div><p class="muted small">Correct on first attempt</p></div>${bar(exitN+1,10)}<div class="spacer"></div><div class="pull"><b>Next lesson:</b> use at least 6 phrases from our original cards to discuss Arabic, cultural identity or translation.</div></div><div class="panel wide"><div class="badge">FINAL CHECK ${exitN+1}/10</div><h2>${x[0]}</h2><div class="single-choice">${[0,1,2].map(j=>(j+exitN)%3).map(i=>`<button class="answer" data-opt="${i}" onclick="answerExit(${i})">${x[1][i]}</button>`).join('')}</div><div id="exit-fb"></div><div class="spacer"></div><div class="footer">${btn('Previous','moveExit(-1)','secondary')}${btn('Next question','moveExit(1)')}</div></div>`)}
function answerExit(i){let x=D.EXIT[exitN],ok=i===x[2];if(!selected['exit'+exitN]){score.exit+=Number(ok);selected['exit'+exitN]=true}$('exit-fb').innerHTML=feedback(`<b>${ok?'Correct.':'Not yet.'}</b> ${x[3]}`,ok);document.querySelectorAll('.single-choice .answer').forEach(e=>{let j=Number(e.dataset.opt);e.disabled=true;e.classList.toggle('good',j===x[2]);e.classList.toggle('bad',j===i&&i!==x[2])});document.querySelector('.kpi').textContent=score.exit+' / 10'}function moveExit(d){exitN=(exitN+d+10)%10;render()}
window.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;if(e.key==='ArrowRight'&&e.altKey)go(1);else if(e.key==='ArrowLeft'&&e.altKey)go(-1)});window.addEventListener('beforeunload',()=>{if(window.speechSynthesis)speechSynthesis.cancel()});render();
</script></body></html>
