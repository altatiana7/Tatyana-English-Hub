<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Maya · Clothes & Style</title>
<style>
:root{--p:#4b39b3;--p2:#6f59d0;--t:#0a9db4;--ink:#17182a;--muted:#6e7282;--line:#e6e2ef;--soft:#faf8ff}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:#fff}.wrap{max-width:820px;margin:0 auto;padding:10px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.top h1{margin:0;font-size:22px;color:#3824a7}.top p{margin:2px 0 0;color:var(--muted);font-size:11px}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 10px;font-weight:900;color:#4a35b3;cursor:pointer;font-size:13px}.tab.active{background:var(--p);color:#fff;border-color:var(--p)}.panel{display:none}.panel.active{display:block}.flash{height:150px;border:1px solid var(--line);border-radius:16px;background:var(--soft);display:grid;place-items:center;text-align:center;padding:18px;cursor:pointer}.word{font-size:37px;font-weight:900;color:#34268e}.ru{font-size:23px;font-weight:900;color:#34268e}.ex{margin-top:8px;color:#555b68;font-size:14px}.counter{text-align:center;color:var(--muted);font-size:11px;margin-bottom:5px}.controls{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:7px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 11px;font-weight:900;color:#43349c;cursor:pointer;font-size:13px}.btn.primary{background:var(--t);color:#fff;border-color:var(--t)}.matchGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.col{display:grid;gap:5px}.pair,.mem{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px;min-height:38px;font-weight:800;cursor:pointer;font-size:12px}.pair.sel{outline:2px solid #d8d0ff}.pair.done{opacity:.12;pointer-events:none}.memGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.mem{min-height:48px}.mem.open{background:#f0edff;border-color:#6a58c6}.mem.gone{opacity:0;visibility:hidden;pointer-events:none}.status{min-height:18px;margin-top:6px;font-size:12px;font-weight:900;color:#4b39b3}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.head h2{margin:0;font-size:17px;color:#34268e}.head p{margin:2px 0 0;color:var(--muted);font-size:10px}@media(max-width:620px){.wrap{padding:8px}.word{font-size:31px}.ru{font-size:21px}.memGrid{grid-template-columns:repeat(3,1fr)}.pair{font-size:11px}}
</style></head><body>
<div class="wrap">
<div class="top"><div><h1>Clothes & Style</h1><p>Modern everyday vocabulary · Maya</p></div></div>
<div class="tabs"><button class="tab active" data-p="cards">Quizlet Cards</button><button class="tab" data-p="match">Matching</button><button class="tab" data-p="memory">Memory</button></div>
<section id="cards" class="panel active"><div class="counter" id="counter"></div><div class="flash" id="flash"><div id="flashContent"></div></div><div class="controls"><button class="btn" id="prev">Back</button><button class="btn" id="listen">Listen</button><button class="btn primary" id="flip">Flip</button><button class="btn" id="next">Next</button></div></section>
<section id="match" class="panel"><div class="head"><div><h2>Match the pairs</h2><p>English ↔ Russian</p></div><button class="btn" id="shuffle">Shuffle</button></div><div class="matchGrid"><div class="col" id="enCol"></div><div class="col" id="ruCol"></div></div><div class="status" id="matchStatus"></div></section>
<section id="memory" class="panel"><div class="head"><div><h2>Match / Not a match</h2><p>A correct pair disappears.</p></div><button class="btn" id="restart">Restart</button></div><div class="memGrid" id="memGrid"></div><div class="status">Pairs: <span id="found">0</span>/8 · Attempts: <span id="tries">0</span> <span id="memStatus"></span></div></section>
</div>
<script>
const vocab=[
{en:'baggy',ru:'мешковатый',ex:'She is wearing baggy jeans with a fitted top.'},
{en:'oversized',ru:'оверсайз, нарочито большой',ex:'She loves oversized shirts and jackets.'},
{en:'tight',ru:'обтягивающий / тесный',ex:'These trousers are too tight.'},
{en:'fitted',ru:'по фигуре, приталенный',ex:'A fitted blazer looks great with wide-leg trousers.'},
{en:'loose',ru:'свободный, не облегающий',ex:'She prefers loose clothes in summer.'},
{en:'cropped',ru:'укороченный',ex:'She is wearing a cropped jacket.'},
{en:'high-waisted',ru:'с высокой посадкой',ex:'High-waisted jeans look good with a crop top.'},
{en:'low-rise',ru:'с низкой посадкой',ex:'Low-rise jeans are popular again.'},
{en:'wide-leg',ru:'с широкими штанинами',ex:'She often wears wide-leg trousers.'},
{en:'straight-leg',ru:'прямого кроя',ex:'Straight-leg jeans are easy to style.'},
{en:'skinny',ru:'очень узкий, облегающий',ex:'She used to wear skinny jeans all the time.'},
{en:'off-the-shoulder',ru:'с открытыми плечами',ex:'She chose an off-the-shoulder top.'},
{en:'strapless',ru:'без бретелей',ex:'She wore a strapless top for the party.'},
{en:'blazer',ru:'блейзер / пиджак',ex:'A blazer makes a casual outfit look smarter.'},
{en:'bodysuit',ru:'боди',ex:'She paired a black bodysuit with jeans.'},
{en:'crop top',ru:'укороченный топ',ex:'She wore a crop top with high-waisted trousers.'},
{en:'tank top',ru:'топ без рукавов',ex:'A white tank top is easy to style.'},
{en:'cardigan',ru:'кардиган',ex:'She threw a cardigan over her top.'},
{en:'trench coat',ru:'тренч',ex:'A beige trench coat works with almost anything.'},
{en:'puffer jacket',ru:'дутая куртка / пуховик',ex:'She wears a short puffer jacket in winter.'},
{en:'midi skirt',ru:'юбка миди',ex:'She paired a midi skirt with ankle boots.'},
{en:'wide-leg trousers',ru:'широкие брюки',ex:'Wide-leg trousers can look relaxed or smart.'},
{en:'jumpsuit',ru:'комбинезон',ex:'A jumpsuit is an easy one-piece outfit.'},
{en:'slip dress',ru:'платье в бельевом стиле',ex:'She wore a slip dress with a blazer.'},
{en:'ankle boots',ru:'ботильоны',ex:'Black ankle boots go well with a midi skirt.'}
];
const sh=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
let i=0,back=false;const q=s=>document.querySelector(s);function card(){const w=vocab[i];q('#counter').textContent=`${i+1} / ${vocab.length}`;q('#flashContent').innerHTML=back?`<div class='ru'>${w.ru}</div><div class='ex'>${w.ex}</div>`:`<div class='word'>${w.en}</div>`}function flip(){back=!back;card()}q('#flash').onclick=flip;q('#flip').onclick=flip;q('#next').onclick=()=>{i=(i+1)%vocab.length;back=false;card()};q('#prev').onclick=()=>{i=(i-1+vocab.length)%vocab.length;back=false;card()};q('#listen').onclick=()=>{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(vocab[i].en);u.lang='en-GB';speechSynthesis.speak(u)}};
function resizeHost(){try{if(window.frameElement){const id=document.querySelector('.panel.active')?.id;window.frameElement.style.height=(id==='match'?'410px':id==='memory'?'300px':'285px');}}catch(e){}}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');q('#'+b.dataset.p).classList.add('active');resizeHost()});
let se=null,sr=null,count=0;function buildMatch(){count=0;se=sr=null;q('#matchStatus').textContent='';const set=sh(vocab).slice(0,8);const en=sh(set.map((x,id)=>({id,text:x.en}))),ru=sh(set.map((x,id)=>({id,text:x.ru})));q('#enCol').innerHTML='';q('#ruCol').innerHTML='';en.forEach(x=>{const b=document.createElement('button');b.className='pair';b.dataset.id=x.id;b.dataset.s='en';b.textContent=x.text;q('#enCol').appendChild(b)});ru.forEach(x=>{const b=document.createElement('button');b.className='pair';b.dataset.id=x.id;b.dataset.s='ru';b.textContent=x.text;q('#ruCol').appendChild(b)})}q('#match').onclick=e=>{const b=e.target.closest('.pair');if(!b||b.classList.contains('done'))return;document.querySelectorAll(`.pair[data-s='${b.dataset.s}']`).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');if(b.dataset.s==='en')se=b;else sr=b;if(se&&sr){if(se.dataset.id===sr.dataset.id){se.classList.add('done');sr.classList.add('done');q('#matchStatus').textContent=++count===8?'Perfect!':'Match!'}else{q('#matchStatus').textContent='Not a match.';se.classList.remove('sel');sr.classList.remove('sel')}se=sr=null}};q('#shuffle').onclick=e=>{e.stopPropagation();buildMatch()};
let open=[],lock=false,pairs=0,tries=0;function buildMemory(){const set=sh(vocab).slice(0,8),cards=sh(set.flatMap((x,id)=>[{id,text:x.en,k:'en'},{id,text:x.ru,k:'ru'}]));open=[];lock=false;pairs=tries=0;q('#found').textContent='0';q('#tries').textContent='0';q('#memStatus').textContent='';q('#memGrid').innerHTML='';cards.forEach(c=>{const b=document.createElement('button');b.className='mem';b.textContent='?';b.dataset.id=c.id;b.dataset.text=c.text;b.dataset.k=c.k;q('#memGrid').appendChild(b)})}q('#memGrid').onclick=e=>{const b=e.target.closest('.mem');if(!b||lock||b.classList.contains('open')||b.classList.contains('gone'))return;b.classList.add('open');b.textContent=b.dataset.text;open.push(b);if(open.length===2){lock=true;tries++;q('#tries').textContent=tries;const[a,c]=open,ok=a.dataset.id===c.dataset.id&&a.dataset.k!==c.dataset.k;if(ok){q('#memStatus').textContent=' Match!';setTimeout(()=>{a.classList.add('gone');c.classList.add('gone');pairs++;q('#found').textContent=pairs;q('#memStatus').textContent=pairs===8?' All pairs found!':'';open=[];lock=false},350)}else{q('#memStatus').textContent=' Not a match.';setTimeout(()=>{a.classList.remove('open');c.classList.remove('open');a.textContent='?';c.textContent='?';open=[];lock=false;q('#memStatus').textContent=''},650)}}};q('#restart').onclick=buildMemory;card();buildMatch();buildMemory();resizeHost();
</script></body></html>
