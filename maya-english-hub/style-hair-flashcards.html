<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Maya · Style & Hair Flashcards</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(180deg,#fffafd,#f7f3fb);color:#2c2635}.app{max-width:1280px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;gap:14px;align-items:flex-start;background:#fff;border:1px solid #eadfea;border-radius:22px;padding:16px 18px;box-shadow:0 8px 24px rgba(73,45,88,.07)}h1{font-family:Georgia,serif;font-size:34px;margin:0 0 4px}.sub{margin:0;color:#807587;font-size:13px}.mode,.tools,.chips{display:flex;gap:7px;flex-wrap:wrap}.mode button,.tools button,.chips button{border:1px solid #eadfea;background:#fff;border-radius:999px;padding:8px 11px;cursor:pointer;font-weight:800;color:#554a60}.mode button.active{background:#fff0f5;color:#c64d79;border-color:#efbfd0}.tools{margin-top:8px;justify-content:flex-end}.tools button.active{background:#f2efff;color:#6651c7}.panel{margin-top:12px;background:#fff;border:1px solid #eadfea;border-radius:22px;padding:13px;box-shadow:0 8px 24px rgba(73,45,88,.06)}.chips{margin-bottom:10px}.chips button.active{background:#f3f8ff;color:#476fa8;border-color:#cbddef}.bar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:7px 2px 12px;color:#7c7084;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px}.card{height:248px;perspective:1100px;cursor:pointer}.inner{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d}.card.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;border-radius:18px;overflow:hidden;backface-visibility:hidden;border:1px solid #eadfea;background:#fff}.front{display:flex;flex-direction:column}.photo{height:148px;position:relative;background:#f4edf4;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;display:block}.num{position:absolute;left:8px;top:8px;width:30px;height:30px;border-radius:10px;background:#fff;color:#d85382;border:1px solid #f0bed0;display:grid;place-items:center;font-weight:900}.sound{position:absolute;right:8px;top:8px;width:32px;height:32px;border-radius:50%;border:1px solid #ecd9e2;background:#fff;cursor:pointer}.body{padding:10px 11px}.cat{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:#8d8194}.word{font-family:Georgia,serif;font-weight:900;font-size:22px;line-height:1.05;margin-top:3px}.hint{font-size:11px;color:#9a8fa0;margin-top:6px}.back{transform:rotateY(180deg);padding:13px;background:linear-gradient(180deg,#fff,#fff6fa)}.back h3{font-family:Georgia,serif;margin:0 0 10px;font-size:23px}.box{background:#fff;border:1px solid #eedfe6;border-radius:12px;padding:8px 9px;margin:7px 0}.label{font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.08em;color:#b06a84;margin-bottom:4px}.value{font-size:13px;line-height:1.35}.bottom{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:10px;padding:10px 2px 0;color:#7f7486;font-size:12px}.progress{width:230px;height:9px;border-radius:999px;background:#f1e6ec;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#ee8bb0,#d9578a)}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.top{flex-direction:column}.tools{justify-content:flex-start}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:470px){.grid{grid-template-columns:1fr}.card{height:270px}.photo{height:165px}h1{font-size:28px}}</style></head><body><main class="app"><section class="top"><div><h1 id="title">Women’s Fashion Flashcards</h1><p class="sub" id="sub">Quizlet-style practice · real photos · British English · translation · collocations</p></div><div><div class="mode"><button class="active" data-mode="fashion">Women’s Fashion</button><button data-mode="hair">Hair & Hairstyles</button></div><div class="tools"><button id="shuffle">Shuffle</button><button id="flipAll">Flip all</button><button id="ru" class="active">Russian on</button></div></div></section><section class="panel"><div class="chips" id="chips"></div><div class="bar"><span id="catName">All categories</span><span><b id="done">0</b> / <b id="total">20</b> cards flipped</span></div><div class="grid" id="grid"></div><div class="bottom"><span>Click a card to flip · 🔊 British pronunciation</span><div style="display:flex;align-items:center;gap:8px"><span id="ptext">0 / 20</span><div class="progress"><div class="fill" id="fill"></div></div></div></div></section></main><script>const F=[['Outerwear','oversized blazer','свободный пиджак','wear an oversized blazer','She’s wearing an oversized blazer with straight-leg jeans.',4428045],['Outerwear','trench coat','тренч / плащ','a classic trench coat','A classic trench coat is perfect for cool weather.',4872120],['Outerwear','leather jacket','кожаная куртка','a black leather jacket','A black leather jacket gives the outfit an edgier look.',8989593],['Tops','cardigan','кардиган','a soft cardigan','She layered a soft cardigan over a fitted top.',2531089],['Tops','cropped hoodie','укороченное худи','a cropped hoodie','She paired a cropped hoodie with high-waisted leggings.',3224642],['Tops','satin blouse','атласная блузка','a satin blouse','A satin blouse looks elegant with tailored trousers.',31719247],['Tops','fitted crop top','облегающий кроп-топ','a fitted crop top','She wore a fitted crop top with high-waisted jeans.',3061097],['Tops','cosy jumper','уютный джемпер','a cosy jumper','A cosy jumper is perfect for chilly days.',6634916],['Bottoms','wide-leg trousers','брюки широкого кроя','wear wide-leg trousers','Wide-leg trousers look great with a fitted top.',18173600],['Bottoms','straight-leg jeans','джинсы прямого кроя','straight-leg jeans','Straight-leg jeans go well with a blazer.',15661605],['Bottoms','pleated skirt','плиссированная юбка','a pleated skirt','A pleated skirt looks lovely with loafers.',1805411],['Dresses','floral midi dress','платье миди с цветочным принтом','a floral midi dress','She wore a floral midi dress to brunch.',20874764],['Dresses','black mini dress','чёрное мини-платье','a black mini dress','She styled a black mini dress for a night out.',1755428],['Sets','matching co-ord set','координированный комплект','a matching co-ord set','A matching co-ord set makes styling easy.',974911],['Shoes & Bags','white trainers','белые кроссовки','white trainers','White trainers go with nearly everything.',1763479],['Shoes & Bags','black ankle boots','чёрные ботильоны','black ankle boots','Black ankle boots make the outfit look smarter.',1006999],['Shoes & Bags','chunky loafers','лоферы на толстой подошве','chunky loafers','Chunky loafers are a great smart-casual choice.',298864],['Shoes & Bags','high heels','туфли на каблуках','wear high heels','High heels can elevate your look.',8989607],['Shoes & Bags','small handbag','маленькая сумка','a small handbag','A small handbag is enough for your essentials.',12200061],['Shoes & Bags','canvas tote bag','тканевая сумка-тоут / шоппер','a canvas tote bag','A canvas tote bag is practical for everyday errands.',904350]];const H=[['Length','long hair','длинные волосы','grow long hair','She has long, healthy brown hair.',19504734],['Length','short hair','короткие волосы','have short hair','Short hair really suits her.',13994777],['Length','shoulder-length hair','волосы до плеч','shoulder-length hair','She has shoulder-length hair with soft layers.',28406717],['Texture','straight hair','прямые волосы','straighten your hair','She usually wears her hair straight.',17822942],['Texture','wavy hair','волнистые волосы','beachy waves','Her naturally wavy hair looks lovely.',29948139],['Texture','curly hair','кудрявые волосы','curl your hair','She has thick, curly hair.',31747506],['Style','tied-up hair','собранные волосы','wear your hair up','She often wears her hair tied up.',15262962],['Style','ponytail','хвост','put your hair in a ponytail','She tied her hair in a high ponytail.',5424980],['Style','bun','пучок','tie your hair in a bun','A neat bun looks elegant.',28656265],['Style','braid','коса','wear a braid','She wore a long braid.',20644320],['Cut & Colour','fringe','чёлка','get a fringe','A full fringe really suits her face.',11505309],['Cut & Colour','layers','слои / каскад','add layers','Soft layers give the hair more movement.',6151982],['Cut & Colour','highlights','мелирование / светлые пряди','get highlights','She got blonde highlights for summer.',31260243],['Cut & Colour','dyed hair','окрашенные волосы','dye your hair','She has dyed pink hair.',11054052],['Finish','sleek hair','гладкие волосы','a sleek style','She chose a sleek style for the evening.',7089210],['Finish','messy hair','растрёпанные волосы','a messy look','A messy look can still be stylish.',6565634],['Texture','thick hair','густые волосы','have thick hair','She has naturally thick hair.',9928018],['Texture','fine hair','тонкие волосы','care for fine hair','This cut works well for fine hair.',8437642],['Finish','shiny hair','блестящие волосы','add shine to your hair','Her hair looks smooth and shiny.',31719203],['Finish','healthy hair','здоровые волосы','keep your hair healthy','These products help keep your hair healthy.',15262962]];let mode='fashion',cat='All',rus=true,flipped=new Set();const $=s=>document.querySelector(s);function data(){return mode==='fashion'?F:H}function photo(id){return `https://images.pexels.com/photos/${id}/pexels-photo-${id}.jpeg?auto=compress&cs=tinysrgb&w=700`}function speak(t){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t),vs=speechSynthesis.getVoices(),v=vs.find(x=>/^en-GB/i.test(x.lang));if(v)u.voice=v;u.lang='en-GB';u.rate=.88;speechSynthesis.cancel();speechSynthesis.speak(u)}function fallback(img,w){const s=`<svg xmlns='http://www.w3.org/2000/svg' width='700' height='480'><rect width='100%' height='100%' fill='#f6edf2'/><text x='50%' y='50%' text-anchor='middle' dominant-baseline='middle' font-family='Arial' font-size='30' fill='#846b77'>${w}</text></svg>`;img.src='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(s);img.onerror=null}function chips(){const e=$('#chips');e.innerHTML='';['All',...new Set(data().map(x=>x[0]))].forEach(x=>{const b=document.createElement('button');b.textContent=x;b.className=x===cat?'active':'';b.onclick=()=>{cat=x;render()};e.appendChild(b)})}function render(){chips();$('#title').textContent=mode==='fashion'?"Women’s Fashion Flashcards":"Hair & Hairstyles Flashcards";$('#sub').textContent=mode==='fashion'?"Quizlet-style practice · real photos · British English · translation · collocations":"Hair vocabulary · real photos · British English · translation · collocations";$('#catName').textContent=cat==='All'?'All categories':cat;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));const list=data().filter(x=>cat==='All'||x[0]===cat),g=$('#grid');g.innerHTML='';list.forEach((x,i)=>{const w=x[1],c=document.createElement('article');c.className='card'+(flipped.has(w)?' flipped':'');c.innerHTML=`<div class="inner"><div class="face front"><div class="photo"><img loading="lazy" src="${photo(x[5])}" alt="${w}"><span class="num">${i+1}</span><button class="sound" type="button">🔊</button></div><div class="body"><div class="cat">${x[0]}</div><div class="word">${w}</div><div class="hint">Click to flip</div></div></div><div class="face back"><h3>${w}</h3>${rus?`<div class="box"><div class="label">Translation</div><div class="value">${x[2]}</div></div>`:''}<div class="box"><div class="label">Collocation</div><div class="value">${x[3]}</div></div><div class="box"><div class="label">Example</div><div class="value">${x[4]}</div></div></div></div>`;const im=c.querySelector('img');im.onerror=()=>fallback(im,w);c.onclick=e=>{if(e.target.closest('.sound'))return;flipped.has(w)?flipped.delete(w):flipped.add(w);c.classList.toggle('flipped');progress()};c.querySelector('.sound').onclick=e=>{e.stopPropagation();speak(w)};g.appendChild(c)});progress()}function progress(){const list=data().filter(x=>cat==='All'||x[0]===cat),n=list.filter(x=>flipped.has(x[1])).length;$('#done').textContent=n;$('#total').textContent=list.length;$('#ptext').textContent=`${n} / ${list.length}`;$('#fill').style.width=list.length?`${n/list.length*100}%`:'0%';$('#flipAll').textContent=n===list.length&&list.length?'Unflip all':'Flip all'}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;cat='All';flipped.clear();render()});$('#shuffle').onclick=()=>{const a=data();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}render()};$('#flipAll').onclick=()=>{const list=data().filter(x=>cat==='All'||x[0]===cat),all=list.every(x=>flipped.has(x[1]));list.forEach(x=>all?flipped.delete(x[1]):flipped.add(x[1]));render()};$('#ru').onclick=()=>{rus=!rus;$('#ru').classList.toggle('active',rus);$('#ru').textContent=rus?'Russian on':'Russian off';render()};render();</script></body></html>
