<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Maya · 1C Remakes Interactive</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Segoe UI,sans-serif;color:#17213d;background:#fbfaf7;overflow:hidden}button,input{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:175px 1fr;background:radial-gradient(circle at 19% 7%,#d9c7ff 0,transparent 19%),radial-gradient(circle at 14% 92%,#cdefff 0,transparent 23%),radial-gradient(circle at 97% 10%,#e7f3dd 0,transparent 18%),linear-gradient(135deg,#fffdf9,#fbfbfb)}.side{background:rgba(255,255,255,.92);border-right:1px solid #ddd8e9;padding:12px 8px;overflow:auto}.brand{font-weight:1000;font-size:25px;line-height:.94;color:#42309c;margin:4px 8px 18px}.brand span{display:block;color:#4aaf47}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;border-radius:12px;padding:9px 10px;text-align:left;font-weight:800;color:#27304a}.nav button.active{background:#eee8ff;color:#5c38bf;border-left:5px solid #6d4bd0}.nav small{display:block;font-size:9px;color:#777;margin-top:2px}.hub{display:block;margin:14px 8px 0;padding:8px 10px;border-radius:10px;text-decoration:none;background:#f5f2fc;color:#533aab;font-weight:800;font-size:11px}.main{min-width:0;display:flex;flex-direction:column;height:100vh;padding:8px 14px 10px}.hero{height:92px;position:relative;display:flex;align-items:center;justify-content:center}.hero h1{font-size:clamp(46px,6vw,80px);margin:0;line-height:.86;letter-spacing:-.045em;font-weight:1000;color:#31457d;text-shadow:2px 2px 0 #e8e3fa}.hero h1 span{background:linear-gradient(90deg,#5a2ea6,#1274ac,#6a9e3d);-webkit-background-clip:text;color:transparent}.stroke{position:absolute;bottom:9px;width:46%;height:5px;border-radius:99px;background:linear-gradient(90deg,#7447c5,#2972b5,#76a942);transform:rotate(-1deg)}.screen{flex:1;min-height:0;background:rgba(255,255,255,.94);border:1px solid #ded9e8;border-radius:22px;box-shadow:0 10px 30px rgba(47,35,96,.10);padding:12px 16px;display:flex;flex-direction:column;overflow:hidden}.head{display:flex;align-items:center;gap:10px;margin-bottom:7px}.num{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#7654d5,#4f2ca8);color:#fff;font-size:20px;font-weight:1000;display:grid;place-items:center}.head h2{font-size:25px;margin:0;color:#4a2ea3}.lead{font-size:13px;color:#666b7a;margin:0 0 7px}.body{flex:1;min-height:0;overflow:auto}.footer{height:42px;border-top:1px solid #ece8f0;margin-top:6px;display:flex;align-items:end;justify-content:space-between}.btn{border:0;border-radius:10px;background:#6644bf;color:#fff;font-weight:900;padding:8px 12px}.btn.alt{background:#1f9cad}.btn.ghost{background:#fff;color:#5d3db1;border:1px solid #d2c8e9}.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;height:100%}.remakeCard{border:1px solid #e0dbe8;border-radius:16px;padding:9px;background:#fff;display:flex;flex-direction:column}.remakeCard h3{margin:0 0 6px;font-size:14px;color:#5f3eb8}.visualPair{display:grid;grid-template-columns:1fr 32px 1fr;gap:5px;align-items:center;flex:1;min-height:0}.visual{height:100%;min-height:180px;border-radius:12px;overflow:hidden;position:relative;background:#ece9f0}.visual img{width:100%;height:100%;object-fit:cover}.visual .label{position:absolute;left:7px;bottom:7px;background:rgba(27,29,42,.75);color:#fff;border-radius:99px;padding:4px 7px;font-size:9px;font-weight:900}.arrow{width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid #ddd3ec;display:grid;place-items:center;font-weight:1000}.generic{height:100%;display:grid;place-items:center;text-align:center;font-weight:1000;padding:12px;color:#fff}.album1{background:linear-gradient(145deg,#d9c7a4,#6b4f36)}.album2{background:linear-gradient(145deg,#ed6e92,#6745a8 60%,#162a51)}.film1{background:linear-gradient(145deg,#111,#555)}.film2{background:linear-gradient(145deg,#1d3347,#0b8192)}.definition{margin-top:8px;padding:9px 12px;border-radius:13px;background:#f3effc;font-size:13px}.videoGrid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px;height:100%}.videoBox{background:#111;border-radius:16px;overflow:hidden;display:grid;place-items:center;min-height:300px}.videoBox video{width:100%;height:100%;max-height:54vh}.promptCard{border-radius:16px;background:#f7f3ff;border:1px solid #ddd2ef;padding:14px}.promptCard h3{margin:0 0 9px;color:#5233aa}.promptCard ol{padding-left:20px;line-height:1.65}.filePick{margin-top:10px;font-size:10px;color:#69657a}.fashionGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;height:60%}.fashion{border-radius:14px;overflow:hidden;position:relative;background:#eee}.fashion img{width:100%;height:100%;object-fit:cover}.fashion span{position:absolute;bottom:7px;left:7px;background:rgba(20,20,30,.72);color:#fff;border-radius:99px;padding:4px 7px;font-size:9px}.hideOverlay{position:absolute;inset:0;background:#5c43b7;color:#fff;display:none;place-items:center;font-size:40px;font-weight:1000}.timerRow{display:flex;gap:8px;align-items:center;margin-top:8px}.timer{min-width:50px;font-size:22px;font-weight:1000;color:#5938b5}.bank{display:none;margin-top:8px;gap:5px;flex-wrap:wrap}.bank.open{display:flex}.chip{padding:5px 8px;border-radius:99px;background:#f0eaff;color:#5634a6;border:1px solid #d9cef0;font-size:10px;font-weight:850}.speakGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.speakQ{border:1px solid #e0dbe8;border-radius:14px;padding:14px;background:#fff;display:flex;gap:12px;align-items:center}.speakQ b{width:30px;height:30px;border-radius:50%;background:#6544bf;color:#fff;display:grid;place-items:center}.grammarTop{display:grid;grid-template-columns:1.05fr .95fr;gap:10px}.milkPair{display:grid;grid-template-columns:1fr 1fr;gap:8px;height:250px}.milk{border-radius:14px;overflow:hidden;position:relative;background:#eee}.milk img{width:100%;height:100%;object-fit:cover}.milk span{position:absolute;left:8px;top:8px;background:#fffdf5;padding:4px 8px;border-radius:5px;font-size:10px;font-weight:850}.memory{border:1px solid #ddd4ea;background:#fbf9ff;border-radius:15px;padding:12px}.memory h3{margin:0 0 6px}.memory ol{margin:4px 0 8px;padding-left:20px;line-height:1.48}.ruleBox{margin-top:8px;border:1px solid #ded7ea;border-radius:15px;padding:10px;background:#fff}.contrast{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g{background:#eef2ff;border-radius:12px;padding:10px}.g h4{margin:0 0 4px;color:#5231a8}.tabs{display:flex;gap:7px;margin-top:8px}.tab{border:1px solid #d7cce9;background:#fff;color:#5337ad;border-radius:99px;padding:6px 11px;font-weight:850;font-size:11px}.tab.active{background:#6847c5;color:#fff}.exercisePanel{display:none;margin-top:8px}.exercisePanel.open{display:block}.exGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.q{border:1px solid #dfd9e8;border-radius:11px;padding:8px;font-size:11px;background:#fff}.choice{border:1px solid #d8d0e7;background:#fff;border-radius:8px;padding:5px 7px;margin:3px 2px}.choice.ok{background:#e5f7e2;border-color:#7db56e}.choice.no{background:#fff0ee;border-color:#db8178}.listenGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.listenQ{border-bottom:1px solid #e7e2ec;padding:8px}.listenQ b{color:#5b39b4}.answers{display:none;margin-top:9px;border-radius:14px;background:#f1edfb;padding:10px}.answers.open{display:block}.audioRow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.audioRow audio{max-width:420px;width:100%}.note{font-size:10px;color:#777}.homeGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.homeTile{border:1px solid #ded8e8;border-radius:15px;padding:13px;background:#fff;text-align:left}.homeTile strong{font-size:16px;color:#5334aa}.homeTile p{font-size:11px;color:#666}.homeTile button{margin-top:6px}.coverNote{background:#f8f4ff;border:1px solid #ded4ef;border-radius:14px;padding:10px;margin-bottom:10px;font-size:13px}@media(max-width:1000px){.app{grid-template-columns:150px 1fr}.hero{height:72px}.hero h1{font-size:48px}.cards3{grid-template-columns:1fr}.speakGrid,.listenGrid,.contrast,.grammarTop{grid-template-columns:1fr}.fashionGrid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><div class="app"><aside class="side"><div class="brand">1C <span>REMAKES</span></div><div class="nav"><button data-page="home">⌂ Home</button><button data-page="p1">1 · What is a remake?</button><button data-page="p2">2 · Video clothes</button><button data-page="p3">3 · What are they wearing?</button><button data-page="p5">5 · Usually wear</button><button data-page="p6">6 · Remake + Grammar</button><button data-page="p7">7 · Listening</button></div><a class="hub" href="index.html">← Maya Hub</a></aside><main class="main"><div class="hero"><h1>1C <span>REMAKES</span></h1><div class="stroke"></div></div><section class="screen"><div class="head"><div class="num" id="num">1</div><h2 id="title">What is a remake?</h2></div><p class="lead" id="lead"></p><div class="body" id="body"></div><div class="footer"><button class="btn ghost" id="prev">← Previous</button><span id="count"></span><button class="btn" id="next">Next →</button></div></section></main></div><script>
const pages=['home','p1','p2','p3','p5','p6','p7'];let idx=0;const clothes=['blouse','cardigan','coat','dress','hoodie','jacket','jeans','skirt','sweater','trousers','trainers','boots','scarf','necklace','bracelet','earrings','ring','handbag'];
const p={home:{n:'⌂',t:'Lesson map',l:'Use the left menu or start from Activity 1.',h:()=>`<div class="coverNote"><b>Today:</b> remakes → clothes revision → Present Continuous → Present Simple vs Present Continuous → Vermeer listening.</div><div class="homeGrid">${[['p1','1 · What is a remake?','Art, music and film examples'],['p2','2 · Video clothes','Remember 3 things each person is wearing'],['p3','3 · What are they wearing?','5-second memory + hidden word help'],['p5','5 · What do you usually wear?','Speaking with Present Simple'],['p6','6 · Remake photo + Grammar','Milkmaid + Present Continuous'],['p7','7 · Listening','Vermeer and The Milkmaid']].map(x=>`<div class="homeTile"><strong>${x[1]}</strong><p>${x[2]}</p><button class="btn" onclick="go('${x[0]}')">OPEN</button></div>`).join('')}</div>`},
p1:{n:'1',t:'WHAT IS A REMAKE?',l:'A remake is a new version of something that already exists.',h:()=>`<div class="cards3"><div class="remakeCard"><h3>ART REMAKE</h3><div class="visualPair"><div class="visual"><img src="https://upload.wikimedia.org/wikipedia/commons/e/ea/The_Starry_Night.JPG"><span class="label">ORIGINAL</span></div><div class="arrow">→</div><div class="visual"><img src="https://images.unsplash.com/photo-1549490349-8643362247b5?auto=format&fit=crop&w=700&q=80"><span class="label">NEW VERSION</span></div></div></div><div class="remakeCard"><h3>MUSIC / ALBUM REMAKE</h3><div class="visualPair"><div class="visual"><div class="generic album1">VINTAGE<br>ALBUM COVER</div></div><div class="arrow">→</div><div class="visual"><div class="generic album2">MODERN<br>RE-DESIGN</div></div></div></div><div class="remakeCard"><h3>FILM REMAKE</h3><div class="visualPair"><div class="visual"><div class="generic film1">CLASSIC<br>FILM</div></div><div class="arrow">→</div><div class="visual"><div class="generic film2">NEW<br>VERSION</div></div></div></div></div><div class="definition"><b>Your task:</b> Which examples are remakes? What stays the same? What changes?</div>`},
p2:{n:'2',t:'WATCH & REMEMBER',l:'Vocabulary Bank: Things you wear. Watch and remember three things each person is wearing.',h:()=>`<div class="videoGrid"><div class="videoBox"><video id="vocabVideo" controls preload="metadata"><source src="media/ef5e-preint-1c-vocabulary.mp4" type="video/mp4"></video></div><div class="promptCard"><h3>After watching</h3><ol><li>What is person 1 wearing?</li><li>What is person 2 wearing?</li><li>What is person 3 wearing?</li><li>Which 3 clothing words did you hear or notice?</li></ol><button class="btn ghost" onclick="document.getElementById('videoFile').click()">OPEN VIDEO FILE</button><input id="videoFile" type="file" accept="video/*" hidden onchange="loadLocal(this,'vocabVideo')"><div class="filePick">Use this only if the embedded video has not loaded yet.</div></div></div>`},
p3:{n:'3',t:'WHAT ARE THEY WEARING?',l:'Look for 5 seconds. Then hide the photos and describe from memory.',h:()=>`<div style="position:relative;height:100%"><div class="fashionGrid" id="fashionGrid">${['1515886657613-9f3515b0c78f','1529139574466-a303027c1d8b','1496747611176-843222e1e57c','1524504388940-b1c1722653e1','1485968579580-b6d095142e6e'].map((x,i)=>`<div class="fashion"><img src="https://images.unsplash.com/photo-${x}?auto=format&fit=crop&w=500&q=80"><span>LOOK ${i+1}</span></div>`).join('')}</div><div class="hideOverlay" id="hideOverlay">PHOTOS HIDDEN</div><div class="timerRow"><button class="btn" id="timerBtn" onclick="startFive()">START 5 SECONDS</button><div class="timer" id="timer">5</div><button class="btn ghost" onclick="document.getElementById('hideOverlay').style.display='none'">SHOW PHOTOS</button><button class="btn alt" onclick="document.getElementById('bank').classList.toggle('open')">STUCK? 5 WORDS</button></div><div class="definition"><b>What are they wearing?</b> Add colour + adjective: oversized, fitted, loose, smart, casual, striped, plain, bright, neutral.</div><div class="bank" id="bank"><span class="chip">blazer</span><span class="chip">trousers</span><span class="chip">trainers</span><span class="chip">handbag</span><span class="chip">sunglasses</span></div></div>`},
p5:{n:'5',t:'WHAT DO YOU USUALLY WEAR?',l:'Ask and answer the questions.',h:()=>`<div class="speakGrid">${['for work / university / school?','when you go out at night?','when you want to relax at the weekend?','for a special occasion?'].map((x,i)=>`<div class="speakQ"><b>${i+1}</b><div>What clothes do you usually wear<br><strong>${x}</strong></div></div>`).join('')}</div><div class="definition"><b>Challenge:</b> Answer with 2–3 clothing items + one adjective. Example: “I usually wear straight-leg jeans, a loose blouse and white trainers.”</div>`},
p6:{n:'6',t:'REMAKE PHOTO + GRAMMAR',l:'Use the picture to introduce Present Continuous, then contrast it with Present Simple.',h:()=>`<div class="grammarTop"><div class="milkPair"><div class="milk"><img src="https://upload.wikimedia.org/wikipedia/commons/a/a8/Vermeer_-_The_Milkmaid.jpg"><span>Original</span></div><div class="milk"><img src="https://images.unsplash.com/photo-1556911220-bff31c812dba?auto=format&fit=crop&w=800&q=80"><span>Remake</span></div></div><div class="memory"><h3>Look → hide → remember</h3><ol><li>What is she wearing?</li><li>What is she doing?</li><li>What objects can you remember?</li><li>Name 3 similarities.</li><li>Name 3 differences.</li></ol><button class="btn" onclick="milkTimer(this)">START 5 SECONDS</button></div></div><div class="ruleBox"><div class="contrast"><div class="g"><h4>Present Continuous</h4><b>am / is / are + V-ing</b><br>She’s wearing a cap.<br>He’s pouring milk.<br>They’re looking at the milk.<br><small>now · today · at the moment · Look!</small></div><div class="g"><h4>Present Simple</h4><b>habit / fact / usual situation</b><br>People often wear aprons.<br>She usually wears bright colours.<br><small>usually · often · always · every day</small></div></div><div class="tabs"><button class="tab active" onclick="openTab('rule',this)">Rule</button><button class="tab" onclick="openTab('exA',this)">Exercise A</button><button class="tab" onclick="openTab('exB',this)">Exercise B</button></div><div class="exercisePanel open" id="rule"><b>Compare:</b> She usually <u>wears</u> jeans. → Today she <u>is wearing</u> a dress.</div><div class="exercisePanel" id="exA"><div class="exGrid">${[['___ wearing yellow and blue clothes.','She’s'],['___ wearing a cap.','She’s'],['___ pouring milk from a bottle.','He’s'],['___ pouring milk from a jug.','She’s'],['___ looking at the milk.','They’re'],['___ standing near a window.','She’s']].map((q,i)=>`<div class="q">${i+1}. ${q[0]} <button class="choice" data-answer="${q[1]}" onclick="revealAnswer(this)">CHECK</button></div>`).join('')}</div></div><div class="exercisePanel" id="exB"><div class="exGrid" id="grammarQuiz"></div></div></div>`},
p7:{n:'7',t:'LISTENING · TRACK 1.20',l:'You’re going to listen to an art expert talking about Vermeer and The Milkmaid.',h:()=>`<div class="audioRow"><audio id="track120" controls><source src="media/english-file-1-20.mp3" type="audio/mpeg"></audio><button class="btn ghost" onclick="document.getElementById('audioFile').click()">OPEN AUDIO FILE</button><input id="audioFile" type="file" accept="audio/*" hidden onchange="loadLocal(this,'track120')"></div><div class="listenGrid">${[['What century did Vermeer live in?',['15th','17th','19th']],['Where was he from?',['Holland','Germany','Russia']],['What kind of things did he usually paint?',['everyday scenes','rich people','nature']],['What is the milkmaid probably making?',['butter','bread','a pudding']],['How many of Vermeer’s paintings exist today?',['4','34','304']],['Why was the painting expensive to make?',["Because it’s very big.",'Because the paints cost a lot.','Because he rented an expensive studio.']]].map((q,i)=>`<div class="listenQ"><b>${i+1}. ${q[0]}</b><div>${q[1].map((a,j)=>`<button class="choice" onclick="this.classList.toggle('ok')">${String.fromCharCode(97+j)} · ${a}</button>`).join('')}</div></div>`).join('')}</div><button class="btn alt" onclick="document.getElementById('answers').classList.toggle('open')">LISTEN AGAIN · CHECK NOTES</button><div class="answers" id="answers"><b>Listen again and make notes:</b><br>1 Delft — it’s a city in Holland. Vermeer was from there.<br>2 light coming through windows<br>3 his wife, his daughter, and his servant<br>4 <i>Girl with a Pearl Earring</i><br>5 the milkmaid’s apron<br>6 175 Dutch guilders</div><div class="note">If the embedded audio is still being uploaded, use OPEN AUDIO FILE with the 1.20 mp3 you sent me.</div>`}};
const grammarQs=[['In the photo the man ___ a cap.',['isn’t wearing','doesn’t wear'],0],['People often ___ aprons in the kitchen.',['wear','are wearing'],0],['What ___ now?',['do you do','are you doing'],1],['What ___? — She’s a teacher.',['does your sister do','is your sister doing'],0],['Look! They ___ matching outfits today.',['wear','are wearing'],1],['She ___ her new scarf today.',['wears','is wearing'],1]];
function render(){const id=pages[idx],x=p[id];num.textContent=x.n;title.textContent=x.t;lead.textContent=x.l;body.innerHTML=x.h();count.textContent=`${idx+1} / ${pages.length}`;prev.disabled=idx===0;next.disabled=idx===pages.length-1;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===id));if(id==='p6'){const g=document.getElementById('grammarQuiz');g.innerHTML=grammarQs.map((q,i)=>{const arr=q[1].map((a,j)=>({a,j})).sort(()=>Math.random()-.5);return `<div class="q"><b>${i+1}. ${q[0]}</b><div>${arr.map(o=>`<button class="choice" data-good="${q[2]}" data-pick="${o.j}" onclick="checkGrammar(this)">${o.a}</button>`).join('')}</div></div>`}).join('')}}function go(id){idx=pages.indexOf(id);render()}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));prev.onclick=()=>{if(idx>0){idx--;render()}};next.onclick=()=>{if(idx<pages.length-1){idx++;render()}};
function startFive(){let n=5;const t=document.getElementById('timer'),ov=document.getElementById('hideOverlay');t.textContent=n;ov.style.display='none';const int=setInterval(()=>{n--;t.textContent=n;if(n<=0){clearInterval(int);ov.style.display='grid';t.textContent='0'}},1000)}function milkTimer(btn){const pair=document.querySelector('.milkPair');let n=5;btn.disabled=true;btn.textContent='5';const int=setInterval(()=>{n--;btn.textContent=n;if(n<=0){clearInterval(int);pair.style.visibility='hidden';btn.textContent='SHOW AGAIN';btn.disabled=false;btn.onclick=()=>{pair.style.visibility='visible';btn.textContent='START 5 SECONDS';btn.onclick=()=>milkTimer(btn)}}},1000)}function openTab(id,b){document.querySelectorAll('.exercisePanel').forEach(x=>x.classList.remove('open'));document.getElementById(id).classList.add('open');document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active')}function revealAnswer(b){b.textContent=b.dataset.answer;b.classList.add('ok')}function checkGrammar(b){const box=b.parentElement;box.querySelectorAll('button').forEach(x=>{x.disabled=true;if(Number(x.dataset.pick)===Number(x.dataset.good))x.classList.add('ok')});if(Number(b.dataset.pick)!==Number(b.dataset.good))b.classList.add('no')}function loadLocal(input,id){if(input.files&&input.files[0]){document.getElementById(id).src=URL.createObjectURL(input.files[0]);document.getElementById(id).load()}}render();
</script></body></html>
