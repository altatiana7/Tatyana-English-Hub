<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maya · 1C Remakes</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Arial,Segoe UI,sans-serif;background:linear-gradient(135deg,#f8f3ff,#f4fbff 55%,#f4fbf5);color:#192033;overflow:hidden}.app{height:100vh;display:grid;grid-template-columns:170px 1fr}.side{background:#fff;border-right:1px solid #ded8e8;padding:12px}.brand{font-size:23px;font-weight:950;color:#6545bd;line-height:1}.brand span{display:block;color:#3aa84a;margin-top:5px}.side button{width:100%;margin:7px 0;padding:10px;border:1px solid #ddd5ea;border-radius:12px;background:#fff;text-align:left;font-weight:850;color:#372b69;cursor:pointer;font-size:12px}.side button.active{background:#684cc4;color:#fff}.side .continue{background:#1f9da7;color:#fff;border:0}.stage{padding:14px}.panel{height:100%;background:#fff;border:1px solid #ded7ea;border-radius:22px;padding:14px 18px;display:flex;flex-direction:column;overflow:hidden}.k{font-size:10px;font-weight:950;color:#1399a9;letter-spacing:.08em}.t{font-size:27px;font-weight:950;margin:4px 0}.l{font-size:13px;color:#626777;margin:0 0 8px}.content{flex:1;min-height:0;overflow:hidden}.photoGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;height:62%}.look{position:relative;border-radius:14px;overflow:hidden;background:#eee}.look img{width:100%;height:100%;object-fit:cover}.look b{position:absolute;left:7px;bottom:7px;background:rgba(20,20,30,.74);color:#fff;padding:4px 7px;border-radius:999px;font-size:10px}.task{margin-top:9px;padding:10px 12px;border-radius:14px;background:#fff7d9;border:1px solid #eadfae;font-size:13px}.bank{display:none;margin-top:7px;gap:5px;flex-wrap:wrap}.bank.open{display:flex}.chip{padding:4px 8px;border-radius:999px;background:#f1ebff;color:#5e3ca6;border:1px solid #ddd0f1;font-size:10px;font-weight:800}.btn{border:0;background:#6447bd;color:white;border-radius:9px;padding:7px 10px;font-weight:850;cursor:pointer;font-size:11px}.pairGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;height:100%}.pairCard{border:1px solid #e2dce9;border-radius:15px;padding:9px;background:#fff;display:flex;flex-direction:column}.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:1}.pic{position:relative;border-radius:12px;overflow:hidden;background:#eee}.pic img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;left:6px;bottom:6px;background:rgba(24,24,35,.72);color:#fff;padding:4px 7px;border-radius:999px;font-size:9px;font-weight:900}.grammar{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gbox{background:#eaf0ff;border:1px solid #d6def7;border-radius:15px;padding:14px}.gbox h2{text-align:center;font-size:18px;margin:0 0 7px}.example{font-size:19px;font-weight:900;text-align:center;margin:8px 0}.markers{font-size:12px;color:#155089;font-weight:850;line-height:1.6}.form{font-size:13px;line-height:1.55}.practice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.q{border:1px solid #ddd6e7;background:#fff;border-radius:12px;padding:10px;font-size:12px}.choice{border:1px solid #d5cde4;background:#fff;border-radius:8px;padding:6px 8px;margin:3px;cursor:pointer;font-size:11px}.choice.ok{background:#e7f6e4;border-color:#79b66b}.choice.no{background:#fff0ed;border-color:#d5847d}.footer{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e8e3ed;padding-top:7px;margin-top:6px}#core{display:none;width:100%;height:100vh;border:0}</style></head><body><div class="app" id="intro"><aside class="side"><div class="brand">1C <span>REMAKES</span></div><button data-step="0">1. Clothes Review</button><button data-step="1">2. Two Remakes</button><button data-step="2">3. Simple vs Continuous</button><button data-step="3">4. Quick Practice</button><button class="continue" id="goCore">CONTINUE TO REMAKES</button></aside><main class="stage"><section class="panel"><div class="k" id="k"></div><div class="t" id="t"></div><p class="l" id="l"></p><div class="content" id="content"></div><div class="footer"><button class="btn" id="prev">← Previous</button><span id="count"></span><button class="btn" id="next">Next →</button></div></section></main></div><iframe id="core" src="about:blank"></iframe><script>const steps=[{k:'REVISION · STYLE & HAIR',t:'What are they wearing?',l:'First speak from memory. Open the clothes bank only if you get stuck.',html:`<div class="photoGrid"><div class="look"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=600&q=80"><b>LOOK 1</b></div><div class="look"><img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=600&q=80"><b>LOOK 2</b></div><div class="look"><img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=600&q=80"><b>LOOK 3</b></div><div class="look"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&q=80"><b>LOOK 4</b></div><div class="look"><img src="https://images.unsplash.com/photo-1485968579580-b6d095142e6e?auto=format&fit=crop&w=600&q=80"><b>LOOK 5</b></div></div><div class="task"><b>What are they wearing?</b> Add colour + adjective. Try: oversized, fitted, loose, smart, casual, striped, plain, bright, neutral. <button class="btn" id="bankBtn">STUCK? WORD BANK</button><div class="bank" id="bank"><span class="chip">blouse</span><span class="chip">cardigan</span><span class="chip">coat</span><span class="chip">dress</span><span class="chip">hoodie</span><span class="chip">jacket</span><span class="chip">jeans</span><span class="chip">skirt</span><span class="chip">sweater</span><span class="chip">trousers</span><span class="chip">trainers</span><span class="chip">boots</span><span class="chip">scarf</span><span class="chip">necklace</span><span class="chip">bracelet</span><span class="chip">earrings</span><span class="chip">ring</span><span class="chip">handbag</span></div></div>`},{k:'1C REMAKES · LOOK FIRST',t:'Original → remake',l:'Describe clothes and actions before grammar.',html:`<div class="pairGrid"><div class="pairCard"><b>AMERICAN GOTHIC</b><div class="pair"><div class="pic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Grant%20DeVolson%20Wood%20-%20American%20Gothic.jpg"><span class="tag">ORIGINAL</span></div><div class="pic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/American%20Gothic%20Dress-Up.jpg"><span class="tag">REMAKE</span></div></div></div><div class="pairCard"><b>MONA LISA</b><div class="pair"><div class="pic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Mona%20Lisa-restored.jpg"><span class="tag">ORIGINAL</span></div><div class="pic"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=700&q=80"><span class="tag">MODERN PHOTO</span></div></div></div></div>`},{k:'GRAMMAR · CONTRAST',t:'Present Simple vs Present Continuous',l:'Usual style and habits vs what is happening now / today.',html:`<div class="grammar"><div class="gbox"><h2>PRESENT SIMPLE</h2><div class="example">She usually <u>wears</u> jeans.</div><div class="markers">usually · always · often · sometimes · never · every day</div><div class="form">+ I/you/we/they + V; he/she/it + V-s<br>– don’t / doesn’t + V<br>? Do / Does + subject + V?</div></div><div class="gbox"><h2>PRESENT CONTINUOUS</h2><div class="example">Today she <u>is wearing</u> a dress.</div><div class="markers">now · right now · at the moment · today · this week · Look! · Listen!</div><div class="form">+ am/is/are + V-ing<br>– am/is/are + not + V-ing<br>? Am/Is/Are + subject + V-ing?</div></div></div><div class="task"><b>Say 3 pairs about yourself:</b> I usually wear… but today I’m wearing…</div>`},{k:'CONTROLLED PRACTICE',t:'Simple or Continuous?',l:'Choose the correct form. Answer positions are mixed.',html:`<div class="practice" id="practice"></div>`}];const qs=[['She ___ dresses on special occasions.',['likes','is liking'],0],['He ___ a hat when it is sunny.',['usually wears','is usually wearing'],0],['Look! They ___ matching outfits today.',['wear','are wearing'],1],['She ___ on different outfits right now.',['tries','is trying'],1],['He ___ sweaters in winter.',['doesn’t wear','isn’t wearing'],0],['She ___ her new scarf today.',['wears','is wearing'],1],['They ___ clothes online quite often.',['buy','are buying'],0],['At the moment he ___ a new jacket.',['tries on','is trying on'],1]];let step=0;function render(){const s=steps[step];k.textContent=s.k;t.textContent=s.t;l.textContent=s.l;content.innerHTML=s.html;count.textContent=(step+1)+' / '+steps.length;document.querySelectorAll('[data-step]').forEach((b,i)=>b.classList.toggle('active',i===step));prev.disabled=step===0;next.disabled=step===steps.length-1;const bb=document.getElementById('bankBtn');if(bb)bb.onclick=()=>document.getElementById('bank').classList.toggle('open');if(step===3){practice.innerHTML=qs.map((q,i)=>{const a=q[1].map((x,j)=>({x,j})).sort(()=>Math.random()-.5);return `<div class="q"><b>${i+1}. ${q[0]}</b><br>${a.map(o=>`<button class="choice" data-q="${i}" data-i="${o.j}" data-c="${q[2]}">${o.x}</button>`).join('')}</div>`}).join('')}}document.addEventListener('click',e=>{const c=e.target.closest('[data-q]');if(!c)return;const i=c.dataset.q,good=Number(c.dataset.c),pick=Number(c.dataset.i);document.querySelectorAll(`[data-q="${i}"]`).forEach(x=>{x.disabled=true;if(Number(x.dataset.i)===good)x.classList.add('ok')});if(pick!==good)c.classList.add('no')});document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{step=Number(b.dataset.step);render()});prev.onclick=()=>{if(step>0){step--;render()}};next.onclick=()=>{if(step<steps.length-1){step++;render()}};goCore.onclick=()=>{intro.style.display='none';core.style.display='block';core.src='remakes-core.html?v=20260903'};render();</script></body></html>
