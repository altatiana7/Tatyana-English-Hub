<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maya 1C · Teacher Check</title><style>body{font-family:Inter,Segoe UI,Arial,sans-serif;margin:0;background:#f4f1fb;color:#211b45}.wrap{max-width:1180px;margin:auto;padding:24px}.top{background:linear-gradient(110deg,#6547c7,#0a9db4);color:#fff;padding:18px 20px;border-radius:18px}.top h1{margin:0 0 6px;font-size:28px}.card{background:#fff;border:1px solid #e2dcf2;border-radius:16px;padding:16px;margin-top:14px}.card h2{margin:0 0 10px;color:#4b35ae}.codeInput{width:100%;min-height:110px;border:2px solid #a7dfe7;border-radius:12px;padding:12px;font:14px/1.4 Consolas,monospace;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.actions button{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}.check{background:#0a9db4;color:#fff}.clear{background:#eee;color:#403b50}.status{margin-top:10px;font-weight:800}.summary{display:none;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.summary.show{display:grid}.sum{background:#fff;border:1px solid #e2dcf2;border-radius:14px;padding:14px}.sum strong{display:block;font-size:25px;color:#4b35ae}.sum span{font-size:13px;color:#706a80}.section{margin-top:14px}.section h2{margin:0 0 8px;color:#4b35ae}.results{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{border:1px solid #ece7f5;border-radius:11px;padding:10px;background:#fff}.item.good{border-color:#bfe7d2;background:#f3fff8}.item.bad{border-color:#f2c4ce;background:#fff5f7}.item.blank{border-color:#dedbe5;background:#fafafa}.num{font-weight:900;color:#4b35ae;margin-right:6px}.row{margin-top:5px;font-size:14px}.label{font-weight:900;color:#6a6380}.student{font-weight:800}.answer{color:#087e9c;font-weight:900}.wrong{color:#c84465;font-weight:900}.note{font-size:13px;color:#6b6679;margin-top:6px}.keys{margin-top:18px}.keys summary{cursor:pointer;font-weight:900;color:#4b35ae}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:10px}.keyItem{padding:7px 8px;border-bottom:1px solid #eee9f7;line-height:1.35}.a{font-weight:900;color:#087e9c}@media(max-width:800px){.results,.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="top"><h1>Maya 1C · Teacher Check</h1><div>Paste Maya’s submission code to see her answers and automatic checking.</div></div><section class="card"><h2>Paste Maya’s code</h2><textarea id="codeInput" class="codeInput" placeholder="M1C1.Z.... or M1C1.J...."></textarea><div class="actions"><button class="check" id="checkBtn">CHECK MAYA'S WORK</button><button class="clear" id="clearBtn">CLEAR</button></div><div class="status" id="status"></div></section><div class="summary" id="summary"><div class="sum"><strong id="scoreMain">0/66</strong><span>total correct</span></div><div class="sum"><strong id="scoreUse">0/15</strong><span>USE</span></div><div class="sum"><strong id="scoreBr">0/25</strong><span>BRACKETS</span></div><div class="sum"><strong id="scoreOther">0/26</strong><span>BLOGGER + DETECTIVE</span></div></div><div id="studentResults"></div><details class="card keys"><summary>Show teacher answer key</summary><div id="keyMount"></div></details></div><script>
const useAnswers=['привычка / регулярное действие','факт / постоянная ситуация','действие происходит сейчас','временная ситуация в этот период','раздражение: always + Continuous','изменяющаяся / развивающаяся ситуация','расписание / фиксированное время','характеристика / состояние / внешний вид','привычка / регулярное действие','действие происходит сейчас','факт / постоянная ситуация','временная ситуация в этот период','раздражение: always + Continuous','изменяющаяся / развивающаяся ситуация','расписание / фиксированное время'];
const brAnswers=['wears','are you looking','am not seeing','has','are meeting','talks','are always borrowing','does not suit','are changing','is teaching','does she usually wear','am trying','closes','does not believe','are choosing','meets','are you smiling','travels','is not dating','think','reads','is wearing','buys','lives','prefers'];
const storyAnswers=['runs','writes','trust','is staying','is working','prefers','is wearing','is walking','is growing','are offering','does not accept','believes','is meeting','is always changing'];
const errAnswers=['Wrong','Correct','Wrong','Correct','Wrong','Correct','Wrong','Correct','Correct','Wrong','Correct','Correct'];
const useQuestions=['Maya usually chooses fitted jackets because they suit her slim figure.','She teaches Russian and literature at school.','Look at her now: she is trying on an oversized blazer.','This month she is planning a longer trip.','You are always cancelling at the last minute!','Her style is becoming more confident.','The night train leaves at 21:40 tomorrow.','She looks elegant in simple clothes.','She normally avoids low-rise jeans.','I am looking for an outfit for a date tonight.','Her close friend lives abroad.','She is reading more travel blogs than usual this week.','He is always checking his phone!','More people are buying second-hand designer clothes these days.','The museum opens at ten.'];
const brQuestions=['wear','are you looking','not/see','have','meet','talk','always borrow','not/suit','change','teach','usually wear','try','close','not/believe','choose','meet','smile','travel','not/date','think','read','wear','buy','live','prefer'];
const storyQuestions=['run','write','trust','stay','work','prefer','wear','walk','grow','offer','not/accept','believe','meet','always/change'];
const errQuestions=['She is usually wearing fitted blazers to school.','I am seeing a friend for dinner tonight.','This coat is belonging to my sister.','You are always interrupting me...','The train is leaving at 21:40 every Friday.','Her English is getting more fluent...','I look for a pair of ankle boots right now.','She does not think this colour suits her.','We are staying in Tbilisi for a week...','He is having blue eyes and dark hair.','She always meets people...','Why are you smelling the perfume?'];
function norm(v){return String(v??'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\bdoesn't\b/g,'does not').replace(/\bisn't\b/g,'is not').replace(/\baren't\b/g,'are not').replace(/\bi'm\b/g,'i am').replace(/\s+/g,' ').replace(/[.!?]+$/,'')}
function base64UrlToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s),out=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out}
async function decodeCode(code){const parts=code.trim().split('.');if(parts.length!==3||parts[0]!=='M1C1')throw new Error('This is not a Maya 1C code.');const bytes=base64UrlToBytes(parts[2]);let raw;if(parts[1]==='Z'){if(!('DecompressionStream' in window))throw new Error('This browser cannot open the compressed code. Please use Chrome or Edge.');const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));raw=new Uint8Array(await new Response(stream).arrayBuffer())}else if(parts[1]==='J'){raw=bytes}else throw new Error('Unknown code format.');const data=JSON.parse(new TextDecoder().decode(raw));if(data.v!==1||data.l!=='1C')throw new Error('The code belongs to a different homework.');return data}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function checkArray(student,answers){let score=0;const statuses=answers.map((a,i)=>{const s=student?.[i]??'';const blank=!String(s).trim();const ok=!blank&&norm(s)===norm(a);if(ok)score++;return {s,a,ok,blank}});return {score,statuses}}
function sectionHtml(title,questions,checked){return `<section class="section"><h2>${esc(title)}</h2><div class="results">${checked.statuses.map((r,i)=>`<div class="item ${r.blank?'blank':r.ok?'good':'bad'}"><div><span class="num">${i+1}</span>${esc(questions[i]||'')}</div><div class="row"><span class="label">Maya:</span> <span class="student ${r.ok?'answer':'wrong'}">${esc(r.s||'[blank]')}</span></div>${r.ok?'':`<div class="row"><span class="label">Correct:</span> <span class="answer">${esc(r.a)}</span></div>`}</div>`).join('')}</div></section>`}
async function runCheck(){status.textContent='Reading code…';studentResults.innerHTML='';summary.classList.remove('show');try{const d=await decodeCode(codeInput.value);const use=checkArray(d.u,useAnswers),br=checkArray(d.b,brAnswers),story=checkArray(d.s,storyAnswers),err=checkArray(d.e,errAnswers);const total=use.score+br.score+story.score+err.score;scoreMain.textContent=`${total}/66`;scoreUse.textContent=`${use.score}/15`;scoreBr.textContent=`${br.score}/25`;scoreOther.textContent=`${story.score+err.score}/26`;summary.classList.add('show');const date=d.t?new Date(d.t).toLocaleString():'unknown time';status.textContent=`Maya · 1C · code created ${date}`;studentResults.innerHTML=sectionHtml('1 · USE',useQuestions,use)+sectionHtml('2 · BRACKETS',brQuestions,br)+sectionHtml('3 · BLOGGER',storyQuestions,story)+sectionHtml('4 · ERROR DETECTIVE',errQuestions,err)}catch(e){status.textContent='Cannot read code: '+e.message}}
checkBtn.onclick=runCheck;clearBtn.onclick=()=>{codeInput.value='';status.textContent='';studentResults.innerHTML='';summary.classList.remove('show')};
keyMount.innerHTML=`<h2>1 · USE</h2><div class="grid">${useAnswers.map((x,i)=>`<div class="keyItem">${i+1} — <span class="a">${esc(x)}</span></div>`).join('')}</div><h2>2 · BRACKETS</h2><div class="grid">${brAnswers.map((x,i)=>`<div class="keyItem">${i+1} <span class="a">${esc(x)}</span></div>`).join('')}</div><h2>3 · BLOGGER</h2><div class="grid">${storyAnswers.map((x,i)=>`<div class="keyItem">${i+1} <span class="a">${esc(x)}</span></div>`).join('')}</div><h2>4 · ERROR DETECTIVE</h2><div class="grid">${errAnswers.map((x,i)=>`<div class="keyItem">${i+1} <span class="a">${esc(x)}</span></div>`).join('')}</div>`;
</script></body></html>
