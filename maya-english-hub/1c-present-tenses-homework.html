<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maya 1C · Present Simple vs Continuous</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font-family:Inter,Segoe UI,Arial,sans-serif;color:#211b45;background:linear-gradient(135deg,#f4efff,#eefaff,#f5fff0)}.wrap{height:100vh;max-width:1120px;margin:auto;padding:8px 10px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:42px}.top h1{margin:0;font-size:20px;color:#4b35ae}.top p{margin:2px 0 0;color:#6a6880;font-size:11px}.tabs{display:flex;gap:6px;margin:6px 0 7px;flex-wrap:nowrap}.tab{border:1px solid #d9d0ef;background:#fff;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800;color:#513aad;cursor:pointer;white-space:nowrap}.tab.active{background:#6547c7;color:#fff}.panel{display:none;flex:1;min-height:0;background:rgba(255,255,255,.88);border:1px solid #e0d9ef;border-radius:14px;padding:8px 10px;box-shadow:0 6px 18px rgba(70,49,135,.08);overflow:hidden}.panel.active{display:flex;flex-direction:column}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;min-height:30px}.head h2{font-size:15px;margin:0}.head span{font-size:11px}.check{border:0;border-radius:8px;background:#0a9db4;color:#fff;font-size:12px;font-weight:900;padding:6px 10px;cursor:pointer}.usage{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed}.usage th,.usage td{border-bottom:1px solid #ece7f5;padding:3px 6px;text-align:left;line-height:1.15}.usage th:first-child,.usage td:first-child{width:54%}.usage th{color:#4b35ae;font-size:11px}.usage select{width:100%;padding:3px 4px;border:1px solid #d9d0ef;border-radius:6px;background:#fff;font-size:10px}.ok{background:#edf9e9}.bad{background:#fff0ef}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;align-content:start}.q{border:1px solid #e4def0;border-radius:8px;padding:5px 6px;background:#fff;font-size:11px;line-height:1.25;min-height:47px}.q input{width:118px;padding:4px 5px;border:1px solid #d9d0ef;border-radius:6px;font-size:11px}.story{font-size:13px;line-height:1.75;background:#fff;border:1px solid #e4def0;border-radius:10px;padding:10px 12px;flex:1;display:flex;align-items:center}.story input{width:118px;padding:3px 4px;border:0;border-bottom:2px solid #b8a9df;background:#faf8ff;font-size:12px}.error{display:grid;grid-template-columns:1fr 1fr;gap:5px}.err{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;border:1px solid #e4def0;border-radius:8px;padding:5px 7px;background:#fff;font-size:11px;line-height:1.2;min-height:52px}.err button{border:1px solid #d5cbea;border-radius:7px;background:#fff;padding:4px 6px;font-size:10px;cursor:pointer}.status{font-weight:900;color:#4b35ae;margin-top:4px;min-height:16px;font-size:11px}@media(max-width:850px){.top h1{font-size:17px}.tab{padding:5px 7px;font-size:10px}.usage{font-size:9px}.usage select{font-size:9px}.grid{grid-template-columns:1fr 1fr}.q{font-size:10px}.error{grid-template-columns:1fr}.story{font-size:11px;line-height:1.55}}</style></head><body><div class="wrap"><div class="top"><div><h1>1C · Present Simple vs Present Continuous</h1><p>Appearance · clothes · dating · real-life use</p></div></div><div class="tabs"><button class="tab active" data-p="use">1 · Why this tense?</button><button class="tab" data-p="brackets">2 · Open the brackets</button><button class="tab" data-p="story">3 · Fashion blogger</button><button class="tab" data-p="detective">4 · Error Detective</button></div><section class="panel active" id="use"><div class="head"><h2>Match each sentence with the use in Russian</h2><button class="check" onclick="checkUse()">Check</button></div><table class="usage"><thead><tr><th>English sentence</th><th>Случай употребления</th></tr></thead><tbody id="useBody"></tbody></table><div class="status" id="useStatus"></div></section><section class="panel" id="brackets"><div class="head"><h2>Present Simple or Present Continuous?</h2><button class="check" onclick="checkBrackets()">Check</button></div><div class="grid" id="bracketGrid"></div><div class="status" id="bracketStatus"></div></section><section class="panel" id="story"><div class="head"><h2>A day in the life of a fashion blogger</h2><button class="check" onclick="checkStory()">Check</button></div><div class="story" id="storyBox"></div><div class="status" id="storyStatus"></div></section><section class="panel" id="detective"><div class="head"><h2>Error Detective</h2><span>Correct or incorrect?</span></div><div class="error" id="errorBox"></div><div class="status" id="errorStatus"></div></section></div><script>const uses=['привычка / регулярное действие','факт / постоянная ситуация','действие происходит сейчас','временная ситуация в этот период','раздражение: always + Continuous','изменяющаяся / развивающаяся ситуация','расписание / фиксированное время','личная характеристика / внешний вид'];const useData=[['Maya usually wears neutral colours on weekdays.',0],['Her sister has long dark hair and green eyes.',7],['Look! That woman is wearing an oversized blazer.',2],['I am staying with my cousin this week.',3],['He is always cancelling dates at the last minute!',4],['Online dating is becoming more popular.',5],['The fashion show starts at 7 p.m.',6],['She goes on a date every Friday.',0],['Tom looks very confident in photos.',7],['I am looking for ankle boots right now.',2],['She works for a fashion magazine.',1],['They are trying a new dating app this month.',3],['You are always borrowing my clothes!',4],['Her style is getting more colourful.',5],['The shop closes at 9 p.m.',6]];const ub=document.getElementById('useBody');useData.forEach((x,i)=>{ub.innerHTML+=`<tr><td>${i+1}. ${x[0]}</td><td><select data-a="${x[1]}"><option value="">Choose…</option>${uses.map((u,j)=>`<option value="${j}">${u}</option>`).join('')}</select></td></tr>`});function checkUse(){let n=0;document.querySelectorAll('#useBody select').forEach(s=>{const ok=s.value===s.dataset.a;s.closest('tr').className=ok?'ok':'bad';if(ok)n++});useStatus.textContent=`${n} / ${useData.length}`}
const br=[['She usually ___ (wear) fitted jackets.','wears'],['Why are you ___ (look) at me like that?','looking'],['I ___ (not/date) anyone at the moment.','am not dating'],['My best friend ___ (have) curly hair.','has'],['We ___ (meet) Anna for coffee tonight.','are meeting'],['He always ___ (talk) about himself on dates.','talks'],['You are always ___ (leave) your clothes on my chair!','leaving'],['This dress ___ (not/fit) me.','does not fit'],['Fashion trends ___ (change) very quickly these days.','are changing'],['She ___ (work) in a clothes shop this month.','is working'],['What does he usually ___ (wear) on dates?','wear'],['I ___ (try) on a new blazer right now.','am trying'],['The café ___ (close) at ten.','closes'],['She ___ (not/like) low-rise jeans.','does not like'],['More people ___ (buy) second-hand clothes now.','are buying']];bracketGrid.innerHTML=br.map((x,i)=>`<div class="q">${i+1}. ${x[0].replace('___',`<input data-a="${x[1]}">`)}</div>`).join('');function norm(s){return s.toLowerCase().replace(/’/g,"'").replace(/\s+/g,' ').trim()}function checkBrackets(){let n=0;document.querySelectorAll('#bracketGrid input').forEach(x=>{const ok=norm(x.value)===norm(x.dataset.a);x.parentElement.className='q '+(ok?'ok':'bad');if(ok)n++});bracketStatus.textContent=`${n} / ${br.length}`}
storyBox.innerHTML=`Lena <input data-a="is"> (be) a fashion blogger. She <input data-a="runs"> (run) a small style account and <input data-a="posts"> (post) outfit ideas every day. This week she <input data-a="is preparing"> (prepare) a video about autumn trends, so she <input data-a="is trying"> (try) lots of different outfits. She normally <input data-a="prefers"> (prefer) simple clothes, but today she <input data-a="is wearing"> (wear) wide-leg trousers, a fitted top and a bright blazer. Tonight she <input data-a="is meeting"> (meet) someone she matched with online. She <input data-a="does not usually go"> (not/usually/go) on dates during the week, but her schedule <input data-a="is becoming"> (become) more flexible. Her younger sister <input data-a="is always borrowing"> (always/borrow) her clothes, which drives Lena crazy, although Lena secretly <input data-a="loves"> (love) giving her style advice.`;function checkStory(){let n=0;document.querySelectorAll('#storyBox input').forEach(x=>{const ok=norm(x.value)===norm(x.dataset.a);x.style.background=ok?'#edf9e9':'#fff0ef';if(ok)n++});storyStatus.textContent=`${n} / 12`}
const errors=[['She is usually wearing black on dates.',false,'She usually wears black on dates.'],['I am seeing my friend tonight.',true,''],['He has blue eyes and short hair.',true,''],['You are always checking your phone during dinner!',true,''],['This jacket is belonging to Maya.',false,'This jacket belongs to Maya.'],['The shop is opening at 10 every day.',false,'The shop opens at 10 every day.'],['Her style is changing a lot these days.',true,''],['I look for a new dress right now.',false,'I am looking for a new dress right now.'],['She does not like blind dates.',true,''],['We are trying a new café this evening.',true,'']];errorBox.innerHTML=errors.map((x,i)=>`<div class="err" data-i="${i}"><span>${i+1}. ${x[0]}</span><span><button onclick="judge(${i},true)">Correct</button> <button onclick="judge(${i},false)">Wrong</button></span></div>`).join('');function judge(i,v){const e=errors[i],d=document.querySelector(`.err[data-i="${i}"]`);const ok=v===e[1];d.className='err '+(ok?'ok':'bad');if(!e[1]&&e[2])d.querySelector('span').innerHTML=`${i+1}. ${e[0]}<br><b>${e[2]}</b>`}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.p).classList.add('active')});</script></body></html>
