<body>
<div class="app">
<aside class="side">
  <div class="brand"><div class="logo">M</div><div><b>MAYA ENGLISH HUB</b><small>LESSONS & HOMEWORK</small></div></div>
  <div class="unit">MODULE 1</div>
  <button class="unitCard" data-src="style-hair.html?v=20260901-2" data-label="1 September · Style & Hair" onclick="openView(this)"><b>People & Style</b><span>Appearance · Dating · Clothes · Hair</span></button>

  <button class="lessonBtn" data-src="2026-08-27.html?v=archive1" data-label="14 August · Describing people" onclick="openView(this)">

  <button class="lessonBtn" data-src="2026-08-27.html?v=archive1" data-label="16 August · Looking good" onclick="openView(this)">
    <div class="num">02</div><div><div class="lessonDate">16 August</div><span class="lessonTitle">Lesson 2 · Looking good</span><span class="status done">Completed</span></div>
  </button>
  <button class="lessonBtn" data-src="2026-08-27.html?v=archive1" data-label="19 August · A date for Clint" onclick="openView(this)">
    <div class="num">03</div><div><div class="lessonDate">19 August</div><span class="lessonTitle">Lesson 3 · A date for Clint</span><span class="status done">Completed</span></div>
  </button>
  <button class="lessonBtn" data-src="2026-08-27.html?v=archive1" data-label="21 August · Dating collocations" onclick="openView(this)">
    <div class="num">04</div><div><div class="lessonDate">21 August</div><span class="lessonTitle">Lesson 4 · Dating collocations</span><span class="status done">Completed</span></div>
  </button>
  <button class="lessonBtn" data-src="2026-08-27.html?v=archive1" data-label="27 August · Elspeth + Jenny & Rob" onclick="openView(this)">
    <div class="num">05</div><div><div class="lessonDate">27 August</div><span class="lessonTitle">Lesson 5 · Elspeth + Jenny & Rob</span><span class="status done">Completed</span></div>
  </button>
  <div class="divider"></div>

<main class="main">
  <header class="topbar"><div class="currentLabel"><small>CURRENT LESSON</small><b id="currentName">1 September · Style & Hair</b></div><div class="topStatus" id="currentStatus">HOMEWORK</div></header>
  <iframe id="view" class="frame" src="style-hair.html?v=20260901-2" title="Maya English lesson"></iframe>
</main>
</div>
<script>
function openView(btn){
  document.querySelectorAll('.lessonBtn,.unitCard').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('view').src=btn.dataset.src;
  document.getElementById('currentName').textContent=btn.dataset.label||'Maya English Hub';
  const done=btn.querySelector('.status.done');
  document.getElementById('currentStatus').textContent=done?'COMPLETED':(btn.classList.contains('unitCard')?'CURRENT':'HOMEWORK');
}
</script>
</body>
