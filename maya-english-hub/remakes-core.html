<style>

.coverMenu{display:grid;gap:6px;overflow:auto}.coverMenu button{border:1px solid #e5dfec;background:#fff;border-radius:13px;padding:8px 10px;text-align:left;font-weight:850;color:#392e68}.coverMenu small{display:block;color:#767086;font-weight:500;margin-top:2px}
.coverMenu button:hover{background:#f5efff;border-color:#cdb9ef}.quick{margin-top:auto;border:0!important;background:linear-gradient(90deg,#7b58d2,#31aeb0)!important;color:#fff!important;text-align:center!important}
.coverHero{min-width:0;display:grid;grid-template-rows:auto auto 1fr;gap:12px;background:rgba(255,255,255,.60);border:1px solid rgba(227,216,238,.9);border-radius:28px;padding:24px 28px;box-shadow:0 14px 40px rgba(45,34,83,.10)}
.heroEyebrow{font-weight:900;color:var(--teal);letter-spacing:.1em;font-size:13px}.heroTitle{font-size:clamp(46px,7vw,96px);line-height:.86;margin:0;color:#27345d;font-weight:1000;letter-spacing:-.04em;text-shadow:3px 3px 0 #ede7fa}.heroRibbon{display:inline-block;background:linear-gradient(90deg,#7653cd,#23a8b1,#63b447);color:#fff;font-size:16px;font-weight:900;letter-spacing:.06em;padding:9px 14px;border-radius:8px;transform:rotate(-1deg);margin-top:8px}.heroLead{font-size:19px;line-height:1.4;max-width:680px;margin:10px 0 0}
.heroWorlds{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;min-height:0;align-items:stretch}.world{border-radius:22px;overflow:hidden;position:relative;min-height:220px;border:1px solid #e1daec;background:#fff}.world img{width:100%;height:100%;object-fit:cover;display:block}.world:after{content:attr(data-label);position:absolute;left:14px;bottom:14px;color:#fff;font-weight:950;letter-spacing:.08em;background:rgba(31,35,54,.74);padding:8px 12px;border-radius:999px}.worldFallback{height:100%;display:grid;place-items:center;text-align:center;padding:24px;font-size:28px;font-weight:950}.artFallback{background:linear-gradient(135deg,#f4e6ff,#e7d7ff)}.musicFallback{background:linear-gradient(135deg,#dff5fa,#cfeef5)}.filmFallback{background:linear-gradient(135deg,#e8f7df,#d8efcb)}
#lesson{display:none;height:100vh;background:radial-gradient(circle at 5% 10%,rgba(187,155,227,.18) 0,transparent 28%),radial-gradient(circle at 95% 8%,rgba(248,220,166,.16) 0,transparent 25%),radial-gradient(circle at 6% 90%,rgba(183,220,246,.18) 0,transparent 26%),radial-gradient(circle at 94% 86%,rgba(172,226,201,.16) 0,transparent 24%),linear-gradient(135deg,#fffefb,#fbf7ff 46%,#f6fcfb)}
.top{height:52px;display:flex;align-items:center;gap:10px;padding:6px 14px;background:rgba(255,255,255,.90);border-bottom:1px solid #ddd;backdrop-filter:blur(6px)}.brand{font-size:21px;font-weight:950;color:var(--purple)}.brand span{color:var(--green)}.title{flex:1;text-align:center;font-size:18px;font-weight:950}.navbtn{border:1px solid #cbbced;background:#fff;border-radius:12px;padding:7px 11px;font-size:13px;font-weight:850;color:#423174;text-decoration:none}
.body{height:calc(100vh - 52px);display:grid;grid-template-columns:190px 1fr}.side{background:rgba(255,255,255,.84);padding:8px;border-right:1px solid #ddd;overflow:auto}.side button{width:100%;min-height:44px;margin:3px 0;padding:7px 9px;border:1px solid #e6e1ec;background:#fff;border-radius:12px;text-align:left;font-weight:850;font-size:12px;color:#342b5f}.side button.active{background:linear-gradient(90deg,var(--purple),#8c64db);color:#fff}.side .small{display:block;font-size:10px;font-weight:500;color:#726d7b;margin-top:2px}.side button.active .small{color:#fff}.side .reviewBtn{margin-top:8px;background:#eef9f6;border-color:#bde1d7;color:#18766d}
.stage{padding:10px 14px;overflow:hidden;display:flex}.panel{width:100%;max-width:1280px;margin:auto;height:100%;background:rgba(255,255,255,.88);border:1px solid rgba(215,205,233,.9);border-radius:22px;box-shadow:0 12px 32px rgba(67,55,88,.10);padding:12px 16px;display:flex;flex-direction:column;overflow:hidden}.headrow{display:flex;gap:14px;align-items:flex-start;margin-bottom:4px}.grow{flex:1}.kicker{font-weight:950;color:var(--teal);letter-spacing:.08em;text-transform:uppercase;font-size:11px}h1{font-size:26px;margin:3px 0 4px}h2{font-size:20px;margin:8px 0}.lead{font-size:15px;line-height:1.35;margin:3px 0 6px;color:#59536a}.counter{font-weight:950;color:var(--purple);font-size:13px}.workspace{flex:1;min-height:0;overflow:auto;padding-right:6px}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px}.card{background:#fff;border:1px solid #ddd;border-radius:17px;padding:14px}.lav{background:#f4eeff}.mint{background:#eefaf3}.blue{background:#edf8fb}.soft{background:#fff7d5}.prompt{font-size:18px;font-weight:950}.bigquote{font-size:21px;font-weight:850;line-height:1.42}.tag{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee7fb;color:#5e39aa;font-weight:850;margin:3px}.visual{width:100%;height:210px;border-radius:18px;overflow:hidden;background:#f5f2f8;border:1px solid #e4dceb;margin-bottom:10px}.visual img{width:100%;height:100%;object-fit:cover}.visualText{height:100%;display:grid;place-items:center;text-align:center;padding:20px;font-size:28px;font-weight:950;color:#4b3d75;background:linear-gradient(135deg,#f1e8ff,#e9f8f3)}
.btn{border:0;border-radius:12px;padding:9px 13px;background:var(--purple);color:#fff;font-weight:900;margin:3px}.btn.green{background:var(--green)}.btn.teal{background:var(--teal)}.btn.orange{background:var(--orange)}.btn.ghost{background:#fff;color:var(--purple);border:1px solid #cab8ef}.stepnav{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #e8e4ee;padding-top:6px;margin-top:5px;min-height:44px}.dots{font-size:12px;font-weight:850;color:#76698d}
.choicegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.choice{border:1px solid #d9d1e7;background:#fff;border-radius:13px;padding:12px;text-align:left;font-weight:750}.choice.ok{background:#eaf8e6;border-color:#7cbc68}.choice.no{background:#fff0ee;border-color:#db8c80}.feedback{font-weight:900;margin:8px 0;min-height:22px}.sentence{padding:10px 11px;border-radius:12px;background:#fff;border:1px solid #ddd;margin:6px 0}.sentence select,.sentence input{margin-left:8px;padding:7px;border:1px solid #d5cbe6;border-radius:9px;max-width:65%}
.quizlet{max-width:740px;margin:5px auto}.flash{height:270px;perspective:1000px;cursor:pointer}.flashin{position:relative;width:100%;height:100%;transition:.45s;transform-style:preserve-3d}.flash.flipped .flashin{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:2px solid #ded5ef;border-radius:22px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;box-shadow:0 12px 25px rgba(88,67,122,.09)}.back{transform:rotateY(180deg);background:#f5efff}.word{font-size:38px;font-weight:950}.definition{font-size:20px;max-width:650px}.flashnav{display:flex;justify-content:center;flex-wrap:wrap;gap:5px;margin-top:7px}.gameScore{font-size:48px;color:var(--green);font-weight:950}.reviewGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.reviewWord{font-size:18px;font-weight:900}.mini{font-size:13px;color:#6a6575}
@media(max-width:900px){.coverframe{grid-template-columns:1fr}.coverSide{display:none}.heroWorlds{grid-template-columns:1fr 1fr}.body{grid-template-columns:155px 1fr}.grid3{grid-template-columns:1fr 1fr}.panel{padding:10px}.heroTitle{font-size:56px}}
</style>

<body>
<main id="cover">
  <div class="coverframe">
    <aside class="coverSide"><div class="coverBrand">1C <span>REMAKES</span></div><div class="coverMenu" id="coverMenu"></div><button class="quick" id="coverReview">Quick Review</button></aside>
    <section class="coverHero"><div><div class="heroEyebrow">ART. MUSIC. FILMS.</div><h1 class="heroTitle">REMAKES</h1><div class="heroRibbon">DIFFERENT WORLDS. SAME IDEA.</div><p class="heroLead">Explore how ideas, stories and inspiration are remade in art, music and films.</p></div><div></div><div class="heroWorlds"><div class="world" data-label="ART"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Mona_Lisa.jpg" alt="Mona Lisa" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><div class="worldFallback artFallback" style="display:none">CLASSIC → MODERN</div></div><div class="world" data-label="MUSIC"><div class="worldFallback musicFallback">ORIGINAL → COVER</div></div><div class="world" data-label="FILMS"><div class="worldFallback filmFallback">CLASSIC → REMAKE</div></div></div></section>
  </div>
</main>
<main id="lesson">
<header class="top"><div class="brand">1C <span>REMAKES</span></div><div class="title" id="screenTitle"></div><button class="navbtn" id="homeBtn">⌂ Home</button><a class="navbtn" href="index.html">← Maya Hub</a></header>
<div class="body"><nav class="side" id="side"></nav><section class="stage"><div class="panel"><div class="headrow"><div class="grow"><div class="kicker" id="kicker"></div><h1 id="pageTitle"></h1><p class="lead" id="pageLead"></p></div><div class="counter" id="stepCount"></div></div><div class="workspace" id="workspace"></div><div class="stepnav"><button class="btn ghost" id="prevBtn">← Previous</button><div class="dots" id="dots"></div><button class="btn" id="nextBtn">Next →</button></div></div></section></div>
</main>
<script>
const menu=[['warm','1. Warm-up','Remakes Around Us'],['vocab','2. Vocabulary','Words in Context'],['art','3. Art Remakes','From Classic to Modern'],['music','4. Music Remakes','New Versions'],['film','5. Film Remakes','Same Story, New Film'],['listen','6. Listening','People Talk'],['discuss','7. Discussion','Your Opinions'],['use','8. Use It!','Speak & Write'],['game','9. Game','Remake Challenge']];
const vocab=[['remake','a new version of an existing work','This film is a remake of a 1960s classic.'],['original','the first version','I prefer the original painting.'],['version','one form of something that can exist in different forms','This acoustic version sounds calmer.'],['adapt','change something so it works in a new form or situation','They adapted the novel for the screen.'],['reinterpret','present an old idea in a new way','The artist reinterpreted the portrait in a modern style.'],['update','make something more modern','The director updated the setting to the present day.'],['classic','a work that is well known and valued for a long time','The original film became a classic.'],['modern','belonging to the present time','The remake has a modern look.'],['similar','almost the same, but not exactly','The two plots are similar.'],['different','not the same','The ending is completely different.'],['audience','the people who watch or listen','The remake was made for a younger audience.'],['style','the way something looks, sounds or is made','The new version has a darker style.'],['plot','the main events of a story','The plot stays almost the same.'],['character','a person in a story, film or play','My favourite character is different in the remake.'],['soundtrack','the music used in a film','The remake has a new soundtrack.'],['masterpiece','an exceptionally good work of art','Many people call the original a masterpiece.']];
const speakers=[{n:'Speaker A',txt:'I usually prefer the original, especially with films. A remake can look better, but sometimes the new special effects make the story feel less real. If the plot is already strong, I do not need a newer version.'},{n:'Speaker B',txt:'I love cover versions. The lyrics and melody can stay the same, but a different voice and arrangement can completely change the mood. That is what makes a remake creative for me.'},{n:'Speaker C',txt:'With art, I like reinterpretations that clearly refer to the original but add a new message. If I can recognise the masterpiece and still discover something different, the remake works.'}];
let current='warm',step=0,vIndex=0,gameIndex=0,gameScore=0;
function mcq(id,q,opts,c){const order=opts.map((x,i)=>({x,i})).sort(()=>Math.random()-.5);return `<div class="card soft"><p class="prompt">${q}</p><div class="choicegrid">${order.map(o=>`<button class="choice" data-mcq="${id}" data-i="${o.i}" data-c="${c}">${o.x}</button>`).join('')}</div><div class="feedback" id="fb-${id}"></div></div>`}
function shuffle(a){return a.slice().sort(()=>Math.random()-.5)}
function matchingTask(){const pairs=[['adapt','change for a new form'],['audience','people who watch or listen'],['plot','main events of a story'],['soundtrack','music used in a film'],['masterpiece','an exceptionally good work']];return `<div class="grid2">${pairs.map(([w,d],i)=>`<div class="sentence"><b>${w}</b><select data-match="${i}"><option value="">Choose definition</option>${shuffle(pairs.map(x=>x[1])).map(x=>`<option>${x}</option>`).join('')}</select><span class="feedback"></span></div>`).join('')}</div><button class="btn" id="checkMatch">Check</button>`}
function gapTask(){const items=[['The director decided to ___ the story for a younger audience.','adapt'],['The new ___ has a completely different soundtrack.','version'],['The ___ is similar, but the ending changes.','plot'],['The artist wanted to ___ the old image in a digital style.','reinterpret'],['The film was ___ to make the setting feel contemporary.','updated']];return `<div>${items.map(([s,a])=>`<div class="sentence">${s}<input data-gap="${a}" placeholder="type one word"></div>`).join('')}</div><button class="btn" id="checkGap">Check</button><div class="feedback" id="gapFb"></div>`}
function listeningIntro(){return `<div class="grid3">${speakers.map((s,i)=>`<div class="card ${['lav','blue','mint'][i]}"><h2>${s.n}</h2><p>Predict: ART, MUSIC or FILM?</p><button class="btn teal" data-play="${i}">▶ Listen</button></div>`).join('')}</div><div class="card soft"><p class="prompt">First listening: choose the topic only. Second listening: listen for the reason.</p></div>`}
function listeningMatch(){return `<div class="grid3"><div class="card"><h2>A</h2><p>prefers the original story when it already works</p></div><div class="card"><h2>B</h2><p>likes changes in voice and arrangement</p></div><div class="card"><h2>C</h2><p>wants a recognisable original plus a new message</p></div></div><div class="card soft"><p class="prompt">Match each opinion to ART / MUSIC / FILM, then replay to check.</p>${speakers.map((s,i)=>`<button class="btn" data-play="${i}">▶ ${s.n}</button>`).join('')}</div>`}
function listeningTF(){const arr=[['Speaker A thinks special effects always improve a remake.',false],['Speaker B says a cover can change the mood.',true],['Speaker C wants the original to be completely unrecognisable.',false],['All three speakers think a remake should change something meaningful.',true]];return `<div class="grid2">${arr.map(([q,a],i)=>`<div class="card"><p class="prompt">${q}</p><button class="choice" data-tf="true" data-good="${a}" data-group="tf${i}">True</button> <button class="choice" data-tf="false" data-good="${a}" data-group="tf${i}">False</button><div class="feedback" id="tf${i}"></div></div>`).join('')}</div>`}
const sectionData={
warm:{k:'Lead-in · notice before naming',t:'Same idea, different version',l:'Start with what changes and what stays the same.',steps:[()=>`<div class="grid3"><div class="card lav"><h2>ART</h2><p>pose · colours · objects · setting · style</p></div><div class="card blue"><h2>MUSIC</h2><p>lyrics · melody · voice · rhythm · mood</p></div><div class="card mint"><h2>FILMS</h2><p>story · characters · actors · time · place</p></div></div><div class="card soft"><p class="prompt">Which world changes the most when it is remade: art, music or film?</p><p>Give one example and explain your choice.</p></div>`,()=>`<div class="grid2"><div class="card"><p class="bigquote">A remake is a new version of an existing work. It keeps a recognisable core but changes something meaningful.</p></div><div class="card mint"><h2>Keep / Change</h2><p><span class="tag">main idea</span><span class="tag">style</span><span class="tag">setting</span><span class="tag">audience</span><span class="tag">characters</span><span class="tag">sound</span></p><p class="prompt">Choose 2 things to keep and 2 to change.</p></div></div>`,()=>mcq('warmq','Which sentence best describes a remake?',['It repeats every detail exactly.','It keeps the core idea but changes some details.','It is always a copy of a film.','It must be more than ten years old.'],1)]},
vocab:{k:'Vocabulary · Quizlet-style stack',t:'Words in Context',l:'Core language for talking about remakes.',steps:[()=>`<div class="quizlet"><div class="counter" id="vcount"></div><div class="flash" id="flash"><div class="flashin"><div class="face"><div class="word" id="vword"></div><div class="mini">Click to flip</div></div><div class="face back"><div class="definition" id="vdef"></div><p id="vex"></p></div></div></div><div class="flashnav"><button class="btn ghost" data-v="-1">←</button><button class="btn teal" id="speakWord">🔊</button><button class="btn green" data-v="1">Know ✓</button><button class="btn orange" data-v="1">Repeat</button><button class="btn" data-v="1">→</button></div></div>`,()=>matchingTask(),()=>gapTask(),()=>mcq('vq','Which verb means “present an old idea in a new way”?',['update','reinterpret','audience','soundtrack'],1)]},
art:{k:'Art remakes · compare visually',t:'From Classic to Modern',l:'Compare an original work with a modern reinterpretation.',steps:[()=>`<div class="visual"><img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/Mona_Lisa.jpg" alt="Mona Lisa" onerror="this.parentElement.innerHTML='<div class=visualText>CLASSIC ART → MODERN REINTERPRETATION</div>'"></div><div class="grid2"><div class="card lav"><h2>What stays the same?</h2><p>subject · pose · composition · key objects</p></div><div class="card mint"><h2>What changes?</h2><p>colour · technique · mood · cultural references · audience</p></div></div>`,()=>`<div class="card soft"><p class="prompt">Complete the comparison aloud.</p><p class="bigquote">Both works show… / In the original… / In the remake… / The biggest change is… / This makes the new version feel…</p></div><div class="grid3"><div class="card"><b>Style</b><p>classic → pop / digital / street art</p></div><div class="card"><b>Mood</b><p>serious → playful / ironic / dramatic</p></div><div class="card"><b>Audience</b><p>museum visitors → modern mass audience</p></div></div>`,()=>mcq('aq','What usually makes a reinterpretation interesting?',['Changing everything so the original is unrecognisable.','Keeping a recognisable core while changing the style or message.','Copying the original exactly.','Removing the main subject.'],1)]},
music:{k:'Music remakes · old song, new sound',t:'New Versions',l:'Compare what a cover version keeps and changes.',steps:[()=>`<div class="visual"><div class="visualText">ORIGINAL SONG → COVER VERSION</div></div><div class="grid2"><div class="card blue"><h2>Listen for</h2><p><span class="tag">lyrics</span><span class="tag">melody</span><span class="tag">rhythm</span><span class="tag">mood</span><span class="tag">voice</span><span class="tag">arrangement</span></p></div><div class="card soft"><h2>Prediction</h2><p class="prompt">If the same song is slower, acoustic and sung by a different voice, how can the mood change?</p></div></div>`,()=>`<div class="card lav"><p class="bigquote">The melody is similar, but the arrangement is different. The original sounds ___, while the cover feels ___. I prefer ___ because ___.</p></div><div class="grid3"><div class="card"><b>Tempo</b><p>faster / slower</p></div><div class="card"><b>Voice</b><p>softer / stronger / rougher</p></div><div class="card"><b>Arrangement</b><p>acoustic / electronic / orchestral</p></div></div>`,()=>mcq('mq','What is a cover version?',['A song with no singer.','A new performance of an existing song.','Music written only for a film.','The first recording of a song.'],1)]},
film:{k:'Film remakes · same story, new film',t:'Same Story, Different Film',l:'Compare how filmmakers update a story for a new audience.',steps:[()=>`<div class="visual"><div class="visualText">CLASSIC FILM → MODERN REMAKE</div></div><div class="grid3"><div class="card"><b>Plot</b><p>same / simplified / changed</p></div><div class="card"><b>Setting</b><p>new time · new place</p></div><div class="card"><b>Style</b><p>acting · special effects · soundtrack</p></div></div>`,()=>`<div class="grid2"><div class="card mint"><h2>Keep it</h2><p>main plot · key character · famous scene · central conflict</p></div><div class="card lav"><h2>Update it</h2><p>setting · dialogue · actors · ending · special effects · soundtrack</p></div></div><div class="card soft"><p class="prompt">You are the director. Choose one classic film. What would you update for a modern audience?</p></div>`,()=>mcq('fq','A film keeps the same basic story but has new actors and a new style. It is…',['a sequel','a documentary','a remake','a trailer'],2)]},
listen:{k:'Listening · People Talk',t:'Three opinions about remakes',l:'Listen for the speaker’s attitude and reason.',steps:[()=>listeningIntro(),()=>listeningMatch(),()=>listeningTF()]},
discuss:{k:'Discussion · your opinions',t:'Original or Remake?',l:'Use the lesson vocabulary to support your opinion.',steps:[()=>`<div class="grid3"><div class="card lav"><h2>ART</h2><p class="prompt">Can a remake be better than a masterpiece?</p></div><div class="card blue"><h2>MUSIC</h2><p class="prompt">Should a cover sound close to the original?</p></div><div class="card mint"><h2>FILMS</h2><p class="prompt">Why remake a film that already works?</p></div></div>`,()=>`<div class="card soft"><h2>Opinion ladder</h2><p class="bigquote">I strongly prefer… / I tend to prefer… / It depends on… / I can see why people like… / For a modern audience…</p></div><div class="card"><p class="prompt">Use at least 4 target words: <span class="tag">original</span><span class="tag">version</span><span class="tag">style</span><span class="tag">audience</span><span class="tag">plot</span><span class="tag">soundtrack</span></p></div>`,()=>mcq('dq','Which sentence sounds most natural?',['I prefer the remake because its style is more modern.','I prefer remake because style more modern.','I am prefer the remake for modern style.','The remake prefer me more.'],0)]},
use:{k:'Use it · speak & write',t:'Create Your Own Remake',l:'Turn the vocabulary into productive language.',steps:[()=>`<div class="grid3"><div class="card lav"><h2>1. Choose</h2><p>a painting · a song · a film</p></div><div class="card blue"><h2>2. Keep</h2><p>the recognisable core</p></div><div class="card mint"><h2>3. Change</h2><p>style · setting · audience · mood</p></div></div><div class="card soft"><p class="prompt">60-second pitch: “I’d remake… I’d keep… I’d change… My version would be for… because…”</p></div>`,()=>`<div class="card"><h2>Mini writing</h2><p class="lead">Write 5–6 sentences comparing an original and a remake.</p><p class="bigquote">Both versions… However,… The original… whereas the remake… The biggest difference is… Overall, I prefer… because…</p></div>`,()=>mcq('uq','Choose the strongest comparison sentence.',['Both versions have a similar plot, but the remake updates the setting and soundtrack.','Both version same but new.','The remake is modern and original old.','Plot is similar because actors different.'],0)]},
game:{k:'Final retrieval · no notes',t:'Remake Challenge',l:'Mixed vocabulary and concept questions. Answer positions change.',steps:[()=>`<div id="gamebox"></div>`]},
review:{k:'Quick Review · previous lesson',t:'Style & Hair',l:'Fast retrieval before the new topic.',steps:[()=>`<div class="reviewGrid"><div class="card lav"><div class="reviewWord">Translate into English</div><p>пиджак · блузка · кардиган · шарф · пальто</p></div><div class="card mint"><div class="reviewWord">Complete</div><p>She ___ a new dress today. (wear)</p><p>He usually ___ jeans to school. (wear)</p></div><div class="card blue"><div class="reviewWord">Modern English</div><p>Explain: <b>a catch · red flag · give someone the ick · classy</b></p></div><div class="card soft"><div class="reviewWord">BY phrases</div><p>by heart · by accident · by chance · by the way · by hand</p></div></div>`,()=>mcq('rev','Which sentence is correct?',['She is wearing a blazer today.','She wearing a blazer today.','She wear a blazer today.','She is wear a blazer today.'],0)]}}
function buildMenus(){const side=document.getElementById('side'),cover=document.getElementById('coverMenu');side.innerHTML='';cover.innerHTML='';menu.forEach(([id,a,b])=>{const x=document.createElement('button');x.dataset.id=id;x.innerHTML=a+`<span class="small">${b}</span>`;x.onclick=()=>openSection(id);side.appendChild(x);const y=x.cloneNode(true);y.onclick=()=>openSection(id);cover.appendChild(y)});const r=document.createElement('button');r.className='reviewBtn';r.innerHTML='Quick Review<span class="small">Style & Hair</span>';r.onclick=()=>openSection('review');side.appendChild(r)}
function openSection(id,st=0){current=id;step=st;document.getElementById('cover').style.display='none';document.getElementById('lesson').style.display='block';render()}
function home(){document.getElementById('lesson').style.display='none';document.getElementById('cover').style.display='flex'}
function render(){const s=sectionData[current];document.getElementById('screenTitle').textContent=current==='review'?'Quick Review · Style & Hair':(menu.find(x=>x[0]===current)?.slice(1).join(' · ')||s.t);document.getElementById('kicker').textContent=s.k;document.getElementById('pageTitle').textContent=s.t;document.getElementById('pageLead').textContent=s.l;document.getElementById('workspace').innerHTML=s.steps[step]();document.querySelectorAll('.side button').forEach(b=>b.classList.toggle('active',b.dataset.id===current));document.getElementById('stepCount').textContent=`${step+1} / ${s.steps.length}`;document.getElementById('dots').textContent='● '.repeat(step+1)+'○ '.repeat(s.steps.length-step-1);document.getElementById('prevBtn').disabled=step===0;document.getElementById('nextBtn').disabled=step===s.steps.length-1;bindDynamic();if(current==='game')renderGame()}
function bindDynamic(){if(document.getElementById('flash')){document.getElementById('flash').onclick=()=>document.getElementById('flash').classList.toggle('flipped');renderVocabCard()}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{vIndex=(vIndex+Number(b.dataset.v)+vocab.length)%vocab.length;renderVocabCard()});const sw=document.getElementById('speakWord');if(sw)sw.onclick=()=>speak(vocab[vIndex][0])}
function renderVocabCard(){const w=vocab[vIndex];document.getElementById('vcount').textContent=`${vIndex+1} / ${vocab.length}`;document.getElementById('vword').textContent=w[0];document.getElementById('vdef').textContent=w[1];document.getElementById('vex').textContent=w[2];document.getElementById('flash').classList.remove('flipped')}
function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}}
const gameQs=[['A new version of an existing work is…',['an audience','a remake','a plot','a classic'],1],['Which word means “the first version”?',['original','modern','similar','audience'],0],['A new performance of an existing song is…',['a plot','a cover version','a sequel','a trailer'],1],['The main events of a story are the…',['style','soundtrack','plot','audience'],2],['To present an old idea in a new way = …',['reinterpret','repeat','delete','translate'],0],['The people who watch or listen are the…',['characters','audience','directors','versions'],1],['Which is the strongest comparison?',['Both versions have a similar plot, but the remake updates the setting.','Both version same.','Remake new, original old.','Plot same actors different.'],0]];
function renderGame(){const box=document.getElementById('gamebox');if(gameIndex>=gameQs.length){box.innerHTML=`<div class="card soft" style="text-align:center"><div class="gameScore">${gameScore} / ${gameQs.length}</div><h2>Challenge complete!</h2><button class="btn" id="againGame">Play again</button></div>`;document.getElementById('againGame').onclick=()=>{gameIndex=0;gameScore=0;renderGame()};return}const [q,opts,c]=gameQs[gameIndex];const order=opts.map((x,i)=>({x,i})).sort(()=>Math.random()-.5);box.innerHTML=`<div class="card lav"><div class="counter">Question ${gameIndex+1} / ${gameQs.length}</div><p class="prompt">${q}</p><div class="choicegrid">${order.map(o=>`<button class="choice" data-game-i="${o.i}" data-game-c="${c}">${o.x}</button>`).join('')}</div><div class="feedback" id="gameFb"></div></div>`}
document.addEventListener('click',e=>{const m=e.target.closest('[data-mcq]');if(m){const id=m.dataset.mcq,c=Number(m.dataset.c),i=Number(m.dataset.i);document.querySelectorAll(`[data-mcq="${id}"]`).forEach(x=>{x.disabled=true;if(Number(x.dataset.i)===c)x.classList.add('ok')});if(i!==c)m.classList.add('no');document.getElementById('fb-'+id).textContent=i===c?'Correct — explain why.':'Not quite. Look for the key meaning.';return}if(e.target.id==='checkMatch'){let ok=0;const keys=['change for a new form','people who watch or listen','main events of a story','music used in a film','an exceptionally good work'];document.querySelectorAll('[data-match]').forEach((s,i)=>{s.nextElementSibling.textContent=s.value===keys[i]?'✓':'✗';if(s.value===keys[i])ok++});e.target.textContent=`${ok} / 5 correct`;return}if(e.target.id==='checkGap'){let ok=0;document.querySelectorAll('[data-gap]').forEach(inp=>{const good=inp.value.trim().toLowerCase()===inp.dataset.gap;inp.style.borderColor=good?'#62a94b':'#d96f64';if(good)ok++});document.getElementById('gapFb').textContent=`${ok} / 5 correct`;return}const p=e.target.closest('[data-play]');if(p){speak(speakers[Number(p.dataset.play)].txt);return}const tf=e.target.closest('[data-tf]');if(tf){const selected=tf.dataset.tf==='true',good=tf.dataset.good==='true',g=tf.dataset.group;document.querySelectorAll(`[data-group="${g}"]`).forEach(b=>{b.disabled=true;if((b.dataset.tf==='true')===good)b.classList.add('ok')});if(selected!==good)tf.classList.add('no');document.getElementById(g).textContent=selected===good?'Correct.':'Check the highlighted answer.';return}const g=e.target.closest('[data-game-i]');if(g){const i=Number(g.dataset.gameI),c=Number(g.dataset.gameC);document.querySelectorAll('[data-game-i]').forEach(b=>{b.disabled=true;if(Number(b.dataset.gameI)===c)b.classList.add('ok')});if(i===c){gameScore++;document.getElementById('gameFb').textContent='Correct!'}else{g.classList.add('no');document.getElementById('gameFb').textContent='Not this one.'}setTimeout(()=>{gameIndex++;renderGame()},650)}});
document.getElementById('prevBtn').onclick=()=>{if(step>0){step--;render()}};document.getElementById('nextBtn').onclick=()=>{if(step<sectionData[current].steps.length-1){step++;render()}};document.getElementById('homeBtn').onclick=home;document.getElementById('coverReview').onclick=()=>openSection('review');buildMenus();
</script>
</body></html>
