<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Maya · 1C Remakes</title>
<style>
:root{--p:#5f45b8;--g:#3aa74a;--t:#1397a6;--ink:#182033;--line:#e3deea;--soft:#f7f6fb;--blue:#edf4ff;--mint:#eef9f1;--lav:#f3efff;--yellow:#fff6d9}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#faf5ff,#f4fbff 55%,#f3fbf5);color:var(--ink);overflow:hidden}button{font:inherit;cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:176px 1fr;grid-template-rows:44px 1fr}.top{grid-column:1/-1;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:4px 11px;gap:10px}.brand{font-size:17px;font-weight:950;color:var(--p)}.brand span{color:var(--g)}.topTitle{flex:1;text-align:center;font-size:13px;font-weight:900}.hub{font-size:10px;font-weight:850;text-decoration:none;color:#463576;border:1px solid #d6cbea;border-radius:9px;padding:6px 8px;background:#fff}.side{background:#fff;border-right:1px solid var(--line);padding:7px;overflow:auto}.side button{width:100%;border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 8px;margin:3px 0;text-align:left;font-weight:850;font-size:10.5px;line-height:1.15;color:#342a64}.side button small{display:block;font-size:8.5px;color:#777;margin-top:2px;font-weight:500}.side button.active{background:linear-gradient(90deg,#6550c2,#7d66cf);color:#fff}.side button.active small{color:#eee}.stage{padding:7px 10px;min-width:0;min-height:0}.panel{height:100%;background:rgba(255,255,255,.96);border:1px solid #ddd7e8;border-radius:17px;padding:9px 13px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 8px 24px rgba(70,52,103,.08)}.head{display:flex;gap:10px;align-items:flex-start}.headText{flex:1}.kicker{font-size:8.5px;font-weight:950;color:var(--t);letter-spacing:.08em;text-transform:uppercase}.head h1{font-size:20px;line-height:1;margin:2px 0 3px}.lead{font-size:11px;color:#626675;margin:0 0 5px}.count{font-size:10px;font-weight:900;color:var(--p)}.work{flex:1;min-height:0;overflow:auto;padding-right:3px}.footer{height:35px;border-top:1px solid #ece8f2;margin-top:4px;padding-top:4px;display:flex;align-items:center;justify-content:space-between}.btn{border:0;border-radius:8px;padding:6px 9px;background:var(--p);color:#fff;font-size:10px;font-weight:850}.btn.ghost{background:#fff;color:#49357f;border:1px solid #cabee7}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.card{border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px}.lav{background:var(--lav)}.mint{background:var(--mint)}.blue{background:var(--blue)}.yellow{background:var(--yellow)}.prompt{font-size:13px;font-weight:900;margin:3px 0 5px}.mini{font-size:9.5px;color:#696577}.photoGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.look{height:140px;border-radius:11px;overflow:hidden;background:#eee;position:relative}.look img{width:100%;height:100%;object-fit:cover}.look b{position:absolute;left:5px;bottom:5px;background:rgba(25,25,40,.72);color:#fff;border-radius:999px;padding:3px 6px;font-size:8px}.chips{display:flex;gap:4px;flex-wrap:wrap}.chip{background:#fff;border:1px solid #ddd4ea;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:800}.reveal{display:none;margin-top:6px}.reveal.open{display:block}.pairGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:5px}.pic{height:215px;border-radius:11px;overflow:hidden;border:1px solid #ddd;background:#eee;position:relative}.pic img{width:100%;height:100%;object-fit:cover}.tag{position:absolute;left:5px;bottom:5px;background:rgba(22,25,39,.74);color:#fff;border-radius:999px;padding:3px 6px;font-size:8px;font-weight:900}.grammar2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gbox{background:#eaf1ff;border:1px solid #d3def8;border-radius:13px;padding:9px 11px}.gbox h2{font-size:14px;text-align:center;margin:0 0 5px}.example{font-size:14px;font-weight:850;text-align:center;margin:5px 0}.markers{font-size:10px;font-weight:900;color:#1b568e;line-height:1.5}.formula{font-size:11px;line-height:1.52}.contrast{display:grid;grid-template-columns:1fr 32px 1fr;gap:7px;align-items:center}.vs{text-align:center;font-weight:950;color:var(--p);font-size:16px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:5px}.choice{border:1px solid #d8d1e5;background:#fff;border-radius:8px;padding:7px;text-align:left;font-size:10px;font-weight:750}.choice.ok{background:#e9f7e8;border-color:#7dbd73}.choice.no{background:#fff0ee;border-color:#d98780}.feedback{min-height:14px;font-size:9px;font-weight:900;margin-top:3px}.listen{display:grid;grid-template-columns:1.05fr .95fr;gap:8px}.preps{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.prep{background:#fff;border:1px solid #ddd6e8;border-radius:9px;padding:6px;text-align:center;font-size:9px;font-weight:850}.speaking{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.speak{border:1px solid var(--line);border-radius:11px;padding:8px;background:#fff}.speak h3{font-size:11px;margin:0 0 3px}.speak p{font-size:10px;line-height:1.35;margin:0}.dots{font-size:9px;color:#7b718f;font-weight:900}@media(max-width:850px){.app{grid-template-columns:145px 1fr}.photoGrid{grid-template-columns:repeat(3,1fr)}.look{height:115px}.pairGrid{grid-template-columns:1fr}.pic{height:180px}.grid3,.speaking{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">1C <span>REMAKES</span></div><div class="topTitle">Clothes → Remakes → Grammar</div><a class="hub" href="index.html">← Maya Hub</a></header>
<nav class="side" id="side"></nav>
<main class="stage"><section class="panel"><div class="head"><div class="headText"><div class="kicker" id="kicker"></div><h1 id="title"></h1><p class="lead" id="lead"></p></div><div class="count" id="count"></div></div><div class="work" id="work"></div><div class="footer"><button class="btn ghost" id="prev">← Previous</button><div class="dots" id="dots"></div><button class="btn" id="next">Next →</button></div></section></main>
</div>
<script>
const sections=[
{id:'clothes',label:'1. Clothes Sprint',sub:'Use what you already know'},
{id:'remakes',label:'2. Two Remakes',sub:'Look before grammar'},
{id:'cont',label:'3. Present Continuous',sub:'What is happening now?'},
{id:'contrast',label:'4. Simple vs Continuous',sub:'usual vs now'},
{id:'practice',label:'5. Quick Practice',sub:'Choose the tense'},
{id:'listen',label:'6. Vermeer',sub:'The Milkmaid'},
{id:'place',label:'7. Place + Compare',sub:'Describe the remake'},
{id:'finish',label:'8. Final Speaking',sub:'Original vs remake'}];
const data={
clothes:{k:'REVISION · CLOTHES',t:'What are they wearing?',l:'First speak from memory. Open the clothes bank only if you get stuck.',steps:[
()=>`<div class="photoGrid"><div class="look"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=600&q=80"><b>LOOK 1</b></div><div class="look"><img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=600&q=80"><b>LOOK 2</b></div><div class="look"><img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=600&q=80"><b>LOOK 3</b></div><div class="look"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&q=80"><b>LOOK 4</b></div><div class="look"><img src="https://images.unsplash.com/photo-1485968579580-b6d095142e6e?auto=format&fit=crop&w=600&q=80"><b>LOOK 5</b></div></div><div class="card yellow"><p class="prompt">Describe the clothes. Add colour + adjective.</p><div class="chips"><span class="chip">She’s wearing…</span><span class="chip">He’s wearing…</span><span class="chip">The outfit looks…</span></div><button class="btn ghost" id="bankBtn">STUCK? OPEN CLOTHES BANK</button><div class="reveal" id="bank"><div class="chips"><span class="chip">blouse</span><span class="chip">cardigan</span><span class="chip">coat</span><span class="chip">dress</span><span class="chip">hoodie</span><span class="chip">jacket</span><span class="chip">jeans</span><span class="chip">skirt</span><span class="chip">sweater</span><span class="chip">trousers</span><span class="chip">T-shirt</span><span class="chip">boots</span><span class="chip">trainers</span><span class="chip">scarf</span><span class="chip">hat</span><span class="chip">belt</span><span class="chip">necklace</span><span class="chip">bracelet</span><span class="chip">earrings</span><span class="chip">ring</span></div></div></div>`,
()=>`<div class="grid2"><div class="card lav"><p class="prompt">20-SECOND CHALLENGE</p><p>Choose one person. Describe the clothes. Your teacher guesses the photo.</p></div><div class="card mint"><p class="prompt">UPGRADE</p><p>Use: <b>oversized, fitted, loose, smart, casual, striped, plain, bright, neutral</b>.</p></div></div><div class="card"><p class="prompt">Notice what you are already saying:</p><p class="example">She <u>is wearing</u> a beige jacket. · He <u>is carrying</u> a black bag.</p></div>`]},
remakes:{k:'1C REMAKES · VISUAL CONTEXT',t:'Original → modern remake',l:'Look first. Notice clothes, actions, similarities and differences.',steps:[
()=>`<div class="pairGrid"><div class="card"><p class="prompt">PAIR A · AMERICAN GOTHIC</p><div class="pair"><div class="pic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Grant%20DeVolson%20Wood%20-%20American%20Gothic.jpg"><span class="tag">ORIGINAL</span></div><div class="pic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/American%20Gothic%20Dress-Up.jpg"><span class="tag">REMAKE</span></div></div></div><div class="card"><p class="prompt">PAIR B · MONA LISA</p><div class="pair"><div class="pic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Mona%20Lisa-restored.jpg"><span class="tag">ORIGINAL</span></div><div class="pic"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=700&q=80"><span class="tag">MODERN PHOTO</span></div></div></div></div>`,
()=>`<div class="grid2"><div class="card blue"><p class="prompt">WHAT ARE THEY WEARING?</p><p>Use full sentences: <b>She is wearing… / He is wearing…</b></p></div><div class="card mint"><p class="prompt">WHAT ARE THEY DOING?</p><p>standing · sitting · holding · looking · smiling · posing</p></div></div><div class="card yellow"><p class="prompt">Find 3 things that are the SAME and 3 things that are DIFFERENT.</p></div>`]},
cont:{k:'GRAMMAR · DISCOVERY',t:'Present Continuous',l:'Use it for what is happening now / around now and for describing a picture.',steps:[
()=>`<div class="grid3"><div class="card lav"><p class="prompt">LOOK</p><p>They <b>are standing</b> together.</p></div><div class="card blue"><p class="prompt">CLOTHES</p><p>She <b>is wearing</b> a dress.</p></div><div class="card mint"><p class="prompt">ACTION</p><p>He <b>is holding</b> a pitchfork.</p></div></div><div class="card yellow"><p class="prompt">Build the rule:</p><p class="example">subject + <span style="color:#5f45b8">am / is / are</span> + verb<span style="color:#3aa74a">-ing</span></p></div>`,
()=>`<div class="gbox"><h2>PRESENT CONTINUOUS · FORM</h2><div class="formula"><b>+</b> I am wearing / she is wearing / they are wearing<br><b>–</b> I am not wearing / he isn’t wearing / we aren’t wearing<br><b>?</b> Are they wearing matching clothes? · Is she holding a bag?</div><div class="markers">now · right now · at the moment · today · this week · Look! · Listen!</div></div><div class="card"><p class="prompt">Picture rule:</p><p><b>There is / there are</b> = what is in the picture. <b>Present Continuous</b> = what people are doing.</p></div>`]},
contrast:{k:'GRAMMAR · CONTRAST',t:'Present Simple vs Present Continuous',l:'Usual style / habits vs now / today / this week.',steps:[
()=>`<div class="grammar2"><div class="gbox"><h2>PRESENT SIMPLE</h2><div class="example">She usually <u>wears</u> jeans.</div><div class="markers">usually · always · often · sometimes · never · every day</div><div class="formula"><b>+</b> I/you/we/they + V · he/she/it + V-s<br><b>–</b> don’t / doesn’t + V<br><b>?</b> Do / Does + subject + V?<br><span class="mini"><b>State verbs:</b> know, like, love, want, need, belong → normally not Continuous.</span></div></div><div class="gbox"><h2>PRESENT CONTINUOUS</h2><div class="example">Today she <u>is wearing</u> a dress.</div><div class="markers">now · at the moment · today · this week · Look! · Listen!</div><div class="formula"><b>+</b> am/is/are + V-ing<br><b>–</b> am/is/are + not + V-ing<br><b>?</b> Am/Is/Are + subject + V-ing?</div></div></div>`,
()=>`<div class="contrast"><div class="card lav"><p class="prompt">USUAL</p><p>He <b>wears</b> trainers to school.<br>She <b>doesn’t wear</b> jewellery every day.</p></div><div class="vs">VS</div><div class="card mint"><p class="prompt">NOW / TODAY</p><p>He <b>is wearing</b> boots today.<br>She <b>is wearing</b> a necklace now.</p></div></div><div class="card yellow"><p class="prompt">Say 3 pairs about yourself:</p><p>I usually wear… but today I’m wearing…</p></div>`]},
practice:{k:'CONTROLLED PRACTICE',t:'Simple or Continuous?',l:'Choose the correct form. Answer positions change every time.',steps:[()=>quizHtml()]},
listen:{k:'VERMEER · THE MILKMAID',t:'Look, predict, listen',l:'Use the picture language from 1C.',steps:[
()=>`<div class="listen"><div class="card"><div class="pic" style="height:245px"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Vermeer%20-%20The%20Milkmaid.jpg"><span class="tag">THE MILKMAID</span></div></div><div class="card blue"><p class="prompt">Before listening</p><p>What is the woman doing? What is she wearing? What objects can you see?</p><button class="btn" id="playListen">▶ LISTEN</button> <button class="btn ghost" id="scriptBtn">SHOW SCRIPT</button><div class="reveal" id="script"><p class="mini">Johannes Vermeer painted scenes from everyday life. In The Milkmaid, a woman is standing beside a table and pouring milk. She is wearing an apron. Bread and other objects are lying on the table, and light is coming through a window. The picture feels quiet and very real.</p></div></div></div>`,
()=>`<div class="grid2"><div class="card lav"><p class="prompt">LISTEN AGAIN</p><p>Note 3 actions: standing · pouring · coming through.</p></div><div class="card mint"><p class="prompt">WHY CONTINUOUS?</p><p>Because we describe the scene as if we are looking through a window at what is happening.</p></div></div>`]},
place:{k:'VOCABULARY · PLACE',t:'Where is everything?',l:'Use place phrases + Present Continuous.',steps:[
()=>`<div class="preps"><div class="prep">in the background</div><div class="prep">in the foreground</div><div class="prep">on the left</div><div class="prep">on the right</div><div class="prep">next to</div><div class="prep">behind</div><div class="prep">in front of</div><div class="prep">between</div></div><div class="card yellow"><p class="prompt">Build 4 sentences:</p><p>On the right, there is… · Next to him, there is… · They are standing… · In the background, you can see…</p></div>`,
()=>`<div class="pairGrid"><div class="card"><div class="pair"><div class="pic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Grant%20DeVolson%20Wood%20-%20American%20Gothic.jpg"><span class="tag">ORIGINAL</span></div><div class="pic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/American%20Gothic%20Dress-Up.jpg"><span class="tag">REMAKE</span></div></div></div><div class="card blue"><p class="prompt">FIND & SAY</p><p>3 similarities<br>3 differences<br>2 clothes sentences<br>2 action sentences<br>2 place phrases</p></div></div>`]},
finish:{k:'SPEAKING · COMMUNICATION',t:'Describe. Compare. Decide.',l:'Use the exact language of 1C.',steps:[
()=>`<div class="speaking"><div class="speak"><h3>1 · DESCRIBE</h3><p>There is / there are…<br>He is wearing…<br>She is holding…<br>They are standing…</p></div><div class="speak"><h3>2 · LOCATE</h3><p>On the left…<br>In the background…<br>Next to…<br>Behind…</p></div><div class="speak"><h3>3 · COMPARE</h3><p>Both pictures…<br>In the original…<br>In the remake…<br>The biggest difference is…</p></div></div><div class="card yellow"><p class="prompt">60-SECOND CHALLENGE</p><p>Use at least <b>5 clothes words + 4 Present Continuous forms + 2 prepositions</b>.</p></div>`]}
};
const quiz=[
['She ___ dresses on special occasions.',['likes','is liking'],0],
['He ___ a hat when it is sunny.',['usually wears','is usually wearing'],0],
['Look! They ___ matching outfits today.',['wear','are wearing'],1],
['She ___ on different outfits right now.',['tries','is trying'],1],
['He ___ sweaters in winter.',['doesn’t wear','isn’t wearing'],0],
['She ___ her new scarf today.',['wears','is wearing'],1],
['They ___ clothes online quite often.',['buy','are buying'],0],
['At the moment he ___ a new jacket.',['tries on','is trying on'],1],
['My sister ___ jewellery every day.',['doesn’t wear','isn’t wearing'],0],
['This week Maya ___ more English than usual.',['practises','is practising'],1]
];
let current=0,step=0;
function quizHtml(){return `<div class="grid2">${quiz.map((q,i)=>{const o=q[1].map((x,j)=>({x,j})).sort(()=>Math.random()-.5);return `<div class="card"><p class="prompt" style="font-size:11px">${i+1}. ${q[0]}</p><div class="choices">${o.map(a=>`<button class="choice" data-q="${i}" data-i="${a.j}" data-c="${q[2]}">${a.x}</button>`).join('')}</div><div class="feedback" id="qfb${i}"></div></div>`}).join('')}</div>`}
function makeSide(){const s=document.getElementById('side');s.innerHTML='';sections.forEach((x,i)=>{const b=document.createElement('button');b.innerHTML=`${x.label}<small>${x.sub}</small>`;b.onclick=()=>{current=i;step=0;render()};s.appendChild(b)})}
function render(){const sec=sections[current],d=data[sec.id];document.getElementById('kicker').textContent=d.k;document.getElementById('title').textContent=d.t;document.getElementById('lead').textContent=d.l;document.getElementById('work').innerHTML=d.steps[step]();document.getElementById('count').textContent=`${step+1}/${d.steps.length}`;document.getElementById('dots').textContent='● '.repeat(step+1)+'○ '.repeat(d.steps.length-step-1);document.querySelectorAll('.side button').forEach((b,i)=>b.classList.toggle('active',i===current));document.getElementById('prev').disabled=step===0;document.getElementById('next').disabled=step===d.steps.length-1;bind()}
function say(text){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.88;speechSynthesis.speak(u)}
function bind(){const b=document.getElementById('bankBtn');if(b)b.onclick=()=>document.getElementById('bank').classList.toggle('open');const p=document.getElementById('playListen');if(p)p.onclick=()=>say('Johannes Vermeer painted scenes from everyday life. In The Milkmaid, a woman is standing beside a table and pouring milk. She is wearing an apron. Bread and other objects are lying on the table, and light is coming through a window. The picture feels quiet and very real.');const s=document.getElementById('scriptBtn');if(s)s.onclick=()=>document.getElementById('script').classList.toggle('open')}
document.addEventListener('click',e=>{const c=e.target.closest('[data-q]');if(!c)return;const q=c.dataset.q,good=Number(c.dataset.c),picked=Number(c.dataset.i);document.querySelectorAll(`[data-q="${q}"]`).forEach(x=>{x.disabled=true;if(Number(x.dataset.i)===good)x.classList.add('ok')});if(picked!==good)c.classList.add('no');document.getElementById('qfb'+q).textContent=picked===good?'✓ Correct':'Check the time marker.'});
document.getElementById('prev').onclick=()=>{if(step>0){step--;render()}};
document.getElementById('next').onclick=()=>{const d=data[sections[current].id];if(step<d.steps.length-1){step++;render()}};
makeSide();render();
</script>
</body>
</html>
