<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Maya · 1C Remakes</title>
<style>
:root{--purple:#5f45b8;--green:#39a84a;--teal:#1199a9;--blue:#dfe9ff;--ink:#172033;--muted:#6d7282;--line:#e4dfec;--paper:#fff;--soft:#f8f7fb;--pink:#f8eefa;--yellow:#fff6d8}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:linear-gradient(135deg,#f9f4ff,#f4fbff 55%,#f2fbf5);overflow:hidden}button,input{font:inherit}.app{height:100vh;display:grid;grid-template-columns:178px 1fr;grid-template-rows:46px 1fr}.top{grid-column:1/-1;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:5px 12px}.logo{font-weight:950;color:var(--purple);font-size:18px}.logo span{color:var(--green)}.topTitle{flex:1;text-align:center;font-weight:900;font-size:15px}.navlink{border:1px solid #d9cfef;background:#fff;border-radius:9px;padding:6px 9px;text-decoration:none;color:#4a367f;font-weight:800;font-size:11px}.side{background:rgba(255,255,255,.9);border-right:1px solid var(--line);padding:7px;overflow:auto}.side button{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 8px;margin:3px 0;text-align:left;font-size:11px;font-weight:850;color:#332b62;line-height:1.18}.side button small{display:block;font-size:9px;color:#777284;font-weight:500;margin-top:2px}.side button.active{background:linear-gradient(90deg,#6650c3,#7a62cf);color:#fff;border-color:#6650c3}.side button.active small{color:#eeeaff}.stage{min-width:0;min-height:0;padding:8px 11px}.panel{height:100%;background:rgba(255,255,255,.94);border:1px solid #ded7ea;border-radius:18px;box-shadow:0 10px 25px rgba(73,54,111,.09);padding:10px 14px;display:flex;flex-direction:column;overflow:hidden}.head{display:flex;align-items:flex-start;gap:10px}.headText{flex:1}.kicker{font-size:9px;font-weight:950;letter-spacing:.08em;color:var(--teal);text-transform:uppercase}.head h1{font-size:22px;line-height:1;margin:3px 0 4px}.lead{font-size:12px;color:#5d6170;margin:0 0 6px;line-height:1.25}.count{font-size:11px;font-weight:900;color:var(--purple)}.work{flex:1;min-height:0;overflow:auto;padding-right:4px}.footer{height:38px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ece8f1;margin-top:5px;padding-top:5px}.btn{border:0;border-radius:9px;padding:7px 10px;background:var(--purple);color:#fff;font-weight:850;font-size:11px}.btn.ghost{background:#fff;color:#4b3783;border:1px solid #cabee7}.btn.teal{background:var(--teal)}.btn.green{background:var(--green)}.btn.orange{background:#e89424}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.card{border:1px solid var(--line);background:#fff;border-radius:13px;padding:9px}.lav{background:#f3efff}.mint{background:#eef9f1}.blue{background:#eef5ff}.yellow{background:var(--yellow)}.prompt{font-size:14px;font-weight:900;margin:4px 0 6px}.mini{font-size:10px;color:#696474}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{border:1px solid #ddd4eb;background:#fff;border-radius:999px;padding:4px 7px;font-size:10px;font-weight:800}.photoGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.look{height:152px;border-radius:12px;overflow:hidden;position:relative;background:#eee}.look img{width:100%;height:100%;object-fit:cover;display:block}.look b{position:absolute;left:6px;bottom:6px;background:rgba(20,20,32,.72);color:#fff;border-radius:999px;padding:3px 6px;font-size:9px}.reveal{display:none;margin-top:6px}.reveal.open{display:block}.remakeGrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:6px}.artpic{height:230px;border-radius:12px;overflow:hidden;border:1px solid #ddd;background:#eee;position:relative}.artpic img{width:100%;height:100%;object-fit:cover;display:block}.artpic .tag{position:absolute;left:6px;bottom:6px;background:rgba(17,23,35,.72);color:#fff;border-radius:999px;padding:4px 7px;font-size:9px;font-weight:900}.grammar2{display:grid;grid-template-columns:1fr 1fr;gap:9px}.grammarBox{border-radius:14px;padding:10px 12px;background:#e9f0ff;border:1px solid #d2ddf9}.grammarBox h2{font-size:15px;margin:0 0 5px;text-align:center}.example{font-size:15px;font-weight:850;text-align:center;margin:6px 0}.marker{font-size:11px;font-weight:900;color:#14518f;line-height:1.5}.formula{font-size:12px;line-height:1.55}.contrast{display:grid;grid-template-columns:1fr 34px 1fr;align-items:center;gap:7px}.vs{font-size:18px;font-weight:950;text-align:center;color:var(--purple)}.sentence{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;margin:5px 0;font-size:11px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:6px}.choice{border:1px solid #d7d0e4;background:#fff;border-radius:9px;padding:8px;text-align:left;font-size:11px;font-weight:750}.choice.ok{background:#e9f7e8;border-color:#7dbd73}.choice.no{background:#fff0ee;border-color:#d98780}.feedback{min-height:16px;font-size:10px;font-weight:900;margin-top:4px}.soundRow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sound{border-radius:14px;padding:11px;background:#f4efff;border:1px solid #ded2f4}.sound strong{font-size:24px;color:var(--purple)}.sound p{font-size:11px;line-height:1.45}.listenBox{display:grid;grid-template-columns:1.1fr .9fr;gap:9px}.bigquote{font-size:14px;line-height:1.45;font-weight:750}.preps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.prep{background:#fff;border:1px solid #ddd6e8;border-radius:10px;padding:7px;text-align:center;font-weight:850;font-size:10px}.speaking{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.speakCard{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff}.speakCard h3{font-size:12px;margin:0 0 4px}.speakCard p{font-size:11px;line-height:1.4;margin:0}.dots{font-size:10px;color:#7c718f;font-weight:900}@media(max-width:850px){.app{grid-template-columns:145px 1fr}.photoGrid{grid-template-columns:repeat(3,1fr)}.look{height:120px}.remakeGrid{grid-template-columns:1fr}.artpic{height:190px}.grid3,.speaking{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="logo">1C <span>REMAKES</span></div><div class="topTitle" id="topTitle">Clothes → Remakes → Grammar</div><a class="navlink" href="index.html">← Maya Hub</a></header>
<nav class="side" id="side"></nav>
<main class="stage"><section class="panel"><div class="head"><div class="headText"><div class="kicker" id="kicker"></div><h1 id="title"></h1><p class="lead" id="lead"></p></div><div class="count" id="count"></div></div><div class="work" id="work"></div><div class="footer"><button class="btn ghost" id="prev">← Previous</button><div class="dots" id="dots"></div><button class="btn" id="next">Next →</button></div></section></main>
</div>
<script>
const sections=[
{id:'clothes',label:'1. Clothes Sprint',sub:'Use what you already know'},
{id:'remakes',label:'2. Two Remakes',sub:'Look before grammar'},
{id:'pron',label:'3. Pronunciation',sub:'/ə/ and /ɜː/'},
{id:'cont',label:'4. Present Continuous',sub:'What is happening now?'},
{id:'contrast',label:'5. Simple vs Continuous',sub:'usual vs now'},
{id:'practice',label:'6. Quick Practice',sub:'Choose the tense'},
{id:'listen',label:'7. Vermeer Mini Listening',sub:'The Milkmaid'},
{id:'place',label:'8. Place + Compare',sub:'Describe the remake'},
{id:'finish',label:'9. Final Speaking',sub:'Original vs remake'}];
const data={
clothes:{k:'REVISION · CLOTHES',t:'What are they wearing?',l:'Maya already knows the clothes. First: speak from memory. Then open the word bank only if you get stuck.',steps:[()=>`<div class="photoGrid"><div class="look"><img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?auto=format&fit=crop&w=600&q=80"><b>LOOK 1</b></div><div class="look"><img src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?auto=format&fit=crop&w=600&q=80"><b>LOOK 2</b></div><div class="look"><img src="https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=600&q=80"><b>LOOK 3</b></div><div class="look"><img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=600&q=80"><b>LOOK 4</b></div><div class="look"><img src="https://images.unsplash.com/photo-1485968579580-b6d095142e6e?auto=format&fit=crop&w=600&q=80"><b>LOOK 5</b></div></div><div class="card yellow"><p class="prompt">Say 2–3 sentences for each person.</p><div class="chips"><span class="chip">She’s wearing…</span><span class="chip">He’s got…</span><span class="chip">The outfit looks…</span><span class="chip">Add colour + adjective</span></div><button class="btn ghost" id="bankBtn">STUCK? OPEN CLOTHES BANK</button><div class="reveal" id="bank"><div class="chips"><span class="chip">blouse</span><span class="chip">cardigan</span><span class="chip">coat</span><span class="chip">dress</span><span class="chip">hoodie</span><span class="chip">jacket</span><span class="chip">jeans</span><span class="chip">skirt</span><span class="chip">sweater</span><span class="chip">trousers</span><span class="chip">T-shirt</span><span class="chip">boots</span><span class="chip">trainers</span><span class="chip">scarf</span><span class="chip">hat</span><span class="chip">belt</span><span class="chip">necklace</span><span class="chip">bracelet</span><span class="chip">earrings</span><span class="chip">ring</span></div></div></div>`,()=>`<div class="grid2"><div class="card lav"><p class="prompt">FAST CHALLENGE A</p><p>Choose one person. Describe the clothes in 20 seconds. Your teacher guesses the photo.</p></div><div class="card mint"><p class="prompt">FAST CHALLENGE B</p><p>Upgrade 3 nouns with adjectives: <b>oversized, fitted, loose, smart, casual, striped, plain, bright, neutral</b>.</p></div></div><div class="card"><p class="prompt">Notice the grammar you are already using:</p><p class="example">She <u>is wearing</u> a beige jacket. · He <u>is carrying</u> a black bag.</p></div>`]},
remakes:{k:'1C REMAKES · VISUAL CONTEXT',t:'Original → modern remake',l:'Look at the two pairs. Don’t explain the grammar yet. Just notice clothes, actions and similarities.',steps:[()=>`<div class="remakeGrid"><div class="card"><h3 style="margin:0 0 6px;font-size:13px">PAIR A · AMERICAN GOTHIC</h3><div class="pair"><div class="artpic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Grant%20DeVolson%20Wood%20-%20American%20Gothic.jpg"><span class="tag">ORIGINAL</span></div><div class="artpic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/American%20Gothic%20Dress-Up.jpg"><span class="tag">REMAKE PHOTO</span></div></div></div><div class="card"><h3 style="margin:0 0 6px;font-size:13px">PAIR B · MONA LISA</h3><div class="pair"><div class="artpic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Mona%20Lisa-restored.jpg"><span class="tag">ORIGINAL</span></div><div class="artpic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Carnival%20Rio%20Mona%20Lisa%20costume.jpg"><span class="tag">REMAKE PHOTO</span></div></div></div></div>`,()=>`<div class="grid2"><div class="card blue"><p class="prompt">WHAT ARE THEY WEARING?</p><p>Use the clothes vocabulary from the previous screen.</p><p class="mini">Aim for full sentences: <b>She is wearing… / He is wearing…</b></p></div><div class="card mint"><p class="prompt">WHAT ARE THEY DOING?</p><p>standing · sitting · holding · looking · smiling · posing</p><p class="mini">What verb form keeps appearing?</p></div></div><div class="card yellow"><p class="prompt">Find 3 things that are the SAME and 3 things that are DIFFERENT in one pair.</p></div>`]},
pron:{k:'PRONUNCIATION · SHORT FOCUS',t:'/ə/ or /ɜː/?',l:'A very short pronunciation stop from 1C — then straight back to grammar.',steps:[()=>`<div class="soundRow"><div class="sound"><strong>/ə/</strong><p>short + unstressed</p><div class="chips"><span class="chip">painter</span><span class="chip">photograph</span><span class="chip">picture</span><span class="chip">attractive</span></div><button class="btn teal" data-say="painter, photograph, picture, attractive">▶ HEAR</button></div><div class="sound"><strong>/ɜː/</strong><p>long + stressed</p><div class="chips"><span class="chip">her</span><span class="chip">first</span><span class="chip">prefer</span><span class="chip">curly</span><span class="chip">work</span></div><button class="btn teal" data-say="her, first, prefer, curly, work">▶ HEAR</button></div></div><div class="card yellow"><p class="prompt">Quick: Which sound is only in unstressed syllables?</p><button class="choice" data-one="pron" data-answer="yes">/ə/</button> <button class="choice" data-one="pron" data-answer="no">/ɜː/</button><div class="feedback" id="fb-pron"></div></div>`]},
cont:{k:'GRAMMAR · DISCOVERY',t:'Present Continuous',l:'Use it for what is happening now / around now — and for describing what is happening in a picture.',steps:[()=>`<div class="grid3"><div class="card lav"><p class="prompt">LOOK AT THE REMAKE</p><p>They <b>are standing</b> together.</p></div><div class="card blue"><p class="prompt">CLOTHES</p><p>She <b>is wearing</b> a dress.</p></div><div class="card mint"><p class="prompt">ACTION</p><p>He <b>is holding</b> a pitchfork.</p></div></div><div class="card yellow"><p class="prompt">Build the rule:</p><p class="example">subject + <span style="color:#5f45b8">am / is / are</span> + verb<span style="color:#39a84a">-ing</span></p></div>`,()=>`<div class="grammarBox"><h2>PRESENT CONTINUOUS · FORM</h2><div class="formula"><b>+</b> I <b>am wearing</b> / she <b>is wearing</b> / they <b>are wearing</b><br><b>–</b> I <b>am not wearing</b> / he <b>isn’t wearing</b> / we <b>aren’t wearing</b><br><b>?</b> <b>Are</b> they <b>wearing</b> matching clothes? · <b>Is</b> she <b>holding</b> a bag?</div><div class="marker">now · right now · at the moment · today · this week · Look! · Listen!</div></div><div class="card"><p class="prompt">Picture rule:</p><p><b>There is / there are</b> = what is in the picture. <b>Present Continuous</b> = what people are doing.</p></div>`]},
contrast:{k:'GRAMMAR · CONTRAST',t:'Present Simple vs Present Continuous',l:'Exactly the contrast Maya needs: usual style / habits vs now / today / this week.',steps:[()=>`<div class="grammar2"><div class="grammarBox"><h2>PRESENT SIMPLE</h2><div class="example">She usually <u>wears</u> jeans.</div><div class="marker">usually · always · often · sometimes · never · every day · on Mondays</div><div class="formula"><b>+</b> I/you/we/they + V<br>he/she/it + V-s<br><b>–</b> don’t / doesn’t + V<br><b>?</b> Do / Does + subject + V?</div></div><div class="grammarBox"><h2>PRESENT CONTINUOUS</h2><div class="example">Today she <u>is wearing</u> a dress.</div><div class="marker">now · at the moment · today · this week · Look! · Listen!</div><div class="formula"><b>+</b> am/is/are + V-ing<br><b>–</b> am/is/are + not + V-ing<br><b>?</b> Am/Is/Are + subject + V-ing?</div></div></div>`,()=>`<div class="contrast"><div class="card lav"><p class="prompt">USUAL</p><p>He <b>wears</b> trainers to school.</p><p>She <b>doesn’t wear</b> jewellery every day.</p></div><div class="vs">VS</div><div class="card mint"><p class="prompt">NOW / TODAY</p><p>He <b>is wearing</b> boots today.</p><p>She <b>is wearing</b> a necklace now.</p></div></div><div class="card yellow"><p class="prompt">Say 3 pairs about yourself:</p><p>I usually wear… but today I’m wearing…</p></div>`]},
practice:{k:'CONTROLLED PRACTICE',t:'Simple or Continuous?',l:'Choose the correct form. Answer positions are shuffled every time.',steps:[()=>quizHtml()]},
listen:{k:'LISTENING · VERMEER',t:'The Milkmaid — listen for the picture',l:'A short teacher-made listening based on the 1C context. First predict, then listen and check.',steps:[()=>`<div class="listenBox"><div class="card"><div class="artpic" style="height:255px"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/The%20Milkmaid%20by%20Johannes%20Vermeer.jpg"><span class="tag">THE MILKMAID</span></div></div><div class="card blue"><p class="prompt">Before listening</p><p>What is the woman doing? What is she wearing? What objects can you see?</p><button class="btn teal" id="playListen">▶ LISTEN</button><button class="btn ghost" id="scriptBtn">SHOW SCRIPT</button><div class="reveal" id="script"><p class="mini">Johannes Vermeer painted scenes from everyday life. In The Milkmaid, a woman is standing beside a table and pouring milk. She is wearing an apron. Bread and other objects are lying on the table, and light is coming through a window. The picture feels quiet and very real.</p></div></div></div>`,()=>`<div class="grid2"><div class="card lav"><p class="prompt">LISTEN AGAIN: note 3 actions</p><p>___ is standing · ___ is pouring · light is ___</p></div><div class="card mint"><p class="prompt">WHY CONTINUOUS?</p><p>Because we describe the scene as if we are looking through a window at what is happening.</p></div></div>`]},
place:{k:'VOCABULARY · PREPOSITIONS OF PLACE',t:'Where is everything?',l:'Use place phrases + Present Continuous to describe a picture clearly.',steps:[()=>`<div class="preps"><div class="prep">in the background</div><div class="prep">in the foreground</div><div class="prep">on the left</div><div class="prep">on the right</div><div class="prep">next to</div><div class="prep">behind</div><div class="prep">in front of</div><div class="prep">between</div></div><div class="card yellow"><p class="prompt">Build 4 sentences about one remake:</p><p>On the right, there is… · Next to him, there is… · They are standing… · In the background, you can see…</p></div>`,()=>`<div class="remakeGrid"><div class="card"><div class="pair"><div class="artpic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Grant%20DeVolson%20Wood%20-%20American%20Gothic.jpg"><span class="tag">ORIGINAL</span></div><div class="artpic"><img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/American%20Gothic%20Dress-Up.jpg"><span class="tag">REMAKE</span></div></div></div><div class="card blue"><p class="prompt">FIND & SAY</p><p>3 similarities<br>3 differences<br>2 clothes sentences<br>2 action sentences<br>2 place phrases</p></div></div>`]},
finish:{k:'SPEAKING · COMMUNICATION',t:'Describe. Compare. Decide.',l:'Final task: use the exact language of 1C, not general art vocabulary.',steps:[()=>`<div class="speaking"><div class="speakCard"><h3>1 · DESCRIBE</h3><p>There is / there are…<br>He is wearing…<br>She is holding…<br>They are standing…</p></div><div class="speakCard"><h3>2 · LOCATE</h3><p>On the left…<br>In the background…<br>Next to…<br>Behind…</p></div><div class="speakCard"><h3>3 · COMPARE</h3><p>Both pictures…<br>In the original…<br>In the remake…<br>The biggest difference is…</p></div></div><div class="card yellow"><p class="prompt">60-SECOND CHALLENGE</p><p>Choose one pair. Speak for one minute without notes. Use at least <b>5 clothes words + 4 Present Continuous forms + 2 prepositions</b>.</p></div>`]}}
};
const quiz=[['She ___ dresses on special occasions.',['likes','is liking'],0],['He ___ a hat when it is sunny.',['usually wears','is usually wearing'],0],['Look! They ___ matching outfits today.',['wear','are wearing'],1],['She ___ on different outfits right now.',['tries','is trying'],1],['He ___ sweaters in winter.',['doesn’t wear','isn’t wearing'],0],['She ___ her new scarf today.',['wears','is wearing'],1],['They ___ clothes online quite often.',['buy','are buying'],0],['At the moment he ___ a new jacket.',['tries on','is trying on'],1],['My sister ___ jewellery every day.',['doesn’t wear','isn’t wearing'],0],['This week Maya ___ more English than usual.',['practises','is practising'],1]];
let current=0,step=0;
function quizHtml(){return `<div class="grid2">${quiz.map((q,i)=>{const order=q[1].map((x,j)=>({x,j})).sort(()=>Math.random()-.5);return `<div class="card"><p class="prompt" style="font-size:12px">${i+1}. ${q[0]}</p><div class="choices">${order.map(o=>`<button class="choice" data-q="${i}" data-i="${o.j}" data-c="${q[2]}">${o.x}</button>`).join('')}</div><div class="feedback" id="qfb${i}"></div></div>`}).join('')}</div>`}
function makeSide(){const s=document.getElementById('side');s.innerHTML='';sections.forEach((x,i)=>{const b=document.createElement('button');b.innerHTML=`${x.label}<small>${x.sub}</small>`;b.onclick=()=>{current=i;step=0;render()};s.appendChild(b)})}
function render(){const sec=sections[current],d=data[sec.id];document.getElementById('kicker').textContent=d.k;document.getElementById('title').textContent=d.t;document.getElementById('lead').textContent=d.l;document.getElementById('work').innerHTML=d.steps[step]();document.getElementById('count').textContent=`${step+1}/${d.steps.length}`;document.getElementById('dots').textContent='● '.repeat(step+1)+'○ '.repeat(d.steps.length-step-1);[...document.querySelectorAll('.side button')].forEach((b,i)=>b.classList.toggle('active',i===current));document.getElementById('prev').disabled=step===0;document.getElementById('next').disabled=step===d.steps.length-1;bind()}
function say(text){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-GB';u.rate=.88;speechSynthesis.speak(u)}
function bind(){const bb=document.getElementById('bankBtn');if(bb)bb.onclick=()=>document.getElementById('bank').classList.toggle('open');document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));const pl=document.getElementById('playListen');if(pl)pl.onclick=()=>say('Johannes Vermeer painted scenes from everyday life. In The Milkmaid, a woman is standing beside a table and pouring milk. She is wearing an apron. Bread and other objects are lying on the table, and light is coming through a window. The picture feels quiet and very real.');const sb=document.getElementById('scriptBtn');if(sb)sb.onclick=()=>document.getElementById('script').classList.toggle('open')}
document.addEventListener('click',e=>{const c=e.target.closest('[data-q]');if(c){const q=c.dataset.q,good=Number(c.dataset.c),picked=Number(c.dataset.i);document.querySelectorAll(`[data-q="${q}"]`).forEach(x=>{x.disabled=true;if(Number(x.dataset.i)===good)x.classList.add('ok')});if(picked!==good)c.classList.add('no');document.getElementById('qfb'+q).textContent=picked===good?'✓ Correct':'Check the time marker.'}const o=e.target.closest('[data-one]');if(o){document.querySelectorAll(`[data-one="${o.dataset.one}"]`).forEach(x=>x.disabled=true);if(o.dataset.answer==='yes'){o.classList.add('ok');document.getElementById('fb-'+o.dataset.one).textContent='✓ Correct'}else{o.classList.add('no');document.getElementById('fb-'+o.dataset.one).textContent='Not this one.'}}});
document.getElementById('prev').onclick=()=>{if(step>0){step--;render()}};document.getElementById('next').onclick=()=>{const d=data[sections[current].id];if(step<d.steps.length-1){step++;render()}};makeSide();render();
</script>
</body>
</html>
