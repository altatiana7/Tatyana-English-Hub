<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Culture Shock · B1 · Worksheet</title>
<style>
:root{--ink:#111;--line:#c9c9c9;--soft:#f3f3f0;--teal:#0f6b62}
*{box-sizing:border-box}
body{margin:0;background:#e9e7e1;font:15px/1.5 Georgia,"Times New Roman",serif;color:var(--ink)}
.toolbar{position:sticky;top:0;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);font-family:Inter,system-ui,sans-serif}
.toolbar b{font-family:Inter,system-ui,sans-serif;font-size:14px}
.toolbar button{font:inherit;font-family:Inter,system-ui,sans-serif;font-size:13.5px;font-weight:700;
  border:1px solid #bbb;background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer}
.toolbar button.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.toolbar .sp{flex:1}
.paper{background:#fff;max-width:820px;margin:20px auto;padding:34px 40px 46px;
  box-shadow:0 10px 30px rgba(0,0,0,.10)}
h1{font-size:30px;margin:0 0 2px;letter-spacing:-.01em}
.kicker{font-family:Inter,system-ui,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--teal);font-weight:900;margin:0 0 6px}
.namebar{display:flex;gap:18px;font-family:Inter,system-ui,sans-serif;font-size:13px;color:#444;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 0;margin:12px 0 18px}
.namebar span{flex:1;border-bottom:1px dotted #999}
h2{font-family:Inter,system-ui,sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.08em;
  margin:24px 0 8px;padding-bottom:5px;border-bottom:2px solid var(--ink)}
h2 small{text-transform:none;letter-spacing:0;font-weight:400;color:#555;font-size:12.5px;margin-left:8px}
h3{font-family:Inter,system-ui,sans-serif;font-size:13.5px;margin:14px 0 6px;color:#333}
p{margin:6px 0}
ol,ul{margin:6px 0 6px 20px;padding:0}
li{margin:3px 0}
.bank{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:8px 12px;
  font-family:Inter,system-ui,sans-serif;font-size:13.5px;margin:8px 0}
.bank b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#555;display:block;margin-bottom:3px}
.q{margin:9px 0}
.q .stem{font-weight:600}
.opts{font-family:Inter,system-ui,sans-serif;font-size:13.5px;margin:3px 0 0 18px;color:#222}
.opts span{display:block}
.line{border-bottom:1px dotted #999;display:inline-block;min-width:120px}
.lines .l{border-bottom:1px solid #ddd;height:26px}
.tf{width:100%;border-collapse:collapse;font-family:Inter,system-ui,sans-serif;font-size:13.5px}
.tf td{border-bottom:1px solid #e3e3e3;padding:5px 6px;vertical-align:top}
.tf td:last-child{width:90px;text-align:center;white-space:nowrap;color:#666}
.tf td:first-child{width:26px;color:#666}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
.pair{font-family:Inter,system-ui,sans-serif;font-size:13.5px;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;margin:6px 0}
.pair .c{border-bottom:1px dotted #bbb;padding:2px 0}
.dlg{font-size:14px;margin:10px 0}
.dlg div{margin:4px 0}
.dlg b{font-family:Inter,system-ui,sans-serif;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:#555}
.gap{display:inline-block;min-width:86px;border-bottom:1.5px solid #333;height:16px}
.scen{border:1px solid var(--line);border-radius:6px;padding:8px 11px;margin:8px 0;font-size:13.5px}
.scen b{font-family:Inter,system-ui,sans-serif;display:block;margin-bottom:3px;font-size:13px}
.keys{display:none;margin-top:26px;border-top:3px double #333;padding-top:14px}
body.showkeys .keys{display:block}
.keys h2{border-color:#333}
.keys ol{margin-left:18px}
.keys li{margin:4px 0;font-size:13.5px}
.keys .k{font-family:Inter,system-ui,sans-serif}
.foot{margin-top:22px;font-family:Inter,system-ui,sans-serif;font-size:11.5px;color:#777;text-align:center}
@media print{
  body{background:#fff}
  .toolbar{display:none}
  .paper{box-shadow:none;margin:0;max-width:none;padding:0}
  h2{break-after:avoid;page-break-after:avoid}
  .block{break-inside:avoid;page-break-inside:avoid}
  .keys{display:none!important}
  body.showkeys .keys{display:block!important;page-break-before:always}
  @page{size:A4;margin:14mm 14mm 16mm}
}
@media(max-width:700px){.paper{padding:20px 16px}.two,.pair{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="toolbar">
  <b>Culture Shock · B1 · Worksheet</b>
  <span class="sp"></span>
  <button class="primary" type="button" id="print">🖨 Печать / PDF</button>
  <button type="button" id="keys">Показать ключи</button>
  <button type="button" id="back">← К уроку</button>
</div>

<div class="paper" id="paper">
  <p class="kicker">B1 · 60 min · Worksheet</p>
  <h1>Culture Shock</h1>
  <p style="color:#444">Three small things that surprised three very different people.</p>
  <div class="namebar"><span>Name</span><span>Date</span><span>Group</span></div>
  <div id="content"></div>
  <div class="foot">Culture Shock · B1 · Tatyana English Hub · worksheet for class or homework</div>
  <div class="keys" id="keysBlock"></div>
</div>

<script src="data.js"></script>
<script>
(function(){
  var D = window.CULTURE_SHOCK;
  if (!D) return;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var h = '';

  // 1 Lead-in
  h += '<h2>1. Lead-in <small>talk in pairs, 5 minutes</small></h2><ol>';
  D.leadIn.questions.forEach(function(q){ h += '<li>' + esc(q.q) + '</li>'; });
  h += '</ol><div class="lines"><div class="l"></div><div class="l"></div></div>';

  // 2 Vocabulary
  h += '<h2>2. Vocabulary <small>match the definition with a word</small></h2>';
  h += '<div class="bank"><b>Word bank</b>' + D.definitions.map(function(d){return esc(d.answer);}).join(' · ') + '</div>';
  h += '<ol>';
  D.definitions.forEach(function(d){ h += '<li>' + esc(d.definition) + ' — <span class="line"></span></li>'; });
  h += '</ol>';

  // 3 Write the words + IPA
  h += '<h2>3. Pronunciation <small>write the translation and mark the stress</small></h2>';
  h += '<table class="tf"><tr><td style="width:34%">Word</td><td style="width:33%">Russian</td><td>Stress</td></tr>';
  D.vocabulary.forEach(function(w){
    h += '<tr><td>' + esc(w.word) + '</td><td><span class="line"></span></td><td><span class="line"></span></td></tr>';
  });
  h += '</table>';

  // 4-6 Videos
  var roman = ['4','5','6'];
  D.videos.forEach(function(v,vi){
    h += '<h2>' + roman[vi] + '. Video ' + (vi+1) + ' · ' + esc(v.country) + ' <small>' + esc(v.speaker) + ' · ' + esc(v.headline) + '</small></h2>';
    h += '<p style="font-size:13.5px;color:#444"><b>Listen / read.</b> Then answer the questions.</p>';
    h += '<div class="dlg">';
    v.transcript.forEach(function(l){ h += '<div><b>' + esc(l.who) + ':</b> ' + esc(l.text) + '</div>'; });
    h += '</div><ol>';
    v.questions.forEach(function(q){
      h += '<li class="q"><span class="stem">' + esc(q.q) + '</span><div class="opts">';
      q.options.forEach(function(o,oi){ h += '<span>' + 'ABC'[oi] + ') ' + esc(o) + '</span>'; });
      h += '</div></li>';
    });
    h += '</ol>';
  });

  // 7 True/False
  h += '<h2>7. True or false <small>all three stories</small></h2><table class="tf">';
  D.trueFalse.forEach(function(t,i){
    h += '<tr><td>' + (i+1) + '.</td><td>' + esc(t.s) + '</td><td>T &nbsp; F</td></tr>';
  });
  h += '</table>';

  // 8 Dialogues
  h += '<h2>8. Dialogues <small>complete with the words from the box</small></h2>';
  D.dialogues.forEach(function(d,di){
    h += '<h3>' + esc(d.title) + '</h3><div class="bank"><b>Words</b>' + d.bank.map(esc).join(' · ') + '</div><div class="dlg">';
    d.lines.forEach(function(l){
      var tx = esc(l.text).replace(/\[(\d)\]/g,'<span class="gap"></span>');
      h += '<div><b>' + esc(l.who) + ':</b> ' + tx + '</div>';
    });
    h += '</div>';
  });

  // 9 Collocations
  h += '<h2>9. Collocations <small>match 1–10 with a–j, then write 3 sentences</small></h2><div class="pair">';
  D.collocations.pairs.forEach(function(p,i){
    h += '<div class="c">' + (i+1) + '. ' + esc(p.left) + ' …</div>';
  });
  D.collocations.pairs.forEach(function(p,i){
    h += '<div class="c">' + 'abcdefghij'[i] + ') … ' + esc(p.right) + '</div>';
  });
  h += '</div><div class="lines" style="margin-top:10px"><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div></div>';
  h += '<p style="font-family:Inter,system-ui,sans-serif;font-size:13px">Now write three sentences with collocations from the list:</p>';
  h += '<div class="lines"><div class="l"></div><div class="l"></div><div class="l"></div></div>';

  // 10 Scenarios
  h += '<h2>10. Scenarios <small>choose one and write your answer</small></h2>';
  D.scenarios.slice(0,3).forEach(function(s){
    h += '<div class="scen"><b>' + esc(s.title) + '</b>' + esc(s.situation) + '</div>';
  });
  h += '<div class="lines"><div class="l"></div><div class="l"></div><div class="l"></div><div class="l"></div></div>';

  // 11 Homework
  h += '<h2>11. Homework</h2><ol>';
  D.wrapUp.homework.forEach(function(x){ h += '<li>' + esc(x) + '</li>'; });
  h += '</ol>';

  document.getElementById('content').innerHTML = h;

  /* ключи */
  var k = '<h2>Answer key <small>teacher’s copy</small></h2>';
  k += '<ol class="k">';
  k += '<li><b>Vocabulary:</b> ' + D.definitions.map(function(d,i){return (i+1)+' — '+esc(d.answer);}).join('; ') + '</li>';
  k += '<li><b>Video 1:</b> ' + D.videos[0].questions.map(function(q,i){return (i+1)+' — '+'ABC'[q.answer];}).join(', ') + '</li>';
  k += '<li><b>Video 2:</b> ' + D.videos[1].questions.map(function(q,i){return (i+1)+' — '+'ABC'[q.answer];}).join(', ') + '</li>';
  k += '<li><b>Video 3:</b> ' + D.videos[2].questions.map(function(q,i){return (i+1)+' — '+'ABC'[q.answer];}).join(', ') + '</li>';
  k += '<li><b>True / false:</b> ' + D.trueFalse.map(function(t,i){return (i+1)+(t.answer?' T':' F');}).join(', ') + '</li>';
  k += '<li><b>Dialogues:</b> ' + D.dialogues.map(function(d,di){return 'Dialogue '+(di+1)+' — '+esc(d.gaps.join(', '));}).join('; ') + '</li>';
  k += '<li><b>Collocations:</b> ' + D.collocations.pairs.map(function(p,i){return (i+1)+'-'+('abcdefghij'[i])+') '+esc(p.left+' '+p.right);}).join('; ') + '</li>';
  k += '<li><b>Gap sentences:</b> ' + D.collocations.sentences.map(function(s,i){return (i+1)+' — '+esc(s.answer[0]);}).join('; ') + '</li>';
  k += '<li><b>Discussion:</b> no fixed answers — look for the target vocabulary in the student’s answer: culture shock, proper, weird, to stare, cap, custom, the environment.</li>';
  k += '</ol>';
  document.getElementById('keysBlock').innerHTML = k;

  document.getElementById('print').addEventListener('click', function(){ window.print(); });
  document.getElementById('keys').addEventListener('click', function(){
    var on = document.body.classList.toggle('showkeys');
    this.textContent = on ? 'Скрыть ключи' : 'Показать ключи';
  });
  document.getElementById('back').addEventListener('click', function(){ location.href = 'index.html'; });

  if (/[?&]keys(=|&|$)/.test(location.search)) {
    document.body.classList.add('showkeys');
    document.getElementById('keys').textContent = 'Скрыть ключи';
  }
})();
</script>
</body>
</html>
