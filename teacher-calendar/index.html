<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher CRM</title>
<style>
:root{--bg:#f7f4ef;--card:#fff;--text:#2f2d31;--muted:#8d8781;--line:#e8e1da;--accent:#9aa7d8;--accent2:#7f8fc7;--soft:#f1f3fb;--shadow:0 8px 24px rgba(52,46,41,.06)}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden}body{font:13px/1.35 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{height:100vh;display:grid;grid-template-columns:136px 1fr;gap:10px;padding:10px;max-width:1600px;margin:auto}.side,.panel,.top,.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.side{border-radius:16px;padding:14px 8px}.brand{font-size:14px;font-weight:850;padding:4px 8px 16px}.brand b{color:var(--accent2)}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:9px;border-radius:9px;color:#6f6a66;font-weight:750;margin:2px 0;cursor:pointer;font-size:11px}.nav button.active,.nav button:hover{background:var(--soft);color:#586aa6}.main{min-width:0;min-height:0}.view{display:none;height:100%}.view.active{display:flex;flex-direction:column;min-height:0}.top{border-radius:14px;padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;min-height:54px}h1{font-size:22px;margin:0;letter-spacing:-.03em}.sub,.muted{color:var(--muted)}.sub{font-size:11px;margin-top:2px}.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-weight:750;cursor:pointer;font-size:11px}.primary{border:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}.seg button{border:0;background:#fff;padding:7px 10px;font-size:11px;cursor:pointer}.seg button.active{background:#3f4754;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:8px}.stat{background:#fff;border:1px solid var(--line);border-radius:11px;padding:8px 10px}.stat span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase}.stat b{display:block;font-size:17px;margin-top:2px}.card{border-radius:14px;padding:10px}.schedule{flex:1;min-height:0;display:flex;flex-direction:column}.weekbar{display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-radius:14px 14px 0 0;overflow:hidden;background:#fff}.dayhead{padding:9px 8px;border-right:1px solid var(--line);text-align:center;background:#fbfaf8;font-size:11px}.dayhead:last-child{border-right:0}.daynum{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;margin:4px auto 0;font-size:16px;font-weight:800}.dayhead.today .daynum{background:#ece3dc}.schedulegrid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(7,1fr);border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;overflow:hidden;background:#fff}.daycol{position:relative;border-right:1px solid var(--line);padding:10px 8px;overflow:hidden}.daycol:last-child{border-right:0}.lesson-card{border-radius:8px;padding:7px 8px;margin-bottom:7px;background:#eef1fb;border:1px solid #dde2f2;cursor:pointer;font-size:10px}.lesson-card b{display:block;font-size:11px}.lesson-card .time{color:#6f7895;margin-top:2px}.addslot{position:absolute;right:7px;bottom:7px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;color:#777}.students-shell{display:grid;grid-template-columns:280px 1fr;gap:0;flex:1;min-height:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.students-left{border-right:1px solid var(--line);padding:12px;display:flex;flex-direction:column;min-height:0}.students-title{font-size:20px;font-weight:800;margin-bottom:10px}.searchrow{display:grid;grid-template-columns:1fr 38px;gap:7px}.searchrow input{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px}.circlebtn{border:1px solid #c9c1bb;background:#3a3a3a;color:#fff;border-radius:50%;font-size:22px;cursor:pointer}.student-list{margin-top:10px;display:grid;gap:4px;overflow:auto}.student-row{display:flex;align-items:center;gap:9px;padding:9px;border-radius:9px;cursor:pointer}.student-row.active,.student-row:hover{background:#f4f1ee}.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#eee;font-weight:800}.student-row b{font-size:12px}.student-row small{display:block;color:var(--muted);margin-top:1px}.student-detail{padding:18px 22px;overflow:auto}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.detail-name{font-size:22px;font-weight:850}.detail-grid{display:grid;grid-template-columns:190px 1fr;gap:11px 18px;align-items:center}.detail-grid label{font-size:11px;color:#4e4b49}.detail-grid input,.detail-grid select,.detail-grid textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:#fff}.detail-grid textarea{min-height:76px;resize:none}.savehint{font-size:10px;color:var(--muted);margin-top:12px}.months{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-bottom:8px}.month-tab{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px;text-align:left;cursor:pointer;font-size:9px}.month-tab.active{background:var(--soft);border-color:#bcc6e6}.month-tab b{display:block;font-size:11px}.month-tab span{color:var(--muted)}.tablebox{flex:1;min-height:0;overflow:hidden}.table{width:100%;border-collapse:collapse;table-layout:fixed}.table th,.table td{padding:8px 7px;border-bottom:1px solid var(--line);text-align:left;font-size:10px;vertical-align:middle}.table th{font-size:9px;color:var(--muted);background:#fbfaf8}.table input{width:100%;min-width:0;border:1px solid var(--line);border-radius:7px;padding:5px 6px}.pill{display:inline-block;padding:4px 7px;border-radius:999px;font-size:9px;background:#f3f0ed}.paid{background:#e8f3ee;color:#39765f}.advance{background:#edf0ff;color:#53659b}.workdue{background:#f7ecf3;color:#84506f}.owed{background:#fff1ea;color:#a95c4d}.today-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:8px;flex:1;min-height:0}.today-list{display:grid;gap:6px}.today-item,.alert,.makeup{padding:9px;border:1px solid var(--line);border-radius:10px;background:#fff}.today-item{display:grid;grid-template-columns:58px 1fr auto;gap:8px;align-items:center}.makeup{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;margin-bottom:6px}.modal-bg{position:fixed;inset:0;background:#25252544;display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.modal-bg.show{display:flex}.modal{width:min(520px,100%);background:#fff;border-radius:16px;padding:16px;box-shadow:0 30px 80px #0002}.form{display:grid;grid-template-columns:1fr 1fr;gap:9px}.form label{font-size:10px;color:var(--muted)}.form input,.form select,.form textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:4px;background:#fff}.full{grid-column:1/-1}.foot{display:flex;justify-content:flex-end;gap:6px;margin-top:12px}@media(max-width:900px){html,body{overflow:auto}.app{height:auto;display:block}.side{margin-bottom:8px}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.view{height:auto}.schedulegrid,.weekbar{min-width:900px}.schedule{overflow:auto}.students-shell{grid-template-columns:1fr}.students-left{border-right:0;border-bottom:1px solid var(--line)}.today-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app"><aside class="side"><div class="brand">Teacher <b>CRM</b></div><div class="nav"><button class="active" data-v="today">⌂ Сегодня</button><button data-v="schedule">▦ Расписание</button><button data-v="students">◉ Ученики</button><button data-v="payments">₽ Оплаты</button><button data-v="makeups">↪ Отработки</button></div></aside><main class="main">
<section id="today" class="view active"><div class="top"><div><h1>Сегодня</h1><div class="sub" id="todayDate"></div></div><button class="btn primary" onclick="openLessonCreate()">+ Урок</button></div><div class="stats" id="todayStats"></div><div class="today-grid"><div class="card"><b>Уроки сегодня</b><div id="todayLessons" class="today-list" style="margin-top:7px"></div></div><div class="card"><b>Требует внимания</b><div id="todayAlerts" style="margin-top:7px"></div></div></div></section>
<section id="schedule" class="view"><div class="top"><div><h1>Расписание</h1><div class="sub" id="weekLabel"></div></div><div class="actions"><button class="btn" onclick="goToday()">Сегодня</button><button class="btn" onclick="moveWeek(-7)">‹</button><button class="btn" onclick="moveWeek(7)">›</button><button class="btn primary" onclick="openLessonCreate()">+ Урок</button><div class="seg"><button class="active">Неделя</button><button disabled>Месяц</button></div></div></div><div class="schedule"><div id="weekHeads" class="weekbar"></div><div id="weekCols" class="schedulegrid"></div></div></section>
<section id="students" class="view"><div class="students-shell"><div class="students-left"><div class="students-title">Ученики</div><div class="searchrow"><input id="studentSearch" placeholder="Найти ученика" oninput="renderStudentList()"><button class="circlebtn" onclick="openStudentCreate()">+</button></div><div id="studentList" class="student-list"></div></div><div id="studentDetail" class="student-detail"></div></div></section>
<section id="payments" class="view"><div class="top"><div><h1>Оплаты</h1><div class="sub">Показываем только с сентября 2026. Пакет — 8 уроков.</div></div><div class="actions"><button class="btn" onclick="moveMonth(-1)">‹</button><input class="btn" id="monthPick" type="month" min="2026-09" onchange="jumpMonth(this.value)"><button class="btn" onclick="moveMonth(1)">›</button></div></div><div id="monthTabs" class="months"></div><div class="card tablebox"><table class="table"><colgroup><col style="width:18%"><col style="width:12%"><col style="width:8%"><col style="width:12%"><col style="width:12%"><col style="width:13%"><col style="width:12%"><col style="width:13%"></colgroup><thead><tr><th>Ученик</th><th>Стоимость</th><th>Пакет</th><th>К оплате</th><th>Получено</th><th>Дата</th><th>Отработано</th><th>Статус</th></tr></thead><tbody id="payBody"></tbody></table></div></section>
<section id="makeups" class="view"><div class="top"><div><h1>Отработки</h1><div class="sub">Недоработанные уроки прошлых оплаченных месяцев</div></div></div><div class="card" id="makeupList"></div></section></main></div>
<div class="modal-bg" id="studentModal"><div class="modal"><h2 style="margin:0 0 12px">Новый ученик</h2><div class="form"><label>Имя<input id="newStudentName"></label><label>Стоимость урока<input id="newStudentPrice" type="number"></label><label>Обычное время<input id="newStudentTime" type="time"></label><label>Цвет<select id="newStudentColor"><option value="#dfeee7">Мятный</option><option value="#e8e1f1">Лавандовый</option><option value="#e1eaf3">Голубой</option><option value="#f7ddd6">Коралловый</option><option value="#f4ead4">Песочный</option></select></label></div><div class="foot"><button class="btn" onclick="closeStudentCreate()">Отмена</button><button class="btn primary" onclick="saveStudentCreate()">Сохранить</button></div></div></div>
<div class="modal-bg" id="lessonCreateModal"><div class="modal"><h2 style="margin:0 0 12px">Добавить урок</h2><div class="form"><label>Ученик<select id="lessonStudent"></select></label><label>Дата<input id="lessonDate" type="date"></label><label>Время<input id="lessonTime" type="time"></label><label>Заметка<input id="lessonCreateNote"></label></div><div class="foot"><button class="btn" onclick="closeLessonCreate()">Отмена</button><button class="btn primary" onclick="saveLessonCreate()">Сохранить</button></div></div></div>
<script>
const PACK=8,MIN_MONTH='2026-09';const seed=[{id:1,name:'Мая',price:2000,time:'18:00',color:'#e8e1f1',goal:'',level:'',contact:'',comments:''},{id:2,name:'Никита',price:2200,time:'17:00',color:'#dfeee7',goal:'',level:'',contact:'',comments:''},{id:3,name:'Габи',price:1800,time:'12:00',color:'#f7ddd6',goal:'',level:'',contact:'',comments:''}];let students=JSON.parse(localStorage.getItem('tc_students')||'null')||seed;students=students.map(s=>({...s,time:s.time||'',price:+s.price||0,color:s.color||'#e1eaf3',goal:s.goal||'',level:s.level||'',contact:s.contact||'',comments:s.comments||''}));let ledger=JSON.parse(localStorage.getItem('tc_month_ledger')||'{}'),manualLessons=JSON.parse(localStorage.getItem('tc_manual_lessons')||'[]'),anchor=new Date(),selectedStudentId=students[0]?.id||null;anchor.setHours(12,0,0,0);
function persist(){localStorage.setItem('tc_students',JSON.stringify(students));localStorage.setItem('tc_month_ledger',JSON.stringify(ledger));localStorage.setItem('tc_manual_lessons',JSON.stringify(manualLessons))}function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function ym(d=anchor){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}function monday(d){let x=new Date(d),w=x.getDay();x.setDate(x.getDate()-((w+6)%7));return x}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function studentById(id){return students.find(s=>s.id==id)}function lkey(m,id){return `${m}|${id}`}function weekDays(){let ws=monday(anchor);return [0,1,2,3,4,5,6].map(i=>{let d=new Date(ws);d.setDate(ws.getDate()+i);return d})}
function renderSchedule(){let days=weekDays(),today=iso(new Date()),fmt=new Intl.DateTimeFormat('ru',{day:'numeric',month:'long'});document.getElementById('weekLabel').textContent=`${fmt.format(days[0])} — ${fmt.format(days[6])}`;document.getElementById('weekHeads').innerHTML=days.map(d=>`<div class="dayhead ${iso(d)===today?'today':''}">${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()]}<div class="daynum">${d.getDate()}</div></div>`).join('');document.getElementById('weekCols').innerHTML=days.map(d=>{let ds=iso(d),items=manualLessons.filter(x=>x.date===ds).sort((a,b)=>a.time.localeCompare(b.time));return `<div class="daycol">${items.map(x=>{let s=studentById(x.studentId);return `<div class="lesson-card" style="background:${s?.color||'#eef1fb'}"><b>${esc(s?.name||'Ученик')}</b><div class="time">${esc(x.time||'')}</div></div>`}).join('')}<button class="addslot" onclick="openLessonCreate('${ds}')">+</button></div>`}).join('')}
function renderToday(){let t=new Date(),ds=iso(t),items=manualLessons.filter(x=>x.date===ds).sort((a,b)=>a.time.localeCompare(b.time)),m=ym(t),got=0,backlog=0;students.forEach(s=>got+=+(ledger[lkey(m,s.id)]?.amount||0));Object.entries(ledger).forEach(([k,x])=>{let [mo]=k.split('|');if(mo>=MIN_MONTH&&mo<m&&(+x.amount||0)>0)backlog+=Math.max(0,PACK-(+x.worked||0))});document.getElementById('todayDate').textContent=t.toLocaleDateString('ru',{weekday:'long',day:'numeric',month:'long'});document.getElementById('todayStats').innerHTML=`<div class="stat"><span>Сегодня уроков</span><b>${items.length}</b></div><div class="stat"><span>Ученики</span><b>${students.length}</b></div><div class="stat"><span>Получено за месяц</span><b>${got.toLocaleString('ru')} ₽</b></div><div class="stat"><span>Старых уроков</span><b>${backlog}</b></div>`;document.getElementById('todayLessons').innerHTML=items.length?items.map(x=>{let s=studentById(x.studentId);return `<div class="today-item"><b>${x.time}</b><div><b>${esc(s?.name||'Ученик')}</b></div><span class="muted">${esc(x.note||'')}</span></div>`}).join(''):'<div class="muted">На сегодня уроков нет.</div>';let alerts=[];students.forEach(s=>{for(let off=-3;off<=1;off++){let d=new Date(t.getFullYear(),t.getMonth()+off,1),mo=ym(d);if(mo<MIN_MONTH)continue;let x=ledger[lkey(mo,s.id)]||{},amount=+x.amount||0,worked=+x.worked||0;if(off<0&&amount>0&&worked<PACK)alerts.push(`<div class="alert"><b>${esc(s.name)} · ${d.toLocaleDateString('ru',{month:'long'})}</b><div class="muted">Осталось провести ${PACK-worked} из 8</div></div>`);if(off>0&&amount>0)alerts.push(`<div class="alert"><b>${esc(s.name)} · аванс</b><div class="muted">Оплачен ${d.toLocaleDateString('ru',{month:'long'})}</div></div>`)}});document.getElementById('todayAlerts').innerHTML=alerts.length?alerts.join(''):'<div class="muted">Срочных пометок нет.</div>'}
function renderStudentList(){let q=(document.getElementById('studentSearch')?.value||'').toLowerCase();let arr=students.filter(s=>s.name.toLowerCase().includes(q));if(!selectedStudentId&&arr[0])selectedStudentId=arr[0].id;document.getElementById('studentList').innerHTML=arr.map(s=>`<div class="student-row ${s.id==selectedStudentId?'active':''}" onclick="selectStudent(${s.id})"><div class="avatar" style="background:${s.color}">${esc((s.name||'?')[0])}</div><div><b>${esc(s.name)}</b><small>${s.time?esc(s.time):'время не задано'}</small></div></div>`).join('');renderStudentDetail()}function selectStudent(id){selectedStudentId=id;renderStudentList()}function renderStudentDetail(){let s=studentById(selectedStudentId),box=document.getElementById('studentDetail');if(!s){box.innerHTML='<div class="muted">Выбери ученика</div>';return}box.innerHTML=`<div class="detail-head"><div><div class="detail-name">${esc(s.name)}</div><div class="muted">Карточка ученика</div></div><button class="btn primary" onclick="saveStudentDetail(${s.id})">Сохранить</button></div><div class="detail-grid"><label>Имя</label><input id="dName" value="${esc(s.name)}"><label>Стоимость урока</label><input id="dPrice" type="number" value="${s.price}"><label>Обычное время</label><input id="dTime" type="time" value="${esc(s.time||'')}"><label>Цель обучения</label><input id="dGoal" value="${esc(s.goal||'')}" placeholder="Например: ЕГЭ / разговорный"><label>Уровень</label><input id="dLevel" value="${esc(s.level||'')}" placeholder="A2 / B1 / B2"><label>Контакт</label><input id="dContact" value="${esc(s.contact||'')}"><label>Комментарий</label><textarea id="dComments">${esc(s.comments||'')}</textarea></div><div class="savehint">Точное расписание пока не нужно: можно просто указать обычное время, а конкретные уроки добавлять во вкладке «Расписание».</div>`}function saveStudentDetail(id){let s=studentById(id);if(!s)return;s.name=document.getElementById('dName').value.trim()||'Без имени';s.price=+document.getElementById('dPrice').value||0;s.time=document.getElementById('dTime').value||'';s.goal=document.getElementById('dGoal').value;s.level=document.getElementById('dLevel').value;s.contact=document.getElementById('dContact').value;s.comments=document.getElementById('dComments').value;persist();render()}
function monthRange(){let base=new Date(Math.max(new Date(MIN_MONTH+'-01T12:00:00').getTime(),new Date(anchor.getFullYear(),anchor.getMonth()-2,1,12).getTime()));let out=[];for(let i=0;i<6;i++){let d=new Date(base.getFullYear(),base.getMonth()+i,1,12);out.push(d)}return out}function renderPayments(){if(ym()<MIN_MONTH)anchor=new Date(MIN_MONTH+'-01T12:00:00');document.getElementById('monthPick').value=ym();document.getElementById('monthTabs').innerHTML=monthRange().map(d=>{let mo=ym(d),amt=0,worked=0;students.forEach(s=>{let x=ledger[lkey(mo,s.id)]||{};amt+=+x.amount||0;worked+=Math.min(PACK,+x.worked||0)});return `<button class="month-tab ${mo===ym()?'active':''}" onclick="jumpMonth('${mo}')"><b>${d.toLocaleDateString('ru',{month:'short',year:'numeric'})}</b><span>${amt.toLocaleString('ru')} ₽ · ${worked}/${students.length*PACK}</span></button>`}).join('');let mo=ym(),now=ym(new Date());document.getElementById('payBody').innerHTML=students.map(s=>{let k=lkey(mo,s.id),x=ledger[k]||{},due=PACK*s.price,amount=+x.amount||0,worked=Math.max(0,Math.min(PACK,+x.worked||0)),payDate=x.payDate||'',future=mo>now,status='Не оплачено',cls='owed';if(amount>=due&&worked>=PACK){status='Закрыто';cls='paid'}else if(amount>=due&&future){status='Аванс';cls='advance'}else if(amount>=due&&worked<PACK){status=`Оплачено · провести ${PACK-worked}`;cls='workdue'}else if(amount>0){status='Частично'}return `<tr><td><b>${esc(s.name)}</b></td><td>${s.price.toLocaleString('ru')} ₽</td><td>8</td><td><b>${due.toLocaleString('ru')} ₽</b></td><td><input type="number" value="${amount}" onchange="setLedger('${k}','amount',this.value)"></td><td><input type="date" value="${payDate}" onchange="setLedger('${k}','payDate',this.value)"></td><td><input type="number" min="0" max="8" value="${worked}" onchange="setLedger('${k}','worked',this.value)"></td><td><span class="pill ${cls}">${status}</span></td></tr>`}).join('')}function setLedger(k,f,v){ledger[k]=ledger[k]||{};ledger[k][f]=f==='amount'||f==='worked'?+v||0:v;if(f==='worked')ledger[k][f]=Math.max(0,Math.min(PACK,ledger[k][f]));persist();render()}function renderMakeups(){let rows=[];students.forEach(s=>{for(let i=0;i<18;i++){let d=new Date(2026,8+i,1,12),mo=ym(d);if(mo>ym())break;let x=ledger[lkey(mo,s.id)]||{},worked=+x.worked||0,amount=+x.amount||0;if(amount>0&&worked<PACK)rows.push(`<div class="makeup"><div><b>${esc(s.name)}</b><div class="muted">${d.toLocaleDateString('ru',{month:'long',year:'numeric'})}: осталось ${PACK-worked} из 8</div></div><button class="btn" onclick="jumpToPayment('${mo}')">Открыть</button></div>`)}});document.getElementById('makeupList').innerHTML=rows.length?rows.join(''):'<div class="muted">Нет незакрытых уроков.</div>'}
function openStudentCreate(){document.getElementById('newStudentName').value='';document.getElementById('newStudentPrice').value='';document.getElementById('newStudentTime').value='';document.getElementById('studentModal').classList.add('show')}function closeStudentCreate(){document.getElementById('studentModal').classList.remove('show')}function saveStudentCreate(){let s={id:Date.now(),name:document.getElementById('newStudentName').value.trim()||'Без имени',price:+document.getElementById('newStudentPrice').value||0,time:document.getElementById('newStudentTime').value||'',color:document.getElementById('newStudentColor').value,goal:'',level:'',contact:'',comments:''};students.push(s);selectedStudentId=s.id;persist();closeStudentCreate();render();showView('students')}function openLessonCreate(date=''){document.getElementById('lessonStudent').innerHTML=students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('');document.getElementById('lessonDate').value=date||iso(new Date());let s=students[0];document.getElementById('lessonTime').value=s?.time||'';document.getElementById('lessonCreateNote').value='';document.getElementById('lessonCreateModal').classList.add('show')}function closeLessonCreate(){document.getElementById('lessonCreateModal').classList.remove('show')}function saveLessonCreate(){let sid=+document.getElementById('lessonStudent').value,date=document.getElementById('lessonDate').value,time=document.getElementById('lessonTime').value||studentById(sid)?.time||'17:00';manualLessons.push({id:Date.now(),studentId:sid,date:date||iso(new Date()),time,note:document.getElementById('lessonCreateNote').value});persist();closeLessonCreate();render();showView('schedule')}function moveWeek(n){anchor.setDate(anchor.getDate()+n);render()}function goToday(){anchor=new Date();anchor.setHours(12,0,0,0);render()}function moveMonth(n){let d=new Date(anchor.getFullYear(),anchor.getMonth()+n,1,12);if(ym(d)<MIN_MONTH)d=new Date(MIN_MONTH+'-01T12:00:00');anchor=d;render()}function jumpMonth(v){if(!v)return;if(v<MIN_MONTH)v=MIN_MONTH;anchor=new Date(v+'-01T12:00:00');render()}function jumpToPayment(m){jumpMonth(m);showView('payments')}function render(){renderToday();renderSchedule();renderStudentList();renderPayments();renderMakeups()}function showView(id){document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.v===id));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id===id));render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showView(b.dataset.v));render();
</script></body></html>
