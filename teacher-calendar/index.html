<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher Calendar</title><style>:root{--bg:#f7f2ec;--card:#fff;--text:#25222a;--muted:#867d77;--line:#eadfd6;--accent:#e78373;--accent2:#f3a078;--soft:#fff0ea;--shadow:0 16px 40px rgba(76,54,40,.08)}*{box-sizing:border-box}body{margin:0;font:14px/1.4 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,#faf6f2,#f4eee8);color:var(--text)}button,input,select{font:inherit}.app{max-width:1460px;margin:auto;display:grid;grid-template-columns:220px 1fr;gap:20px;padding:18px;min-height:100vh}.side,.top,.card{background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}.side{border-radius:24px;padding:22px 14px;height:calc(100vh - 36px);position:sticky;top:18px}.brand{font-size:20px;font-weight:850;letter-spacing:-.03em;padding:0 10px 25px}.brand b{color:var(--accent)}.nav button{width:100%;border:0;background:transparent;text-align:left;padding:12px 13px;border-radius:12px;color:#716a65;font-weight:650;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{background:var(--soft);color:#ad5d50}.main{min-width:0}.top{border-radius:22px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}h1{font-size:29px;letter-spacing:-.04em;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:4px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 13px;font-weight:750;cursor:pointer}.primary{border:0;color:white;background:linear-gradient(135deg,var(--accent2),var(--accent));box-shadow:0 9px 20px rgba(216,120,101,.2)}.card{border-radius:22px;padding:14px}.view{display:none}.view.active{display:block}.calendar-wrap{overflow:auto}.week{min-width:1010px;display:grid;grid-template-columns:64px repeat(7,1fr);border:1px solid var(--line);border-radius:16px;overflow:hidden}.cell{min-height:54px;border-right:1px solid #eee6e0;border-bottom:1px solid #eee6e0;padding:4px;background:#fff}.head{min-height:52px;background:#fcfaf8;text-align:center;padding:8px 4px;color:#625c58;font-weight:800}.time{font-size:12px;color:#8e8680;text-align:center;padding-top:7px;background:#fcfaf8}.break{background:#faf8f6;min-height:26px}.slot{border-radius:8px;padding:6px 7px;font-size:11px;line-height:1.3;border:1px solid rgba(0,0,0,.035);margin-bottom:3px}.slot b{display:block;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px;box-shadow:0 8px 22px rgba(76,54,40,.04)}.stat span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}.stat b{display:block;font-size:23px;margin-top:4px}.students{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.student{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.bar{position:absolute;left:0;top:0;bottom:0;width:7px}.student h3{margin:0;font-size:19px}.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eee6e0}.kv span{color:var(--muted)}.modal-bg{position:fixed;inset:0;background:#2b252044;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.modal-bg.show{display:flex}.modal{width:min(620px,100%);background:#fff;border-radius:24px;padding:22px;box-shadow:0 30px 90px #211a1633}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form label{font-size:12px;color:var(--muted)}.form input,.form select{width:100%;padding:10px;border:1px solid var(--line);border-radius:11px;margin-top:5px;background:#fff}.full{grid-column:1/-1}.days{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.days label{border:1px solid var(--line);border-radius:9px;padding:6px 8px;color:var(--text)}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:900px){.app{grid-template-columns:80px 1fr}.brand{font-size:0}.brand:after{content:'TC';font-size:18px}.nav button{font-size:0;text-align:center}.nav button:before{font-size:19px}.students{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:650px){.app{display:block;padding:0}.side{height:auto;position:sticky;top:0;z-index:5;border-radius:0;padding:7px}.brand{display:none}.nav{display:flex;overflow:auto}.nav button{width:auto;flex:0 0 auto;font-size:12px}.main{padding:12px}.students{grid-template-columns:1fr}.form{grid-template-columns:1fr}}</style></head><body><div class="app"><aside class="side"><div class="brand">Teacher <b>Calendar</b></div><div class="nav"><button class="active" data-v="calendar">📅 Расписание</button><button data-v="students">👩‍🎓 Ученики</button></div></aside><main class="main"><section id="calendar" class="view active"><div class="top"><div><h1>Расписание</h1><div class="sub">1 смена 08:00–12:00 · перерыв · 2 смена 14:00–20:00 · урок 60 минут</div></div><div class="actions"><button class="btn" onclick="moveWeek(-7)">←</button><input class="btn" id="datePick" type="date" onchange="jumpDate(this.value)"><button class="btn" onclick="moveWeek(7)">→</button><button class="btn primary" onclick="openStudent()">+ Ученик</button></div></div><div class="stats" id="stats"></div><div class="card calendar-wrap"><div id="week"></div></div></section><section id="students" class="view"><div class="top"><div><h1>Ученики</h1><div class="sub">Дни и время задаются один раз — календарь заполняется автоматически</div></div><button class="btn primary" onclick="openStudent()">+ Добавить ученика</button></div><div class="students" id="studentGrid"></div></section></main></div><div class="modal-bg" id="modal"><div class="modal"><h2 style="margin-top:0">Новый ученик</h2><div class="form"><label>Имя<input id="name" placeholder="Имя ученика"></label><label>Цена 1 занятия<input id="price" type="number" placeholder="2000"></label><label class="full">Дни занятий<div class="days"><label><input type="checkbox" name="wd" value="1"> Пн</label><label><input type="checkbox" name="wd" value="2"> Вт</label><label><input type="checkbox" name="wd" value="3"> Ср</label><label><input type="checkbox" name="wd" value="4"> Чт</label><label><input type="checkbox" name="wd" value="5"> Пт</label><label><input type="checkbox" name="wd" value="6"> Сб</label><label><input type="checkbox" name="wd" value="0"> Вс</label></div></label><label>Время<input id="lessonTime" type="time" value="17:00"></label><label>С какого числа<input id="start" type="date"></label><label>До какого числа<input id="end" type="date"></label><label>Цвет<select id="color"><option value="#f7ddd6">Коралловый</option><option value="#e8e1f1">Лавандовый</option><option value="#dfeee7">Мятный</option><option value="#e1eaf3">Голубой</option><option value="#f4ead4">Песочный</option></select></label></div><div class="foot"><button class="btn" onclick="closeStudent()">Отмена</button><button class="btn primary" onclick="saveStudent()">Сохранить</button></div></div></div><script>const seed=[{id:1,name:'Мая',price:2000,days:[2,5],time:'18:00',start:'2026-08-01',end:'',color:'#e8e1f1'},{id:2,name:'Никита',price:2200,days:[1,4],time:'17:00',start:'2026-08-01',end:'',color:'#dfeee7'},{id:3,name:'Габи',price:1800,days:[],time:'12:00',start:'2026-08-01',end:'',color:'#f7ddd6',dates:['2026-08-29']}];let students=JSON.parse(localStorage.getItem('tc_students')||'null')||seed;let anchor=new Date();anchor.setHours(12,0,0,0);function iso(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),x=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${x}`}function monday(d){let x=new Date(d),w=x.getDay();x.setDate(x.getDate()-((w+6)%7));return x}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function lessonsOn(date){let w=date.getDay(),ds=iso(date);return students.filter(s=>(s.days||[]).includes(w)||((s.dates||[]).includes(ds))).filter(s=>(!s.start||ds>=s.start)&&(!s.end||ds<=s.end))}function monthCount(s,y,m){let last=new Date(y,m+1,0).getDate(),n=0;for(let i=1;i<=last;i++){let d=new Date(y,m,i),ds=iso(d);if(((!s.start||ds>=s.start)&&(!s.end||ds<=s.end))&&((s.days||[]).includes(d.getDay())||(s.dates||[]).includes(ds)))n++}return n}function renderWeek(){let ws=monday(anchor),days=[0,1,2,3,4,5,6].map(i=>{let d=new Date(ws);d.setDate(ws.getDate()+i);return d}),times=['08:00','09:00','10:00','11:00','BREAK','14:00','15:00','16:00','17:00','18:00','19:00'];datePick.value=iso(anchor);let h='<div class="week"><div class="cell head"></div>'+days.map(d=>`<div class="cell head">${['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][d.getDay()]}<div style="font-size:15px;margin-top:2px">${d.getDate()}</div></div>`).join('');for(let t of times){if(t==='BREAK'){h+='<div class="cell time break">12–14</div>'+days.map(()=>'<div class="cell break"></div>').join('');continue}h+=`<div class="cell time">${t}</div>`;for(let d of days){let list=lessonsOn(d).filter(s=>s.time.slice(0,2)===t.slice(0,2));h+=`<div class="cell">${list.map(s=>`<div class="slot" style="background:${s.color}"><b>${esc(s.name)}</b>${s.time}–${String(+s.time.slice(0,2)+1).padStart(2,'0')}:00</div>`).join('')}</div>`}}h+='</div>';week.innerHTML=h;let all=days.flatMap(lessonsOn),uniq=all.length,sum=all.reduce((a,s)=>a+s.price,0),ym=anchor;stats.innerHTML=`<div class="stat"><span>Занятий на неделе</span><b>${uniq}</b></div><div class="stat"><span>Учеников</span><b>${students.length}</b></div><div class="stat"><span>Расчёт недели</span><b>${sum.toLocaleString('ru')} ₽</b></div><div class="stat"><span>Месяц</span><b>${anchor.toLocaleDateString('ru',{month:'long'})}</b></div>`}function renderStudents(){studentGrid.innerHTML=students.map(s=>{let c=monthCount(s,anchor.getFullYear(),anchor.getMonth()),days=(s.days||[]).map(x=>['Вс','Пн','Вт','Ср','Чт','Пт','Сб'][x]).join(', ')||'Отдельные даты';return `<div class="student"><div class="bar" style="background:${s.color}"></div><h3>${esc(s.name)}</h3><div class="kv"><span>Расписание</span><b>${days} · ${s.time}</b></div><div class="kv"><span>1 занятие</span><b>${s.price.toLocaleString('ru')} ₽</b></div><div class="kv"><span>В этом месяце</span><b>${c}</b></div><div class="kv"><span>Сумма месяца</span><b>${(c*s.price).toLocaleString('ru')} ₽</b></div></div>`}).join('')}function render(){renderWeek();renderStudents()}function moveWeek(n){anchor.setDate(anchor.getDate()+n);render()}function jumpDate(v){if(v){anchor=new Date(v+'T12:00:00');render()}}function openStudent(){start.value=iso(new Date());modal.classList.add('show')}function closeStudent(){modal.classList.remove('show')}function saveStudent(){let n=name.value.trim();if(!n)return alert('Введите имя');let days=[...document.querySelectorAll('[name=wd]:checked')].map(x=>+x.value);students.push({id:Date.now(),name:n,price:+price.value||0,days,time:lessonTime.value||'17:00',start:start.value,end:end.value,color:color.value,dates:[]});localStorage.setItem('tc_students',JSON.stringify(students));name.value='';price.value='';document.querySelectorAll('[name=wd]').forEach(x=>x.checked=false);closeStudent();render()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.v).classList.add('active');render()});render()</script></body></html>
