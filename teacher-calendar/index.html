<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Планнер Татьяны</title><style>:root{--bg:#f7f3ef;--card:#fff;--line:#e7ddd5;--text:#29252a;--muted:#847b75;--accent:#a843d1;--soft:#f6ecfb;--school:#eef3f8;--tutor:#fbf0ff}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font:13px/1.35 Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:150px 1fr;gap:10px;padding:10px}.side,.top,.card{background:var(--card);border:1px solid var(--line);border-radius:16px}.side{padding:12px 8px}.brand{font-weight:900;font-size:15px;padding:5px 8px 14px}.brand b{color:var(--accent)}.nav button{width:100%;border:0;background:none;text-align:left;padding:9px 8px;border-radius:9px;margin:2px 0;color:#6f6863;font-weight:800;cursor:pointer}.nav button.active{background:var(--soft);color:#7f2daa}.main,.view{min-width:0}.view{display:none}.view.active{display:block}.top{padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}.top h1{font-size:22px;margin:0}.sub,.muted{font-size:11px;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white;border-color:var(--accent)}.week{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.day{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.dayhead{padding:9px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dayhead b{font-size:13px}.editday{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 7px;font-weight:800;cursor:pointer}.zone{padding:9px}.zone.school{background:var(--school)}.zone.tutor{background:var(--tutor)}.zonehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.zonehead strong{font-size:12px}.hours{font-size:10px;color:var(--muted);font-weight:800}.gap{height:10px;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.entry{background:#fff;border:1px solid #e7e1dd;border-radius:8px;padding:7px 8px;margin-top:5px;white-space:pre-wrap}.entry.empty{color:#aaa;font-style:italic}.students{display:grid;grid-template-columns:300px 1fr;gap:8px}.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:7px}.tile{border:0;border-radius:9px;min-height:58px;font-weight:850;cursor:pointer}.input{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:10px}.d{border:1px solid var(--line);border-radius:8px;padding:8px}.d span{display:block;color:var(--muted);font-size:9px}.months{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-bottom:6px}.monthbtn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px;text-align:left;cursor:pointer}.monthbtn.active{border-color:var(--accent);background:var(--soft)}.paygrid{display:grid;grid-template-columns:165px 135px minmax(500px,1fr) 125px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.paygrid>div{padding:7px;border-bottom:1px solid #eee6e0;border-right:1px solid #f0e8e2;display:flex;align-items:center}.paygrid>div:nth-child(4n){border-right:0}.head{background:#fcfaf8;color:var(--muted);font-size:9px;font-weight:800}.marks{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;width:100%}.mark{border:1px solid var(--line);border-radius:7px;padding:3px;text-align:center}.mark input{width:100%;border:0;border-bottom:1px solid #eee;text-align:center}.mark button{width:100%;margin-top:2px;border:0;border-radius:5px;padding:3px;cursor:pointer}.mark.done{background:#eaf5ee}.calwrap{display:flex;flex-direction:column;gap:6px}.legend{display:flex;gap:8px;flex-wrap:wrap;padding:7px}.lg{display:flex;gap:4px;align-items:center}.dot{width:9px;height:9px;border-radius:50%}.cal{display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:26px repeat(6,86px);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.cal>div{border-right:1px solid #eee6e0;border-bottom:1px solid #eee6e0}.ch{text-align:center;padding:5px;color:var(--muted);font-size:9px;background:#fcfaf8}.cd{padding:5px}.cd.out{background:#faf8f6;color:#b8b0aa}.chips{display:flex;flex-direction:column;gap:2px;margin-top:3px}.chip{font-size:9px;font-weight:800;border-radius:5px;padding:2px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.make{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee}.notices{display:grid;grid-template-columns:1fr 1fr;gap:7px}.notice{border:1px solid var(--accent);border-radius:9px;padding:8px;background:#fff}.modalbg{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center;padding:16px}.modalbg.show{display:flex}.modal{width:min(600px,96vw);background:#fff;border-radius:16px;padding:16px}.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}.form label{font-size:10px;color:var(--muted);font-weight:800}.form input,.form select,.form textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:4px}.form textarea{min-height:110px;resize:vertical}.full{grid-column:1/-1}.foot{text-align:right;margin-top:10px}@media(max-width:1100px){.week{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.app{display:block}.side{margin-bottom:8px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.week{grid-template-columns:1fr}.students{grid-template-columns:1fr}.paywrap{overflow:auto}.paygrid{min-width:850px}}</style></head><body><div class="app"><aside class="side"><div class="brand">Планнер <b>Татьяны</b></div><div class="nav"><button class="active" data-v="schedule">Расписание</button><button data-v="month">Месяц</button><button data-v="students">Ученики</button><button data-v="payments">Оплаты</button><button data-v="makeups">Отработки</button><button data-v="notices">Напоминания</button></div></aside><main class="main"><section id="schedule" class="view active"><div class="top"><div><h1>Постоянное расписание</h1><div class="sub">Школа 08:00–15:00 · небольшой перерыв · репетиторство 15:00–20:00</div></div><button class="btn" onclick="resetPermanent()">Сбросить шаблон</button></div><div id="permanentBoard" class="week"></div></section><section id="month" class="view"><div class="top"><div><h1>Месяц</h1><div class="sub">Отмеченные занятия по ученикам</div></div><div><button class="btn" onclick="moveCal(-1)">←</button> <input class="btn" id="calPick" type="month" min="2026-09" onchange="jumpCal(this.value)"> <button class="btn" onclick="moveCal(1)">→</button></div></div><div class="calwrap"><div id="legend" class="card legend"></div><div id="calendar" class="cal"></div></div></section><section id="students" class="view"><div class="top"><h1>Ученики</h1><button class="btn primary" onclick="openStudent()">+ Ученик</button></div><div class="students"><div class="card" style="padding:10px"><input id="search" class="input" placeholder="Поиск" oninput="renderStudents()"><div id="tiles" class="tiles"></div></div><div id="detail" class="card"></div></div></section><section id="payments" class="view"><div class="top"><div><h1>Оплаты</h1><div class="sub">Стоимость и 8 занятий по каждому ученику</div></div><div><button class="btn" onclick="movePay(-1)">←</button> <input class="btn" id="payPick" type="month" min="2026-09" onchange="jumpPay(this.value)"> <button class="btn" onclick="movePay(1)">→</button></div></div><div class="paywrap"><div id="monthBtns" class="months"></div><div id="paygrid" class="paygrid"></div></div></section><section id="makeups" class="view"><div class="top"><h1>Отработки</h1></div><div id="makeList" class="card"></div></section><section id="notices" class="view"><div class="top"><h1>Напоминания</h1><button class="btn primary" onclick="addNotice()">+ Напоминание</button></div><div id="noticeList" class="notices"></div></section></main></div><div id="dm" class="modalbg"><div class="modal"><h2 id="dayTitle">Редактировать день</h2><div class="form"><label class="full">Школа, 08:00–15:00<textarea id="schoolText" placeholder="Например: 08:00–15:00 школа\n8Б — 2 урок\n10А — 4 урок"></textarea></label><label class="full">Репетиторство, 15:00–20:00<textarea id="tutorText" placeholder="Например: 15:00 Мая\n17:00 Никита\n19:00 Габи"></textarea></label></div><div class="foot"><button class="btn" onclick="dm.classList.remove('show')">Отмена</button> <button class="btn primary" onclick="saveDay()">Сохранить</button></div></div></div><div id="sm" class="modalbg"><div class="modal"><h2>Новый ученик</h2><div class="form"><label>Имя<input id="sn"></label><label>Время<input id="st" type="time"></label><label>Цвет<select id="sc"><option value="#ffb6b6">Коралловый</option><option value="#bfe8db">Зелёный</option><option value="#c9b8ff">Фиолетовый</option><option value="#bfc9ff">Синий</option><option value="#ffe88c">Жёлтый</option></select></label><label>Уровень<input id="sl"></label><label>Контакт<input id="scon"></label><label class="full">Заметка<textarea id="snote"></textarea></label></div><div class="foot"><button class="btn" onclick="sm.classList.remove('show')">Отмена</button> <button class="btn primary" onclick="saveStudent()">Сохранить</button></div></div></div><script>const MIN='2026-09',PACK=8,days=['Понедельник','Вторник','Среда','Четверг','Пятница'];const defaultPermanent=Object.fromEntries(days.map(d=>[d,{school:'Школа',tutor:''}]));let permanent=JSON.parse(localStorage.getItem('crm_permanent')||'null')||defaultPermanent;const seed=[{id:1,name:'Мая',time:'18:00',color:'#c9b8ff'},{id:2,name:'Никита',time:'17:00',color:'#bfe8db'},{id:3,name:'Габи',time:'12:00',color:'#ffc8bd'}];let students=JSON.parse(localStorage.getItem('crm_students')||'null')||seed,ledger=JSON.parse(localStorage.getItem('crm_ledger')||'{}'),notices=JSON.parse(localStorage.getItem('crm_notices')||'[]'),anchor=new Date(),calAnchor=new Date(),sel=students[0]?.id,editingDay='';anchor.setHours(12,0,0,0);calAnchor=new Date(anchor.getFullYear(),anchor.getMonth(),1,12);if(ym(calAnchor)<MIN)calAnchor=new Date('2026-09-01T12:00:00');students=students.map(s=>({...s,level:s.level||'',contact:s.contact||'',note:s.note||''}));const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem('crm_permanent',JSON.stringify(permanent));localStorage.setItem('crm_students',JSON.stringify(students));localStorage.setItem('crm_ledger',JSON.stringify(ledger));localStorage.setItem('crm_notices',JSON.stringify(notices))}function ym(d=anchor){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}function byId(id){return students.find(s=>s.id==id)}function lk(m,id){return `${m}|${id}`}function sessions(x){let a=Array.isArray(x.sessions)?x.sessions.slice(0,8):[];while(a.length<8)a.push({day:'',done:false});return a}function renderPermanent(){$('permanentBoard').innerHTML=days.map(d=>{let x=permanent[d]||{school:'Школа',tutor:''};return `<article class="day"><div class="dayhead"><b>${d}</b><button class="editday" onclick="editDay('${d}')">Редактировать</button></div><div class="zone school"><div class="zonehead"><strong>Школа</strong><span class="hours">08:00–15:00</span></div><div class="entry ${x.school?'':'empty'}">${x.school?esc(x.school):'Нет записей'}</div></div><div class="gap"></div><div class="zone tutor"><div class="zonehead"><strong>Репетиторство</strong><span class="hours">15:00–20:00</span></div><div class="entry ${x.tutor?'':'empty'}">${x.tutor?esc(x.tutor):'Добавьте учеников и время'}</div></div></article>`}).join('')}function editDay(d){editingDay=d;$('dayTitle').textContent='Редактировать: '+d;$('schoolText').value=permanent[d]?.school||'';$('tutorText').value=permanent[d]?.tutor||'';$('dm').classList.add('show')}function saveDay(){permanent[editingDay]={school:$('schoolText').value.trim(),tutor:$('tutorText').value.trim()};save();$('dm').classList.remove('show');renderPermanent()}function resetPermanent(){if(!confirm('Сбросить постоянное расписание к базовому шаблону?'))return;permanent=JSON.parse(JSON.stringify(defaultPermanent));save();renderPermanent()}function renderStudents(){let q=($('search')?.value||'').toLowerCase(),a=students.filter(s=>s.name.toLowerCase().includes(q));$('tiles').innerHTML=a.map(s=>`<button class="tile" style="background:${s.color}" onclick="sel=${s.id};renderDetail()">${esc(s.name)}</button>`).join('');renderDetail()}function renderDetail(){let s=byId(sel)||students[0];if(!s)return $('detail').innerHTML='';sel=s.id;$('detail').innerHTML=`<div style="padding:12px"><h2>${esc(s.name)}</h2><div class="detail"><div class="d"><span>Время</span><b>${s.time||'—'}</b></div><div class="d"><span>Уровень</span><b>${esc(s.level||'—')}</b></div><div class="d"><span>Контакт</span><b>${esc(s.contact||'—')}</b></div><div class="d"><span>Заметка</span><b>${esc(s.note||'—')}</b></div></div></div>`}function renderPay(){if(ym()<MIN)anchor=new Date('2026-09-01T12:00:00');let m=ym();$('payPick').value=m;$('monthBtns').innerHTML=[0,1,2,3,4,5].map(i=>{let d=new Date(anchor.getFullYear(),anchor.getMonth()+i,1);return `<button class="monthbtn ${ym(d)===m?'active':''}" onclick="jumpPay('${ym(d)}')"><b>${d.toLocaleDateString('ru',{month:'short'})}</b><br><span class="muted">${d.getFullYear()}</span></button>`}).join('');let h='<div class="head">Ученик</div><div class="head">Стоимость 1 занятия</div><div class="head">8 занятий</div><div class="head">Оплачено</div>';students.forEach(s=>{let k=lk(m,s.id),x=ledger[k]||{},a=sessions(x);h+=`<div style="border-left:5px solid ${s.color}"><b>${esc(s.name)}</b></div><div><input class="input" type="number" placeholder="Стоимость" value="${x.price||''}" onchange="setMonthPrice('${k}',this.value)"></div><div><div class="marks">${a.map((z,i)=>`<div class="mark ${z.done?'done':''}"><input maxlength="2" value="${z.day||''}" placeholder="${i+1}" onchange="setDay('${k}',${i},this.value)"><button onclick="toggle('${k}',${i})">${z.done?'✓':'×'}</button></div>`).join('')}</div></div><div><input class="input" type="number" placeholder="0" value="${+x.amount||''}" onchange="setAmount('${k}',this.value)"></div>`});$('paygrid').innerHTML=h}function setMonthPrice(k,v){ledger[k]=ledger[k]||{};ledger[k].price=+v||0;save()}function setAmount(k,v){ledger[k]=ledger[k]||{};ledger[k].amount=+v||0;save()}function setDay(k,i,v){ledger[k]=ledger[k]||{};ledger[k].sessions=sessions(ledger[k]);ledger[k].sessions[i].day=String(v).replace(/\D/g,'').slice(0,2);save();renderCal()}function toggle(k,i){ledger[k]=ledger[k]||{};ledger[k].sessions=sessions(ledger[k]);ledger[k].sessions[i].done=!ledger[k].sessions[i].done;save();renderPay();renderCal();renderMake()}function renderCal(){let m=ym(calAnchor);$('calPick').value=m;$('legend').innerHTML=students.map(s=>`<span class="lg"><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('');let first=new Date(calAnchor.getFullYear(),calAnchor.getMonth(),1,12),start=new Date(first);start.setDate(first.getDate()-((first.getDay()+6)%7));let h=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(x=>`<div class="ch">${x}</div>`).join('');for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let inside=d.getMonth()===calAnchor.getMonth(),day=d.getDate(),done=[];if(inside)students.forEach(s=>{let a=sessions(ledger[lk(m,s.id)]||{});if(a.some(z=>z.done&&+z.day===day))done.push(s)});h+=`<div class="cd ${inside?'':'out'}"><b>${day}</b><div class="chips">${done.map(s=>`<div class="chip" style="background:${s.color}88">${esc(s.name)}</div>`).join('')}</div></div>`}$('calendar').innerHTML=h}function renderMake(){let rows=[];students.forEach(s=>Object.entries(ledger).forEach(([k,x])=>{let[m,id]=k.split('|');if(+id!=s.id||m<MIN||m>=ym(new Date()))return;let n=sessions(x).filter(z=>z.done).length;if((+x.amount||0)>0&&n<8)rows.push(`<div class="make"><div><b>${esc(s.name)}</b><div class="muted">${m} · осталось ${8-n}</div></div><button class="btn" onclick="jumpPay('${m}');show('payments')">Открыть</button></div>`)}));$('makeList').innerHTML=rows.join('')||'<div class="muted" style="padding:10px">Нет незакрытых уроков.</div>'}function renderNotices(){$('noticeList').innerHTML=notices.map(n=>`<div class="notice"><b>${esc(n.title)}</b><div>${esc(n.text)}</div></div>`).join('')||'<div class="muted">Нет напоминаний.</div>'}function openStudent(){['sn','st','sl','scon','snote'].forEach(id=>$(id).value='');$('sm').classList.add('show')}function saveStudent(){let s={id:Date.now(),name:$('sn').value.trim()||'Без имени',time:$('st').value,color:$('sc').value,level:$('sl').value,contact:$('scon').value,note:$('snote').value};students.push(s);sel=s.id;save();$('sm').classList.remove('show');renderAll()}function addNotice(){let title=prompt('Заголовок','Напоминание');if(title===null)return;let text=prompt('Текст','');if(text===null)return;notices.push({title,text});save();renderNotices()}function movePay(n){anchor=new Date(anchor.getFullYear(),anchor.getMonth()+n,1,12);if(ym()<MIN)anchor=new Date('2026-09-01T12:00:00');renderPay()}function jumpPay(v){if(v<MIN)v=MIN;anchor=new Date(v+'-01T12:00:00');renderPay()}function moveCal(n){calAnchor=new Date(calAnchor.getFullYear(),calAnchor.getMonth()+n,1,12);if(ym(calAnchor)<MIN)calAnchor=new Date('2026-09-01T12:00:00');renderCal()}function jumpCal(v){if(v<MIN)v=MIN;calAnchor=new Date(v+'-01T12:00:00');renderCal()}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===id));renderAll()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));function renderAll(){renderPermanent();renderCal();renderStudents();renderPay();renderMake();renderNotices()}renderAll();</script></body></html>
