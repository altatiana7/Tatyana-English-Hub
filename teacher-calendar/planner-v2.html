<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><title>Tatyana Planner</title><style>:root{--bg:#f6f3f1;--card:#fff;--line:#e4ddd8;--text:#29252a;--muted:#807770;--accent:#9c43c5;--soft:#f5ebfa;--school:#eef3f8;--private:#fbf0ff;--weekend:#fff7e9;--ok:#eaf5ee}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font:13px/1.3 Arial,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:145px 1fr;gap:8px;padding:8px}.side,.top,.card,.block{background:#fff;border:1px solid var(--line);border-radius:14px}.side{padding:10px 7px}.brand{font-weight:900;font-size:15px;padding:5px 8px 12px}.brand b{color:var(--accent)}.nav button{width:100%;border:0;background:none;text-align:left;padding:9px 8px;border-radius:8px;margin:2px 0;color:#6e6762;font-weight:800;cursor:pointer}.nav button.active{background:var(--soft);color:#812fa8}.view{display:none}.view.active{display:block}.top{padding:8px 10px;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}.top h2{font-size:14px;margin:0}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.schedwrap{display:grid;gap:8px}.block{overflow:hidden}.blocktitle{padding:7px 10px;font-weight:900;font-size:12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.blocktitle small{font-weight:700;color:var(--muted)}.gridwrap{overflow:auto}.sched{display:grid;background:#fff}.personalgrid{grid-template-columns:98px repeat(7,minmax(112px,1fr));min-width:920px}.schoolgrid{grid-template-columns:102px repeat(5,minmax(120px,1fr));min-width:760px}.cell,.timecell,.dayhead{border-right:1px solid #eee7e2;border-bottom:1px solid #eee7e2;min-height:38px;padding:5px}.dayhead{font-weight:900;text-align:center;background:#fff;display:flex;align-items:center;justify-content:center}.dayhead.weekend{background:#fff3df}.timecell{font-size:10px;font-weight:900;color:#5f5853;background:#fcfaf8;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap}.cell{white-space:pre-wrap;outline:none;font-weight:700}.privatecell{background:var(--private)}.privatecell.weekend{background:var(--weekend)}.schoolcell{background:var(--school)}.blocked{background:#eee;color:#aaa;pointer-events:none}.cell.editing{box-shadow:inset 0 0 0 2px #c889e5;background:#fff}.schoolbox{display:none}.schoolbox.open{display:block}.schooltoggle{display:flex;gap:8px;align-items:center}.section{padding:10px}.students{display:grid;grid-template-columns:280px 1fr;gap:8px}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}.tile{border:0;border-radius:9px;min-height:54px;font-weight:850;cursor:pointer}.input{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px}.detail{padding:12px}.boxgrid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:6px}.box{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff}.box span{display:block;color:var(--muted);font-size:10px}.table{display:grid;grid-template-columns:180px 120px 1fr 130px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.table>div{padding:7px;border-right:1px solid #eee7e2;border-bottom:1px solid #eee7e2}.head{font-size:10px;font-weight:900;color:var(--muted);background:#fcfaf8}.marks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.mark{border:1px solid var(--line);border-radius:7px;padding:4px;text-align:center}.mark input[type=text]{width:100%;border:0;border-bottom:1px solid #eee;text-align:center}.mark.done{background:var(--ok)}.attendance{display:grid;grid-template-columns:170px repeat(8,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.attendance>div{padding:7px;border-right:1px solid #eee7e2;border-bottom:1px solid #eee7e2}.attbox{text-align:center}.toolbar{display:flex;gap:6px;justify-content:flex-end;margin-bottom:7px}.muted{color:var(--muted);font-size:11px}@media(max-width:900px){.app{grid-template-columns:108px 1fr}.students{grid-template-columns:1fr}.table,.attendance{min-width:850px}.scroll{overflow:auto}}</style></head><body><div class="app"><aside class="side"><div class="brand">Tatyana <b>Planner</b></div><div class="nav"><button class="active" data-v="schedule">Schedule</button><button data-v="students">Students</button><button data-v="payments">Payments</button><button data-v="attendance">Attendance</button><button data-v="notes">Notes</button></div></aside><main><section id="schedule" class="view active"><div class="top"><h2>Личные уроки</h2><div class="schooltoggle"><span id="saveStatus" class="muted">Автосохранение включено</span><button id="schoolBtn" class="btn" onclick="toggleSchool()">Школьное расписание</button><button id="editBtn" class="btn primary" onclick="toggleEdit()">Edit</button></div></div><div class="schedwrap"><div id="schoolBox" class="block schoolbox"><div class="blocktitle">ШКОЛА <small>Пн–Пт</small></div><div class="gridwrap"><div id="schoolGrid" class="sched schoolgrid"></div></div></div><div class="block"><div class="blocktitle">ЛИЧНЫЕ УРОКИ <small>Пн–Пт с 14.00 · Сб–Вс с 10.00 · по 1 часу</small></div><div class="gridwrap"><div id="personalGrid" class="sched personalgrid"></div></div></div></div></section><section id="students" class="view"><div class="top"><span></span><button class="btn primary" onclick="addStudent()">+ Student</button></div><div class="students"><div class="card section"><input id="search" class="input" placeholder="Search" oninput="renderStudents()"><div id="tiles" class="tiles"></div></div><div id="detail" class="card detail"></div></div></section><section id="payments" class="view"><div class="toolbar"><input id="payMonth" type="month" class="btn" onchange="renderPayments()"></div><div class="scroll"><div id="payTable" class="table"></div></div></section><section id="attendance" class="view"><div class="toolbar"><input id="attMonth" type="month" class="btn" onchange="renderAttendance()"></div><div class="scroll"><div id="attTable" class="attendance"></div></div></section><section id="notes" class="view"><div class="card section"><textarea id="notesBox" class="input" style="min-height:420px;resize:vertical" placeholder="Notes..." oninput="localStorage.setItem('tp_notes',this.value)"></textarea></div></section></main></div><script>const days=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];const schoolDays=days.slice(0,5);const personalTimes=['10.00-11.00','11.00-12.00','12.00-13.00','13.00-14.00','14.00-15.00','15.00-16.00','16.00-17.00','17.00-18.00','18.00-19.00','19.00-20.00','20.00-21.00'];const school=['08:00–08:40','08:50–09:30','09:40–10:20','10:30–11:10','11:20–12:00','12:10–12:50','13:00–13:40','13:50–14:30'];const key='tp_schedule_v3';const backupKey=key+'_backup';let sched={};try{sched=JSON.parse(localStorage.getItem(key)||localStorage.getItem(backupKey)||sessionStorage.getItem(key)||'{}')}catch(e){}let editing=false;const mig='tp_personal_unified_v1';if(!localStorage.getItem(mig)){let moved={};for(let r=0;r<7;r++){for(let d=0;d<5;d++){let old='t|'+r+'|'+d;if(sched[old])moved['p|'+(r+4)+'|'+d]=sched[old]}}for(let r=0;r<11;r++){for(let d=0;d<2;d++){let old='w|'+r+'|'+d;if(sched[old])moved['p|'+r+'|'+(d+5)]=sched[old]}}Object.assign(sched,moved);persistSchedule();localStorage.setItem(mig,'1')}const seed=[{id:1,name:'Maya',time:'18:00',color:'#c9b8ff',level:'A2'},{id:2,name:'Nikita',time:'17:00',color:'#bfe8db',level:'A2+/B1'},{id:3,name:'Gabi',time:'12:00',color:'#ffc8bd',level:''}];let students=JSON.parse(localStorage.getItem('crm_students')||'null')||seed;let ledger=JSON.parse(localStorage.getItem('crm_ledger')||'{}');let selected=students[0]?.id;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function sk(kind,r,d){return kind+'|'+r+'|'+d}
function setSaveStatus(t){let el=document.getElementById('saveStatus');if(el){el.textContent=t;clearTimeout(setSaveStatus._t);setSaveStatus._t=setTimeout(()=>el.textContent='Автосохранение включено',1200)}}
function persistSchedule(){
  const raw=JSON.stringify(sched);
  try{localStorage.setItem(key,raw);localStorage.setItem(backupKey,raw);sessionStorage.setItem(key,raw)}catch(e){}
  try{
    const req=indexedDB.open('tatyana_planner_db',1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('planner'))db.createObjectStore('planner')};
    req.onsuccess=()=>{const db=req.result;const tx=db.transaction('planner','readwrite');tx.objectStore('planner').put(raw,key);tx.oncomplete=()=>db.close()}
  }catch(e){}
  setSaveStatus('Сохранено');
}
function restoreFromIndexedDBIfNeeded(){
  if(Object.keys(sched).length)return;
  try{
    const req=indexedDB.open('tatyana_planner_db',1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains('planner'))db.createObjectStore('planner')};
    req.onsuccess=()=>{const db=req.result;const tx=db.transaction('planner','readonly');const g=tx.objectStore('planner').get(key);g.onsuccess=()=>{if(g.result){try{sched=JSON.parse(g.result)||{};persistSchedule();renderSchedule()}catch(e){}};tx.oncomplete=()=>db.close()}
  }catch(e){}
}function renderPersonal(){let h='<div class="timecell"></div>'+days.map((d,di)=>`<div class="dayhead ${di>4?'weekend':''}">${d}</div>`).join('');personalTimes.forEach((t,r)=>{h+=`<div class="timecell">${t}</div>`;days.forEach((d,di)=>{if(di<5&&r<4){h+='<div class="cell blocked"></div>';return}let k=sk('p',r,di);h+=`<div class="cell privatecell ${di>4?'weekend':''} ${editing?'editing':''}" data-k="${k}" ${editing?'contenteditable="true"':''}>${esc(sched[k]||'')}</div>`})});$('personalGrid').innerHTML=h}function renderSchool(){let h='<div class="timecell"></div>'+schoolDays.map(d=>`<div class="dayhead">${d}</div>`).join('');school.forEach((t,r)=>{h+=`<div class="timecell">${t}</div>`;schoolDays.forEach((d,di)=>{let k=sk('s',r,di);h+=`<div class="cell schoolcell ${editing?'editing':''}" data-k="${k}" ${editing?'contenteditable="true"':''}>${esc(sched[k]||'')}</div>`})});$('schoolGrid').innerHTML=h}function renderSchedule(){renderPersonal();renderSchool()}function toggleSchool(){let b=$('schoolBox');b.classList.toggle('open');$('schoolBtn').textContent=b.classList.contains('open')?'Скрыть школьное':'Школьное расписание'}function toggleEdit(){if(!editing){editing=true;$('editBtn').textContent='Save';renderSchedule();return}document.querySelectorAll('[data-k]').forEach(el=>sched[el.dataset.k]=el.innerText.trim());persistSchedule();editing=false;$('editBtn').textContent='Edit';renderSchedule()}function renderStudents(){let q=($('search').value||'').toLowerCase(),a=students.filter(s=>s.name.toLowerCase().includes(q));$('tiles').innerHTML=a.map(s=>`<button class="tile" style="background:${s.color||'#eee'}" onclick="selected=${s.id};renderDetail()">${esc(s.name)}</button>`).join('');renderDetail()}function renderDetail(){let s=students.find(x=>x.id==selected)||students[0];if(!s)return $('detail').innerHTML='<span class="muted">No students yet.</span>';$('detail').innerHTML=`<h2 style="margin-top:0">${esc(s.name)}</h2><div class="boxgrid"><div class="box"><span>Regular time</span><b>${esc(s.time||'—')}</b></div><div class="box"><span>Level</span><b>${esc(s.level||'—')}</b></div><div class="box"><span>Contact</span><b>${esc(s.contact||'—')}</b></div><div class="box"><span>Notes</span><b>${esc(s.note||'—')}</b></div></div>`}function addStudent(){let name=prompt('Student name');if(!name)return;let time=prompt('Regular time','');students.push({id:Date.now(),name,time,color:'#d7c3f0',level:'',contact:'',note:''});selected=students.at(-1).id;localStorage.setItem('crm_students',JSON.stringify(students));renderStudents();renderPayments();renderAttendance()}function monthNow(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function sessions(x){let a=Array.isArray(x.sessions)?x.sessions.slice(0,8):[];while(a.length<8)a.push({day:'',done:false});return a}function renderPayments(){let m=$('payMonth').value||monthNow();$('payMonth').value=m;let h='<div class="head">Student</div><div class="head">Price / lesson</div><div class="head">8 lessons</div><div class="head">Paid</div>';students.forEach(s=>{let k=m+'|'+s.id,x=ledger[k]||{},a=sessions(x);h+=`<div><b>${esc(s.name)}</b></div><div><input class="input" type="number" value="${x.price||''}" onchange="setLedger('${k}','price',this.value)"></div><div><div class="marks">${a.map((z,i)=>`<div class="mark ${z.done?'done':''}"><input type="text" maxlength="2" value="${z.day||''}" placeholder="${i+1}" onchange="setDay('${k}',${i},this.value)"><div><input type="checkbox" ${z.done?'checked':''} onchange="setDone('${k}',${i},this.checked)"></div></div>`).join('')}</div></div><div><input class="input" type="number" value="${x.amount||''}" onchange="setLedger('${k}','amount',this.value)"></div>`});$('payTable').innerHTML=h}function setLedger(k,f,v){ledger[k]=ledger[k]||{};ledger[k][f]=+v||0;saveLedger()}function setDay(k,i,v){ledger[k]=ledger[k]||{};ledger[k].sessions=sessions(ledger[k]);ledger[k].sessions[i].day=String(v).replace(/\D/g,'').slice(0,2);saveLedger();renderAttendance()}function setDone(k,i,v){ledger[k]=ledger[k]||{};ledger[k].sessions=sessions(ledger[k]);ledger[k].sessions[i].done=v;saveLedger();renderPayments();renderAttendance()}function saveLedger(){localStorage.setItem('crm_ledger',JSON.stringify(ledger))}function renderAttendance(){let m=$('attMonth').value||monthNow();$('attMonth').value=m;let h='<div class="head">Student</div>'+Array.from({length:8},(_,i)=>`<div class="head">#${i+1}</div>`).join('');students.forEach(s=>{let k=m+'|'+s.id,a=sessions(ledger[k]||{});h+=`<div><b>${esc(s.name)}</b></div>`+a.map((z,i)=>`<div class="attbox"><div class="muted">${z.day?z.day:''}</div><input type="checkbox" ${z.done?'checked':''} onchange="setDone('${k}',${i},this.checked)"></div>`).join('')});$('attTable').innerHTML=h}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===id));if(id==='students')renderStudents();if(id==='payments')renderPayments();if(id==='attendance')renderAttendance()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));$('notesBox').value=localStorage.getItem('tp_notes')||'';
document.addEventListener('input',e=>{const el=e.target.closest&&e.target.closest('[data-k]');if(!el||!editing)return;sched[el.dataset.k]=el.innerText.trim();persistSchedule()});
window.addEventListener('beforeunload',()=>{if(editing){document.querySelectorAll('[data-k]').forEach(el=>sched[el.dataset.k]=el.innerText.trim());persistSchedule()}});
renderSchedule();restoreFromIndexedDBIfNeeded();renderStudents();renderPayments();renderAttendance();</script></body></html>
