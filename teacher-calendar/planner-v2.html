<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Планнер Татьяны</title><style>:root{--bg:#f7f3ef;--card:#fff;--line:#e6ddd5;--text:#2b2729;--muted:#847b75;--accent:#a843d1;--soft:#f6ecfb;--school:#eef3f8;--tutor:#fbf0ff}*{box-sizing:border-box}body{margin:0;font:13px/1.35 Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,textarea{font:inherit}.wrap{padding:16px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.title h1{margin:0;font-size:26px}.title p{margin:4px 0 0;color:var(--muted)}.week{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.day{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:520px}.head{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--line)}.head b{font-size:15px}.edit{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-weight:800;cursor:pointer}.zone{padding:12px}.school{background:var(--school)}.tutor{background:var(--tutor)}.zh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.zh strong{font-size:13px}.time{font-size:11px;color:var(--muted);font-weight:800}.entry{background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px;min-height:150px;white-space:pre-wrap}.empty{color:#aaa;font-style:italic}.gap{height:14px;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.modalbg{position:fixed;inset:0;background:#0005;display:none;align-items:center;justify-content:center;padding:16px}.modalbg.show{display:flex}.modal{background:#fff;width:min(620px,96vw);border-radius:16px;padding:16px}.modal h2{margin-top:0}.label{font-weight:800;margin:10px 0 5px}.modal textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:10px;resize:vertical}.foot{text-align:right;margin-top:10px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 10px;font-weight:800;cursor:pointer}.primary{background:var(--accent);border-color:var(--accent);color:#fff}@media(max-width:1100px){.week{grid-template-columns:repeat(3,1fr)}}@media(max-width:760px){.week{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><div class="title"><h1>Постоянное расписание</h1><p>Понедельник–Пятница · без дат и месяцев</p></div></div><div id="week" class="week"></div></div><div id="modal" class="modalbg"><div class="modal"><h2 id="mt">Редактировать день</h2><div class="label">Школа · 08:00–15:00</div><textarea id="school"></textarea><div class="label">Репетиторство · 15:00–20:00</div><textarea id="tutor"></textarea><div class="foot"><button class="btn" onclick="closeM()">Отмена</button> <button class="btn primary" onclick="saveDay()">Сохранить</button></div></div></div><script>const days=['Понедельник','Вторник','Среда','Четверг','Пятница'];const defaults=Object.fromEntries(days.map(d=>[d,{school:'Школа',tutor:''}]));let data=JSON.parse(localStorage.getItem('planner_permanent_v2')||'null')||defaults;let current='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){document.getElementById('week').innerHTML=days.map(d=>{const x=data[d]||{school:'Школа',tutor:''};return `<section class="day"><div class="head"><b>${d}</b><button class="edit" onclick="editDay('${d}')">Редактировать</button></div><div class="zone school"><div class="zh"><strong>Школа</strong><span class="time">08:00–15:00</span></div><div class="entry ${x.school?'':'empty'}">${x.school?esc(x.school):'Нет записей'}</div></div><div class="gap"></div><div class="zone tutor"><div class="zh"><strong>Репетиторство</strong><span class="time">15:00–20:00</span></div><div class="entry ${x.tutor?'':'empty'}">${x.tutor?esc(x.tutor):'Добавьте учеников и время'}</div></div></section>`}).join('')}function editDay(d){current=d;document.getElementById('mt').textContent='Редактировать: '+d;document.getElementById('school').value=data[d]?.school||'';document.getElementById('tutor').value=data[d]?.tutor||'';document.getElementById('modal').classList.add('show')}function closeM(){document.getElementById('modal').classList.remove('show')}function saveDay(){data[current]={school:document.getElementById('school').value.trim(),tutor:document.getElementById('tutor').value.trim()};localStorage.setItem('planner_permanent_v2',JSON.stringify(data));closeM();render()}render();</script></body></html>
