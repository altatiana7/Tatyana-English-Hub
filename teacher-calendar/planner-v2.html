<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Tatyana Planner</title><style>:root{--bg:#f6f3f1;--card:#fff;--line:#e7ded8;--text:#29252a;--muted:#857c76;--accent:#a74bd1;--soft:#f7effb;--a:#eef3f8;--b:#fbf0ff;--ok:#eaf5ee}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{font:13px/1.35 Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:145px 1fr;gap:8px;padding:8px}.side,.top,.card{background:#fff;border:1px solid var(--line);border-radius:14px}.side{padding:10px 7px}.brand{font-weight:900;font-size:15px;padding:5px 8px 12px}.brand b{color:var(--accent)}.nav button{width:100%;border:0;background:none;text-align:left;padding:9px 8px;border-radius:8px;margin:2px 0;color:#6e6762;font-weight:800;cursor:pointer}.nav button.active{background:var(--soft);color:#812fa8}.view{display:none}.view.active{display:block}.top{padding:9px 10px;margin-bottom:7px;display:flex;align-items:center;justify-content:flex-end}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;font-weight:800;cursor:pointer}.primary{background:var(--accent);color:white;border-color:var(--accent)}.schedule{display:grid;grid-template-columns:92px repeat(5,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.cell,.timecell,.dayhead{border-right:1px solid #eee7e2;border-bottom:1px solid #eee7e2;min-height:42px;padding:6px}.dayhead{font-weight:900;text-align:center;background:#fff}.timecell{font-size:10px;font-weight:800;color:#6d655f;background:#fcfaf8;display:flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap}.cell{background:var(--a);white-space:pre-wrap;outline:none}.cell.tutor{background:var(--b)}.cell.editing{box-shadow:inset 0 0 0 2px #c889e5;background:#fff}.gaprow{grid-column:1/-1;height:12px;background:var(--bg);border-bottom:1px solid var(--line)}.section{padding:10px}.students{display:grid;grid-template-columns:280px 1fr;gap:8px}.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-top:8px}.tile{border:0;border-radius:9px;min-height:54px;font-weight:850;cursor:pointer}.input{width:100%;padding:7px;border:1px solid var(--line);border-radius:8px}.detail{padding:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:6px}.box{border:1px solid var(--line);border-radius:9px;padding:8px;background:#fff}.box span{display:block;color:var(--muted);font-size:10px}.table{display:grid;grid-template-columns:180px 120px 1fr 130px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.table>div{padding:7px;border-right:1px solid #eee7e2;border-bottom:1px solid #eee7e2}.head{font-size:10px;font-weight:900;color:var(--muted);background:#fcfaf8}.marks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.mark{border:1px solid var(--line);border-radius:7px;padding:4px;text-align:center}.mark input[type=text]{width:100%;border:0;border-bottom:1px solid #eee;text-align:center}.mark.done{background:var(--ok)}.attendance{display:grid;grid-template-columns:170px repeat(8,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}.attendance>div{padding:7px;border-right:1px solid #eee7e2;border-bottom:1px solid #eee7e2}.attbox{text-align:center}.attbox input{transform:scale(1.2)}.toolbar{display:flex;gap:6px;justify-content:flex-end;margin-bottom:7px}.muted{color:var(--muted);font-size:11px}@media(max-width:1050px){.app{grid-template-columns:120px 1fr}.schedule{min-width:920px}.schedwrap{overflow:auto}.students{grid-template-columns:1fr}.table,.attendance{min-width:850px}.scroll{overflow:auto}}</style></head><body><div class="app"><aside class="side"><div class="brand">Tatyana <b>Planner</b></div><div class="nav"><button class="active" data-v="schedule">Schedule</button><button data-v="students">Students</button><button data-v="payments">Payments</button><button data-v="attendance">Attendance</button><button data-v="notes">Notes</button></div></aside><main><section id="schedule" class="view active"><div class="top"><button id="editBtn" class="btn primary" onclick="toggleEdit()">Edit</button></div><div class="schedwrap"><div id="scheduleGrid" class="schedule"></div></div></section><section id="students" class="view"><div class="top"><button class="btn primary" onclick="addStudent()">+ Student</button></div><div class="students"><div class="card section"><input id="search" class="input" placeholder="Search" oninput="renderStudents()"><div id="tiles" class="tiles"></div></div><div id="detail" class="card detail"></div></div></section><section id="payments" class="view"><div class="toolbar"><input id="payMonth" type="month" class="btn" onchange="renderPayments()"></div><div class="scroll"><div id="payTable" class="table"></div></div></section><section id="attendance" class="view"><div class="toolbar"><input id="attMonth" type="month" class="btn" onchange="renderAttendance()"></div><div class="scroll"><div id="attTable" class="attendance"></div></div></section><section id="notes" class="view"><div class="card section"><textarea id="notesBox" class="input" style="min-height:420px;resize:vertical" placeholder="Notes..." oninput="localStorage.setItem('tp_notes',this.value)"></textarea></div></section></main></div><script>const days=['Monday','Tuesday','Wednesday','Thursday','Friday'];const school=['08:00–08:40','08:50–09:30','09:40–10:20','10:30–11:10','11:20–12:00','12:10–12:50','13:00–13:40','13:50–14:30'];const tutor=['15:00','16:00','17:00','18:00','19:00','20:00'];const key='tp_schedule_v3';let sched=JSON.parse(localStorage.getItem(key)||'{}'),editing=false;const seed=[{id:1,name:'Maya',time:'18:00',color:'#c9b8ff',level:'A2'},{id:2,name:'Nikita',time:'17:00',color:'#bfe8db',level:'A2+/B1'},{id:3,name:'Gabi',time:'12:00',color:'#ffc8bd',level:''}];let students=JSON.parse(localStorage.getItem('crm_students')||'null')||seed;let ledger=JSON.parse(localStorage.getItem('crm_ledger')||'{}');let selected=students[0]?.id;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function slotKey(kind,r,d){return kind+'|'+r+'|'+d}function renderSchedule(){let h='<div class="timecell"></div>'+days.map(d=>`<div class="dayhead">${d}</div>`).join('');school.forEach((t,r)=>{h+=`<div class="timecell">${t}</div>`;days.forEach((d,di)=>{let k=slotKey('s',r,di);h+=`<div class="cell ${editing?'editing':''}" data-k="${k}" ${editing?'contenteditable="true"':''}>${esc(sched[k]||'')}</div>`})});h+='<div class="gaprow"></div>';tutor.forEach((t,r)=>{h+=`<div class="timecell">${t}</div>`;days.forEach((d,di)=>{let k=slotKey('t',r,di);h+=`<div class="cell tutor ${editing?'editing':''}" data-k="${k}" ${editing?'contenteditable="true"':''}>${esc(sched[k]||'')}</div>`})});$('scheduleGrid').innerHTML=h}function toggleEdit(){if(!editing){editing=true;$('editBtn').textContent='Save';renderSchedule();return}document.querySelectorAll('[data-k]').forEach(el=>sched[el.dataset.k]=el.innerText.trim());localStorage.setItem(key,JSON.stringify(sched));editing=false;$('editBtn').textContent='Edit';renderSchedule()}function renderStudents(){let q=($('search').value||'').toLowerCase(),a=students.filter(s=>s.name.toLowerCase().includes(q));$('tiles').innerHTML=a.map(s=>`<button class="tile" style="background:${s.color||'#eee'}" onclick="selected=${s.id};renderDetail()">${esc(s.name)}</button>`).join('');renderDetail()}function renderDetail(){let s=students.find(x=>x.id==selected)||students[0];if(!s)return $('detail').innerHTML='<span class="muted">No students yet.</span>';$('detail').innerHTML=`<h2 style="margin-top:0">${esc(s.name)}</h2><div class="grid"><div class="box"><span>Regular time</span><b>${esc(s.time||'—')}</b></div><div class="box"><span>Level</span><b>${esc(s.level||'—')}</b></div><div class="box"><span>Contact</span><b>${esc(s.contact||'—')}</b></div><div class="box"><span>Notes</span><b>${esc(s.note||'—')}</b></div></div>`}function addStudent(){let name=prompt('Student name');if(!name)return;let time=prompt('Regular time','');students.push({id:Date.now(),name,time,color:'#d7c3f0',level:'',contact:'',note:''});selected=students.at(-1).id;localStorage.setItem('crm_students',JSON.stringify(students));renderStudents();renderPayments();renderAttendance()}function monthNow(){let d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}function sessions(x){let a=Array.isArray(x.sessions)?x.sessions.slice(0,8):[];while(a.length<8)a.push({day:'',done:false});return a}function renderPayments(){let m=$('payMonth').value||monthNow();$('payMonth').value=m;let h='<div class="head">Student</div><div class="head">Price / lesson</div><div class="head">8 lessons</div><div class="head">Paid</div>';students.forEach(s=>{let k=m+'|'+s.id,x=ledger[k]||{},a=sessions(x);h+=`<div><b>${esc(s.name)}</b></div><div><input class="input" type="number" value="${x.price||''}" onchange="setLedger('${k}','price',this.value)"></div><div><div class="marks">${a.map((z,i)=>`<div class="mark ${z.done?'done':''}"><input type="text" maxlength="2" value="${z.day||''}" placeholder="${i+1}" onchange="setDay('${k}',${i},this.value)"><div><input type="checkbox" ${z.done?'checked':''} onchange="setDone('${k}',${i},this.checked)"></div></div>`).join('')}</div></div><div><input class="input" type="number" value="${x.amount||''}" onchange="setLedger('${k}','amount',this.value)"></div>`});$('payTable').innerHTML=h}function setLedger(k,f,v){ledger[k]=ledger[k]||{};ledger[k][f]=+v||0;saveLedger()}function setDay(k,i,v){ledger[k]=ledger[k]||{};ledger[k].sessions=sessions(ledger[k]);ledger[k].sessions[i].day=String(v).replace(/\D/g,'').slice(0,2);saveLedger();renderAttendance()}function setDone(k,i,v){ledger[k]=ledger[k]||{};ledger[k].sessions=sessions(ledger[k]);ledger[k].sessions[i].done=v;saveLedger();renderPayments();renderAttendance()}function saveLedger(){localStorage.setItem('crm_ledger',JSON.stringify(ledger))}function renderAttendance(){let m=$('attMonth').value||monthNow();$('attMonth').value=m;let h='<div class="head">Student</div>'+Array.from({length:8},(_,i)=>`<div class="head">#${i+1}</div>`).join('');students.forEach(s=>{let k=m+'|'+s.id,a=sessions(ledger[k]||{});h+=`<div><b>${esc(s.name)}</b></div>`+a.map((z,i)=>`<div class="attbox"><div class="muted">${z.day?z.day:''}</div><input type="checkbox" ${z.done?'checked':''} onchange="setDone('${k}',${i},this.checked)"></div>`).join('')});$('attTable').innerHTML=h}function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id===id));document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===id));if(id==='students')renderStudents();if(id==='payments')renderPayments();if(id==='attendance')renderAttendance()}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));$('notesBox').value=localStorage.getItem('tp_notes')||'';renderSchedule();renderStudents();renderPayments();renderAttendance();</script></body></html>
