<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotlight 11 · Brief Check-in</title>
<style>
:root{--ink:#173332;--teal:#006a68;--lime:#d9f16d;--paper:#f5f3eb;--line:#17333225;--good:#17683d;--bad:#9b2f24}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #df4e32;outline-offset:3px}
header{height:46px;padding:0 2.2vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{font-weight:900;letter-spacing:-.5px;font-size:19px}.brand span{background:var(--lime);padding:3px 7px;border-radius:6px;margin-left:5px}.small{font-size:12px;letter-spacing:2px;font-weight:bold}
.tools{display:flex;gap:8px;align-items:center}.tools button,.tools a,.back{background:transparent;border:1px solid #17333240;border-radius:30px;padding:.4em .9em;font-size:clamp(14px,1.2vw,21px);line-height:1.2;color:inherit;text-decoration:none;white-space:nowrap}body.inStage header{display:none}
.home{height:calc(100svh - 46px);display:flex;flex-direction:column}.hero{position:relative;min-height:310px;flex:1;background:url(cover.webp) center 47%/cover;display:flex;align-items:center}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#f5f3ebe8,transparent 68%)}.copy{position:relative;padding:30px 4vw;width:60%}
.eyebrow,.tag{display:inline-block;background:var(--teal);color:white;padding:9px 13px;border-radius:6px;font-size:11px;letter-spacing:1.6px;font-weight:800}
h1{font-size:clamp(54px,6.5vw,105px);line-height:.93;letter-spacing:-5px;margin:21px 0}h1 em{font-style:normal;color:var(--teal)}.lead{font-size:18px;line-height:1.5;margin:0;max-width:430px}
.navwrap{padding:22px 4vw 18px}.navlabel{display:flex;justify-content:space-between;margin-bottom:13px;font-size:12px;letter-spacing:1.6px;font-weight:bold}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{border:0;text-align:left;border-radius:16px;padding:18px;min-height:137px;background:#e5e9df;color:var(--ink);transition:.2s;position:relative}
.card:nth-child(2){background:#ddebe7}.card:nth-child(3){background:#e7e1ef}.card:nth-child(4){background:#efdccf}.card:nth-child(5){background:var(--lime)}.card:hover{transform:translateY(-5px);background:var(--ink);color:white}
.number{font-size:12px;opacity:.7;display:block;margin-bottom:16px}.card strong{font-size:clamp(19px,1.8vw,29px);line-height:1.04;display:block;letter-spacing:-.7px}.arrow{position:absolute;top:16px;right:18px;font-size:23px}.foot{font-size:11px;margin-top:13px;display:flex;justify-content:space-between;opacity:.7}
.stage{display:none;height:100svh;padding:6px 1.4vw 10px;overflow:hidden}.stage.active{display:flex;flex-direction:column}.stagebar{display:flex;align-items:center;justify-content:flex-start;gap:8px;flex:0 0 auto;min-height:36px;padding-bottom:6px;margin-bottom:8px;border-bottom:1px solid var(--line)}.stagebar .spacer{flex:1}
.stage h2{font-size:clamp(19px,1.7vw,30px);letter-spacing:-.3px;margin:0 6px 0 2px;white-space:nowrap}.vlabel{font-size:clamp(14px,1.2vw,20px);color:#55706a;white-space:nowrap}
.variants{display:flex;gap:4px;overflow-x:auto;padding:2px 0;flex:0 1 auto;min-width:0;scrollbar-width:none;align-items:center}.variant{flex:0 0 auto;border:1px solid #17333235;background:white;border-radius:999px;min-width:clamp(30px,2.55vw,46px);height:clamp(30px,2.55vw,46px);padding:0 6px;white-space:nowrap;font-weight:800;font-size:clamp(14px,1.25vw,22px);line-height:1}.variant.active{background:var(--teal);border-color:var(--teal);color:white}
.workspace{min-height:0;flex:1;display:grid;gap:12px}.practiceWorkspace{grid-template-columns:minmax(300px,.66fr) minmax(0,1.34fr)}.listenWorkspace{display:block}.panel{min-height:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;flex-direction:column}
.panelHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.panelHead strong{font-size:18px}.meta{font-size:12px;color:#60736f}
.taskFrame{width:100%;min-height:0;flex:1;border:0;border-radius:10px;background:#eee}.fallback{font-size:12px;margin-top:8px;color:#60736f}.fallback a{color:var(--teal);font-weight:bold}
.answerList{overflow:auto;min-height:0;padding-right:2px;max-width:520px}.answerRow{display:grid;grid-template-columns:32px 1fr;gap:5px;align-items:center;margin-bottom:4px}.answerRow label{font-weight:900;text-align:center;font-size:11px}
.answerRow input{width:100%;border:1px solid #a9b9ae;border-radius:8px;padding:8px 9px;background:#fbfcfa}.answerRow input.correct{border-color:var(--good);background:#eef8f1}.answerRow input.wrong{border-color:var(--bad);background:#fff2f0}
.feedback{grid-column:2;font-size:11px;min-height:12px;margin-top:-4px}.feedback.ok{color:var(--good)}.feedback.no{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.action{border:0;background:var(--teal);color:white;padding:11px 16px;border-radius:10px;font-weight:bold}.action.alt{background:var(--lime);color:var(--ink)}.score{margin-left:auto;align-self:center;font-weight:900}
.audioPanel{width:100%;max-width:min(92vw,900px);font-size:clamp(18px,1.7vw,30px);background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.audioDock{position:static;align-self:start}.audioTitle{font-size:2em;letter-spacing:-1px;margin:.1em 0 .1em}.audioMeta,.note{color:#60736f}.audioMeta{margin:0 0 .5em;font-size:.8em}audio{width:100%}.note{font-size:.8em;line-height:1.4}.audioPanel .action{font-size:1em;padding:.55em 1em;text-decoration:none}.listenPanel{overflow:auto;min-height:0}.qnum{flex:0 0 auto;width:1.7em;height:1.7em;border-radius:.3em;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;font-size:.85em;font-weight:900}
.instr{font-size:.72em;color:var(--teal);font-weight:800;margin:0 0 .5em}
.qGrid{display:grid;grid-template-columns:1fr 1fr;gap:.5em}.qCard{background:#fff;border:1px solid var(--line);border-radius:.5em;padding:.5em .6em;display:grid;grid-template-columns:auto 1fr;gap:.5em;align-items:start}
.qstem{font-weight:800;line-height:1.18;margin-bottom:.3em}.opts{display:grid;gap:.12em}.opt{display:flex;gap:.45em;align-items:flex-start;line-height:1.22;cursor:pointer;border-radius:.3em;padding:.05em .25em}.opt:hover{background:#eef4ef}.opt input{flex:0 0 auto;width:.85em;height:.85em;margin:.2em 0 0;accent-color:var(--teal)}
.board{background:#fff;border:1px solid var(--line);border-radius:.5em;padding:.6em .8em}
.topicList{display:grid;grid-template-columns:1fr 1fr;gap:.35em 1.2em;line-height:1.2;margin-bottom:.8em;font-size:1.12em}.topicList strong{color:var(--teal)}
.speakerGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:.4em}.speakerBox{background:#f4f7f3;border-radius:.4em;padding:.4em;text-align:center}.speakerBox label{display:block;font-weight:900;margin-bottom:.25em}.speakerBox select{width:100%;border:2px solid #a9b9ae;border-radius:.3em;padding:.15em;background:#fff;font-size:1.15em;font-weight:800;text-align:center}
.fieldList{display:grid;gap:.4em}.fieldRow{display:grid;grid-template-columns:auto minmax(0,1.25fr) minmax(0,1fr) auto;gap:.5em;align-items:center}.fieldRow strong{line-height:1.15}.fieldRow input{width:100%;border:2px solid #a9b9ae;border-radius:.3em;padding:.2em .4em;background:#fbfcfa;font-size:1em}.suffix{font-size:.8em;color:#60736f;white-space:nowrap}
.partTabs{display:flex;gap:6px}.partTab{border:1px solid #17333235;background:#fff;border-radius:999px;padding:.4em .9em;font-weight:800;font-size:clamp(14px,1.25vw,22px);white-space:nowrap;color:inherit}.partTab.active{background:var(--teal);border-color:var(--teal);color:#fff}
.fullTaskOverlay{position:fixed;inset:0;background:var(--paper);z-index:9999;display:none;flex-direction:column;padding:6px 1.4vw 8px}.fullTaskOverlay.open{display:flex}.fullTaskTop{display:flex;align-items:center;justify-content:flex-start;gap:10px;margin-bottom:6px;flex:0 0 auto;min-height:36px}.fullTaskTop strong{font-size:clamp(19px,1.7vw,30px);white-space:nowrap}.audioSlot{flex:1;min-width:0;display:flex;justify-content:flex-end}.audioSlot audio{width:100%;max-width:520px;height:34px}.fullTaskBody{flex:1;min-height:0;overflow:auto;font-size:30px}.part{display:none}.part.active{display:block}.listenActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.empty{margin:auto;max-width:700px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;text-align:center}.empty h3{font-size:31px;margin:0 0 8px}.empty p{color:#60736f;line-height:1.55}.hidden{display:none!important}
@media(max-width:900px){.qGrid{grid-template-columns:1fr}.stage h2{display:none}.workspace,.practiceWorkspace,.listenWorkspace{grid-template-columns:1fr;overflow:auto}.panel{min-height:auto}.taskFrame{min-height:52svh}.stage{overflow:auto}.audioPanel{max-width:none}.fullTaskOverlay{padding:10px}}
@media(max-width:750px){header{height:46px}.small{display:none}.brand{font-size:21px}.tools a{display:none}.home{height:auto;min-height:calc(100svh - 46px)}.hero{min-height:430px;background-position:60% center}.hero:before{background:linear-gradient(90deg,#f5f3ebed,#f5f3eb60)}.copy{width:85%;padding:30px 5vw}h1{font-size:65px;letter-spacing:-3px}.cards{grid-template-columns:repeat(2,1fr)}.card:last-child{grid-column:span 2}.card{min-height:120px}}
@media(min-width:751px) and (max-height:700px){h1{font-size:64px}.hero{min-height:240px}.card{min-height:110px;padding:13px}.number{margin-bottom:10px}.navwrap{padding-top:14px;padding-bottom:10px}.copy{padding-top:18px;padding-bottom:18px}.lead{font-size:16px}}
</style>
</head>
<body>
<header><div class="brand">SPOTLIGHT <span>11</span></div><div class="small">ENGLISH / BRIEF CHECK-IN</div><div class="tools"><a href="../spotlight-brief-check/">All grades</a><button id="fullscreen">Full screen</button></div></header>

<main id="home" class="home">
<section class="hero"><div class="copy"><div class="eyebrow">YOUR VOICE. YOUR NEXT LEVEL.</div><h1>Brief<br><em>check-in.</em></h1><p class="lead">Tune in. Find your words. Make it click.<br>Five ways to get your English moving.</p></div></section>
<nav class="navwrap" aria-label="Lesson sections"><div class="navlabel"><span>CHOOSE YOUR FOCUS</span><span>5 SECTIONS</span></div><div class="cards" id="cards"></div><div class="foot"><span>GRADE 11 · ENGLISH</span><span>Independent companion for Spotlight 11</span></div></nav>
</main>

<section id="stage" class="stage" aria-labelledby="sectionTitle">
<div class="stagebar"><button class="back" id="back">← Cover</button><h2 id="sectionTitle"></h2><span class="vlabel" id="variantLabel">Variant</span><div id="variantBar" class="variants"></div><span class="spacer"></span><button class="back" id="fullscreen2">Full screen</button></div>
<div id="stageBody" class="workspace"></div>
</section>
<div id="fullTaskOverlay" class="fullTaskOverlay" aria-hidden="true"><div class="fullTaskTop"><button class="back" id="closeFullTask">← Close tasks</button><strong id="fullTaskTitle">Listening tasks</strong><div class="partTabs" id="partTabs"></div><div class="audioSlot" id="audioSlot"></div></div><div id="fullTaskBody" class="fullTaskBody"></div></div>

<script src="data.js"></script>
<script src="listening-data.js"></script>
<script>
const sections=[
 ['Listening','TUNE IN','Tasks 1–11 from the supplied PDF + full listening tracks: variants 2–20.'],
 ['Vocabulary','FIND YOUR WORDS','Vocabulary practice stays as a separate section.'],
 ['Grammar','MAKE IT CLICK','Tasks 20–28: transform the given word or phrase.'],
 ['Word Formation','BUILD A NEW WORD','Tasks 29–34: form a new word that fits the context.'],
 ['Lesson Check-up','OWN YOUR PROGRESS','A compact mixed check-up area.']
];
const $=id=>document.getElementById(id), BANK=window.SPOTLIGHT11_BANK, LISTEN=window.SPOTLIGHT11_LISTENING||{};
let current=0,currentVariant=1;
$('cards').innerHTML=sections.map((s,i)=>`<button class="card" data-index="${i}"><span class="number">0${i+1} / ${s[1]}</span><span class="arrow">↗</span><strong>${s[0]}</strong></button>`).join('');
document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{current=+b.dataset.index;currentVariant=current===0?2:1;$('sectionTitle').textContent=sections[current][0];$('home').style.display='none';document.body.classList.add('inStage');$('stage').classList.add('active');renderSection();$('back').focus()});
$('back').onclick=home;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('stage').classList.contains('active')&&!$('fullTaskOverlay').classList.contains('open'))home()});
function home(){closeTasks();$('stageBody').innerHTML='';document.body.classList.remove('inStage');$('stage').classList.remove('active');$('home').style.display='flex';document.querySelectorAll('[data-index]')[current].focus()}
$('fullscreen').onclick=$('fullscreen2').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=$('fullscreen2').textContent=document.fullscreenElement?'Exit full screen':'Full screen'});

function variants(){return current===0?Object.keys(BANK.audio).map(Number):(current===2||current===3?Array.from({length:20},(_,i)=>i+1):[])}
function renderBar(){const arr=variants();$('variantBar').classList.toggle('hidden',!arr.length);$('variantLabel').classList.toggle('hidden',!arr.length);$('variantBar').innerHTML=arr.map(v=>`<button class="variant ${v===currentVariant?'active':''}" data-v="${v}" aria-label="Variant ${v}">${v}</button>`).join('');$('variantBar').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{currentVariant=+b.dataset.v;renderSection()})}
function renderSection(){renderBar();if(current===0)renderListening();else if(current===2)renderPractice('grammar',20,28,7,'Grammar');else if(current===3)renderPractice('wordFormation',29,34,8,'Word Formation');else renderEmpty()}
function uploadedName(v){return v===2?'2(2).mp3':v===3?'3(1).mp3':v+'.mp3'}
function renderListening(){
 const a=BANK.audio[currentVariant],set=LISTEN[currentVariant];
 if(!set){$('stageBody').className='workspace listenWorkspace';$('stageBody').innerHTML='<div class="empty"><h3>Listening</h3><p>Tasks are not available for this variant.</p></div>';return}
 const qs=set.q.map(q=>`<div class="qCard"><div class="qnum">${q.n}</div><div><div class="qstem">${q.stem}</div><div class="opts">${q.options.map((o,i)=>`<label class="opt"><input type="radio" name="l${currentVariant}-${q.n}" value="${i+1}"><span>${i+1}) ${o}</span></label>`).join('')}</div></div></div>`).join('');
 const topics=set.topics.map((t,i)=>`<div><strong>${i+1}.</strong> ${t}</div>`).join('');
 const speakers=['A','B','C','D','E'].map(s=>`<div class="speakerBox"><label>Speaker ${s}</label><select aria-label="Speaker ${s}"><option value="">—</option>${[1,2,3,4,5,6].map(n=>`<option value="${n}">${n}</option>`).join('')}</select></div>`).join('');
 const fields=set.fields.map(f=>`<div class="fieldRow"><div class="qnum">${f.n}</div><strong>${f.label}</strong><input type="text" autocomplete="off" spellcheck="false" aria-label="Task ${f.n}: ${f.label}"><span class="suffix">${f.suffix||''}</span></div>`).join('');
 const fullTasks=`<div class="part" data-part="0"><div class="instr">Tasks 1–4 · Listen and choose 1, 2 or 3</div><div class="qGrid">${qs}</div></div><div class="part" data-part="1"><div class="instr">Task 5 · Match Speakers A–E with topics 1–6. One topic is extra.</div><div class="board"><div class="topicList">${topics}</div><div class="speakerGrid">${speakers}</div></div></div><div class="part" data-part="2"><div class="instr">Tasks 6–11 · Listen and complete the notes</div><div class="board"><div class="fieldList">${fields}</div></div></div>`;
 $('stageBody').className='workspace listenWorkspace';
 $('stageBody').innerHTML=`<aside class="audioPanel"><span class="tag">LISTENING · FULL TRACK</span><h3 class="audioTitle">Variant ${currentVariant}</h3><p class="audioMeta">${uploadedName(currentVariant)} · ${a.duration}</p><div id="audioHome"><audio id="track" controls preload="none"><source src="${BANK.audioUrl(currentVariant)}" type="audio/mpeg"></audio></div><div class="listenActions"><button class="action" id="openListeningTasks">Open tasks</button><a class="action alt" href="${BANK.variantPdf(currentVariant)}" target="_blank" rel="noopener">Open source PDF</a></div></aside>`;
 $('fullTaskTitle').textContent=`Variant ${currentVariant}`;
 $('fullTaskBody').innerHTML=fullTasks;
 $('partTabs').innerHTML=['Tasks 1–4','Task 5','Tasks 6–11'].map((t,i)=>`<button class="partTab" data-tab="${i}">${t}</button>`).join('');$('partTabs').querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>showPart(+b.dataset.tab));
 $('openListeningTasks').onclick=()=>{moveAudio($('audioSlot'));$('fullTaskOverlay').classList.add('open');$('fullTaskOverlay').setAttribute('aria-hidden','false');showPart(0);goFull()};
}
function renderPractice(kind,start,end,page,label){
 const key=BANK[kind][currentVariant],rows=[];
 for(let n=start;n<=end;n++)rows.push(`<div class="answerRow"><label for="a${n}">${n}</label><input id="a${n}" data-q="${n}" autocomplete="off" spellcheck="false" placeholder="Type your answer"><div class="feedback" data-f="${n}"></div></div>`);
 const pdf=BANK.variantPdf(currentVariant);
 $('stageBody').className='workspace practiceWorkspace';$('stageBody').innerHTML=`<section class="panel"><div class="panelHead"><strong>Your answers</strong><span class="meta">${label} · ${start}–${end}</span></div><div class="answerList">${rows.join('')}</div><div class="actions"><button class="action" id="check">Check answers</button><button class="action alt" id="reset">Reset</button><span class="score" id="score"></span></div></section><section class="panel"><div class="panelHead"><strong>Variant ${currentVariant} · source task page</strong><span class="meta">PDF</span></div><iframe class="taskFrame" title="Variant ${currentVariant} tasks" src="${pdf}#page=${page}&toolbar=0&navpanes=0&view=FitH"></iframe><div class="fallback">If the page preview is blocked, <a href="${pdf}#page=${page}" target="_blank" rel="noopener">open this task page</a>.</div></section>`;
 $('check').onclick=()=>check(kind,start,end);$('reset').onclick=()=>renderPractice(kind,start,end,page,label)
}
function norm(s){return String(s||'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}
function check(kind,start,end){const key=BANK[kind][currentVariant];let score=0,total=end-start+1;for(let n=start;n<=end;n++){const input=document.querySelector('[data-q="'+n+'"]'),fb=document.querySelector('[data-f="'+n+'"]'),accepted=(key[n]||[]).map(norm),value=norm(input.value),ok=accepted.includes(value);input.classList.toggle('correct',ok);input.classList.toggle('wrong',!ok);fb.className='feedback '+(ok?'ok':'no');fb.textContent=ok?'Correct':'Answer: '+(key[n]||[])[0];if(ok)score++}$('score').textContent=score+' / '+total}

function moveAudio(to){const a=$('track');if(!a||!to||a.parentNode===to)return;const playing=!a.paused,t=a.currentTime;to.appendChild(a);if(playing){try{a.currentTime=t}catch{}a.play().catch(()=>{})}}
let weWentFull=false;
async function goFull(){if(document.fullscreenElement)return;try{await document.documentElement.requestFullscreen();weWentFull=true}catch{}}
function showPart(i){const body=$('fullTaskBody');body.querySelectorAll('.part').forEach(p=>p.classList.toggle('active',+p.dataset.part===i));$('partTabs').querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',+b.dataset.tab===i));fitBoard()}
function fitBoard(){const body=$('fullTaskBody');if(!$('fullTaskOverlay').classList.contains('open'))return;let lo=16,hi=96;while(hi-lo>1){const m=(lo+hi)>>1;body.style.fontSize=m+'px';(body.scrollHeight<=body.clientHeight&&body.scrollWidth<=body.clientWidth)?lo=m:hi=m}body.style.fontSize=lo+'px'}
window.addEventListener('resize',fitBoard);
function closeTasks(){if(!$('fullTaskOverlay').classList.contains('open'))return;if(weWentFull&&document.fullscreenElement){document.exitFullscreen().catch(()=>{})}weWentFull=false;moveAudio($('audioHome'));$('fullTaskOverlay').classList.remove('open');$('fullTaskOverlay').setAttribute('aria-hidden','true')}
$('closeFullTask').onclick=closeTasks;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeTasks()});
function renderEmpty(){$('stageBody').className='workspace';$('stageBody').innerHTML=`<div class="empty"><h3>${sections[current][0]}</h3><p>This section remains separate so Listening, Grammar and Word Formation do not get mixed together.</p></div>`}
</script>
</body>
</html>
