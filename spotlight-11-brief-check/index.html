<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spotlight 11 · Brief Check-in</title>
<style>
:root{--ink:#173332;--teal:#006a68;--lime:#d9f16d;--paper:#f5f3eb;--line:#17333225;--good:#17683d;--bad:#9b2f24}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #df4e32;outline-offset:3px}
header{height:76px;padding:0 4vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--paper)}
.brand{font-weight:900;letter-spacing:-1px;font-size:25px}.brand span{background:var(--lime);padding:5px 9px;border-radius:8px;margin-left:6px}.small{font-size:12px;letter-spacing:2px;font-weight:bold}
.tools{display:flex;gap:12px;align-items:center}.tools button,.tools a,.back{background:transparent;border:1px solid #17333240;border-radius:30px;padding:11px 18px;color:inherit;text-decoration:none}
.home{height:calc(100svh - 76px);display:flex;flex-direction:column}.hero{position:relative;min-height:310px;flex:1;background:url(cover.webp) center 47%/cover;display:flex;align-items:center}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#f5f3ebe8,transparent 68%)}.copy{position:relative;padding:30px 4vw;width:60%}
.eyebrow,.tag{display:inline-block;background:var(--teal);color:white;padding:9px 13px;border-radius:6px;font-size:11px;letter-spacing:1.6px;font-weight:800}
h1{font-size:clamp(54px,6.5vw,105px);line-height:.93;letter-spacing:-5px;margin:21px 0}h1 em{font-style:normal;color:var(--teal)}.lead{font-size:18px;line-height:1.5;margin:0;max-width:430px}
.navwrap{padding:22px 4vw 18px}.navlabel{display:flex;justify-content:space-between;margin-bottom:13px;font-size:12px;letter-spacing:1.6px;font-weight:bold}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{border:0;text-align:left;border-radius:16px;padding:18px;min-height:137px;background:#e5e9df;color:var(--ink);transition:.2s;position:relative}
.card:nth-child(2){background:#ddebe7}.card:nth-child(3){background:#e7e1ef}.card:nth-child(4){background:#efdccf}.card:nth-child(5){background:var(--lime)}.card:hover{transform:translateY(-5px);background:var(--ink);color:white}
.number{font-size:12px;opacity:.7;display:block;margin-bottom:16px}.card strong{font-size:clamp(19px,1.8vw,29px);line-height:1.04;display:block;letter-spacing:-.7px}.arrow{position:absolute;top:16px;right:18px;font-size:23px}.foot{font-size:11px;margin-top:13px;display:flex;justify-content:space-between;opacity:.7}
.stage{display:none;height:calc(100svh - 76px);padding:16px 4vw 22px;overflow:hidden}.stage.active{display:flex;flex-direction:column}.stagebar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:0 0 auto}
.stageIntro{display:flex;justify-content:space-between;align-items:end;gap:16px}.stage h2{font-size:clamp(34px,4vw,60px);letter-spacing:-2px;margin:10px 0 4px}.stageIntro p{margin:0 0 9px;color:#55706a}
.variants{display:flex;gap:7px;overflow-x:auto;padding:7px 1px 11px;flex:0 0 auto;scrollbar-width:thin}.variant{border:1px solid #17333235;background:white;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:800}.variant.active{background:var(--teal);border-color:var(--teal);color:white}
.workspace{min-height:0;flex:1;display:grid;grid-template-columns:minmax(0,1.18fr) minmax(310px,.82fr);gap:14px}.panel{min-height:0;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;display:flex;flex-direction:column}
.panelHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}.panelHead strong{font-size:18px}.meta{font-size:12px;color:#60736f}
.taskFrame{width:100%;min-height:0;flex:1;border:0;border-radius:10px;background:#eee}.fallback{font-size:12px;margin-top:8px;color:#60736f}.fallback a{color:var(--teal);font-weight:bold}
.answerList{overflow:auto;min-height:0;padding-right:3px}.answerRow{display:grid;grid-template-columns:42px 1fr;gap:8px;align-items:center;margin-bottom:7px}.answerRow label{font-weight:900;text-align:center}
.answerRow input{width:100%;border:1px solid #a9b9ae;border-radius:9px;padding:9px 10px;background:#fbfcfa}.answerRow input.correct{border-color:var(--good);background:#eef8f1}.answerRow input.wrong{border-color:var(--bad);background:#fff2f0}
.feedback{grid-column:2;font-size:12px;min-height:14px;margin-top:-4px}.feedback.ok{color:var(--good)}.feedback.no{color:var(--bad)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.action{border:0;background:var(--teal);color:white;padding:11px 16px;border-radius:10px;font-weight:bold}.action.alt{background:var(--lime);color:var(--ink)}.score{margin-left:auto;align-self:center;font-weight:900}
.audioPanel{max-width:920px;width:100%;margin:auto;background:#fff;border:1px solid var(--line);border-radius:20px;padding:clamp(18px,3vw,34px)}.audioTitle{font-size:clamp(30px,4vw,54px);letter-spacing:-1.5px;margin:8px 0 5px}.audioMeta,.note{color:#60736f}.audioMeta{margin:0 0 20px}audio{width:100%}.note{font-size:13px;line-height:1.5}
.empty{margin:auto;max-width:700px;background:#fff;border:1px solid var(--line);border-radius:20px;padding:32px;text-align:center}.empty h3{font-size:31px;margin:0 0 8px}.empty p{color:#60736f;line-height:1.55}.hidden{display:none!important}
@media(max-width:900px){.workspace{grid-template-columns:1fr;overflow:auto}.panel{min-height:60svh}.taskFrame{min-height:52svh}.stage{overflow:auto}}
@media(max-width:750px){header{height:65px}.small{display:none}.brand{font-size:21px}.tools a{display:none}.tools button{padding:9px 12px}.home{height:auto;min-height:calc(100svh - 65px)}.hero{min-height:430px;background-position:60% center}.hero:before{background:linear-gradient(90deg,#f5f3ebed,#f5f3eb60)}.copy{width:85%;padding:30px 5vw}h1{font-size:65px;letter-spacing:-3px}.cards{grid-template-columns:repeat(2,1fr)}.card:last-child{grid-column:span 2}.card{min-height:120px}.stage{height:calc(100svh - 65px);padding:13px 4vw 18px}.stage h2{font-size:38px}.stageIntro{display:block}}
@media(min-width:751px) and (max-height:700px){header{height:60px}.home,.stage{height:calc(100svh - 60px)}h1{font-size:64px}.hero{min-height:240px}.card{min-height:110px;padding:13px}.number{margin-bottom:10px}.navwrap{padding-top:14px;padding-bottom:10px}.copy{padding-top:18px;padding-bottom:18px}.lead{font-size:16px}}
</style>
</head>
<body>
<header><div class="brand">SPOTLIGHT <span>11</span></div><div class="small">ENGLISH / BRIEF CHECK-IN</div><div class="tools"><a href="../spotlight-brief-check/">All grades</a><button id="fullscreen">Full screen</button></div></header>

<main id="home" class="home">
<section class="hero"><div class="copy"><div class="eyebrow">YOUR VOICE. YOUR NEXT LEVEL.</div><h1>Brief<br><em>check-in.</em></h1><p class="lead">Tune in. Find your words. Make it click.<br>Five ways to get your English moving.</p></div></section>
<nav class="navwrap" aria-label="Lesson sections"><div class="navlabel"><span>CHOOSE YOUR FOCUS</span><span>5 SECTIONS</span></div><div class="cards" id="cards"></div><div class="foot"><span>GRADE 11 · ENGLISH</span><span>Independent companion for Spotlight 11</span></div></nav>
</main>

<section id="stage" class="stage" aria-labelledby="sectionTitle">
<div class="stagebar"><button class="back" id="back">← Back to cover</button><span class="tag">PRACTICE</span></div>
<div class="stageIntro"><div><h2 id="sectionTitle"></h2><p id="sectionLead"></p></div></div>
<div id="variantBar" class="variants"></div>
<div id="stageBody" class="workspace"></div>
</section>

<script src="data.js"></script>
<script>
const sections=[
 ['Listening','TUNE IN','Full listening tracks: variants 2–20.'],
 ['Vocabulary','FIND YOUR WORDS','Vocabulary practice stays as a separate section.'],
 ['Grammar','MAKE IT CLICK','Tasks 20–28: transform the given word or phrase.'],
 ['Word Formation','BUILD A NEW WORD','Tasks 29–34: form a new word that fits the context.'],
 ['Lesson Check-up','OWN YOUR PROGRESS','A compact mixed check-up area.']
];
const $=id=>document.getElementById(id), BANK=window.SPOTLIGHT11_BANK;
let current=0,currentVariant=1;
$('cards').innerHTML=sections.map((s,i)=>`<button class="card" data-index="${i}"><span class="number">0${i+1} / ${s[1]}</span><span class="arrow">↗</span><strong>${s[0]}</strong></button>`).join('');
document.querySelectorAll('[data-index]').forEach(b=>b.onclick=()=>{current=+b.dataset.index;currentVariant=current===0?2:1;$('sectionTitle').textContent=sections[current][0];$('sectionLead').textContent=sections[current][2];$('home').style.display='none';$('stage').classList.add('active');renderSection();$('back').focus()});
$('back').onclick=home;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('stage').classList.contains('active'))home()});
function home(){$('stage').classList.remove('active');$('home').style.display='flex';document.querySelectorAll('[data-index]')[current].focus()}
$('fullscreen').onclick=async()=>{try{document.fullscreenElement?await document.exitFullscreen():await document.documentElement.requestFullscreen()}catch{}};
document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'Exit full screen':'Full screen'});

function variants(){return current===0?Object.keys(BANK.audio).map(Number):(current===2||current===3?Array.from({length:20},(_,i)=>i+1):[])}
function renderBar(){const arr=variants();$('variantBar').classList.toggle('hidden',!arr.length);$('variantBar').innerHTML=arr.map(v=>`<button class="variant ${v===currentVariant?'active':''}" data-v="${v}">Variant ${v}</button>`).join('');$('variantBar').querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{currentVariant=+b.dataset.v;renderSection()})}
function renderSection(){renderBar();if(current===0)renderListening();else if(current===2)renderPractice('grammar',20,28,7,'Grammar');else if(current===3)renderPractice('wordFormation',29,34,8,'Word Formation');else renderEmpty()}
function uploadedName(v){return v===2?'2(2).mp3':v===3?'3(1).mp3':v+'.mp3'}
function renderListening(){const a=BANK.audio[currentVariant];$('stageBody').className='workspace';$('stageBody').innerHTML=`<article class="audioPanel"><span class="tag">LISTENING · FULL TRACK</span><h3 class="audioTitle">Variant ${currentVariant}</h3><p class="audioMeta">${uploadedName(currentVariant)} · ${a.duration} · full listening</p><audio controls preload="none"><source src="${BANK.audioUrl(currentVariant)}" type="audio/mpeg"></audio><p class="note">The audio is loaded only after Play is pressed, so all 19 tracks can stay inside one compact section.</p></article>`}
function renderPractice(kind,start,end,page,label){
 const key=BANK[kind][currentVariant],rows=[];
 for(let n=start;n<=end;n++)rows.push(`<div class="answerRow"><label for="a${n}">${n}</label><input id="a${n}" data-q="${n}" autocomplete="off" spellcheck="false" placeholder="Type your answer"><div class="feedback" data-f="${n}"></div></div>`);
 const pdf=BANK.variantPdf(currentVariant);
 $('stageBody').className='workspace';$('stageBody').innerHTML=`<section class="panel"><div class="panelHead"><strong>Variant ${currentVariant} · task page</strong><span class="meta">${label} · ${start}–${end}</span></div><iframe class="taskFrame" title="Variant ${currentVariant} tasks" src="${pdf}#page=${page}&toolbar=0&navpanes=0&view=FitH"></iframe><div class="fallback">If the page preview is blocked, <a href="${pdf}#page=${page}" target="_blank" rel="noopener">open this task page</a>.</div></section><section class="panel"><div class="panelHead"><strong>Your answers</strong><span class="meta">automatic check</span></div><div class="answerList">${rows.join('')}</div><div class="actions"><button class="action" id="check">Check answers</button><button class="action alt" id="reset">Reset</button><span class="score" id="score"></span></div></section>`;
 $('check').onclick=()=>check(kind,start,end);$('reset').onclick=()=>renderPractice(kind,start,end,page,label)
}
function norm(s){return String(s||'').trim().toLowerCase().replace(/[’‘]/g,"'").replace(/\s+/g,' ')}
function check(kind,start,end){const key=BANK[kind][currentVariant];let score=0,total=end-start+1;for(let n=start;n<=end;n++){const input=document.querySelector('[data-q="'+n+'"]'),fb=document.querySelector('[data-f="'+n+'"]'),accepted=(key[n]||[]).map(norm),value=norm(input.value),ok=accepted.includes(value);input.classList.toggle('correct',ok);input.classList.toggle('wrong',!ok);fb.className='feedback '+(ok?'ok':'no');fb.textContent=ok?'Correct':'Answer: '+(key[n]||[])[0];if(ok)score++}$('score').textContent=score+' / '+total}
function renderEmpty(){$('stageBody').className='workspace';$('stageBody').innerHTML=`<div class="empty"><h3>${sections[current][0]}</h3><p>This section remains separate so Listening, Grammar and Word Formation do not get mixed together.</p></div>`}
</script>
</body>
</html>
