<style>
.grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;flex:1;min-height:0}
.fc{position:relative;cursor:pointer;border-radius:16px;border:1px solid var(--line);background:#fff;box-shadow:0 6px 18px rgba(30,64,120,.08);display:flex;flex-direction:column;justify-content:center;gap:8px;padding:14px 18px;min-height:0;overflow:auto;transition:transform .17s ease-in}
.fc.turn{transform:rotateY(90deg)}
.fc .k{font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.fc .w{font-size:27px;font-weight:900;line-height:1.25;color:#14213d}
.fc .d{font-size:20px;line-height:1.4}
.fc .x{font-size:18px;line-height:1.4;color:var(--muted);font-style:italic}
.fc.back{background:#14213d;color:#fff;border-color:#14213d}
.fc.back .k{color:#b8c4dc}.fc.back .w{color:#fff}.fc.back .x{color:#dbe2f0}
.fc.back .bad{color:#f2b9a6;text-decoration:line-through;font-size:19px}
.fc .bad{font-size:24px;font-weight:800;color:#14213d}
.fc.back .rule{font-size:17px;color:#9fd8cc}
.pager{display:flex;gap:6px;align-items:center}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;flex:1;min-height:0;align-content:start}
.mt .col{display:flex;flex-direction:column;gap:10px}
.mt button{font:inherit;font-size:20px;text-align:left;padding:12px 16px;border-radius:12px;border:2px solid #c9d3e6;background:#fff;cursor:pointer;line-height:1.3}
.mt button.sel{border-color:#2855d9;background:#edf4ff}
.mt button.ok{border-color:#1e8e5a;background:#e3f4ea;color:#1e5a3a;cursor:default}
.mt button.no{border-color:#c62f2f;background:#fbe6e3}
.ruad{flex:0 0 260px;min-height:170px;border-radius:14px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:16px;text-align:center}
.ruad b{font-size:25px;line-height:1.2}.ruad span{font-size:17px;opacity:.92}
.hw{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;flex:1;min-height:0;align-content:start}
.hw .panel{display:flex;flex-direction:column;gap:6px}
.hw b{font-size:21px}.hw p{margin:0;font-size:18.5px;line-height:1.4}
.frm{display:flex;flex-wrap:wrap;gap:8px}
.frm span{background:#edf4ff;border:1px solid #c9d3e6;border-radius:999px;padding:4px 12px;font-size:17px}
@media (max-height:640px){.fc .w{font-size:23px}.fc .d{font-size:18px}.fc .x{font-size:16px}.mt button{font-size:18px;padding:8px 12px}.mt{gap:7px 14px}.mt .col{gap:7px}.grid4{gap:8px}}
.qz{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;gap:10px;width:100%;max-width:980px;margin:0 auto}
.qzbar{width:100%;height:6px;border-radius:99px;background:#e3e8f2;overflow:hidden;flex:0 0 auto}.qzbar i{display:block;height:100%;background:#4255ff;border-radius:99px;transition:width .25s}
.qzcard{position:relative;width:100%;flex:1;min-height:220px;perspective:1600px;cursor:pointer}
.qzin{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.2,.2,1)}
.qzcard.flipped .qzin{transform:rotateY(180deg)}
.qzface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border-radius:18px;box-shadow:0 4px 18px rgba(46,56,86,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px 60px;text-align:center;overflow:auto}
.qzback{transform:rotateY(180deg)}
.qzk{position:absolute;top:16px;left:22px;font-size:14px;font-weight:700;color:#939bb4;letter-spacing:.3px}
.qzterm{font-size:44px;font-weight:600;line-height:1.2;color:#2e3856}
.qzdef{font-size:31px;line-height:1.3;color:#2e3856}
.qzex{font-size:23px;line-height:1.4;color:#586380;font-style:italic}
.qzsnd{position:absolute;top:10px;right:12px;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:transparent;color:#586380;cursor:pointer;display:grid;place-items:center}
.qzsnd:hover{background:#edeff4}
.qznav{display:flex;align-items:center;justify-content:center;gap:14px;flex:0 0 auto}
.qzarr{width:64px;height:46px;border-radius:999px;border:2px solid #d9dde8;background:#fff;color:#2e3856;font-size:24px;font-weight:700;cursor:pointer}
.qzarr:hover{background:#edeff4}.qzarr:disabled{opacity:.35;cursor:default}
.qzcnt{font-size:20px;min-width:74px;text-align:center;color:#2e3856}
@media (max-height:640px){.qzterm{font-size:38px}.qzdef{font-size:26px}.qzex{font-size:20px}.qzface{padding:24px 50px;gap:10px}.qzarr{height:40px}}
</style>
