<meta charset="utf-8"><script>/* open-from-main-screen */(function(){try{if(window.top!==window)return;var r=document.referrer;if(r&&new URL(r).origin===location.origin)return}catch(e){return}location.replace("index.html")})();</script>

<title>ЕГЭ 2027 · Занятие 1 · Family and friends</title>
<link rel="stylesheet" href="app.css?v=37">
<style>
.ttlb{font-weight:800;font-size:16px;color:#385079;background:#eff5ff;border:1px solid var(--line);border-radius:999px;padding:4px 12px;white-space:nowrap}
.ws{display:grid;grid-template-columns:340px 1fr;gap:14px;align-items:start;min-height:0;width:100%;max-width:1180px;margin:0 auto}
.wpane.pr{min-height:525px}
.hbtns{margin-left:auto;display:flex;gap:6px;align-items:center}
.wpane{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 18px rgba(30,64,120,.06);padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.seg{display:flex;gap:4px;background:#f1f4fa;border-radius:12px;padding:3px;flex:0 0 auto;flex-wrap:wrap}
.segb{font:inherit;font-size:15px;font-weight:800;border:0;background:transparent;color:#4a5677;border-radius:9px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.segb.on{background:#fff;color:#2855d9;box-shadow:0 1px 4px rgba(30,64,120,.15)}
.pbody{display:flex;flex-direction:column;gap:8px}
.pbody.sp4{flex-direction:row;gap:10px}
/* Quizlet card – compact */
.qzbar{width:100%;height:5px;border-radius:99px;background:#e3e8f2;overflow:hidden;flex:0 0 auto}.qzbar i{display:block;height:100%;background:#4255ff;border-radius:99px;transition:width .25s}
.qzcard{position:relative;width:100%;height:230px;perspective:1400px;cursor:pointer}
.qzin{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,.2,.2,1)}
.qzcard.flipped .qzin{transform:rotateY(180deg)}
.qzface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border:1px solid #e3e8f2;border-radius:14px;box-shadow:0 3px 12px rgba(46,56,86,.12);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px 22px;text-align:center;overflow:auto}
.qzback{transform:rotateY(180deg)}
.qzk{position:absolute;top:9px;left:14px;font-size:12.5px;font-weight:700;color:#939bb4}
.qzterm{font-size:25px;font-weight:600;line-height:1.25;color:#2e3856}
.qzdef{font-size:19px;line-height:1.35;color:#2e3856}
.qzex{font-size:16px;line-height:1.4;color:#586380;font-style:italic}
.qzwrong{font-size:15px;color:#b4413a;text-decoration:line-through}.qzok{color:#1e6b4a;font-weight:600}
.qzsnd{position:absolute;top:4px;right:6px;z-index:2;width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:#586380;cursor:pointer;display:grid;place-items:center}
.qzsnd:hover{background:#edeff4}
.qznav{display:flex;align-items:center;justify-content:center;gap:8px;flex:0 0 auto;flex-wrap:wrap}
.qzarr{width:48px;height:34px;border-radius:999px;border:2px solid #d9dde8;background:#fff;color:#2e3856;font-size:18px;font-weight:700;cursor:pointer}
.qzarr:hover{background:#edeff4}.qzarr:disabled{opacity:.35;cursor:default}
.qzcnt{font-size:15px;min-width:54px;text-align:center;color:#2e3856}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0;align-content:start}
.mt .col{display:flex;flex-direction:column;gap:7px}
.mt button{font:inherit;font-size:15.5px;text-align:left;padding:8px 10px;border-radius:10px;border:2px solid #c9d3e6;background:#fff;cursor:pointer;line-height:1.3}
.mt button.sel{border-color:#2855d9;background:#edf4ff}.mt button.ok{border-color:#1e8e5a;background:#e3f4ea;color:#1e5a3a;cursor:default}.mt button.no{border-color:#c62f2f;background:#fbe6e3}
/* speaking */
.kim2{flex:1;min-width:0;font-size:15px;line-height:1.42}
.kim2 p{margin:0 0 6px}.kim2 .task{font-weight:700}
.kim2 .textbox{border:1px solid #c9d3e6;border-radius:10px;padding:8px 12px;font-size:16.5px;line-height:1.5;background:#fbfcfe}
.kim2 ol,.kim2 ul{margin:2px 0 6px;padding-left:22px}.kim2 li{padding:1px 4px;border-radius:6px}
.kim2 li.now{background:var(--warnbg);font-weight:700}.kim2 li.past{color:#8a94a6}
.kim2 .adrow{gap:12px}
.ruad{flex:0 0 170px;min-height:130px;border-radius:12px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:12px;text-align:center}
.ruad b{font-size:18px;line-height:1.2}.ruad span{font-size:14px;opacity:.92}
.ctl2{flex:0 0 172px;display:flex;flex-direction:column;gap:6px}
.ctl2 .ring{width:104px;height:104px}.ctl2 .ring::before{inset:9px}.ctl2 .ring b{font-size:26px}.ctl2 .ring span{font-size:12px}
.ctl2 .phase{font-size:14.5px;min-height:20px}
.ctl2 .ctlbtns{grid-template-columns:1fr 1fr;gap:5px}.ctl2 .btn{font-size:14px;padding:5px 8px}
.ctl2 .rec{font-size:13px}.ctl2 .rec audio{width:100%}
.ivw{display:flex;flex-direction:column;gap:6px}
.ivw .ivtop select{font-size:15px;padding:4px 8px}.ivw .chip{min-width:34px;padding:3px 6px;font-size:15px}
.ivw .ivcard{flex:0 0 auto;height:220px;gap:8px;padding:10px 16px;overflow:auto}
.ivw .ivcard .big{font-size:22px}.ivw .ivcard .qq{font-size:19px}.ivw .ivcard .smpa{font-size:16px;line-height:1.4}.ivw .ivcard .ey{font-size:13px}
.t4w{display:grid;grid-template-columns:1fr 175px;gap:10px;align-items:start}
.t4w .task,.t4w li{font-size:14.5px;line-height:1.38}
.pics2{display:flex;flex-direction:column;gap:6px}.pics2 figure{margin:0}.pics2 figcaption{font-size:12.5px;font-weight:800;color:var(--muted)}
.pics2 img{width:100%;height:112px;object-fit:cover;border-radius:10px;display:block}
.hwl{padding-left:22px;margin:0}.hwl li{margin-bottom:8px;line-height:1.45}
@media (max-height:640px){.wpane.pr{min-height:min(456px,calc(100vh - 126px))}.wpane{padding:8px 10px;gap:6px}.qzcard{height:205px}.ivw .ivcard{height:190px}.qzterm{font-size:23px}.qzdef{font-size:18px}.kim2{font-size:14.5px;line-height:1.38}.kim2 .textbox{font-size:15.5px;line-height:1.45;padding:6px 10px}.pics2 img{height:98px}.ctl2 .ring{width:86px;height:86px}.ctl2 .ring b{font-size:22px}.t4w .task,.t4w li{font-size:14px;line-height:1.32}.kim2 ul{margin:0 0 4px}}
@media (max-height:580px){.kim2 .textbox{font-size:15px;line-height:1.42}.kim2{font-size:14px}}
@media (max-width:1000px){.ws{grid-template-columns:1fr}}
