</style></head><body><header class="top"><a href="index.html">← EGE 2027</a><strong>Speaking · Family & Friends</strong></header><main class="shell"><div class="label">Topic practice · Questions 11–20</div><p class="tips">Answer each question in 2–3 complete sentences. Practise speaking for up to 40 seconds. This is additional speaking practice, not an official FIPI task simulation.</p><section class="panel"><div class="meta"><span class="number" id="num">Question 11 / 20</span><span class="timer" id="timer">0:40</span></div><div class="progress"><div id="bar" style="width:0%"></div></div><h1 class="question" id="question"></h1><div class="buttons"><button id="listen">Listen to question</button><button class="primary" id="start">Start 40 sec</button><button id="record">Record answer</button><button id="stop" disabled>Stop recording</button></div><div class="status" id="status" role="status"></div><div class="audio" id="audioWrap"><audio id="audio" controls></audio><div class="recordings" id="download"></div></div><div class="bottom"><button id="prev">← Previous</button><button class="primary" id="next">Next →</button></div><nav class="questionlist" id="nav" aria-label="Questions"></nav></section></main><script>
const questions=["Do you have a big or small family?","Who do you get on with best in your family?","How often do you spend time with your family?","Do you prefer spending time with family or friends?","What do you usually do with your friends?","How do you usually make new friends?","What qualities do you value in people?","Do you find it easy to communicate with others?","What makes a good friend?","Do you prefer to have many friends or a few close ones?"];let index=0,left=40,interval=null,recorder=null,parts=[],stream=null,latestUrl=null;
const $=id=>document.getElementById(id),status=t=>$('status').textContent=t;
function resetClock(){clearInterval(interval);interval=null;left=40;$('timer').textContent='0:40';$('bar').style.width='0%';}
function render(){if(window.speechSynthesis)window.speechSynthesis.cancel();resetClock();$('num').textContent='Question '+(index+11)+' / 20';$('question').textContent=questions[index];$('prev').disabled=index===0;$('next').disabled=index===9;status('');$('nav').innerHTML='';for(let i=0;i<10;i++){const b=document.createElement('button');b.textContent=i+11;b.className=i===index?'active':'';b.onclick=()=>{index=i;render()};$('nav').appendChild(b)}$('audioWrap').style.display='none';}
$('prev').onclick=()=>{if(index>0){index--;render()}};$('next').onclick=()=>{if(index<9){index++;render()}};
$('start').onclick=()=>{resetClock();status('Time to answer.');interval=setInterval(()=>{left--;$('timer').textContent='0:'+String(left).padStart(2,'0');$('bar').style.width=((40-left)/40*100)+'%';if(left<=0){clearInterval(interval);interval=null;status('40 seconds finished.')}},1000)};
$('listen').onclick=()=>{if(!window.speechSynthesis){status('Speech synthesis is unavailable in this browser.');return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(questions[index]);u.lang='en-GB';u.rate=.92;const voices=speechSynthesis.getVoices();u.voice=voices.find(v=>v.lang==='en-GB')||null;speechSynthesis.speak(u)};
$('record').onclick=async()=>{if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){status('Recording is unsupported in this browser.');return}try{stream=await navigator.mediaDevices.getUserMedia({audio:true});parts=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)parts.push(e.data)};const n=index+11;recorder.onstop=()=>{const blob=new Blob(parts,{type:recorder.mimeType||'audio/webm'});if(latestUrl)URL.revokeObjectURL(latestUrl);latestUrl=URL.createObjectURL(blob);$('audio').src=latestUrl;$('audioWrap').style.display='block';const a=document.createElement('a');a.href=latestUrl;a.download='family-friends-question-'+n+'.webm';a.textContent='Save answer · Q'+n;$('download').replaceChildren(a);stream.getTracks().forEach(t=>t.stop());stream=null;status('Recording ready to play or save.')};recorder.start();$('record').disabled=true;$('stop').disabled=false;status('Recording answer…')}catch(e){status('Microphone permission is required to record.')}};
$('stop').onclick=()=>{if(recorder?.state==='recording')recorder.stop();$('record').disabled=false;$('stop').disabled=true};window.addEventListener('beforeunload',()=>{if(stream)stream.getTracks().forEach(t=>t.stop());if(latestUrl)URL.revokeObjectURL(latestUrl)});render();
</script></body></html>
