<style>
.pick{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pick select{font-size:18px;padding:6px 10px;border:1px solid #b9cbee;border-radius:12px;background:#fff;max-width:340px}
.gtext{flex:0 1 auto;min-height:0;overflow:auto;padding:10px 16px!important;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 18px;box-shadow:0 6px 18px rgba(30,64,120,.06)}
.gtext .cols2{column-count:2;column-gap:30px;font-size:18.5px;line-height:1.8}
.gtext p{margin:0 0 3px;break-inside:auto}
.gtext .fgap{margin:0 2px}
.gtext .base.sm{font-size:13.5px;padding:1px 7px;border-radius:6px;letter-spacing:.5px;font-weight:800}
.gtext input.ans.fin{font-size:18px;height:29px;padding:1px 7px}
.gtext .fright{font-size:17px;font-weight:800}
.gtext input.ans.fin.ok{border-color:var(--ok);background:var(--okbg)}
.gtext input.ans.fin.bad{border-color:var(--bad);background:var(--badbg)}
.rd{display:grid;grid-template-columns:1.25fr 1fr;gap:12px;flex:0 1 auto;min-height:0;height:min(430px,100%)}
.rd .txt{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 18px;font-size:18px;line-height:1.5}
.rd .txt h3{margin:0 0 6px;font-size:21px}
.rd .txt p{margin:0 0 8px}
.rd .sts{display:flex;flex-direction:column;gap:6px;overflow:auto}
.sti{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.sti>i{font-style:normal;font-weight:900;color:#2855d9}
.sti>span{font-size:16.5px;line-height:1.3}
.tfn{display:flex;gap:4px}
.tfn button{font:inherit;font-size:14px;font-weight:800;border:1px solid #c9d3e6;background:#fff;border-radius:8px;padding:5px 8px;cursor:pointer;min-width:44px}
.tfn button.on{background:#2855d9;border-color:#2855d9;color:#fff}
.tfn button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.tfn button.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.tfn button.right{outline:3px solid var(--ok);outline-offset:-3px}
.lt{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:0 1 auto;min-height:0}
.lt .task{font-size:17.5px;line-height:1.45;margin:0}
.lt .panel{overflow:auto;display:flex;flex-direction:column;gap:8px}
.stim{background:#f7f9fd;border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:18px;line-height:1.5}
.stim .hd{font-size:15px;color:var(--muted);margin-bottom:6px}
.lt textarea{flex:1;min-height:150px;font:inherit;font-size:18px;line-height:1.5;border:1px solid #b9cbee;border-radius:12px;padding:10px 12px;resize:none}
.wc{font-size:16px;font-weight:800}.wc.ok{color:var(--ok)}.wc.bad{color:var(--bad)}
@media (max-height:640px){.lt .task{font-size:16px;line-height:1.4}.stim{padding:7px 12px}.stim .hd{font-size:14px;margin-bottom:3px}.lt .panel{gap:5px}.gtext .cols2{font-size:17px;line-height:1.64}.gtext .fnum{min-width:24px;height:24px;font-size:13px}.gtext input.ans.fin{height:27px;font-size:17px}.rd .txt{font-size:16.5px}.sti>span{font-size:15.5px}.sti{padding:4px 8px}.stim{font-size:16.5px}}
</style>
