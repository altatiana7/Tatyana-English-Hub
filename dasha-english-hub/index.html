<!doctype html>
<html lang="en">
<head><meta name="robots" content="noindex,nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dasha's English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&family=Andika:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap">
<style>
[hidden]{display:none!important}
:root{
  --bg:#F3F6F8; --card:#FFFFFF; --ink:#1B2533; --muted:#5B6878; --line:#D9E1E7;
  --teal:#2A8C9B; --teal-soft:#E3F2F4; --rose:#C6586A; --rose-soft:#F9E7EA; --moss:#6E9A3E; --moss-soft:#EDF4E1;
  --sun:#D99A1F; --sun-soft:#FBF1D9; --ok:#4E9A59; --ok-soft:#E4F2E5; --bad:#C45B5B; --bad-soft:#F8E6E6;
  --ui:'Archivo','Helvetica Neue',Arial,sans-serif; --serif:'Andika','Source Serif 4','Georgia',serif;
  --acc:var(--teal); --acc-soft:var(--teal-soft);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);margin:0;padding-top:6px}
#app{height:100%;display:flex;flex-direction:column;padding:0 max(14px,env(safe-area-inset-right,0px)) 8px max(14px,env(safe-area-inset-left,0px))}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px;font-weight:600;font-size:15px;line-height:1.1}
.btn.sm{padding:6px 11px;font-size:14px}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.teacher{background:var(--sun-soft);border-color:var(--sun)}
.btn:hover:not(:disabled){border-color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}

/* hub */
.hubview{overflow:auto;padding-top:2px}
.hubtop{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}
.brand{font-weight:800;font-size:30px;letter-spacing:-.02em}
.brand i{display:inline-block;width:10px;height:10px;background:var(--rose);margin-left:6px}
.sub{color:var(--muted);font-size:14px}
.paths{display:grid;grid-template-columns:1.15fr 1fr .8fr;gap:12px;align-items:start}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;border-top:5px solid var(--acc)}
.pcard h2{margin:0;font-size:22px;letter-spacing:-.01em}
.pcard .psub{color:var(--muted);font-size:14px;margin:2px 0 8px}
.utitle{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--acc);margin:10px 0 5px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pcard.p1 .chips.wide{grid-template-columns:1fr 1fr}
.lchip{text-align:left;background:var(--acc-soft);border:1px solid transparent;border-radius:8px;padding:7px 9px;font-size:14px;line-height:1.15;display:flex;gap:7px;align-items:baseline}
.lchip b{font-weight:800;color:var(--acc);min-width:26px}
.lchip:hover{border-color:var(--acc)}
.lchip.soon{background:#F1F3F5;color:#8A95A3;cursor:default}
.lchip.soon b{color:#9AA4B0}
.lchip.soon:hover{border-color:transparent}
.p-read{--acc:var(--teal);--acc-soft:var(--teal-soft)}
.p-gg{--acc:var(--rose);--acc-soft:var(--rose-soft)}
.p-verbs{--acc:var(--moss);--acc-soft:var(--moss-soft)}
.later{font-size:13px;color:var(--muted);margin-top:8px}

/* hub covers: whole picture, never cropped */
.cover{height:clamp(48px,10vh,104px);border-radius:10px;background:var(--acc-soft);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:8px;position:relative}
.cover img{width:100%;height:100%;object-fit:contain;display:block}
.cover .motif{font-family:var(--serif);font-weight:700;font-size:clamp(28px,6vh,44px);color:var(--acc);letter-spacing:.02em}
.pcard h2 .cnt2{margin-left:auto;font-family:var(--ui);background:var(--acc-soft);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;color:var(--acc)}
.pcard h2{display:flex;align-items:baseline;gap:8px}
.lchip{min-height:34px;padding:5px 9px}
/* lesson frame */
.lessonview{height:100%;display:flex;flex-direction:column;gap:8px}
.ltop{display:flex;align-items:center;gap:10px;flex:0 0 auto;border-bottom:1px solid var(--line);padding-bottom:7px}
.lid{background:var(--acc);color:#fff;border-radius:6px;padding:3px 8px;font-weight:800;font-size:15px}
.ltitle{font-weight:700;font-size:17px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lmain{flex:1;min-height:0;display:grid;grid-template-columns:236px 1fr;gap:12px}
.qside{display:flex;flex-direction:column;gap:6px;min-height:0}
.qlab{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.qwrap{position:relative}
.qcard{height:min(34vh,230px);min-height:160px;perspective:900px;cursor:pointer}
.qcard .inner{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.qcard.flip .inner{transform:rotateY(180deg)}
.qcard .side{position:absolute;inset:0;backface-visibility:hidden;background:var(--card);border:1.5px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;text-align:center;gap:6px}
.qcard .back{transform:rotateY(180deg);background:var(--acc-soft)}
.qword{font-family:var(--serif);font-weight:700;font-size:clamp(28px,5.2vh,40px)}
.qru{font-size:clamp(20px,3.6vh,26px);font-weight:700}
.qex{font-family:var(--serif);font-size:clamp(16px,2.6vh,19px);color:var(--muted)}
.qimg{max-width:100%;max-height:48%;border-radius:8px;object-fit:contain}
.qbar{display:flex;align-items:center;justify-content:space-between}
.qcnt{color:var(--muted);font-size:14px}
.spk{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;padding:0;flex:0 0 auto}
.spk svg{width:20px;height:20px}
.spk:hover{border-color:var(--acc)}
.spk.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.spk.err{animation:shake .35s;background:var(--bad-soft)}
.spk.big{width:62px;height:62px}.spk.big svg{width:30px;height:30px}
.qwrap .spk{position:absolute;top:8px;right:8px;z-index:3}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 14px;border-radius:8px;font-size:14px;z-index:50}

.stage{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 16px 12px;display:flex;flex-direction:column;min-height:0;min-width:0}
.bchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;flex:0 0 auto}
.bchip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 9px;font-size:13px;font-weight:600;color:var(--muted)}
.bchip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.bchip:hover:not(.on){border-color:var(--acc)}
.act{flex:1;min-height:0;display:flex;flex-direction:column}
.ahead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex:0 0 auto;margin-bottom:6px}
.atitle{font-weight:800;font-size:19px;letter-spacing:-.01em}
.ainstr{font-family:var(--serif);color:var(--muted);font-size:17px}
.abody{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;overflow:auto}

/* overview */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-content:start}
.tile{background:var(--acc-soft);border:1.5px solid transparent;border-radius:10px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:76px}
.tile:hover{border-color:var(--acc)}
.tile b{font-size:13px;color:var(--acc);letter-spacing:.05em}
.tile span{font-weight:700;font-size:17px;line-height:1.15}
.tile small{color:var(--muted);font-size:12px}

/* options */
.qprompt{display:flex;align-items:center;justify-content:center;gap:16px;min-height:78px;flex:0 0 auto}
.qtext{font-family:var(--serif);font-size:clamp(24px,5vh,38px);font-weight:600;text-align:center}
.cnt{color:var(--muted);font-size:14px;text-align:right;flex:0 0 auto}
.opts{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:minmax(0,1fr);gap:10px;flex:1 1 auto;max-height:44vh;min-height:0}
.opt{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:clamp(22px,4.6vh,34px);font-weight:600;text-align:center;line-height:1.1}
.opt:hover:not(:disabled){border-color:var(--acc);background:var(--acc-soft)}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default;color:var(--ink)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;flex:0 0 auto}
.fb{font-family:var(--serif);font-size:18px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.hl{color:var(--rose);font-weight:700}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* sort */
.buckets{display:grid;gap:10px;flex:1;min-height:0}
.bucket{border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:4px;align-items:center;background:#FBFCFD;cursor:pointer;min-height:0;overflow:hidden}
.bucket:hover{border-color:var(--acc);background:var(--acc-soft)}
.bk{font-family:var(--serif);font-weight:700;font-size:clamp(20px,3.8vh,28px)}
.bs{color:var(--muted);font-size:14px;margin-top:-4px}
.bucket .w{font-family:var(--serif);font-size:clamp(17px,3vh,22px)}
.chiprow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;flex:0 0 auto;min-height:60px}
.wchip{background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px 16px;font-family:var(--serif);font-size:clamp(22px,4.2vh,32px);font-weight:600}
.wchip.sel{border-color:var(--acc);background:var(--acc-soft)}
.wchip.gone{visibility:hidden}

/* build */
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.slot{min-width:64px;height:clamp(54px,9vh,78px);border-bottom:4px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:clamp(28px,6vh,44px);font-weight:600;cursor:pointer;padding:0 10px}
.slot.full{border-color:var(--acc)}
.slots.ok .slot{border-color:var(--ok);color:var(--ok)}
.tilerow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tilebtn{background:#fff;border:2px solid var(--line);border-radius:10px;min-width:64px;padding:8px 14px;font-family:var(--serif);font-size:clamp(26px,5.4vh,40px);font-weight:600}
.tilebtn:hover:not(:disabled){border-color:var(--acc)}
.tilebtn.used{visibility:hidden}

/* ladder / sents */
.ladder{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1;min-height:0}
.lw{background:#fff;border:2px solid var(--line);border-radius:12px;font-family:var(--serif);font-weight:600;font-size:clamp(34px,9vh,62px);display:flex;align-items:center;justify-content:center}
.lw:hover{border-color:var(--acc);background:var(--acc-soft)}
.sline{display:flex;align-items:center;gap:12px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px 14px;flex:1;min-height:0;cursor:pointer;text-align:left}
.sline:hover{border-color:var(--acc)}
.stxt{font-family:var(--serif);font-size:clamp(20px,4.2vh,30px);font-weight:600}
.sline.hid .stxt{color:transparent;background:repeating-linear-gradient(90deg,#E4EAEE 0 14px,transparent 14px 20px);border-radius:6px;height:.55em;min-width:60%;flex:0 1 70%}
.slist{display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}

/* lava */
.stones{display:flex;gap:8px;align-items:center}
.stone{width:26px;height:18px;border-radius:50%;background:#8E99A6}
.stone.lost{background:#F0B6A8}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tf .opt{font-family:var(--ui);font-weight:700}

/* speed / ring */
.ring{--d:15s;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--acc) 0 100%,#E4EAEE 0);display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative}
.ring::after{content:"";position:absolute;inset:7px;background:#fff;border-radius:50%}
.ring span{position:relative;z-index:1;font-weight:800;font-size:20px}
.bigword{font-family:var(--serif);font-weight:700;font-size:clamp(44px,13vh,96px);text-align:center}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;min-height:0}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn.lg{padding:12px 22px;font-size:18px}

/* match */
.mcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
.mcol{display:flex;flex-direction:column;gap:8px;min-height:0}
.mbtn{flex:1;min-height:0;background:#fff;border:2px solid var(--line);border-radius:10px;font-family:var(--serif);font-size:clamp(20px,4vh,30px);font-weight:600;padding:4px 10px}
.mbtn:hover:not(:disabled){border-color:var(--acc)}
.mbtn.sel{border-color:var(--acc);background:var(--acc-soft)}
.mbtn.done{border-color:var(--ok);background:var(--ok-soft);opacity:.55}

/* hunt */
.hwords{display:flex;gap:10px 8px;flex-wrap:wrap;justify-content:center;align-content:center;flex:1}
.hw{background:#fff;border:2px solid transparent;border-radius:10px;padding:6px 12px;font-family:var(--serif);font-size:clamp(26px,6vh,44px);font-weight:600}
.hw:hover:not(:disabled){border-color:var(--line)}
.hw.sel{border-color:var(--acc);background:var(--acc-soft)}
.hw.ok{border-color:var(--ok);background:var(--ok-soft)}
.hw.bad{border-color:var(--bad);background:var(--bad-soft)}

/* predict / photo */
.predict{flex-direction:row;gap:16px}
.photo{flex:1.2;min-height:0;border-radius:12px;overflow:hidden;background:#EEF2F5;display:flex;align-items:center;justify-content:center}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.photo.ph{border:2px dashed var(--line)}
.phcap{padding:16px;text-align:center;color:var(--muted);font-family:var(--serif);font-style:italic;font-size:17px}
.pright{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.pq{font-family:var(--serif);font-size:clamp(22px,4.2vh,30px);font-weight:600}
.popts{display:flex;flex-direction:column;gap:8px}
.popts .opt{text-align:left;font-size:clamp(19px,3.6vh,26px);padding:10px 14px}
.reveal{background:var(--acc-soft);border-radius:10px;padding:10px 14px;font-family:var(--serif);font-size:clamp(19px,3.4vh,24px)}

/* rule */
.rule{display:flex;flex-direction:column;gap:12px}
.rbig{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.rbig .g{font-family:var(--serif);font-weight:700;font-size:clamp(48px,12vh,90px);color:var(--rose);line-height:1}
.rbig .ipa{font-size:clamp(24px,5vh,36px);color:var(--muted)}
.rkeys{display:flex;gap:8px;flex-wrap:wrap}
.say{background:#fff;border:2px solid var(--line);border-radius:10px;padding:6px 14px;font-family:var(--serif);font-size:clamp(20px,4vh,30px);font-weight:600;cursor:pointer}
.say:hover{border-color:var(--acc);background:var(--acc-soft)}
.note{background:var(--sun-soft);border-radius:10px;padding:8px 12px;font-size:clamp(15px,2.6vh,18px)}
.rtable{border-collapse:collapse;font-family:var(--serif);font-size:clamp(17px,3vh,24px)}
.rtable td,.rtable th{border:1px solid var(--line);padding:3px 12px;text-align:left}
.rtable .say{padding:2px 10px;font-size:inherit}
.rtable th{background:var(--acc-soft);font-family:var(--ui);font-size:14px}

/* speak */
.sp{display:grid;grid-template-columns:1.3fr 1fr;gap:14px;flex:1;min-height:0}
.spcard{border:2px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:12px;text-align:center}
.spcard .pr{font-family:var(--serif);font-size:clamp(24px,5.4vh,40px);font-weight:600}
.pats{display:flex;flex-direction:column;gap:8px;overflow:auto}

/* result */
.endbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;flex:1;min-height:0;text-align:center}
.score{font-weight:800;font-size:clamp(40px,10vh,70px)}
.errs{font-family:var(--serif);font-size:18px;color:var(--muted);max-height:30vh;overflow:auto}

/* teacher */
.tover{position:fixed;inset:0;background:rgba(27,37,51,.5);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.tpanel{background:#fff;border-radius:14px;padding:18px 22px;max-width:860px;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.tpanel .th{font-weight:800;font-size:20px}
.tpanel .tt{font-size:16px;line-height:1.45}
.tpanel table{border-collapse:collapse;font-size:14px}
.tpanel td,.tpanel th{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.tpanel th{background:var(--sun-soft)}
@media (max-width:900px){.paths{grid-template-columns:1fr}.lmain{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(2,1fr)}}
.pstim{max-height:26vh;max-width:70%;object-fit:contain;border-radius:10px;margin:4px auto 0;display:block}
.pgrid{display:grid;gap:10px;flex:1 1 auto;min-height:0;max-height:48vh}
.pimg{background:#fff;border:2px solid var(--line);border-radius:12px;padding:4px;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pimg img{max-width:100%;max-height:100%;object-fit:contain}
.pimg.ok{border-color:var(--ok);background:var(--ok-soft,#E3F1E6)}.pimg.bad{border-color:#C0584F;background:var(--bad-soft)}
.spimg{max-height:30vh;max-width:90%;object-fit:contain;border-radius:10px}
</style>
</head>
<body>
<div id="app"></div>
<script src="data-reading.js?v=10"></script>
<script src="data-gg.js?v=10"></script>
<script src="data-verbs.js?v=10"></script>
<script src="engine.js?v=10"></script>
</body>
</html>
