<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Timofey — ОГЭ · Reading · 6 ноября</title>
<style>
:root{
  --bg:#cdd6dc;--card:#edf1f3;--card2:#dde4e8;--ink:#1d2932;--muted:#566673;--line:#b3c0c9;--steel:#44637d;
  --accent:#41705f;--accent-dark:#335a4c;--ok:#d5e6dd;--okline:#8fbfa5;--oktext:#1e5c43;
  --bad:#a4483f;--badbg:#f0dcd9;--badline:#d0a9a3;--mono:Georgia,"Times New Roman",Times,serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:var(--mono);font-size:18px;
  background:var(--bg);background-image:linear-gradient(rgba(40,60,75,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(40,60,75,.07) 1px,transparent 1px);
  background-size:32px 32px}
button{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:20;background:var(--steel);color:#e6edf2;display:flex;align-items:center;gap:14px;padding:7px 14px;flex-wrap:wrap}
.top b{color:#a8d8c2}
.top .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .btn{padding:4px 12px;font-size:16px}
.stat{font-weight:700;color:#fff;white-space:nowrap}
.btn{border:1px solid var(--line);border-radius:6px;background:var(--card2);padding:8px 16px;font-size:18px;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap;display:inline-block}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-dark);color:#fff}
.hidden{display:none!important}
.muted{color:var(--muted)}
.wrap{max-width:1340px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:0}
.tab{display:flex;flex-direction:column;align-items:flex-start;gap:1px;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--card2);padding:5px 12px;cursor:pointer}
.tab b{font-size:16px;font-weight:700;line-height:1.15}
.tab span{font-size:14px;color:var(--muted)}
.tab.active{background:#fff;border-color:var(--accent)}
.tab.active b,.tab.active span{color:var(--accent)}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.result{font-size:17px;white-space:nowrap}
.result.full{color:#1e6b4a}.result.half{color:#8a6a12}.result.low{color:var(--bad)}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:10px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.panel .head{padding:6px 14px;background:var(--steel);color:#e6edf2;font-size:16px}
.panel .head b{color:#a8d8c2}
.text{padding:12px 16px;white-space:pre-wrap;line-height:1.5;font-size:17.5px;max-height:72vh;overflow:auto;background:#fff}
.qlist{background:#fff;padding:4px 12px}
.rq{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.rq:first-child{border-top:0}
.rqn{flex:0 0 26px;color:var(--muted);font-weight:700;font-size:15px;padding-top:2px}
.rqt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.rqt p{margin:0;font-size:16.5px;line-height:1.3}
.rbtns{display:flex;gap:6px;flex-wrap:wrap}
.rbtn{padding:3px 10px;font-size:14px;font-weight:700;border-radius:6px}
.rbtn.sel{background:var(--accent);border-color:var(--accent);color:#fff}
.rbtn.ok{background:var(--ok);border-color:var(--okline);color:var(--oktext)}
.rbtn.ok::after{content:" \2713"}
.rbtn.bad{background:var(--badbg);border-color:var(--badline);color:var(--bad)}
.rbtn.bad::after{content:" \2717"}
.rmiss{font-size:13.5px;font-weight:700;color:var(--bad)}
.rq.okrow .rqn{color:var(--oktext)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:15px;padding:2px 4px 10px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);max-width:min(760px,92vw);background:var(--ink);color:#fff;padding:12px 18px;border-radius:8px;font-size:17px;z-index:50}
@media(max-width:900px){.split{grid-template-columns:1fr}.text{max-height:none}.top .grow{white-space:normal}}
</style>
</head>
<body>
<header class="top">
  <a class="btn" href="https://altatiana7.github.io/timofey/">← Hub</a>
  <div class="grow"><b>&gt;</b> homework / ОГЭ · reading · 6 ноября</div>
  <div class="stat" id="progress">Заполнено 0 из 16</div>
</header>

<main class="wrap">
  <div class="bar">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="tools">
      <button type="button" class="btn primary" id="check">Проверить ответы</button>
      <button type="button" class="btn hidden" id="reset">Сбросить проверку</button>
      <b class="result" id="result"></b>
    </div>
  </div>

  <div class="split">
    <section class="panel">
      <div class="head"><b>//</b> <span id="textTitle"></span></div>
      <article class="text" id="text" lang="en"></article>
    </section>
    <section class="panel">
      <div class="head"><b>//</b> statements · True / False / Not stated</div>
      <div class="qlist" id="list"></div>
    </section>
  </div>

  <footer class="foot">
    <span>Домашка от 6 ноября · 2 текста × 8 вопросов · 16 баллов · ответы проверяются сразу</span>
    <span id="send"></span>
  </footer>
</main>

<div class="toast hidden" id="toast" role="status"></div>

<script src="../shared/hw-sent.js?v=2"></script>
<script>
const DATA = {
 "title": "ОГЭ · чтение · задание от 6 ноября",
 "sets": [
  {
   "id": "smart-glasses",
   "label": "Task 1",
   "title": "The Smart Glasses Scandal",
   "text": "The Smart Glasses Scandal\n\nWhen a small company in California presented its new smart glasses in March, the video looked perfect: the glasses could translate a menu, show a map and even remind you of a friend's name. Thousands of people ordered a pair before a single one had been produced.\n\nSix months later the story looked very different. Several users noticed that the glasses recorded short videos without any light or sound. The company explained that the camera started only when the owner touched the frame. However, a journalist proved that one small update could switch the camera on from a phone in another room. The company stopped the update immediately and apologised.\n\nThe most serious problem appeared at school. In one town a teacher discovered that a student had filmed a whole lesson through his glasses. The head teacher banned smart glasses in every classroom, and the parents supported her. The company offered to add a special school mode, but the school refused. \"We cannot check what a student is really doing in class,\" the head teacher said.\n\nNot everyone is against the glasses. Doctors who work with deaf people say that the glasses help their patients to read speech and to see warning sounds as words on the screen. Engineers point out that the first mobile phones were heavy and strange, too.\n\nThe company has not stopped working. Its next plan is a pair of glasses without a camera. \"Perhaps the best technology,\" one newspaper wrote, \"is the technology that does less.\"",
   "items": [
    {
     "id": "rd1",
     "key": "VHJ1ZQ==",
     "prompt": "People could order the glasses before a single pair had been produced."
    },
    {
     "id": "rd2",
     "key": "RmFsc2U=",
     "prompt": "The glasses recorded video with a warning light."
    },
    {
     "id": "rd3",
     "key": "VHJ1ZQ==",
     "prompt": "A journalist showed that the camera could be switched on from another room."
    },
    {
     "id": "rd4",
     "key": "RmFsc2U=",
     "prompt": "The company ignored the journalist's discovery."
    },
    {
     "id": "rd5",
     "key": "Tm90IHN0YXRlZA==",
     "prompt": "The student who filmed the lesson at school was punished."
    },
    {
     "id": "rd6",
     "key": "VHJ1ZQ==",
     "prompt": "The head teacher did not believe that the school could control how the glasses were used."
    },
    {
     "id": "rd7",
     "key": "VHJ1ZQ==",
     "prompt": "Doctors say the glasses can help people who cannot hear."
    },
    {
     "id": "rd8",
     "key": "RmFsc2U=",
     "prompt": "The company has decided to stop making glasses completely."
    }
   ]
  },
  {
   "id": "space-out",
   "label": "Task 2",
   "title": "The Competition Where Nobody Does Anything",
   "text": "The Competition Where Nobody Does Anything\n\nMost competitions ask you to run faster, jump higher or answer quicker. The \"space-out\" competition in Seoul asks you to do the opposite: for ninety minutes you must sit still, look at nothing and think about nothing. The winner is the person whose heart beats most calmly.\n\nThe idea came from the artist Woops Yang, who organised the first event in a park in 2014. She was very tired after a busy month and wanted one hour when nobody expected anything from her. Only twenty people came. Today the competition receives hundreds of applications, and similar events take place in other countries.\n\nThe rules are simple. You may not speak, laugh, check your phone or fall asleep. Judges walk between the participants and watch their faces. Anyone who laughs out loud is asked to leave. The winner, however, is chosen by the audience, who vote after watching the contestants' heart rates on a big screen.\n\nSome people think the whole competition is a joke. The participants disagree. \"My job is to answer messages all day,\" says a 29-year-old designer. \"Here I have to do the only thing I have forgotten how to do — nothing.\" Doctors add that such a rest is not the same as healthy sleep or sport, but a short break without a screen can help the brain.\n\nThe prize is unusual too: a golden trophy in the shape of a face that is looking at the sky. The winners say they keep it on their desks to remember that everybody needs to stop sometimes.",
   "items": [
    {
     "id": "rd9",
     "key": "VHJ1ZQ==",
     "prompt": "The winner of the competition is the person whose heart beats most calmly."
    },
    {
     "id": "rd10",
     "key": "RmFsc2U=",
     "prompt": "The first space-out competition was organised by a big company."
    },
    {
     "id": "rd11",
     "key": "VHJ1ZQ==",
     "prompt": "The artist organised the event because she wanted a rest from her busy life."
    },
    {
     "id": "rd12",
     "key": "Tm90IHN0YXRlZA==",
     "prompt": "The space-out competition in Seoul takes place every year."
    },
    {
     "id": "rd13",
     "key": "RmFsc2U=",
     "prompt": "Participants are allowed to fall asleep during the competition."
    },
    {
     "id": "rd14",
     "key": "RmFsc2U=",
     "prompt": "The judges choose the winner of the competition."
    },
    {
     "id": "rd15",
     "key": "Tm90IHN0YXRlZA==",
     "prompt": "The designer has taken part in the competition more than once."
    },
    {
     "id": "rd16",
     "key": "VHJ1ZQ==",
     "prompt": "Doctors believe a short break without a screen can be good for the brain."
    }
   ]
  }
 ]
};
const LS = "timofey-oge-reading-2026-11-06";
const OPTIONS = ["True","False","Not stated"];
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e;};
const $=id=>document.getElementById(id);
function key(item){try{return atob(item.key)}catch(e){return ""}}
let state={answers:{},checked:false,tab:0};
try{const s=JSON.parse(localStorage.getItem(LS)||"null");if(s&&s.answers)state=Object.assign(state,s);}catch(e){}
function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function toast(m){const t=$("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(t.t);t.t=setTimeout(()=>t.classList.add("hidden"),7000);}
function totals(){let ok=0,filled=0,total=0;
  DATA.sets.forEach(s=>s.items.forEach(it=>{total++;const a=state.answers[it.id];if(a){filled++;if(a===key(it))ok++;}}));
  return {ok,filled,total};}

function drawTabs(){
  $("tabs").replaceChildren(...DATA.sets.map((s,i)=>{
    const b=el("button","tab"+(i===state.tab?" active":""));b.type="button";b.setAttribute("role","tab");
    const filled=s.items.filter(it=>state.answers[it.id]).length;
    b.append(el("b","",s.label+" · "+s.title),el("span","",filled+" / "+s.items.length+" отвечено"));
    b.onclick=()=>{state.tab=i;save();draw();};
    return b;
  }));
}
function drawList(){
  const set=DATA.sets[state.tab];
  $("list").replaceChildren(...set.items.map((it,i)=>{
    const row=el("div","rq"), num=el("span","rqn",String(i+1).padStart(2,"0"));
    const tx=el("div","rqt"), p=el("p");p.lang="en";p.textContent=it.prompt;tx.append(p);
    const btns=el("div","rbtns"), a=state.answers[it.id], k=key(it);
    OPTIONS.forEach(o=>{
      const b=el("button","btn rbtn",o);b.type="button";
      if(a===o)b.classList.add("sel");
      if(state.checked){if(o===k)b.classList.add("ok");else if(a===o)b.classList.add("bad");}
      b.onclick=()=>{state.answers[it.id]=o;save();draw();};
      btns.append(b);
    });
    if(state.checked){
      if(!a){tx.append(el("span","rmiss","нет ответа · верный ответ: "+k));}
      else if(a!==k){tx.append(el("span","rmiss","верный ответ: "+k));}
      else row.classList.add("okrow");
    }
    tx.append(btns);row.append(num,tx);return row;
  }));
}
function draw(){
  if(state.tab>=DATA.sets.length)state.tab=0;
  const set=DATA.sets[state.tab];
  drawTabs();
  $("textTitle").textContent=set.label+" · "+set.title;
  $("text").textContent=set.text;
  drawList();
  const t=totals();
  const res=$("result");
  if(state.checked){res.textContent="Результат: "+t.ok+" из "+t.total+" баллов";
    res.className="result "+(t.ok===t.total?"full":t.ok*2>=t.total?"half":"low");}
  else{res.textContent="";res.className="result";}
  $("progress").textContent=(state.checked?"Проверено ":"Заполнено ")+t.filled+" из "+t.total;
  $("check").textContent=state.checked?"Проверить снова":"Проверить ответы";
  $("reset").classList.toggle("hidden",!state.checked);
}

$("check").onclick=()=>{
  const t=totals();
  if(!t.filled){toast("Сначала ответь хотя бы на один вопрос.");return;}
  state.checked=true;save();draw();
  const n=totals();
  toast("Верно "+n.ok+" из "+n.total+". Баллов: "+n.ok+" из "+n.total+"."+(n.ok===n.total?" Отлично!":" Ошибки подсвечены — посмотри верные ответы."));
};
$("reset").onclick=()=>{state.checked=false;save();draw();};

if(window.HWSent){
  HWSent.doneButton({student:"timofey",name:"Тимофей",page:"timofey-oge-reading-2026-11-06",title:"ОГЭ · чтение · 6 ноября"});
}
draw();
</script>
</body>
</html>
