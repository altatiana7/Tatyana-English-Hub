<div class="task" style="border-left:4px solid var(--teal);padding:12px">
<b>LESSON 3 · WEEK 1 FINAL · 60 MIN</b><br><span class="tiny">Цель: Present Simple / Continuous / Perfect / Perfect Continuous → EGE 19–24. Порог: 80%+.</span>
</div>
<div class="box" style="margin-top:8px"><h3>1 · RETRIEVAL WARM-UP · 0–8 MIN</h3>
<p>Сначала без подсказок. Назови форму и объясни сигнал.</p>
<div class="task">1. My sister usually ___ (STUDY) in the evening.<br>2. Be quiet! I ___ (LISTEN) to the recording.<br>3. We ___ already ___ (FINISH) the first exercise.<br>4. She ___ (LEARN) English for six years and she still studies it.<br>5. I ___ (KNOW) her since primary school.<br>6. Why ___ you ___ (LOOK) at me like that?<br>7. Tom ___ never ___ (BE) abroad.<br>8. This month we ___ (WORK) especially hard on grammar.</div>
</div>

<div class="box" style="margin-top:8px"><h3>2 · IRREGULAR VERBS RETRIEVAL · 8–15 MIN</h3>
<p>Не называй формы по порядку. Дай Арине пропуск — она должна определить, нужна V2 или V3.</p>
<div class="task"><b>20 verbs:</b> be · become · begin · break · bring · buy · come · do · drink · eat · find · get · give · go · know · make · read · see · take · write</div>
<div class="task">A. She has ___ three books this month. (READ)<br>B. I have never ___ such a strange building. (SEE)<br>C. He has ___ his phone again. (BREAK)<br>D. We have ___ a lot of work today. (DO)<br>E. My English has ___ much better. (BECOME)<br>F. They have just ___ back home. (COME)<br>G. She has ___ me some useful advice. (GIVE)<br>H. I have ___ this word before. (KNOW)<br>I. He has ___ a new laptop. (BUY)<br>J. We have ___ several mock tests. (TAKE)</div>
</div>

<div class="box" style="margin-top:8px"><h3>3 · FLOOR IS LAVA · MIXED PRESENT · 15–25 MIN</h3>
<p>10 ступеней. Ошибка = шаг вниз. Ответ засчитывается только вместе с объяснением значения.</p>
<div class="task">1. Emma ___ (WORK) in a language school every Saturday.<br>2. Look! The children ___ (RUN) towards us.<br>3. I ___ just ___ (SEND) the email.<br>4. How long ___ you ___ (WAIT)?<br>5. I ___ (THINK) this answer is wrong.<br>6. I ___ (THINK) about changing my study routine this week.<br>7. This soup ___ (TASTE) wonderful.<br>8. The chef ___ (TASTE) the soup at the moment.<br>9. She ___ (HAVE) this laptop for three years.<br>10. Why are you tired? — I ___ (REVISE) grammar all morning.</div>
</div>

<div class="box" style="margin-top:8px;background:var(--soft)"><h3>4 · EGE 19–24 · SET 1 · 25–37 MIN</h3>
<p><b>Exam mode:</b> сначала весь текст → затем формы. Для каждого ответа: signal → meaning → tense → form.</p>
<div class="task"><b>A STUDENT'S NEW ROUTINE</b><br><br>
Arina is preparing for an important English exam. She usually <b>19 ______</b> her revision with a short vocabulary activity. <b>(START)</b><br><br>
This week, however, she <b>20 ______</b> much more attention to grammar because she wants to improve her accuracy. <b>(PAY)</b><br><br>
She <b>21 ______</b> already <b>______</b> several exercises on Present tenses, so some rules are becoming easier. <b>(COMPLETE)</b><br><br>
Her teacher <b>22 ______</b> her for several weeks now, and they are gradually identifying the most difficult areas. <b>(HELP)</b><br><br>
Arina knows that regular practice matters. She <b>23 ______</b> never <b>______</b> that one long study session is enough. <b>(BELIEVE)</b><br><br>
At the moment she <b>24 ______</b> on a mixed grammar task and checking every answer carefully. <b>(WORK)</b></div>
</div>

<div class="box" style="margin-top:8px;background:var(--soft)"><h3>5 · EGE 19–24 · SET 2 · 37–49 MIN</h3>
<p><b>No help.</b> Второй сет выполняется самостоятельно.</p>
<div class="task"><b>WHY PRACTICE WORKS</b><br><br>
Many students <b>19 ______</b> that progress depends on long hours of study. <b>(THINK)</b><br><br>
In reality, researchers say that regular short sessions can be more effective. More and more learners <b>20 ______</b> this approach nowadays. <b>(USE)</b><br><br>
Some of them <b>21 ______</b> already <b>______</b> a noticeable improvement in their results. <b>(SEE)</b><br><br>
A learner who <b>22 ______</b> regularly for several months often becomes more confident. <b>(PRACTISE)</b><br><br>
Good learners also review their mistakes. They <b>23 ______</b> not simply <b>______</b> the correct answer and move on. <b>(WRITE)</b><br><br>
Instead, they ask why the mistake happened. This habit <b>24 ______</b> them understand grammar more deeply. <b>(HELP)</b></div>
</div>

<div class="box" style="margin-top:8px"><h3>6 · ERROR LOG · 49–55 MIN</h3>
<div class="task"><b>Заполнять только ошибки:</b><br>MY ANSWER → CORRECT ANSWER → WHY? → MY NEW EXAMPLE<br><br>1. ______ → ______ → ______ → ______<br>2. ______ → ______ → ______ → ______<br>3. ______ → ______ → ______ → ______</div></div>

<div class="box" style="margin-top:8px"><h3>7 · WEEK 1 CHECKPOINT · 55–60 MIN</h3>
<p>5 заданий. <b>4/5 = цель недели достигнута.</b></p>
<div class="task">1. I ___ (KNOW) my best friend for ten years.<br>2. She ___ (PREPARE) for the exam all morning and needs a break.<br>3. Listen! Someone ___ (CALL) your name.<br>4. My brother usually ___ (DO) his homework before dinner.<br>5. We ___ already ___ (TAKE) three practice tests this month.</div>
</div>
