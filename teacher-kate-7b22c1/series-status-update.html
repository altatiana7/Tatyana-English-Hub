<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><script>/* open-from-main-screen */(function(){try{if(window.top!==window)return;var r=document.referrer;if(r&&new URL(r).origin===location.origin)return}catch(e){return}location.replace("index.html")})();</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Katya · Status Update</title>
<style>
:root{--ink:#223d3c;--navy:#155e61;--muted:#66756f;--line:#dfe6e0;--bg:#f5f5f0;--accent:#c57e67;--soft:#f2f5ef;--blush:#f4e9e2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,Arial,Helvetica,sans-serif;color:var(--ink);background:var(--bg)}
body{overflow:hidden}
a{color:inherit;text-decoration:none}
.app{height:100dvh;display:grid;grid-template-rows:minmax(0,42fr) minmax(0,58fr);gap:clamp(10px,1.6vh,16px);padding:clamp(10px,1.6vh,16px) clamp(12px,1.4vw,22px)}
/* hero */
.hero{position:relative;border-radius:16px;overflow:hidden;background:#173f49 url(assets/status-update/hero.jpg) center 35%/cover no-repeat;min-height:0}
.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(21,46,48,.92) 0%,rgba(21,46,48,.78) 34%,rgba(21,46,48,.15) 62%,rgba(21,46,48,0) 100%)}
.hero-in{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;gap:clamp(4px,1vh,10px);padding:0 clamp(18px,2.4vw,36px);max-width:560px;color:#fff}
.kicker{font-size:12px;font-weight:800;letter-spacing:.18em;color:#f2c8b7;margin:0}
h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(34px,7.4vh,58px);line-height:1;margin:0;font-weight:700;letter-spacing:-.02em}
h1 span{color:#f2c8b7;font-style:italic}
.sub{font-size:clamp(14px,2.4vh,17px);line-height:1.4;margin:0;color:#e9f0ed}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tags span{font-size:12px;font-weight:700;letter-spacing:.06em;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:4px 10px;background:rgba(255,255,255,.08)}
.hub{position:absolute;top:12px;right:12px;z-index:2;border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.85);color:var(--navy);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:800;letter-spacing:.06em;text-decoration:none}
/* lessons */
.row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:clamp(8px,1vw,14px);min-height:0}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-height:0;transition:transform .15s,box-shadow .15s}
.card.live{border-color:var(--navy);box-shadow:0 0 0 2px #cfe2dd}
.card.live:hover{transform:translateY(-2px);box-shadow:0 0 0 2px #cfe2dd,0 10px 22px rgba(21,94,97,.14)}
.ph{flex:0 0 42%;min-height:0;background:#ddd center/cover no-repeat;position:relative}
.num{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.92);color:var(--navy);font-size:11px;font-weight:800;letter-spacing:.12em;border-radius:6px;padding:4px 8px}
.txt{flex:1;display:flex;flex-direction:column;gap:clamp(3px,.7vh,6px);padding:clamp(8px,1.5vh,13px) clamp(10px,1vw,14px);min-height:0}
.txt h2{font-family:Georgia,"Times New Roman",serif;font-size:clamp(17px,3vh,22px);line-height:1.1;margin:0;color:var(--navy);letter-spacing:-.01em}
.txt p{font-size:clamp(13px,2.2vh,15px);line-height:1.35;margin:0;color:var(--muted);flex:1}
.go{display:flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:clamp(6px,1.3vh,9px) 10px;font-size:14px;font-weight:800;text-decoration:none;border:1px solid}
.card.live .go{background:var(--navy);border-color:var(--navy);color:#fff}
.card.soon .go{background:var(--soft);border-color:#d5e0d7;color:#8a9a94;cursor:default}
.c1 .num{color:#1d7f80}.c2 .num{color:#9a6b12}.c3 .num{color:#b8456a}.c4 .num{color:#2f62a3}.c5 .num{color:#6a4aa0}
@media(max-width:820px){body{overflow:auto}.app{height:auto;grid-template-rows:auto auto}.hero{min-height:260px}.row{grid-template-columns:1fr 1fr}.ph{flex-basis:120px}}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <a class="hub" href="index.html?teacher=tatiana-katya" target="_top">HUB</a>
    <div class="hero-in">
      <p class="kicker">KATYA · A SERIES OF 5 LESSONS</p>
      <h1>Status <span>Update</span></h1>
      <p class="sub">Generations, money, attention and the real cost of being seen.</p>
      <div class="tags"><span>PEOPLE</span><span>MONEY</span><span>SOCIAL MEDIA</span><span>THE FUTURE</span></div>
    </div>
  </section>
  <section class="row" id="row"></section>
</div>
<script>
const LESSONS=[
 {t:'Generation Now',q:'What defines your generation?',img:'p1.jpg',url:''},
 {t:'Money, Status & Likes',q:'What matters most today?',img:'p2.jpg',url:''},
 {t:'Seen & Spent',q:'Attention, consumption and the real cost.',img:'p3.jpg',url:'lesson5-attention-trap.html?v=20261020-su'},
 {t:'The Price of Being Gen Z',q:'What do we gain and what do we lose?',img:'p4.jpg',url:''},
 {t:'Status Update',q:'Your voice. Your ideas. Your future.',img:'p5.jpg',url:''}
];
const row=document.getElementById('row');
LESSONS.forEach((l,i)=>{
  const c=document.createElement(l.url?'a':'div');
  c.className='card c'+(i+1)+(l.url?' live':' soon');
  if(l.url)c.href=l.url;
  c.innerHTML='<div class="ph" style="background-image:url(assets/status-update/'+l.img+')"><span class="num">LESSON '+(i+1)+'</span></div>'+
    '<div class="txt"><h2>'+l.t+'</h2><p>'+l.q+'</p><span class="go">'+(l.url?'Start lesson →':'Coming soon')+'</span></div>';
  row.appendChild(c);
});
</script>
</body>
</html>
