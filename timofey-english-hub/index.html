<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Timofey's English Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020914;font-family:Arial,Helvetica,sans-serif}button{font:inherit}
#app{position:fixed;inset:0;display:grid;place-items:center;background:#020914}.board{position:relative;width:1672px;height:941px;transform-origin:center center;overflow:hidden;background:#07182f;box-shadow:0 0 70px #000}.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}.hotspot{position:absolute;border:0;background:transparent;border-radius:12px;cursor:pointer;padding:0;color:transparent;outline:0}.hotspot::after{content:"";position:absolute;inset:2px;border:2px solid transparent;border-radius:inherit;transition:.16s ease;pointer-events:none}.hotspot:hover::after,.hotspot:focus-visible::after{border-color:rgba(126,203,255,.95);box-shadow:0 0 0 3px rgba(30,145,255,.18),0 0 26px rgba(0,141,255,.55)}.hotspot:active::after{background:rgba(35,156,255,.13)}
.viewer{position:fixed;inset:0;z-index:50;background:linear-gradient(145deg,#061326,#0b2442 55%,#07172d);color:#f5f9ff;display:none;flex-direction:column}.viewer.open{display:flex}.viewerbar{height:72px;flex:0 0 72px;display:flex;align-items:center;gap:14px;padding:10px 18px;background:rgba(4,16,32,.96);border-bottom:1px solid rgba(101,184,255,.28)}.viewerbar h1{font-size:clamp(20px,2vw,30px);margin:0;flex:1;text-align:center;letter-spacing:.2px}.viewerbar button{min-width:52px;height:48px;border:1px solid rgba(108,188,255,.55);border-radius:12px;background:#0e2c50;color:white;cursor:pointer;padding:0 16px;font-weight:700}.viewerbar button:hover{background:#164370}.workspace{position:relative;flex:1;min-height:0;overflow:auto;background:radial-gradient(circle at 50% 30%,rgba(38,96,151,.18),transparent 48%)}.blank{height:100%;min-height:420px;display:grid;place-items:center;text-align:center;padding:30px;color:#b9cee2}.blank strong{display:block;color:#edf7ff;font-size:clamp(36px,6vw,84px);line-height:1;margin-bottom:16px}.blank span{font-size:18px;opacity:.72}.lesson-frame{position:absolute;inset:0;width:100%;height:100%;border:0;background:white}.load-error{position:absolute;inset:0;display:grid;place-items:center;color:#fff;padding:30px;text-align:center;background:#07182f;z-index:4}
@media(max-width:700px){.viewerbar{height:62px;flex-basis:62px;padding:7px}.viewerbar button{height:46px;min-width:46px;padding:0 10px}.viewerbar h1{font-size:18px}}
</style>
</head>
<body>
<div id="app"><div class="board" id="board"><img id="cover" class="cover" alt="Timofey's English Hub"><div id="hotspots"></div></div></div>
<section class="viewer" id="viewer" aria-hidden="true">
  <header class="viewerbar"><button id="back" type="button">← Back</button><h1 id="viewerTitle">Lesson</h1><button id="fs" type="button" title="Fullscreen">⛶</button></header>
  <main class="workspace" id="workspace"></main>
</section>
<script>
(()=>{
const W=1672,H=941,board=document.getElementById('board'),cover=document.getElementById('cover'),hotspots=document.getElementById('hotspots'),viewer=document.getElementById('viewer'),title=document.getElementById('viewerTitle'),workspace=document.getElementById('workspace'),back=document.getElementById('back'),fs=document.getElementById('fs');
const urls={};
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);board.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();
Promise.all([1,2,3,4,5].map(i=>fetch(`cover-part-${i}.txt`).then(r=>{if(!r.ok)throw Error('cover');return r.text()}))).then(p=>cover.src='data:image/webp;base64,'+p.join('').replace(/\s/g,'')).catch(()=>{const d=document.createElement('div');d.className='load-error';d.textContent='Cover image could not be loaded. Refresh the page.';board.appendChild(d)});
function hotspot(label,x,y,w,h,key){const b=document.createElement('button');b.type='button';b.className='hotspot';b.setAttribute('aria-label',label);Object.assign(b.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});b.addEventListener('click',()=>openView(key,label));hotspots.appendChild(b)}
const xs=[41,118,197,275],ys=[202,292,381,470,559];let n=1;ys.forEach(y=>xs.forEach(x=>{hotspot('Lesson '+n,x,y,70,80,'lesson-'+n);n++}));
[['Listening',1300,196,309,88,'oge-listening'],['Reading',1300,294,309,88,'oge-reading'],['Grammar',1300,391,309,88,'oge-grammar'],['Vocabulary',1300,489,309,88,'oge-vocabulary'],['Writing',1300,586,309,89,'oge-writing'],['Speaking',1300,685,309,88,'oge-speaking']].forEach(a=>hotspot(a[0],a[1],a[2],a[3],a[4],a[5]));
hotspot('Open Lesson 1',420,472,292,66,'lesson-1');
function render(key,label){title.textContent=label;workspace.replaceChildren();if(urls[key]){const f=document.createElement('iframe');f.className='lesson-frame';f.src=urls[key];f.title=label;f.allow='fullscreen; autoplay';workspace.appendChild(f)}else{const d=document.createElement('div');d.className='blank';d.innerHTML='<div><strong>'+label.replace(/[<>]/g,'')+'</strong><span>Ready for content</span></div>';workspace.appendChild(d)}}
async function openView(key,label){render(key,label);viewer.classList.add('open');viewer.setAttribute('aria-hidden','false');history.replaceState(null,'','#'+key);try{if(document.fullscreenEnabled&&!document.fullscreenElement)await viewer.requestFullscreen()}catch(e){}}
async function closeView(){if(document.fullscreenElement){try{await document.exitFullscreen()}catch(e){}}viewer.classList.remove('open');viewer.setAttribute('aria-hidden','true');workspace.replaceChildren();history.replaceState(null,'',location.pathname+location.search)}
back.addEventListener('click',closeView);fs.addEventListener('click',async()=>{try{document.fullscreenElement?await document.exitFullscreen():await viewer.requestFullscreen()}catch(e){}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&viewer.classList.contains('open')&&!document.fullscreenElement)closeView()});
function fromHash(){const k=location.hash.slice(1);if(/^lesson-(?:[1-9]|1\d|20)$/.test(k))openView(k,'Lesson '+k.split('-')[1]);else if(/^oge-(listening|reading|grammar|vocabulary|writing|speaking)$/.test(k)){const s=k.slice(4);openView(k,s[0].toUpperCase()+s.slice(1))}}
if(location.hash)fromHash();
})();
</script>
</body>
</html>
