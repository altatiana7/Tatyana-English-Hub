<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Gabi · What Happens Next? · will for predictions</title>
<style>
:root{--ink:#14181f;--muted:#4c5565;--yellow:#ffd21f;--yellowD:#d9ae00;--card:rgba(255,255,255,.9);--line:#d9dee6;--ok:#d6f0de;--bad:#ffe0d9}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#b9b3a6;overflow:hidden}
button,a{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,a:focus-visible{outline:3px solid #1f78a5;outline-offset:2px}
button:disabled{opacity:.4;cursor:default}
#bg{position:fixed;inset:-60px;background-size:cover;background-position:center;filter:blur(46px) saturate(.9);opacity:.85;z-index:0}
.top{position:fixed;z-index:3;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:14px 22px;pointer-events:none}
.top>*{pointer-events:auto}
.round{height:44px;min-width:44px;padding:0 16px;border:0;border-radius:999px;background:#fff;font-weight:900;font-size:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.16)}
.round:hover{background:#f1f4f8}
.top .sp{flex:1}
.scorePill{background:var(--ink);color:#fff}
.scorePill b{color:var(--yellow);margin-left:6px;font-size:17px}
.wrap{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:auto minmax(300px,440px) minmax(270px,340px);gap:18px;align-items:center;justify-content:center;padding:64px 22px 16px}
.phone{position:relative;height:calc(100vh - 84px);aspect-ratio:9/16;max-width:100%;border-radius:26px;overflow:hidden;background:#0d1117;box-shadow:0 18px 50px rgba(0,0,0,.35)}
.phone video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.again{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);white-space:nowrap}
.startBtn{position:absolute;inset:0;border:0;background:rgba(13,17,23,.38);color:#fff;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;font-weight:900;font-size:22px}
.startBtn i{width:92px;height:92px;border-radius:50%;background:var(--yellow);display:grid;place-items:center}
.startBtn i::after{content:"";border-left:30px solid var(--ink);border-top:19px solid transparent;border-bottom:19px solid transparent;margin-left:8px}
.count{position:absolute;left:14px;top:14px;background:rgba(13,17,23,.7);color:#fff;font-weight:900;font-size:13px;letter-spacing:.06em;padding:6px 11px;border-radius:999px}
.panel{background:var(--card);backdrop-filter:blur(10px);border-radius:26px;padding:clamp(18px,2.6vh,28px) clamp(18px,2vw,28px);box-shadow:0 14px 40px rgba(0,0,0,.18);max-height:calc(100vh - 84px);overflow:auto}
.panel h1{margin:0;font-size:clamp(30px,3.5vw,44px);font-weight:900;line-height:1;letter-spacing:-.02em}
.panel .lead{margin:10px 0 0;font-size:clamp(17px,1.6vw,21px);font-weight:700;color:var(--muted);line-height:1.3}
.lab{margin:12px 0 6px;font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:900;font-size:clamp(15px,1.35vw,18px)}
.chip:hover:not(:disabled){border-color:#9aa6b6}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip small{font-weight:700;opacity:.65;margin-left:6px;font-size:.78em}
.sure .chip:nth-child(1){background:#d6f0de}.sure .chip:nth-child(2){background:#e9f6e2}.sure .chip:nth-child(3){background:#fff3ce}.sure .chip:nth-child(4){background:#ffeede}.sure .chip:nth-child(5){background:#ffe0d9}
.sure .chip.on{background:var(--ink)}
.say{margin-top:14px;border-radius:18px;background:var(--ink);color:#fff;padding:14px 16px}
.say small{display:block;font-size:11.5px;font-weight:900;letter-spacing:.16em;color:#9fb4cc}
.say p{margin:5px 0 0;font-size:clamp(21px,2.3vw,29px);font-weight:900;line-height:1.2}
.say u{text-decoration:none;color:var(--yellow)}
.words{margin-top:9px;font-size:15px;line-height:1.5;color:var(--muted);font-weight:700}
.words b{color:var(--ink)}
.go{margin-top:12px;display:inline-flex;align-items:center;gap:12px;border:0;border-radius:16px;background:var(--yellow);box-shadow:0 5px 0 var(--yellowD);padding:15px 26px;font-weight:900;font-size:clamp(18px,1.7vw,22px)}
.go:hover:not(:disabled){filter:brightness(1.04)}
.go::before{content:"";border-left:15px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent}
.go.plain::before{display:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:14px}
.yn{flex:1;border:2px solid var(--line);border-radius:16px;padding:14px 10px;font-weight:900;font-size:19px;background:#fff}
.yn.y{background:var(--ok);border-color:#8fcfa5}.yn.n{background:var(--bad);border-color:#e9a898}
.yn small{display:block;margin-top:3px;font-size:12.5px;font-weight:700;color:var(--muted)}
.fact{margin-top:12px;border-radius:16px;background:#fff;border:2px solid var(--line);padding:12px 14px;font-size:clamp(18px,1.8vw,23px);font-weight:900;line-height:1.25}
.fact small{display:block;font-size:11.5px;font-weight:900;letter-spacing:.14em;color:var(--muted);margin-bottom:3px}
.more{margin:10px 0 0;padding-left:20px;font-size:clamp(16px,1.5vw,19px);font-weight:700;line-height:1.45}
.dots{display:flex;gap:7px;margin-top:16px;flex-wrap:wrap}
.dots button{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:900}
.dots button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dots button.done{background:var(--ok);border-color:#8fcfa5}
.big{font-size:clamp(46px,6vw,76px);font-weight:900;line-height:1;margin:6px 0 0}
.help{background:var(--card);backdrop-filter:blur(10px);border-radius:26px;padding:16px 16px 14px;box-shadow:0 14px 40px rgba(0,0,0,.18);max-height:calc(100vh - 84px);overflow:auto}
.help h2{margin:0 0 6px;font-size:12px;font-weight:900;letter-spacing:.14em;color:var(--muted)}
.help h2:not(:first-child){margin-top:11px}
.scheme{display:grid;gap:4px}
.scheme div{display:flex;align-items:baseline;gap:8px;border-radius:9px;padding:4px 10px;font-weight:900;font-size:15.5px}
.scheme small{font-size:11px;font-weight:900;letter-spacing:.08em;opacity:.7;min-width:16px}
.scheme em{font-style:normal;font-weight:700;font-size:13px;opacity:.75;margin-left:auto;text-align:right}
.p1{background:#d9ecff}.p2{background:#eceff3}.p3{background:#ffe680}.p4{background:#d6f0de}.p5{background:#ecdcff}
.sample{border-radius:14px;background:#fff;border:2px solid var(--line);padding:7px 10px;font-size:17px;font-weight:900;line-height:1.45}
.sample span{border-radius:6px;padding:1px 5px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.grp{display:grid;grid-template-columns:58px 1fr;gap:5px;align-items:start;margin-bottom:5px}
.grp>b{font-size:11px;font-weight:900;letter-spacing:.06em;color:var(--muted);padding-top:8px;line-height:1.2}
.grp .chips{gap:4px}
.help .chip{padding:5px 8px;font-size:14.5px;border-radius:9px}
.help .note{margin:6px 0 0;font-size:13px;line-height:1.35;font-weight:700;color:var(--muted)}
.help .note b{color:var(--ink)}.help .note s{color:#a4442f}
.say p .o{color:#9fd0ff}.say p .b{color:#d9b8ff}
@media(max-width:1180px){
 body{overflow:auto}
 .wrap{height:auto;min-height:100vh;grid-template-columns:auto minmax(300px,470px);align-items:start}
 .help{grid-column:1/-1;max-height:none}
}
@media(max-width:860px){
 body{overflow:auto}
 .wrap{height:auto;min-height:100vh;grid-template-columns:1fr;justify-items:center;padding-top:70px}
 .phone{height:auto;width:min(100%,360px)}
 .panel{max-height:none;width:100%}
 .help{width:100%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
html.embed .top a.round,html.embed .top #full,html.embed .top button.round{display:none!important}</style>
<script>if(new URLSearchParams(location.search).has('embed')){document.documentElement.classList.add('embed','pg-whn');document.write('<link rel="stylesheet" href="revision-theme.css?v=20261007a">')}</script></head>
<body>
<div id="bg"></div>
<div class="top">
  <a class="round" href="revision-unit1.html" aria-label="Revision">← Revision</a>
  <a class="round" href="what-happens-next-stories.html">Longer stories</a>
  <span class="sp"></span>
  <span class="round scorePill">SCORE <b id="score">0</b></span>
  <button class="round" id="full">Full screen</button>
</div>
<div class="wrap">
  <div class="phone" id="phone">
    <video id="v" playsinline preload="auto"></video>
    <span class="count" id="count"></span>
    <button class="startBtn" id="start"><i></i><span>Watch the clip</span></button>
    <button class="round again" id="again" hidden>↻ Watch again</button>
  </div>
  <section class="panel" id="panel" aria-live="polite"></section>
  <aside class="help" id="help" aria-label="How to answer"></aside>
</div>
<script>
/* To add a clip: put the .mp4 and a .jpg freeze-frame in assets/whn/ and add a line here.
   stop = second where the video freezes. subjects = who/what the prediction is about.
   fact = what happened (Past Simple). after = follow-up questions with will. */
const CLIPS=[
 {file:'lamp',stop:0.77,subjects:['The ball','The man','The lamp'],
  words:['hit','miss','break','smash','bounce off','fall off the wall','score a goal','get into trouble'],
  sample:['I’m pretty sure','the goalkeeper','will definitely','laugh','because it isn’t his house.'],
  fact:'The ball hit the lamp on the wall, and the man covered his face.',
  after:['What will the owner of the house say?','Who will pay for the lamp?','Will they play football there again?']}
];
const SURE=[['will definitely','100%',3,-1],['will probably','quite sure',2,0],['might','maybe',1,0],['probably won’t','quite sure not',2,0],['definitely won’t','100% not',3,-1]];
/* Opening phrases. kind: plain = "I think it will probably…", maybe = "Maybe it will…", neg = "I don't think it will…" */
const OPEN=[
 ['SURE',[['I’m sure','plain'],['I bet','plain'],['There’s no doubt','plain']]],
 ['QUITE<br>SURE',[['I think','plain'],['I guess','plain'],['I reckon','plain'],['I expect','plain'],['In my opinion,','plain']]],
 ['NOT<br>SURE',[['Maybe','maybe'],['Perhaps','maybe'],['I’m not sure, but','plain']]],
 ['NO!',[['I don’t think','neg'],['I doubt','neg'],['There’s no way','neg']]]
];
const OPENERS=OPEN.flatMap(g=>g[1]);
let opener=3;
const $=id=>document.getElementById(id),v=$('v'),P=$('panel');
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let ci=0,score=0,done=[],S={},raf=0;

function load(i){
 ci=i;const c=CLIPS[i];cancelAnimationFrame(raf);
 S={phase:'idle',subj:0,sure:null};
 v.pause();v.src='assets/whn/'+c.file+'.mp4';v.poster='assets/whn/'+c.file+'.jpg';v.load();
 $('bg').style.backgroundImage='url(assets/whn/'+c.file+'.jpg)';
 $('count').textContent='CLIP '+(i+1)+' / '+CLIPS.length;
 $('start').hidden=false;$('again').hidden=true;
 draw();
}
function watchTo(stop,then){
 cancelAnimationFrame(raf);
 const tick=()=>{if(v.currentTime>=stop){v.pause();try{v.currentTime=stop}catch(e){}then();return}
  if(v.ended){then();return}raf=requestAnimationFrame(tick)};
 const p=v.play();if(p&&p.catch)p.catch(()=>{});raf=requestAnimationFrame(tick);
}
function firstPart(){
 const c=CLIPS[ci];$('start').hidden=true;$('again').hidden=true;S.phase='watching';draw();
 try{v.currentTime=0}catch(e){}
 watchTo(c.stop,()=>{S.phase='predict';$('again').hidden=false;draw()});
}
function reveal(){
 cancelAnimationFrame(raf);$('again').hidden=true;S.phase='reveal';draw();
 v.onended=()=>{v.onended=null;S.phase='check';$('again').hidden=false;draw()};
 const p=v.play();if(p&&p.catch)p.catch(()=>{});
}
function replayAll(){
 cancelAnimationFrame(raf);$('again').hidden=true;try{v.currentTime=0}catch(e){}
 v.onended=()=>{v.onended=null;$('again').hidden=false};
 const p=v.play();if(p&&p.catch)p.catch(()=>{});
}
function sentence(){
 const c=CLIPS[ci],subj=c.subjects[S.subj],o=OPENERS[opener],sure=S.sure==null?null:SURE[S.sure][0];
 const who=esc(subj.charAt(0).toLowerCase()+subj.slice(1));
 let mid;
 if(o[1]==='neg')mid='will';
 else if(o[1]==='maybe')mid=sure&&sure.includes('won’t')?'won’t':sure==='might'?'might':'will';
 else mid=sure||'will';
 return `<span class="o">${esc(o[0])}</span> ${who} <u>${esc(mid)}</u> … <span class="b">because …</span>`;
}
function drawHelp(){
 const c=CLIPS[ci],m=c.sample;
 $('help').innerHTML=`<h2>HOW TO ANSWER</h2>
  <div class="scheme">
   <div class="p1"><small>1</small>Opening phrase<em>I think · Maybe</em></div>
   <div class="p2"><small>2</small>Who or what<em>the ball</em></div>
   <div class="p3"><small>3</small>will / won’t + how sure<em>will probably</em></div>
   <div class="p4"><small>4</small>Verb<em>hit · break</em></div>
   <div class="p5"><small>5</small>because + reason<em>because …</em></div>
  </div>
  <h2>MODEL ANSWER</h2>
  <div class="sample"><span class="p1">${esc(m[0])}</span> <span class="p2">${esc(m[1])}</span> <span class="p3">${esc(m[2])}</span> <span class="p4">${esc(m[3])}</span> <span class="p5">${esc(m[4])}</span></div>
  <h2>OPENING PHRASES · TAP ONE</h2>
  ${(()=>{let n=0;return OPEN.map(g=>`<div class="grp"><b>${g[0]}</b><div class="chips">${g[1].map(o=>{const i=n++;return `<button class="chip ${i===opener?'on':''}" data-open="${i}">${esc(o[0])}</button>`}).join('')}</div></div>`).join('')})()}
  <p class="note">After <b>I don’t think / I doubt / There’s no way</b> use <b>will</b>, not won’t: <b>I don’t think it will break</b>, not <s>I think it won’t break</s>.</p>`;
 $('help').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{opener=+b.dataset.open;drawHelp();if(S.phase==='predict'||S.phase==='reveal'||S.phase==='check')draw()});
}
function dots(){
 return CLIPS.length>1?`<div class="dots">${CLIPS.map((c,i)=>`<button data-go="${i}" class="${i===ci?'on':done.includes(i)?'done':''}">${i+1}</button>`).join('')}</div>`:'';
}
function draw(){
 const c=CLIPS[ci];$('score').textContent=score;let h='';drawHelp();
 if(S.phase==='idle'||S.phase==='watching'){
  h=`<h1>Watch carefully.</h1><p class="lead">The clip will stop at the most interesting moment. Get ready to say what <b>will</b> happen.</p>
   <div class="lab">HOW SURE ARE YOU?</div><div class="chips sure">${SURE.map(s=>`<span class="chip">${esc(s[0])}</span>`).join('')}</div>
   <p class="words">Word order: it <b>will probably</b> break · it <b>probably won’t</b> break.</p>`;
 }else if(S.phase==='predict'){
  h=`<h1>What happens next?</h1><p class="lead">Say what you think will happen.</p>
   <div class="lab">1 · WHO OR WHAT?</div><div class="chips">${c.subjects.map((s,i)=>`<button class="chip ${S.subj===i?'on':''}" data-subj="${i}">${esc(s)}</button>`).join('')}</div>
   <div class="lab">2 · HOW SURE ARE YOU?</div><div class="chips sure">${SURE.map((s,i)=>`<button class="chip ${S.sure===i?'on':''}" data-sure="${i}">${esc(s[0])}<small>+${s[2]}</small></button>`).join('')}</div>
   <div class="say"><small>3 · SAY IT ALOUD · FOLLOW THE SCHEME</small><p>${sentence()}</p></div>
   <p class="words">Useful words: ${c.words.map(w=>'<b>'+esc(w)+'</b>').join(' · ')}</p>
   <button class="go" id="see" ${S.sure==null?'disabled':''}>See what happens</button>`;
 }else if(S.phase==='reveal'){
  h=`<h1>Watch…</h1><div class="say"><small>YOUR PREDICTION</small><p>${sentence()}</p></div>`;
 }else if(S.phase==='check'){
  const s=SURE[S.sure];
  h=`<h1>Were you right?</h1><div class="say"><small>YOUR PREDICTION</small><p>${sentence()}</p></div>
   <div class="lab">REACT</div><div class="chips"><span class="chip">I knew it!</span><span class="chip">I was right.</span><span class="chip">I didn’t expect that.</span><span class="chip">What a surprise!</span></div>
   <div class="row"><button class="yn y" data-yn="1">Yes, I was right<small>+${s[2]} points</small></button><button class="yn n" data-yn="0">No, I was wrong<small>${s[3]<0?s[3]+' point':'0 points'}</small></button></div>`;
 }else if(S.phase==='after'){
  const last=ci===CLIPS.length-1;
  h=`<h1>${S.right?'Good prediction.':'Not this time.'}</h1>
   <div class="fact"><small>WHAT HAPPENED · PAST SIMPLE</small>${esc(c.fact)}</div>
   <div class="lab">AND AFTER THE VIDEO? USE WILL</div><ul class="more">${c.after.map(a=>'<li>'+esc(a)+'</li>').join('')}</ul>
   <button class="go ${last?'plain':''}" id="next">${last?(CLIPS.length>1?'See the final score':'Play again'):'Next clip'}</button>`;
 }else if(S.phase==='final'){
  h=`<h1>Finished.</h1><p class="big">${score} <span style="font-size:.38em;color:var(--muted)">points</span></p>
   <p class="lead">${done.length} clips · the best score is ${CLIPS.length*3}.</p><button class="go plain" id="restart">Play again</button>`;
 }
 P.innerHTML=h+(S.phase==='final'?'':dots());
 P.querySelectorAll('[data-subj]').forEach(b=>b.onclick=()=>{S.subj=+b.dataset.subj;draw()});
 P.querySelectorAll('[data-sure]').forEach(b=>b.onclick=()=>{S.sure=+b.dataset.sure;draw()});
 P.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>load(+b.dataset.go));
 P.querySelectorAll('[data-yn]').forEach(b=>b.onclick=()=>{S.right=b.dataset.yn==='1';const s=SURE[S.sure];
  if(!done.includes(ci)){score+=S.right?s[2]:s[3];done.push(ci)}S.phase='after';draw()});
 const see=$('see');if(see)see.onclick=reveal;
 const next=$('next');if(next)next.onclick=()=>{if(ci<CLIPS.length-1)load(ci+1);else if(CLIPS.length>1){S.phase='final';draw()}else{score=0;done=[];load(0)}};
 const rs=$('restart');if(rs)rs.onclick=()=>{score=0;done=[];load(0)};
}
$('start').onclick=firstPart;
$('again').onclick=()=>{if(S.phase==='predict')firstPart();else replayAll()};
$('full').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}};
load(0);
</script>
</body>
</html>
