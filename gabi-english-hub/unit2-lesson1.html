<script>
/* Unit 2 (Law and order), lesson 1. Opens with a check-in built from Gabi's real mistakes:
   step 1 = one bomb game (15 s each) over Homework 5 and 6: family words, nouns, his own mistakes, advice aloud.
   Steps 5-8 open the new unit: crime or accident, crimes, criminals, detective toolkit. Steps 9-11: the case 'The Missing £150' (Tatyana's Law & Order pack, block 1). Step 12 sets Homework 7 (email to Maya). */
const CASE=`<div class="tape"><span>CRIME SCENE · DO NOT CROSS</span></div>
<div class="filehead"><h4>The Missing £150</h4><span class="stamp">CASE OPEN</span></div>
<p class="case">Friday afternoon. Class 7B is collecting money for a school trip. The teacher puts <b>£150 in a blue envelope</b> on her desk. At <b>3:30 p.m.</b> the envelope disappears. Three students were near the classroom.</p>
<div class="sus">
<div><img src="assets/u2/alex.jpg" alt=""><span><b>Alex<i>SUSPECT</i></b><q>I was playing basketball in the gym at 3:30.</q><small>The PE teacher saw him at 3:25, but left before 3:30.</small></span></div>
<div><img src="assets/u2/mia.jpg" alt=""><span><b>Mia<i>SUSPECT</i></b><q>I was doing my homework in the library.</q><small>The librarian remembers her arriving at 3:40.</small></span></div>
<div><img src="assets/u2/ben.jpg" alt=""><span><b>Ben<i>SUSPECT</i></b><q>I was waiting for my mum outside school.</q><small>His mum arrived at 3:45. She can’t say where he was before that.</small></span></div>
</div><p class="words"><b>suspect</b> a person who may have done it · <b>alibi</b> proof that you were somewhere else · <b>clue</b> a small fact that helps · <b>guilty</b> did it</p>`;
const CASE_MINI=CASE.replace(/<p class="case">[\s\S]*?<\/p>/,'').replace(/<p class="words">[\s\S]*?<\/p>/,'').replace('<div class="sus">','<div class="sus mini">');
const TASK=`<h4>Homework 7 · Your email to Maya</h4><p>Write your reply to Maya (90–140 words). Include:</p><ul><li>basic personal information</li><li>your family</li><li>your main hobby</li><li>your favourite subjects at school</li></ul><p>Answer her four questions and ask her two of your own.</p><a class="link" href="../gabriel-homework/lesson-7-homework.html?v=20261011-a" target="_blank" rel="noopener">Open Homework 7</a>`;
Lesson.boot({kicker:'Unit 2 · Lesson 1',steps:[
{stage:'Check-in',title:'Homework bomb',hint:'Homework 5 and 6 in one game. <small>15 seconds for each bomb. Type the answer, choose, or say it aloud.</small>',
 act:{type:'bomb',secs:15,label:'Homework check',title:'Defuse the homework bomb',items:[
  {sec:'Family words',q:'Same dad, different mums: Alex is my ___.',a:['half-brother', 'half brother', 'halfbrother']},
  {sec:'Family words',q:'My brother’s daughter is my ___.',a:['niece'],why:'His son is my nephew.'},
  {sec:'Family words',q:'Someone in my family who lived 300 years ago is my ___.',a:['ancestor'],why:'The opposite is descendant.'},
  {sec:'Family words',q:'I tell my sister everything. I’m very ___ to her.',a:['close'],why:'be close to someone'},
  {sec:'Family words',q:'They plan to marry next year. Last week they got ___.',a:['engaged']},
  {sec:'Family words',q:'Their marriage ended legally. They got ___.',a:['divorced']},
  {sec:'Family words',q:'My cousin and her boyfriend are going to ___ married in June.',a:['get'],why:'get married'},
  {sec:'Family words',q:'I shouted at my sister. Now I ___ it.',a:['regret']},
  {sec:'Make a noun',q:'ARGUE · They had a loud ___ about money.',a:['argument'],why:'argue loses the e: argument'},
  {sec:'Make a noun',q:'ENJOY · Reading gives me real ___.',a:['enjoyment']},
  {sec:'Make a noun',q:'EMBARRASS · His face went red with ___.',a:['embarrassment']},
  {sec:'Make a noun',q:'ACHIEVE · Finishing the marathon was a great ___.',a:['achievement']},
  {sec:'Make a noun',q:'DECIDE · Moving abroad was a hard ___.',a:['decision']},
  {sec:'Make a noun',q:'PERMIT · You need ___ to use this photo.',a:['permission']},
  {sec:'Make a noun',q:'INDEPENDENT · At eighteen, people want ___.',a:['independence']},
  {sec:'Make a noun',q:'PATIENT · Teaching a puppy takes ___.',a:['patience']},
  {sec:'Fix the mistake',q:'Why don’t you ___ your mum about it?',o:['tell', 'report', 'say'],a:'tell',why:'tell someone about something'},
  {sec:'Fix the mistake',q:'You could buy a flat and ___ care about the mess.',o:['not', 'don’t', 'doesn’t'],a:'not',why:'could buy … and not care'},
  {sec:'Fix the mistake',q:'Action video games ___ you to think fast.',o:['teaches', 'teach', 'teaching'],a:'teach',why:'games = they → teach'},
  {sec:'Fix the mistake',q:'Children know ___ better than their parents do.',o:['themself', 'themselves', 'theirself'],a:'themselves',why:'they → themselves'},
  {sec:'Fix the mistake',q:'I’ve already ___ my homework.',o:['finish', 'finished', 'finishing'],a:'finished',why:'have + past participle'},
  {sec:'Fix the mistake',q:'That’s ___ hard question.',o:['a', 'the', '—'],a:'a',why:'a hard question'},
  {sec:'Give advice aloud',q:'My little brother takes my things without asking.',say:1,model:'Why don’t you ask him to say first? You could lock your door.',why:'Why don’t you … ? · You could … · You should …'},
  {sec:'Give advice aloud',q:'I forgot my best friend’s birthday.',say:1,model:'You should say sorry and give her a present tomorrow.',why:'Why don’t you … ? · You could … · You should …'},
  {sec:'Give advice aloud',q:'My parents check my phone every evening.',say:1,model:'Why don’t you talk to them calmly and agree on rules?',why:'Why don’t you … ? · You could … · You should …'},
  {sec:'Give advice aloud',q:'I can’t wake up in time for school.',say:1,model:'You should go to bed earlier. How about putting your alarm far from the bed?',why:'Why don’t you … ? · You could … · You should …'}]}},
{stage:'New words',title:'Crime or accident?',hint:'Warm-up for the new unit. Is it a crime, an accident, or does it depend? <small>20 seconds each. Give a reason.</small>',
 act:{type:'talk',label:'Situation',secs:20,keepChips:true,chipLabel:'Tap each phrase he uses',chips:['It’s a crime because …','It’s an accident because …','It depends on …','I think …','For example, …'],cards:[
  {q:'You find £10 on the classroom floor and put it in your pocket.'},
  {q:'You accidentally break a classroom window while playing football.'},
  {q:'You take your friend’s headphones without asking and refuse to give them back.'},
  {q:'You borrow a book and forget to return it.'}]}},
{stage:'New words',title:'What is the crime?',hint:'New unit: Law and order. Which crime is it? <small>Some are very close. Read every word.</small>',
 act:{type:'quiz',label:'Crime',cols:4,opts:['burglary','robbery','theft','mugging','shoplifting','vandalism','fraud','kidnapping'],items:[
  {q:'Someone breaks into a house at night and takes a laptop.',a:'burglary',why:'Burglary = entering a building to steal.'},
  {q:'Two men in masks take money from a bank.',a:'robbery',why:'Robbery = stealing from a bank, a shop or a person, using force or threats.'},
  {q:'A girl puts a lipstick in her pocket and leaves the shop without paying.',a:'shoplifting',why:'Shoplifting = taking things from a shop without paying.'},
  {q:'A man attacks a tourist in the street and takes his phone.',a:'mugging',why:'Mugging = attacking someone in a public place to steal from them.'},
  {q:'Teenagers break the glass of a bus stop for fun.',a:'vandalism',why:'Vandalism = damaging things on purpose.'},
  {q:'A woman says she is from the bank and gets people’s card details.',a:'fraud',why:'Fraud = tricking people to get their money.'},
  {q:'Someone takes a child and asks the family for money.',a:'kidnapping',why:'Kidnapping = taking a person away by force.'},
  {q:'A bike disappears from outside the school. Nobody saw anything.',a:'theft',why:'Theft is the general word for stealing.'}]}},
{stage:'New words',title:'Crime, criminal, verb',hint:'Now build the words yourself. <small><b>rob</b> a place or a person · <b>steal</b> a thing</small>',
 act:{type:'gaps',cols:2,items:[
  {pre:'Someone who breaks into houses is a',post:'.',ans:['burglar']},
  {pre:'A person who steals things is a',post:'.',ans:['thief']},
  {pre:'One thief, two',post:'.',ans:['thieves']},
  {pre:'A person who mugs people is a',post:'.',ans:['mugger']},
  {pre:'A person who damages bus stops is a',post:'.',ans:['vandal']},
  {pre:'A person who steals from shops is a',post:'.',ans:['shoplifter']},
  {pre:'ROB or STEAL, past: They',post:'the bank and escaped.',ans:['robbed']},
  {pre:'ROB or STEAL, past: They',post:'two million euros.',ans:['stole']}]}},
{stage:'New words',title:'Detective toolkit',hint:'Eight words for the case. Which word matches the meaning?',
 act:{type:'quiz',label:'Word',cols:4,opts:['suspect','clue','witness','steal','investigate','alibi','evidence','guilty'],items:[
  {q:'a person who might have done the crime',a:'suspect',why:'The police question the suspects.'},
  {q:'a small fact or object that helps to solve a crime',a:'clue',why:'A footprint can be a clue.'},
  {q:'a person who saw what happened',a:'witness',why:'The witness saw a man in a red jacket.'},
  {q:'to take something without permission',a:'steal',why:'steal – stole – stolen.'},
  {q:'to try to find out what really happened',a:'investigate',why:'Detectives investigate a case.'},
  {q:'proof that you were in another place at the time of the crime',a:'alibi',why:'“I was at the cinema” is an alibi, if someone can confirm it.'},
  {q:'information or objects that show something is true',a:'evidence',why:'Evidence is uncountable: some evidence, not “evidences”.'},
  {q:'responsible for a crime; you did it',a:'guilty',why:'The opposite is innocent.'}]}},
{stage:'Case',title:'The Missing £150',hint:'Read the case. Every alibi has a hole. <small>What is the problem with each one? Write it in your own words.</small>',wide:true,
 side:{look:'case',card:CASE},
 act:{type:'gaps',open:true,dense:true,items:[
  {pre:'Alex says he was in the gym at 3:30. Why can’t we be sure?',long:1,kw:[['3:25'],['left'],['before'],['nobody'],['no one']],model:'The PE teacher saw him at 3:25, but nobody saw him at 3:30.'},
  {pre:'Mia says she was in the library. What is wrong?',long:1,kw:[['3:40'],['later'],['arrived'],['after']],model:'The librarian saw her arrive at 3:40, ten minutes after the money disappeared.'},
  {pre:'Ben says he was outside school. Who can confirm it?',long:1,kw:[['nobody'],['no one'],['3:45'],['can t'],['cannot'],['alone']],model:'Nobody: his mum arrived at 3:45, so nobody saw him at 3:30.'}]}},
{stage:'Case',title:'Interrogation',hint:'Write the questions for the suspects. <small>Then ask them aloud: your teacher answers as Alex, Mia and Ben. Add two follow-up questions with Why or How.</small>',
 side:{look:'case',card:CASE_MINI},
 act:{type:'gaps',open:true,dense:true,cols:2,items:[
  {pre:'where / you / be / at 3:30?',long:1,kw:[['where were you']],model:'Where were you at 3:30?'},
  {pre:'what / you / do / at 3:30?',long:1,kw:[['what were you doing']],model:'What were you doing at 3:30?'},
  {pre:'who / be / with you?',long:1,kw:[['who was with you']],model:'Who was with you?'},
  {pre:'you / see / the blue envelope?',long:1,kw:[['did you see']],model:'Did you see the blue envelope?'},
  {pre:'why / you / go / there?',long:1,kw:[['why did you go']],model:'Why did you go there?'},
  {pre:'anyone / can / confirm your story?',long:1,kw:[['can anyone confirm'],['can anybody confirm']],model:'Can anyone confirm your story?'}]}},
{stage:'Case',title:'Your verdict',hint:'Speak for 60 seconds. There is no proven culprit yet. <small>Suspicion is not proof: say what the clues suggest and what they don’t prove.</small>',
 side:{look:'case',card:CASE_MINI},
 act:{type:'talk',label:'Verdict',secs:60,chipLabel:'Tap each phrase he uses',chips:['I think … might have taken it because …','However, …','This clue suggests …','It doesn’t prove …','We need more evidence.','suspect · alibi · witness · guilty'],cards:[
  {q:'Who took the money: Alex, Mia, Ben, or do we need more evidence?'},
  {q:'What is the difference between a suspect and a guilty person?'}]}},
{stage:'Homework',title:'Your email to Maya',hint:'Before you write at home: what is the plan of an informal email? Tap the five paragraphs in order.',
 side:{card:TASK},
 act:{type:'order',compact:true,from:'Tap the topics in the order of the paragraphs',items:['basic personal information','family','hobbies','favourite subjects at school','asking for a reply']}}
]});
</script>
</body>
</html>
