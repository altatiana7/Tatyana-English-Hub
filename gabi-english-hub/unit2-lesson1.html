<script>
/* Module 2 (Law and order), lesson 1. Two or three short activities per screen, different mechanics:
   1 homework bomb (15 s) -> 2 crime or not? (teen situations) + what would you do? -> 3 flashcards with translation + memory
   -> 4 typed picture recall (pictures from Nikita's Crime unit) + floor-is-lava situations -> 5 sort crime/criminal/verb + match detective words
   -> 6 the case: alibi holes + questions -> 7 verdict + homework plan. */
const CASE=`<div class="tape"><span>CRIME SCENE · DO NOT CROSS</span></div>
<div class="filehead"><h4>The Missing £150</h4><span class="stamp">CASE OPEN</span></div>
<p class="case">Friday afternoon. Class 7B is collecting money for a school trip. The teacher puts <b>£150 in a blue envelope</b> on her desk. At <b>3:30 p.m.</b> the envelope disappears. Three students were near the classroom.</p>
<div class="sus">
<div><img src="assets/u2/alex.jpg" alt=""><span><b>Alex<i>SUSPECT</i></b><q>I was playing basketball in the gym at 3:30.</q><small>The PE teacher saw him at 3:25, but left before 3:30.</small></span></div>
<div><img src="assets/u2/mia.jpg" alt=""><span><b>Mia<i>SUSPECT</i></b><q>I was doing my homework in the library.</q><small>The librarian remembers her arriving at 3:40.</small></span></div>
<div><img src="assets/u2/ben.jpg" alt=""><span><b>Ben<i>SUSPECT</i></b><q>I was waiting for my mum outside school.</q><small>His mum arrived at 3:45. She can’t say where he was before that.</small></span></div>
</div><p class="words"><b>suspect</b> a person who may have done it · <b>alibi</b> proof that you were somewhere else · <b>clue</b> a small fact that helps · <b>guilty</b> did it</p>`;
const CASE_FILE=CASE.replace(/<p class="words">[\s\S]*?<\/p>/,'');
const CASE_MINI=CASE.replace(/<p class="case">[\s\S]*?<\/p>/,'').replace(/<p class="words">[\s\S]*?<\/p>/,'').replace('<div class="sus">','<div class="sus mini">');
const TASK=`<h4>Homework 7 · Your email to Maya</h4><p>Write your reply to Maya (90–140 words). Include:</p><ul><li>basic personal information</li><li>your family</li><li>your main hobby</li><li>your favourite subjects at school</li></ul><p>Answer her four questions and ask her two of your own.</p><a class="link" href="../gabriel-homework/lesson-7-homework.html?v=20261011-a" target="_blank" rel="noopener">Open Homework 7</a>`;
Lesson.boot({kicker:'Module 2 · Lesson 1',steps:[
{stage:'Check-in',title:'Homework bomb',hint:'Homework 5 and 6 in one game. <small>15 seconds for each bomb. Type the answer, choose, or say it aloud.</small>',
 act:{type:'bomb',secs:15,label:'Homework check',title:'Defuse the homework bomb',items:[
  {sec:'Family words',q:'Same dad, different mums: Alex is my ___.',a:['half-brother', 'half brother', 'halfbrother']},
  {sec:'Family words',q:'My brother’s daughter is my ___.',a:['niece'],why:'His son is my nephew.'},
  {sec:'Family words',q:'Someone in my family who lived 300 years ago is my ___.',a:['ancestor'],why:'The opposite is descendant.'},
  {sec:'Family words',q:'I tell my sister everything. I’m very ___ to her.',a:['close'],why:'be close to someone'},
  {sec:'Family words',q:'They plan to marry next year. Last week they got ___.',a:['engaged']},
  {sec:'Family words',q:'Their marriage ended legally. They got ___.',a:['divorced']},
  {sec:'Family words',q:'My cousin and her boyfriend are going to ___ married in June.',a:['get'],why:'get married'},
  {sec:'Family words',q:'I shouted at my sister. Now I ___ it.',a:['regret']},
  {sec:'Make a noun',q:'ARGUE · They had a loud ___ about money.',a:['argument'],why:'argue loses the e: argument'},
  {sec:'Make a noun',q:'ENJOY · Reading gives me real ___.',a:['enjoyment']},
  {sec:'Make a noun',q:'EMBARRASS · His face went red with ___.',a:['embarrassment']},
  {sec:'Make a noun',q:'ACHIEVE · Finishing the marathon was a great ___.',a:['achievement']},
  {sec:'Make a noun',q:'DECIDE · Moving abroad was a hard ___.',a:['decision']},
  {sec:'Make a noun',q:'PERMIT · You need ___ to use this photo.',a:['permission']},
  {sec:'Make a noun',q:'INDEPENDENT · At eighteen, people want ___.',a:['independence']},
  {sec:'Make a noun',q:'PATIENT · Teaching a puppy takes ___.',a:['patience']},
  {sec:'Fix the mistake',q:'Why don’t you ___ your mum about it?',o:['tell', 'report', 'say'],a:'tell',why:'tell someone about something'},
  {sec:'Fix the mistake',q:'You could buy a flat and ___ care about the mess.',o:['not', 'don’t', 'doesn’t'],a:'not',why:'could buy … and not care'},
  {sec:'Fix the mistake',q:'Action video games ___ you to think fast.',o:['teaches', 'teach', 'teaching'],a:'teach',why:'games = they → teach'},
  {sec:'Fix the mistake',q:'Children know ___ better than their parents do.',o:['themself', 'themselves', 'theirself'],a:'themselves',why:'they → themselves'},
  {sec:'Fix the mistake',q:'I’ve already ___ my homework.',o:['finish', 'finished', 'finishing'],a:'finished',why:'have + past participle'},
  {sec:'Fix the mistake',q:'That’s ___ hard question.',o:['a', 'the', '—'],a:'a',why:'a hard question'},
  {sec:'Give advice aloud',q:'My little brother takes my things without asking.',say:1,model:'Why don’t you ask him to say first? You could lock your door.',why:'Why don’t you … ? · You could … · You should …'},
  {sec:'Give advice aloud',q:'I forgot my best friend’s birthday.',say:1,model:'You should say sorry and give her a present tomorrow.',why:'Why don’t you … ? · You could … · You should …'},
  {sec:'Give advice aloud',q:'My parents check my phone every evening.',say:1,model:'Why don’t you talk to them calmly and agree on rules?',why:'Why don’t you … ? · You could … · You should …'},
  {sec:'Give advice aloud',q:'I can’t wake up in time for school.',say:1,model:'You should go to bed earlier. How about putting your alarm far from the bed?',why:'Why don’t you … ? · You could … · You should …'}]}},
{stage:'Warm-up',title:'Crime or not?',hint:'Is it a crime? Choose, then say why. <small>Then real situations: what would you do?</small>',cols:'1.1fr 1fr',
 acts:[
 {type:'quiz',title:'Crime or not?',label:'Situation',cols:3,opts:['A crime','Not a crime','It depends'],items:[
  {q:'You download a new film from a pirate website for free.',a:'A crime',why:'Pirate copies break copyright law. Most people never get caught, but it is still illegal.'},
  {q:'You find a phone on the bus and keep it.',a:'A crime',why:'If you don’t try to give it back, it is theft.'},
  {q:'You accidentally kick a ball through a neighbour’s window.',a:'Not a crime',why:'It is an accident. But you should say sorry and help to pay for it.'},
  {q:'You write your name on the wall of the school toilets.',a:'A crime',why:'Damaging property on purpose is vandalism.'},
  {q:'You log in to your friend’s Instagram and read his messages.',a:'A crime',why:'Using someone’s account without permission is a cybercrime.'},
  {q:'You copy your friend’s homework.',a:'Not a crime',why:'It breaks school rules, not the law. But it is still cheating.'},
  {q:'You post an embarrassing photo of a classmate without asking.',a:'It depends',why:'Once can be unkind. Again and again, or to hurt someone, it becomes harassment.'},
  {q:'You keep sending angry messages to someone who asked you to stop.',a:'A crime',why:'Bothering someone again and again is harassment.'},
  {q:'You use your older brother’s ID to see a 16+ film.',a:'A crime',why:'Using another person’s ID to trick someone is a kind of fraud.'},
  {q:'You buy a cheap “designer” bag that you know is fake.',a:'It depends',why:'In many countries buying it for yourself is legal, but selling fakes is a crime.'}]},
 {type:'talk',title:'What would you do?',label:'Situation',secs:30,keepChips:true,chipLabel:'Tap each phrase he uses',chips:['I would … because …','I wouldn’t …','First, I’d …','I’d tell …'],cards:[
  {q:'Your friend wants you to watch the door while he takes sweets from a shop.'},
  {q:'You find a wallet in the park with €100 and an ID card in it.'},
  {q:'Someone in your class shares a fake photo of your friend online.'},
  {q:'Your friend asks for your password “just for five minutes”.'},
  {q:'An older boy offers you a new iPhone for only €20.'},
  {q:'You see two classmates writing graffiti on the school wall.'}]}]},
{stage:'Words',title:'Crime words: learn',hint:'New words with pictures. Turn each card over to check the meaning. <small>Then play Memory with the same pictures.</small>',cols:'1fr 1.15fr',
 acts:[
 {type:'cards',title:'Flashcards · 13 crimes',items:[
  {w:'theft',ru:'кража',d:'taking something that belongs to another person',ex:'Car theft is a big problem in this city.',img:'assets/u2/crimes/p-theft.jpg'},
  {w:'pickpocketing',ru:'карманная кража',d:'stealing from someone’s pocket or bag without them noticing',ex:'Watch your bag: there is a lot of pickpocketing on the metro.',img:'assets/u2/crimes/p-pickpocketing.jpg'},
  {w:'burglary',ru:'кража со взломом',d:'breaking into a building, usually a house, to steal something',ex:'There was a burglary next door while they were on holiday.',img:'assets/u2/crimes/p-burglary.jpg'},
  {w:'robbery',ru:'ограбление',d:'stealing something using force or threats',ex:'Two men were arrested for the bank robbery.',img:'assets/u2/crimes/p-robbery.jpg'},
  {w:'vandalism',ru:'вандализм',d:'damaging someone else’s property on purpose',ex:'Breaking the bus stop window was an act of vandalism.',img:'assets/u2/crimes/p-vandalism.jpg'},
  {w:'fraud',ru:'мошенничество',d:'tricking someone to get their money or personal information',ex:'He lost €500 in an online fraud.',img:'assets/u2/crimes/p-fraud.jpg'},
  {w:'cybercrime',ru:'киберпреступление',d:'a crime that uses computers or the internet',ex:'Stealing passwords is a common cybercrime.',img:'assets/u2/crimes/p-cybercrime.jpg'},
  {w:'assault',ru:'нападение',d:'attacking someone and hurting them',ex:'He was arrested for assault after the fight.',img:'assets/u2/crimes/p-assault.jpg'},
  {w:'harassment',ru:'травля, преследование',d:'bothering or upsetting someone again and again',ex:'Sending nasty messages every day is harassment.',img:'assets/u2/crimes/p-harassment.jpg'},
  {w:'shoplifting',ru:'кража в магазине',d:'stealing something from a shop',ex:'She was caught shoplifting a lipstick.',img:'assets/u2/crimes/p-shoplifting.jpg'},
  {w:'arson',ru:'поджог',d:'starting a fire on purpose',ex:'The police think the fire was arson.',img:'assets/u2/crimes/p-arson.jpg'},
  {w:'kidnapping',ru:'похищение человека',d:'taking someone away by force and keeping them',ex:'The kidnapping of the businessman was in all the news.',img:'assets/u2/crimes/p-kidnapping.jpg'},
  {w:'mugging',ru:'уличное ограбление',d:'attacking someone in the street and taking their things',ex:'He was the victim of a mugging on his way home.',img:'assets/u2/crimes/p-mugging.jpg'}]},
 {type:'memory',title:'Memory · picture and word',cols:4,pairs:[{t:'theft',img:'assets/u2/crimes/p-theft.jpg'},{t:'pickpocketing',img:'assets/u2/crimes/p-pickpocketing.jpg'},{t:'assault',img:'assets/u2/crimes/p-assault.jpg'},{t:'harassment',img:'assets/u2/crimes/p-harassment.jpg'},{t:'cybercrime',img:'assets/u2/crimes/p-cybercrime.jpg'},{t:'arson',img:'assets/u2/crimes/p-arson.jpg'}]}]},
{stage:'Words',title:'Crime words: use',hint:'Now without help. Write the crime under each picture, then name the crime in real situations. <small>Three wrong answers and the floor is lava.</small>',cols:'1.1fr 1fr',
 acts:[
 {type:'gaps',title:'Name the crime',pics:true,cols:4,items:[
  {img:'assets/u2/crimes/burglary.jpg',ph:'b…',ans:['burglary']},
  {img:'assets/u2/crimes/robbery.jpg',ph:'r…',ans:['robbery']},
  {img:'assets/u2/crimes/shoplifting.jpg',ph:'s…',ans:['shoplifting']},
  {img:'assets/u2/crimes/fraud.jpg',ph:'f…',ans:['fraud']},
  {img:'assets/u2/crimes/vandalism.jpg',ph:'v…',ans:['vandalism']},
  {img:'assets/u2/crimes/p-kidnapping.jpg',ph:'k…',ans:['kidnapping']},
  {img:'assets/u2/crimes/p-mugging.jpg',ph:'m…',ans:['mugging']},
  {img:'assets/u2/crimes/p-arson.jpg',ph:'a…',ans:['arson']}]},
 {type:'quiz',title:'Floor is lava · which crime?',label:'Crime',lives:3,cols:2,opts:['burglary','robbery','theft','mugging','shoplifting','vandalism','fraud','kidnapping'],items:[
  {q:'Someone breaks into a house at night and takes a laptop.',a:'burglary',why:'Burglary = entering a building to steal.'},
  {q:'Two men in masks take money from a bank.',a:'robbery',why:'Robbery = stealing from a bank, a shop or a person, using force or threats.'},
  {q:'A girl puts a lipstick in her pocket and leaves the shop without paying.',a:'shoplifting',why:'Shoplifting = taking things from a shop without paying.'},
  {q:'A man attacks a tourist in the street and takes his phone.',a:'mugging',why:'Mugging = attacking someone in a public place to steal from them.'},
  {q:'Teenagers break the glass of a bus stop for fun.',a:'vandalism',why:'Vandalism = damaging things on purpose.'},
  {q:'A woman says she is from the bank and gets people’s card details.',a:'fraud',why:'Fraud = tricking people to get their money.'},
  {q:'Someone takes a child and asks the family for money.',a:'kidnapping',why:'Kidnapping = taking a person away by force.'},
  {q:'A bike disappears from outside the school. Nobody saw anything.',a:'theft',why:'Theft is the general word for stealing.'}]}]},
{stage:'Words',title:'Criminals and detectives',hint:'Crime, criminal, verb: sort the words. Then match the detective words to their meanings. <small>rob a place or a person · steal a thing</small>',cols:'1.15fr 1fr',
 acts:[
 {type:'sort',title:'Crime · criminal · verb',cols:['crime','criminal','verb'],items:[{t:'burglary',c:0},{t:'burglar',c:1},{t:'break in',c:2},{t:'theft',c:0},{t:'thief',c:1},{t:'steal',c:2},{t:'robbery',c:0},{t:'robber',c:1},{t:'rob',c:2},{t:'vandalism',c:0},{t:'vandal',c:1},{t:'damage',c:2}]},
 {type:'match',title:'Detective toolkit',tip:'Tap a word, then its meaning.',items:[
  {l:'suspect',r:'a person who might have done the crime'},
  {l:'clue',r:'a small fact or object that helps to solve a crime'},
  {l:'witness',r:'a person who saw what happened'},
  {l:'alibi',r:'proof that you were in another place at the time of the crime'},
  {l:'evidence',r:'information or objects that show something is true'},
  {l:'guilty',r:'responsible for a crime; you did it'}]}]},
{stage:'Case',title:'The Missing £150',hint:'Read the case file. Find the hole in each alibi, then write your questions. <small>Ask them aloud: your teacher answers as Alex, Mia and Ben.</small>',split:'minmax(0,.8fr) minmax(0,1.2fr)',
 side:{look:'case',card:CASE_FILE},
 acts:[
 {type:'gaps',title:'Every alibi has a hole',open:true,dense:true,items:[
  {pre:'Alex says he was in the gym at 3:30. Why can’t we be sure?',long:1,kw:[['3:25'],['left'],['before'],['nobody'],['no one']],model:'The PE teacher saw him at 3:25, but nobody saw him at 3:30.'},
  {pre:'Mia says she was in the library. What is wrong?',long:1,kw:[['3:40'],['later'],['arrived'],['after']],model:'The librarian saw her arrive at 3:40, ten minutes after the money disappeared.'},
  {pre:'Ben says he was outside school. Who can confirm it?',long:1,kw:[['nobody'],['no one'],['3:45'],['can t'],['cannot'],['alone']],model:'Nobody: his mum arrived at 3:45, so nobody saw him at 3:30.'}]},
 {type:'gaps',title:'Detective questions',open:true,dense:true,items:[
  {pre:'where / you / be / at 3:30?',long:1,kw:[['where were you']],model:'Where were you at 3:30?'},
  {pre:'what / you / do / at 3:30?',long:1,kw:[['what were you doing']],model:'What were you doing at 3:30?'},
  {pre:'who / be / with you?',long:1,kw:[['who was with you']],model:'Who was with you?'},
  {pre:'you / see / the blue envelope?',long:1,kw:[['did you see']],model:'Did you see the blue envelope?'},
  {pre:'anyone / can / confirm your story?',long:1,kw:[['can anyone confirm'],['can anybody confirm']],model:'Can anyone confirm your story?'}]}]},
{stage:'Case',title:'Verdict and homework',split:'minmax(0,.62fr) minmax(0,1.38fr)',hint:'Your verdict, then plan your email. <small>Homework 7: <a href="../gabriel-homework/lesson-7-homework.html?v=20261011-a" target="_blank" rel="noopener">your email to Maya</a>.</small>',
 side:{look:'case',card:CASE_MINI},
 acts:[
 {type:'talk',title:'Your verdict',label:'Verdict',secs:60,chipLabel:'Tap each phrase he uses',chips:['… might have taken it because …','However, …','It doesn’t prove …','We need more evidence.'],cards:[
  {q:'Who took the money: Alex, Mia, Ben, or do we need more evidence?'},
  {q:'What is the difference between a suspect and a guilty person?'}]},
 {type:'order',title:'Homework: plan your email',compact:true,from:'Tap the five paragraphs in order',items:['basic personal information','family','hobbies','favourite subjects at school','asking for a reply']}]}
]});
</script>
