<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<title>Gabi · Revision · Unit 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Figtree:wght@500;600;700;800&display=swap">
<style>
:root{--ink:#0f2438;--ink2:#1b3a57;--yellow:#ffd43b;--mute:#9fb6c9}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Figtree","Segoe UI",Arial,sans-serif;background:var(--ink);color:#fff;display:flex;flex-direction:column;height:100vh;overflow:hidden}
@supports(height:100svh){body{height:100svh}}
button,a{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.bar{flex:none;display:flex;align-items:center;gap:12px;height:52px;padding:0 12px;background:var(--ink)}
.home{flex:none;height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--ink2);font-weight:700;font-size:15px;text-decoration:none;display:inline-flex;align-items:center}
.home:hover,.arrow:hover,.chip:hover{background:#264d72}
.now{flex:1 1 220px;min-width:0;line-height:1.15}
.now small{display:block;font-size:12px;font-weight:700;letter-spacing:.09em;color:var(--yellow);text-transform:uppercase}
.now b{display:block;font-family:"Montserrat","Figtree",Arial,sans-serif;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.steps{flex:none;display:flex;align-items:center;gap:5px}
.steps i{width:10px;height:2px;background:#33536f;border-radius:2px}
.chip{width:34px;height:34px;border-radius:50%;border:0;background:var(--ink2);font-weight:700;font-size:15px;color:#dbe7f1;padding:0}
.chip.seen{background:#2c6a59;color:#fff}
.chip.on{background:var(--yellow);color:var(--ink)}
.arrow{flex:none;height:36px;border:0;border-radius:999px;background:var(--ink2);font-weight:700;font-size:15px;padding:0 14px}
.arrow.next{background:var(--yellow);color:var(--ink)}
.arrow.next:hover{background:#ffe066}
iframe{flex:1;min-height:0;width:100%;border:0;background:var(--ink);display:block}
@media(max-width:1000px){.now small{display:none}.now b{font-size:16px}.chip{width:28px;height:28px;font-size:13px}.steps{gap:3px}.steps i{width:5px}}
@media(max-width:760px){.steps i{display:none}.home span{display:none}.bar{gap:6px;padding:0 6px}.chip{width:24px;height:24px;font-size:12px}}
</style>
</head>
<body>
<div class="bar">
  <a class="home" href="index.html" aria-label="Back to Gabi Hub">←<span>&nbsp;Hub</span></a>
  <div class="now"><small id="stage"></small><b id="title"></b></div>
  <div class="steps" id="steps" role="tablist" aria-label="Lesson steps"></div>
  <button class="arrow" id="prev" aria-label="Previous step">‹</button>
  <button class="arrow next" id="next"></button>
</div>
<iframe id="frame" title="Lesson activity" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
const V='20261007d';
const STEPS=[
 ['Warm-up','What Happens Next?','what-happens-next.html?embed=1'],
 ['Words','Word Wall','word-walls-age.html?embed=1'],
 ['Words','Scenes','word-walls-age.html?scenes=1&embed=1'],
 ['Words','Word Factory','lesson3.html?step=3&embed=1'],
 ['Accuracy','Error Hunter','lesson3.html?step=6&embed=1'],
 ['Accuracy','Speed Zone','lesson3.html?step=7&embed=1'],
 ['Listen and speak','Ten Faces: Words','ten-faces.html?lv=0&embed=1'],
 ['Listen and speak','Ten Faces: Grammar','ten-faces.html?lv=1&embed=1'],
 ['Listen and speak','Ten Faces: Articles','ten-faces.html?lv=2&embed=1'],
 ['Listen and speak','Ten Faces: Speaking','ten-faces.html?lv=3&embed=1'],
 ['Final check','Reach Higher','lesson3.html?step=9&embed=1'],
 ['Final check','Test yourself','unit1-test.html?embed=1']
];
let cur=0;const seen=new Set();
const $=id=>document.getElementById(id);
function draw(){
  $('steps').innerHTML=STEPS.map((s,i)=>(i&&s[0]!==STEPS[i-1][0]?'<i></i>':'')+`<button class="chip${i===cur?' on':seen.has(i)?' seen':''}" data-i="${i}" role="tab" aria-selected="${i===cur}" title="${s[1]}">${i+1}</button>`).join('');
  $('stage').textContent='Revision · Unit 1 · '+STEPS[cur][0];
  $('title').textContent=(cur+1)+' / '+STEPS.length+' · '+STEPS[cur][1];
  $('prev').style.visibility=cur?'visible':'hidden';
  $('next').textContent=cur===STEPS.length-1?'Start again':'Next ›';
}
function go(i){seen.add(cur);cur=i;if(i===0&&seen.size>=STEPS.length)seen.clear();$('frame').src=STEPS[i][2]+'&v='+V;draw()}
$('steps').onclick=e=>{const b=e.target.closest('[data-i]');if(b)go(+b.dataset.i)};
$('prev').onclick=()=>{if(cur)go(cur-1)};
$('next').onclick=()=>{if(cur===STEPS.length-1){seen.clear();cur=0;go(0)}else go(cur+1)};
try{localStorage.removeItem('gabi-unit1-revision-v1')}catch(e){}
go(0);
</script>
</body>
</html>
