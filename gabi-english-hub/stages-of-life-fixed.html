<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gabi — Ages and Stages of Life</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="core" src="stages-of-life.html?v=20260909-0918" title="Ages and Stages of Life"></iframe>
<script>
const LIFE_STAGE_IMAGES=[
'https://images.unsplash.com/photo-1773243086679-20c427d28092?auto=format&fit=crop&w=700&q=82',
'https://images.unsplash.com/flagged/photo-1557749846-14320a49d3ed?auto=format&fit=crop&w=700&q=82',
'https://images.unsplash.com/photo-1706307121034-81829ec35a0d?auto=format&fit=crop&w=700&q=82',
'https://images.unsplash.com/photo-1773243906497-4ae3be34ab7d?auto=format&fit=crop&w=700&q=82',
'https://images.unsplash.com/photo-1749222192847-de0f25674a4a?auto=format&fit=crop&w=700&q=82',
'https://images.unsplash.com/photo-1779497056366-49a5bc7aaf00?auto=format&fit=crop&w=700&q=82',
'https://images.unsplash.com/photo-1774437790863-88a80bca5b29?auto=format&fit=crop&w=700&q=82',
'https://images.unsplash.com/photo-1759765468070-120cdc180be8?auto=format&fit=crop&w=700&q=82'
];
const f=document.getElementById('core');
f.addEventListener('load',()=>{
  const d=f.contentDocument;
  let scheduled=false;
  function patch(){
    scheduled=false;
    const imgs=[...d.querySelectorAll('.person img')];
    imgs.forEach((img,i)=>{
      const src=LIFE_STAGE_IMAGES[i%LIFE_STAGE_IMAGES.length];
      if(img.dataset.reliableSrc!==src){
        img.dataset.reliableSrc=src;
        img.referrerPolicy='no-referrer';
        img.loading='eager';
        img.decoding='async';
        img.src=src;
        img.onerror=()=>{img.style.background='linear-gradient(135deg,#dff5fb,#fff1d8)';img.alt='Life stage photo';};
      }
    });
  }
  function queue(){if(scheduled)return;scheduled=true;requestAnimationFrame(patch)}
  new MutationObserver(queue).observe(d.documentElement,{childList:true,subtree:true});
  patch();
  setTimeout(patch,250);
  setTimeout(patch,1000);
});
</script>
</body>
</html>
