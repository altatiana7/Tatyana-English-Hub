<script>
/* Module 3 (Plurilingual), lesson 1 · Gateway B1, SB p.32 Vocabulary in context. Same engine and look as Module 2. Two activities per screen:
   1 homework: error hunter (his Workbook p.16 sentences) + Speed Game (15 s) -> 2 spoken warm-up questions (ex 4) + prediction
   -> 3 hello in 12 languages (match) + country flashcards -> 4 sort the endings + quiz with traps (rule under a button)
   -> 5 learning-languages flashcards + Advice for learning English (ex 5a) -> 6 floor is lava: do or make + ex 7 (rule under a button)
   -> 7 interview (ex 7-8) + Module 3 Jeopardy.
   Audio: natural recordings in ../card-audio (AUDIO_TEXTS is collected by tools/card-audio-collect.mjs). */
const IV1=['Which of these countries do you already know?','Which of these countries would you like to visit? Why?','Which of these languages can you speak? How well?','Which of these languages would you like to learn? Why?','Can you speak any other languages? Which?'];
const IV2=['How do you study English after school?','How do you revise before an exam?','How do you feel when you make a mistake in English?','What are different ways to study English outside the classroom?'];
const HELLO=[['hola','Spanish'],['bonjour','French'],['marhabaan','Arabic'],['privet','Russian'],['hallo','German'],['cześć','Polish'],['merhaba','Turkish'],['olá','Portuguese'],['zdraveĭte','Bulgarian'],['śwaṣdī','Thai'],['kon’nichiwa','Japanese'],['ciao','Italian']];
const COUNTRY=[['Argentina','Argentinian','Spanish'],['Austria','Austrian','German'],['Brazil','Brazilian','Portuguese'],['Bulgaria','Bulgarian','Bulgarian'],['Egypt','Egyptian','Arabic'],['Japan','Japanese','Japanese'],['Mexico','Mexican','Spanish'],['Poland','Polish','Polish'],['Russia','Russian','Russian'],['Switzerland','Swiss','French, German, Italian'],['Thailand','Thai','Thai'],['Turkey','Turkish','Turkish']];
const LEARN=[['accuracy','noun','точность','accuracy (n.) · accurate (adj.)'],['accurate','adjective','точный, правильный','accurate (adj.) · accuracy (n.)'],['essay','noun','сочинение, эссе','do an essay · write an essay · read an essay'],['exam','noun','экзамен','do an exam · take an exam · pass an exam · fail an exam'],['exercise','noun','упражнение','do an exercise · check an exercise · correct an exercise'],['fluency','noun','беглость речи','fluency (n.) · fluent (adj.)'],['fluent','adjective','бегло говорящий','fluent (adj.) · fluency (n.)'],['homework','noun','домашняя работа','do homework · check homework'],['memorisation','noun','запоминание','memorisation (n.) · memorise (v.)'],['memorise','verb','запоминать, учить наизусть','memorise (v.) · memorisation (n.)'],['mistake','noun','ошибка','make a mistake · correct a mistake'],['practice','noun','практика','practice (n.) · practise (v.)'],['practise','verb','практиковаться','practise (v.) · practice (n.)'],['revise','verb','повторять','revise (v.) · revision (n.)'],['revision','noun','повторение','revision (n.) · revise (v.)'],['study','verb','учить, изучать','do English · study English · learn English'],['translate','verb','переводить','translate (v.) · translation (n.)'],['translation','noun','перевод','translation (n.) · translate (v.)']];
const AUDIO_TEXTS=IV1.concat(IV2,COUNTRY.flatMap(c=>[c[0],c[1]]),LEARN.map(c=>c[0]));
const clip=t=>CardAudio.base+CardAudio.key(t)+'.mp3?v=20261115';
const COURT=(t,s)=>`<div class="court"><h4>${t}</h4><span class="stamp">${s||'RULE'}</span></div>`;
const RULE1=COURT('Nationalities and languages')+`<ul class="say">
<li>Languages, countries and nationalities <b>always begin with a capital letter</b>.</li>
<li><b>-(i)an</b> stress before the ending: Argen<b>ti</b>nian, Bra<b>zi</b>lian, Bul<b>ga</b>rian, E<b>gyp</b>tian, <b>Ger</b>man, I<b>ta</b>lian, <b>Ru</b>ssian</li>
<li><b>-ish</b> stress on the first syllable: <b>Po</b>lish, <b>Spa</b>nish, <b>Tur</b>kish</li>
<li><b>-ese</b> stress on -ese: Japa<b>nese</b>, Portu<b>guese</b></li></ul>
<p class="words"><b>Watch out:</b> <b>Aus</b>trian and <b>Me</b>xican have the stress on the first syllable. Irregular: <b>Arabic</b>, <b>French</b>, <b>Swiss</b>, <b>Thai</b>. Switzerland: French, German, Italian.</p>`;
const RULE2=COURT('Do or make')+`<ul class="say">
<li><b>do</b> an action, an activity or some kind of work: do an exam, do an exercise, do English, do homework, do an essay</li>
<li><b>make</b> constructing, building or creating something: make a mistake</li>
<li><b>other verbs</b> take / pass / fail an exam · check / correct an exercise · correct a mistake · study / learn English · check homework · write / read an essay</li></ul>
<p class="words"><b>Watch out:</b> <b>practice</b> (noun) and <b>practise</b> (verb) sound the same. <b>memorise</b> – <b>memorisation</b>: the stress moves. <b>revise</b> /rɪˈvaɪz/ – <b>revision</b> /rɪˈvɪʒən/. <b>accuracy</b> (noun) – <b>accurate</b> (adjective), <b>fluency</b> – <b>fluent</b>.</p>`;
/* flashcards: a Listen button with the recorded British voice */
(function(){const C=Lesson.ACT.cards,v=C.view;C.view=(a,s)=>v(a,s).replace('<div class="row nav3">',`<div class="row nav3"><button class="ghost" data-listen="${Lesson.esc(a.items[s.i].w)}">Listen</button>`);
 document.addEventListener('click',e=>{const b=e.target.closest('[data-listen]');if(b){e.stopPropagation();CardAudio.say(b.dataset.listen)}},true)})();
/* prediction: the greetings appear one by one, then the title of the module */
Lesson.ACT.tags={
 init(a,s){s.n=1},
 view(a,s){const all=s.n>a.items.length;
  return `<div class="tagsbox"><p class="q">${all?Lesson.esc(a.answer):Lesson.esc(a.q)}</p><div class="tagsrow">${a.items.slice(0,s.n).map(t=>`<span>${Lesson.esc(t)}</span>`).join('')}</div></div>
   <div class="row nav3"><button class="ghost" data-tall>Show all</button><span class="muted">${Math.min(s.n,a.items.length)} / ${a.items.length}</span><button class="main" data-tmore ${all?'disabled':''}>${s.n>=a.items.length?'Show the title':'One more word'}</button></div>`},
 click(a,s,d){if(d.tmore!==undefined){s.n++;return Lesson.redraw()}if(d.tall!==undefined){s.n=a.items.length+1;return Lesson.redraw()}}};
const SAY=['We say it','We don’t say it'];
Lesson.boot({kicker:'Module 3 · Lesson 1',steps:[
{stage:'Check-in',title:'Your homework: Workbook page 16',hint:'These sentences are from your homework. Find the mistake in each one. <small>Then the Speed Game: 15 seconds for each question.</small>',cols:'1.1fr 1fr',
 acts:[
 {type:'hunt',title:'Error hunter · your homework',tip:'Click the word with the mistake.',items:[
  {s:'Really? What did happen?',bad:2,fix:'What happened?',why:'What is the subject: no did'},
  {s:'However, their happiness not last long.',bad:3,fix:'didn’t last',why:'negative past simple: didn’t + base verb'},
  {s:'First, they climb down the vertical tunnel.',bad:2,fix:'climbed',why:'past simple'},
  {s:'CCTV cameras record the whole robbery!',bad:2,fix:'recorded',why:'past simple'},
  {s:'What was hard part of the job?',bad:2,fix:'the hard part',why:'there is only one: the'},
  {s:'We found out that a younger boy took it by mistake.',bad:7,fix:'had taken',why:'he took it before you found out: past perfect'},
  {s:'Ronnie Biggs has become famous in 1963.',bad:2,fix:'became',why:'in 1963: past simple'},
  {s:'A gang of criminals steal 2.6 million pounds from a train.',bad:4,fix:'stole',why:'past simple'},
  {s:'The police catches him.',bad:2,fix:'caught',why:'past simple'},
  {s:'In 1970 he is leaving France.',bad:3,fix:'left',why:'in 1970: past simple'}]},
 {type:'bomb',speed:true,secs:15,label:'Homework check',title:'Speed Game · the robbery and your story',items:[
  {sec:'The £200 million robbery',q:'It took them two days because their equipment ___ the first time.',o:['didn’t last','broke','breaked'],a:'broke'},
  {sec:'The £200 million robbery',q:'However, their happiness ___ long.',o:['didn’t last','not last','broke'],a:'didn’t last'},
  {sec:'The £200 million robbery',q:'They ___ to penetrate a wall 50 cm thick!',o:['need','climbed','needed'],a:'needed'},
  {sec:'The £200 million robbery',q:'The police ___ them very quickly.',o:['catched','caught','catch'],a:'caught'},
  {sec:'The £200 million robbery',q:'CCTV cameras ___ the whole robbery!',o:['recorded','record','were record'],a:'recorded'},
  {sec:'Questions',q:'The men met in a pub. → Where ___?',o:['the men met','did the men met','did the men meet'],a:'did the men meet',why:'did + base verb'},
  {sec:'Questions',q:'Someone broke into our house. → Who ___ into your house?',o:['broke','did break','did broke'],a:'broke',why:'Who is the subject: no did'},
  {sec:'Your story',q:'Our teacher decided to LOOK INTO the mystery.',o:['look inside','investigate','forget'],a:'investigate'},
  {sec:'Your story',q:'Suddenly, I CAME ACROSS a blue backpack.',o:['found by chance','lost','crossed'],a:'found by chance'},
  {sec:'Your story',q:'First, we CAME UP WITH a plan.',o:['followed','changed','thought of'],a:'thought of'},
  {sec:'Your story',q:'In the end, we FOUND OUT the truth.',o:['hid','discovered','looked for'],a:'discovered'},
  {sec:'Your story',q:'My friends and I started to LOOK FOR clues.',o:['try to find','look after','look at'],a:'try to find'},
  {sec:'Your story',q:'We found out that a younger boy ___ it by mistake.',o:['has taken','was taking','had taken'],a:'had taken',why:'earlier than “found out”: past perfect'}]}]},
{stage:'Warm-up',title:'Countries and languages',hint:'Listen to the question and answer. <small>Then predict: what is Module 3 about?</small>',cols:'1fr 1fr',
 acts:[
 {type:'talk',title:'Ask and answer',label:'Question',secs:40,cards:IV1.map(q=>({q,say:q,audio:clip(q)}))},
 {type:'tags',title:'Predict · what is Module 3 about?',q:'What is Module 3 about?',answer:'Module 3 · Plurilingual',items:['hallo','ciao','privet','bonjour','merhaba','hola','olá','cześć','kon’nichiwa','marhabaan','zdraveĭte','śwaṣdī']}]},
{stage:'Words',title:'Hello in twelve languages',hint:'Which language is each “hello”? <small>Then the countries: say the nationality and the language before you turn the card over.</small>',cols:'1.25fr 1fr',
 acts:[
 {type:'match',title:'Hello · match the language',tip:'Tap a word, then its language.',items:HELLO.map(h=>({l:h[0],r:h[1]}))},
 {type:'cards',title:'Flashcards · 12 countries',items:COUNTRY.map(c=>({w:c[0],ru:c[1],d:'Language: '+c[2]}))}]},
{stage:'Words',title:'Nationalities',hint:'Sort the nationalities and languages by their endings. <small>Then the quiz: be careful, some answers are traps.</small>',cols:'1.15fr 1fr',help:{label:'Rule',html:RULE1},
 acts:[
 {type:'sort',title:'Sort the endings',cols:['-(i)an','-ish','-ese','other'],items:[{t:'Argentinian',c:0},{t:'Polish',c:1},{t:'Japanese',c:2},{t:'Swiss',c:3},{t:'Austrian',c:0},{t:'Turkish',c:1},{t:'Thai',c:3},{t:'Brazilian',c:0},{t:'Portuguese',c:2},{t:'Egyptian',c:0},{t:'Arabic',c:3},{t:'Bulgarian',c:0},{t:'Spanish',c:1},{t:'Mexican',c:0},{t:'French',c:3},{t:'Russian',c:0},{t:'German',c:0},{t:'Italian',c:0}]},
 {type:'quiz',title:'Country · nationality · language',label:'Question',cols:2,items:[
  {q:'What language do people speak in Brazil?',o:['Portuguese','Brazilian','Spanish','Brazilish'],a:'Portuguese'},
  {q:'A person from Switzerland is …',o:['Switzerlandish','Swiss','Swissian','Switzer'],a:'Swiss'},
  {q:'What language do people speak in Egypt?',o:['Egyptian','Turkish','Arabic','Egyptish'],a:'Arabic'},
  {q:'A person from Thailand is …',o:['Thailandese','Thailish','Thaian','Thai'],a:'Thai'},
  {q:'What language do people speak in Austria?',o:['Austrian','German','Polish','Italian'],a:'German'},
  {q:'A person from Argentina is …',o:['Argentinish','Argentinese','Argentinian','Argentian'],a:'Argentinian'},
  {q:'What language do people speak in Mexico?',o:['Mexican','Portuguese','Italian','Spanish'],a:'Spanish'},
  {q:'A person from Poland is …',o:['Polish','Polandish','Polian','Polandese'],a:'Polish'},
  {q:'Which language is NOT spoken in Switzerland?',o:['French','Spanish','German','Italian'],a:'Spanish',why:'Switzerland: French, German, Italian'},
  {q:'A person from Japan is …',o:['Japanian','Japanish','Japanese','Japanic'],a:'Japanese'},
  {q:'A person from Turkey is …',o:['Turkeyan','Turkese','Turkian','Turkish'],a:'Turkish'},
  {q:'Two countries on the list speak Spanish. Which?',o:['Brazil and Mexico','Argentina and Mexico','Argentina and Brazil','Mexico and Egypt'],a:'Argentina and Mexico'}]}]},
{stage:'Words',title:'Learning languages',hint:'Guess the meaning first, then turn the card over. <small>Then complete the advice with the correct form of the words.</small>',cols:'1fr 1.3fr',
 acts:[
 {type:'cards',title:'Flashcards · 18 words',items:LEARN.map(c=>({w:c[0],ru:c[2],d:c[1],ex:c[3]}))},
 {type:'gaps',title:'Advice for learning English',inline:true,tail:' means that you can keep talking without frequently stopping.',items:[
  {pre:'When you learn English, remember that making',opts:['exams','mistake','mistakes','exercises'],ans:['mistakes']},
  {pre:'is natural – the important thing is to learn from the things you do wrong. It’s also important to',opts:['practice','practise','translate','memorise'],ans:['practise']},
  {pre:'as much as possible – use the language in lots of different situations. Frequent',opts:['revise','fluency','revision','memorisation'],ans:['revision']},
  {pre:'is essential, too – look back at new language regularly. This will help you to',opts:['memorisation','memorise','mistake','accurate'],ans:['memorise']},
  {pre:'the new vocabulary and grammar and store it in your brain.',opts:['Translate','Fluency','Homework','Translation'],ans:['Translation']},
  {pre:'can be useful sometimes, but remember that grammar and vocabulary don’t usually work in exactly the same way in different languages. And, finally, when we talk about speaking, there are two main goals:',opts:['accurate','accuracy','fluent','fluency'],ans:['accuracy']},
  {pre:'is good because it means what you are saying is correct and being',opts:['fluency','accuracy','accurate','fluent'],ans:['fluent']}]}]},
{stage:'Words',title:'Do or make?',hint:'Do we say it? Three wrong answers and the floor is lava. <small>Then choose the correct alternative.</small>',cols:'1.15fr 1fr',help:{label:'Do or make',html:RULE2},
 acts:[
 {type:'quiz',title:'Floor is lava · do or make?',label:'Phrase',lives:3,cols:2,opts:SAY,items:[
  {q:'do an essay',a:SAY[0]},{q:'make an exam',a:SAY[1],why:'do / take an exam'},{q:'take an exam',a:SAY[0]},{q:'make a mistake',a:SAY[0]},{q:'do a mistake',a:SAY[1],why:'make a mistake'},{q:'do an exercise',a:SAY[0]},
  {q:'make homework',a:SAY[1],why:'do homework'},{q:'pass an exam',a:SAY[0]},{q:'make English',a:SAY[1],why:'do / study / learn English'},{q:'correct a mistake',a:SAY[0]},{q:'do homework',a:SAY[0]},
  {q:'make an exercise',a:SAY[1],why:'do an exercise'},{q:'fail an exam',a:SAY[0]},{q:'write an essay',a:SAY[0]},{q:'do English',a:SAY[0]},{q:'check homework',a:SAY[0]}]},
 {type:'quiz',title:'Exercise 7 · choose',label:'Question',cols:2,shuffle:false,items:[
  {q:'How do you ___ English after school?',o:['make','study'],a:'study'},
  {q:'How do you ___ before an exam?',o:['revise','revision'],a:'revise'},
  {q:'How do you feel when you ___ a mistake in English?',o:['do','make'],a:'make'}]}]},
{stage:'Speak',title:'Use it … don’t lose it!',hint:'Listen to the question and answer. <small>Then Module 3 Jeopardy: choose a box and answer aloud.</small>',cols:'1fr 1.2fr',
 acts:[
 {type:'talk',title:'Interview',label:'Question',secs:40,cards:IV2.map(q=>({q,say:q,audio:clip(q)}))},
 {type:'jeopardy',title:'Module 3 Jeopardy',cats:[
  {name:'Hello',qs:[{q:'bonjour',a:'French'},{q:'merhaba',a:'Turkish'},{q:'zdraveĭte',a:'Bulgarian'}]},
  {name:'Nationality',qs:[{q:'Poland',a:'Polish'},{q:'Thailand',a:'Thai'},{q:'Switzerland',a:'Swiss'}]},
  {name:'Language',qs:[{q:'Mexico',a:'Spanish'},{q:'Brazil',a:'Portuguese'},{q:'Egypt',a:'Arabic'}]},
  {name:'Word family',qs:[{q:'The noun from TRANSLATE',a:'translation'},{q:'The adjective from FLUENCY',a:'fluent'},{q:'The verb from MEMORISATION',a:'memorise'}]},
  {name:'Do or make',qs:[{q:'___ homework',a:'do'},{q:'___ a mistake',a:'make'},{q:'___ an exam (three verbs)',a:'do / take / pass / fail'}]}]}]}
]});
</script>
