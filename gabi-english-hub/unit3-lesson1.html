function result(title,ok,n,miss,again){stopAll();
 wb.innerHTML=`<p class="sub">${title}</p><p class="q">${ok} / ${n}</p>`+(miss.length?`<ul class="res">${miss.map(m=>`<li>${m[0]} → <b>${m[1]}</b></li>`).join('')}</ul>`:'<p class="why">No mistakes.</p>');
 wf.innerHTML=`<span>Finished</span><button class="btn" id="again">Play again</button>`;$('#again').onclick=again}

/* one question at a time, big answer buttons; secs = Speed Game */
function quiz(items,o){o=o||{};const list=o.keep?items:shuffle(items);let i=0,ok=0,miss=[];
 function show(){stopAll();const it=list[i],right=it.o[0],opts=shuffle(it.o);let done=false;
  wb.innerHTML=`<div class="row">${o.secs?ring(o.secs,o.secs):''}<p class="sub">${it.s||o.label||''}</p></div><p class="q">${it.q}</p><div class="opts" id="opts">${opts.map(x=>`<button>${x}</button>`).join('')}</div><p class="why" id="why"></p>`;
  wf.innerHTML=`<span>${i+1} / ${list.length} · score ${ok}</span><button class="btn" id="next" disabled>${i+1<list.length?'Next':'See result'}</button>`;
  const fin=pick=>{if(done)return;done=true;stopAll();const good=pick===right;if(good)ok++;else miss.push([it.q.replace(/<u>(&nbsp;)?\?(&nbsp;)?<\/u>/,'…').replace(/<\/?u>/g,''),right]);
   $('#opts').classList.add('lock');[...$('#opts').children].forEach(b=>{if(b.textContent===right)b.classList.add('good');else if(b.textContent===pick)b.classList.add('bad')});
   $('#why').textContent=(pick===null?'Time is up. ':'')+(it.why||'');$('#next').disabled=false};
  [...$('#opts').children].forEach(b=>b.onclick=()=>fin(b.textContent));
  $('#next').onclick=()=>{i++;if(i<list.length)show();else result(o.title||'Result',ok,list.length,miss,()=>quiz(items,o))};
  if(o.secs)runRing(o.secs,()=>fin(null))}
 show()}

/* interview: one card, the question only sounds; text on the back */
function interview(qs){let i=0,flip=false;
 function show(auto){stopAll();
  wb.innerHTML=`<div class="nums">${qs.map((_,k)=>`<button class="${k===i?'on':''}" data-k="${k}">${k+1}</button>`).join('')}</div>
  <div class="card${flip?' f':''}" id="card"><div class="in"><div class="a"><p class="sub">Question ${i+1}</p><div class="row"><button class="btn" id="play">Play</button><button class="btn l" id="stop">Stop</button>${ring(40,40)}</div></div><div class="b"><p class="sub">Question ${i+1}</p><div class="m">${qs[i]}</div></div></div></div>`;
  wf.innerHTML=`<button class="btn l" id="back" ${i?'':'disabled'}>Back</button><button class="btn" id="flip">Flip the card</button><button class="btn l" id="fwd" ${i<qs.length-1?'':'disabled'}>Forward</button>`;
  wb.querySelectorAll('.nums button').forEach(b=>b.onclick=()=>{i=+b.dataset.k;flip=false;show()});
  $('#play').onclick=()=>{$('#play').textContent='Replay';clearInterval(tick);const r=$('#ring');if(r)r.outerHTML=ring(40,40);say(qs[i],null,()=>runRing(40))};
  $('#stop').onclick=()=>{stopAll();const r=$('#ring');if(r)r.outerHTML=ring(40,40)};
  $('#flip').onclick=()=>{flip=!flip;$('#card').classList.toggle('f',flip)};
  $('#back').onclick=()=>{i--;flip=false;show()};$('#fwd').onclick=()=>{i++;flip=false;show()}}
 show()}

/* Quizlet-style deck: one card, word on the front, meaning and example on the back */
function deck(cards){let i=0,flip=false;
 function show(){stopAll();const c=cards[i];
  wb.innerHTML=`<div class="card${flip?' f':''}" id="card" role="button" tabindex="0"><div class="in"><div class="a"><div class="w">${c.f}</div>${c.fs?`<p class="sub">${c.fs}</p>`:''}</div><div class="b"><div class="m">${c.b}</div><div class="e">${c.e}</div></div></div></div><button class="spk" id="spk" title="Listen">${SPK}</button>`;
  wf.innerHTML=`<button class="btn l" id="back" ${i?'':'disabled'}>←</button><span>${i+1} / ${cards.length}</span><button class="btn l" id="fwd">${i<cards.length-1?'→':'Start again'}</button>`;
  $('#card').onclick=()=>{flip=!flip;$('#card').classList.toggle('f',flip)};
  $('#spk').onclick=()=>say(flip&&c.sb?c.sb:c.f,$('#spk'));
  $('#back').onclick=()=>{i--;flip=false;show()};$('#fwd').onclick=()=>{i=i<cards.length-1?i+1:0;flip=false;show()}}
 show()}

function predict(){let n=1;const tags=shuffle(HELLO.map(h=>h[0]));
 function show(){const all=n>tags.length;
  wb.innerHTML=`<p class="q">${all?'Module 3 · Plurilingual':'What is Module 3 about?'}</p><div class="tags">${tags.slice(0,n).map(t=>`<span class="tag">${t}</span>`).join('')}</div>`;
  wf.innerHTML=`<span>${Math.min(n,tags.length)} / ${tags.length}</span><div class="row"><button class="btn l" id="all">Show all</button><button class="btn" id="more" ${all?'disabled':''}>${n===tags.length?'Show the title':'One more word'}</button></div>`;
  $('#more').onclick=()=>{n++;show()};$('#all').onclick=()=>{n=tags.length+1;show()}}
 show()}

function match(pairs){const L=shuffle(pairs.map((p,i)=>i)),R=shuffle(L);let sel=null,done={},miss=0;
 function show(){
  wb.innerHTML=`<div class="match"><div class="L">${L.map(i=>`<button data-l="${i}" class="${done[i]?'ok':sel===i?'sel':''}">${pairs[i][0]}</button>`).join('')}</div><div class="R">${R.map(i=>`<button data-r="${i}" class="${done[i]?'ok':''}">${pairs[i][1]}</button>`).join('')}</div></div>`;
  const k=Object.keys(done).length;
  wf.innerHTML=`<span>${k} / ${pairs.length} pairs · mistakes ${miss}</span>${k===pairs.length?'<button class="btn" id="again">Play again</button>':''}`;
  if($('#again'))$('#again').onclick=()=>match(pairs);
  wb.querySelectorAll('[data-l]').forEach(b=>b.onclick=()=>{if(done[b.dataset.l])return;sel=+b.dataset.l;show()});
  wb.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{const r=+b.dataset.r;if(sel===null||done[r])return;if(r===sel){done[r]=1;sel=null;show()}else{miss++;b.classList.add('no');later(show,450)}})}
 show()}

function sort(){const list=shuffle(SORT);let i=0,ok=0,miss=[],placed=[[],[],[],[]],lock=false;
 function show(){if(i>=list.length)return result('Endings',ok,list.length,miss,sort);const it=list[i];
  wb.innerHTML=`<p class="sub">Nationality or language · which ending?</p><p class="q"><u>${it[0]}</u></p><div class="bins">${BINS.map((b,k)=>`<button class="bin" data-b="${k}"><b>${b}</b><p>${placed[k].map(w=>`<span class="${w[1]?'':'w'}">${w[0]}</span>`).join('')}</p></button>`).join('')}</div>`;
  wf.innerHTML=`<span>${i+1} / ${list.length} · score ${ok}</span><span></span>`;
  wb.querySelectorAll('.bin').forEach(b=>b.onclick=()=>{if(lock)return;lock=true;const k=+b.dataset.b,good=k===it[2];if(good)ok++;else miss.push([it[0],it[1]+' ('+BINS[it[2]]+')']);
   placed[it[2]].push([it[1],good]);b.classList.add(good?'hit':'flash');wb.querySelector('.q').innerHTML=`${it[0]} → <u>${it[1]}</u>`;later(()=>{lock=false;i++;show()},good?700:1500)})}
 show()}

function cloze(){let sel=null,got={},miss=0;
 function show(){
  wb.innerHTML=`<p class="sub">Advice for learning English</p><p class="cloze">${ADVICE.map(x=>typeof x==='number'?`<button class="gap ${got[x]?'good':sel===x?'sel':''}" data-g="${x}">${got[x]?GAPS[x][0]:'('+'abcdefg'[x]+')'}</button>`:x).join('')}</p><div class="bank" id="bank"></div>`;
  const k=Object.keys(got).length;
  wf.innerHTML=`<span>${k} / ${GAPS.length} gaps · mistakes ${miss}</span>${k===GAPS.length?'<button class="btn" id="again">Play again</button>':''}`;
  if($('#again'))$('#again').onclick=cloze;
  if(sel!==null)$('#bank').innerHTML=shuffle(GAPS[sel]).map(w=>`<button>${w}</button>`).join('');
  wb.querySelectorAll('.gap').forEach(b=>b.onclick=()=>{const g=+b.dataset.g;if(got[g])return;sel=g;show()});
  [...$('#bank').children].forEach(b=>b.onclick=()=>{if(b.textContent===GAPS[sel][0]){got[sel]=1;sel=null;show()}else{miss++;b.classList.add('no');b.disabled=true}})}
 show()}

function doMake(){const list=shuffle(DM);let i=0,ok=0,lives=3,miss=[];
 function show(){if(i>=list.length||lives<=0)return result(lives<=0?'No lives left':'Do or make?',ok,list.length,miss,doMake);const it=list[i];let done=false;
  wb.innerHTML=`<p class="lives">LIVES ${'● '.repeat(lives)}${'○ '.repeat(3-lives)}</p><p class="q">${it[0]}</p><div class="opts" id="opts"><button>We say it</button><button>We don’t say it</button></div><p class="why" id="why"></p>`;
  wf.innerHTML=`<span>${i+1} / ${list.length} · score ${ok}</span><button class="btn" id="next" disabled>Next</button>`;
  [...$('#opts').children].forEach((b,k)=>b.onclick=()=>{if(done)return;done=true;const good=(k===0)===!!it[1];if(good)ok++;else{lives--;miss.push([it[0],it[1]?'we say it':'we don’t say it'])}
   $('#opts').classList.add('lock');b.classList.add(good?'good':'bad');$('#why').textContent=it[1]?'We say: '+it[0]+'.':'We don’t say: '+it[0]+'.';$('#next').disabled=false});
  $('#next').onclick=()=>{i++;show()}}
 show()}

const RULE1=`<div class="rule"><section><h3>Capital letters</h3><p>Languages, countries and nationalities <b>always begin with a capital letter</b>: Poland, Polish.</p>
<h3 style="margin-top:8px">Endings and stress</h3><table class="t"><tr><th>Ending</th><th>Stress</th><th>Examples</th></tr>
<tr><td><b>-(i)an</b></td><td>before -(i)an</td><td>Argen<b>ti</b>nian, Bra<b>zi</b>lian, Bul<b>ga</b>rian, E<b>gyp</b>tian, <b>Ger</b>man, I<b>ta</b>lian, <b>Ru</b>ssian</td></tr>
<tr><td><b>-ish</b></td><td>first syllable</td><td><b>Po</b>lish, <b>Spa</b>nish, <b>Tur</b>kish</td></tr>
<tr><td><b>-ese</b></td><td>on -ese</td><td>Japa<b>nese</b>, Portu<b>guese</b></td></tr></table></section>
<section><h3>Pay attention</h3><p><b>Aus</b>trian and <b>Me</b>xican: stress on the first syllable.</p><p>Irregular: <b>Arabic</b>, <b>French</b> (France), <b>Swiss</b> (Switzerland), <b>Thai</b> (Thailand).</p>
<p>Switzerland has more than one language: French, German, Italian.</p><p>Spanish: Argentina and Mexico. German: Austria. Portuguese: Brazil. Arabic: Egypt.</p></section></div>`;
const RULE2=`<div class="rule"><section><h3>Do or make</h3><p><b>do</b>: an action, an activity or some kind of work.</p><p><b>make</b>: constructing, building or creating something, or preparing food.</p><p>There are many exceptions.</p>
<table class="t"><tr><td><b>do</b> an exam, an exercise, English, homework, an essay</td></tr><tr><td><b>make</b> a mistake</td></tr><tr><td>take / pass / fail an exam · check / correct an exercise · correct a mistake · study / learn English · check homework · write / read an essay</td></tr></table></section>
<section><h3>Pay attention</h3><p><b>practice</b> (noun) and <b>practise</b> (verb): different spelling, the same pronunciation.</p><p><b>memorise</b> (verb) and <b>memorisation</b> (noun): the stress moves.</p><p><b>revise</b> /rɪˈvaɪz/ and <b>revision</b> /rɪˈvɪʒən/: the sound of “i” changes.</p><p><b>accuracy</b> (noun) and <b>accurate</b> (adjective); <b>fluency</b> (noun) and <b>fluent</b> (adjective).</p></section></div>`;
function page(html){wb.innerHTML=html;wf.innerHTML='<span></span><span></span>'}

const BLOCKS=[
 {k:'k5',l:'Check-in',t:'Speed Game',h:'Speed Game · homework',tabs:[['15 seconds',()=>quiz(HW,{secs:15,keep:true,title:'Speed Game'})]]},
 {k:'k4',l:'Speaking',t:'Warm-up questions',h:'Speaking · warm-up',tabs:[['Questions',()=>interview(IV1)]]},
 {k:'k1',l:'Prediction',t:'What is it about?',h:'Prediction',tabs:[['Predict',predict]]},
 {k:'k2',l:'Matching',t:'Hello in 12 languages',h:'Hello in 12 languages',tabs:[['Match',()=>match(HELLO)]]},
 {k:'k3',l:'Flashcards',t:'Countries and nationalities',h:'Flashcards',tabs:[['Countries',()=>deck(COUNTRY.map(c=>({f:c[0],b:c[1],e:'Language: '+c[2],sb:c[1]})))],['Learning languages',()=>deck(LEARN.map(c=>({f:c[0],fs:c[1],b:c[2],e:c[3]})))]]},
 {k:'k1',l:'Sorting',t:'Which ending?',h:'Which ending?',tabs:[['Sort',sort],['Rule',()=>page(RULE1)]]},
 {k:'k2',l:'Quiz',t:'Country, nationality, language',h:'Country, nationality, language',tabs:[['Quiz',()=>quiz(QUIZ,{title:'Quiz'})]]},
 {k:'k3',l:'Text',t:'Advice for learning English',h:'Learning languages',tabs:[['Text',cloze],['Choose',()=>quiz(ALT,{keep:true,title:'Choose'})]]},
 {k:'k5',l:'Lives game',t:'Do or make?',h:'Do or make?',tabs:[['Game',doMake],['Rule',()=>page(RULE2)]]},
 {k:'k4',l:'Speaking',t:'Use it, don’t lose it',h:'Speaking · interview',tabs:[['Interview',()=>interview(IV2)]]}
];
$('#tiles').innerHTML=BLOCKS.map((b,i)=>`<button class="tile ${b.k}" data-i="${i}"><i>${i+1}</i><small>${b.l.toUpperCase()}</small><b>${b.t}</b></button>`).join('');
function open(i){const b=BLOCKS[i];$('#wt').textContent=b.h;ov.classList.add('on');
 const tabs=$('#tabs');tabs.innerHTML=b.tabs.length>1?b.tabs.map((t,k)=>`<button data-t="${k}">${t[0]}</button>`).join(''):'';
 const go=k=>{stopAll();[...tabs.children].forEach((x,j)=>x.classList.toggle('on',j===k));wb.scrollTop=0;b.tabs[k][1]()};
 [...tabs.children].forEach((x,k)=>x.onclick=()=>go(k));go(0);
 document.querySelector(`.tile[data-i="${i}"]`).classList.add('done')}
function close(){stopAll();ov.classList.remove('on','big');$('#grow').textContent='Expand';wb.innerHTML='';wf.innerHTML=''}
document.querySelectorAll('.tile').forEach(t=>t.onclick=()=>open(+t.dataset.i));
$('#close').onclick=close;
$('#grow').onclick=()=>{$('#grow').textContent=ov.classList.toggle('big')?'Smaller':'Expand'};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('on'))close()});
</script>
