/* Oxford Discover Futures 2: Unit 4 p42–43 (track 1.13), Unit 1 p10–11 (track 1.02), Unit 3 p34–35, Project p90–91.

const S113=[['One','Hi there and welcome to Connect, our weekly look at the weird and wonderful world of social media.'],['Two','The big topic this week is online picture sharing. So let’s start with this picture, which I found on a friend’s gaming blog.'],['One','That’s such a cool image. It’s perfect for a blog about video games.'],['Two','Yeah, it’s nice, but it’s stolen.'],['One','Stolen? What do you mean?'],['Two','Well, my friend found it on Google Images and he simply pasted it into his blog, but it isn’t his picture.'],['One','Yeah, but in the blog it says it’s from Google Images.'],['Two','Yes, but that’s not enough. If you take a picture, it belongs to you. You own the picture and the copyright, the legal right to use it. If someone wants to use a picture, they have to find out who it belongs to and ask for permission to use it.'],['One','People don’t mind if you use their pictures.'],['Two','Um, yes they do! Some photographers make money from pictures. You can’t just steal them.'],['One','Sometimes it says online that everyone has permission to use the picture.'],['Two','Sure, in that case it’s fine to use it. Let’s look at another picture. This is a picture of a girl called Emma. Now, you tell me what’s wrong with it.'],['One','It looks okay to me. That’s so funny. Emma having a bad morning. Yes, it’s not her best look.'],['Two','And who shared the picture?'],['One','Oh, it was someone called Nick.'],['Two','Yeah, and look at the comments.'],['One','Ah, how embarrassing!'],['Two','Yes, I don’t think Nick thought carefully about this. He needed to consider how this would affect Emma. You don’t share a picture if it will embarrass someone. It’s good netiquette to ask for permission before you share, too.'],['One','Netiquette. I like that word. Netiquette is correct internet behavior, isn’t it?'],['Two','Right. So let’s look at a third picture with a netiquette problem.'],['One','What a nice invitation. What’s wrong with it?'],['Two','The problem isn’t in the picture. The problem is who is looking at it. The person posting this picture didn’t change their settings from public to private and hundreds of people can access the image, not just their family and friends. Sometimes people see the word party and they invite themselves.'],['One','Yeah, I guess you always need to think before you share.'],['Two','Yes, just think of PIC. P, I, C. Think of P for Permission. You need the owner’s permission to share an image that isn’t yours. I is for Information. Ask yourself if you’re giving too much information to strangers. Finally, C is for Comments. Before you share a picture, think of the comments it might receive.'],['One','PIC. Great, got it.']];
Lesson.boot({kicker:'Lesson 5 · Unit 1',steps:[
{stage:'Sharing',title:'Fair share?',photo:{src:'age-scenes/10.jpg',alt:'A teenager shows his phone to his grandmother',cap:'Before you post it: is it OK?'},hint:'Think of the Sharenting text. Is it OK to share a picture when …',
 act:{type:'quiz',label:'Situation',opts:['OK to share','Not OK'],items:[
  {q:'… it might be embarrassing for someone now or in the future?',a:'Not OK',why:'Remember the teenagers who don’t want people to see their baby photos.'},
  {q:'… you give contact details with it, like a full name, an address or the name of a school?',a:'Not OK',why:'Strangers can find the person.'},
  {q:'… you tag the picture with a private address?',a:'Not OK',why:'It shows everyone where somebody lives.'},
  {q:'… someone has asked you to remove or not share the picture?',a:'Not OK',why:'It is their image. Respect the decision.'},
  {q:'… you don’t know if the picture is protected by copyright?',a:'Not OK',why:'Find out who owns it and ask first.'},
  {q:'… you have permission to use the picture?',a:'OK to share',why:'Permission is the key.'},
  {q:'… you know the privacy settings and who can access the picture?',a:'OK to share',why:'You control who sees it.'},
  {q:'… the place where you want to post it might not be secure?',a:'Not OK',why:'Other people could copy or misuse it.'}]}},
{stage:'Sharing',title:'The Connect podcast',hint:'Answer from memory. Type full answers.',
 side:{look:'radio',title:'Oxford Discover Futures 2 · p42',audio:[{src:'assets/audio/odf-1-13.mp3',label:'Connect: online picture sharing',script:S113}],gate:true,gateText:'Listen to the podcast first. They discuss three pictures.',gateBtn:'Show the questions'},
 act:{type:'gaps',open:true,dense:true,items:[

  {pre:'What is netiquette?',long:1,kw:[['behav'],['polite'],['correct']],model:'Correct behaviour on the internet.'},
  {pre:'Picture 3, the party invitation: what was the problem?',long:1,kw:[['private'],['public'],['setting'],['hundreds'],['everyone']],model:'The settings were public, so hundreds of people could see it and invite themselves.'},
  {pre:'P, I, C: what do the three letters stand for?',long:1,kw:[['permission','information','comment']],model:'Permission, Information, Comments.'}]}},

{stage:'Sharing',title:'What the expert said',hint:'From memory. Type full answers.',
 side:{look:'radio',title:'Listen again if you need to',audio:[{src:'assets/audio/odf-1-02.mp3',label:'Protecting your identity online'}]},
 act:{type:'gaps',open:true,dense:true,items:[

  {pre:'a secret word that opens your account',ans:['password','a password'],long:1},
  {pre:'to put a photo or message on social media',ans:['post','to post','share','upload'],long:1},

{stage:'Speaking',title:'Warn them',photo:{src:'assets/l5/sharenting.jpg',alt:'A parent photographing a toddler',cap:'Photo number 1,000'},hint:'Give one minute of advice. Use at least three warning phrases.',
 act:{type:'talk',label:'Advice',secs:60,chips:['Be careful not to …','Take care to …','Beware of …','Make sure that …','Whatever you do, don’t …','Keep an eye open for …'],cards:[
  {q:'A parent posts about 1,000 photos of their child before the child is five. Give them advice.'},
  {q:'Your friend shares passwords and uses free Wi-Fi everywhere. Warn him.'},
  {q:'Explain the PIC rule to a ten-year-old who has just got a phone.'}]}},
{stage:'Speaking',title:'Mini-debate',photo:{src:'assets/l5/debate.jpg',alt:'Two teenagers debating',cap:'For or against?'},hint:'“Parents should ask their children before they post any photo of them.” <small>Facts you can use: about 1,000 photos before the age of five; fines of €45,000 in France; children over ten should be asked.</small>',
 act:{type:'talk',label:'Round',secs:60,keepChips:true,chipLabel:'Debate phrases · tap when used',chips:['First of all, …','Secondly, …','The way I see it, …','For example, …','I’m sorry, but I have to disagree.','I’m not convinced by your point about …','To sum up, …'],cards:[
  {q:'Speak for the statement. Two points, each with an example.'},
  {q:'Now speak against the statement. Two points, each with an example.'},
  {q:'Your teacher gives the opposite opinion. Respond to it politely.',secs:40},
  {q:'Sum up: what do you really think?',secs:40}]}},
{stage:'Style',title:'Formal, neutral or informal?',photo:{src:'assets/l5/phone.jpg',alt:'A teenager typing a message',cap:'Who are you writing to?'},hint:'A text to a friend, a letter from a school, an email to an exchange partner. Which is which?',
 act:{type:'quiz',label:'Phrase',opts:['Formal','Neutral','Informal'],items:[
  {q:'Hey, Sam',a:'Informal',why:'A text to a friend.'},{q:'Dear Mr. Hooper,',a:'Formal',why:'Title and surname.'},{q:'Dear Daniel,',a:'Neutral',why:'First name, but still polite.'},
  {q:'How cool is that?',a:'Informal',why:'Formal: We are pleased. Neutral: I’m very excited.'},{q:'We are pleased to inform you that …',a:'Formal',why:'No contractions, official verbs.'},{q:'I’m very excited.',a:'Neutral',why:'Friendly but not slang.'},
  {q:'Text me if you hear anything.',a:'Informal',why:'Formal: Please do not hesitate to contact us.'},{q:'Please do not hesitate to contact us.',a:'Formal',why:'A fixed formal phrase.'},{q:'Let me know if you need any information.',a:'Neutral',why:'Polite and simple.'},
  {q:'Talk soon',a:'Informal',why:'Formal: Yours sincerely. Neutral: Best wishes.'},{q:'Yours sincerely,',a:'Formal',why:'Ends a letter to a named person.'},{q:'Best wishes,',a:'Neutral',why:'Works with people you don’t know well.'},
  {q:'We are writing to you regarding …',a:'Formal',why:'Neutral: I’m just writing to …'},{q:'I’m just writing to say hello.',a:'Neutral',why:'A contraction and a friendly aim.'},{q:'Any news????',a:'Informal',why:'Repeated question marks and an incomplete sentence.'}]}}
]});
