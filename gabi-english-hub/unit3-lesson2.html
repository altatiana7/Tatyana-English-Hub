<script>
/* Module 3 (Plurilingual), lesson 2 · Gateway B1, SB p.33 Reading «English: the language that never sleeps» + p.34 Grammar in context 1
   (countable and uncountable nouns; some, any, much, many, a lot of, a few, a little) + Culture exchange «International English» + p.35 ex 8-11 (a few / few).
   Same engine and look as lesson 1. Two activities per screen:
   1 homework check (error hunter + Speed Game) -> 2 warm-up questions + prediction from parts of the photos
   -> 3 the article: listen first, text hidden + questions from memory -> 4 the text with gaps a-g + the missing sentences
   -> 5 words from the text (flashcards) + blends and acronyms -> 6 countable / uncountable (sort + ex 2)
   -> 7 quantifiers (sort + floor is lava) -> 8 a few / few, a little / little -> 9 Culture exchange: International English
   -> 10 Guess the country (ex 10-11) + Jeopardy -> 11 Critical thinkers + Speed Game.
   Audio: natural recordings in ../card-audio (AUDIO_TEXTS is collected by tools/card-audio-collect.mjs). */
const ARTICLE=[
 "Some countries, like Spain, Italy and France, have language academies which watch over the official development of their language. But there aren't any official organisations doing the same with English. [a]",
 "New words and expressions appear in English almost every week. [b] They're the result of two words coming together, or 'blending', to make a new word. So, the words 'snack' and 'accident' produce the word 'snaccident'. An example of a 'snaccident' is when you plan to eat just one chocolate and you eat the whole box by accident. 'Snaccidents' can happen when we become 'hangry'. That's when we're angry because we're hungry. This can often happen to 'screenagers'. [c]",
 "Social media is responsible for new language. When you see photos and posts of your friends doing exciting things or travelling around the world, it can cause FOMO. [d] People who often travel are the POTUS and FLOTUS. They're the President and First Lady of the United States. FOMO, POTUS and FLOTUS are examples of new acronyms. [e]",
 "With just a little imagination, people are inventing hundreds of new words every day. Are there any real problems with this? [f] That's because the world changes, too. Maybe technology is making things change very quickly now. [g] This innovation of language has been happening for a long time, even since Shakespeare. So, for those people who are unhappy because they think all these new words are incorrect, just have some 'froyo' and 'chillax'!"];
const SENT=["That's the fear of missing out, feeling anxious because you think other people are having a good time without you.","A lot of them are blends.","But there were many changes in England in the 16th century, too.","All languages change and evolve.","There are few examples, apart from blends and acronyms.","These are young people who spend a lot of time in front of a screen.","Is that why English continues to change so quickly?","These words are made with the first letters of a phrase or expression and are popular on social media."];
const KEY={a:6,b:1,c:5,d:0,e:7,f:3,g:2};
const FULL=ARTICLE.map(p=>p.replace(/\[([a-g])\]/g,(m,g)=>SENT[KEY[g]]));
const SPOKEN=FULL.flatMap(p=>p.match(/[^.!?]+[.!?]+['’]?/g).map(x=>x.trim()));
const WARM=['How many new English words do you learn in a week?','Where do you see new English words: on social media, in games or in films?','Which English abbreviations do you use when you send messages?','Do you think English changes faster than Russian? Why?'];
const IV3=['Do you ever feel you are missing out when you look at your friends’ posts?','Have you ever had a snaccident? What happened?','Do you get hangry? What do you do then?','Are you a screenager? How much time do you spend in front of a screen?'];
const WORDS=[
 ['development','noun','развитие','the official development of their language'],
 ['blend','noun / verb','смесь; смешивать','snack + accident = snaccident: a blend'],
 ['post','noun','пост, публикация','photos and posts of your friends'],
 ['First Lady','noun','первая леди','the President and First Lady of the United States'],
 ['evolve','verb','развиваться, эволюционировать','All languages change and evolve.'],
 ['miss out','phrasal verb','упустить, пропустить что-то интересное','the fear of missing out'],
 ['acronym','noun','аббревиатура, читаемая как слово','FOMO, POTUS and FLOTUS are acronyms.'],
 ['invent','verb','придумывать, изобретать','people are inventing hundreds of new words'],
 ['innovation','noun','новшество, нововведение','This innovation of language has been happening for a long time.'],
 ['responsible for','adjective','являющийся причиной, ответственный за','Social media is responsible for new language.'],
 ['anxious','adjective','тревожный, беспокоящийся','feeling anxious because you think other people are having a good time'],
 ['imagination','noun','воображение','With just a little imagination, people are inventing new words.']];
const NEWW=[['snaccident','snack + accident: you eat much more than you planned'],['hangry','hungry + angry: angry because you are hungry'],['screenager','screen + teenager: a young person who spends a lot of time in front of a screen'],['froyo','frozen + yoghurt: a frozen dessert made from yoghurt'],['chillax','chill out + relax: to be relaxed and calm'],['FOMO','the Fear Of Missing Out'],['POTUS','the President Of The United States'],['FLOTUS','the First Lady Of The United States']];
const AUDIO_TEXTS=SPOKEN.concat(WARM,IV3,WORDS.map(w=>w[0]),WORDS.map(w=>w[3]),NEWW.map(w=>w[0]));
const clip=t=>CardAudio.base+CardAudio.key(t)+'.mp3?v=20261118a';
const COURT=(t,s)=>`<div class="court"><h4>${t}</h4><span class="stamp">${s||'RULE'}</span></div>`;
const RULE_CU=COURT('Countable and uncountable nouns')+`<ul class="say">
<li><b>Countable</b> nouns have a singular and a plural: a word – two words, an example – lots of examples.</li>
<li><b>Uncountable</b> nouns have no plural and no a / an: imagination, information, advice, knowledge, water, snow, luggage. The verb is singular: <b>There is</b> some juice.</li>
<li><b>Both</b>: the meaning changes. <b>time</b> (U, время) – six <b>times</b> (C, раз) · <b>chocolate</b> (U, шоколад) – <b>a chocolate</b> (C, конфета) · <b>language</b> (U, язык вообще) – <b>a language</b> (C, конкретный язык).</li></ul>
<p class="words"><b>Watch out:</b> advice, information, news, homework, luggage are <b>uncountable</b> in English: <b>a piece of</b> advice, <b>some</b> information, the news <b>is</b> good.</p>`;
const RULE_Q=COURT('Quantifiers')+`<table><tr><th></th><th>countable (plural)</th><th>uncountable</th></tr>
<tr><td>+</td><td>some, a lot of, lots of, a few, many*</td><td>some, a lot of, lots of, a little</td></tr>
<tr><td>– / ?</td><td>any, many, a lot of</td><td>any, much, a lot of</td></tr></table>
<ul class="say" style="margin-top:8px"><li><b>some</b> in positive sentences and in offers: Would you like <b>some</b> froyo?</li>
<li><b>any</b> in negatives and questions: Are there <b>any</b> problems? They haven’t got <b>any</b> imagination.</li>
<li><b>much / many</b> mostly in negatives and questions; in positive sentences we usually say <b>a lot of</b>.</li></ul>
<p class="words"><b>Watch out:</b> <b>a few / a little</b> = some, enough (positive). <b>few / little</b> = not enough, almost none (negative): There are <b>few</b> examples. They have <b>little</b> imagination.</p>`;
/* flashcards: a Listen button with the recorded British voice */
(function(){const C=Lesson.ACT.cards,v=C.view;C.view=(a,s)=>v(a,s).replace('<div class="row nav3">',`<div class="row nav3"><button class="ghost" data-listen="${Lesson.esc(a.items[s.i].w)}">Listen</button>`);
 document.addEventListener('click',e=>{const b=e.target.closest('[data-listen]');if(b){e.stopPropagation();CardAudio.say(b.dataset.listen)}},true)})();
/* prediction from parts of the photos: six tiles cover each photo, open them one by one */
Lesson.ACT.reveal={
 init(a,s){s.k=0;s.off=a.items.map(()=>[])},
 view(a,s){const m=a.items[s.k],off=s.off[s.k];
  const pic=m.title?`<div class="titlecard"><div><b>${Lesson.esc(m.title)}</b><span>${Lesson.esc(m.sub||'')}</span></div></div>`:`<img src="${m.img}" alt="">`;
  return `<div class="reveal"><div class="frame">${pic}<div class="tiles">${[1,2,3,4,5,6].map(n=>`<button data-tile="${n}" class="${off.includes(n)?'off':''}">${n}</button>`).join('')}</div></div>
   <div class="row">${a.items.map((x,k)=>`<button class="ghost${k===s.k?' on':''}" data-rk="${k}">${Lesson.esc(x.label)}</button>`).join('')}<button class="main" data-rall>Show all</button></div></div>`},
 click(a,s,d){if(d.rk!==undefined){s.k=+d.rk;return Lesson.redraw()}
  if(d.tile!==undefined){const o=s.off[s.k],n=+d.tile;if(!o.includes(n))o.push(n);return Lesson.redraw()}
  if(d.rall!==undefined){s.off[s.k]=[1,2,3,4,5,6];return Lesson.redraw()}}};
Lesson.ACT.read={view(a){return a.html}};
/* the article: listen first (the text is hidden), then read; gaps a-g, the answers can be shown */
let ART_ON=false;
const artHTML=fill=>`<h5>ENGLISH<small>THE LANGUAGE THAT NEVER SLEEPS</small></h5>`+ARTICLE.map(p=>`<p>${Lesson.esc(p).replace(/\[([a-g])\]/g,(m,g)=>fill?`<span class="gap">(${g})</span> <span class="fill">${Lesson.esc(SENT[KEY[g]])}</span>`:`<span class="gap">(${g}) ……</span>`)}</p>`).join('')+
 `<div class="note"><div><b>*froyo</b> (noun): frozen yoghurt = frozen dessert made from yoghurt, often served with fruit</div><div><b>**chillax</b> (verb): a combination of chill out + relax = to be relaxed and calm</div></div>`;
/* leaving the screen stops the article */
document.addEventListener('click',e=>{if(e.target.closest('#steps,#prev,#next,.home')&&ART_ON){ART_ON=false;CardAudio.stop()}},true);
Lesson.ACT.article={
 init(a,s){s.shown=!!a.open;s.fill=false},
 view(a,s){const play=`<button class="main" data-aplay>${ART_ON?'Stop':(a.open?'Listen and check':'Listen')}</button>${ART_ON?'<span class="eq"><i></i><i></i><i></i></span>':''}`;
  if(!s.shown)return `<div class="art"><div class="page idle"><div><b>Listen first.</b>The text is hidden.</div></div><div class="row">${play}<button class="ghost" data-ashow>Show the text</button></div></div>`;
  return `<div class="art"><div class="page">${artHTML(s.fill)}</div><div class="row">${play}<button class="ghost${s.fill?' on':''}" data-afill>${s.fill?'Hide the answers':'Show the answers'}</button>${a.open?'':'<button class="ghost" data-ahide>Hide the text</button>'}</div></div>`},
 click(a,s,d){
