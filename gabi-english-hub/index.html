<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Gabi English Hub · Gateway B1</title>
<style>
:root{--ink:#082d59;--blue:#158edf;--line:#d7e6f2}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#e9f6ff;font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center}
.board{
  position:relative;
  width:min(100vw,calc(100vh * 16 / 9));
  height:min(100vh,calc(100vw * 9 / 16));
  aspect-ratio:16/9;
  overflow:hidden;
  background:#fff;
  box-shadow:0 0 0 1px rgba(12,60,100,.08);
  touch-action:manipulation;
}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;display:block;user-select:none;-webkit-user-drag:none}
.homeHot,.moduleHot{position:absolute;z-index:5;border:0;background:transparent;cursor:pointer;padding:0}
.homeHot{left:2.0%;top:7.25%;width:3.8%;height:5.7%;border-radius:18%}
.moduleHot{left:2.0%;width:24.4%;height:6.45%;border-radius:14px}
.moduleHot:focus-visible,.homeHot:focus-visible{outline:4px solid rgba(21,142,223,.72);outline-offset:2px}
.m1{top:13.6%}.m2{top:21.45%}.m3{top:29.25%}.m4{top:37.05%}.m5{top:44.85%}
.m6{top:52.65%}.m7{top:60.45%}.m8{top:68.25%}.m9{top:76.05%}.m10{top:83.85%}

.lessonMenu{
  position:absolute;z-index:20;left:5.55%;width:20.6%;
  display:none;background:rgba(255,255,255,.985);
  border:1px solid rgba(15,79,128,.12);
  border-radius:0 0 16px 16px;
  box-shadow:0 16px 38px rgba(4,48,83,.22);
  overflow:hidden;
  backdrop-filter:blur(10px);
}
.lessonMenu.open{display:block;animation:openMenu .15s ease-out}
@keyframes openMenu{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.menuTitle{padding:9px 12px 8px;border-bottom:1px solid #e5edf3;background:#f8fcff}
.menuTitle small{display:block;color:#688197;font-weight:800;font-size:clamp(8px,.66vw,12px);letter-spacing:.08em;text-transform:uppercase}
.menuTitle b{display:block;color:var(--ink);margin-top:2px;font-size:clamp(10px,.88vw,16px)}
.lessonBtn{
  width:100%;border:0;border-bottom:1px solid #edf2f6;background:#fff;
  display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center;
  text-align:left;padding:8px 11px;color:#173f61;cursor:pointer;
}
.lessonBtn:last-child{border-bottom:0}
.lessonBtn:hover,.lessonBtn:focus-visible{background:#edf8ff;outline:none}
.lessonNo{width:27px;height:27px;border-radius:9px;display:grid;place-items:center;background:var(--accent,#168edf);color:#fff;font-weight:900;font-size:12px}
.lessonBtn b{display:block;font-size:clamp(9px,.78vw,14px);line-height:1.08}
.lessonBtn span.note{display:block;font-size:clamp(7px,.62vw,11px);color:#748b9c;margin-top:2px;line-height:1.12}

#lessonView{position:fixed;inset:0;z-index:50;display:none;background:#f2f8fc;overflow:auto}
#lessonView.on{display:block}
.topbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:13px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--line)}
.back{width:42px;height:42px;border:0;border-radius:12px;background:#138bd7;color:#fff;font-size:23px;font-weight:900;cursor:pointer}
.topbar small{display:block;color:#6b8498;font-weight:800;font-size:10px;letter-spacing:.08em}
.topbar h1{margin:2px 0 0;color:var(--ink);font-size:clamp(18px,2vw,29px)}
.workspace{max-width:1180px;margin:auto;padding:24px}
.topicTabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.topicTabs button{border:1px solid #cfe0ec;background:#fff;border-radius:999px;padding:9px 13px;color:#194c70;font-weight:800;cursor:pointer}
.lessonCard{background:#fff;border:1px solid #dce9f2;border-radius:24px;padding:clamp(25px,4vw,56px);min-height:62vh;box-shadow:0 15px 42px rgba(27,74,107,.09)}
.lessonCard small{font-weight:900;color:#168edf;letter-spacing:.1em}
.lessonCard h2{font-size:clamp(32px,5vw,66px);line-height:1.02;color:#082d59;margin:13px 0}
.lessonCard p{max-width:760px;color:#5c7487;font-size:clamp(16px,1.5vw,22px);line-height:1.55}

@media (max-width:760px){
  .lessonMenu{left:5.2%;width:34%}
  .lessonBtn{grid-template-columns:23px 1fr;padding:6px 8px}
  .lessonNo{width:22px;height:22px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main class="board" id="board" aria-label="Gabi English Hub Gateway B1 interactive board">
  <img class="cover" src="gabi-board-exact-16x9.png?v=20260925-exact" alt="Gabi English Hub Gateway B1">
  <button class="homeHot" id="homeHot" aria-label="Home"></button>
  <button class="moduleHot m1" data-module="1" aria-label="A fresh start"></button>
  <button class="moduleHot m2" data-module="2" aria-label="People and relationships"></button>
  <button class="moduleHot m3" data-module="3" aria-label="Lifestyles"></button>
  <button class="moduleHot m4" data-module="4" aria-label="The world around us"></button>
  <button class="moduleHot m5" data-module="5" aria-label="Culture and communication"></button>
  <button class="moduleHot m6" data-module="6" aria-label="Getting there"></button>
  <button class="moduleHot m7" data-module="7" aria-label="Health and well-being"></button>
  <button class="moduleHot m8" data-module="8" aria-label="Science and technology"></button>
  <button class="moduleHot m9" data-module="9" aria-label="The working world"></button>
  <button class="moduleHot m10" data-module="10" aria-label="Global challenges"></button>
  <section class="lessonMenu" id="lessonMenu" aria-live="polite"></section>
</main>

<section id="lessonView" aria-hidden="true">
  <header class="topbar">
    <button class="back" id="backBtn">←</button>
    <div><small id="crumb">GATEWAY B1</small><h1 id="lessonHeading">Lesson</h1></div>
  </header>
  <div class="workspace" id="workspace"></div>
</section>

<script>
const modules=[
 {title:'A fresh start',lessons:[
   {title:'Vocabulary & Listening',note:'Life stages · family · listening'},
   {title:'Reading & Grammar',note:'Sharenting · habits · stative verbs'},
   {title:'Speaking & Review',note:'Celebrity Kids · Family Dinners · review'}]},
 {title:'People and relationships',lessons:[
   {title:'Vocabulary & Listening',note:'People · relationships · feelings'},
   {title:'Reading & Grammar',note:'Stories · past forms · used to'},
   {title:'Speaking & Review',note:'Discussion · role-play · revision'}]},
 {title:'Lifestyles',lessons:[
   {title:'Vocabulary & Listening',note:'Daily life · free time · routines'},
   {title:'Reading & Grammar',note:'Habits · quantifiers · relative clauses'},
   {title:'Speaking & Review',note:'Lifestyle choices · challenge'}]},
 {title:'The world around us',lessons:[
   {title:'Vocabulary & Listening',note:'Places · nature · geography'},
   {title:'Reading & Grammar',note:'Travel texts · present perfect'},
   {title:'Speaking & Review',note:'Places to explore · review'}]},
 {title:'Culture and communication',lessons:[
   {title:'Vocabulary & Listening',note:'Culture · media · communication'},
   {title:'Reading & Grammar',note:'Comparisons · adjectives · articles'},
   {title:'Speaking & Review',note:'Culture exchange · speaking'}]},
 {title:'Getting there',lessons:[
   {title:'Vocabulary & Listening',note:'Transport · journeys · directions'},
   {title:'Reading & Grammar',note:'Future forms · conditionals'},
   {title:'Speaking & Review',note:'Travel situations · review'}]},
 {title:'Health and well-being',lessons:[
   {title:'Vocabulary & Listening',note:'Health · body · habits'},
   {title:'Reading & Grammar',note:'Advice · obligation · present perfect'},
   {title:'Speaking & Review',note:'Healthy choices · challenge'}]},
 {title:'Science and technology',lessons:[
   {title:'Vocabulary & Listening',note:'Devices · science · innovation'},
   {title:'Reading & Grammar',note:'Technology texts · passive voice'},
   {title:'Speaking & Review',note:'Future tech · discussion'}]},
 {title:'The working world',lessons:[
   {title:'Vocabulary & Listening',note:'Jobs · skills · qualities'},
   {title:'Reading & Grammar',note:'Work texts · modals · conditionals'},
   {title:'Speaking & Review',note:'Career ideas · interview game'}]},
 {title:'Global challenges',lessons:[
   {title:'Vocabulary & Listening',note:'Environment · society · change'},
   {title:'Reading & Grammar',note:'Global issues · future forms'},
   {title:'Speaking & Review',note:'Solutions · project · review'}]}
];
const colors=['#188ee0','#4ec497','#ff9a20','#7554dd','#ff3f56','#13bac6','#ffbd08','#209ce6','#ec1490','#a6d600'];
const menu=document.getElementById('lessonMenu');
let openModule=0;

function closeMenu(){openModule=0;menu.classList.remove('open');menu.innerHTML=''}
function openMenu(n){
  if(openModule===n){closeMenu();return}
  openModule=n;
  const mod=modules[n-1],btn=document.querySelector('[data-module="'+n+'"]');
  const board=document.getElementById('board').getBoundingClientRect();
  const r=btn.getBoundingClientRect();
  const rawTop=((r.bottom-board.top)/board.height)*100;
  const top=Math.min(rawTop, n>=9?68.5:n===8?71.5:89);
  menu.style.top=top+'%';
  menu.style.setProperty('--accent',colors[n-1]);
  menu.innerHTML='<div class="menuTitle"><small>Module '+n+'</small><b>'+mod.title+'</b></div>'+
    mod.lessons.map((l,i)=>'<button class="lessonBtn" data-lesson="'+i+'"><span class="lessonNo">'+(i+1)+'</span><span><b>'+l.title+'</b><span class="note">'+l.note+'</span></span></button>').join('');
  menu.classList.add('open');
  menu.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();openLesson(n,Number(b.dataset.lesson));});
}
document.querySelectorAll('[data-module]').forEach(b=>b.onclick=(e)=>{e.stopPropagation();openMenu(Number(b.dataset.module));});
document.getElementById('homeHot').onclick=(e)=>{e.stopPropagation();closeMenu()};
document.getElementById('board').onclick=closeMenu;

function openLesson(n,i){
  closeMenu();
  if(n===1){
    location.href='gabi-life-stages.html?lesson='+(i+1)+'&v=20260925-exact-board';
    return;
  }
  const m=modules[n-1];
  document.getElementById('crumb').textContent='MODULE '+n+' · '+m.title.toUpperCase();
  document.getElementById('lessonHeading').textContent=m.lessons[i].title;
  const topics=m.lessons.map(x=>x.note);
  document.getElementById('workspace').innerHTML=
   '<nav class="topicTabs">'+topics.map((t,j)=>'<button data-topic="'+j+'">'+t+'</button>').join('')+'</nav>'+
   '<article class="lessonCard"><small>GATEWAY B1 · MODULE '+n+'</small><h2 id="topicTitle">'+m.lessons[i].title+'</h2>'+
   '<p>This module is ready for the next interactive lesson. The main Gabi hub design stays unchanged.</p></article>';
  document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>document.getElementById('topicTitle').textContent=topics[Number(b.dataset.topic)]);
  const view=document.getElementById('lessonView');
  view.classList.add('on');view.setAttribute('aria-hidden','false');
}
function closeLesson(){const v=document.getElementById('lessonView');v.classList.remove('on');v.setAttribute('aria-hidden','true')}
document.getElementById('backBtn').onclick=closeLesson;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.getElementById('lessonView').classList.contains('on')?closeLesson():closeMenu()}});
</script>
</body>
</html>
