<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Gateway to the World B1 — Gabi</title><style>:root{--navy:#073862;--cyan:#0da5b9;--blue:#167bd3;--ink:#183c55;--muted:#738997;--line:#dbe8f0;--paper:#eef6fb}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#07131f;color:var(--ink);overflow:hidden}button{font:inherit}#home{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07131f;z-index:10}.coverStage{position:relative;width:min(100vw,calc(100vh * 1672 / 941));aspect-ratio:1672/941}.coverStage img{display:block;width:100%;height:100%;object-fit:contain}.enter{position:absolute;inset:0;border:0;background:transparent;cursor:pointer}#course{position:fixed;inset:0;display:none;grid-template-columns:300px minmax(0,1fr);background:var(--paper);z-index:20}#course.on{display:grid}.sidebar{height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}.sideHead{height:62px;min-height:62px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line)}.homeBtn{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--navy);cursor:pointer;font-size:20px}.sideHead b{display:block;font-size:14px;color:var(--navy)}.sideHead span{display:block;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#8398a6;margin-top:3px}.modules{flex:1;overflow:auto;padding:9px}.module{border:1px solid var(--line);border-radius:13px;margin-bottom:7px;background:#fff;overflow:hidden}.moduleBtn{width:100%;border:0;background:#fff;display:grid;grid-template-columns:38px minmax(0,1fr) 20px;align-items:center;gap:9px;text-align:left;padding:9px;cursor:pointer}.moduleBtn:hover{background:#f5fafc}.num{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px}.name{font-size:13px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{font-size:19px;color:#7891a0;transition:.18s}.module.open .arrow{transform:rotate(90deg)}.lessons{display:none;border-top:1px solid #edf3f6;background:#fbfdfe;padding:5px}.module.open .lessons{display:block}.lessonBtn{width:100%;border:0;background:transparent;border-radius:9px;text-align:left;padding:8px 8px 8px 22px;cursor:pointer;color:#34596f;font-size:11px;line-height:1.3;position:relative}.lessonBtn:before{content:"";position:absolute;left:9px;top:13px;width:6px;height:6px;border-radius:50%;background:#19a4b6}.lessonBtn:hover{background:#eaf6fb}.lessonBtn.active{background:linear-gradient(135deg,#dff5f8,#e6f1ff);color:var(--navy);font-weight:800}.main{height:100vh;display:flex;flex-direction:column;overflow:hidden}.top{height:62px;min-height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px}.top small{display:block;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#1097aa;font-weight:900}.top h1{margin:3px 0 0;font-size:18px;color:var(--navy)}.workspace{flex:1;padding:18px;overflow:auto}.lessonPage{display:none;min-height:calc(100vh - 98px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 10px 28px rgba(17,63,94,.08)}.lessonPage.on{display:block}.unitLine{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#0d98ab;font-weight:900}.lessonPage h2{margin:8px 0 0;color:var(--navy);font-size:32px;line-height:1.05}.blank{min-height:calc(100vh - 210px)}@media(max-width:760px){#course.on{grid-template-columns:235px minmax(0,1fr)}.sideHead b{font-size:12px}.lessonPage h2{font-size:25px}}</style></head><body><section id="home"><div class="coverStage"><img id="coverImg" src="course-cover.jpg?v=b3dbd2cf601a865551fdea466795003064b8c0a4" alt="Gateway and Future Discovery"><button class="enter" onclick="openCourse()" aria-label="Open course"></button></div></section><section id="course"><aside class="sidebar"><div class="sideHead"><button class="homeBtn" onclick="goHome()">⌂</button><div><b>Gateway to the World B1</b><span>Gabi</span></div></div><nav class="modules" id="modules"></nav></aside><main class="main"><header class="top"><div><small id="crumb">Gateway to the World B1</small><h1 id="title">Choose a module</h1></div></header><div class="workspace"><article class="lessonPage" id="lessonPage"><div class="unitLine" id="unitLine"></div><h2 id="lessonTitle"></h2><div class="blank"></div></article></div></main></section><script>const data=[{n:1,t:'Happy families',l:['Ages and stages of life','The family','Words connected with the family','Noun suffixes -ment, -ion, -ence','Present simple and present continuous','State and action verbs','Articles','Culture exchange: Family dinners','Sharing images on social media','Arguments between teenagers and parents']},{n:2,t:'Law and order',l:['Crimes','Detective work','Phrasal verbs connected with investigating and finding','Past simple','Past continuous','Used to','Surprising true crimes','An actor involved in a crime']},{n:3,t:'Plurilingual',l:['Languages, countries and nationalities','Learning languages','Negative prefixes un-, in-, im-, ir-, il-','Countable and uncountable nouns','Quantifiers','Defining and non-defining relative clauses','Culture exchange: International English','English: The language that never sleeps','Toki Pona: an artificial language']},{n:4,t:'Take care!',l:['Parts of the body','Health problems','Compound nouns connected with health and healthcare','Present perfect with ever, never, for, since','Present perfect with just, yet, already','Is technology bad for your health?','BASE jumping']},{n:5,t:'Screen time',l:['TV programmes and series','Words connected with TV and online video','Adjectives describing TV programmes','Adjectives ending in -ing and -ed','Comparatives and superlatives','so and such','too and (not) enough','Culture exchange: TV in the UK','Reality TV','Binge-watching']},{n:6,t:'Changing climates',l:['Geographical features','The environment','Different uses of get','will, be going to and present continuous for future','will, may, might','Zero conditional','First conditional','Understanding climate change','Plogging']},{n:7,t:'Get to the top!',l:['Jobs and words connected with work','Personal qualities','Compound adjectives','Modal verbs of obligation, prohibition and advice','Second conditional','unless','Alan Geaam, chef and Ami Vitale, photographer','Unusual jobs']},{n:8,t:'Friendly advice',l:['Feelings','Friendships','Noun suffixes -ness, -ship, -dom','Culture exchange: Positive messages','Past perfect','Gerunds and infinitives','My best friend is a robot','Friendship']},{n:9,t:'Facts about fiction',l:['Things we read','Genres','Book reviews','Phrasal verbs connected with reading and writing','Reported speech – statements','Reported speech – questions','Culture exchange: Three great British writers','Books on the move','Using a pen name']},{n:10,t:'Computer update',l:['Computers and accessories','Using a computer and the Internet','Collocations with email and document','The passive – present simple','The passive – other tenses','have something done','Culture exchange: The Science Museum, London','Switching off the Internet','The Museum of Failure']}];let openUnit=null,active='';function openCourse(){document.getElementById('home').style.display='none';document.getElementById('course').classList.add('on');render()}function goHome(){document.getElementById('course').classList.remove('on');document.getElementById('home').style.display='flex'}function toggle(n){openUnit=openUnit===n?null:n;render()}function render(){modules.innerHTML=data.map(u=>`<div class="module ${openUnit===u.n?'open':''}"><button class="moduleBtn" onclick="toggle(${u.n})"><span class="num">${u.n}</span><span class="name">${u.t}</span><span class="arrow">›</span></button><div class="lessons">${u.l.map((x,i)=>`<button class="lessonBtn ${active===u.n+'-'+i?'active':''}" onclick="openLesson(${u.n},${i})">${x}</button>`).join('')}</div></div>`).join('')}function openLesson(n,i){const u=data.find(x=>x.n===n);active=n+'-'+i;openUnit=n;render();crumb.textContent='UNIT '+n+' — '+u.t;title.textContent=u.l[i];unitLine.textContent='UNIT '+n+' — '+u.t;lessonTitle.textContent=u.l[i];lessonPage.classList.add('on')}</script></body></html>
