<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gateway to the Future — Gabi</title>
<style>
:root{--navy:#073862;--cyan:#0da5b9;--blue:#167bd3;--ink:#183c55;--muted:#738997;--line:#dbe8f0;--paper:#eef6fb;--warm:#f5b544;--mint:#dff6ef}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#eaf6fb;color:var(--ink);overflow:hidden}button{font:inherit}
#home{position:fixed;inset:0;display:grid;grid-template-columns:260px minmax(0,1fr);gap:8px;padding:8px;background:linear-gradient(135deg,#dff5fb 0%,#f9fdff 46%,#e8f7ef 100%)}
.sidebar{min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.95);border-radius:18px;box-shadow:0 10px 26px rgba(18,70,96,.10)}
.sideHead{padding:11px 10px 9px;border-bottom:1px solid var(--line)}.sideHead b{display:block;font-size:15px;color:var(--navy);line-height:1.05}.sideHead span{display:block;font-size:8px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#6791a4;margin-top:5px}
.modules{flex:1;overflow:auto;padding:5px}.module{border:1px solid var(--line);border-radius:10px;margin-bottom:5px;background:#fff;overflow:hidden}.moduleBtn{width:100%;border:0;background:#fff;display:grid;grid-template-columns:26px minmax(0,1fr) 14px;align-items:center;gap:5px;text-align:left;padding:5px;cursor:pointer}.moduleBtn:hover{background:#f5fafc}.num{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#fff;display:grid;place-items:center;font-weight:900;font-size:9px}.name b{display:block;color:var(--navy);font-size:13px}.name span{display:block;color:#7891a0;font-size:11px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{font-size:15px;color:#7891a0;transition:.18s}.module.open .arrow{transform:rotate(90deg)}
.lessons{display:none;border-top:1px solid #edf3f6;background:#fbfdfe;padding:3px}.module.open .lessons{display:block}.lessonBtn{width:100%;border:0;background:transparent;border-radius:7px;text-align:left;padding:6px 4px 6px 14px;cursor:pointer;color:#34596f;font-size:11px;line-height:1.25;position:relative}.lessonBtn:before{content:"";position:absolute;left:5px;top:9px;width:4px;height:4px;border-radius:50%;background:#19a4b6}.lessonBtn:hover{background:#eaf6fb}.lessonBtn strong{color:var(--navy);margin-right:2px}
.coverShell{position:relative;min-width:0;height:100%;overflow:hidden;border-radius:22px;background:linear-gradient(180deg,#d9f2fb,#f8fdff 62%,#e7f6ef);box-shadow:0 14px 36px rgba(18,70,96,.14);border:1px solid rgba(255,255,255,.9);display:grid;place-items:center}.coverStage{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}.coverStage img{display:block;width:100%;height:100%;object-fit:cover;object-position:center}
#lessonView{position:fixed;inset:0;display:none;background:var(--paper);z-index:30}.lessonViewOn{display:flex!important;flex-direction:column}.lessonTop{height:58px;min-height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px}.backBtn{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--navy);font-size:21px;cursor:pointer}.lessonTop small{display:block;font-size:8px;letter-spacing:.13em;text-transform:uppercase;color:#1097aa;font-weight:900}.lessonTop h1{margin:2px 0 0;font-size:17px;color:var(--navy)}.lessonWorkspace{flex:1;padding:0;overflow:auto}.lessonPage{min-height:calc(100vh - 58px);background:#fff;padding:24px}.unitLine{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#0d98ab;font-weight:900}.lessonPage h2{margin:8px 0 0;color:var(--navy);font-size:34px;line-height:1.05}.blank{min-height:calc(100vh - 170px)}.lessonFrame{display:block;width:100%;height:calc(100vh - 58px);border:0;background:#fff}
@media(max-width:820px){#home{grid-template-columns:210px minmax(0,1fr);gap:5px;padding:5px}.sideHead{padding:8px}.sideHead b{font-size:14px}.moduleBtn{grid-template-columns:24px minmax(0,1fr) 13px;padding:4px}.num{width:22px;height:22px}.lessonBtn{font-size:10px;padding:5px 4px 5px 13px}.coverShell{border-radius:16px}.lessonPage h2{font-size:26px}}
</style>
</head>
<body>
<section id="home">
  <aside class="sidebar">
    <div class="sideHead"><b>Gabi English Hub</b><span>Interactive course</span></div>
    <nav class="modules" id="modules"></nav>
  </aside>
  <div class="coverShell"><div class="coverStage"><img src="gabi-cover-final.webp?v=20260908-2328" fetchpriority="high" alt="Gateway to the Future — Interactive English Course"></div></div>
</section>
<section id="lessonView">
  <header class="lessonTop"><button class="backBtn" onclick="closeLesson()">←</button><div><small id="crumb">Gateway to the World B1</small><h1 id="topTitle">Lesson</h1></div></header>
  <div class="lessonWorkspace" id="lessonWorkspace"><article class="lessonPage"><div class="unitLine" id="unitLine"></div><h2 id="lessonTitle"></h2><div class="blank"></div></article></div>
</section>
<script>
const data=[
{n:1,t:'Happy families',l:['Ages and stages of life','The family','Words connected with the family','Noun suffixes -ment, -ion, -ence','Present simple and present continuous','State and action verbs','Articles','Culture exchange: Family dinners','Sharing images on social media','Arguments between teenagers and parents']},
{n:2,t:'Law and order',l:['Crimes','Detective work','Phrasal verbs connected with investigating and finding','Past simple','Past continuous','Used to','Surprising true crimes','An actor involved in a crime']},
{n:3,t:'Plurilingual',l:['Languages, countries and nationalities','Learning languages','Negative prefixes un-, in-, im-, ir-, il-','Countable and uncountable nouns','Quantifiers','Defining and non-defining relative clauses','Culture exchange: International English','English: The language that never sleeps','Toki Pona: an artificial language']},
{n:4,t:'Take care!',l:['Parts of the body','Health problems','Compound nouns connected with health and healthcare','Present perfect with ever, never, for, since','Present perfect with just, yet, already','Is technology bad for your health?','BASE jumping']},
{n:5,t:'Screen time',l:['TV programmes and series','Words connected with TV and online video','Adjectives describing TV programmes','Adjectives ending in -ing and -ed','Comparatives and superlatives','so and such','too and (not) enough','Culture exchange: TV in the UK','Reality TV','Binge-watching']},
{n:6,t:'Changing climates',l:['Geographical features','The environment','Different uses of get','will, be going to and present continuous for future','will, may, might','Zero conditional','First conditional','Understanding climate change','Plogging']},
{n:7,t:'Get to the top!',l:['Jobs and words connected with work','Personal qualities','Compound adjectives','Modal verbs of obligation, prohibition and advice','Second conditional','unless','Alan Geaam, chef and Ami Vitale, photographer','Unusual jobs']},
{n:8,t:'Friendly advice',l:['Feelings','Friendships','Noun suffixes -ness, -ship, -dom','Culture exchange: Positive messages','Past perfect','Gerunds and infinitives','My best friend is a robot','Friendship']},
{n:9,t:'Facts about fiction',l:['Things we read','Genres','Book reviews','Phrasal verbs connected with reading and writing','Reported speech – statements','Reported speech – questions','Culture exchange: Three great British writers','Books on the move','Using a pen name']},
{n:10,t:'Computer update',l:['Computers and accessories','Using a computer and the Internet','Collocations with email and document','The passive – present simple','The passive – other tenses','have something done','Culture exchange: The Science Museum, London','Switching off the Internet','The Museum of Failure']}
];
let openUnit=null;
function render(){document.getElementById('modules').innerHTML=data.map(u=>`<div class="module ${openUnit===u.n?'open':''}"><button class="moduleBtn" onclick="toggle(${u.n})"><span class="num">${u.n}</span><span class="name"><b>Module ${u.n}</b><span>${u.t}</span></span><span class="arrow">›</span></button><div class="lessons">${u.l.map((x,i)=>`<button class="lessonBtn" onclick="openLesson(${u.n},${i})"><strong>Lesson ${i+1}</strong> ${x}</button>`).join('')}</div></div>`).join('')}
function toggle(n){openUnit=openUnit===n?null:n;render()}
function openLesson(n,i){const u=data.find(x=>x.n===n);document.getElementById('crumb').textContent='MODULE '+n+' — '+u.t;document.getElementById('topTitle').textContent='Lesson '+(i+1)+' · '+u.l[i];const ws=document.getElementById('lessonWorkspace');if(n===1&&i===0){ws.style.overflow='hidden';ws.innerHTML='<iframe class="lessonFrame" src="stages-of-life.html?v=20260909-0907" title="Ages and Stages of Life interactive lesson"></iframe>'}else{ws.style.overflow='auto';ws.innerHTML='<article class="lessonPage"><div class="unitLine">MODULE '+n+' — '+u.t+'</div><h2>Lesson '+(i+1)+' · '+u.l[i]+'</h2><div class="blank"></div></article>'}document.getElementById('lessonView').classList.add('lessonViewOn')}
function closeLesson(){document.getElementById('lessonView').classList.remove('lessonViewOn')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeLesson()});
render();
</script>
</body>
</html>
