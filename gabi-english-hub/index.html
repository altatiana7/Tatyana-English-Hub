<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gateway to the Future — Gabi</title>
<style>
:root{--navy:#073862;--cyan:#0da5b9;--blue:#167bd3;--ink:#183c55;--muted:#738997;--line:#dbe8f0;--paper:#eef6fb;--warm:#f5b544;--mint:#dff6ef}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#eaf6fb;color:var(--ink);overflow:hidden}
button{font:inherit}
#home{position:fixed;inset:0;display:grid;grid-template-columns:clamp(150px,12vw,205px) minmax(0,1fr) clamp(150px,12vw,205px);gap:12px;padding:12px;background:linear-gradient(135deg,#dff5fb 0%,#f9fdff 46%,#e8f7ef 100%);z-index:10}
.sideRail{min-width:0;height:100%;display:flex;flex-direction:column;gap:10px}
.railHead{min-height:82px;border-radius:22px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 26px rgba(18,70,96,.10);display:flex;flex-direction:column;justify-content:center;padding:14px 16px}
.railHead b{font-size:18px;color:var(--navy);line-height:1.05}.railHead span{font-size:10px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#6791a4;margin-top:7px}
.railBtn{flex:1;min-height:0;border:1px solid rgba(255,255,255,.92);border-radius:20px;background:rgba(255,255,255,.92);box-shadow:0 8px 22px rgba(18,70,96,.09);cursor:pointer;color:var(--navy);font-weight:950;font-size:clamp(15px,1.15vw,20px);letter-spacing:.01em;padding:12px 10px;transition:.18s transform,.18s box-shadow,.18s background;display:grid;place-items:center;text-align:center}
.railBtn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(18,70,96,.15);background:#fff}.railBtn:focus-visible{outline:4px solid var(--warm);outline-offset:2px}
.leftRail .railBtn:nth-of-type(1){background:linear-gradient(135deg,#ffffff,#e4f8f6)}.leftRail .railBtn:nth-of-type(2){background:linear-gradient(135deg,#e9fbf5,#ffffff)}.leftRail .railBtn:nth-of-type(3){background:linear-gradient(135deg,#eef5ff,#ffffff)}.leftRail .railBtn:nth-of-type(4){background:linear-gradient(135deg,#fff7df,#ffffff)}
.rightRail .railBtn:nth-of-type(1){background:linear-gradient(135deg,#fff1e4,#ffffff)}.rightRail .railBtn:nth-of-type(2){background:linear-gradient(135deg,#eaf6ff,#ffffff)}.rightRail .railBtn:nth-of-type(3){background:linear-gradient(135deg,#eefbea,#ffffff)}.rightRail .railBtn:nth-of-type(4){background:linear-gradient(135deg,#f3edff,#ffffff)}
.coverShell{position:relative;min-width:0;height:100%;overflow:hidden;border-radius:26px;background:linear-gradient(180deg,#d9f2fb,#f8fdff 62%,#e7f6ef);box-shadow:0 14px 36px rgba(18,70,96,.14);border:1px solid rgba(255,255,255,.9);display:grid;place-items:center}
.coverStage{position:relative;width:100%;height:100%;display:grid;place-items:center;overflow:hidden}.coverStage img{display:block;width:100%;height:100%;object-fit:contain}
.coverCaption{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);pointer-events:none;background:rgba(255,255,255,.84);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.94);border-radius:999px;padding:8px 16px;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);box-shadow:0 8px 22px rgba(18,70,96,.10);white-space:nowrap}
#course{position:fixed;inset:0;display:none;grid-template-columns:300px minmax(0,1fr);background:var(--paper);z-index:20}#course.on{display:grid}
.sidebar{height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}.sideHead{height:62px;min-height:62px;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line)}.homeBtn{width:38px;height:38px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--navy);cursor:pointer;font-size:20px}.sideHead b{display:block;font-size:14px;color:var(--navy)}.sideHead span{display:block;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#8398a6;margin-top:3px}.modules{flex:1;overflow:auto;padding:9px}.module{border:1px solid var(--line);border-radius:13px;margin-bottom:7px;background:#fff;overflow:hidden}.moduleBtn{width:100%;border:0;background:#fff;display:grid;grid-template-columns:38px minmax(0,1fr) 20px;align-items:center;gap:9px;text-align:left;padding:9px;cursor:pointer}.moduleBtn:hover{background:#f5fafc}.num{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--cyan),var(--blue));color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px}.name{font-size:13px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.arrow{font-size:19px;color:#7891a0;transition:.18s}.module.open .arrow{transform:rotate(90deg)}.lessons{display:none;border-top:1px solid #edf3f6;background:#fbfdfe;padding:5px}.module.open .lessons{display:block}.lessonBtn{width:100%;border:0;background:transparent;border-radius:9px;text-align:left;padding:8px 8px 8px 22px;cursor:pointer;color:#34596f;font-size:11px;line-height:1.3;position:relative}.lessonBtn:before{content:"";position:absolute;left:9px;top:13px;width:6px;height:6px;border-radius:50%;background:#19a4b6}.lessonBtn:hover{background:#eaf6fb}.lessonBtn.active{background:linear-gradient(135deg,#dff5f8,#e6f1ff);color:var(--navy);font-weight:800}.main{height:100vh;display:flex;flex-direction:column;overflow:hidden}.top{height:62px;min-height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 20px}.top small{display:block;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#1097aa;font-weight:900}.top h1{margin:3px 0 0;font-size:18px;color:var(--navy)}.workspace{flex:1;padding:18px;overflow:auto}.lessonPage{display:none;min-height:calc(100vh - 98px);background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 10px 28px rgba(17,63,94,.08)}.lessonPage.on{display:block}.unitLine{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:#0d98ab;font-weight:900}.lessonPage h2{margin:8px 0 0;color:var(--navy);font-size:32px;line-height:1.05}.blank{min-height:calc(100vh - 210px)}
@media(max-width:1100px){#home{grid-template-columns:135px minmax(0,1fr) 135px;gap:8px;padding:8px}.railHead{min-height:68px;padding:10px 12px}.railHead b{font-size:15px}.railBtn{border-radius:16px;font-size:14px}.coverShell{border-radius:20px}}
@media(max-width:760px){#home{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr) auto;padding:6px}.sideRail{height:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.railHead{display:none}.railBtn{min-height:46px;padding:7px 4px;font-size:11px;border-radius:12px}.leftRail{grid-row:1}.coverShell{grid-row:2;border-radius:16px}.rightRail{grid-row:3}#course.on{grid-template-columns:235px minmax(0,1fr)}.sideHead b{font-size:12px}.lessonPage h2{font-size:25px}.coverCaption{display:none}}
</style>
</head>
<body>
<section id="home">
  <aside class="sideRail leftRail">
    <div class="railHead"><b>Gabi English Hub</b><span>Interactive course</span></div>
    <button class="railBtn" onclick="openSection('Home')">Home</button>
    <button class="railBtn" onclick="openSection('Vocabulary')">Vocabulary</button>
    <button class="railBtn" onclick="openSection('Grammar')">Grammar</button>
    <button class="railBtn" onclick="openSection('Reading')">Reading</button>
  </aside>
  <div class="coverShell">
    <div class="coverStage"><img id="coverImg" src="gateway-future-cover.png" width="1672" height="941" fetchpriority="high" alt="Gateway to the Future — Interactive English Course"></div>
    <div class="coverCaption">Choose a section on the sides</div>
  </div>
  <aside class="sideRail rightRail">
    <div class="railHead"><b>Gateway B1</b><span>Explore · learn · create</span></div>
    <button class="railBtn" onclick="openSection('Speaking')">Speaking</button>
    <button class="railBtn" onclick="openSection('Projects')">Projects</button>
    <button class="railBtn" onclick="openSection('Progress')">Progress</button>
    <button class="railBtn" onclick="openSection('Games')">Games</button>
  </aside>
</section>
<section id="course"><aside class="sidebar"><div class="sideHead"><button class="homeBtn" onclick="goHome()">⌂</button><div><b>Gateway to the World B1</b><span>Gabi</span></div></div><nav class="modules" id="modules"></nav></aside><main class="main"><header class="top"><div><small id="crumb">Gateway to the World B1</small><h1 id="title">Choose a module</h1></div></header><div class="workspace"><article class="lessonPage" id="lessonPage"><div class="unitLine" id="unitLine"></div><h2 id="lessonTitle"></h2><div class="blank"></div></article></div></main></section>
<script>
const data=[{n:1,t:'Happy families',l:['Ages and stages of life','The family','Words connected with the family','Noun suffixes -ment, -ion, -ence','Present simple and present continuous','State and action verbs','Articles','Culture exchange: Family dinners','Sharing images on social media','Arguments between teenagers and parents']},{n:2,t:'Law and order',l:['Crimes','Detective work','Phrasal verbs connected with investigating and finding','Past simple','Past continuous','Used to','Surprising true crimes','An actor involved in a crime']},{n:3,t:'Plurilingual',l:['Languages, countries and nationalities','Learning languages','Negative prefixes un-, in-, im-, ir-, il-','Countable and uncountable nouns','Quantifiers','Defining and non-defining relative clauses','Culture exchange: International English','English: The language that never sleeps','Toki Pona: an artificial language']},{n:4,t:'Take care!',l:['Parts of the body','Health problems','Compound nouns connected with health and healthcare','Present perfect with ever, never, for, since','Present perfect with just, yet, already','Is technology bad for your health?','BASE jumping']},{n:5,t:'Screen time',l:['TV programmes and series','Words connected with TV and online video','Adjectives describing TV programmes','Adjectives ending in -ing and -ed','Comparatives and superlatives','so and such','too and (not) enough','Culture exchange: TV in the UK','Reality TV','Binge-watching']},{n:6,t:'Changing climates',l:['Geographical features','The environment','Different uses of get','will, be going to and present continuous for future','will, may, might','Zero conditional','First conditional','Understanding climate change','Plogging']},{n:7,t:'Get to the top!',l:['Jobs and words connected with work','Personal qualities','Compound adjectives','Modal verbs of obligation, prohibition and advice','Second conditional','unless','Alan Geaam, chef and Ami Vitale, photographer','Unusual jobs']},{n:8,t:'Friendly advice',l:['Feelings','Friendships','Noun suffixes -ness, -ship, -dom','Culture exchange: Positive messages','Past perfect','Gerunds and infinitives','My best friend is a robot','Friendship']},{n:9,t:'Facts about fiction',l:['Things we read','Genres','Book reviews','Phrasal verbs connected with reading and writing','Reported speech – statements','Reported speech – questions','Culture exchange: Three great British writers','Books on the move','Using a pen name']},{n:10,t:'Computer update',l:['Computers and accessories','Using a computer and the Internet','Collocations with email and document','The passive – present simple','The passive – other tenses','have something done','Culture exchange: The Science Museum, London','Switching off the Internet','The Museum of Failure']}];
let openUnit=null,active='',section='Home';
function openCourse(){document.getElementById('home').style.display='none';document.getElementById('course').classList.add('on');render()}
function goHome(){document.getElementById('course').classList.remove('on');document.getElementById('home').style.display='grid'}
function toggle(n){openUnit=openUnit===n?null:n;render()}
function renderAllModules(){document.getElementById('modules').innerHTML=data.map(u=>`<div class="module ${openUnit===u.n?'open':''}"><button class="moduleBtn" onclick="toggle(${u.n})"><span class="num">${u.n}</span><span class="name">${u.t}</span><span class="arrow">›</span></button><div class="lessons">${u.l.map((x,i)=>`<button class="lessonBtn ${active===u.n+'-'+i?'active':''}" onclick="openLesson(${u.n},${i})">${x}</button>`).join('')}</div></div>`).join('')}
function openLesson(n,i){const u=data.find(x=>x.n===n);active=n+'-'+i;openUnit=n;render();document.getElementById('crumb').textContent='UNIT '+n+' — '+u.t;document.getElementById('title').textContent=u.l[i];document.getElementById('unitLine').textContent='UNIT '+n+' — '+u.t;document.getElementById('lessonTitle').textContent=u.l[i];document.getElementById('lessonPage').classList.add('on')}
const groups={1:{Vocabulary:[0,1,2,3],Grammar:[4,5,6],Reading:[7,8,9],Speaking:[7,8,9]},2:{Vocabulary:[0,1,2],Grammar:[3,4,5],Reading:[6,7]},3:{Vocabulary:[0,1,2],Grammar:[3,4,5],Reading:[6,7,8]},4:{Vocabulary:[0,1,2],Grammar:[3,4],Reading:[5,6]},5:{Vocabulary:[0,1,2,3],Grammar:[4,5,6],Reading:[7,8,9]},6:{Vocabulary:[0,1,2],Grammar:[3,4,5,6],Reading:[7,8]},7:{Vocabulary:[0,1,2],Grammar:[3,4,5],Reading:[6,7]},8:{Vocabulary:[0,1,2],Grammar:[4,5],Reading:[3,6,7]},9:{Vocabulary:[0,1,2,3],Grammar:[4,5],Reading:[6,7,8]},10:{Vocabulary:[0,1,2],Grammar:[3,4,5],Reading:[6,7,8]}};
function openSection(name){section=name;openUnit=null;active='';openCourse();document.getElementById('crumb').textContent='Gateway to the Future';document.getElementById('title').textContent=name==='Home'?'Course modules':name;document.getElementById('unitLine').textContent='GATEWAY TO THE WORLD B1';document.getElementById('lessonTitle').textContent=name==='Home'?'Choose a module':name;document.getElementById('lessonPage').classList.add('on')}
function render(){if(section==='Home'){renderAllModules();return}document.getElementById('modules').innerHTML=data.map(u=>{const indices=groups[u.n][section]||[];if(!indices.length)return '';return `<div class="module ${openUnit===u.n?'open':''}"><button class="moduleBtn" onclick="toggle(${u.n})"><span class="num">${u.n}</span><span class="name">${u.t}</span><span class="arrow">›</span></button><div class="lessons">${indices.map(i=>`<button class="lessonBtn ${active===u.n+'-'+i?'active':''}" onclick="openLesson(${u.n},${i})">${u.l[i]}</button>`).join('')}</div></div>`}).join('')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')goHome()});
</script>
</body>
</html>
