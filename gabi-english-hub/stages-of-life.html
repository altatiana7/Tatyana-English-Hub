\/script>`;html=html.replace('</head>',injection+'</head>');const frame=document.getElementById('lesson');frame.srcdoc=html;frame.onload=()=>{document.getElementById('loading').style.display='none'}}).catch(err=>{document.getElementById('loading').innerHTML='<div class="err"><b>Ages and Stages of Life</b><br><br>The lesson could not load. Refresh the page once.<br><small>'+String(err)+'</small></div>'});</script></body></html>
