<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gabi — Ages and Stages of Life</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef8fb;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#lesson{display:block;width:100%;height:100%;border:0;background:#fff}
#loading{position:fixed;inset:0;display:grid;place-items:center;color:#0b3767;font-weight:900;background:linear-gradient(135deg,#def5fb,#fff,#e9f7ef)}
.err{max-width:680px;padding:28px;border-radius:20px;background:#fff;border:1px solid #d8e7ee;box-shadow:0 14px 34px #123f5f1b;text-align:center}
</style>
</head>
<body>
<div id="loading"><div class="err">Loading Ages and Stages of Life…</div></div>
<iframe id="lesson" title="Ages and Stages of Life interactive lesson"></iframe>
<script>
const CORE='https://raw.githubusercontent.com/altatiana7/Tatyana-English-Hub/b378149f6c37c3bdcae90f53822d89ed7717aba0/gabi-english-hub/stages-of-life.html';
const replacements=[
 ['https://unsplash.com/photos/NfE2M4Z9rME/download?force=true&w=500','https://images.unsplash.com/photo-1773243086679-20c427d28092?auto=format&fit=crop&w=700&q=82'],
 ['https://unsplash.com/photos/CaSKjf1vwyU/download?force=true&w=500','https://images.unsplash.com/flagged/photo-1557749846-14320a49d3ed?auto=format&fit=crop&w=700&q=82'],
 ['https://unsplash.com/photos/7C5z5c22oRs/download?force=true&w=500','https://images.unsplash.com/photo-1706307121034-81829ec35a0d?auto=format&fit=crop&w=700&q=82'],
 ['https://unsplash.com/photos/pWkaNdkXE4A/download?force=true&w=500','https://images.unsplash.com/photo-1773243906497-4ae3be34ab7d?auto=format&fit=crop&w=700&q=82'],
 ['https://unsplash.com/photos/1sAsSVGhpIM/download?force=true&w=500','https://images.unsplash.com/photo-1749222192847-de0f25674a4a?auto=format&fit=crop&w=700&q=82'],
 ['https://unsplash.com/photos/LHotCeR8Ap0/download?force=true&w=500','https://images.unsplash.com/photo-1779497056366-49a5bc7aaf00?auto=format&fit=crop&w=700&q=82'],
 ['https://unsplash.com/photos/vNtw0KqCLSo/download?force=true&w=500','https://images.unsplash.com/photo-1774437790863-88a80bca5b29?auto=format&fit=crop&w=700&q=82'],
 ['https://unsplash.com/photos/rkSoP8iZVBY/download?force=true&w=500','https://images.unsplash.com/photo-1759765468070-120cdc180be8?auto=format&fit=crop&w=700&q=82']
];
fetch(CORE,{cache:'no-store'})
 .then(r=>{if(!r.ok)throw new Error('core '+r.status);return r.text()})
 .then(html=>{
   replacements.forEach(([oldUrl,newUrl])=>{html=html.split(oldUrl).join(newUrl)});
   html=html.replace('</head>','<style>.person img{background:#eaf2f5}.person img:not([src]){visibility:hidden}</style></head>');
   const frame=document.getElementById('lesson');
   frame.srcdoc=html;
   frame.onload=()=>{document.getElementById('loading').style.display='none'};
 })
 .catch(err=>{
   document.getElementById('loading').innerHTML='<div class="err"><b>Ages and Stages of Life</b><br><br>The lesson could not load. Refresh the page once.<br><small>'+String(err)+'</small></div>';
 });
</script>
</body>
</html>
