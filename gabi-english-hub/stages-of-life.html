  const listeningQuestions = [
    {q:'Who is two years old?',a:['Ben','Max','Jake','Tom'],correct:1,why:'Max is two and has just started walking confidently.'},

    {topic:'Vocabulary',q:'A two-year-old child who has started walking is a…',a:['teenager','toddler','young adult','senior'],c:1,e:'Toddler is the life-stage word for a very young child learning to walk.'},

    {topic:'Present tenses',q:'Choose the correct sentence about a regular habit.',a:['Max is loving cupboards.','Grandpa Tom goes fishing.','Ben is knowing the answer.','Jake study engineering now.'],c:1,e:'Present Simple describes Grandpa Tom’s regular activity.'},
    {topic:'Present tenses',q:'Choose the correct sentence about a current temporary situation.',a:['Jake studies engineering this year.','Jake is studying engineering at university.','Jake knowing how to cook.','Jake study with friends.'],c:1,e:'Present Continuous highlights his current course of study.'},

    {topic:'Articles',q:'Complete: Jake is studying engineering ___ university.',a:['at','at the','in a','on'],c:0,e:'The fixed expression is “at university”.'},
    {topic:'Articles',q:'Complete: He lives in ___ flat with two friends.',a:['a','an','the','—'],c:0,e:'Use “a” when the flat is mentioned for the first time.'},
    {topic:'Sharenting',q:'What is a sensible concern about sharing children’s photos online?',a:['privacy','retirement','graduation','engineering'],c:0,e:'Privacy is the key concern in the sharenting topic.'},
    {topic:'Family',q:'Your uncle’s son is your…',a:['brother','nephew','cousin','grandson'],c:2,e:'Your aunt’s or uncle’s child is your cousin.'},
    {topic:'Expression',q:'Choose the best meaning of “a new challenge”.',a:['a repeated routine','a difficult but motivating new goal','a life stage','a family argument'],c:1,e:'A new challenge is a new goal or situation that requires effort.'},
    {topic:'Grammar',q:'Choose the correct contrast.',a:['Ben thinks about his future, but he does not know his future job yet.','Ben is thinking about his future, but he is not knowing his future job yet.','Ben think about future and not knows.','Ben thinking and knows not.'],c:0,e:'Think as an opinion and know as a state take Present Simple here.'},
    {topic:'Lesson review',q:'Which sentence best summarises the whole lesson?',a:['Only teenagers face problems.','Every life stage has advantages and challenges.','Adults always have everything planned.','Independence means living alone.'],c:1,e:'The lesson compares changing responsibilities, freedom and challenges across life stages.'}
  ];

  function addTheme(doc){
    if(doc.getElementById('ben-theme-20260923')) return;
    const style=doc.createElement('style');
    style.id='ben-theme-20260923';
    style.textContent=THEME_CSS;
    doc.head.appendChild(style);
  }

  function button(text, cls=''){
    const b=document.createElement('button'); b.type='button'; b.textContent=text; if(cls)b.className=cls; return b;
  }

  function listeningMarkup(){
    return `
      <div class="benListenPage" data-ben-upgraded="true">
        <div class="benListenHead">
          <div><h1>Listening Lab · Ben’s Family</h1><p>Listen to Ben describe five people at different stages of life. Complete the tasks without reading the transcript.</p></div>
          <span class="benBadge">B1+ · 5 people · 1:09</span>
        </div>
        <div class="benListenGrid">
          <section class="benPanel">
            <div class="benAudioBar"><div><strong>Teenage Life</strong><span>Ben, Max, Jake, Dad and Grandpa Tom</span></div><audio controls preload="metadata" src="assets/teenage-life.mp3?v=${VERSION}"></audio></div>
            <div class="benPeople">
              <div class="benPerson"><b>Max · 2</b><span>toddler</span></div>
              <div class="benPerson"><b>Ben · 15</b><span>teenager</span></div>

              <div class="benPerson"><b>Dad · 46</b><span>middle-aged adult</span></div>

            </div>
            <nav class="benTaskTabs">
              <button type="button" class="on" data-ben-tab="match">1 · Match</button>
              <button type="button" data-ben-tab="details">2 · Details</button>
              <button type="button" data-ben-tab="tf">3 · True / False</button>
              <button type="button" data-ben-tab="message">4 · Main message</button>
            </nav>
            <div class="benTask on" data-ben-pane="match">
              <h2>Match each person to the correct description</h2><p class="benTaskHint">Select one description for every person.</p>
              <div class="benRows" data-task="match">
                ${[
                  ['Max','has just started walking and follows Ben around the house'],
                  ['Ben','is interested in computers and design but has not chosen a career'],
                  ['Jake','studies engineering and shares a flat with two friends'],
                  ['Dad','recently changed jobs because he wanted a new challenge'],
                  ['Grandpa Tom','is retired and now has time for fishing and cycling']
                ].map(([n,a],i)=>`<div class="benRow"><b>${n}</b><select data-answer="${i}"><option value="">Choose…</option>${[
                  'is retired and now has time for fishing and cycling',
                  'studies engineering and shares a flat with two friends',
                  'has just started walking and follows Ben around the house',
                  'recently changed jobs because he wanted a new challenge',
                  'is interested in computers and design but has not chosen a career'
                ].map(x=>`<option value="${x}" ${x===a?'data-correct="1"':''}>${x}</option>`).join('')}</select></div>`).join('')}
              </div><div class="benCheckRow"><button class="benCheck" data-check="match">Check</button><button class="benReset" data-reset="match">Reset</button><span class="benResult"></span></div>
            </div>
            <div class="benTask" data-ben-pane="details">
              <h2>Choose the detail you hear</h2><p class="benTaskHint">One answer is correct in each row.</p>
              <div class="benMC" data-task="details">
                ${[
                  ['What does Max love doing?',['Reading books','Opening cupboards','Riding a bike'],1],
                  ['What are Ben’s parents asking about?',['University','A new flat','A driving test'],0],
                  ['What does Jake sometimes miss?',['His old school','Living at home','Fishing with Tom'],1],
                  ['What surprised Ben about adults?',['They dislike work','They do not have everything planned','They never change jobs'],1],
                  ['Who sometimes helps Ben’s uncle in the garden?',['Max','Jake','Grandpa Tom'],2]
                ].map((x,qi)=>`<div class="benMCItem" data-correct="${x[2]}"><p>${qi+1}. ${x[0]}</p><div class="benOptions">${x[1].map((a,ai)=>`<button type="button" data-choice="${ai}">${a}</button>`).join('')}</div></div>`).join('')}
              </div><div class="benCheckRow"><button class="benCheck" data-check="details">Check</button><button class="benReset" data-reset="details">Reset</button><span class="benResult"></span></div>
            </div>
            <div class="benTask" data-ben-pane="tf">
              <h2>True or false?</h2><p class="benTaskHint">Correct the false statements orally.</p>

                  ['Ben’s dad recently changed jobs.',0],
                  ['Grandpa Tom retired a few years ago.',0]

              </div><div class="benCheckRow"><button class="benCheck" data-check="tf">Check</button><button class="benReset" data-reset="tf">Reset</button><span class="benResult"></span></div>
            </div>

              <h2>Complete Ben’s conclusion</h2><p class="benTaskHint">Use the ideas from the final part of the audio.</p>

              <div class="benCheckRow"><button class="benCheck" data-check="message">Check</button><button class="benReset" data-reset="message">Reset</button><span class="benResult"></span></div>

  function setupListening(root){
    root.querySelectorAll('[data-ben-tab]').forEach(b=>b.addEventListener('click',()=>{
      root.querySelectorAll('[data-ben-tab]').forEach(x=>x.classList.toggle('on',x===b));
      root.querySelectorAll('[data-ben-pane]').forEach(x=>x.classList.toggle('on',x.dataset.benPane===b.dataset.benTab));
    }));
    root.querySelectorAll('.benOptions button').forEach(b=>b.addEventListener('click',()=>{
      const row=b.closest('.benMCItem'); row.querySelectorAll('button').forEach(x=>x.classList.remove('selected','good','bad')); b.classList.add('selected');
    }));
    root.querySelectorAll('[data-check]').forEach(b=>b.addEventListener('click',()=>checkTask(root,b.dataset.check)));
    root.querySelectorAll('[data-reset]').forEach(b=>b.addEventListener('click',()=>resetTask(root,b.dataset.reset)));
    let qi=0,answered=false,score=0;
    const qEl=root.querySelector('[data-lq-question]'), aEl=root.querySelector('[data-lq-answers]'), fEl=root.querySelector('[data-lq-feedback]'), cEl=root.querySelector('[data-lq-count]'), nEl=root.querySelector('[data-lq-next]');
    const draw=()=>{answered=false;const q=listeningQuestions[qi];cEl.textContent=`${qi+1} / ${listeningQuestions.length}`;qEl.textContent=q.q;fEl.textContent='';aEl.innerHTML='';q.a.forEach((x,i)=>{const b=button(x);b.addEventListener('click',()=>{if(answered)return;answered=true;if(i===q.correct){b.classList.add('good');score++;fEl.textContent='Correct. '+q.why}else{b.classList.add('bad');aEl.children[q.correct].classList.add('good');fEl.textContent='Not quite. '+q.why}});aEl.appendChild(b)});nEl.textContent=qi===listeningQuestions.length-1?'Restart challenge':'Next question →'};
    nEl.addEventListener('click',()=>{if(qi===listeningQuestions.length-1){qi=0;score=0}else qi++;draw()}); draw();
  }

  function checkTask(root,name){
    const pane=root.querySelector(`[data-ben-pane="${name}"]`), result=pane.querySelector('.benResult'); let score=0,total=0;
    if(name==='match'){
      pane.querySelectorAll('select').forEach(s=>{total++;const good=s.selectedOptions[0]?.dataset.correct==='1';s.style.borderColor=good?'#55a978':'#d96f7d';if(good)score++});
    }else if(name==='details'||name==='tf'){
      pane.querySelectorAll('.benMCItem').forEach(row=>{total++;const selected=row.querySelector('button.selected'),correct=Number(row.dataset.correct);row.querySelectorAll('button').forEach((b,i)=>{b.classList.toggle('good',i===correct);b.classList.toggle('bad',b===selected&&i!==correct)});if(selected&&Number(selected.dataset.choice)===correct)score++});
    }else{
      pane.querySelectorAll('[data-main-answer]').forEach(i=>{total++;const good=i.value.trim().toLowerCase()===i.dataset.mainAnswer;i.style.borderColor=good?'#55a978':'#d96f7d';if(good)score++});
    }
    result.textContent=`${score} / ${total} correct`;
  }
  function resetTask(root,name){
    const pane=root.querySelector(`[data-ben-pane="${name}"]`);pane.querySelectorAll('select').forEach(x=>{x.value='';x.style.borderColor=''});pane.querySelectorAll('input').forEach(x=>{x.value='';x.style.borderColor=''});pane.querySelectorAll('.benOptions button').forEach(x=>x.classList.remove('selected','good','bad'));pane.querySelector('.benResult').textContent='';
  }

  function overallMarkup(){
    return `<div class="overallKahoot" data-overall-upgraded="true">
      <div class="overallHero"><div><h1>Final Kahoot Challenge</h1><p>Complete review of the lesson: life-stage vocabulary, family expressions, word formation, Present Simple / Present Continuous, stative verbs, articles and sharenting.</p><div class="overallTopicTags"><span>Vocabulary</span><span>Expressions</span><span>Grammar</span><span>Word formation</span><span>Sharenting</span></div></div><div class="overallScore"><b data-oq-score>0</b><span>CORRECT ANSWERS</span></div></div>
      <div class="overallCard"><div class="overallProgress"><i data-oq-progress></i></div><div class="overallQuestion" data-oq-question></div><div class="overallAnswers" data-oq-answers></div><div class="overallFeedback" data-oq-feedback></div><button type="button" class="overallNext" data-oq-next>Next question →</button></div>
    </div>`;
  }
  function setupOverall(root){
    let qn=0,score=0,answered=false;
    const qEl=root.querySelector('[data-oq-question]'),aEl=root.querySelector('[data-oq-answers]'),fEl=root.querySelector('[data-oq-feedback]'),sEl=root.querySelector('[data-oq-score]'),pEl=root.querySelector('[data-oq-progress]'),nEl=root.querySelector('[data-oq-next]');
    const draw=()=>{answered=false;const q=overallQuestions[qn];qEl.textContent=`${qn+1}. ${q.q}`;fEl.textContent=`${q.topic} · choose one answer`;aEl.innerHTML='';pEl.style.width=`${(qn/overallQuestions.length)*100}%`;q.a.forEach((x,i)=>{const b=button(x);b.addEventListener('click',()=>{if(answered)return;answered=true;if(i===q.c){b.classList.add('good');score++;sEl.textContent=score;fEl.textContent='Correct. '+q.e}else{b.classList.add('bad');aEl.children[q.c].classList.add('good');fEl.textContent='Review: '+q.e}});aEl.appendChild(b)});nEl.textContent=qn===overallQuestions.length-1?'Restart full challenge':'Next question →'};
    nEl.addEventListener('click',()=>{if(qn===overallQuestions.length-1){qn=0;score=0;sEl.textContent='0'}else qn++;draw()});draw();
  }

  function findTeenAudio(doc){
    const audios=[...doc.querySelectorAll('audio')];
    return audios.find(a=>`${a.getAttribute('src')||''} ${[...a.querySelectorAll('source')].map(s=>s.src).join(' ')}`.toLowerCase().includes('teenage-life')) || audios.find(a=>/teenage life|ben|life stages/i.test(a.closest('.page')?.textContent||''));
  }
  function upgradeListening(doc){
    if(doc.querySelector('[data-ben-upgraded="true"]')) return true;
    const audio=findTeenAudio(doc); if(!audio)return false;
    const page=audio.closest('.page')||audio.closest('section')||audio.parentElement; if(!page)return false;
    page.innerHTML=listeningMarkup(); setupListening(page); return true;
  }
  function upgradeFinal(doc){
    if(doc.querySelector('[data-overall-upgraded="true"]')) return true;
    const pages=[...doc.querySelectorAll('.page')];
    const candidates=pages.filter(p=>/kahoot|final challenge|final review/i.test(p.textContent||'')&&!p.querySelector('[data-ben-upgraded="true"]'));
    const page=candidates[candidates.length-1]; if(!page)return false;
    page.innerHTML=overallMarkup(); setupOverall(page); return true;
  }
  function refreshAudio(doc){
    doc.querySelectorAll('audio').forEach(a=>{const raw=a.getAttribute('src')||'';if(raw.toLowerCase().includes('teenage-life')){a.src=`assets/teenage-life.mp3?v=${VERSION}`;a.load()}});
  }
  function compactTop(doc){
    doc.querySelectorAll('.top button,.top select').forEach(el=>{el.style.maxWidth='320px';el.style.width='auto'});
  }
  function upgrade(doc){
    addTheme(doc);compactTop(doc);refreshAudio(doc);upgradeListening(doc);upgradeFinal(doc);
    let attempts=0;
    const timer=setInterval(()=>{attempts++;addTheme(doc);compactTop(doc);refreshAudio(doc);const l=upgradeListening(doc),k=upgradeFinal(doc);if((l&&k)||attempts>30)clearInterval(timer)},300);
    const observer=new MutationObserver(()=>{addTheme(doc);compactTop(doc);refreshAudio(doc);upgradeListening(doc);upgradeFinal(doc)});
    observer.observe(doc.documentElement,{childList:true,subtree:true});
  }

  frame.addEventListener('load',()=>{
    try{upgrade(frame.contentDocument);document.getElementById('loading').classList.add('hide')}catch(err){console.error(err);document.getElementById('loading').classList.add('hide')}
  });
  window.addEventListener('message',event=>{
    if(event.source===frame.contentWindow){parent.postMessage(event.data,location.origin)}
    else if(event.source===parent&&parent!==window){frame.contentWindow?.postMessage(event.data,location.origin)}
  });
})();
</script>
</body>
