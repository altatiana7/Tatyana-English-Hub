<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gabi · Happy Families</title>
<style>
:root{--n:#0b3c69;--b:#3679dc;--t:#1aa5b7;--g:#36b778;--p:#ef5b86;--o:#f39a32;--v:#775ac9;--ink:#173b59;--mut:#6c8495;--line:#d8e6ed;--bg:#eef8fb}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{height:100vh;display:grid;grid-template-columns:190px 1fr;gap:8px;padding:8px}.side,.main{background:white;border-radius:20px;box-shadow:0 12px 28px #163c5818;overflow:hidden}.side{display:flex;flex-direction:column}.brand{padding:13px;border-bottom:1px solid var(--line)}.brand small{color:var(--t);font-weight:900;font-size:8px;letter-spacing:.12em}.brand b{display:block;color:var(--n);font-size:16px;margin-top:3px}.nav{padding:8px;overflow:auto}.nav button{width:100%;border:0;background:transparent;border-radius:11px;padding:9px;text-align:left;color:#496a7d;font-size:11px;font-weight:850;margin-bottom:5px}.nav button.on{background:linear-gradient(135deg,var(--n),#17679f);color:#fff}.num{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:7px;background:#e8f3f8;color:var(--n);margin-right:6px}.nav button.on .num{background:#ffffff25;color:#fff}.foot{margin-top:auto;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:5px;border-top:1px solid var(--line)}.foot button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 4px;color:var(--n);font-size:10px;font-weight:900}.main{display:flex;flex-direction:column}.top{height:53px;min-height:53px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px}.top small{display:block;color:var(--t);font-size:8px;font-weight:900;letter-spacing:.12em}.top h1{margin:2px 0 0;color:var(--n);font-size:18px}.tag{margin-left:auto;padding:6px 10px;border-radius:999px;background:#e9f8f2;color:#08745e;font-size:9px;font-weight:900}.stage{position:relative;flex:1;min-height:0}.screen{position:absolute;inset:0;padding:13px;display:none;overflow:hidden;background:linear-gradient(#fff,#fbfeff)}.screen.on{display:flex;flex-direction:column}.head{display:flex;gap:9px;margin-bottom:9px}.badge{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--t),var(--b));color:#fff;display:grid;place-items:center;font-weight:950}.head h2{margin:0;color:var(--n);font-size:24px}.head p{margin:3px 0 0;color:var(--mut);font-size:10px;font-weight:650}.grow{flex:1;min-height:0}.panel{border:1px solid var(--line);border-radius:16px;background:#fbfdfe;padding:11px;overflow:auto}.panel h3{margin:0 0 8px;color:var(--n);font-size:14px}.photoRow{height:100%;display:grid;grid-template-columns:repeat(6,1fr);gap:7px}.ph{position:relative;border-radius:15px;overflow:hidden;border:2px solid #e0ebf0}.ph img{width:100%;height:100%;object-fit:cover}.ph span{position:absolute;left:5px;right:5px;bottom:5px;background:#0b3c69db;color:#fff;border-radius:8px;padding:6px;text-align:center;font-size:9px;font-weight:900}.quizlet{height:100%;display:grid;grid-template-rows:110px 1fr auto;gap:8px}.flip{perspective:1000px;min-height:0}.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:.45s}.flip.flipped .inner{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#fff,#eef8fb);display:grid;place-items:center;text-align:center;padding:20px}.back{transform:rotateY(180deg);background:linear-gradient(145deg,#eaf9f3,#fff)}.term{font-size:48px;font-weight:950;color:var(--n)}.age{display:inline-block;margin-top:7px;border:1px solid #bee1d7;border-radius:999px;padding:6px 10px;color:#08745e;font-weight:900}.controls{display:flex;justify-content:center;gap:6px}.btn{border:0;border-radius:9px;padding:8px 11px;background:var(--n);color:#fff;font-size:9px;font-weight:900}.btn.light{background:#edf4f7;color:#456679}.btn.green{background:#15977b}.btn.pink{background:var(--p)}.btn.orange{background:var(--o)}.row{display:grid;grid-template-columns:1fr 115px 145px;gap:7px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:10px}select,input{width:100%;padding:7px;border:1px solid #cfe0e7;border-radius:8px;background:#fff;color:#365d71;font-size:10px}.bar{display:flex;gap:7px;align-items:center;margin-top:7px}.fb{font-size:10px;font-weight:850;color:#5d798a}.facts{height:100%;display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:auto}.fact{border:1px solid var(--line);border-radius:14px;padding:10px;background:#fff}.fact b{font-size:11px;color:var(--n)}.tri{display:flex;gap:5px;margin:6px 0}.tri button{border:0;border-radius:8px;padding:6px 7px;color:#fff;font-size:8px;font-weight:900}.tri button:nth-child(1){background:var(--g)}.tri button:nth-child(2){background:var(--p)}.tri button:nth-child(3){background:var(--v)}.ans{display:none;padding:7px;border-radius:9px;background:#f3f8fa;font-size:9px;line-height:1.35}.fact.show .ans{display:block}.readgrid{height:100%;display:grid;grid-template-columns:.82fr 1.18fr;gap:10px}.visual{border-radius:16px;overflow:hidden}.visual img{width:100%;height:100%;object-fit:cover}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{border:1px solid #cfe0e7;border-radius:999px;background:#fff;padding:6px 8px;font-size:9px;font-weight:850}.task{display:grid;grid-template-columns:1.25fr 1fr;gap:7px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:9px}.audio{padding:7px;border-radius:12px;background:#eef9fc;border:1px solid #cfe7ed}.audio audio{width:100%}.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0}.tabs button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;color:#46677a;font-size:8px;font-weight:850}.tabs button.on{background:var(--n);color:#fff}.pane{display:none;font-size:9px;line-height:1.45}.pane.on{display:block}.opts{display:flex;gap:5px;flex-wrap:wrap}.opts button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:8px;font-weight:850}.lang{height:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.rule{border:1px dashed #b9d0db;border-radius:11px;background:#fff;padding:8px;font-size:9px;line-height:1.4}.li{display:grid;grid-template-columns:1.35fr 1fr;gap:6px;align-items:center;padding:5px 0;border-bottom:1px dashed var(--line);font-size:9px}.review{height:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.rc{border:1px solid var(--line);border-radius:14px;padding:9px;overflow:auto}.rc:nth-child(1){background:#eef8ff}.rc:nth-child(2){background:#fff4e5}.rc:nth-child(3){background:#fff0f5}.rc:nth-child(4){background:#edf9f2}.rc:nth-child(5){background:#f4efff}.rc h3{font-size:11px;margin:0 0 6px}.rc p,.rc li{font-size:9px;line-height:1.4}.final{height:100%;display:grid;grid-template-columns:.8fr .7fr 1.5fr;gap:8px}.box{border:1px solid var(--line);border-radius:15px;padding:10px;background:#fff;overflow:auto}.timer{font-size:46px;font-weight:950;color:var(--n)}.kt{float:right;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#ff5f6d,#ff9966);color:#fff;font-weight:950}.kq{font-size:15px;font-weight:950;color:var(--n);margin:8px 0}.ka{display:grid;grid-template-columns:1fr 1fr;gap:5px}.ka button{border:0;border-radius:10px;padding:9px;color:#fff;font-size:9px;font-weight:900;min-height:44px}.ka button:nth-child(1){background:#e94c6a}.ka button:nth-child(2){background:#3985d6}.ka button:nth-child(3){background:#e5a51d}.ka button:nth-child(4){background:#3ca86c}@media(max-width:900px){.app{grid-template-columns:150px 1fr}.screen{overflow:auto}.lang,.review,.final{grid-template-columns:1fr}.row{grid-template-columns:1fr 85px}.row select:last-child{grid-column:1/-1}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><small>GATEWAY TO THE WORLD B1 · M1</small><b>Happy Families</b></div><nav class="nav" id="nav"></nav><div class="foot"><button id="course">← Course</button><button id="next">Next lesson →</button></div></aside><main class="main"><header class="top"><div><small id="kick"></small><h1 id="title"></h1></div><span class="tag">Gabi · interactive lesson</span></header><div class="stage" id="stage"></div></main></div>
<script src="audio-part-1.js"></script><script src="audio-part-2.js"></script><script src="audio-part-3.js"></script><script src="audio-part-4.js"></script><script src="audio-part-5.js"></script><script src="audio-part-6.js"></script>
<script>
const AUDIO='data:audio/ogg;base64,'+(window.SHARE_AUDIO_PARTS||[]).join('');
const flash=[['Infancy','0–2','growth · movement · communication'],['Childhood','3–12','school · independence · friendships'],['Adolescence','13–19','identity · emotions · freedom'],['Young adulthood','20–39','work · choices · responsibility'],['Midlife','40–59','priorities · balance · experience'],['Older adulthood','60+','time · experience · new interests']];
const who=[['Every week I can do something new. I am learning to recognise people and sounds.','1','Infancy'],['I go to school and can do more things on my own now.','2','Childhood'],['My friends matter more, and I am thinking about who I am.','3','Adolescence'],['I am finishing my education and making decisions about my future.','4','Young adulthood'],['I care more about balance now: work, family and health.','5','Midlife'],['I have more time and I still enjoy learning new things.','6','Older adulthood']];
const facts=[['Babies have more bones than adults.','TRUE','Babies are born with about 300 bones; some fuse as they grow.'],['Teenagers need more sleep than adults.','TRUE','Teenagers generally need more sleep than most adults.'],['Your personality stops changing when you are 18.','FALSE','Personality can continue to develop throughout adulthood.'],['Adults stop learning new things successfully.','FALSE','Adults can keep learning successfully, although strategies may change.'],['Older people are always less adventurous.','FALSE','Adventure and curiosity depend on the person, not simply age.'],['Teenagers often take more risks than younger children.','TRUE','Adolescence is often linked to stronger reward-seeking and risk-taking.'],['People always become less happy as they get older.','FALSE','Well-being does not simply fall with age.']];
const lessons={1:{title:'Vocabulary & Listening',screens:[['Life Stages · Quizlet','Real photos first, then flip the Quizlet-style cards.',()=>`<div class="grow quizlet"><div class="photoRow">${[['baby.jpg','Infancy'],['schoolchild.jpg','Childhood'],['teen.jpg','Adolescence'],['graduation.jpg','Young adulthood'],['middle-aged.jpg','Midlife'],['senior.jpg','Older adulthood']].map(x=>`<div class="ph"><img src="assets/${x[0]}"><span>${x[1]}</span></div>`).join('')}</div><div class="flip" id="flip" onclick="this.classList.toggle('flipped')"><div class="inner"><div class="face"><div><div class="term" id="ft"></div><div class="fb">Tap to flip</div></div></div><div class="face back"><div><div class="term" id="fa"></div><span class="age" id="fk"></span></div></div></div></div><div class="controls"><button class="btn light" onclick="fprev()">←</button><button class="btn" onclick="fspeak()">▶ British audio</button><button class="btn light" onclick="fnext()">→</button></div></div>`],['Who said it? Which stage?','Match each statement to the photo and life stage.',()=>`<div class="grow panel"><div id="who"></div><div class="bar"><button class="btn green" onclick="check('#who [data-a]','wfb')">Check</button><span class="fb" id="wfb"></span></div></div>`],['Life Stages · Myth or True?','Guess first; reveal only afterwards.',()=>`<div class="grow facts" id="facts"></div>`]]},2:{title:'Reading & Grammar',screens:[['Family → Sharenting','Picture first, family language, then audio + text + tasks on the same page.',()=>`<div class="grow readgrid"><div class="visual"><img src="assets/family-flashback-user.webp"></div><div class="panel"><h3>1 · Family language</h3><div class="chips"><span class="chip">nuclear family</span><span class="chip">extended family</span><span class="chip">single-parent family</span><span class="chip">blended family</span><span class="chip">child-free family</span></div><div class="task"><span>My grandparents helped ___ me up.</span><input data-a="bring"></div><div class="task"><span>I get along ___ my cousins.</span><input data-a="with"></div><div class="task"><span>I can always rely ___ my parents.</span><input data-a="on"></div><div class="task"><span>My sister takes ___ my mum.</span><input data-a="after"></div><div class="bar"><button class="btn" onclick="check('.panel .task [data-a]','ffb')">Check family task</button><span class="fb" id="ffb"></span></div><h3 style="margin-top:7px">2 · Sharenting</h3><div class="audio"><audio controls src="${AUDIO}"></audio></div><div class="tabs"><button class="on" data-tab="pic">Picture</button><button data-tab="txt">Text</button><button data-tab="bt">Best title</button><button data-tab="cp">Comprehension</button><button data-tab="vb">Vocabulary</button></div><div class="pane on" id="tab-pic"><img src="assets/sharenting-user.webp" style="width:100%;max-height:145px;object-fit:contain"></div><div class="pane" id="tab-txt"><p>Many parents enjoy posting photos and stories about their children online. For relatives who live far away, this can be a nice way to share everyday family life. However, children may feel differently as they grow older. A picture that seems funny or harmless to a parent may later feel embarrassing to a teenager.</p><p>There are also questions about privacy. Once an image is online, people may save it or share it again. Some families ask older children before posting, avoid personal details and keep some moments private. The challenge is finding a balance between sharing and respecting a child’s growing independence.</p></div><div class="pane" id="tab-bt"><b>Choose the best title:</b><div class="opts"><button onclick="ttl(this,false)">Parents and their favourite apps</button><button onclick="ttl(this,true)">Sharenting: sharing family life online</button><button onclick="ttl(this,false)">Why teenagers stop taking photos</button></div><span class="fb" id="tfb"></span></div><div class="pane" id="tab-cp"><div class="task"><span>Why can posts help relatives who live far away?</span><input></div><div class="task"><span>Why may teenagers dislike old posts?</span><input></div><div class="task"><span>Give two safer sharing rules.</span><input></div><div class="task"><span>What balance should families find?</span><input></div></div><div class="pane" id="tab-vb"><div class="chips"><span class="chip">privacy</span><span class="chip">harmless</span><span class="chip">embarrassing</span><span class="chip">personal details</span><span class="chip">private</span><span class="chip">independence</span><span class="chip">balance</span></div><p class="fb">Choose three words and make a sentence about family life online.</p></div></div></div>`],['Language Lab','Word Formation + Present Simple / Continuous + stative verbs together.',()=>`<div class="grow lang"><div class="panel"><h3>Word Formation</h3><div class="rule">Gateway focus: noun suffixes <b>-ment, -ion, -ence</b>.</div><div class="li"><span>independent →</span><input data-a="independence"></div><div class="li"><span>communicate →</span><input data-a="communication"></div><div class="li"><span>develop →</span><input data-a="development"></div><div class="li"><span>different →</span><input data-a="difference"></div></div><div class="panel"><h3>Present groups</h3><div class="rule"><b>Present Simple:</b> routines, facts, permanent situations. Markers: usually, often, every day.<br><b>Present Continuous:</b> now, temporary situations, changing trends. Markers: now, at the moment, these days.</div><div class="li"><span>My parents usually ___ before posting. (ask)</span><input data-a="ask"></div><div class="li"><span>I ___ more independent these days. (become)</span><input data-a="am becoming"></div><div class="li"><span>We ___ about family traditions right now. (talk)</span><input data-a="are talking"></div><div class="li"><span>He ___ his grandparents every Sunday. (visit)</span><input data-a="visits"></div></div><div class="panel"><h3>Stative verbs</h3><div class="rule">Stative verbs describe states, opinions, feelings or possession and are <b>not normally continuous</b>: know, believe, understand, like, love, need, belong, seem.<br><b>Change of meaning:</b> I think / I’m thinking about · I have a brother / I’m having lunch.</div><div class="li"><span>I ___ privacy matters. (believe)</span><input data-a="believe"></div><div class="li"><span>She ___ about deleting the post now. (think)</span><input data-a="is thinking"></div><div class="li"><span>He ___ two sisters. (have)</span><input data-a="has"></div><div class="li"><span>They ___ dinner with grandparents. (have)</span><input data-a="are having"></div><div class="bar"><button class="btn green" onclick="check('.lang [data-a]','lfb')">Check all</button><span class="fb" id="lfb"></span></div></div></div>`]]},3:{title:'Speaking & Review',screens:[['Speaking Lab','Tasks 9–13 together on one page.',()=>`<div class="grow review"><div class="rc"><h3>9 · Biggest Change?</h3><p>Choose the main change at each stage:</p><p><b>independence · identity · responsibility · priorities · free time</b></p></div><div class="rc"><h3>10 · Too Young / Too Old?</h3><p>Choose an age and defend it:</p><ul><li>travel alone</li><li>own a smartphone</li><li>start a business</li><li>go back to university</li></ul></div><div class="rc"><h3>11 · Changes / Stays</h3><p>friends · values · appearance · interests · family · responsibilities · dreams</p><p><b>changes a lot / may change / often stays</b></p></div><div class="rc"><h3>12 · Turning Points</h3><p>Rank: starting school · adolescence · leaving home · first job · career change · retirement</p></div><div class="rc"><h3>13 · Gabi’s View</h3><p>One stage that changes a person most is ___ because…</p><p>One change I expect in the next few years is…</p></div></div>`],['Final Challenge','Tasks 14–16 together: speaking + sprint + bright Kahoot timer.',()=>`<div class="grow final"><div class="box"><h3>14 · Final Speaking</h3><p><b>Which stage of life changes a person the most?</b></p><p class="fb">Give 3 reasons + 1 example. Use: compared with, while, because, however, it depends on…</p></div><div class="box"><h3>15 · 60-sec Sprint</h3><div class="timer" id="st">60</div><button class="btn orange" onclick="sprint()">Start</button><p class="fb">stage → age · event → stage · definition → word · tense · stative/action</p></div><div class="box"><span class="kt" id="kt">15</span><h3>16 · Kahoot Final</h3><div class="fb" id="kp"></div><div class="kq" id="kq"></div><div class="ka" id="ka"></div><div class="bar"><button class="btn pink" onclick="restart()">Restart</button><button class="btn green" onclick="knext()">Next</button><span class="fb" id="kfb"></span></div></div></div>`]]}};
const K=[['Which family type includes grandparents, aunts and cousins?',['nuclear family','extended family','blended family','child-free family'],1],['What does get along with mean?',['depend on someone','have a good relationship','raise a child','look like someone'],1],['Best title for the reading?',['Parents and apps','Sharenting: sharing family life online','Why teens stop taking photos','A day at school'],1],['Which stage is strongly connected with identity and freedom?',['Infancy','Childhood','Adolescence','Older adulthood'],2],['My parents usually ___ before posting.',['ask','are asking','asking','asked'],0],['More teens ___ about privacy these days.',['worry','worries','are worrying','worried'],2],['Which verb is usually stative?',['run','believe','travel','study'],1],['Complete: rely ___ your family.',['at','to','with','on'],3],['I’m finishing my degree and making important choices. Which stage?',['Young adulthood','Midlife','Old age','Childhood'],0],['Babies are born with about ... bones.',['106','206','300','500'],2]];
let lesson=Math.max(1,Math.min(3,+new URLSearchParams(location.search).get('lesson')||1)),screen=0,fi=0,ki=0,score=0,kleft=15,kint,sint,locked=false;
function nav(){let L=lessons[lesson];kick.textContent=`LESSON ${lesson} · HAPPY FAMILIES`;title.textContent=L.title;document.getElementById('nav').innerHTML=L.screens.map((x,i)=>`<button class="${i===screen?'on':''}" onclick="go(${i})"><span class="num">${i+1}</span>${x[0]}</button>`).join('')}
function render(){nav();let s=lessons[lesson].screens[screen];stage.innerHTML=`<section class="screen on"><div class="head"><div class="badge">${screen+1}</div><div><h2>${s[0]}</h2><p>${s[1]}</p></div></div>${s[2]()}</section>`;after()}
function go(i){screen=i;render()}function after(){if(lesson===1&&screen===0)flashRender();if(lesson===1&&screen===1)whoRender();if(lesson===1&&screen===2)factsRender();if(lesson===2&&screen===0)tabs();if(lesson===3&&screen===1)krender()}
function flashRender(){let d=flash[fi];ft.textContent=d[0];fa.textContent=d[1];fk.textContent=d[2];flip.classList.remove('flipped')}function fnext(){fi=(fi+1)%6;flashRender()}function fprev(){fi=(fi+5)%6;flashRender()}function fspeak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(flash[fi].join('. '));u.lang='en-GB';u.rate=.88;speechSynthesis.speak(u)}
function whoRender(){who.innerHTML=whoData()}function whoData(){return window.who.map((x,i)=>`<div class="row"><span><b>${String.fromCharCode(65+i)}.</b> “${x[0]}”</span><select data-a="${x[1]}"><option value="">photo</option>${[1,2,3,4,5,6].map(n=>`<option>${n}</option>`).join('')}</select><select data-a="${x[2]}"><option value="">stage</option>${flash.map(d=>`<option>${d[0]}</option>`).join('')}</select></div>`).join('')}
window.who=who;
function factsRender(){document.getElementById('facts').innerHTML=facts.map((x,i)=>`<div class="fact" id="f${i}"><b>${x[0]}</b><div class="tri"><button>TRUE</button><button>FALSE</button><button>NOT SURE</button></div><button class="btn light" onclick="f${i}.classList.toggle('show')">Reveal fact</button><div class="ans"><b>${x[1]}.</b> ${x[2]}</div></div>`).join('')}
function tabs(){document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.pane').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.getElementById('tab-'+b.dataset.tab).classList.add('on')})}function ttl(b,g){tfb.textContent=g?'Correct.':'Try again.'}
function check(sel,id){let a=[...document.querySelectorAll(sel)],ok=0;a.forEach(e=>{if((e.value||'').trim().toLowerCase()===(e.dataset.a||'').trim().toLowerCase())ok++});document.getElementById(id).textContent=`${ok} / ${a.length} correct`}
function sprint(){clearInterval(sint);let n=60;st.textContent=n;sint=setInterval(()=>{st.textContent=--n;if(n<=0)clearInterval(sint)},1000)}
function krender(){clearInterval(kint);let q=K[ki];kp.textContent=`Question ${ki+1} / ${K.length} · Score ${score}`;kq.textContent=q[0];ka.innerHTML=q[1].map((a,i)=>`<button onclick="kanswer(${i})">${a}</button>`).join('');kfb.textContent='';kleft=15;locked=false;kt.textContent=kleft;kint=setInterval(()=>{kt.textContent=--kleft;if(kleft<=0){clearInterval(kint);locked=true;kfb.textContent='Time!'}},1000)}function kanswer(i){if(locked)return;locked=true;clearInterval(kint);if(i===K[ki][2]){score++;kfb.textContent='Correct!'}else kfb.textContent='Not quite.';kp.textContent=`Question ${ki+1} / ${K.length} · Score ${score}`}function knext(){if(ki<K.length-1){ki++;krender()}else{kq.textContent=`Finished! Score ${score} / ${K.length}`;ka.innerHTML='';kt.textContent='✓'}}function restart(){ki=0;score=0;krender()}
course.onclick=()=>parent.postMessage('gabi-close-lesson',location.origin);next.onclick=()=>parent.postMessage({type:'gabi-lesson',lesson:lesson<3?lesson+1:1},location.origin);render();
</script></body></html>
