<body>
<div class="app">
<aside class="side"><div class="brand"><small>MODULE 1 · HAPPY FAMILIES</small><b>Ages and Stages of Life</b><span>Gabi · interactive lesson</span></div><nav class="nav" id="nav"></nav><div class="sidefoot"><button onclick="prevScreen()">Back</button><button onclick="nextScreen()">Next</button></div></aside>
<main class="main"><header class="top"><div><div class="kicker">GATEWAY TO THE WORLD B1</div><h1 id="topTitle">Warm-up</h1></div><div class="topRight"><span class="pill" id="progress">0 / 18 complete</span><button class="teacher" onclick="teacherOpen()">Teacher notes</button></div></header><section class="stage" id="stage"></section></main>
</div>
<div class="modal" id="modal"><div class="modalBox"><button class="close" onclick="teacherClose()">Close</button><h3 id="teacherTitle">Teacher notes</h3><pre id="teacherText"></pre></div></div>
<script>
const names=['Warm-up','Guess the Life Stage','Textbook Core','Quizlet Cards','Life Stage Sorting','What Happens When?','Too Young / Too Old?','Stereotype Detective','Before Listening','Listen & Match','Choose the Answer','True / False / NM','Who Said It?','Vocabulary Lab','Speaking','Sprint','Bomb Game','Kahoot Final'];
const subs=['Revision from previous family vocabulary.','Predict first — reveal later.','Gateway B1 vocabulary in context.','One card at a time with British audio.','Build the order from youngest to oldest.','Sort events and defend one choice.','Choose an age and explain.','Think critically about age stereotypes.','Predict before the first listen.','Listening 1 · global understanding.','Listening 2 · detail.','Listening 3 · careful discrimination.','Listening 4 · identify the speaker.','Use key listening vocabulary.','Personalise the topic.','60-second retrieval challenge.','Answer first, then reveal the twist.','Mixed final review.'];
const tnotes=[
'Revision first. Use 4–6 items from previous family vocabulary. Then ask: What ideas and themes connected to the family do you think we might study? Elicit useful words before the new set.',
'Keep the labels hidden at first. Ask age, stage of life, possible interests and possible challenges.',
'Teacher’s Book: check the meaning of stage. Drill child–children, man–men, woman–women. Ask which life stage has an exact range: teenager, 13–19, because these are the numbers ending in -teen. Suggested ranges: toddler 2–3, child 4–12, teenager 13–19, young adult 20–39, middle-aged 40–64, senior citizen 65+.',
'The Teacher’s Book recommends using the vocabulary audio before or after the task and asking students to listen and repeat. Use Listen, then ask Gabi to produce one sentence before flipping.',
'Tween and adolescent overlap with other stages. Treat boundaries as approximate and discuss overlap.',
'This is an extension of the life-stage vocabulary. More than one choice can be defended. Ask Gabi to justify one surprising placement.',
'There is no single correct age for most prompts. The target is opinion + reason, not a factual answer.',
'Critical-thinking focus: ask Is that always true? Encourage a reason or example and an open-minded response.',
'Pre-listening: predict the five people’s stages. Do not show the transcript. First listening should be uninterrupted if possible.',
'First listen = global understanding. Match people to life stages.',
'Second listen = detail. Read options first and notice how they differ.',
'Remind Gabi: FALSE contradicts the audio; NOT MENTIONED is not stated.',
'Use this as a fresh fourth pass. He identifies the speaker from meaning rather than repeating another multiple-choice test.',
'After matching definitions, ask for one personal sentence with independent, challenge or stage of life.',
'Show one question at a time. Encourage a full answer + reason/example. Be sensitive to different family structures.',
'Do not stop to teach during the 60 seconds. Review mistakes after the round.',
'Use as a high-energy retrieval game. For question cards, Gabi answers before you reveal the card content fully.',
'Final mixed retrieval. Answer positions are shuffled so the correct answer is not consistently first.'
];
let current=0,done=new Set(JSON.parse(localStorage.getItem('gabiStagesDone2')||'[]')),stage=document.getElementById('stage');
function save(){localStorage.setItem('gabiStagesDone2',JSON.stringify([...done]));document.getElementById('progress').textContent=done.size+' / '+names.length+' complete'}function complete(){done.add(current);save()}function nav(){document.getElementById('nav').innerHTML=names.map((n,i)=>`<button class="${i===current?'on':''}" onclick="show(${i})"><span class="n">${i+1}</span><span>${n}</span></button>`).join('')}function head(){return `<div class="head"><div class="badge">${current+1}</div><div><h2>${names[current]}</h2><p>${subs[current]}</p></div></div>`}function shell(x){return `<div class="screen">${head()}<div class="grow">${x}</div></div>`}function show(i){stopListen();clearInterval(sprintInt);sprintInt=null;clearInterval(speakInt);current=i;document.getElementById('topTitle').textContent=names[i];nav();render();save()}function nextScreen(){show(Math.min(names.length-1,current+1))}function prevScreen(){show(Math.max(0,current-1))}function teacherOpen(){document.getElementById('teacherTitle').textContent='Teacher notes · '+names[current];document.getElementById('teacherText').textContent=tnotes[current];document.getElementById('modal').classList.add('on')}function teacherClose(){document.getElementById('modal').classList.remove('on')}
const warm=[['siblings','brothers and sisters'],['only child','a child with no brothers or sisters'],['cousin','your aunt or uncle’s child'],['niece','your brother or sister’s daughter'],['nephew','your brother or sister’s son'],['twins','two children born at the same time']];
function rWarm(){stage.innerHTML=shell(`<div class="hero"><div class="heroCard"><h3>Family<br>Flashback</h3><p>Tap every card. Say the meaning before you reveal it. Then answer: <b>What changes as people grow up?</b></p><div class="chips"><span class="chip">family</span><span class="chip">age</span><span class="chip">responsibility</span><span class="chip">independence</span><span class="chip">future</span></div></div><div class="warm">${warm.map(([w,a])=>`<button onclick="this.classList.toggle('show');this.innerHTML=this.classList.contains('show')?'${w}<span>${a}</span>':'${w}'">${w}</button>`).join('')}</div></div>`)}
const photos=[
['https://unsplash.com/photos/NfE2M4Z9rME/download?force=true&w=500','newborn / baby'],['https://unsplash.com/photos/CaSKjf1vwyU/download?force=true&w=500','toddler'],['https://unsplash.com/photos/7C5z5c22oRs/download?force=true&w=500','child / pre-teen'],['https://unsplash.com/photos/pWkaNdkXE4A/download?force=true&w=500','teenager'],['https://unsplash.com/photos/1sAsSVGhpIM/download?force=true&w=500','young adult'],['https://unsplash.com/photos/LHotCeR8Ap0/download?force=true&w=500','young adult'],['https://unsplash.com/photos/vNtw0KqCLSo/download?force=true&w=500','middle-aged adult'],['https://unsplash.com/photos/rkSoP8iZVBY/download?force=true&w=500','senior / elderly person']];
function rGuess(){stage.innerHTML=shell(`<div class="photos">${photos.map(([src,l])=>`<div class="person" onclick="this.classList.toggle('show')"><img src="${src}" alt="person"><div class="label">${l}</div></div>`).join('')}</div>`)}
const core=[['baby','0–1'],['toddler','2–3'],['child','4–12'],['teenager','13–19'],['young adult','20–39'],['middle-aged','40–64'],['senior citizen','65+']];
function rCore(){stage.innerHTML=shell(`<div class="grid2"><div class="panel"><h3>Match stage and age range</h3><div class="rows">${core.map((x,i)=>`<div class="row"><div class="word">${x[0]}</div><div>→</div><select id="c${i}"><option value="">choose</option>${core.map(y=>`<option>${y[1]}</option>`).join('')}</select></div>`).join('')}</div><div class="checkbar"><button class="action" onclick="checkCore()">Check</button><span class="feedback" id="corefb"></span></div></div><div class="panel"><h3>Pronunciation challenge</h3><div class="note">Say each pair, then listen.</div><div style="display:grid;gap:8px;margin-top:10px"><button class="word" onclick="speak('child, children')">child → children</button><button class="word" onclick="speak('man, men')">man → men</button><button class="word" onclick="speak('woman, women')">woman → women</button></div><div class="panel" style="margin-top:12px;background:#edf9f5"><h3>Think</h3><div class="note">Which stage has an exact age range rather than an approximate one?</div><button class="action green" style="margin-top:8px" onclick="document.getElementById('exact').textContent='Teenager: 13–19. These are the numbers ending in –teen.'">Reveal</button><div id="exact" class="note" style="margin-top:8px"></div></div></div></div>`)}function checkCore(){let n=0;core.forEach((x,i)=>{if(document.getElementById('c'+i).value===x[1])n++});document.getElementById('corefb').textContent=n+' / 7 correct';if(n===7)complete()}
const cards=[['baby','0–1','A baby depends on adults for almost everything.'],['toddler','2–3','A toddler is learning to walk, talk and explore.'],['child','4–12','Children usually start school during this stage.'],['teenager','13–19','Teenagers often want more independence.'],['young adult','20–39','Many young adults study, work or move out.'],['middle-aged','40–64','Middle-aged adults may balance work and family.'],['senior citizen','65+','Many senior citizens have more time for hobbies.']];let card=0;function rCards(){let c=cards[card];stage.innerHTML=shell(`<div class="flashArea"><div class="flashWrap"><div class="flash" id="flash" onclick="this.classList.toggle('flip')"><div class="inner"><div class="face"><div class="term">${c[0]}</div><div class="note">Say the meaning and age · click to flip</div></div><div class="face back"><div class="term" style="font-size:40px">${c[0]}</div><div class="age">${c[1]}</div><div class="example">${c[2]}</div></div></div></div><div class="controls"><button class="light" onclick="card=(card-1+cards.length)%cards.length;rCards()">Back</button><button class="mainb" onclick="speak('${c[0]}')">Listen</button><button class="light" onclick="card=(card+1)%cards.length;rCards()">Next</button></div><div class="note" style="margin-top:7px">${card+1} / ${cards.length}</div></div></div>`)}function speak(t){if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.88;speechSynthesis.speak(u)}}
let sortPool=['senior citizen','toddler','teenager','young adult','baby','middle-aged','child'],built=[];function rSort(){stage.innerHTML=shell(`<div class="panel" style="height:100%"><h3>Click the stages in order</h3><div class="pool">${sortPool.filter(x=>!built.includes(x)).map(x=>`<button class="token" onclick="built.push('${x}');rSort()">${x}</button>`).join('')}</div><div class="order">${Array.from({length:7},(_,i)=>`<div class="slot ${built[i]?'filled':''}">${built[i]||i+1}</div>`).join('')}</div><div class="checkbar"><button class="action" onclick="checkSort()">Check</button><button class="action alt" onclick="built=[];rSort()">Reset</button><span class="feedback" id="sortfb"></span></div></div>`)}function checkSort(){let a=['baby','toddler','child','teenager','young adult','middle-aged','senior citizen'];let ok=built.join('|')===a.join('|');document.getElementById('sortfb').textContent=ok?'Perfect order.':'Try again.';if(ok)complete()}
const events=['start school','learn to drive','move out','graduate','get your first job','fall in love','get married','have children','change careers','buy a house','retire','become a grandparent'];let eventSel=null,eventMap={early:[],any:[],later:[]};function rEvents(){stage.innerHTML=shell(`<div class="bucketWrap"><div class="pool">${events.filter(x=>!Object.values(eventMap).flat().includes(x)).map(x=>`<button class="token" onclick="eventSel='${x}';this.style.outline='2px solid #27a'">${x}</button>`).join('')}</div><div class="buckets"><div class="bucket" onclick="putEvent('early')"><h3>Usually happens early</h3>${eventMap.early.map(x=>`<button class="token">${x}</button>`).join('')}</div><div class="bucket" onclick="putEvent('any')"><h3>May happen at any age</h3>${eventMap.any.map(x=>`<button class="token">${x}</button>`).join('')}</div><div class="bucket" onclick="putEvent('later')"><h3>Usually happens later</h3>${eventMap.later.map(x=>`<button class="token">${x}</button>`).join('')}</div></div></div>`)}function putEvent(b){if(!eventSel)return;eventMap[b].push(eventSel);eventSel=null;rEvents()}
const aq=['have a smartphone?','travel alone?','live alone?','get married?','change careers?','go back to university?','wear whatever they want?','become a parent?','start a business?','learn a new language?','use TikTok?','go clubbing?'];let aqi=0;function rAge(){stage.innerHTML=shell(`<div class="qLayout"><div class="bigQ"><div class="note">QUESTION ${aqi+1} / 12</div><h3>At what age is someone too young or too old to <span style="color:#e48b10">${aq[aqi]}</span></h3><div class="range"><span>Age</span><input type="range" min="5" max="80" value="18" oninput="agev.textContent=this.value"><span class="ageOut" id="agev">18</span></div><div class="reason">Defend it: <b>I think … because …</b></div></div><div class="qlist">${aq.map((q,i)=>`<button class="${i===aqi?'on':''}" onclick="aqi=${i};rAge()">${i+1}. ${q}</button>`).join('')}</div></div>`)}
const st=['Teenagers are irresponsible.','People over 60 don’t understand technology.','Children learn languages faster than adults.','People become more confident with age.','Young adults change jobs too often.','Older people are more patient.'];let sti=0;function rStereo(){stage.innerHTML=shell(`<div class="grid2"><div class="panel" style="display:flex;flex-direction:column;justify-content:center"><div class="note">STATEMENT ${sti+1} / ${st.length}</div><div class="statement">${st[sti]}</div><div class="tri"><button onclick="stPick('TRUE')">TRUE</button><button onclick="stPick('SOMETIMES TRUE')">SOMETIMES TRUE</button><button onclick="stPick('STEREOTYPE')">STEREOTYPE</button></div><div class="reason" id="reason">Choose, then justify with a reason or example.</div></div><div class="panel"><h3>Detective board</h3><div class="qlist">${st.map((q,i)=>`<button class="${i===sti?'on':''}" onclick="sti=${i};rStereo()">${i+1}. ${q}</button>`).join('')}</div></div></div>`)}function stPick(x){document.getElementById('reason').innerHTML='You chose <b>'+x+'</b>. Is it always true? Give an example.'}
const script=`Hi, I’m Ben and I’m fifteen. My family is quite big, and everyone seems to be at a different stage of life. My little brother Max is two. He’s a toddler and he has just started walking confidently. He loves opening cupboards, touching everything and following me around the house. He doesn’t say many words yet, but he definitely knows how to get everyone’s attention. I’m a teenager, so my life is mostly school, friends and thinking about the future. I don’t really know what job I want yet, but I’m interested in computers and design. My parents keep asking me about university, which feels a bit early to me. My cousin Jake is twenty-two. He’s a young adult and he’s studying engineering at university. He lives in a flat with two friends, so now he has to cook, clean and manage his own money. He says being independent is great, but sometimes he misses living at home. My dad is forty-six. He recently changed jobs because he wanted a new challenge. I used to think adults had everything planned, but apparently they don’t. My grandpa Tom is seventy. He retired a few years ago. Now he goes fishing, rides his bike and sometimes helps my uncle in the garden. He says he finally has time for the things he enjoys. When I was younger, I thought growing up just meant becoming more independent. Now I think every stage of life is different. Some things get easier, but new problems appear too.`;
let listenUtter=null,listenTimer=null,listenStart=0,listenPaused=false;function player(){return `<div class="player"><div class="wave"></div><h3 style="margin:8px 0 2px;color:var(--navy)">My Family at Different Stages of Life</h3><div class="playerBtns"><button class="action" onclick="playListen()">Play</button><button class="action alt" onclick="pauseListen()">Pause</button><button class="action alt" onclick="resumeListen()">Resume</button><button class="action alt" onclick="stopListen()">Stop</button></div><div class="progress"><i id="bar"></i></div><div class="status" id="listenStatus">Listening text is hidden. Use the audio controls only.</div></div>`}function playListen(){stopListen();if(!('speechSynthesis'in window)){return}listenUtter=new SpeechSynthesisUtterance(script);listenUtter.lang='en-GB';listenUtter.rate=.92;listenStart=Date.now();speechSynthesis.speak(listenUtter);let duration=70000;listenTimer=setInterval(()=>{let p=Math.min(100,(Date.now()-listenStart)/duration*100);let b=document.getElementById('bar');if(b)b.style.width=p+'%'},250);listenUtter.onend=()=>{clearInterval(listenTimer);let b=document.getElementById('bar');if(b)b.style.width='100%'}}function pauseListen(){if(speechSynthesis.speaking){speechSynthesis.pause();listenPaused=true}}function resumeListen(){if(listenPaused){speechSynthesis.resume();listenPaused=false}}function stopListen(){clearInterval(listenTimer);if('speechSynthesis'in window)speechSynthesis.cancel();listenPaused=false}
function rBefore(){stage.innerHTML=shell(`<div class="listen">${player()}<div class="panel"><h3>Before listening</h3><div class="note">Guess who could be:</div><div style="display:grid;gap:7px;margin-top:10px"><div class="word">a toddler</div><div class="word">a teenager</div><div class="word">a young adult</div><div class="word">a middle-aged adult</div><div class="word">a senior</div></div><div class="note" style="margin-top:10px">People you will hear: Ben · Max · Jake · Ben’s dad · Grandpa Tom</div></div></div>`)}
const mp=[['Ben','a teenager'],['Max','a toddler'],['Jake','a young adult'],['Ben’s dad','a middle-aged adult'],['Grandpa Tom','a senior']];function rMatch(){stage.innerHTML=shell(`<div class="listen">${player()}<div class="panel"><h3>Listen and match</h3><div class="match">${mp.map((x,i)=>`<div class="matchrow"><div class="name">${i+1}. ${x[0]}</div><select id="m${i}"><option value="">choose</option>${['a toddler','a teenager','a young adult','a middle-aged adult','a senior'].map(y=>`<option>${y}</option>`).join('')}</select></div>`).join('')}</div><div class="checkbar"><button class="action" onclick="checkMatch()">Check</button><span class="feedback" id="mfb"></span></div></div></div>`)}function checkMatch(){let n=0;mp.forEach((x,i)=>{if(document.getElementById('m'+i).value===x[1])n++});document.getElementById('mfb').textContent=n+' / 5 correct';if(n===5)complete()}
const mc=[['Ben is',['13','15','17'],1],['Max has recently started',['walking','school','swimming lessons'],0],['Jake is',['at university','working in a café','travelling around Europe'],0],['Ben’s dad has recently',['changed jobs','moved house','retired'],0],['Grandpa Tom now spends more time',['working','doing hobbies','looking after children'],1],['Ben thinks that',['being a teenager is easy','adults always know what to do','every stage of life has its own challenges'],2]];let mcs={};function rMC(){stage.innerHTML=shell(`<div class="listen">${player()}<div class="items">${mc.map((q,i)=>`<div class="item"><b>${i+1}. ${q[0]}</b><div class="opts">${q[1].map((x,j)=>`<button onclick="pick(${i},${j},this,mcs)">${String.fromCharCode(97+j)}) ${x}</button>`).join('')}</div></div>`).join('')}<div class="checkbar"><button class="action" onclick="checkMC()">Check</button><span class="feedback" id="mcfb"></span></div></div></div>`)}function pick(i,j,b,obj){obj[i]=j;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')}function checkMC(){let n=0;mc.forEach((q,i)=>{if(mcs[i]===q[2])n++});document.getElementById('mcfb').textContent=n+' / 6 correct';if(n===6)complete()}
const tf=[['Max can already speak very well.','False'],['Ben knows exactly what job he wants.','False'],['Jake lives with his parents.','False'],['Jake sometimes misses home.','True'],['Ben’s dad changed jobs recently.','True'],['Grandpa Tom has no hobbies.','False'],['Ben wants to become an engineer.','Not Mentioned']];let tfs={};function rTF(){stage.innerHTML=shell(`<div class="listen">${player()}<div class="items">${tf.map((q,i)=>`<div class="item"><b>${i+1}. ${q[0]}</b><div class="opts">${['True','False','Not Mentioned'].map(x=>`<button onclick="pickText(${i},'${x}',this,tfs)">${x}</button>`).join('')}</div></div>`).join('')}<div class="checkbar"><button class="action" onclick="checkTF()">Check</button><span class="feedback" id="tffb"></span></div></div></div>`)}function pickText(i,x,b,obj){obj[i]=x;b.parentElement.querySelectorAll('button').forEach(z=>z.classList.remove('sel'));b.classList.add('sel')}function checkTF(){let n=0;tf.forEach((q,i)=>{if(tfs[i]===q[1])n++});document.getElementById('tffb').textContent=n+' / 7 correct';if(n===7)complete()}
const said=[['I don’t really know what job I want yet.','Ben'],['Being independent is great, but sometimes I miss living at home.','Jake'],['I wanted a new challenge.','Dad'],['I finally have time for the things I enjoy.','Grandpa'],['I used to think adults had everything planned.','Ben'],['I have to cook, clean and manage my own money.','Jake']];let ss={};function rSaid(){stage.innerHTML=shell(`<div class="listen">${player()}<div class="items">${said.map((q,i)=>`<div class="item"><b>“${q[0]}”</b><div class="opts">${['Ben','Jake','Dad','Grandpa'].map(x=>`<button onclick="pickText(${i},'${x}',this,ss)">${x}</button>`).join('')}</div></div>`).join('')}<div class="checkbar"><button class="action" onclick="checkSaid()">Check</button><span class="feedback" id="sfb"></span></div></div></div>`)}function checkSaid(){let n=0;said.forEach((q,i)=>{if(ss[i]===q[1])n++});document.getElementById('sfb').textContent=n+' / 6 correct';if(n===6)complete()}
const vocab=[['toddler','a very young child'],['independent','able to do things without depending on others'],['manage money','control your spending'],['challenge','a difficult situation that tests you'],['retire','stop working because of age'],['stage of life','a period in someone’s life']];let vs=null,vdone=new Set();function rVocab(){let defs=[...vocab].sort(()=>.5-Math.random());stage.innerHTML=shell(`<div class="vocab"><div class="vcol">${vocab.map((x,i)=>`<button class="vbtn" id="vw${i}" onclick="vs=${i};document.querySelectorAll('[id^=vw]').forEach(x=>x.classList.remove('on'));this.classList.add('on')">${x[0]}</button>`).join('')}</div><div class="vcol">${defs.map(x=>`<button class="vbtn" onclick="vDef('${x[1].replaceAll("'","\\'")}',this)">${x[1]}</button>`).join('')}</div></div>`)}function vDef(d,b){if(vs===null)return;if(vocab[vs][1]===d){document.getElementById('vw'+vs).disabled=true;b.disabled=true;vdone.add(vs);vs=null;if(vdone.size===6)complete()}else b.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:180})}
const sq=['Who is the youngest person in your family?','Is there a teenager in your family?','Who is a young adult?','Who is the oldest person?','Has anyone recently changed jobs, moved house or started university?','Which stage of life looks the most interesting to you? Why?'];let sqi=0,speakInt=null;function rSpeak(){stage.innerHTML=shell(`<div class="grid2"><div class="panel" style="display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center"><div class="timer" id="timer">40</div><div class="statement">${sq[sqi]}</div><div><button class="action" onclick="startSpeak()">Start 40s</button> <button class="action alt" onclick="speak('${sq[sqi].replaceAll("'","\\'")}')">Listen</button></div></div><div class="speakGrid">${sq.map((q,i)=>`<button class="speakCard ${i===sqi?'on':''}" onclick="sqi=${i};rSpeak()">${i+1}. ${q}</button>`).join('')}</div></div>`)}function startSpeak(){clearInterval(speakInt);let n=40,t=document.getElementById('timer');t.textContent=n;speakInt=setInterval(()=>{n--;if(t)t.textContent=n;if(n<=0){clearInterval(speakInt);if(t)t.textContent='TIME'}},1000)}
const sprint=[['13–19',['teenager','child','young adult','senior'],0],['65+',['senior citizen','middle-aged','toddler','young adult'],0],['stop working because of age',['retire','graduate','move out','manage money'],0],['able to do things without depending on others',['independent','middle-aged','relative','adolescent'],0],['Ben is…',['15','17','13','22'],0],['Jake studies…',['engineering','design','medicine','law'],0],['Grandpa Tom enjoys…',['fishing','nightclubs','university','school'],0],['20–39',['young adult','teenager','senior','child'],0],['a difficult situation that tests you',['challenge','stage','relative','routine'],0],['Max has just started…',['walking','school','working','driving'],0]];let spi=0,sps=0,sptime=60,sprintInt=null;function sh(a){return a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1])}function rSprint(){let q=sprint[spi%sprint.length],ch=sh(q[1].map((x,i)=>[x,i===q[2]]));stage.innerHTML=shell(`<div class="game"><div class="gameCard"><div class="score">SPRINT · <span id="sptime">${sptime}</span>s · SCORE ${sps}</div><h3>${q[0]}</h3><div class="answers">${ch.map(x=>`<button onclick="sAnswer(${x[1]})">${x[0]}</button>`).join('')}</div></div></div>`);if(!sprintInt){sprintInt=setInterval(()=>{sptime--;let e=document.getElementById('sptime');if(e)e.textContent=sptime;if(sptime<=0){clearInterval(sprintInt);sprintInt=null;complete();alert('Sprint score: '+sps)}},1000)}}function sAnswer(ok){if(ok)sps++;spi++;rSprint()}
const bombs=[['What stage is 13–19?','teenager'],['Name two things Jake must manage alone.','cook / clean / money'],['What did Dad change?','his job'],['What did Max recently start doing?','walking'],['DOUBLE','special'],['BOMB','special'],['What does retire mean?','stop working because of age'],['Name one age stereotype.','open answer'],['SAFE +2','special'],['Who is 70 in the audio?','Grandpa Tom'],['What stage is 40–64?','middle-aged'],['STEAL +3','special']];function rBomb(){stage.innerHTML=shell(`<div class="bombs">${sh(bombs.map((x,i)=>[x,i])).map(([x,i],k)=>`<button class="bomb" onclick="openBomb(this,${i})">${k+1}</button>`).join('')}</div>`)}function openBomb(b,i){let x=bombs[i];b.classList.add('open');if(x[1]==='special')b.classList.add('special');b.innerHTML='<b>'+x[0]+'</b>'+(x[1]!=='special'?'<br><span>'+x[1]+'</span>':'');b.onclick=null}
const kah=[['Which stage is usually 2–3 years old?',['toddler','teenager','young adult','senior'],0],['Which plural is correct?',['childs','childrens','children','childes'],2],['Who is studying engineering?',['Ben','Max','Jake','Grandpa Tom'],2],['What did Ben’s dad do recently?',['retired','changed jobs','moved house','started university'],1],['Which statement is NOT mentioned?',['Jake misses home','Max started walking','Ben wants to be an engineer','Grandpa goes fishing'],2],['What does independent mean?',['very old','able to do things without depending on others','retired','married'],1],['Which stage has an exact numerical name range?',['middle-aged','young adult','teenager','senior'],2],['Grandpa Tom spends more time…',['working','doing hobbies','at school','travelling Europe'],1],['Which is a life event?',['relative','move out','toddler','middle-aged'],1],['“I finally have time for the things I enjoy.” Who?',['Ben','Jake','Dad','Grandpa'],3],['Which is usually a senior age?',['13–19','20–39','40–64','65+'],3],['A challenge is…',['a test of your ability','a family member','a fixed age','a hobby'],0]];let ki=0,ks=0;function rKah(){let q=kah[ki];if(!q){complete();stage.innerHTML=shell(`<div class="game"><div class="gameCard"><div class="score">FINAL SCORE</div><h3>${ks} / ${kah.length}</h3><button class="action" onclick="ki=0;ks=0;rKah()">Play again</button></div></div>`);return}let ch=sh(q[1].map((x,i)=>[x,i===q[2]]));stage.innerHTML=shell(`<div class="game"><div class="gameCard"><div class="score">QUESTION ${ki+1} / ${kah.length} · SCORE ${ks}</div><h3>${q[0]}</h3><div class="answers">${ch.map(x=>`<button onclick="kAnswer(${x[1]})">${x[0]}</button>`).join('')}</div></div></div>`)}function kAnswer(ok){if(ok)ks++;ki++;rKah()}
const renderers=[rWarm,rGuess,rCore,rCards,rSort,rEvents,rAge,rStereo,rBefore,rMatch,rMC,rTF,rSaid,rVocab,rSpeak,rSprint,rBomb,rKah];function render(){renderers[current]()}nav();render();save();
