let si=0,streak=0,score=0,answered=false;

function setFamousAudio(doc){
 const warm=doc.getElementById('warm'); if(!warm||warm.querySelector('#focusAudioQuiz'))return;
 const box=doc.createElement('div'); box.id='focusAudioQuiz'; box.className='focusAudioQuiz';
 box.innerHTML='<div class="focusAudioTop"><h2>FOCUS 2 · Science & Technology + Famous Lives</h2><span>TRACKS 1.24–1.25 · B1+</span></div><div class="focusAudioBody"><div class="focusAudioVisual"><div><b>WHO AM I?</b><small>Focus 2 scientists + famous people you already know</small></div></div><div><button class="focusListen" type="button">▶ LISTEN</button><div class="focusPrompt">The clue is audio only. Listen, then choose the person.</div><div class="focusChoices"></div><div class="focusFact">Listen before choosing.</div><div class="focusProgress"><span class="focusCount"></span><span class="focusScore"></span><button class="focusNext" type="button">Next →</button></div></div></div>';
 warm.querySelector('.famousQuiz')?.insertAdjacentElement('afterend',box);
 let i=0,score=0,heard=false,locked=false;
 const choices=box.querySelector('.focusChoices'),fact=box.querySelector('.focusFact'),listen=box.querySelector('.focusListen');
 function speak(){
   speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(famousMinds[i].q); u.lang='en-GB'; u.rate=.92; u.pitch=.92;
   const voices=speechSynthesis.getVoices(); const preferred=voices.find(v=>/en-GB/i.test(v.lang)&&/male|daniel|george|oliver|ryan/i.test(v.name))||voices.find(v=>/en-GB/i.test(v.lang))||voices.find(v=>/^en/i.test(v.lang)); if(preferred)u.voice=preferred;
   heard=true; speechSynthesis.speak(u);
 }
 function draw(){
   speechSynthesis.cancel(); heard=false;locked=false; fact.textContent='Listen before choosing.'; choices.innerHTML='';
   const q=famousMinds[i]; q.o.forEach(name=>{const b=doc.createElement('button');b.textContent=name;b.onclick=()=>{if(locked)return;if(!heard){fact.textContent='Listen to the clue first.';return}locked=true;if(name===q.a){score++;b.classList.add('good');fact.textContent='Correct. '+q.f+' · '+q.stage}else{b.classList.add('bad');[...choices.children].find(x=>x.textContent===q.a)?.classList.add('good');fact.textContent='Not quite. '+q.f+' · '+q.stage} box.querySelector('.focusScore').textContent='Score '+score+' / '+famousMinds.length};choices.appendChild(b)});
   box.querySelector('.focusCount').textContent=(i+1)+' / '+famousMinds.length;box.querySelector('.focusScore').textContent='Score '+score+' / '+famousMinds.length;
 }
 listen.onclick=speak; box.querySelector('.focusNext').onclick=()=>{i=(i+1)%famousMinds.length;draw()}; speechSynthesis.getVoices(); draw();
}
