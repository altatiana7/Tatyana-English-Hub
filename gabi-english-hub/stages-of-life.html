const shareText=`<p>Right now a toddler is shouting because he doesn’t want to eat his lunch. What are the parents doing? They’re filming the scene on a smartphone. Soon after, they’re posting the video on social media. A teenage boy is playing a new song on his guitar. His mother is filming him. Two days later, the boy discovers that other people are watching the video online.</p><p>Parents in the UK post approximately 1,000 photos of their children online from when they are born until their fifth birthday, a phenomenon called ‘sharenting’. Babies and toddlers don’t care about this at the time. But a study by the University of Michigan suggests that there is a difference with 10- to 17-year-olds. Teenagers don’t always like parents posting some photos. All babies cry, but adolescents don’t want people to see old photos of themselves doing this.</p>`;

ving at home','Fishing'],1],['What surprised Ben?',['Adults dislike work','Adults do not have everything planned','Adults never change jobs'],1]].map(x=>`<div class="item" data-c="${x[2]}"><p>${x[0]}</p><div class="opts">${x[1].map((a,i)=>`<button data-i="${i}">${a}</button>`).join('')}</div></div>`).join('')}</div><div class="checkRow"><button class="check">Check</button><button class="reset">Reset</button><span class="result"></span></div></div><div class="taskPane" data-p="c"><div class="combo34"><div><h2 style="margin:0 0 6px;color:var(--navy)">Task 3 · True / False</h2><div class="mc">${lavaQs.slice(0,4).map(x=>`<div class="item" data-c="${x[2]}"><p>${x[0]}</p><div class="opts">${x[1].map((a,i)=>`<button data-i="${i}">${a}</button>`).join('')}</div></div>`).join('')}</div><div class="checkRow"><button class="check">Check</button><button class="reset">Reset</button><span class="result"></span></div></div><div class="lava"><div class="lavaTop"><b>Task 4 · FLOOR IS LAVA</b><span class="lavaLives">Lives: <span data-lives>3</span></span></div><div class="lavaQ" data-lava-q></div><div class="lavaBtns" data-lava-a></div><div class="lavaFeedback" data-lava-f>Choose before the lava rises.</div><button class="lavaNext" data-lava-next>Next →</button><div class="quote" style="margin-top:9px">Final message: Every stage of life is <input data-a="different">. Some things get <input data-a="easier">, but new <input data-a="problems"> appear too.</div><div class="checkRow"><button class="check" data-gap-check>Check message</button><span class="result" data-gap-result></span></div></div></div></div></section><aside class="panel sideQuiz"><div class="qMeta"><span>LISTENING CHALLENGE</span><span data-qn></span></div><h2>Quick audio check</h2><div class="qText" data-qq></div><div class="qAnswers" data-qa></div><div class="qFeed" data-qf></div><button class="qNext" data-qnext>Next →</button></aside></div></div>`}
function setListening(page){page.innerHTML=listenHTML();let root=page;root.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{root.querySelectorAll('[data-t]').forEach(x=>x.classList.toggle('on',x===b));root.querySelectorAll('[data-p]').forEach(x=>x.classList.toggle('on',x.dataset.p===b.dataset.t))});pick(root);root.querySelectorAll('.taskPane .check:not([data-gap-check])').forEach(b=>b.onclick=()=>checkMC(b.closest('.taskPane')));root.querySelectorAll('.taskPane .reset').forEach(b=>b.onclick=()=>resetMC(b.closest('.taskPane')));root.querySelector('[data-match-check]').onclick=()=>{let n=0,t=0;root.querySelectorAll('[data-p="m"] select').forEach(s=>{t++;let ok=s.selectedOptions[0]?.dataset.ok==='1';s.style.borderColor=ok?'#55a978':'#d96f7d';if(ok)n++});root.querySelector('[data-p="m"] .result').textContent=`${n} / ${t} correct`};root.querySelector('[data-match-reset]').onclick=()=>{root.querySelectorAll('[data-p="m"] select').forEach(s=>{s.value='';s.style.borderColor=''});root.querySelector('[data-p="m"] .result').textContent=''};root.querySelector('[data-gap-check]').onclick=()=>{let n=0;root.querySelectorAll('[data-a]').forEach(i=>{let ok=i.value.trim().toLowerCase()===i.dataset.a;i.style.borderColor=ok?'#55a978':'#d96f7d';if(ok)n++});root.querySelector('[data-gap-result]').textContent=`${n} / 3 correct`};let li=0,lives=3,locked=false;const drawL=()=>{locked=false;let q=lavaQs[li];root.querySelector('[data-lava-q]').textContent=q[0];let a=root.querySelector('[data-lava-a]');a.innerHTML='';q[1].forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{if(locked)return;locked=true;if(i===q[2])root.querySelector('[data-lava-f]').textContent='SAFE! '+q[3];else{lives=Math.max(0,lives-1);root.querySelector('[data-lives]').textContent=lives;root.querySelector('[data-lava-f]').textContent=lives?'LAVA HIT! '+q[3]:'GAME OVER — restart and try again.'}};a.appendChild(b)})};root.querySelector('[data-lava-next]').onclick=()=>{if(lives===0){lives=3;li=0}else li=(li+1)%lavaQs.length;root.querySelector('[data-lives]').textContent=lives;drawL()};drawL();let qi=0,done=false;const drawQ=()=>{done=false;let q=listenQuiz[qi];root.querySelector('[data-qn]').textContent=`${qi+1}/${listenQuiz.length}`;root.querySelector('[data-qq]').textContent=q[0];root.querySelector('[data-qf]').textContent='';let a=root.querySelector('[data-qa]');a.innerHTML='';q[1].forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{if(done)return;done=true;if(i===q[2]){b.classList.add('good');root.querySelector('[data-qf]').textContent='Correct.'}else{b.classList.add('bad');a.children[q[2]].classList.add('good');root.querySelector('[data-qf]').textContent='Check the detail and listen again.'}};a.appendChild(b)})};root.querySelector('[data-qnext]').onclick=()=>{qi=(qi+1)%listenQuiz.length;drawQ()};drawQ()}
function shareHTML(){let defs=[...vocab].sort(()=>Math.random()-.5);return `<div class="sharePage"><div class="upHead"><div><h1>Sharenting · Reading Lab</h1><p>Full text and two compact checked activities under buttons.</p></div><span class="badge">Reading · Vocabulary · Multiple Choice</span></div><div class="shareGrid"><aside class="shareVisual"><div><h2>SHARENTING</h2><p>When family life goes online</p><p><b>Think first:</b> Should parents ask children before posting their photos?</p></div></aside><section class="panel shareMain"><nav class="shareTabs"><button class="on" data-s="text">Read full text</button><button data-s="vocab">Vocabulary Matching</button><button data-s="mc">Multiple Choice</button></nav><div class="sharePane on" data-sp="text"><div class="shareText"><h2 style="margin-top:0;color:var(--navy)">Sharenting: when family life goes online</h2>${shareText}</div></div><div class="sharePane" data-sp="vocab"><p class="smallHint">Match every word with its definition.</p><div class="matchGrid">${vocab.map((x,i)=>`<div class="matchWord"><b>${i+1}. ${x[0]}</b></div><div class="matchDef"><select data-ok="${x[1]}"><option value="">Choose definition…</option>${defs.map(d=>`<option>${d[1]}</option>`).join('')}</select></div>`).join('')}</div><div class="checkRow"><button class="check" data-vcheck>Check</button><button class="reset" data-vreset>Reset</button><span class="result" data-vres></span></div></div><div class="sharePane" data-sp="mc"><p class="smallHint">Choose one answer. All questions are based directly on the text.</p><div class="shareMC">${shareMC.map((x,n)=>`<div class="item" data-c="${x[2]}"><p>${n+1}. ${x[0]}</p><div class="opts">${x[1].map((a,i)=>`<button data-i="${i}">${a}</button>`).join('')}</div></div>`).join('')}</div><div class="checkRow"><button class="check">Check</button><button class="reset">Reset</button><span class="result"></span></div></div></section></div></div>`}
function setShare(page){page.innerHTML=shareHTML();let r=page;r.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{r.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));r.querySelectorAll('[data-sp]').forEach(x=>x.classList.toggle('on',x.dataset.sp===b.dataset.s))});pick(r);r.querySelector('[data-sp="mc"] .check').onclick=()=>checkMC(r.querySelector('[data-sp="mc"]'));r.querySelector('[data-sp="mc"] .reset').onclick=()=>resetMC(r.querySelector('[data-sp="mc"]'));r.querySelector('[data-vcheck]').onclick=()=>{let n=0,t=0;r.querySelectorAll('[data-sp="vocab"] select').forEach(s=>{t++;let ok=s.value===s.dataset.ok;s.style.borderColor=ok?'#55a978':'#d96f7d';if(ok)n++});r.querySelector('[data-vres]').textContent=`${n} / ${t} correct`};r.querySelector('[data-vreset]').onclick=()=>{r.querySelectorAll('[data-sp="vocab"] select').forEach(s=>{s.value='';s.style.borderColor=''});r.querySelector('[data-vres]').textContent=''}}
function fixMenuNumbers(doc){
  const sel=doc.getElementById('sel');
  if(!sel)return;
  const labels={
    warm:'1. Warm-up · Famous Lives',
    age:'2. Age & Life Stages Game',
    puzzle:'3. Age & Life Stages · B1 Test',
    read:'4. Sharenting',
    habits:'5. Grammar · Habits',
    stative:'6. Stative Verbs',
    textbook:'7. Celebrity Kids + Family Dinners',
    listen:'8. Listening Lab',
    use:'9. Final Kahoot Revision'
  };
  [...sel.options].forEach(o=>{if(labels[o.value])o.textContent=labels[o.value]});
}
function findShare(doc){return [...doc.querySelectorAll('.page')].find(p=>/Sharenting/i.test(p.textContent||'')&&!/Word Formation/i.test(p.textContent||''))}
function upgrade(doc){style(doc);fixMenuNumbers(doc);let ap=doc.getElementById('listen')||[...doc.querySelectorAll('.page')].find(p=>/Listening Lab/i.test(p.textContent||''));if(ap&&!ap.dataset.v2){ap.dataset.v2='1';setListening(ap)}let sp=findShare(doc);if(sp&&!sp.dataset.v2){sp.dataset.v2='1';setShare(sp)}}
frame.onload=()=>{let d=frame.contentDocument;upgrade(d);document.getElementById('loading').classList.add('hide');let n=0,t=setInterval(()=>{upgrade(d);if(++n>30)clearInterval(t)},300);new MutationObserver(()=>upgrade(d)).observe(d.documentElement,{childList:true,subtree:true})};
window.addEventListener('message',e=>{if(e.source===frame.contentWindow)parent.postMessage(e.data,location.origin);else if(e.source===parent&&parent!==window)frame.contentWindow?.postMessage(e.data,location.origin)});
})();
</script>
