<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ten Faces, Ten Questions</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one classroom screen at a time — a wall of ten faces, then one big face with two giant verdict buttons. Single navy look, sized for the back row. */
:root{
  color-scheme:dark;
  --navy:#14254a; --navy-deep:#0d1a36; --panel:#1d3263; --line:#33497f;
  --cream:#fff5df; --muted:#aab8d8;
  --sun:#ffc93c; --teal:#35cfc8; --go:#45c977; --stop:#f0645f;
  --ink:#16203a; --paper:#fffdf7; --paper-line:#b9bfcc;
  --display:"Montserrat","Arial",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
body{background:var(--navy-deep);color:var(--cream);font-family:var(--body);font-size:18px;line-height:1.5;margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:20px 48px;display:flex;flex-direction:column;gap:24px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.05}

/* top bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:15px;color:var(--teal)}
.where{display:flex;flex-wrap:wrap;gap:8px;margin-right:auto}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 14px;font-weight:600;font-size:15px}
.nav{display:flex;flex-wrap:wrap;gap:8px}
.btn{border-radius:14px;padding:10px 18px;font-weight:700;background:var(--panel);border:2px solid var(--line)}
.btn:hover{border-color:var(--teal)}
.btn.sun{background:var(--sun);color:var(--ink);border-color:var(--sun)}
.btn.on{background:var(--teal);border-color:var(--teal);color:var(--ink)}
.btn.big{font-family:var(--display);font-size:24px;padding:16px 30px;border-radius:18px}

/* home */
.hero{background:var(--navy);border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:20px}
.hero h1{font-size:clamp(40px,7.4vw,84px);font-weight:700}
.hero h1 b{color:var(--sun);font-weight:700}
.hero p{margin:0;font-size:clamp(18px,2.2vw,24px);color:var(--muted);max-width:34em}
.strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px}
.strip img{display:block;width:100%;height:auto;border-radius:10px}
.pick{display:flex;flex-direction:column;gap:12px}
.pick h2{font-size:22px;font-weight:600;color:var(--muted)}
.topics{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.topic{text-align:left;background:var(--navy);border:3px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.topic strong{font-family:var(--display);font-size:22px;line-height:1.15}
.topic span{color:var(--muted);font-size:15px}
.topic[aria-pressed="true"]{border-color:var(--sun);background:var(--panel)}
.topic[aria-pressed="true"] strong{color:var(--sun)}
.levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.start{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* wall of faces */
.wallhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px}
.wallhead h2{font-size:clamp(28px,4vw,44px);font-weight:700}
.wallhead p{margin:0;color:var(--muted)}
.wall{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.face{position:relative;background:var(--navy);border:5px solid var(--line);border-radius:22px;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .15s}
.face:hover:not(:disabled){transform:translateY(-4px);border-color:var(--teal)}
.face img{display:block;width:100%;height:auto}
.face .nm{font-family:var(--display);font-weight:600;font-size:clamp(18px,2vw,24px);padding:8px 6px 10px}
.face .tag{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:22px;color:var(--ink)}
.face[data-m="got"]{border-color:var(--go)} .face[data-m="got"] .tag{background:var(--go)}
.face[data-m="not"]{border-color:var(--stop)} .face[data-m="not"] .tag{background:var(--stop)}
.face:disabled{cursor:default;opacity:.55}
.score{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.score .chip b{font-variant-numeric:tabular-nums}

/* one question */
.ask{background:var(--navy);border-radius:28px;padding:24px;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);gap:28px;align-items:center}
.who{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center}
.who img{display:block;width:100%;height:auto;border-radius:22px;border:5px solid var(--teal)}
.who h2{font-size:clamp(30px,4vw,46px);font-weight:700}
.waves{display:flex;gap:5px;align-items:center;height:34px}
.waves i{width:6px;height:8px;border-radius:3px;background:var(--teal)}
.talking .waves i{animation:wv .7s ease-in-out infinite}
.waves i:nth-child(2){animation-delay:.1s}.waves i:nth-child(3){animation-delay:.2s}.waves i:nth-child(4){animation-delay:.3s}.waves i:nth-child(5){animation-delay:.15s}.waves i:nth-child(6){animation-delay:.05s}
@keyframes wv{50%{height:32px}}
.say{display:flex;flex-direction:column;gap:18px;min-width:0}
.tools{display:flex;flex-wrap:wrap;gap:10px}
.qbox{min-height:150px;border:3px dashed var(--line);border-radius:22px;padding:22px;display:grid;place-items:center;text-align:center}
.qbox p{margin:0;font-family:var(--display);font-weight:600;font-size:clamp(26px,3.8vw,48px);line-height:1.15;text-wrap:balance}
.qbox.hid p{color:var(--muted);font-size:clamp(20px,2.4vw,28px);font-weight:500}
.verdict{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.verdict button{font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,56px);padding:26px 12px;border-radius:26px;color:var(--ink)}
.verdict .got{background:var(--go)} .verdict .not{background:var(--stop)}
.verdict button:hover{filter:brightness(1.08)}
.note{margin:0;color:var(--sun);font-size:16px}

/* results */
.res{background:var(--navy);border-radius:28px;padding:32px;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
.res .num{font-family:var(--display);font-weight:700;font-size:clamp(72px,14vw,150px);line-height:.9;color:var(--sun);font-variant-numeric:tabular-nums}
.res .num small{font-size:.45em;color:var(--cream)}
.res h2{font-size:clamp(26px,3.6vw,40px)}
.mini{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:8px;width:100%}
.mini div{border-radius:10px;overflow:hidden;border:4px solid var(--line)}
.mini div[data-m="got"]{border-color:var(--go)} .mini div[data-m="not"]{border-color:var(--stop)}
.mini img{display:block;width:100%;height:auto}

/* all ten */
.all{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.all li{background:var(--navy);border-radius:20px;padding:12px 16px;display:grid;grid-template-columns:128px minmax(0,1fr) auto;gap:16px;align-items:center}
.all img{display:block;width:100%;height:auto;border-radius:12px}
.all .t{min-width:0}
.all .t small{display:block;color:var(--teal);font-weight:700;font-size:15px}
.all .t span{font-family:var(--display);font-weight:500;font-size:clamp(20px,2.6vw,30px);line-height:1.2}
.play{width:56px;height:56px;border-radius:50%;background:var(--teal);display:grid;place-items:center}
.play svg{width:26px;height:26px}

/* worksheet: a sheet of paper lying on the navy desk */
.paper{background:var(--paper);color:var(--ink);border-radius:8px;padding:32px;display:flex;flex-direction:column;gap:18px;font-size:16px}
.paper h2{font-size:28px} .paper h3{font-size:20px;margin-top:6px}
.paper .meta{display:flex;flex-wrap:wrap;gap:8px 28px}
.paper .meta span{flex:1 1 180px;border-bottom:1.5px solid var(--paper-line);padding-bottom:2px}
.paper ol{margin:0;padding-left:26px;display:flex;flex-direction:column;gap:14px}
.paper li{break-inside:avoid}
.paper .q{font-weight:700}
.rule{border-bottom:1.5px solid var(--paper-line);height:30px}
.paper p{margin:0}
.partB{display:flex;flex-direction:column;gap:16px;break-before:page}

@media (max-width:760px){
  .wall{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strip,.mini{grid-template-columns:repeat(5,minmax(0,1fr))}
  .ask{grid-template-columns:minmax(0,1fr);padding:18px}
  .who img{max-width:320px}
  .hero,.res{padding:22px}
  .all li{grid-template-columns:84px minmax(0,1fr) auto;gap:12px}
  .paper{padding:20px}
}
@media (prefers-reduced-motion:reduce){.talking .waves i{animation:none}.face{transition:none}}
@media print{
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .bar,.sheet-tools{display:none!important}
  .paper{border-radius:0;padding:0}
}
</style>
</head>

y for teenagers?", "What is the biggest problem that the elderly face today?", "Would you like to be a celebrity? What is the worst thing about fame?", "What was Marie Curie's job, and what did she name after her homeland?", "What is the difference between an adolescent and an adult?"], ["Is it fair that the children of famous people are photographed and discussed in public?", "Should parents post photos of their children online without asking them?", "Why do some people have stereotypical ideas about the elderly, and how can we change them?", "Is ageism a problem for teenagers as well as for older people? Give an example.", "Does a difficult childhood make a person stronger or weaker? Think of Beethoven.", "At what age should a person be treated as an adult, and why?", "What can teenagers and elderly people teach each other?", "Is it harder to be a teenager today than it was for your parents? Explain.", "Which matters more for success: talent, determination or family support?", "How do you imagine yourself at seventy? What will you be like?"]]},

function loadV(){try{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){}}

function speak(i){

  }catch(e){}
}

  </section>
  <section class="pick"><h2>Pick a level</h2>
    <div class="levels">${(ED[S.ed].lv||LV).map((l,i)=>`<button class="topic" data-lv="${i}" aria-pressed="${S.lv===i}"><strong>${lvn(i)}</strong><span>${lvd(i)}</span></button>`).join("")}</div>
  </section>
  <div class="start"><button class="btn sun big" data-start>Start: ${ED[S.ed].t}, ${lvn(S.lv)}</button></div>
 </div>`,
 wall:()=>`<div class="wrap" style="padding:0">
  <div class="wallhead"><h2>${S.redo?"Second chance":"Tap a face"}</h2><p>${S.redo?"Only the questions marked Not yet are open.":"Listen. Answer. Try again."}</p></div>
  <div class="wall">${P.map((p,i)=>`<button class="face" data-face="${i}" data-m="${S.marks[i]||""}" ${S.redo&&S.marks[i]==="got"?"disabled":""}>
    ${avatar(p)}<span class="nm">${p.n}</span>${S.marks[i]?`<span class="tag">${S.marks[i]==="got"?"✓":"✗"}</span>`:""}</button>`).join("")}</div>
  <div class="score"><span class="chip">Got it <b>${got()}</b></span><span class="chip">Not yet <b>${missed()}</b></span><span class="chip">Left <b>${10-got()-missed()}</b></span>
    ${S.marks.every(Boolean)?`<button class="btn sun" data-go="res">See the results</button>`:""}</div>
 </div>`,
 ask:()=>{const i=S.cur,p=P[i],show=S.reveal||!canSpeak;return `<section class="ask">
  <div class="who">${avatar(p)}<h2>${p.n}</h2><div class="waves" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div></div>
  <div class="say">
    <div class="tools">
      <button class="btn sun" data-again>Listen again</button>
      <button class="btn${S.slow?" on":""}" data-slow aria-pressed="${S.slow}">Slower</button>
      <button class="btn${S.reveal?" on":""}" data-reveal aria-pressed="${S.reveal}">${S.reveal?"Hide the question":"Show the question"}</button>
    </div>
    ${canSpeak?"":`<p class="note">This browser cannot read aloud, so the question is shown. Read it to the class.</p>`}
    <div class="qbox${show?"":" hid"}"><p>${show?qs()[i]:"The question is hidden. Just listen."}</p></div>
  </div>
  <div class="verdict"><button class="got" data-mark="got">Got it</button><button class="not" data-mark="not">Not yet</button></div>
 </section>`},
 res:()=>{const g=got(),m=missed();return `<section class="res">
  <div class="num">${g}<small> / 10</small></div>
  <h2>${m===0?"Every question caught.":g>=7?"Strong ears. "+m+" to try again.":m+" questions slipped past. Hear them again."}</h2>
  <div class="mini">${P.map((p,i)=>`<div data-m="${S.marks[i]||""}">${avatar(p)}</div>`).join("")}</div>
  <div class="start">
    ${m?`<button class="btn sun big" data-redo>Redo the ${m} missed</button>`:""}
    <button class="btn" data-replay>Play this round again</button>
    ${S.lv<ED[S.ed].q.length-1?`<button class="btn" data-next>Next: ${lvn(S.lv+1)}</button>`:""}
    <button class="btn" data-go="all">See all 10 questions</button>
  </div>
 </section>`},
 all:()=>`<div class="wrap" style="padding:0">
  <div class="wallhead"><h2>All 10 questions</h2><p>Now interview each other. One rule: ask one more question about your partner's answer.</p></div>
  <ol class="all">${qs().map((q,i)=>`<li>${avatar(P[i])}<div class="t"><small>${P[i].n}</small><span>${q}</span></div>
    <button class="play" data-say="${i}" aria-label="Hear ${P[i].n}'s question">${SPK}</button></li>`).join("")}</ol>
 </div>`,
 sheet:()=>`<div class="wrap" style="padding:0">
  <div class="start sheet-tools"><button class="btn${S.showQ?" on":""}" data-showq aria-pressed="${S.showQ}">${S.showQ?"Questions shown":"Blank: students write what they hear"}</button><button class="btn sun" data-print>Print</button></div>
  <article class="paper">
    <h2>10 Question Challenge: ${ED[S.ed].t}</h2>
    <div class="meta"><span>Name:</span><span>Date:</span><span>Level: ${lvn(S.lv)}</span></div>
    <h3>Part A. Listen, write, answer</h3>
    <p>Write the question you hear. Then write your own full answer with a reason or an example.</p>
    <ol>${qs().map(q=>`<li>${S.showQ?`<div class="q">${q}</div>`:`<div class="rule"></div>`}<div class="rule"></div><div class="rule"></div></li>`).join("")}</ol>
    <div class="partB">
      <h3>Part B. Ask a partner</h3>
      <p>Choose three questions. Ask your partner and write down what they say.</p>
      <ol>${[1,2,3].map(()=>`<li><div>Question I asked:</div><div class="rule"></div><div>My partner said:</div><div class="rule"></div><div class="rule"></div><div class="rule"></div></li>`).join("")}</ol>
    </div>
  </article>
 </div>`
};
document.addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b)return; const d=b.dataset;
  if("go" in d)return go(d.go);
  if("ed" in d){S.ed=+d.ed;S.lv=Math.min(S.lv,ED[S.ed].q.length-1);return render()}
  if("lv" in d){S.lv=+d.lv;return render()}
  if("start" in d){newRound();return go("wall")}
  if("face" in d){S.cur=+d.face;S.reveal=false;go("ask");return speak(S.cur)}
  if("again" in d)return speak(S.cur);
  if("slow" in d){S.slow=!S.slow;render();return speak(S.cur)}
  if("reveal" in d){S.reveal=!S.reveal;return render()}
  if("mark" in d){S.marks[S.cur]=d.mark;return go(S.marks.every(Boolean)?"res":"wall")}
  if("redo" in d){S.marks=S.marks.map(m=>m==="not"?null:m);S.redo=true;return go("wall")}
  if("replay" in d){newRound();return go("wall")}
  if("next" in d){S.lv++;newRound();return go("wall")}
  if("say" in d)return speak(+d.say);
  if("print" in d)return window.print();
  if("showq" in d){S.showQ=!S.showQ;return render()}
});
function start(data){if(data&&data.marks)S=Object.assign(S,data);
  try{const u=new URLSearchParams(location.search),lv=u.get('lv');if(lv!==null&&ED[0].q[+lv]){S.ed=0;S.lv=+lv;newRound();S.view='wall'}}catch(e){}
  render()}
const hot=window.claude&&window.claude.hot;
if(hot&&hot.snapshot)hot.snapshot(()=>S);
if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
</script>
</body>
</html>
