<title>Gabi · Unit 1 · Test yourself</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">

<script src="skills.js?v=20261007e"></script>
<script>
/* Gateway to the World B1 · Unit 1 · Test yourself, Student's Book p17 (key: Teacher's Book p21). 40 points. */
const Z=['-','–','—','no article','no','x','0','nothing'];
Lesson.boot({kicker:'Test yourself · Unit 1',steps:[
{stage:'Grammar',title:'Verb forms',hint:'Complete the table: he / she / it form, then the -ing form. <small>Half a point each.</small>',
 act:{type:'gaps',test:true,cols:2,items:[
  {pre:'watch → she',ans:['watches']},{pre:'watch → -ing',ans:['watching']},{pre:'lie → she',ans:['lies']},{pre:'lie → -ing',ans:['lying']},{pre:'write → she',ans:['writes']},{pre:'write → -ing',ans:['writing']},{pre:'cry → she',ans:['cries']},{pre:'cry → -ing',ans:['crying']},{pre:'get → she',ans:['gets']},{pre:'get → -ing',ans:['getting']}]}},
{stage:'Grammar',title:'Simple or continuous?',hint:'Choose the correct alternative.',
 act:{type:'quiz',label:'Sentence',shuffle:false,items:[
  {q:'He’s ___ a new pair of jeans today.',o:['wears','carries','wearing','carrying'],a:'wearing',why:'Today, at the moment: present continuous.'},
  {q:'When ___ your sister have English lessons?',o:['is','do','does','has'],a:'does',why:'A routine, third person: does.'},
  {q:'I’m not sure if he ___ French or German right now.',o:['studies','are studying','study','’s studying'],a:'’s studying',why:'Right now: present continuous.'},
  {q:'Where’s your cousin? He normally ___ on time.',o:['come','is arriving','arrives','is coming'],a:'arrives',why:'Normally: present simple with -s.'},
  {q:'Stop talking to her because she ___ to you.',o:['don’t listen','listens','’s listening','never listens'],a:'never listens',why:'A habit that is always true.'},
  {q:'Why ___ she doing anything?',o:['hasn’t','isn’t','doesn’t','don’t'],a:'isn’t',why:'Present continuous question: isn’t + -ing.'}]}},
{stage:'Grammar',title:'State and action verbs',hint:'Present simple or present continuous? Type the verb form.',
 act:{type:'gaps',test:true,items:[
  {post:'(you / understand) state and action verbs?',ans:['do you understand']},
  {pre:'I',post:'(hate) it when I make a simple mistake.',ans:['hate']},
  {pre:'Don’t disturb me! I',post:'(think) about how to answer this question.',ans:['am thinking',"'m thinking",'’m thinking','m thinking',"i'm thinking",'i’m thinking','i am thinking']},
  {pre:'To do this, you',post:'(need) to concentrate.',ans:['need']},
  {pre:'Who',post:'(know) how to translate this?',ans:['knows']}]}},
{stage:'Grammar',title:'Articles',hint:'Type a, the or a dash (-) for no article.',
 act:{type:'gaps',test:true,cols:2,items:[
  {pre:'It’s',post:'beautiful day …',ans:['a']},{pre:'… and',post:'sun is shining.',ans:['the']},
  {post:'young girl walks into a restaurant.',ans:['a']},{post:'girl sits down and orders a pizza.',ans:['the']},
  {pre:'My cousin loves',post:'books.',ans:Z},{pre:'He’s',post:'writer.',ans:['a']},
  {pre:'Pete’s uncle is',post:'doctor.',ans:['a']},{pre:'He says',post:'exercise is good for you.',ans:Z}]}},
{stage:'Vocabulary',title:'Family words',hint:'Read the definition and type the word.',
 act:{type:'gaps',test:true,cols:2,dense:true,items:[
  {pre:'a young child who is starting to walk',long:1,ans:['toddler','a toddler']},
  {pre:'the father of your husband',long:1,ans:['father-in-law','father in law']},
  {pre:'your mother’s new husband in a second or later marriage',long:1,ans:['stepfather','step father','stepdad']},
  {pre:'to describe someone who is not married',long:1,ans:['single']},
  {pre:'to describe a family with only a father or a mother',long:1,ans:['one-parent','one parent','single-parent','single parent','one-parent family','one parent family']},
  {pre:'when you have no brothers or sisters',long:1,ans:['only child','an only child']},
  {pre:'someone who is over 65',long:1,ans:['senior citizen','a senior citizen']},
  {pre:'your close family',long:1,ans:['immediate family','immediate']},
  {pre:'the daughter of your uncle',long:1,ans:['cousin','a cousin']}]}},
{stage:'Vocabulary',title:'Noun suffixes',hint:'Type the noun: -ment, -ion or -ence.',
 act:{type:'gaps',test:true,cols:2,items:[
  {pre:'adolescent →',ans:['adolescence']},{pre:'argue →',ans:['argument']},{pre:'confident →',ans:['confidence']},{pre:'enjoy →',ans:['enjoyment']},{pre:'explain →',ans:['explanation']},{pre:'permit →',ans:['permission']},{pre:'solve →',ans:['solution']}]}},
{stage:'Result',title:'Your total',hint:'Unit 1 · Test yourself',
 act:{type:'total',parts:[{step:0,label:'Verb forms',max:5,half:true},{step:1,label:'Simple or continuous?',max:6},{step:2,label:'State and action verbs',max:5},{step:3,label:'Articles',max:8},{step:4,label:'Family words',max:9},{step:5,label:'Noun suffixes',max:7}]}}
]});
</script>
</body>
</html>
