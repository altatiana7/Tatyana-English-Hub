<title>Gabi · Module 2 · Lesson 3 · The Justice Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap">

<body>
<script src="skills.js?v=20261012e"></script>
<script>
/* Module 2 (Law and order), lesson 3: The Justice Challenge (Tatyana's Law & Order pack, block 3). Two activities per screen:
   1 fair or unfair + match punishment words -> 2 School Court (verdict, new evidence) + judge questions (from Nikita's courtroom)
   -> 3 school rules with dropdowns + his own three rules -> 4 defend the rules + Module 2 Jeopardy review. */
const COURT=(t)=>`<div class="court"><h4>${t}</h4><span class="stamp">SCHOOL COURT</span></div>`;
const MENU=COURT('Choose a consequence')+`<div class="cons"><span>a warning</span><span>an apology</span><span>repairing the damage</span><span>community service</span><span>no punishment</span></div>
<ul class="say"><li><b>I think</b> the fair consequence is … <b>because</b> …</li><li><b>However,</b> he / she still should …</li><li><b>Now that we know</b> …, I’d change my verdict to …</li></ul>`;
const RULES=COURT('Rules and advice')+`<ul class="say"><li><b>must</b> = it is a rule / it is necessary</li><li><b>mustn’t</b> = it is not allowed</li><li><b>have to</b> = a rule or an obligation</li><li><b>don’t have to</b> = it is not necessary, you can choose</li><li><b>should / shouldn’t</b> = advice, it is a good idea / a bad idea</li></ul>`;
const LAW=COURT('Headteacher for a day')+`<ul class="say"><li>At my school, students <b>must</b> …</li><li>Students <b>shouldn’t</b> … <b>because</b> …</li><li>Students <b>don’t have to</b> …</li><li><b>If</b> someone breaks this rule, they <b>should</b> …</li></ul>`;
Lesson.boot({kicker:'Module 2 · Lesson 3',steps:[
{stage:'Warm-up',title:'Fair or unfair?',hint:'Agree, disagree or it depends? Give a reason and an example. <small>Then match the words you need to talk about punishment.</small>',cols:'1.1fr 1fr',
 acts:[
 {type:'talk',title:'Fair or unfair?',label:'Statement',secs:30,keepChips:true,chipLabel:'Tap each phrase he uses',chips:['I agree because …','I disagree because …','It depends on …','For example, …'],cards:[
  {q:'Students mustn’t use their phones during lessons.'},
  {q:'If one student breaks a rule, the whole class should be punished.'},
  {q:'Students should be allowed to correct their mistakes.'},
  {q:'Teachers and students should follow the same rules.'}]},
 {type:'match',title:'Crime and punishment',tip:'Tap a word, then its meaning.',items:[
  {l:'steal',r:'take something that belongs to another person'},
  {l:'vandalism',r:'damaging other people’s property on purpose'},
  {l:'a fine',r:'money you pay as a punishment'},
  {l:'community service',r:'unpaid work that helps the local community'},
  {l:'accuse',r:'say that someone has done something wrong'},
  {l:'punish',r:'make someone face a consequence'}]}]},
{stage:'Court',title:'The School Court',hint:'You are the judge. Give a verdict, then open the new evidence. <small>A good judge also asks the right questions.</small>',split:'minmax(0,.62fr) minmax(0,1.38fr)',cols:'1.2fr 1fr',
 side:{look:'case',card:MENU},
 acts:[
 {type:'explain',title:'Five cases',label:'Case',endLabel:'The five cases',wait:'Gabi gives his verdict first. Then open the new evidence.',revealLabel:'New evidence',doneLabel:'All the cases',items:[
  {k:'none',name:'The Phone Thief',sum:'The phone came back undamaged, with an apology.',ask:'A student hides a classmate’s phone as a joke for two hours. The owner thinks it has been stolen. <b>What is a fair consequence?</b>',head:'New evidence',rule:'The phone was returned undamaged and the student apologised immediately.',eg:'Does the apology change your verdict?'},
  {k:'none',name:'The Broken Window',sum:'One friend wanted to tell, the other said no.',ask:'Two friends are playing football near the school. One of them accidentally breaks a window. Neither tells a teacher. <b>What is a fair consequence?</b>',head:'New evidence',rule:'One student wanted to report the accident, but the other convinced him to stay quiet.',eg:'Should both friends get the same consequence?'},
  {k:'none',name:'The Exam Cheat',sum:'The student admitted it before the check.',ask:'During an important test, a student copies three answers. The student is afraid of disappointing their parents. <b>What is a fair consequence?</b>',head:'New evidence',rule:'The student admits cheating before the teacher checks the tests.',eg:'Is honesty a reason for a smaller punishment?'},
  {k:'none',name:'The Graffiti Artist',sum:'The art teacher offered an approved mural.',ask:'A teenager paints a large picture on a school wall without permission. Some students love it. The headteacher wants it removed. <b>What is a fair consequence?</b>',head:'New evidence',rule:'The art teacher offers to help create a new mural in an approved area.',eg:'Is this a punishment or a solution?'},
  {k:'none',name:'The False Accusation',sum:'The headphones were at home; no apology.',ask:'A student accuses a classmate of stealing headphones. Later, the headphones are found at home. <b>What should happen now?</b>',head:'New evidence',rule:'The student who made the accusation refuses to apologise.',eg:'Is accusing someone without proof a kind of wrong too?'}]},
 {type:'quiz',title:'Ask the right question',label:'Question',cols:1,items:[
  {q:'Witness: “I saw someone running away.” What should the judge ask?',o:['Did you see the person’s face?', 'Do you like running?', 'What is your favourite colour?'],a:'Did you see the person’s face?',why:'A useful question checks the facts.'},
  {q:'Student: “I didn’t steal the phone. I only hid it.” The best follow-up?',o:['Why did you hide it?', 'Where do you live?', 'Is your phone expensive?'],a:'Why did you hide it?',why:'Ask about the reason.'},
  {q:'Witness: “It was very dark.” The best follow-up?',o:['How far away were you?', 'Do you like the dark?', 'What did you have for lunch?'],a:'How far away were you?',why:'Can the witness really see?'},
  {q:'Teacher: “The window was broken at lunchtime.” The best question?',o:['Who was near the window at lunchtime?', 'Why are windows made of glass?', 'Do you like football?'],a:'Who was near the window at lunchtime?',why:'Find the people who were there.'}]}]},
{stage:'Grammar',title:'Rules and advice',hint:'Choose the right verb in the school rules. Then write three rules for your own school.',split:'minmax(0,.6fr) minmax(0,1.4fr)',cols:'1.15fr 1fr',
 side:{look:'case',card:RULES},
 acts:[
 {type:'gaps',title:'Our school rules',inline:true,tail:' use your phone during a test.',items:[
  {pre:'Students',opts:['mustn’t', 'don’t have to', 'should'],ans:['mustn’t'],ph:'…'},
  {pre:' steal other people’s things. You',opts:['should', 'mustn’t', 'don’t have to'],ans:['should'],ph:'…'},
  {pre:' apologise when you hurt someone’s feelings. We',opts:['have to', 'might', 'shouldn’t'],ans:['have to'],ph:'…'},
  {pre:' wear a uniform: it’s a school rule. You',opts:['don’t have to', 'must', 'mustn’t'],ans:['don’t have to'],ph:'…'},
  {pre:' call the police for every small argument. Teachers',opts:['should', 'mustn’t', 'don’t have to'],ans:['should'],ph:'…'},
  {pre:' listen to both sides before deciding. On Saturdays we',opts:['don’t have to', 'mustn’t', 'must'],ans:['don’t have to'],ph:'…'},
  {pre:' come to school. You',opts:['mustn’t', 'don’t have to', 'should'],ans:['mustn’t'],ph:'…'}]},
 {type:'gaps',title:'Headteacher for a day',free:true,items:[
  {pre:'Rule 1 · something students must do',ph:'At my school, students must … because …'},
  {pre:'Rule 2 · something students shouldn’t or mustn’t do',ph:'Students mustn’t … because …'},
  {pre:'Rule 3 · what happens if someone breaks a rule',ph:'If someone …, they should …'}]}]},
{stage:'Speak',title:'Defend your law and review',hint:'Present and defend your rules. Then the Module 2 Jeopardy: pick a category and points.',cols:'1fr 1.1fr',
 acts:[
 {type:'talk',title:'Defend your law',label:'Task',secs:60,keepChips:true,chipLabel:'Tap each phrase he uses',chips:['must / mustn’t','have to / don’t have to','should','because …','However, …'],cards:[
  {q:'Present your three rules and explain why your school needs them.'},
  {q:'Your teacher says: “Rule 1 is unfair.” Defend it with two arguments.'},
  {q:'Which consequence from the School Court is the fairest for your rule 3? Why?'}]},
 {type:'jeopardy',title:'Module 2 Jeopardy',cats:[{name:'Crimes',qs:[{q:'Stealing from a shop',a:'shoplifting'},{q:'Breaking into a house to steal',a:'burglary'},{q:'Starting a fire on purpose',a:'arson'}]},{name:'Detectives',qs:[{q:'A person who saw the crime',a:'a witness'},{q:'Proof that you were somewhere else',a:'an alibi'},{q:'The noun from INVESTIGATE',a:'investigation'}]},{name:'Past tenses',qs:[{q:'The past of STEAL',a:'stole'},{q:'At 3:30 Ben ___ (wait) outside.',a:'was waiting'},{q:'Correct it: “What did you doing?”',a:'What were you doing?'}]},{name:'Rules',qs:[{q:'It is not allowed: you ___ cheat.',a:'mustn’t'},{q:'It is not necessary: you ___ wear a tie.',a:'don’t have to'},{q:'The past of MUST',a:'had to'}]}]}]}
]});
</script>
</body>
</html>
