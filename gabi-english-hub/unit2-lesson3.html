<title>Gabi · Unit 2 · Lesson 3 · The Justice Challenge</title>

<body>
<script src="skills.js?v=20261012b"></script>
<script>
/* Unit 2 (Law and order), lesson 3: The Justice Challenge (Tatyana's Law & Order pack, block 3).
   Fair or unfair -> crime and punishment words -> the School Court (five cases, verdict, new evidence, verdict again)
   -> rules and advice (must / mustn't / have to / don't have to / should) -> his own school law, defended aloud. */
const COURT=(t)=>`<div class="court"><h4>${t}</h4><span class="stamp">SCHOOL COURT</span></div>`;
const MENU=COURT('Choose a consequence')+`<div class="cons"><span>a warning</span><span>an apology</span><span>repairing the damage</span><span>community service</span><span>no punishment</span></div>
<ul class="say"><li><b>I think</b> the fair consequence is … <b>because</b> …</li><li><b>It wasn’t</b> on purpose, <b>so</b> …</li><li><b>However,</b> he / she still should …</li><li><b>Now that we know</b> …, I’d change my verdict to …</li></ul>`;
const RULES=COURT('Rules and advice')+`<ul class="say"><li><b>must</b> = it is a rule / it is necessary</li><li><b>mustn’t</b> = it is not allowed</li><li><b>have to</b> = a rule or an obligation</li><li><b>don’t have to</b> = it is not necessary, you can choose</li><li><b>should / shouldn’t</b> = advice, it is a good idea / a bad idea</li></ul>`;
const LAW=COURT('Headteacher for a day')+`<ul class="say"><li>At my school, students <b>must</b> …</li><li>Students <b>shouldn’t</b> … <b>because</b> …</li><li>Students <b>don’t have to</b> …</li><li><b>If</b> someone breaks this rule, they <b>should</b> …</li></ul>`;
Lesson.boot({kicker:'Unit 2 · Lesson 3',steps:[
{stage:'Warm-up',title:'Fair or unfair?',hint:'Agree, disagree, or it depends? <small>30 seconds: a reason and an example.</small>',
 side:{look:'case',card:COURT('Fair or unfair?')+`<ul class="say"><li><b>I agree</b> because …</li><li><b>I disagree</b> because …</li><li><b>It depends on</b> …</li><li><b>For example,</b> in my class …</li></ul>`},
 act:{type:'talk',label:'Statement',secs:30,keepChips:true,chipLabel:'Tap each phrase he uses',chips:['I agree because …','I disagree because …','It depends on …','For example, …'],cards:[
  {q:'Students mustn’t use their phones during lessons.'},
  {q:'If one student breaks a rule, the whole class should be punished.'},
  {q:'Students should be allowed to correct their mistakes.'},
  {q:'Teachers and students should follow the same rules.'}]}},
{stage:'Words',title:'Crime and punishment',hint:'Write the word. The first letter is there to help.',
 act:{type:'gaps',cols:2,items:[
  {pre:'Take something that belongs to another person: s',post:'',ans:['teal','steal']},
  {pre:'Damaging other people’s property on purpose: v',post:'',ans:['andalism','vandalism']},
  {pre:'Money you pay as a punishment: a f',post:'',ans:['ine','fine']},
  {pre:'Unpaid work that helps the local community: c',post:'service',ans:['ommunity','community']},
  {pre:'Say that someone has done something wrong: a',post:'',ans:['ccuse','accuse']},
  {pre:'Make someone face a consequence for breaking a rule: p',post:'',ans:['unish','punish']},
  {pre:'The noun from PUNISH: a p',post:'',ans:['unishment','punishment']},
  {pre:'The opposite of guilty: i',post:'',ans:['nnocent','innocent']}]}},
{stage:'Court',title:'The School Court',hint:'You are the judge. Read the case and give a verdict. <small>Then open the new evidence. Would you change your verdict?</small>',
 side:{look:'case',card:MENU},
 act:{type:'explain',label:'Case',endLabel:'The five cases',wait:'Gabi gives his verdict first. Then open the new evidence.',revealLabel:'New evidence',doneLabel:'All the cases',items:[
  {k:'none',name:'The Phone Thief',sum:'The phone came back undamaged, with an apology.',ask:'A student hides a classmate’s phone as a joke for two hours. The owner thinks it has been stolen. <b>What is a fair consequence?</b>',head:'New evidence',rule:'The phone was returned undamaged and the student apologised immediately.',eg:'Does the apology change your verdict?'},
  {k:'none',name:'The Broken Window',sum:'One friend wanted to tell, the other said no.',ask:'Two friends are playing football near the school. One of them accidentally breaks a window. Neither tells a teacher. <b>What is a fair consequence?</b>',head:'New evidence',rule:'One student wanted to report the accident, but the other convinced him to stay quiet.',eg:'Should both friends get the same consequence?'},
  {k:'none',name:'The Exam Cheat',sum:'The student admitted it before the check.',ask:'During an important test, a student copies three answers. The student is afraid of disappointing their parents. <b>What is a fair consequence?</b>',head:'New evidence',rule:'The student admits cheating before the teacher checks the tests.',eg:'Is honesty a reason for a smaller punishment?'},
  {k:'none',name:'The Graffiti Artist',sum:'The art teacher offered an approved mural.',ask:'A teenager paints a large picture on a school wall without permission. Some students love it. The headteacher wants it removed. <b>What is a fair consequence?</b>',head:'New evidence',rule:'The art teacher offers to help create a new mural in an approved area.',eg:'Is this a punishment or a solution?'},
  {k:'none',name:'The False Accusation',sum:'The headphones were at home; no apology.',ask:'A student accuses a classmate of stealing headphones. Later, the headphones are found at home. <b>What should happen now?</b>',head:'New evidence',rule:'The student who made the accusation refuses to apologise.',eg:'Is accusing someone without proof a kind of wrong too?'}]}},
{stage:'Grammar',title:'Rules and advice',hint:'Choose the best verb. <small>Careful: mustn’t and don’t have to are very different.</small>',
 side:{look:'case',card:RULES},
 act:{type:'quiz',label:'Rule',items:[
  {q:'Students ___ steal other people’s belongings.',o:['mustn’t','don’t have to','should'],a:'mustn’t',why:'It is not allowed.'},
  {q:'You ___ apologise when you hurt someone’s feelings.',o:['mustn’t','should','don’t have to'],a:'should',why:'Advice: it is the right thing to do.'},
  {q:'We ___ wear a uniform at our school. It’s a rule.',o:['have to','might','shouldn’t'],a:'have to',why:'An obligation: it is a school rule.'},
  {q:'You ___ call the police for every small classroom disagreement.',o:['must','don’t have to','mustn’t'],a:'don’t have to',why:'It is not necessary.'},
  {q:'Teachers ___ listen to both sides before deciding.',o:['should','mustn’t','don’t have to'],a:'should',why:'Good advice for a fair decision.'},
  {q:'It’s Saturday tomorrow, so we ___ get up early.',o:['don’t have to','mustn’t','must'],a:'don’t have to',why:'No school: it is not necessary. “Mustn’t” would mean it is forbidden.'},
  {q:'You ___ use your phone during the test. You’ll get zero.',o:['mustn’t','don’t have to','should'],a:'mustn’t',why:'It is forbidden.'},
  {q:'Yesterday I ___ stay after school to repair the damage.',o:['had to','must','should'],a:'had to',why:'Must has no past form: use had to.'}]}},
{stage:'Speak',title:'Your school law',hint:'You are the headteacher for one day. Write three new rules. <small>One sentence for each rule, with a reason.</small>',
 side:{look:'case',card:LAW},
 act:{type:'gaps',free:true,items:[
  {pre:'Rule 1 · something students must do',ph:'At my school, students must … because …'},
  {pre:'Rule 2 · something students shouldn’t or mustn’t do',ph:'Students mustn’t … because …'},
  {pre:'Rule 3 · what happens if someone breaks a rule',ph:'If someone …, they should …'}]}},
{stage:'Speak',title:'Defend your law',hint:'Present your three rules. Then your teacher disagrees with one of them. <small>60 seconds to defend it with two arguments.</small>',
 side:{look:'case',card:LAW},
 act:{type:'talk',label:'Task',secs:60,keepChips:true,chipLabel:'Tap each phrase he uses',chips:['must / mustn’t','have to / don’t have to','should','because …','However, …','First of all, … Secondly, …'],cards:[
  {q:'Present your three rules and explain why your school needs them.'},
  {q:'Your teacher says: “Rule 1 is unfair.” Defend it with two arguments.'},
  {q:'Which consequence from the School Court is the fairest for your rule 3? Why?'}]}}
]});
</script>
