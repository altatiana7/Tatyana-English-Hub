function moveCard(d){card=(card+d+DATA.cards.length)%DATA.cards.length;flipped=false;renderCards()}
function renderCards(){let c=DATA.cards[card];$('cards').innerHTML=`<div class="grid"><div class="panel"><div class="cardpic" role="button" tabindex="0" aria-label="Flip flashcard" onclick="flip()" onkeydown="if(event.key==='Enter')flip()">${flipped?`<div class="reverse"><span class="tag">${esc(c.location)}</span><h2>${esc(c.name)}</h2><p><strong>${esc(c.ru)}</strong></p><p>${esc(c.desc)}</p><p class="tiny">Click to turn back</p></div>`:`<img src="${c.img}" alt="Photorealistic illustration of ${esc(c.name)}"><div class="caption"><h2>${esc(c.name)}</h2><span>Tap to reveal the fact and Russian translation</span></div>`}</div><div class="navrow"><button onclick="moveCard(-1)">← Previous</button><b>${card+1} / ${DATA.cards.length}</b><button class="primary" onclick="moveCard(1)">Next →</button></div></div><aside class="panel"><span class="eyebrow">Culture · Photo cards</span><h2>Look. Listen. Explain.</h2><p>Read the landmark's name aloud, listen to the pronunciation, then turn the card to learn one useful fact.</p><button class="purple" onclick="speak()">▶ Pronounce name</button><div class="entry"><b>Speaking prompt</b><p>Where is this place? Why is it famous? Explain in two English sentences.</p></div><div class="note">British English pronunciation uses the device's speech engine. Sound works where a compatible voice is installed.</div></aside></div>`}
function writingView(){const w=DATA.writing[tab-1];return `<div class="eyebrow">Writing workshop · ${w.kind}</div><h1>${esc(w.title)}</h1><p class="muted">Write in your notebook. Reveal the guidance only after planning independently.</p><div class="grid writing"><section class="panel"><span class="tag">Original task style · 7–8 Olympiad</span><p class="prompt">${esc(w.prompt)}</p><h3>Task requirements</h3><ul>${w.rules.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="note">Teacher checks the text for task fulfilment, organisation, vocabulary, grammar and accuracy. This page does not auto-grade writing.</div></section><aside class="panel"><h2>Writing coach</h2><button class="primary" onclick="toggle('plan')">Show / hide template</button><button onclick="toggle('phrases')">Useful phrases</button><button onclick="toggle('tip')">Examiner's tip</button><div class="entry hidden" id="plan"><b>Suggested structure</b><ol>${w.plan.map(x=>`<li>${esc(x)}</li>`).join('')}</ol></div><div class="entry hidden" id="phrases"><b>Language bank</b><ul>${w.phrases.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div><div class="entry hidden" id="tip"><b>Common pitfall</b><p>${esc(w.tips)}</p></div><div class="entry"><label><input type="checkbox" id="selfcheck"> I checked the task, structure and word count.</label></div></aside></div>`}
function toggle(id){$(id)?.classList.toggle('hidden')}
function quizView(){let x=DATA.quiz[q];let finished=q>=DATA.quiz.length;if(finished){let score=Object.keys(checked).filter(i=>checked[i]).length;return `<div class="panel"><div class="eyebrow">Use of English · completed</div><h1>Your result: ${score} / 15</h1><p>${score>=12?'Strong result. Check the explanations for any mistakes.':'Review the explanations and try again.'}</p><button class="primary" onclick="q=0;selected={};checked={};render()">Restart test</button></div>`}let status=checked[q]!==undefined;return `<div class="eyebrow">Olympiad style · 15 contextual sentences</div><h1>Use of English</h1><p class="muted">Select ONE answer. Check immediately to see the grammar rule.</p><div class="grid"><section class="panel"><div class="navrow"><span class="tag">Question ${q+1} of 15</span><span class="tiny">${Object.keys(checked).length} answered</span></div><div class="progress"><div style="width:${(q+1)/15*100}%"></div></div><h2 style="margin-top:22px">${esc(x[0])}</h2><div class="answers">${x[1].map((a,i)=>`<button class="answer ${status?(i===x[2]?'correct':selected[q]===i?'wrong':''):''}" ${status?'disabled':''} onclick="choose(${i})">${String.fromCharCode(65+i)} · ${esc(a)}</button>`).join('')}</div>${status?`<div class="feedback"><b>${checked[q]?'Correct.':'Not quite.'}</b> ${esc(x[3])}</div>`:''}<div class="footer"><span class="tiny">One attempt per question</span><button class="primary" ${!status?'disabled':''} onclick="q++;render()">${q===14?'See result':'Next →'}</button></div></section><aside class="panel"><h2>Grammar focus</h2><p>Conditional sentences · Gerund and infinitive · Passive voice · Relative clauses · Phrasal verbs · Word choice · Tenses</p><div class="note">There is one best answer for each sentence. Read the explanation after checking.</div></aside></div>`}
function choose(i){if(checked[q]!==undefined)return;selected[q]=i;checked[q]=i===DATA.quiz[q][2];render()}
function render(){nav();$('app').innerHTML=tab===0?`<div class="eyebrow">Culture lab · 11 visual cards</div><h1>Landmarks of the English-speaking world</h1><p class="muted">UK · Scotland · Wales · USA — photo cards, British pronunciation and short facts.</p><div id="cards"></div>`:tab<=3?writingView():quizView();if(tab===0)renderCards();$('badge').textContent=TABS[tab]}
render();
</script></body></html>
