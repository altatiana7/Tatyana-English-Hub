<script>
/* Module 3 (Plurilingual), lesson 3 · Why are there different languages?
   Same engine and look as lessons 1 and 2. Two activities per screen:
   1 check-in: Advice for learning English (gaps from memory) + Speed Game -> 2 warm-up questions + prediction from frames of the video
   -> 3 video «Why are there different languages?» + questions from memory -> 4 What is plurilingualism? + speaking
   -> 5 Airport Mystery · Language Radar (airport signs) -> 6 Language twins or traps (false friends)
   -> 7 15 facts about languages: true or false before the video, then check -> 8 numbers from memory + speaking
   -> 9 English: true or false (floor is lava) + words English borrowed -> 10 The Wrong Gate + The Polyglot Help Desk
   -> 11 Toki Pona Challenge -> 12 Critical thinkers + Speed Game.
   Audio: natural recordings in ../card-audio (AUDIO_TEXTS is collected by tools/card-audio-collect.mjs). */
const ADV=[
 ['When you learn English, remember that making','mistakes'],
 ['is natural – the important thing is to learn from the things you do wrong. It’s also important to','practise'],
 ['as much as possible – use the language in lots of different situations. Frequent','revision'],
 ['is essential, too – look back at new language regularly. This will help you to','memorise'],
 ['the new vocabulary and grammar and store it in your brain.','Translation'],
 ['can be useful sometimes, but remember that grammar and vocabulary don’t usually work in exactly the same way in different languages. And, finally, when we talk about speaking, there are two main goals:','accuracy'],
 ['is good because it means what you are saying is correct and being','fluent']];
const ADV_TAIL='means that you can keep talking without frequently stopping.';
const ADV_FULL=ADV.map(x=>x[0]+' '+x[1]).join(' ')+' '+ADV_TAIL;
const ADV_SPOKEN=ADV_FULL.match(/[^.!?]+[.!?]+/g).map(x=>x.trim());
const WARM=['How many languages can you say hello in?','Why do you think there are so many languages in the world?','Which language would you like to learn next? Why?','Do you know any words that are the same in Russian and English?'];
const PLUR=['Which languages do you know a few words in?','Have you ever understood a sign in a language you never studied? How?','When you don’t know a word in English, what do you do?','Is it useful to know a few words in many languages, or is it better to speak one language perfectly?'];
const FACTQ=['Which fact surprised you most? Why?','Why do you think Papua New Guinea has so many languages?','Would you like to learn a language with click sounds? Why or why not?','Why do you think all pilots must speak English?'];
const DESK=['A passenger from Spain keeps saying “equipaje” and points to the belts. What does he need? Help him.','A French girl is looking for the “sortie”. Show her the way.','A German man asks for the “Toiletten”. Help him.','An Italian woman says her flight to Rome leaves from “uscita 24”. Explain where she must go.','A family from Turkey has missed their flight to Istanbul. What can they do?','A passenger doesn’t understand the word “delayed”. Explain it in other words.','A tourist doesn’t know the words “boarding pass”. Explain them without translating.','A passenger has lost his phone. He speaks only a little English. Ask him simple questions.'];
const FINALQ=['Is a language easier when it has fewer words? Why or why not?','Explain the word “airport” using only very simple words.','Explain the word “passport” using only very simple words.','Why do some languages disappear?','Should everyone in the world speak one language? What makes you say that?'];
const AUDIO_TEXTS=ADV_SPOKEN.concat(WARM,PLUR,FACTQ,DESK,FINALQ);
const clip=t=>CardAudio.base+CardAudio.key(t)+'.mp3?v=20261119a';
/* prediction from frames of the video: six tiles cover each picture, open them one by one */
Lesson.ACT.reveal={
 init(a,s){s.k=0;s.off=a.items.map(()=>[])},
 view(a,s){const m=a.items[s.k],off=s.off[s.k];
  const pic=m.title?`<div class="titlecard"><div><b>${Lesson.esc(m.title)}</b><span>${Lesson.esc(m.sub||'')}</span></div></div>`:`<img src="${m.img}" alt="">`;
  return `<div class="reveal"><div class="frame">${pic}<div class="tiles">${[1,2,3,4,5,6].map(n=>`<button data-tile="${n}" class="${off.includes(n)?'off':''}">${n}</button>`).join('')}</div></div>
   <div class="row">${a.items.map((x,k)=>`<button class="ghost${k===s.k?' on':''}" data-rk="${k}">${Lesson.esc(x.label)}</button>`).join('')}<button class="main" data-rall>Show all</button></div></div>`},
 click(a,s,d){if(d.rk!==undefined){s.k=+d.rk;return Lesson.redraw()}
  if(d.tile!==undefined){const o=s.off[s.k],n=+d.tile;if(!o.includes(n))o.push(n);return Lesson.redraw()}
  if(d.rall!==undefined){s.off[s.k]=[1,2,3,4,5,6];return Lesson.redraw()}}};
/* a video with a Hide button */
Lesson.ACT.media={
 init(a,s){s.k=0;s.hide=false},
 view(a,s){const m=a.items[s.k];
  return `<div class="media"><div class="frame">${s.hide?'':m.video?`<video src="${m.video}" controls playsinline preload="metadata"></video>`:`<img src="${m.img}" alt="">`}</div>
   <div class="row">${a.items.length>1?a.items.map((x,k)=>`<button class="ghost${k===s.k&&!s.hide?' on':''}" data-mk="${k}">${Lesson.esc(x.label)}</button>`).join(''):''}<button class="ghost${s.hide?' on':''}" data-mhide>${s.hide?'Show the video':'Hide the video'}</button></div></div>`},
 click(a,s,d){if(d.mk!==undefined){s.k=+d.mk;s.hide=false;return Lesson.redraw()}if(d.mhide!==undefined){s.hide=!s.hide;return Lesson.redraw()}}};

/* Advice for learning English: Gabi says the missing word from memory, a tap on the gap shows it; then listen and check */
let ADV_ON=false;
document.addEventListener('click',e=>{if(e.target.closest('#steps,#prev,#next,.home')&&ADV_ON){ADV_ON=false;CardAudio.stop()}},true);
Lesson.ACT.advice={
 init(a,s){s.open={}},
 view(a,s){const L='abcdefg';
  const body=ADV.map((x,i)=>`${Lesson.esc(x[0])} <button class="ag${s.open[i]?' open':''}" data-ag="${i}">${s.open[i]?Lesson.esc(x[1]):'('+L[i]+')'}</button>`).join(' ')+' '+Lesson.esc(ADV_TAIL);
  return `<div class="adv"><div class="page"><h5>ADVICE FOR LEARNING ENGLISH</h5><p>${body}</p></div>

  const done=Object.keys(s.v).length;

const mix=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
