s":["Marie Skłodowska-Curie","Hedy Lamarr","Ada Lovelace","Rosalind Franklin"],"answer":"Marie Skłodowska-Curie","fact":"Curie named polonium after Poland, her homeland."},{"question":"Which inventor worked on alternating-current technology and also experimented with wireless transmission?","options":["Nikola Tesla","Charles Darwin","Nicolaus Copernicus","Isaac Newton"],"answer":"Nikola Tesla","fact":"Tesla is strongly associated with alternating-current systems and also carried out experiments in wireless power and radio-frequency technology."},{"question":"Which performer co-wrote “We Are the World” with Lionel Richie?","options":["Michael Jackson","Elvis Presley","Freddie Mercury","David Bowie"],"answer":"Michael Jackson","fact":"Michael Jackson and Lionel Richie wrote “We Are the World” for the 1985 USA for Africa charity recording."},{"question":"Which mathematician described the idea of a universal computing machine in 1936?","options":["Alan Turing","Isaac Newton","Nikola Tesla","Charles Darwin"],"answer":"Alan Turing","fact":"Turing’s 1936 paper introduced the abstract machine model now known as the Turing machine."},{"question":"Which scientist first trained in medicine but strongly disliked surgery before changing direction?","options":["Charles Darwin","Nicolaus Copernicus","Alan Turing","Marie Curie"],"answer":"Charles Darwin","fact":"Darwin studied medicine in Edinburgh but left the course; he later studied at Cambridge."},{"question":"Which astronomer proposed a heliocentric model in which Earth moves around the Sun?","options":["Nicolaus Copernicus","Isaac Newton","Nikola Tesla","Alan Turing"],"answer":"Nicolaus Copernicus","fact":"Copernicus developed a heliocentric model that placed the Sun near the centre of the planetary system."},{"question":"Which hockey star grew up in a family where his mother was an Olympic champion in basketball?","options":["Alexander Ovechkin","Lionel Messi","Wayne Gretzky","Sidney Crosby"],"answer":"Alexander Ovechkin","fact":"Ovechkin’s mother, Tatyana Ovechkina, was a two-time Olympic gold medallist in basketball with the Soviet team."},{"question":"Which Russian actor studied at a technical college before choosing an acting career?","options":["Konstantin Khabensky","Alexander Ovechkin","Michael Jackson","Lionel Messi"],"answer":"Konstantin Khabensky","fact":"Khabensky studied in a technical field before leaving and later training as an actor."},{"question":"Which Hollywood star was also an inventor who co-developed a frequency-hopping communication system?","options":["Hedy Lamarr","Marilyn Monroe","Grace Kelly","Audrey Hepburn"],"answer":"Hedy Lamarr","fact":"Hedy Lamarr and George Antheil patented a frequency-hopping system intended to make radio-controlled torpedoes harder to jam."},{"question":"Which novelist disappeared for eleven days in 1926, creating a major public mystery?","options":["Agatha Christie","Virginia Woolf","Jane Austen","George Eliot"],"answer":"Agatha Christie","fact":"Agatha Christie disappeared in December 1926 and was found eleven days later at a hotel in Harrogate."},{"question":"Which scientist was offered the presidency of Israel in 1952 but declined?","options":["Albert Einstein","Isaac Newton","Nikola Tesla","Alan Turing"],"answer":"Albert Einstein","fact":"After the death of Chaim Weizmann, Einstein was invited to become President of Israel but declined the offer."},{"question":"Which technology entrepreneur said a college calligraphy course later influenced the typography of the Macintosh?","options":["Steve Jobs","Bill Gates","Alan Turing","Nikola Tesla"],"answer":"Steve Jobs","fact":"Jobs later said that his calligraphy studies influenced the Macintosh’s attention to typography."}],"warmupWords":[
["counterfeiter","a person who illegally makes fake money","фальшивомонетчик · Newton investigated people who made fake coins."],
["Royal Mint","the organisation that makes a country's coins","Королевский монетный двор · Newton worked at the Royal Mint."],
["investigate","to try to find the truth about a crime or problem","расследовать · Police investigate crimes."],
["agreement","a decision or promise made by two sides","соглашение · Messi's early Barcelona agreement was written on a napkin."],
["napkin","a small piece of paper or cloth used at a meal","салфетка · The agreement was written on a paper napkin."],
["dedicate","to say that a work is created in honour of someone","посвящать · Beethoven first planned to dedicate the symphony to Napoleon."],
["emperor","the ruler of an empire","император · Napoleon declared himself emperor."],
["homeland","the country where you were born or feel you belong","родина · Curie named polonium after her homeland, Poland."],
["element","a basic substance such as oxygen, gold or radium","химический элемент · Curie discovered new elements."],
["alternating current","electric current that regularly changes direction","переменный ток · Tesla worked with alternating current."],
["wireless transmission","sending information or energy without wires","беспроводная передача · Tesla experimented with wireless transmission."],
["co-write","to write something together with another person","писать в соавторстве · Michael Jackson co-wrote We Are the World."],
["universal machine","Turing's idea of a machine that could follow many different instructions","универсальная машина · It became an important idea in computing."],
["heliocentric","with the Sun at the centre of the planetary system","гелиоцентрический · Copernicus proposed a heliocentric model."],
["Olympic champion","a person who wins first place at the Olympic Games","олимпийский чемпион · Ovechkin's mother was an Olympic champion."],
["technical college","a school or college focused on practical or technical subjects","технический колледж · Khabensky studied at a technical college."],
["frequency-hopping","quickly changing radio frequencies to make a signal harder to block","скачкообразная смена частоты · Hedy Lamarr helped develop this idea."],
["novelist","a person who writes novels","романист · Agatha Christie was a famous novelist."],

 if(d.sprintAnswer!==undefined){
   const g=S.game.sprint,q=sprintItems[g.i%sprintItems.length],ok=norm(d.sprintAnswer)===norm(q.a);
   if(ok){g.score++;g.streak++;g.best=Math.max(g.best,g.streak)}else g.streak=0;
   g.i++;save();return render();
 }
 if(d.lavaStart!==undefined){S.game.lava={started:true,lava:15,i:0,score:0,ended:false,won:false};save();return render()}
 if(d.lavaRestart!==undefined){S.game.lava={started:true,lava:15,i:0,score:0,ended:false,won:false};save();return render()}
 if(d.lavaAnswer!==undefined){
   const g=S.game.lava,q=lavaItems[g.i],ok=norm(d.lavaAnswer)===norm(q.a);
   if(ok){g.score++;g.lava=Math.max(5,g.lava-14)}else g.lava=Math.min(100,g.lava+18);
   g.i++;
   if(g.lava>=100){g.ended=true;g.won=false}
   else if(g.i>=lavaItems.length){g.ended=true;g.won=true}
   save();return render();
 }
 if(d.step!==undefined)return move(+d.step);
 if(d.tab!==undefined){S.tab[S.step]=+d.tab;return render()}
 if(d.done!==undefined){if(!S.done.includes(S.step))S.done.push(S.step);return render()}
 if(d.start){bs(d.start).started=true;save();return drawExercise(d.start)}
 if(d.answer!==undefined)return submit(d.bank,d.answer);
 if(d.question){bs(d.question).i+=+d.delta;save();return drawExercise(d.question)}
 if(d.retry){const s=bs(d.retry);delete s.answers[list(d.retry)[s.i]];save();return drawExercise(d.retry)}
 if(d.result){bs(d.result).ended=true;save();return drawExercise(d.result)}
 if(d.restart){S.exercise[d.restart]={i:0,answers:{},drafts:{},started:true,ended:false};save();return drawExercise(d.restart)}
 if(d.review){bs(d.review).ended=false;bs(d.review).i=0;save();return drawExercise(d.review)}
 if(d.flip){S.flashes[d.flip].back=!S.flashes[d.flip].back;return render()}
 if(d.flash){S.flashes[d.flash].i+=+d.delta;S.flashes[d.flash].back=false;return render()}
 if(d.say){if(!('speechSynthesis' in window)){const s=$('#speechStatus');if(s)s.textContent='Audio is not supported by this browser.';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(d.say);u.lang='en-GB';u.voice=speechSynthesis.getVoices().find(v=>v.lang==='en-GB')||null;speechSynthesis.speak(u);return}
 if(d.wordExample){$('#wordExample').textContent=d.wordExample;return}
 if(d.person){$('#familyDetail').textContent=d.person;return}
 if(d.reveal){const p=document.getElementById(d.reveal);p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden));return}
 if(d.predict!==undefined){S.notes['prediction'+d.predict]=d.value;save();$$('[data-predict="'+d.predict+'"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return}
 if(d.videoRestart!==undefined){const v=$('#oldVideo');v.currentTime=0;v.play().catch(()=>{$('#videoStatus').textContent='Press Play on the video player.'});}
});
document.addEventListener('submit',e=>{if(e.target.dataset.check){e.preventDefault();submit(e.target.dataset.check,$('input',e.target).value)}});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.note){S.notes[d.note]=e.target.value;save()}if(d.draft){const s=bs(d.draft);s.drafts[list(d.draft)[s.i]]=e.target.value;save()}});
$('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}};
$('#reset').onclick=()=>{const n=$('#resetConfirm');n.hidden=!n.hidden};$('#confirmReset').onclick=()=>{stopGameTimers();S.tab={};S.exercise={};S.notes={};S.flashes={};S.done=[];S.game={};$('#resetConfirm').hidden=true;move(0)};$('#cancelReset').onclick=()=>$('#resetConfirm').hidden=true;
render();
</script></body></html>
