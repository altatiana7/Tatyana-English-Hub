el","are travelling"]]],"celebrityKidsText":"Growing up with a famous parent can look exciting from the outside, but many children of celebrities still want an ordinary private life. They know that people recognise their family name, and they understand why strangers are curious. However, they do not always like the attention. Some teenagers believe that fame creates opportunities, while others prefer to build an identity of their own. They need privacy, they want close friends, and they often value normal routines. At the same time, their lives are changing. They are studying, travelling, working on projects and meeting new people. A teenager may think that a public event is exciting today but feel completely different about it tomorrow. The important point is that we cannot know a person simply from a photo. A famous surname belongs to a family, but personality belongs to the individual.","wordFormCards":[["compose","composer · composition"],["develop","developer · development"],["discover","discovery"],["science","scientist · scientific"],["biology","biologist · biological"],["astronomy","astronomer · astronomical"],["mathematics","mathematician · mathematical"],["electric","electricity · electrical"],["fame","famous"],["talent","talented"],["determine","determination · determined"],["confident","confidence"],["intelligent","intelligence"],["connect","connection"]],"wf":[["argue","argument","ment","We had a small ___ about the rules.","Drop the final e: argue → argument."],["enjoy","enjoyment","ment","Music gives her a lot of ___.","Add -ment to enjoy."],["improve","improvement","ment","There is a clear ___ in his English.","Keep e: improve + ment."],["develop","development","ment","Practice is important for skill ___.","Add -ment to develop."],["embarrass","embarrassment","ment","The public comment caused her ___.","Keep double r and double s; add -ment."],["achieve","achievement","ment","Winning the competition was a great ___.","Keep e: achieve + ment."],["exp function memoryGame(){
 const g=S.game.memory||(S.game.memory={open:[],matched:[]});
 const order=[0,3,1,5,2,4,5,1,4,0,3,2];
 const cards=order.map((pair,pos)=>({pair,pos,label:pos<6?memoryPairs[pair].front:memoryPairs[pair].back}));
 const matched=new Set(g.matched);
 return `<div class="panel memPanel"><div class="row spread"><span class="badge">${matched.size} / 6 pairs</span>${matched.size===6?'<button class="primary" data-memory-restart>Play again</button>':'<span>Tap two cards</span>'}</div><div class="memoryGrid">${cards.map(card=>{const isOpen=g.open.includes(card.pos)||matched.has(card.pair);return `<button class="memoryCard ${matched.has(card.pair)?'matched':isOpen?'':'closed'}" data-memory="${card.pos}" data-pair="${card.pair}">${isOpen?esc(card.label):'?'}</button>`}).join('')}</div></div>`;
}
/* Word Factory: build 18 nouns from stem tiles + suffix tiles. Trap stems keep the old spelling. */
const WF_PARTS=[['ARGU','ment','ARGUE'],['ENJOY','ment'],['IMPROVE','ment','IMPROV'],['DEVELOP','ment'],['EMBARRASS','ment'],['ACHIEVE','ment','ACHIEV'],['EXPLAN','ation','EXPLAIN'],['SOLU','tion','SOLV'],['CONNECT','ion'],['PERMIS','sion','PERMIT'],['DECI','sion','DECID'],['COMMUNICAT','ion','COMMUNICATE'],['CONFID','ence','CONFIDENT'],['INDEPEND','ence'],['DIFFER','ence'],['ADOLESC','ence'],['INTELLIG','ence'],['PATI','ence','PATIENT']];
const WF_SUF=['ment','ion','tion','ation','sion','ence','ance','ness'];
const WF_ORDER=[11,3,24,0,17,8,27,5,14,21,1,19,10,25,6,16,2,22,13,9,26,4,18,12,23,7,20,15];
const WF_TILES=(()=>{const t=[];WF_PARTS.forEach((p,k)=>{t.push({s:p[0],k,trap:false});if(p[2])t.push({s:p[2],k,trap:true})});return WF_ORDER.map(i=>t[i])})();
function wordFactory(){
 const g=S.game.tiles||(S.game.tiles={stem:null,suf:null,built:[],miss:0,last:null});
 const done=g.built.length===WF_PARTS.length;
 const wall=`<div class="tWall">${WF_PARTS.map((p,k)=>g.built.includes(k)?`<span class="on"><small>${esc(D.wf[k][0])}</small>${esc(D.wf[k][1])}</span>`:`<span>${esc(D.wf[k][0])}</span>`).join('')}</div>`;
 if(done)return `<div class="panel tGame"><div class="resultTop"><div class="ring ${g.miss?'':'full'}"><b>18</b><span>built</span></div><div><h2>${g.miss?'Factory complete.':'Perfect factory run.'}</h2><p>${g.miss} wrong ${g.miss===1?'try':'tries'}. Read the nouns aloud and name the spelling change in each.</p><button class="primary" data-tiles-restart>Play again</button></div></div>${wall}</div>`;
 const pv=(g.stem!=null?WF_TILES[g.stem].s:'?')+' + '+(g.suf!=null?'-'+WF_SUF[g.suf]:'?');
 return `<div class="panel tGame"><div class="row spread"><div class="kicker">WORD FACTORY · TAP A STEM, THEN A SUFFIX · SOME STEMS ARE SPELLING TRAPS</div><span class="tStat"><b>${g.built.length}</b> / 18 built · <b>${g.miss}</b> wrong</span></div>
  <div class="tBoard"><div class="tStems">${WF_TILES.map((t,i)=>g.built.includes(t.k)?'':`<button data-tstem="${i}" class="${g.stem===i?'sel':''}">${t.s}</button>`).join('')}</div>
  <div class="tSide"><div class="tSufs">${WF_SUF.map((x,i)=>`<button data-tsuf="${i}" class="${g.suf===i?'sel':''}">-${x}</button>`).join('')}</div>
  <div class="tLine ${g.last&&g.stem==null&&g.suf==null?(g.last.ok?'ok':'bad'):''}">${g.last&&g.stem==null&&g.suf==null?(g.last.ok?`<b>${esc(g.last.word)}</b><span>${esc(g.last.note)}</span>`:`<b><s>${esc(g.last.word)}</s></b><span>Not a word. Try another stem or suffix.</span>`):`<b>${esc(pv)}</b><span>${g.stem==null&&g.suf==null?'Build any of the 18 nouns below.':'Now tap the other part.'}</span>`}</div></div></div>${wall}</div>`;
}
function sentenceBuilder(){

 if(g.i>=builderItems.length)return `<div class="gameHero"><div><span class="levelTag">LEVEL 05 · BUILDER COMPLETE</span><h2>Sentence mission complete</h2><p>Read the ${builderItems.length} sentences aloud, then move on or build them again.</p></div><button class="primary" data-build-restart>Build again</button></div><div class="resultList">${builderItems.map((it,i)=>`<div class="resultWord"><small>${i+1}</small><b>${esc(it.answer)}</b></div>`).join('')}</div>`;

 return `<div class="gameHero"><div><span class="levelTag">LEVEL 05 · BUILD MODE</span><h2>Say it another way</h2><p>Use the word in capitals. Tap the blocks in order.</p></div><div class="gameScore"><strong>${g.i+1}/${builderItems.length}</strong><span>SENTENCE</span></div></div><div class="panel"><div class="trFrom"><span>${esc(item.from)}</span><b>${esc(item.key)}</b></div><div class="builderAnswer">${g.chosen.length?g.chosen.map(i=>esc(item.tokens[i])).join(' '):'<span class="muted">Your sentence will appear here.</span>'}</div><div class="builderTokens">${item.tokens.map((t,i)=>`<button data-build="${i}" ${chosen.has(i)?'disabled':''}>${esc(t)}</button>`).join('')}</div><div class="row"><button data-build-clear>Clear</button><button class="primary" data-build-check ${g.chosen.length!==item.tokens.length?'disabled':''}>Check</button></div><div class="feedback ${g.checked?(g.correct?'ok':'bad'):''}">${g.checked?`<strong>${g.correct?'Correct.':'Try again.'}</strong>${g.correct?esc(item.answer):'Look at the word in capitals and the ’s.'}`:''}</div>${g.checked&&g.correct?'<button class="primary" data-build-next>Next sentence →</button>':''}</div>`;

}

    <div class="panel qs"><div class="kicker">ANSWER FROM THE TEXT</div><ol class="q2"><li>What negative ideas do people have about becoming old?${details('Show answer','They think old people are lonely and unhappy.')}</li><li>In what ways can negative attitudes be a problem for senior citizens?${details('Show answer','They stop us seeing old age as an opportunity, and can lead to memory loss, a worse ability to recover from illness and a negative body image.')}</li><li>What positive discovery did the research make?${details('Show answer','69% of people think older people are no different from people of other ages.')}</li></ol><div class="kicker">SPEAK</div><p>A quarter of millennials believe it’s normal for older people to be unhappy. Is that true in your country? Will it be true when you are 80?</p></div></div>`],t)+'</div>'}
 if(S.step===6)return `<div class="gameHero"><div><span class="levelTag">LEVEL 07 · HUNTER MODE</span><h2>Spot it. Fix it.</h2><p>One target error per item: family, articles or word formation.</p></div><div class="gameScore"><strong>13</strong><span>ERROR HUNTER</span></div></div>`+exercise('errorGame','Error Hunter');
 if(S.step===7||S.step===8)return `<div class="duo"><div class="dcol"><div class="colHead"><b>1 · Timed Sprint</b><span>40 seconds</span></div>${sprintGame()}</div><div class="dcol"><div class="colHead"><b>2 · Floor Is Lava</b><span>10 questions</span></div>${lavaGame()}</div></div>`;
 return reachHigher();
}
function render(){
 if(S.step===1)S.step=0;if(S.step===8)S.step=7;titles[7]='Speed Zone: Sprint + Lava';
 const vis=titles.map((t,i)=>i).filter(i=>i!==1&&i!==8),total=vis.length,doneN=vis.filter(i=>S.done.includes(i)).length;

 $('#progressText').textContent=doneN+' / '+total+' levels opened';

 $('#main').innerHTML=`<div class="stephead"><h1>${titles[S.step]}</h1></div>`+body().replace(/LEVEL \d\d · /g,'');
 $$('[data-exercise]').forEach(e=>drawExercise(e.dataset.exercise));
 if(S.step===7){startSprintTimer();startLavaTimer()}else{clearInterval(window.__gabiSprintTimer);clearInterval(window.__gabiLavaTimer)}
 save();
}
function move(n){if(n<0||n>=titles.length)return;stopGameTimers();if(n!==S.step&&!S.done.includes(S.step))S.done.push(S.step);S.step=n;render();window.scrollTo({top:0,behavior:'auto'})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if(d.fgcheck!==undefined){let ok=0;$$('[data-fg]').forEach(inp=>{const good=norm(inp.value)===famKey[+inp.dataset.fg];inp.classList.toggle('ok',good);inp.classList.toggle('no',!good);if(good)ok++});$('#fgScore').textContent=ok+' / 7 correct'+(ok===7?'. Well done.':'. Fix the red ones: check spelling, hyphens and singular or plural.');return}
 if(d.fgshow!==undefined){const k=$('#fgKey');k.hidden=!k.hidden;return}
 if(d.fghint!==undefined){const k=$('#fgHint');k.hidden=!k.hidden;return}
 if(d.gcheck){let ok=0;$$('[data-gk^="'+d.gcheck+'"]').forEach(inp=>{const good=(GK[inp.dataset.gk]||[]).some(a=>nz(a)===nz(inp.value));inp.classList.toggle('ok',good);inp.classList.toggle('no',!good);const r=inp.closest('.wfRow');if(r)r.classList.toggle('bad',!good&&!!inp.value.trim());if(good)ok++});$('#'+d.gcheck+'Score').textContent=ok+' / '+d.n+' correct'+(ok==d.n?'. Well done.':'. Fix the red ones.');return}
 if(d.gshow){const k=$('#'+d.gshow+'Key');k.hidden=!k.hidden;return}
 if(d.gletters){$$('[data-gk^="'+d.gletters+'"]').forEach(inp=>{inp.placeholder=GK[inp.dataset.gk][0].charAt(0)+' …'});return}
 if(d.azcheck!==undefined){let ok=0,maybe=0;$$('[data-az]').forEach(inp=>{const v=nz(inp.value),L=inp.dataset.az;inp.classList.remove('ok','no','maybe');if(!v)return;if((AZ[L]||[]).some(a=>nz(a)===v)){inp.classList.add('ok');ok++}else if(v.charAt(0)===L.toLowerCase()){inp.classList.add('maybe');maybe++}else inp.classList.add('no')});$('#azScore').textContent=ok+' words'+(maybe?' + '+maybe+' for your teacher to decide':'')+'. The book lists words for 15 letters.';return}
 if(d.mtimer){clearInterval(window.__gabiTalk);let n=+d.mtimer;const tick=()=>{const c=$('#mClock');if(!c){clearInterval(window.__gabiTalk);return}c.textContent=n>0?n+' s':'Time!';if(n<=0)clearInterval(window.__gabiTalk);n--};tick();window.__gabiTalk=setInterval(tick,1000);return}
 if(d.peek!==undefined){const g=S.game.peek,box=$('#peekBox');if(!box.hidden)return;g.n++;$('#peekN').textContent=g.n;box.hidden=false;clearTimeout(window.__gabiPeek);window.__gabiPeek=setTimeout(()=>{const x=$('#peekBox');if(x)x.hidden=true},8000);return}
 if(d.mslot!==undefined){const g=S.game.map,x=+d.mslot;if(g.fill[x]){delete g.fill[x];g.checked=false}g.sel=x;return render()}
 if(d.mname){const g=S.game.map,free=[0,1,2,3,4,5,6].filter(n=>!g.fill[n]);if(g.sel==null||g.fill[g.sel])g.sel=free[0];if(g.sel==null)return;g.fill[g.sel]=d.mname;g.checked=false;const next=[0,1,2,3,4,5,6].filter(n=>!g.fill[n]);g.sel=next.length?next[0]:null;return render()}
 if(d.mcheck!==undefined){S.game.map.checked=true;return render()}
 if(d.mreset!==undefined){S.game.map=null;return render()}
 if(d.hunt!==undefined){const g=S.game.hunt,it=huntItems[g.i];if(+d.hunt===it[1]){g.found=true;if(!g.miss)g.score++;g.bad=null}else{g.miss++;g.bad=+d.hunt}render();const f=$('[data-huntfix] input');if(f)f.focus();return}
 if(d.huntNext!==undefined){const g=S.game.hunt;g.i++;g.miss=0;g.found=false;g.bad=null;g.fix=null;return render()}
 if(d.huntRestart!==undefined){S.game.hunt=null;return render()}
 if(d.tstem!==undefined||d.tsuf!==undefined){const g=S.game.tiles;if(d.tstem!==undefined)g.stem=g.stem===+d.tstem?null:+d.tstem;else g.suf=g.suf===+d.tsuf?null:+d.tsuf;
  if(g.stem!=null&&g.suf!=null){const t=WF_TILES[g.stem],word=(t.s+WF_SUF[g.suf]).toLowerCase(),k=D.wf.findIndex(w=>w[1].toLowerCase()===word);
   if(k>=0&&!g.built.includes(k)){g.built.push(k);g.last={ok:true,word:D.wf[k][0]+' → '+D.wf[k][1],note:D.wf[k][4]||''}}else{g.miss++;g.last={ok:false,word}}g.stem=null;g.suf=null}
  else g.last=null;return render()}
 if(d.tilesRestart!==undefined){S.game.tiles=null;return render()}
 if(d.meet!==undefined){const g=S.game.meet,want=FCLUES[g.i][1];if(+d.meet===want){g.placed.push(want);g.i++;g.bad=null}else if(!g.placed.includes(+d.meet)){g.miss++;g.bad=+d.meet}return render()}
 if(d.meetRestart!==undefined){S.game.meet=null;return render()}
 if(d.memoryRestart!==undefined){S.game.memory={open:[],matched:[]};save();return render()}
 if(d.memory!==undefined){
   const g=S.game.memory||(S.game.memory={open:[],matched:[]}),pos=+d.memory,pair=+d.pair;
   if(g.matched.includes(pair))return;
   if(g.open.length===2)g.open=[];
   if(!g.open.includes(pos))g.open.push(pos);
   if(g.open.length===2){
     const cards=[...document.querySelectorAll('[data-memory]')];
     const p1=+cards.find(x=>+x.dataset.memory===g.open[0]).dataset.pair;
     const p2=+cards.find(x=>+x.dataset.memory===g.open[1]).dataset.pair;
     if(p1===p2){g.matched.push(p1);g.open=[]}
   }
   save();return render();
 }
 if(d.factory!==undefined){
   const g=S.game.factory||(S.game.factory={i:0,score:0,last:null}),item=D.wf[g.i%D.wf.length];
   const correct=d.factory===item[2];if(correct)g.score++;else{g.wrong=g.wrong||[];g.wrong.push(g.i)}g.last={correct};save();return render();
 }
 if(d.factoryRestart!==undefined){S.game.factory={i:0,score:0,last:null,wrong:[]};save();return render()}
 if(d.factoryNext!==undefined){const g=S.game.factory;g.i++;g.last=null;save();return render()}
 if(d.build!==undefined){const g=S.game.builder||(S.game.builder={i:0,chosen:[],checked:false,correct:false});g.chosen.push(+d.build);g.checked=false;save();return render()}
 if(d.buildClear!==undefined){const g=S.game.builder;g.chosen=[];g.checked=false;g.correct=false;save();return render()}
 if(d.buildCheck!==undefined){const g=S.game.builder,item=builderItems[g.i];const built=g.chosen.map(i=>item.tokens[i]).join(' ');g.checked=true;g.correct=norm(built)===norm(item.answer);save();return render()}
 if(d.buildRestart!==undefined){S.game.builder={i:0,chosen:[],checked:false,correct:false};save();return render()}
 if(d.buildNext!==undefined){const g=S.game.builder;g.i++;g.chosen=[];g.checked=false;g.correct=false;save();return render()}
 if(d.sprintStart!==undefined){S.game.sprint={started:true,time:40,i:0,score:0,streak:0,best:0,ended:false};save();return render()}
 if(d.sprintAnswer!==undefined){
   const g=S.game.sprint,q=sprintItems[g.i%sprintItems.length],ok=norm(d.sprintAnswer)===norm(q.a);
   if(ok){g.score++;g.streak++;g.best=Math.max(g.best,g.streak)}else g.streak=0;
   g.i++;save();return render();
 }
 if(d.lavaStart!==undefined){S.game.lava={started:true,lava:15,i:0,score:0,ended:false,won:false};save();return render()}
 if(d.lavaRestart!==undefined){S.game.lava={started:true,lava:15,i:0,score:0,ended:false,won:false};save();return render()}
 if(d.lavaAnswer!==undefined){
   const g=S.game.lava,q=lavaItems[g.i],ok=norm(d.lavaAnswer)===norm(q.a);
   if(ok){g.score++;g.lava=Math.max(5,g.lava-14)}else g.lava=Math.min(100,g.lava+18);
   g.i++;
   if(g.lava>=100){g.ended=true;g.won=false}
   else if(g.i>=lavaItems.length){g.ended=true;g.won=true}
   save();return render();
 }
 if(d.step!==undefined)return move(+d.step);
 if(d.board!==undefined){S.tab[S.step]=null;return render()}
 if(d.tab!==undefined){S.tab[S.step]=+d.tab;S.seen=S.seen||{};const a=S.seen[S.step]||(S.seen[S.step]=[]);if(!a.includes(+d.tab))a.push(+d.tab);return render()}
 if(d.done!==undefined){if(!S.done.includes(S.step))S.done.push(S.step);return render()}
 if(d.start){bs(d.start).started=true;save();return drawExercise(d.start)}
 if(d.answer!==undefined)return submit(d.bank,d.answer);
 if(d.qjump){const x=bs(d.qjump);x.ended=false;x.onlyMissed=false;x.i=+d.n;save();return drawExercise(d.qjump)}
 if(d.question){bs(d.question).i+=+d.delta;save();return drawExercise(d.question)}
 if(d.retry){const s=bs(d.retry);delete s.answers[list(d.retry)[s.i]];save();return drawExercise(d.retry)}
 if(d.result){bs(d.result).ended=true;save();return drawExercise(d.result)}
 if(d.restart){S.exercise[d.restart]={i:0,answers:{},drafts:{},started:true,ended:false};save();return drawExercise(d.restart)}
 if(d.review){bs(d.review).ended=false;bs(d.review).i=0;save();return drawExercise(d.review)}
 if(d.flip){S.flashes[d.flip].back=!S.flashes[d.flip].back;return render()}
 if(d.flashReset){S.flashes[d.flashReset]={i:0,back:false};return render()}
 if(d.flash){S.flashes[d.flash].i+=+d.delta;S.flashes[d.flash].back=false;return render()}
 if(d.say){const st=$('#speechStatus');if(!('speechSynthesis' in window)){if(st)st.textContent='Audio is not supported by this browser.';return;}
  speechSynthesis.cancel();const vs=speechSynthesis.getVoices(),u=new SpeechSynthesisUtterance(d.say);u.lang='en-GB';u.rate=.9;
  const v=vs.find(x=>x.lang==='en-GB')||vs.find(x=>x.lang==='en-US')||vs.find(x=>/^en/i.test(x.lang));if(v){u.voice=v;u.lang=v.lang}
  else if(vs.length&&st)st.textContent='No English voice is installed in this browser. Try Chrome or Edge.';
  u.onerror=()=>{if(st)st.textContent='The browser could not play the audio.'};speechSynthesis.speak(u);return}
 if(d.wordExample){$('#wordExample').textContent=d.wordExample;return}
 if(d.person){$('#familyDetail').textContent=d.person;return}
 if(d.reveal){const p=document.getElementById(d.reveal);p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden));return}
 if(d.predict!==undefined){S.notes['prediction'+d.predict]=d.value;save();$$('[data-predict="'+d.predict+'"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return}
 if(d.vcheck!==undefined||d.vshow!==undefined){
  const KEY=[['doctor','a doctor'],['36','thirty-six','thirty six'],['80','eighty'],['dad','father','his dad'],['positive'],['seven','7'],['bus drivers','drivers','the bus drivers','bus driver'],['public transport','transport','the bus','buses']];
  if(d.vshow!==undefined){const k=$('#vgKey');k.hidden=!k.hidden;return}
  let ok=0;$$('[data-vg]').forEach(inp=>{const good=KEY[+inp.dataset.vg].includes(norm(inp.value));inp.classList.toggle('ok',good);inp.classList.toggle('no',!good);if(good)ok++});
  $('#vgScore').textContent=ok+' / 8 correct'+(ok===8?'. Well done.':'. Watch again and fix the red ones.');return}
 if(d.videoRestart!==undefined){const v=$('#oldVideo');v.currentTime=0;v.play().catch(()=>{$('#videoStatus').textContent='Press Play on the video player.'});}
});
document.addEventListener('submit',e=>{if(e.target.dataset.factoryfix!==undefined){e.preventDefault();const g=S.game.factory,item=D.wf[g.i%D.wf.length],v=$('input',e.target).value;if(!v.trim())return;const correct=nz(v)===nz(item[1]);if(correct)g.score++;else{g.wrong=g.wrong||[];g.wrong.push(g.i)}g.last={correct};return render()}if(e.target.dataset.huntfix!==undefined){e.preventDefault();const g=S.game.hunt,v=$('input',e.target).value;if(!v.trim())return;g.fix=nz(v)===nz(huntItems[g.i][2]);if(g.fix)g.score++;return render()}if(e.target.dataset.check){e.preventDefault();submit(e.target.dataset.check,$('input',e.target).value)}});
