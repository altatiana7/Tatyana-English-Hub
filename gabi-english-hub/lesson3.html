ptions":["Marie Skłodowska-Curie","Hedy Lamarr","Ada Lovelace","Rosalind Franklin"],"answer":"Marie Skłodowska-Curie","fact":"Curie named polonium after Poland, her homeland."},{"question":"Which inventor worked on alternating-current technology and also experimented with wireless transmission?","options":["Nikola Tesla","Charles Darwin","Nicolaus Copernicus","Isaac Newton"],"answer":"Nikola Tesla","fact":"Tesla is strongly associated with alternating-current systems and also carried out experiments in wireless power and radio-frequency technology."},{"question":"Which performer co-wrote “We Are the World” with Lionel Richie?","options":["Michael Jackson","Elvis Presley","Freddie Mercury","David Bowie"],"answer":"Michael Jackson","fact":"Michael Jackson and Lionel Richie wrote “We Are the World” for the 1985 USA for Africa charity recording."},{"question":"Which mathematician described the idea of a universal computing machine in 1936?","options":["Alan Turing","Isaac Newton","Nikola Tesla","Charles Darwin"],"answer":"Alan Turing","fact":"Turing’s 1936 paper introduced the abstract machine model now known as the Turing machine."},{"question":"Which scientist first trained in medicine but strongly disliked surgery before changing direction?","options":["Charles Darwin","Nicolaus Copernicus","Alan Turing","Marie Curie"],"answer":"Charles Darwin","fact":"Darwin studied medicine in Edinburgh but left the course; he later studied at Cambridge."},{"question":"Which astronomer proposed a heliocentric model in which Earth moves around the Sun?","options":["Nicolaus Copernicus","Isaac Newton","Nikola Tesla","Alan Turing"],"answer":"Nicolaus Copernicus","fact":"Copernicus developed a heliocentric model that placed the Sun near the centre of the planetary system."},{"question":"Which hockey star grew up in a family where his mother was an Olympic champion in basketball?","options":["Alexander Ovechkin","Lionel Messi","Wayne Gretzky","Sidney Crosby"],"answer":"Alexander Ovechkin","fact":"Ovechkin’s mother, Tatyana Ovechkina, was a two-time Olympic gold medallist in basketball with the Soviet team."},{"question":"Which Russian actor studied at a technical college before choosing an acting career?","options":["Konstantin Khabensky","Alexander Ovechkin","Michael Jackson","Lionel Messi"],"answer":"Konstantin Khabensky","fact":"Khabensky studied in a technical field before leaving and later training as an actor."},{"question":"Which Hollywood star was also an inventor who co-developed a frequency-hopping communication system?","options":["Hedy Lamarr","Marilyn Monroe","Grace Kelly","Audrey Hepburn"],"answer":"Hedy Lamarr","fact":"Hedy Lamarr and George Antheil patented a frequency-hopping system intended to make radio-controlled torpedoes harder to jam."},{"question":"Which novelist disappeared for eleven days in 1926, creating a major public mystery?","options":["Agatha Christie","Virginia Woolf","Jane Austen","George Eliot"],"answer":"Agatha Christie","fact":"Agatha Christie disappeared in December 1926 and was found eleven days later at a hotel in Harrogate."},{"question":"Which scientist was offered the presidency of Israel in 1952 but declined?","options":["Albert Einstein","Isaac Newton","Nikola Tesla","Alan Turing"],"answer":"Albert Einstein","fact":"After the death of Chaim Weizmann, Einstein was invited to become President of Israel but declined the offer."},{"question":"Which technology entrepreneur said a college calligraphy course later influenced the typography of the Macintosh?","options":["Steve Jobs","Bill Gates","Alan Turing","Nikola Tesla"],"answer":"Steve Jobs","fact":"Jobs later said that his calligraphy studies influenced the Macintosh’s attention to typography."}],"warmupWords":[

],"famousPeople":[{"name":"Vladimir Putin","text":"Vladimir Putin was born in 1952 in Leningrad, now Saint Petersburg. He studied law at Leningrad State University and later worked in the Soviet security service. In 1999 he became Prime Minister of Russia. At the end of that year he became acting President, and in 2000 he was elected President. These biographical facts make the text useful for practising words connected with careers, public life and personal history.","source":"Official Kremlin biography and historical records."},{"name":"Konstantin Khabensky","text":"Konstantin Khabensky was born in 1972 in Leningrad, now Saint Petersburg. He first studied in a technical field but later chose acting. He became widely known through theatre and film work, including Night Watch and Day Watch. His career gives us useful language for talking about talent, development, performance and professional choices.","source":"Biographical details checked against published actor biography sources."},{"name":"Alexander Ovechkin","text":"Alexander Ovechkin was born in 1985 in Moscow. He developed his career in ice hockey and joined the Washington Capitals in the NHL. In 2018 he captained the Capitals to their first Stanley Cup championship and received the Conn Smythe Trophy as the most valuable player of the playoffs. His story is useful for vocabulary about sport, achievement, determination and teamwork.","source":"Biographical details checked against NHL records."}],"quickCheck":[["Vladimir Putin was born in …","Leningrad",["Moscow","Leningrad","London"]],["Before national politics, Putin worked in …","a state security service",["medicine","a state security service","cinema"]],["Khabensky first studied in …","a technical field",["a technical field","medicine","professional sport"]],["Khabensky appeared in …","Night Watch and Day Watch",["Night Watch and Day Watch","Titanic and Avatar","Rocky and Creed"]],["Ovechkin was born in …","Moscow",["Moscow","Saint Petersburg","Madrid"]],[ el","are travelling"]]],"celebrityKidsText":"Growing up with a famous parent can look exciting from the outside, but many children of celebrities still want an ordinary private life. They know that people recognise their family name, and they understand why strangers are curious. However, they do not always like the attention. Some teenagers believe that fame creates opportunities, while others prefer to build an identity of their own. They need privacy, they want close friends, and they often value normal routines. At the same time, their lives are changing. They are studying, travelling, working on projects and meeting new people. A teenager may think that a public event is exciting today but feel completely different about it tomorrow. The important point is that we cannot know a person simply from a photo. A famous surname belongs to a family, but personality belongs to the individual.","wordFormCards":[["compose","composer · composition"],["develop","developer · development"],["discover","discovery"],["science","scientist · scientific"],["biology","biologist · biological"],["astronomy","astronomer · astronomical"],["mathematics","mathematician · mathematical"],["electric","electricity · electrical"],["fame","famous"],["talent","talented"],["determine","determination · determined"],["confident","confidence"],["intelligent","intelligence"],["connect","connection"]],"wf":[["argue","argument","ment","We had a small ___ about the rules.","Drop the final e: argue → argument."],["enjoy","enjoyment","ment","Music gives her a lot of ___.","Add -ment to enjoy."],["improve","improvement","ment","There is a clear ___ in his English.","Keep e: improve + ment."],["develop","development","ment","Practice is important for skill ___.","Add -ment to develop."],["embarrass","embarrassment","ment","The public comment caused her ___.","Keep double r and double s; add -ment."],["achieve","achievement","ment","Winning the competition was a great ___.","Keep e: achieve + ment."],["exp function body(){const t=S.tab[S.step]||0;
 if(S.step===0){const nav=tabs(['Active vocabulary · 22','Famous People Quiz · 15']);return nav+`<div id="taskPanel" role="tabpanel" aria-labelledby="tab-0-${t}">`+[flash('famousVocab',flashBanks.famous)+`<div class="panel row spread"><span class="muted">Learn the cards first. Then test the same vocabulary in context.</span><button class="primary" data-tab="1">Start Quiz →</button></div>`,`<div class="panel"><p class="note"><b>Ready for the quiz?</b> The difficult words from the questions are in the cards. If a question still feels unclear, go back to the vocabulary tab and check the word first.</p></div>`+exercise('famous','Choose the person. Discover the story.')][t]+'</div>'}
 if(S.step===1){const nav=tabs(['Visual word map','Flip cards','Suffix Sort · 18','Build the noun · 18','Social media text · 9']);return nav+`<div id="taskPanel" role="tabpanel" aria-labelledby="tab-1-${t}">`+[wfMap(),flash('wf',flashBanks.wf),exercise('wfSort','Which suffix?'),exercise('wfWrite','Complete the sentence'),'<p class="note">Adapted from your “Does social media make us unhappy?” exercise. Read the nine sentences in order, then retell the paragraph using four of the nouns.</p>'+exercise('wfText','Social media: nouns in context')][t]+'</div>'}
 if(S.step===2){const nav=tabs(['1 · Learn the family','2 · Practise · 7','3 · Challenge · 15','4 · Extra']);const panes=[familyMap()+`<div class="nextTask"><button class="primary" data-tab="1">I understand the map · Practise →</button></div>`,`<div class="familyTaskLead"><div><strong>Complete 7 family links</strong><br><span>Use the map only if you need help.</span></div><button data-tab="0">← Map</button></div>`+exercise('familyGap','Complete the relationship')+`<div class="nextTask"><button class="primary" data-tab="2">Next · Relationship challenge →</button></div>`,`<div class="familyTaskLead"><div><strong>Relationship detective</strong><br><span>15 questions. Choose the correct family relationship.</span></div><button data-tab="0">← Map</button></div>`+exercise('familyQuiz','Choose the relationship')+`<div class="nextTask"><button class="primary" data-tab="3">Finished · Open extra →</button></div>`,`<div class="familyExtra"><div class="panel reading"><h2>Family fact file</h2><p><b>John Legend</b> is a singer and songwriter. <b>Chrissy Teigen</b> is a model and cookbook author. Their family story is useful here because one photo can show only a small part of family life.</p><p>In July 2025, Luna organised a “Rainbow Cafe” dinner for her parents and helped serve the meal.</p><p class="source">Extra context for discussion; the relationship practice uses the textbook family snapshot.</p></div><div class="panel"><h3>Speak</h3><ol><li>Choose one person from the map.</li><li>Give two family relationships.</li><li>Make one full sentence with <b>’s</b>.</li><li>Say one thing a family photo cannot tell us.</li></ol><button data-reveal="familyIdeas">Show 4 discussion questions</button><div id="familyIdeas" hidden><ol><li>What can a family photo tell us?</li><li>What can’t it tell us?</li><li>Which family word is easiest to confuse?</li><li>What activity can bring a family together?</li></ol></div></div></div>`];return nav+`<div id="taskPanel" role="tabpanel" aria-labelledby="tab-2-${t}">${panes[t]}</div>`}
 if(S.step===3){return tabs(['Words before watching · 15','Match the meaning · 15','Make predictions'])+`<div id="taskPanel" role="tabpanel" aria-labelledby="tab-3-${t}">`+[flash('video',flashBanks.video),exercise('videoMatch','Choose the word or phrase'),`<div class="panel"><h2>What will change?</h2><p>A younger man will use make-up to look like a senior citizen. Predict how people might react.</p><div class="grid">${['Will strangers offer him help?','Will someone he knows recognise him?','Will people treat him with more respect?','Will he enjoy the experience?'].map((q,i)=>`<div class="rule"><p>${q}</p><div class="row">${['Yes','No','Not sure'].map(a=>`<button data-predict="${i}" data-value="${a}" aria-pressed="${S.notes['prediction'+i]===a}">${a}</button>`).join('')}</div></div>`).join('')}</div><p class="answerReveal">Use: “I predict that… because…” After watching: “My prediction was… The evidence was…”</p></div>`][t]+'</div>'}
 if(S.step===4)return `<div class="panel"><h2>Watch for a change in perspective</h2><video id="oldVideo" controls preload="metadata" playsinline poster="assets/lesson3/video-poster.jpg" src="assets/lesson3/to-be-old.mp4"></video><div class="row" style="margin-top:12px"><button data-video-restart>Play from the start</button><a class="link" href="assets/lesson3/to-be-old.mp4" download>Download video</a><span id="videoStatus" role="status"></span></div></div><div class="panel videoNotes"><h3>First watch · big picture</h3>${note('gist1','1. How do people react to Chris as a senior citizen? Give an example.')}${note('gist2','2. Is Chris generally happy or unhappy about the experience? What is your evidence?')}<h3>Second watch · evidence notes</h3><p class="muted">Use one or two words or a number where possible. Add the video time beside the evidence.</p>${['Chris’s profession','His real age / the age he appears to be','Who does not recognise him?','The positive attitude / the number of extra years mentioned','Who lets him cross the street?','What transport does he use when he is offered a seat?'].map((p,i)=>note('video'+i,(i+1)+'. '+p)).join('')}<p class="note">These are listening notes, checked against the clip with your teacher. They are not automatically scored.</p></div><div class="panel reading"><h3>Ageism in the UK</h3><p>The supplied textbook summarises a Royal Society for Public Health study. Almost a third of respondents thought loneliness was simply part of getting old; a quarter of millennials thought unhappiness was normal for older people. The text links negative attitudes with problems such as poorer recovery from illness and a negative body image. However, 69% agreed that older people are fundamentally no different from people of other ages.</p><p class="source">A summary of the historical study reported on your supplied textbook page, not a statement about every older person or a current population estimate.</p>${details('Read, decide, explain',`<ol><li>Which two stereotypes are mentioned? <b>That loneliness and unhappiness are normal parts of ageing.</b></li><li>What negative consequences are described? <b>Memory problems, poorer recovery and negative body image.</b></li><li>What positive result is reported? <b>69% saw older people as fundamentally no different from others.</b></li></ol>`)}<p><b>Say it differently:</b> Change “Old people can’t…” into a fairer statement. Try: “Some people…, but age alone doesn’t…”</p></div>`;
 if(S.step===5)return tabs(['Short explanation','Choose · 24','Error detective · 15'])+`<div id="taskPanel" role="tabpanel" aria-labelledby="tab-5-${t}">`+[articleRules(),exercise('articles','A, an, the or no article?'),'<p class="note">Each sentence has one article mistake. Rewrite the whole sentence. Capitalisation and final punctuation do not affect the check.</p>'+exercise('articleFix','Find and fix the article')][t]+'</div>';
 if(S.step===6)return tabs(['Read & notice','Articles in context · 14','Complete & discuss · 8','Understand your parents'])+`<div id="taskPanel" role="tabpanel" aria-labelledby="tab-6-${t}">`+[dinnerRead(),exercise('dinnerGaps','Family dinners: complete the story'),exercise('speakGaps','Choose the article, then answer aloud'),`<div class="panel reading"><h2>Understanding your parents</h2><p>The supplied textbook introduces Dean Burnett, a doctor of neuroscience and the author of a book for teenagers about understanding their parents. The passage explains that disagreements between young people and adults are not new. It presents a simple starting point: your brain works differently when you are a teenager and when you are an adult.</p><div class="articleViz"><div><b>a</b> doctor<br><small>profession</small></div><div><b>the</b> author of the book<br><small>identified person</small></div><div><b>—</b> teenagers<br><small>people in general</small></div></div><ol><li>Give one disagreement that can happen in a family.</li><li>Explain each side using “They may think…”.</li><li>Suggest a solution using “One solution would be…”.</li><li>Describe the same problem twice: “We have a problem…” → “The problem is…”.</li></ol><p class="source">Adapted from the supplied “Understanding your parents” textbook passage. This is a language task, not a claim that all teenagers or adults behave alike.</p></div>`][t]+'</div>';
 return tabs(['Final quiz · 20','Speaking challenge','Earlier lesson materials'])+`<div id="taskPanel" role="tabpanel" aria-labelledby="tab-7-${t}">`+[exercise('final','Word formation + family + articles')+`<div class="panel"><h3>Extra game</h3><a class="link" href="https://create.kahoot.it/share/9028cb05-8110-410a-aeda-903887984c7d" target="_blank" rel="noopener">Open the lesson Kahoot · 15 questions</a><p class="muted">The quiz above works directly on this site. Kahoot opens separately.</p></div>`,`<div class="panel"><h2>One person, three connections</h2><p>Speak for about one minute. Choose a person from the lesson.</p><ol><li>Describe their job or role: “He/She is a/an…”</li><li>Explain one family or social connection.</li><li>Use three nouns: confidence, development, achievement, communication…</li><li>Challenge one assumption about age or fame.</li></ol>${note('finalTalk','Plan your answer in keywords')}${details('Show a possible answer',`<p>John Legend is a singer and a father. His daughter Luna once organised a dinner for the family. The dinner is an example of communication and enjoyment at home. A famous family still needs time together. I think confidence grows when children can make decisions and help other people.</p>`)}</div>`,`<div class="panel"><h3>Famous people · reading archive</h3>${D.famousPeople.map(p=>details(esc(p.name),'<p class="reading">'+esc(p.text)+'</p>')).join('')}${exercise('bioCheck','Biography check')}</div><div class="panel">${details('Celebrity Kids · original lesson text','<p class="reading">'+esc(D.celebrityKidsText)+'</p>')}${exercise('stative','Stative verbs · extra practice')}</div><div class="panel">${details('Earlier famous lives',D.earlierLives.map(x=>'<p><b>'+esc(x[0])+'</b> · '+esc(x[1])+'. '+esc(x[2])+'</p>').join(''))}</div>`][t]+'</div>';
}
function render(){const video=$('#oldVideo');if(video){S.notes.videoTime=video.currentTime;video.pause()}$('#route').innerHTML=titles.map((title,i)=>`<button data-step="${i}" ${S.step===i?'aria-current="step"':''}><span>${S.done.includes(i)?'✓':i+1}</span>${esc(title)}</button>`).join('');$('#progressText').textContent=S.done.length+' / 8 activities marked practised';$('#progressFill').style.width=(S.done.length/8*100)+'%';$('#main').innerHTML=`<div class="stephead"><div><div class="kicker">ACTIVITY ${S.step+1} OF 8 · B1</div><h1>${titles[S.step]}</h1></div></div><p class="bridge">${bridges[S.step]}</p>${body()}<nav class="navbottom" aria-label="Activity navigation"><button data-step="${S.step-1}" ${S.step===0?'disabled':''}>← Previous activity</button><button data-done>${S.done.includes(S.step)?'Marked practised':'Mark practised'}</button><button class="primary" data-step="${S.step+1}" ${S.step===7?'disabled':''}>${S.step<7?'Next: '+titles[S.step+1]+' →':'Lesson complete'}</button></nav>`;$$('[data-exercise]').forEach(e=>drawExercise(e.dataset.exercise));const v=$('#oldVideo');if(v){v.onloadedmetadata=()=>{if(S.notes.videoTime<v.duration)v.currentTime=S.notes.videoTime||0;$('#videoStatus').textContent='Ready · '+Math.round(v.duration)+' seconds'};v.onerror=()=>$('#videoStatus').textContent='Video could not load. Use the download link or reload.';}save();}
function move(n){if(n<0||n>=titles.length)return;S.step=n;render();window.scrollTo({top:0,behavior:'auto'})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
 if(d.step!==undefined)return move(+d.step);
 if(d.tab!==undefined){S.tab[S.step]=+d.tab;return render()}
 if(d.done!==undefined){if(!S.done.includes(S.step))S.done.push(S.step);return render()}
 if(d.start){bs(d.start).started=true;save();return drawExercise(d.start)}
 if(d.answer!==undefined)return submit(d.bank,d.answer);
 if(d.question){bs(d.question).i+=+d.delta;save();return drawExercise(d.question)}
 if(d.retry){const s=bs(d.retry);delete s.answers[list(d.retry)[s.i]];save();return drawExercise(d.retry)}
 if(d.result){bs(d.result).ended=true;save();return drawExercise(d.result)}
 if(d.restart){S.exercise[d.restart]={i:0,answers:{},drafts:{},started:true,ended:false};save();return drawExercise(d.restart)}
 if(d.review){bs(d.review).ended=false;bs(d.review).i=0;save();return drawExercise(d.review)}
 if(d.flip){S.flashes[d.flip].back=!S.flashes[d.flip].back;return render()}
 if(d.flash){S.flashes[d.flash].i+=+d.delta;S.flashes[d.flash].back=false;return render()}
 if(d.say){if(!('speechSynthesis' in window)){const s=$('#speechStatus');if(s)s.textContent='Audio is not supported by this browser.';return;}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(d.say);u.lang='en-GB';u.voice=speechSynthesis.getVoices().find(v=>v.lang==='en-GB')||null;speechSynthesis.speak(u);return}
 if(d.wordExample){$('#wordExample').textContent=d.wordExample;return}
 if(d.person){$('#familyDetail').textContent=d.person;return}
 if(d.reveal){const p=document.getElementById(d.reveal);p.hidden=!p.hidden;b.setAttribute('aria-expanded',String(!p.hidden));return}
 if(d.predict!==undefined){S.notes['prediction'+d.predict]=d.value;save();$$('[data-predict="'+d.predict+'"]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));return}
 if(d.videoRestart!==undefined){const v=$('#oldVideo');v.currentTime=0;v.play().catch(()=>{$('#videoStatus').textContent='Press Play on the video player.'});}
});
document.addEventListener('submit',e=>{if(e.target.dataset.check){e.preventDefault();submit(e.target.dataset.check,$('input',e.target).value)}});
document.addEventListener('input',e=>{const d=e.target.dataset;if(d.note){S.notes[d.note]=e.target.value;save()}if(d.draft){const s=bs(d.draft);s.drafts[list(d.draft)[s.i]]=e.target.value;save()}});
$('#full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch{}};
$('#reset').onclick=()=>{const n=$('#resetConfirm');n.hidden=!n.hidden};$('#confirmReset').onclick=()=>{S.tab={};S.exercise={};S.notes={};S.flashes={};S.done=[];$('#resetConfirm').hidden=true;move(0)};$('#cancelReset').onclick=()=>$('#resetConfirm').hidden=true;
render();
</script></body></html>
