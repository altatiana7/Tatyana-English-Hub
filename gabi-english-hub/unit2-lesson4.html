<style>
/* Speed Game: the 15-second timer is a round clock, not a bomb */
.bombsvg path,.bombsvg rect,.bombsvg .spark,.bombsvg circle:nth-of-type(2){display:none}
.bombsvg circle:nth-of-type(1){fill:#169be5}
.bomb-box.hot .bombsvg circle:nth-of-type(1){fill:#e2574c}
/* Kahoot look: one question, four calm coloured answers in two columns */
.act.panel .bomb-q .q{font-size:clamp(22px,2.3vw,30px);line-height:1.25}
.act.panel .opts{grid-template-columns:1fr 1fr;gap:10px}
.act.panel .opts button{border-width:3px;font-weight:800}
.act.panel .opts button:nth-child(1){background:#e4eefb;border-color:#8fb1dd}
.act.panel .opts button:nth-child(2){background:#e5f3ea;border-color:#8cc3a0}
.act.panel .opts button:nth-child(3){background:#fbf0d4;border-color:#dfc06f}
.act.panel .opts button:nth-child(4){background:#f7e4e7;border-color:#d79fa9}
.act.panel .opts button:hover:not(:disabled){filter:brightness(.96)}
.act.panel .opts button.ok{background:#d3efdc;border-color:#2f9e5f}
.act.panel .opts button.no{background:#f9d9d6;border-color:#d9534f}
.act.panel .opts button.dim{opacity:.55}
/* module recap under a button (the teacher’s screen is shared with the student) */
.work{position:relative}
.helpbtn{position:absolute;right:14px;top:10px;z-index:20}
.helpbtn>summary{list-style:none;cursor:pointer;background:#ffd23f;color:#1b2333;font:800 16px/1 Figtree,sans-serif;padding:10px 16px;border-radius:12px;border:2px solid #e0b400;user-select:none}
.helpbtn>summary::-webkit-details-marker{display:none}
.helpbtn[open]>summary{background:#fff;border-color:#ffd23f}
.helppop{position:absolute;right:0;top:46px;width:min(560px,88vw);max-height:min(460px,72vh);overflow:auto;background:#121826;color:#e8edf6;border:2px solid #ffd23f;border-radius:14px;padding:12px 14px;box-shadow:0 14px 34px rgba(0,0,0,.4)}
.helppop .court{display:flex;align-items:center;gap:12px;margin:0 0 8px}
.helppop .court h4{margin:0;font:800 22px/1.1 Montserrat,sans-serif;color:#fff}
.helppop .stamp{flex:none;border:2px solid #ffd23f;color:#ffd23f;font:800 11px/1 Montserrat,sans-serif;letter-spacing:.14em;padding:5px 7px;border-radius:5px;transform:rotate(-3deg)}
.helppop .say{margin:0;padding:0;list-style:none;display:grid;gap:5px}.helppop .say li{background:rgba(255,255,255,.08);border-radius:9px;padding:6px 10px;font-size:16.5px;line-height:1.35}.helppop .say b{color:#ffd23f}
.work:has(.helpbtn) .hint{padding-right:190px}
</style>

<script src="skills.js?v=20261104a"></script>
<script>
/* Module 2 (Law and order), lesson 4 = the last lesson of the module. The rest of the lesson is added from Tatyana's materials.
   1 warm-up: the three suspects, tell the case from memory + match the detective and court words
   2 Kahoot-style Speed Game: 20 quick questions on the whole module (crime words, criminals, detectives, past tenses, rules, school court). */
const SUS=[['Alex','alex','I was playing basketball in the gym at 3:30.'],['Mia','mia','I was doing my homework in the library.'],['Ben','ben','I was waiting for my mum outside school.']];
const CASE=`<div class="tape"><span>CRIME SCENE · DO NOT CROSS</span></div><div class="filehead"><h4>The Missing £150</h4><span class="stamp">CASE FILE</span></div><div class="sus mini">${SUS.map(s=>`<div><img src="assets/u2/${s[1]}.jpg" alt=""><span><b>${s[0]}<i>SUSPECT</i></b><q>${s[2]}</q></span></div>`).join('')}</div>`;
const COURT=(t,s)=>`<div class="court"><h4>${t}</h4><span class="stamp">${s||'REVISION'}</span></div>`;
const BOX=COURT('Module 2 in one box')+`<ul class="say">
<li><b>rob</b> a bank or a person · <b>steal</b> a thing</li>
<li><b>theft</b> – thief · <b>burglary</b> – burglar · <b>robbery</b> – robber · <b>vandalism</b> – vandal</li>
<li><b>suspect</b> may have done it · <b>witness</b> saw it · <b>alibi</b> proof you were somewhere else · <b>evidence</b> shows what is true</li>
<li><b>Past simple</b> finished action (sent) · <b>Past continuous</b> in progress (was waiting)</li>
<li><b>must</b> a rule · <b>mustn’t</b> not allowed · <b>have to</b> necessary · <b>don’t have to</b> not necessary · <b>should</b> advice</li>
<li><b>a fine</b> money · <b>community service</b> unpaid work · <b>accuse</b> say someone did it</li></ul>`;
Lesson.boot({kicker:'Module 2 · Lesson 4',steps:[
{stage:'Warm-up',title:'Module 2: what do you remember?',hint:'Look at the three suspects. Predict how the case ended, then tell the story from memory. <small>Then match the detective and court words.</small>',split:'minmax(0,.62fr) minmax(0,1.38fr)',cols:'1.1fr 1fr',
 side:{look:'case',card:CASE},
 acts:[
 {type:'talk',title:'From memory · no notes',label:'Task',secs:40,keepChips:true,chipLabel:'Tap each phrase he uses',chips:['At 3:30 …','He said he was …','But …','In my opinion, …','I think … because …'],cards:[
  {q:'Look at the three suspects. Tell the story of the missing £150 from the beginning.',sub:'Who? Where? When? What was wrong with each alibi?'},
  {q:'Say seven crimes from this module and explain two of them.',sub:'Use: steal · rob · break in · damage'},
  {q:'What is the difference between a suspect and a guilty person?'},
  {q:'Which consequence from the School Court is the fairest? Why?'},
  {q:'Give one rule for your school with must, mustn’t or should. Explain why.'},
  {q:'Which crime in this module is the most serious? Why?'}]},
 {type:'match',title:'Detectives and the court',tip:'Tap a word, then its meaning.',items:[
  {l:'suspect',r:'a person who might have done the crime'},
  {l:'clue',r:'a small fact or object that helps to solve a crime'},
  {l:'witness',r:'a person who saw what happened'},
  {l:'alibi',r:'proof that you were in another place at the time of the crime'},
  {l:'evidence',r:'information or objects that show something is true'},
  {l:'guilty',r:'responsible for a crime; you did it'},
  {l:'a fine',r:'money you pay as a punishment'},
  {l:'community service',r:'unpaid work that helps the local community'},
  {l:'accuse',r:'say that someone has done something wrong'},
  {l:'punish',r:'make someone face a consequence'}]}]},
{stage:'Revision',title:'Kahoot · Module 2',hint:'First predict: which topic will be the hardest, crimes, detectives, past tenses or rules? <small>Then 20 quick questions, 15 seconds each. The yellow button has the whole module.</small>',help:{label:'Module 2 in a box',html:BOX},
 acts:[
 {type:'bomb',speed:1,secs:15,label:'Kahoot',title:'Module 2 · Kahoot',items:[
  {sec:'Crime words',q:'Masked men take money from a bank using threats.',o:['burglary','robbery','fraud','vandalism'],a:'robbery',why:'stealing with force or threats'},
  {sec:'Crime words',q:'Someone breaks into a house at night and takes a laptop.',o:['mugging','shoplifting','burglary','arson'],a:'burglary',why:'entering a building to steal'},
  {sec:'Crime words',q:'Starting a fire on purpose is ___.',o:['assault','harassment','theft','arson'],a:'arson'},
  {sec:'Crime words',q:'Tricking people to get their money is ___.',o:['kidnapping','fraud','vandalism','mugging'],a:'fraud'},
  {sec:'Crime · criminal · verb',q:'A person who steals things is a ___.',o:['theft','stealer','thief','steal'],a:'thief',why:'theft (crime) · thief (person) · steal (verb)'},
  {sec:'Crime · criminal · verb',q:'A person who breaks into houses is a ___.',o:['burglar','burglary','robber','break'],a:'burglar',why:'burglary (crime) · burglar (person)'},
  {sec:'Crime · criminal · verb',q:'Masked men ___ the bank yesterday.',o:['stole','burgled','robbed','theft'],a:'robbed',why:'rob a place or a person · steal a thing'},
  {sec:'Detectives',q:'Proof that you were in another place at the time of the crime.',o:['a clue','an alibi','evidence','a witness'],a:'an alibi'},
  {sec:'Detectives',q:'A person who saw what happened.',o:['a witness','a suspect','a victim','a judge'],a:'a witness'},
  {sec:'Detectives',q:'A person the police think might have done it.',o:['a witness','a victim','a suspect','a judge'],a:'a suspect'},
  {sec:'The case',q:'Alex says he was in the gym at 3:30. What is the problem?',o:['The gym was closed','The PE teacher left before 3:30','He was with Mia','He was playing football'],a:'The PE teacher left before 3:30',why:'The teacher saw him at 3:25, but nobody saw him at 3:30.'},
  {sec:'Past tenses',q:'At 3:30 Ben ___ for his mum outside school.',o:['waited','was waiting','were waiting','has waited'],a:'was waiting',why:'in progress at 3:30: past continuous'},
  {sec:'Past tenses',q:'I ___ home when I saw the police car.',o:['was walking','walked','were walking','walk'],a:'was walking',why:'long action + when + short action (saw)'},
  {sec:'Past tenses',q:'Choose the correct detective question.',o:['What you were doing at 3:30?','What did you doing at 3:30?','What were you doing at 3:30?','What was you doing at 3:30?'],a:'What were you doing at 3:30?'},
  {sec:'Rules',q:'It is not allowed: you ___ use your phone during a test.',o:['don’t have to','mustn’t','should','might'],a:'mustn’t'},
  {sec:'Rules',q:'It is not necessary: on Saturdays we ___ come to school.',o:['mustn’t','must','should','don’t have to'],a:'don’t have to'},
  {sec:'Rules',q:'It is good advice, not a rule: you ___ say sorry.',o:['should','must','mustn’t','have to'],a:'should'},
  {sec:'Rules',q:'The past of “have to / must” (a rule in the past): yesterday we ___ wear a uniform.',o:['must','musted','had to','have to'],a:'had to'},
  {sec:'School Court',q:'Unpaid work that helps the local community.',o:['a fine','a warning','an apology','community service'],a:'community service'},
  {sec:'School Court',q:'Money you pay as a punishment.',o:['community service','a fine','a warning','an alibi'],a:'a fine'}]}]}
]});
</script>
