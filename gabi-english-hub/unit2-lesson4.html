<script>
/* Module 2 (Law and order), lesson 4: Surprising true crimes (Gateway B1, Unit 2, pages 19–21). Two activities per screen:
   1 homework review: error hunter with Gabi's own sentences + Speed Game on verb patterns
   2 Speed Game homework check (15 s) + match titles -> 3 the stories and their words: flashcards + retell / answer using the words
   -> 4 critical thinkers + error hunter with all four past tenses -> 5 all four past tenses: floor is lava + sort (grammar card under a button)
   -> 6 predict + Playing basketball is not a crime! -> 7 question forms + police station: two witnesses and the officer (audio, photos)
   -> 8 phrasal verbs: match + floor is lava -> 9 detective story (predict + read) -> 10 true/false/not stated + sequencing -> 11 use it, don't lose it. */
const COURT=(t,s)=>`<div class="court"><h4>${t}</h4><span class="stamp">${s||'CASE FILE'}</span></div>`;
const RULE=COURT('Past simple','GRAMMAR')+`<ul class="say">
<li><b>+</b> regular: arrest → <b>arrested</b> · irregular: take → <b>took</b></li>
<li><b>−</b> She <b>didn’t pay</b> any attention. <small>(didn’t + base verb)</small></li>
<li><b>?</b> How <b>did</b> this <b>happen</b>? <small>(did + base verb)</small></li>
<li><b>be:</b> I / he / she / it <b>was</b> · you / we / they <b>were</b></li>
<li><b>be −</b> There <b>wasn’t</b> any evidence. · They <b>weren’t</b> happy.</li>
<li><b>be ?</b> <b>Were</b> the kids happy? <small>(no did with be)</small></li></ul>
<p class="words"><b>Watch out:</b> after <b>did / didn’t</b> the verb has no -ed: <s>didn’t paid</s> → didn’t <b>pay</b>.</p>`;
const PAST=COURT('Past tenses','GRAMMAR')+`<ul class="say">
<li><b>Past simple</b> finished action: The officer <b>arrested</b> her.</li>
<li><b>Past continuous</b> in progress at that moment: The men <b>were running</b> across a field.</li>
<li><b>Past perfect</b> earlier than another past action: After she <b>had eaten</b> the chips, there wasn’t any evidence.</li>
<li><b>Past perfect continuous</b> how long before: The police <b>had been looking</b> for the men for an hour.</li></ul>
<p class="words"><b>Clues:</b> when / while → continuous · before / after / already / by the time → perfect · for + time before → perfect continuous</p>`;
const TITLES=['Eating the evidence','Where did the criminals go?!','A criminal pastime'];
/* Interactive characters: the officer and two witnesses. Tap a witness to hear his statement (the text stays hidden), then tap the officer for his questions. */
Lesson.ACT.read={view(a){return `<div class="story">${a.html}</div>`}};
Lesson.ACT.cast={
 init(a,s){s.who=null;s.heard={};s.qi=0;s.key=false;s.text=false;s.used={}},
 view(a,s){const E=Lesson.esc,P=a.people;
  const cards=P.map((p,k)=>`<button class="cp${p.officer?' cop':''}${s.who===k?' on':''}" data-who="${k}" aria-label="${E(p.name)}"><img src="${E(p.img)}" alt=""><span><b>${E(p.name)}</b><small>${E(p.role)}</small></span>${s.heard[k]?'<i>✓</i>':''}</button>`).join('');
  let stage;
  if(s.who==null){stage=`<div class="cstage idle">Tap a witness and listen to his statement.<br>Then tap the officer.</div>`}
  else if(P[s.who].officer){const n=a.qs.length,q=a.qs[s.qi];
   stage=`<div class="cstage cop${s.key?' keyopen':''}"><div class="cbody"><div class="chead"><span class="tag">Officer · question ${s.qi+1} of ${n}</span><button class="ghost" data-cqtext>Teacher: show the question</button></div>${Lesson.player({src:q.audio,label:'Police officer'},'q'+s.qi,true)}
    <p class="cq" id="cq" ${s.qtext?'':'hidden'}>${E(q.q)}</p>
    ${s.key?`<ul class="ckey">${q.note?`<li><b>Idea</b>${E(q.note)}</li>`:`<li><b>Alex</b>${E(q.alex)}</li><li><b>Ben</b>${E(q.ben)}</li>`}</ul>`:`<div class="chips"><b class="lab">Tap each phrase he uses</b>${a.chips.map((c,k)=>`<button data-cused="${k}" class="${s.used[k]?'on':''}">${E(c)}</button>`).join('')}</div>`}</div>
    <div class="row nav3"><button class="ghost" data-cback ${s.qi===0?'disabled':''}>Back</button><button class="ghost" data-ckey>${s.key?'Hide the key':'Teacher: key'}</button><button class="main" data-cnext>${s.qi===n-1?'First question':'Next question'}</button></div></div>`}
  else{const p=P[s.who];
   stage=`<div class="cstage"><span class="tag">${E(p.name)} · witness statement</span>${Lesson.player({src:p.audio,label:p.name+(p.role.indexOf('15')>-1?', 15':'')},'w'+s.who,true)}
    <div class="row"><button class="ghost" data-ctext>Teacher: show the words</button></div><div class="ctext" id="ctext" ${s.text?'':'hidden'}>${E(p.text)}</div></div>`}
  return `<div class="cast"><div class="cplist">${cards}</div>${stage}</div>`},
 click(a,s,d){
  if(d.who!==undefined){Lesson.hush();s.who=+d.who;s.heard[s.who]=true;s.text=false;s.qtext=false;return Lesson.redraw()}
  if(d.cqtext!==undefined){s.qtext=!s.qtext;const t=document.getElementById('cq');if(t)t.hidden=!s.qtext;return}
  if(d.ctext!==undefined){s.text=!s.text;const t=document.getElementById('ctext');if(t)t.hidden=!s.text;return}
  if(d.cused!==undefined){s.used[+d.cused]=!s.used[+d.cused];return Lesson.redraw()}
  if(d.ckey!==undefined){s.key=!s.key;return Lesson.redraw()}
  if(d.cback!==undefined&&s.qi>0){Lesson.hush();s.qi--;s.key=false;s.qtext=false;return Lesson.redraw()}
  if(d.cnext!==undefined){Lesson.hush();s.qi=(s.qi+1)%a.qs.length;s.key=false;s.qtext=false;return Lesson.redraw()}}};
Lesson.boot({kicker:'Module 2 · Lesson 4',steps:[

  {s:'The officer arrested her of theft.',bad:4,fix:'for theft',why:'arrest someone for a crime'},
  {s:'The police was searching for the two men.',bad:2,fix:'were',why:'the police + plural verb'},
  {s:'The artist created an art called Reading Work Piece.',bad:4,fix:'a work of art',why:'not “an art”'},
  {s:'It was destroyed by a woman that who thought it was a crossword.',bad:6,fix:'by a woman who …',why:'that or who, not both'},
  {s:'She wrote answers on the arts.',bad:5,fix:'the artwork',why:'one work of art = the artwork'},
  {s:'I didn’t get the question and I can’t sorry.',bad:7,fix:'… question. Sorry!',why:'I didn’t understand the question. Sorry!'}]},

  {sec:'Verb patterns',q:'The officer explained ___ that it was theft.',o:['her','to her','for her'],a:'to her',why:'explain something to someone'},
  {sec:'Verb patterns',q:'He told ___ to stop.',o:['to her','for her','her'],a:'her',why:'tell someone'},
  {sec:'Verb patterns',q:'They charged the two men ___ burglary.',o:['with','for','of'],a:'with',why:'charge someone with a crime'},
  {sec:'Verb patterns',q:'The police arrested her ___ theft.',o:['with','of','for'],a:'for',why:'arrest someone for a crime'},
  {sec:'Verb patterns',q:'The police ___ searching for the men.',o:['was','were','is'],a:'were',why:'the police = they'},
  {sec:'Crime words',q:'A woman ___ three chips.',o:['stole','robbed','charged'],a:'stole',why:'steal a thing'},

  {q:'After she ___ (eat) the chips, there wasn’t any evidence.',o:['ate','was eating','had eaten','had been eating'],a:'had eaten',why:'Earlier than “there wasn’t”: past perfect.'},
  {q:'The officer ___ (eat) his chips when the woman sat down next to him.',o:['ate','was eating','had eaten','had been eating'],a:'was eating',why:'In progress when something happened: past continuous.'},
  {q:'A witness ___ (call) the police.',o:['called','was calling','had called','had been calling'],a:'called',why:'A finished action: past simple.'},
  {q:'Two men ___ (run) across a field when the people saw the helicopter.',o:['ran','were running','had run','had been running'],a:'were running',why:'when + in progress: past continuous.'},
  {q:'The men ___ (break) into the building before the helicopter arrived.',o:['broke','were breaking','had broken','had been breaking'],a:'had broken',why:'before another past action: past perfect.'},
  {q:'The police ___ (look) for the men for an hour when the children made the arrow.',o:['looked','were looking','had looked','had been looking'],a:'had been looking',why:'for an hour before: past perfect continuous.'},
  {q:'The old lady ___ (walk) around the museum when she came across the crossword.',o:['walked','was walking','had walked','had been walking'],a:'was walking',why:'In progress when something happened: past continuous.'},
  {q:'She ___ (not look up) the answers in a dictionary.',o:['didn’t look up','wasn’t looking up','hadn’t looked up','hadn’t been looking up'],a:'didn’t look up',why:'A simple fact about the past: past simple.'},
  {q:'Later she found out that she ___ (destroy) a work of art.',o:['destroyed','was destroying','had destroyed','had been destroying'],a:'had destroyed',why:'Earlier than “found out”: past perfect.'},
  {q:'She ___ (do) the crossword for twenty minutes when a guard noticed her.',o:['did','was doing','had done','had been doing'],a:'had been doing',why:'for twenty minutes before: past perfect continuous.'},
  {q:'While the kids ___ (play) basketball, somebody called the police.',o:['played','were playing','had played','had been playing'],a:'were playing',why:'while + in progress: past continuous.'},
  {q:'The officer ___ (play) with them for ten minutes and then left.',o:['played','was playing','had played','had been playing'],a:'played',why:'A finished action in a sequence: past simple.'}]},

{stage:'Grammar',title:'Playing basketball is not a crime!',hint:'First predict from the title. <small>Then choose the past simple form for each gap.</small>',cols:'.75fr 1.6fr',
 acts:[
 {type:'talk',title:'Predict',label:'Title',secs:40,keepChips:true,chipLabel:'Tap each phrase he uses',chips:['I think …','Maybe …','Somebody called …'],cards:[
  {q:'“Playing basketball is not a crime!” Who called the police? Why?'},
  {q:'What did the police officer do when he arrived?'}]},
 {type:'gaps',title:'Exercise 3 · Florida, 2016',inline:true,tail:' them to build a basketball court. And he still plays with them sometimes.',items:[
  {pre:'In 2016, in a small town in Florida, somebody',opts:['called','calls','did call'],ans:['called'],ph:'(a) call'},
  {pre:'the police. The person',opts:['wasn’t','didn’t was','weren’t'],ans:['wasn’t'],ph:'(b) not be'},
  {pre:'happy because of the noise coming from some kids playing basketball in the street. A police officer',opts:['went','goed','gone'],ans:['went'],ph:'(c) go'},
  {pre:'to investigate. He',opts:['found','finded','founded'],ans:['found'],ph:'(d) find'},
  {pre:'some teenagers playing basketball. He',opts:['didn’t stop','didn’t stopped','not stopped'],ans:['didn’t stop'],ph:'(e) not stop'},
  {pre:'them. In fact, he',opts:['started','start','did started'],ans:['started'],ph:'(f) start'},
  {pre:'to play with them! Other teenagers',opts:['came','comed','come'],ans:['came'],ph:'(g) come'},
  {pre:'out of their houses. At first, they',opts:['didn’t believe','didn’t believed','weren’t believe'],ans:['didn’t believe'],ph:'(h) not believe'},
  {pre:'it. In the end, eight kids happily',opts:['played','plaied','did played'],ans:['played'],ph:'(i) play'},
  {pre:'with the officer. After ten minutes, he',opts:['left','leaved','lefted'],ans:['left'],ph:'(j) leave'},
  {pre:'. He',opts:['told','telled','tolled'],ans:['told'],ph:'(k) tell'},
  {pre:'them to continue, but not to make excessive noise. Lots of people',opts:['saw','seen','seed'],ans:['saw'],ph:'(l) see'},
  {pre:'a video of the incident and the kids all',opts:['became','becomed','become'],ans:['became'],ph:'(m) become'},
  {pre:'famous! Shaquille O’Neal',opts:['met','meeted','meet'],ans:['met'],ph:'(n) meet'},
  {pre:'them personally! Now they don’t play in the street. The police officer',opts:['helped','helps','did helped'],ans:['helped'],ph:'(o) help'}]}]},
{stage:'Speak',title:'Question forms and the police station',hint:'Look at the photos: who are they? What do you think happened? <small>Choose the right question form. Then the officer interviews the two witnesses: listen to his questions.</small>',cols:'.95fr 1.35fr',
 help:{label:'Past simple',html:RULE},
 acts:[
 {type:'quiz',title:'Exercise 4 · make the questions',label:'Question',cols:3,shuffle:false,items:[
  {q:'Why ___ a police officer ___ (investigate) an incident in Florida in 2016?',o:['did … investigate','did … investigated','was … investigated'],a:'did … investigate',why:'did + base verb'},
  {q:'Who ___ the police officer ___ (find) in the street?',o:['did … found','did … find','was … finding'],a:'did … find',why:'did + base verb'},
  {q:'___ he ___ (stop) them?',o:['Was … stop','Did … stopped','Did … stop'],a:'Did … stop',why:'Did + base verb'},
  {q:'What ___ he ___ (do)?',o:['did … do','did … did','was … do'],a:'did … do',why:'did is also the main verb here: did … do'},
  {q:'___ (be) the kids happy to play with the police officer?',o:['Did','Were','Was'],a:'Were',why:'be: no did. the kids → were'},
  {q:'How ___ the kids ___ (become) famous?',o:['were … become','did … became','did … become'],a:'did … become',why:'did + base verb'},
  {q:'Who ___ (call) the police in Florida?',o:['called','did call','did called'],a:'called',why:'Who is the subject: no did'},
  {q:'Which famous person ___ (meet) the kids?',o:['did met','met','did meet'],a:'met',why:'the question word is the subject: no did'},
  {q:'What ___ the officer ___ (tell) the kids?',o:['did … tell','was … told','did … told'],a:'did … tell',why:'did + base verb'},
  {q:'How long ___ the officer ___ (play) with the kids?',o:['was … played','did … played','did … play'],a:'did … play',why:'did + base verb'}]},
 {type:'cast',title:'Police station · two witnesses',chips:['Alex said …','Ben said …','but','while / when','He wasn’t sure','He was sure'],
  people:[
   {name:'Police officer',role:'asks the questions',img:'assets/witness/officer.jpg',officer:1},
   {name:'Alex',role:'witness, 15',img:'assets/witness/alex.jpg',audio:'assets/witness/alex.mp3',text:'I was walking home from football practice on Friday evening. I think it was about 9 o’clock, but I’m not completely sure. When I was passing the petrol station, I heard someone shouting. I saw a dark car parked near the shop. A man in a grey hoodie was running towards the car. I think he was carrying a bag, but I couldn’t see it clearly. Someone was shouting inside the shop, but I didn’t see who it was. I heard a loud noise, but I don’t remember hearing an alarm. I was looking for my phone when the car drove away. I didn’t see the driver’s face, and I honestly don’t remember anything else.'},
   {name:'Ben',role:'witness',img:'assets/witness/ben.jpg',audio:'assets/witness/ben.mp3',text:'I was buying a drink at the petrol station at exactly 9.15. I remember the time because I was checking my phone. A dark blue car stopped outside, and two men got out. One was wearing a grey hoodie, and the other had a black jacket. I was standing near the drinks fridge when they entered. The man in the grey hoodie shouted at the cashier and demanded money. The other man was holding a black backpack. When the cashier pressed a button, the alarm went off. Both men ran outside, got into the car and drove away. I clearly remember the driver’s face, and I’m sure the car was a blue Ford.'}],
  qs:[
   {q:'What were Alex and Ben doing when the robbery happened?',audio:'assets/witness/q01.mp3',alex:'Walking home from football practice, passing the petrol station.',ben:'Buying a drink at the petrol station, checking his phone.'},
   {q:'Where was each teenager when the crime took place?',audio:'assets/witness/q02.mp3',alex:'Outside, near the petrol station and the shop.',ben:'Inside the shop, near the drinks fridge.'},
   {q:'What details did both boys mention?',audio:'assets/witness/q03.mp3',alex:'A man in a grey hoodie, a dark car, the car driving away.',ben:'A man in a grey hoodie, a dark blue car, the car driving away.'},
   {q:'What did Alex remember about the car?',audio:'assets/witness/q04.mp3',alex:'A dark car parked near the shop. It drove away.',ben:'(Ben: a dark blue Ford.)'},
   {q:'What did Ben say about the two men?',audio:'assets/witness/q05.mp3',alex:'(Alex saw only one man.)',ben:'One in a grey hoodie shouted at the cashier and demanded money. The other had a black jacket and a black backpack.'},
   {q:'What was happening when the alarm went off?',audio:'assets/witness/q06.mp3',alex:'He heard a loud noise but doesn’t remember an alarm.',ben:'The cashier pressed a button. Both men ran outside and drove away.'},
   {q:'Which details did Alex seem unsure about?',audio:'assets/witness/q07.mp3',alex:'The time (about 9), the bag (“I think”), who was shouting, the alarm.',ben:'(Ben was sure about the time.)'},
   {q:'What specific details did Ben remember?',audio:'assets/witness/q08.mp3',alex:'—',ben:'Exactly 9.15, a dark blue Ford, grey hoodie and black jacket, a black backpack, the driver’s face.'},
   {q:'Did you notice any contradictions between their stories?',audio:'assets/witness/q09.mp3',alex:'One man, no alarm, a dark car.',ben:'Two men, an alarm, a dark blue Ford.'},
   {q:'Why do you think Alex couldn’t remember everything?',audio:'assets/witness/q10.mp3',note:'Open question. He was outside, it was dark, he was looking for his phone, he wasn’t sure.'},
   {q:'Do you think Ben really saw everything he described? Why?',audio:'assets/witness/q11.mp3',note:'Open question. He was inside and checked the time on his phone, but maybe he is too sure.'},
   {q:'Which teenager seemed more nervous or uncertain?',audio:'assets/witness/q12.mp3',note:'Open question. Alex: “I think …”, “I’m not completely sure”, “I don’t remember”.'},
   {q:'Does remembering more details always mean someone is telling the truth?',audio:'assets/witness/q13.mp3',note:'Open question. Not always: a person can remember wrongly, or lie.'},
   {q:'Who do you think is the more reliable witness? Give three reasons.',audio:'assets/witness/q14.mp3',note:'Open question. Ben: exact time, many details, inside the shop. Alex: honest about what he doesn’t know.'},
   {q:'If you could ask each teenager one more question, what would you ask?',audio:'assets/witness/q15.mp3',note:'Open question, e.g. Alex: Where exactly were you? Ben: Why are you so sure about the car?'}
  ]}]},

{stage:'Reading',title:'Detective story: The Missing Trophy',hint:'First predict from the title. <small>Then read the story. The phrasal verbs are highlighted.</small>',cols:'.7fr 1.5fr',
 acts:[
 {type:'talk',title:'Predict',label:'Title',secs:40,keepChips:true,chipLabel:'Tap each phrase he uses',chips:['I think …','Maybe …','Probably …'],cards:[
  {q:'“The Missing Trophy.” What happened? Who took it, and why?'},
  {q:'A detective looks into the case. What will he look for? What will he find out?'}]},
 {type:'read',title:'The Missing Trophy',html:'<p>On Monday morning the school’s gold football trophy was not in its glass case. Detective Reed <mark>looked into</mark> the case at once. The caretaker said the door had been locked all weekend, and nobody had broken the window.</p><p>Reed <mark>looked for</mark> clues in the corridor and <mark>came across</mark> a green hoodie behind a bin. There was a name label inside, so he <mark>looked up</mark> the name in the school list: Jack Miller, class 9B.</p><p>At lunchtime Jack <mark>turned up</mark> at the police station with his mother. “I didn’t take it,” he said. “I was at home on Sunday night.” But Reed <mark>found out</mark> that a camera had filmed a boy in a green hoodie that evening. The boy was walking slowly, holding the trophy with both hands. A thief usually runs!</p><p>Suddenly Reed <mark>worked out</mark> the truth. “The base was loose, wasn’t it?” Jack nodded. “I took it to my dad’s workshop to fix it before the final. I wanted to surprise the coach, but I forgot to tell anyone.” Reed <mark>came up with</mark> a simple plan: Jack brought the trophy back the next day, and everybody said thank you.</p>'}]},

  {q:'The name label gave Reed the name of the boy.',o:['True','False','Not stated'],a:'True',why:'He looked up the name: Jack Miller.'},
  {q:'Jack came to the police station alone.',o:['True','False','Not stated'],a:'False',why:'He came with his mother.'},
  {q:'Jack said he was at home on Sunday night.',o:['True','False','Not stated'],a:'True'},
  {q:'A camera filmed a boy in a green hoodie.',o:['True','False','Not stated'],a:'True'},

  {q:'The school team won the final.',o:['True','False','Not stated'],a:'Not stated'},

  {q:'The trophy was very old.',o:['True','False','Not stated'],a:'Not stated'}]},
