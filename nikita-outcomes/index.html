<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Nikita · Outcomes Pre-Intermediate</title>
<style>
:root{--navy:#071b27;--navy2:#0d3042;--gold:#b8874d;--cream:#f3f0eb;--paper:#fffdfa;--ink:#27231f;--muted:#6f675f}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--cream);color:var(--ink)}
.app{height:100vh;display:grid;grid-template-columns:275px 1fr;overflow:hidden}.side{background:linear-gradient(180deg,#061723,#0b2b3a);color:#fff;padding:16px 13px;overflow:auto}.brand{padding:7px 9px 16px;border-bottom:1px solid #294553;margin-bottom:13px}.brand b{display:block;color:#f0c98f;font-size:22px;letter-spacing:.4px}.brand span{color:#9db5c0;font-size:10px;letter-spacing:1.4px}.home,.module,.lesson{width:100%;border:0;text-align:left;cursor:pointer}.home{background:#15394a;color:#fff;border-radius:10px;padding:11px 12px;font-weight:850;margin-bottom:10px}.section{font-size:9px;color:#f0c98f;letter-spacing:1.5px;font-weight:900;margin:17px 8px 7px}.module{background:#173a49;color:#fff;border-radius:13px;padding:12px;margin-bottom:6px;font-weight:900}.module.active,.module:hover{background:#91663b}.lesson{background:transparent;color:#bcd0d8;border-radius:9px;padding:9px 10px;margin:2px 0 2px 13px;width:calc(100% - 13px);font-size:12px}.lesson:hover,.lesson.active{background:#12384a;color:#fff}.main{min-width:0;height:100vh;display:grid;grid-template-rows:1fr;background:#f3f0eb}.cover{height:100%;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 72% 18%,#1a4a5d 0,#0b2837 34%,#061722 75%);color:#fff}.coverCard{width:min(980px,92%);border:1px solid #ffffff22;border-radius:28px;padding:52px;box-shadow:0 30px 80px #0005;background:linear-gradient(135deg,#0b2534ee,#102e3fee)}.eyebrow{color:#f0c98f;font-size:12px;font-weight:900;letter-spacing:2px}.cover h1{font-family:Georgia,serif;font-size:clamp(46px,7vw,92px);line-height:.92;margin:12px 0 16px}.cover p{max-width:720px;color:#c7d8df;font-size:18px;line-height:1.6;margin:0}.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}.chip{background:#ffffff10;border:1px solid #ffffff20;border-radius:999px;padding:9px 13px;font-size:12px;font-weight:800}.frame{width:100%;height:100%;border:0;display:none;background:#f3f0eb}.frame.show{display:block}.cover.hide{display:none}
@media(max-width:760px){.app{grid-template-columns:1fr;overflow:auto;height:auto}.side{position:relative}.main{height:75vh}.coverCard{padding:30px}.cover h1{font-size:48px}}
</style>
</head>
<body>
<div class="app">
<aside class="side">
  <div class="brand"><b>OUTCOMES</b><span>PRE-INTERMEDIATE · NIKITA</span></div>
  <button class="home" onclick="showHome()">⌂ Course Cover</button>
  <div class="section">UNIT 7</div>
  <button class="module" onclick="openPage(this,'../nikita-homework/2026-08-24.html?v=nikita-outcomes-1')">Crime</button>
  <button class="lesson" onclick="openPage(this,'../nikita-homework/2026-08-24.html?v=nikita-outcomes-1')">24 August · Crime / Past Tenses</button>
  <button class="lesson" onclick="openPage(this,'../nikita-homework/2026-08-26.html?v=nikita-outcomes-1')">26 August · Crime Review</button>
  <div class="section">UNIT 8</div>
  <button class="module" onclick="openPage(this,'../nikita-course/education.html?v=nikita-outcomes-1')">Education</button>
  <button class="lesson" onclick="openPage(this,'../nikita-course/education-2026-08-30.html?v=nikita-outcomes-1')">30 August · Quizlet Cards</button>
  <button class="lesson" onclick="openPage(this,'../nikita-course/education-2026-09-04.html?v=nikita-outcomes-1')">4 September · Norwegian Prisons</button>
  <button class="lesson" onclick="openPage(this,'../nikita-course/education-2026-09-05.html?v=nikita-outcomes-1')">5 September · Quizlet Cards</button>
  <div class="section">HOMEWORK</div>
  <button class="module" onclick="openPage(this,'../nikita-homework/?v=nikita-outcomes-1')">Nikita Homework Site</button>
</aside>
<main class="main">
  <section class="cover" id="cover"><div class="coverCard"><div class="eyebrow">NIKITA · INTERACTIVE COURSE</div><h1>OUTCOMES<br>Pre-Intermediate</h1><p>Main course site for lessons, revision and Education. Homework remains on Nikita's separate homework site.</p><div class="chips"><span class="chip">Unit 7 · Crime</span><span class="chip">Unit 8 · Education</span><span class="chip">Interactive practice</span><span class="chip">Quizlet-style review</span></div></div></section>
  <iframe id="view" class="frame" title="Nikita Outcomes lesson" allow="autoplay; fullscreen" allowfullscreen></iframe>
</main>
</div>
<script>
function clearActive(){document.querySelectorAll('.module,.lesson').forEach(x=>x.classList.remove('active'))}
function showHome(){clearActive();document.getElementById('view').classList.remove('show');document.getElementById('cover').classList.remove('hide')}
function openPage(btn,url){clearActive();btn.classList.add('active');document.getElementById('cover').classList.add('hide');const f=document.getElementById('view');f.src=url;f.classList.add('show')}
</script>
</body>
</html>
