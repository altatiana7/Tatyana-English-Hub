<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GlobalLearn — Kate</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef4f8;font-family:Arial,Helvetica,sans-serif;color:#09285e}body{display:grid;place-items:center}.stage{position:relative;width:min(100vw,calc(100dvh * 16 / 9));height:min(100dvh,calc(100vw * 9 / 16));aspect-ratio:16/9}.cover{width:100%;height:100%;display:block;user-select:none}.hot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;border-radius:12px}.hot:focus-visible{outline:3px solid #1767d8;outline-offset:2px}#modules{left:.95%;top:11.9%;width:16.3%;height:10.8%}#speaking{left:.95%;top:24.2%;width:16.3%;height:11.8%}#grammar{left:.95%;top:37.6%;width:16.3%;height:11.5%}#lexis{left:.95%;top:50.6%;width:16.3%;height:11.2%}#search{left:33.9%;top:1.3%;width:44%;height:6%}#profile{left:81.2%;top:0;width:18%;height:8%}#focus1{left:52.9%;top:39.6%;width:14.8%;height:19.8%}#focus2{left:68.7%;top:39.6%;width:14.8%;height:19.8%}#focus3{left:84.3%;top:39.6%;width:14%;height:19.8%}#word1{left:52.9%;top:66.4%;width:10.7%;height:15.1%}#word2{left:64.4%;top:66.4%;width:10.7%;height:15.1%}#word3{left:76%;top:66.4%;width:10.7%;height:15.1%}#word4{left:87.4%;top:66.4%;width:10.7%;height:15.1%}#viewAll{left:91.8%;top:62.4%;width:6.4%;height:3.5%}#letsLearn{left:75.4%;top:88%;width:13%;height:7.3%}[hidden]{display:none!important}.screen{position:fixed;inset:0;background:#f5f9ff;z-index:10;display:flex;flex-direction:column}header{height:64px;flex-shrink:0;display:flex;align-items:center;gap:16px;padding:8px 20px;border-bottom:1px solid #d8e5f3;background:white}h1{font-size:clamp(18px,2.2vw,30px);margin:0;flex:1}button,input{font:inherit}header button,.control{padding:10px 18px;border:1px solid #c9dbef;background:white;color:#123f80;border-radius:10px;cursor:pointer}#content{flex:1;min-height:0;overflow:auto;padding:20px;display:flex;flex-direction:column}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;flex:1}.lesson{padding:15px;border:1px solid #cadaed;background:white;border-radius:16px;color:#103b7a;cursor:pointer;text-align:left;font-size:clamp(18px,2vw,30px)}.lesson small{display:block;color:#64778d;font-size:clamp(12px,1.2vw,18px);margin-top:12px}.empty{flex:1;display:grid;place-content:center;text-align:center;font-size:clamp(22px,3vw,42px)}.empty p{font-size:clamp(16px,2vw,24px);color:#5b6e85}.flash{flex:1;border:1px solid #ccdaed;border-radius:20px;background:white;color:#0a2e69;font-size:clamp(32px,6vw,90px);cursor:pointer;display:grid;place-content:center;text-align:center}.flash small{font-size:clamp(18px,2.5vw,34px);margin-top:20px;color:#4e6682}.controls{display:flex;align-items:center;justify-content:center;gap:20px;padding:14px}.query{width:100%;padding:16px;border:1px solid #a8c3e6;border-radius:12px;margin-bottom:18px;font-size:24px}iframe{width:100%;flex:1;border:0}button:focus-visible,input:focus-visible{outline:3px solid #247ae5;outline-offset:2px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,1fr)}header{padding:8px;gap:8px}header button{padding:10px}#content{padding:12px}}</style></head><body><main class="stage" aria-label="GlobalLearn ESL Interactive Lessons for Kate">
