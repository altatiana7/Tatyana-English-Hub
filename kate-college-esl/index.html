<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Kate · ESL Interactive Lessons</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,Helvetica,sans-serif}.stage{position:relative;width:100vw;height:100vh;overflow:hidden;background:#fff}.design{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}.hot{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;z-index:5}.h-mod{left:1.15%;top:11.7%;width:15.1%;height:10.6%}.h-spk{left:1.15%;top:23.9%;width:15.1%;height:11.2%}.h-gra{left:1.15%;top:36.6%;width:15.1%;height:11.1%}.h-lex{left:1.15%;top:49.3%;width:15.1%;height:11.3%}.overlay{position:absolute;inset:0;z-index:20;display:none;background:rgba(247,251,253,.985);backdrop-filter:blur(8px);padding:28px}.overlay.show{display:grid;grid-template-rows:auto 1fr}.top{display:flex;align-items:center;gap:18px;padding:8px 4px 22px;border-bottom:1px solid #dce7ef}.top h2{margin:0;font:700 clamp(28px,3vw,52px) Georgia,serif;color:#173b61}.top p{margin:7px 0 0;color:#7890a7;font-size:15px}.close{margin-left:auto;width:52px;height:52px;border-radius:50%;border:1px solid #cedce7;background:#fff;color:#244d75;font-size:30px;cursor:pointer}.grid{overflow:auto;padding:22px 3px;display:grid;grid-template-columns:repeat(5,minmax(150px,1fr));gap:16px;align-content:start}.lesson{min-height:145px;border:1px solid #d9e5ee;border-radius:18px;background:#fff;padding:18px;text-align:left;cursor:pointer;box-shadow:0 8px 22px rgba(31,67,99,.07)}.lesson strong{display:block;color:#7793ad;font-size:12px}.lesson b{display:block;margin-top:18px;color:#173f68;font-size:18px}.lesson span{display:block;margin-top:7px;color:#8397a9;font-size:13px}.view{position:absolute;inset:0;z-index:30;display:none;background:#f7fbfd}.view.show{display:grid;grid-template-rows:72px 1fr}.bar{display:flex;align-items:center;gap:14px;padding:0 24px;background:#fff;border-bottom:1px solid #dce6ee}.back{border:0;background:#eaf2f8;color:#234d73;border-radius:12px;padding:11px 16px;font-weight:800;cursor:pointer}.bar b{font-size:18px;color:#173f68}.empty{display:grid;place-items:center;padding:30px}.card{width:min(900px,88vw);min-height:55vh;border:1px solid #d9e5ee;border-radius:26px;background:#fff;box-shadow:0 22px 60px rgba(26,61,92,.13);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:42px}.card small{letter-spacing:.18em;color:#839bb2;font-weight:800}.card h3{margin:16px 0 8px;font:700 clamp(30px,3vw,50px) Georgia,serif;color:#173f68}.card p{margin:0;color:#788da1;font-size:17px;max-width:650px}@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.grid{grid-template-columns:repeat(2,1fr)}.overlay{padding:16px}}</style></head><body><div class="stage"><img id="design" class="design" alt="ESL Interactive Lessons for Smart College Student Kate"><button class="hot h-mod" data-section="modules" aria-label="Modules"></button><button class="hot h-spk" data-section="speaking" aria-label="Speaking Lessons"></button><button class="hot h-gra" data-section="grammar" aria-label="Grammar"></button><button class="hot h-lex" data-section="lexis" aria-label="Lexis"></button><section id="overlay" class="overlay"><div class="top"><div><h2 id="sectionTitle"></h2><p id="sectionSub"></p></div><button id="close" class="close">×</button></div><div id="grid" class="grid"></div></section><section id="view" class="view"><div class="bar"><button id="back" class="back">← Back</button><b id="viewTitle"></b></div><div class="empty"><div class="card"><small>ESL INTERACTIVE LESSON</small><h3 id="lessonName"></h3><p>This lesson space is ready for the activity you choose. The approved home-screen design remains unchanged.</p></div></div></section></div><script>fetch('assets/kate-design.b64').then(r=>r.text()).then(b=>{document.getElementById('design').src='data:image/webp;base64,'+b.trim()});const data={modules:{title:'Modules',sub:'10 interactive modules',count:10,label:'Module'},speaking:{title:'Speaking Lessons',sub:'10 speaking lessons',count:10,label:'Speaking Lesson'},grammar:{title:'Grammar',sub:'15 grammar lessons',count:15,label:'Grammar Lesson'},lexis:{title:'Lexis',sub:'10 vocabulary lessons',count:10,label:'Lexis Lesson'}};const ov=document.getElementById('overlay'),grid=document.getElementById('grid'),view=document.getElementById('view');function openSection(k){const s=data[k];document.getElementById('sectionTitle').textContent=s.title;document.getElementById('sectionSub').textContent=s.sub;grid.innerHTML='';for(let i=1;i<=s.count;i++){const b=document.createElement('button');b.className='lesson';b.innerHTML='<strong>'+String(i).padStart(2,'0')+'</strong><b>'+s.label+' '+i+'</b><span>Open lesson</span>';b.onclick=()=>openLesson(s.label+' '+i);grid.appendChild(b)}ov.classList.add('show')}function openLesson(n){document.getElementById('viewTitle').textContent=n;document.getElementById('lessonName').textContent=n;view.classList.add('show')}document.querySelectorAll('.hot').forEach(b=>b.onclick=()=>openSection(b.dataset.section));document.getElementById('close').onclick=()=>ov.classList.remove('show');document.getElementById('back').onclick=()=>view.classList.remove('show');document.addEventListener('keydown',e=>{if(e.key==='Escape'){view.classList.remove('show');ov.classList.remove('show')}});</script></body></html>
