<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GlobalLearn — Kate ESL Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf2f7;font-family:Arial,Helvetica,sans-serif;color:#17345c}body{display:flex;align-items:center;justify-content:center}.hub{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));aspect-ratio:16/9;overflow:hidden;background:#fff}.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}.hot{position:absolute;border:0;background:transparent;padding:0;margin:0;cursor:pointer;border-radius:16px}.hot:focus-visible{outline:3px solid rgba(18,61,156,.95);outline-offset:2px}@media(hover:hover){.hot:hover{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 2px rgba(255,255,255,.26)}}
#modules{left:.95%;top:11.7%;width:16.3%;height:11.0%}#speaking{left:.95%;top:24.0%;width:16.3%;height:11.0%}#grammar{left:.95%;top:37.2%;width:16.3%;height:11.0%}#lexis{left:.95%;top:50.1%;width:16.3%;height:11.0%}
#search{left:34.0%;top:1.2%;width:43.3%;height:6.2%;border-radius:32px}#profile{left:84.5%;top:.4%;width:14.6%;height:8.2%;border-radius:30px}
#focus1{left:52.8%;top:39.1%;width:14.8%;height:19.7%}#focus2{left:68.3%;top:39.1%;width:14.8%;height:19.7%}#focus3{left:83.8%;top:39.1%;width:14.6%;height:19.7%}
#viewall{left:91.0%;top:61.4%;width:6.5%;height:4.5%}#word1{left:52.9%;top:66.2%;width:10.6%;height:15.3%}#word2{left:64.5%;top:66.2%;width:10.6%;height:15.3%}#word3{left:76.2%;top:66.2%;width:10.6%;height:15.3%}#word4{left:87.7%;top:66.2%;width:10.6%;height:15.3%}#letslearn{left:75.1%;top:87.1%;width:12.8%;height:7.3%;border-radius:38px}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(12,28,51,.45);backdrop-filter:blur(5px);z-index:50}.overlay.open{display:flex}.modal{position:relative;width:min(930px,94vw);max-height:88vh;overflow:auto;background:#fff;border-radius:24px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.24)}.close{position:absolute;right:15px;top:14px;width:44px;height:44px;border:1px solid #d9e3f2;border-radius:12px;background:#eef4ff;color:#123d9c;font-size:27px;cursor:pointer}.modal h2{margin:0 54px 8px 0;color:#123d9c;font-size:31px}.lead{color:#5d7397;margin:0 0 16px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.card{border:1px solid #d8e3f5;background:#f9fbff;border-radius:16px;padding:16px}.card h3{margin:0 0 8px;color:#123d9c}.card p{margin:0;color:#3b5277;line-height:1.45}.choice{width:100%;text-align:left;border:1px solid #d8e2f1;background:#fff;border-radius:12px;padding:12px 14px;margin:7px 0;cursor:pointer;font:inherit}.choice.correct{background:#edf8ef;border-color:#83bc91}.choice.wrong{background:#fff0f0;border-color:#d89292}.flash{min-height:220px;border:1px solid #d7e2f3;border-radius:18px;background:#fff;display:grid;place-items:center;text-align:center;padding:24px;font-size:34px;font-weight:800;color:#123d9c;cursor:pointer}.flash small{display:block;margin-top:10px;color:#6f809a;font-size:14px;font-weight:500}.status{margin-top:10px;color:#5e7393}.searchbox{width:100%;border:1px solid #cdd9ed;border-radius:14px;padding:13px 15px;font:inherit;outline:none}.btn{border:0;background:#123d9c;color:#fff;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer}.btn.alt{background:#edf3ff;color:#123d9c}@media(max-width:700px){.overlay{padding:10px}.modal{padding:20px;border-radius:18px}.modal h2{font-size:25px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="hub" aria-label="ESL Interactive Lessons for Smart College Student Kate">
  <img class="bg" id="cover" alt="GlobalLearn ESL Interactive Lessons for Kate">
  <button class="hot" id="modules" aria-label="Modules"></button><button class="hot" id="speaking" aria-label="Speaking Lessons"></button><button class="hot" id="grammar" aria-label="Grammar"></button><button class="hot" id="lexis" aria-label="Lexis"></button>
  <button class="hot" id="search" aria-label="Search lessons"></button><button class="hot" id="profile" aria-label="Kate profile"></button>
  <button class="hot" id="focus1" aria-label="Academic Vocabulary"></button><button class="hot" id="focus2" aria-label="Grammar in Context"></button><button class="hot" id="focus3" aria-label="Speaking Practice"></button>
  <button class="hot" id="viewall" aria-label="View all flashcards"></button><button class="hot" id="word1" aria-label="Opportunity"></button><button class="hot" id="word2" aria-label="Perspective"></button><button class="hot" id="word3" aria-label="Achieve"></button><button class="hot" id="word4" aria-label="Confidence"></button><button class="hot" id="letslearn" aria-label="Let's Learn"></button>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="modal"><button class="close" id="close">×</button><h2 id="modalTitle"></h2><p class="lead" id="modalLead"></p><div id="modalBody"></div></section></div>
<script>
const cover=document.getElementById('cover');
Promise.all(Array.from({length:15},(_,i)=>fetch(`assets/kate-hd-${String(i).padStart(2,'0')}.txt`).then(r=>{if(!r.ok)throw Error('HD');return r.text()}))).then(parts=>cover.src='data:image/avif;base64,'+parts.join('')).catch(()=>cover.src='assets/kate-cover.webp');
(()=>{const $=s=>document.querySelector(s),ov=$('#overlay'),ttl=$('#modalTitle'),lead=$('#modalLead'),body=$('#modalBody');const open=(t,l,h)=>{ttl.textContent=t;lead.textContent=l||'';body.innerHTML=h;ov.classList.add('open');wire()};const close=()=>ov.classList.remove('open');$('#close').onclick=close;ov.onclick=e=>{if(e.target===ov)close()};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
const modules=`<div class="grid"><div class="card"><h3>College Life</h3><p>Academic English, routines, study habits and real university situations.</p></div><div class="card"><h3>Communication</h3><p>Discussion skills, opinions, interviews and confidence.</p></div><div class="card"><h3>Grammar Lab</h3><p>Grammar in context with short interactive challenges.</p></div><div class="card"><h3>Vocabulary Builder</h3><p>Collocations, word formation and phrasal verbs.</p></div></div>`;
function showModules(){open('Modules','Choose a lesson area.',modules)}
function showSpeaking(){open('Speaking Lessons','Build fluency and confidence.',`<div class="card"><h3>Speaking Practice</h3><p><b>Prompt:</b> What skill would you most like to improve this year, and why?</p><p>Use: <i>From my perspective… / One reason is… / For example… / As a result…</i></p></div><div class="card" style="margin-top:12px"><h3>Follow-up</h3><p>Give one advantage, one difficulty and one practical step.</p></div>`)}
function showGrammar(){open('Grammar','Grammar in context.',`<p><b>Choose the correct sentence.</b></p><button class="choice" data-ok="0">If I would have more time, I would join the course.</button><button class="choice" data-ok="1">If I had more time, I would join the course.</button><button class="choice" data-ok="0">If I have more time, I would joined the course.</button><div class="status" id="fb"></div>`)}
function showLexis(){open('Lexis','Useful vocabulary for study and discussion.',`<div class="grid"><div class="card"><h3>Collocations</h3><p>meet a deadline<br>gain experience<br>take responsibility</p></div><div class="card"><h3>Word Formation</h3><p>achieve → achievement<br>confident → confidence</p></div><div class="card"><h3>Phrasal Verbs</h3><p>keep up with<br>figure out<br>work on</p></div></div>`)}
function academic(){open('Academic Vocabulary','Words for university life.',`<div class="grid"><div class="card"><h3>assignment</h3><p>a piece of work given as part of a course</p></div><div class="card"><h3>deadline</h3><p>the latest time by which work must be finished</p></div><div class="card"><h3>seminar</h3><p>a class based on discussion</p></div></div>`)}
function grammarFocus(){open('Grammar in Context','Complex sentences.',`<p><b>Choose the best version.</b></p><button class="choice" data-ok="0">Although she was tired but she kept studying.</button><button class="choice" data-ok="1">Although she was tired, she kept studying because she wanted to succeed.</button><button class="choice" data-ok="0">Despite she was tired, she kept studying.</button><div class="status" id="fb"></div>`)}
function speakingFocus(){open('Speaking Practice','Express your ideas.',`<div class="card"><p><b>Question:</b> Do you prefer studying alone or with classmates? Why?</p><p>Speak for 30–40 seconds and support your answer with an example.</p></div>`)}
const words={word1:['opportunity','a chance that makes it possible to do something','The internship gave her an opportunity to gain practical experience.'],word2:['perspective','a particular way of thinking about or seeing something','Travel can change your perspective.'],word3:['achieve','to succeed in reaching a goal','She worked hard to achieve her goal.'],word4:['confidence','a feeling of trust in your own ability','Regular practice helps build confidence.']};
function word(id){const [w,m,e]=words[id];open(w,'Quick Review — Flashcard',`<div class="flash" id="flash"><div>${w}<small>click to reveal</small></div></div>`);let f=false;$('#flash').onclick=()=>{f=!f;$('#flash').innerHTML=f?`<div>${m}<small>${e}</small></div>`:`<div>${w}<small>click to reveal</small></div>`}}
function allWords(){open('Quick Review','Flashcards',`<div class="grid">${Object.values(words).map(x=>`<div class="card"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div>`)}
function search(){open('Search lessons','Find a topic or word.',`<input class="searchbox" id="q" placeholder="Search lessons, topics, or words..."><div id="results" class="status">Try: grammar, speaking, vocabulary, confidence</div>`);$('#q').oninput=e=>{const q=e.target.value.toLowerCase(),items=['Modules','Speaking Lessons','Grammar','Lexis','Academic Vocabulary','Grammar in Context','Speaking Practice','opportunity','perspective','achieve','confidence'];$('#results').innerHTML=q?items.filter(x=>x.toLowerCase().includes(q)).map(x=>`<div class="card" style="margin-top:8px">${x}</div>`).join('')||'No matches yet.':'Try: grammar, speaking, vocabulary, confidence'}}
function profile(){open('Hi, Kate','Keep going — great progress!',`<div class="grid"><div class="card"><h3>Current focus</h3><p>Academic vocabulary</p></div><div class="card"><h3>Next step</h3><p>Grammar in context</p></div><div class="card"><h3>Goal</h3><p>More confident speaking</p></div></div>`)}
function wire(){body.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{body.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add(b.dataset.ok==='1'?'correct':'wrong');const f=$('#fb');if(f)f.textContent=b.dataset.ok==='1'?'Correct.':'Try the option that is both grammatical and natural.'})}
$('#modules').onclick=showModules;$('#speaking').onclick=showSpeaking;$('#grammar').onclick=showGrammar;$('#lexis').onclick=showLexis;$('#search').onclick=search;$('#profile').onclick=profile;$('#focus1').onclick=academic;$('#focus2').onclick=grammarFocus;$('#focus3').onclick=speakingFocus;$('#viewall').onclick=allWords;['word1','word2','word3','word4'].forEach(id=>$('#'+id).onclick=()=>word(id));$('#letslearn').onclick=showModules;
})();
</script>
</body>
</html>
