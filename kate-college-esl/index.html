<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kate ESL Hub</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef4f8;font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center;width:100vw;height:100vh}
.stage{position:relative;width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));aspect-ratio:16/9;overflow:hidden;background:#fff}
.cover{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center;display:block;user-select:none;-webkit-user-drag:none;image-rendering:auto;backface-visibility:hidden}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;margin:0;border-radius:14px}
.hot:focus-visible{outline:3px solid #1767d8;outline-offset:2px}
@media(hover:hover){.hot:hover{background:rgba(255,255,255,.07)}}
#modules{left:.95%;top:10.3%;width:17.1%;height:11.4%}#speaking{left:.95%;top:23.5%;width:17.1%;height:12%}#grammar{left:.95%;top:36.7%;width:17.1%;height:11.8%}#lexis{left:.95%;top:50.5%;width:17.1%;height:11.4%}
#search{left:33.5%;top:1.2%;width:43.5%;height:5.8%;border-radius:40px}#profile{left:84.7%;top:.3%;width:14.8%;height:7.3%;border-radius:40px}
#focus1{left:52%;top:39.3%;width:15%;height:19.7%}#focus2{left:67.6%;top:39.3%;width:15%;height:19.7%}#focus3{left:83.2%;top:39.3%;width:14.8%;height:19.7%}
#word1{left:52.1%;top:66%;width:11%;height:15.5%}#word2{left:63.7%;top:66%;width:11%;height:15.5%}#word3{left:75.2%;top:66%;width:11%;height:15.5%}#word4{left:86.6%;top:66%;width:11%;height:15.5%}#viewAll{left:90.1%;top:61.5%;width:7.5%;height:3.9%}#letsLearn{left:74.4%;top:87.2%;width:13.2%;height:7.1%;border-radius:44px}
.overlay{position:fixed;inset:0;background:rgba(9,29,64,.46);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center;padding:22px;z-index:40}.overlay.open{display:flex}
.modal{position:relative;width:min(920px,95vw);max-height:88vh;overflow:auto;background:#fff;border-radius:22px;padding:26px;box-shadow:0 25px 80px rgba(0,0,0,.24)}
.close{position:absolute;right:14px;top:14px;width:42px;height:42px;border:0;border-radius:11px;background:#edf3ff;color:#073b8d;font-size:26px;cursor:pointer}
.modal h2{margin:0 52px 10px 0;color:#0c2c75;font-size:30px}.modal p{line-height:1.5;color:#364a67}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-top:14px}.card{border:1px solid #d6e2f3;border-radius:15px;padding:15px;background:#f9fbff}.card h3{margin:0 0 7px;color:#0e3c91}
.choice{display:block;width:100%;text-align:left;border:1px solid #d5e1f2;background:#fff;border-radius:11px;padding:11px 13px;margin:7px 0;cursor:pointer}.choice.correct{background:#edf8ef;border-color:#8bc49a}.choice.wrong{background:#fff0f0;border-color:#d59a9a}
.flash{min-height:220px;border:1px solid #d5e1f2;border-radius:16px;display:grid;place-items:center;text-align:center;padding:22px;font-size:32px;font-weight:700;cursor:pointer}.flash small{display:block;font-size:14px;font-weight:400;color:#63728a;margin-top:10px}.status{margin-top:9px;color:#52657f}
</style>
</head>
<body>
<main class="stage" aria-label="GlobalLearn ESL Interactive Lessons for Kate">
<img class="cover" id="coverImage" alt="GlobalLearn ESL Interactive Lessons for Smart College Student Kate">
<button class="hot" id="modules" aria-label="Modules"></button><button class="hot" id="speaking" aria-label="Speaking Lessons"></button><button class="hot" id="grammar" aria-label="Grammar"></button><button class="hot" id="lexis" aria-label="Lexis"></button><button class="hot" id="search" aria-label="Search"></button><button class="hot" id="profile" aria-label="Kate profile"></button><button class="hot" id="focus1" aria-label="Academic Vocabulary"></button><button class="hot" id="focus2" aria-label="Grammar in Context"></button><button class="hot" id="focus3" aria-label="Speaking Practice"></button><button class="hot" id="word1" aria-label="opportunity"></button><button class="hot" id="word2" aria-label="perspective"></button><button class="hot" id="word3" aria-label="achieve"></button><button class="hot" id="word4" aria-label="confidence"></button><button class="hot" id="viewAll" aria-label="View all"></button><button class="hot" id="letsLearn" aria-label="Let's Learn"></button>
</main>
<div class="overlay" id="overlay"><section class="modal"><button class="close" id="close">×</button><div id="modalBody"></div></section></div>
<script>
const img=document.getElementById('coverImage');
Promise.all(Array.from({length:15},(_,i)=>fetch(`assets/kate-hd-${String(i).padStart(2,'0')}.txt?v=9`,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('missing HD chunk '+i);return r.text()}))).then(parts=>{const b64=parts.join('').replace(/\s+/g,'');img.src='data:image/avif;base64,'+b64}).catch(err=>{console.error(err);img.src='assets/kate-cover.webp?v=9'});
const overlay=document.getElementById('overlay'),body=document.getElementById('modalBody');
function openModal(html){body.innerHTML=html;overlay.classList.add('open');wire()}
function closeModal(){overlay.classList.remove('open')}
document.getElementById('close').onclick=closeModal;overlay.onclick=e=>{if(e.target===overlay)closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
function wire(){body.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{body.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add(b.dataset.ok==='1'?'correct':'wrong');const s=body.querySelector('.status');if(s)s.textContent=b.dataset.ok==='1'?'Correct.':'Try another option.'});const f=body.querySelector('.flash');if(f){let back=false;f.onclick=()=>{back=!back;f.innerHTML=back?f.dataset.back:f.dataset.front}}}
const simple={modules:`<h2>Modules</h2><div class="grid"><div class="card"><h3>1. College Life</h3><p>Academic vocabulary and university life.</p></div><div class="card"><h3>2. Communication</h3><p>Speaking and discussion.</p></div><div class="card"><h3>3. Grammar Lab</h3><p>Grammar in context.</p></div><div class="card"><h3>4. Lexis Builder</h3><p>Collocations and word formation.</p></div></div>`,speaking:`<h2>Speaking Lessons</h2><p><b>Speak for 40 seconds:</b> What skill would you most like to improve this year and why?</p><p>Use: <i>From my perspective… / One reason is… / For example…</i></p>`,grammar:`<h2>Grammar</h2><p><b>Choose the correct sentence.</b></p><button class="choice" data-ok="0">If I would have more time, I would join the course.</button><button class="choice" data-ok="1">If I had more time, I would join the course.</button><button class="choice" data-ok="0">If I have more time, I would joined the course.</button><div class="status"></div>`,lexis:`<h2>Lexis</h2><div class="grid"><div class="card"><h3>Collocations</h3><p>gain experience • meet a deadline • take responsibility</p></div><div class="card"><h3>Phrasal verbs</h3><p>keep up with • work on • find out</p></div><div class="card"><h3>Word formation</h3><p>achieve → achievement<br>confident → confidence</p></div></div>`};
modules.onclick=()=>openModal(simple.modules);speaking.onclick=()=>openModal(simple.speaking);grammar.onclick=()=>openModal(simple.grammar);lexis.onclick=()=>openModal(simple.lexis);focus1.onclick=()=>openModal(`<h2>Academic Vocabulary</h2><p>Words for university life.</p><div class="grid"><div class="card"><h3>seminar</h3><p>a class based on discussion</p></div><div class="card"><h3>deadline</h3><p>the final time to submit work</p></div><div class="card"><h3>assignment</h3><p>a piece of work to complete</p></div></div>`);focus2.onclick=()=>openModal(simple.grammar);focus3.onclick=()=>openModal(simple.speaking);search.onclick=()=>openModal(`<h2>Search</h2><p>Search lessons, topics, or words.</p>`);profile.onclick=()=>openModal(`<h2>Kate</h2><p>Keep going — great progress!</p>`);letsLearn.onclick=()=>openModal(`<h2>Let's Learn</h2><p>Choose Modules, Speaking, Grammar or Lexis from the main screen.</p>`);viewAll.onclick=()=>openModal(`<h2>Quick Review</h2><div class="grid"><div class="card"><h3>opportunity</h3><p>A chance for a better future.</p></div><div class="card"><h3>perspective</h3><p>A particular way of seeing things.</p></div><div class="card"><h3>achieve</h3><p>To successfully complete a goal.</p></div><div class="card"><h3>confidence</h3><p>A feeling of self-assurance.</p></div></div>`);
const words={word1:['opportunity','A chance for a better future.'],word2:['perspective','A particular way of seeing things.'],word3:['achieve','To successfully complete a goal.'],word4:['confidence','A feeling of self-assurance.']};Object.keys(words).forEach(id=>document.getElementById(id).onclick=()=>{const [w,m]=words[id];openModal(`<h2>${w}</h2><div class="flash" data-front="${w}<small>click to flip</small>" data-back="${m}<small>click to return</small>">${w}<small>click to flip</small></div>`)})
</script>
</body>
</html>
