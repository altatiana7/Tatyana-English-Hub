<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ESL Interactive Lessons for Kate</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eef5f5;font-family:Arial,Helvetica,sans-serif;color:#173240}body{display:grid;place-items:center;overflow:hidden}.stage{position:relative;width:min(100vw,calc(100vh * 2.30419));aspect-ratio:1265/549;max-height:100vh;overflow:hidden;background:#fff}.cover{position:absolute;inset:0;width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none}.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:10px;padding:0}.hot:focus-visible{outline:3px solid rgba(255,255,255,.95);outline-offset:-3px;box-shadow:0 0 0 5px rgba(32,93,124,.45)}@media(hover:hover){.hot:hover{background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 2px rgba(255,255,255,.42)}}
#modules{left:1.1%;top:1.3%;width:15.2%;height:11.2%}#speaking{left:1.1%;top:14.0%;width:15.2%;height:15.2%}#grammar{left:1.1%;top:30.5%;width:15.2%;height:15.8%}#lexis{left:1.1%;top:48.6%;width:15.2%;height:15.7%}
#focus1{left:56.0%;top:35.1%;width:14.8%;height:24.8%}#focus2{left:71.0%;top:35.1%;width:14.7%;height:24.8%}#focus3{left:85.9%;top:35.1%;width:13.6%;height:24.8%}
#word1{left:56.0%;top:68.0%;width:10.3%;height:19.7%}#word2{left:66.7%;top:68.0%;width:10.3%;height:19.7%}#word3{left:77.4%;top:68.0%;width:10.3%;height:19.7%}#word4{left:88.1%;top:68.0%;width:10.3%;height:19.7%}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(16,31,39,.56);backdrop-filter:blur(6px);z-index:20}.overlay.open{display:flex}.modal{position:relative;width:min(900px,94vw);max-height:86vh;overflow:auto;background:#fff;border-radius:20px;padding:26px 28px;box-shadow:0 24px 80px rgba(0,0,0,.28)}.modal h2{margin:0 52px 6px 0;font:700 30px Georgia,serif;color:#173b4b}.modal .lead{margin:0 0 18px;color:#607681}.close{position:absolute;top:14px;right:14px;width:44px;height:44px;border:1px solid #d8e4e6;border-radius:12px;background:#fff;font-size:26px;cursor:pointer;color:#284652}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{border:1px solid #d9e4e6;border-radius:14px;padding:15px;background:#fbfdfd}.tile h3{margin:0 0 6px;font:700 17px Georgia,serif}.tile p{margin:0;color:#64777f;line-height:1.4;font-size:14px}.lessonbtn,.choice{width:100%;text-align:left;border:1px solid #d5e1e3;border-radius:12px;background:#fff;padding:12px 14px;margin:7px 0;cursor:pointer;font:inherit}.lessonbtn:hover,.choice:hover{background:#f4f9f9}.choice.correct{background:#edf8ef;border-color:#8ac19a}.choice.wrong{background:#fff0f0;border-color:#d39a9a}.flash{min-height:220px;border:1px solid #d7e3e5;border-radius:16px;display:grid;place-items:center;text-align:center;padding:24px;font-size:32px;font-weight:700;cursor:pointer;background:#fff}.flash small{display:block;font-size:14px;color:#6d8088;margin-top:12px;font-weight:400}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:12px}.btn{border:0;border-radius:11px;background:#2c6677;color:#fff;padding:11px 16px;font-weight:700;cursor:pointer}.btn.alt{background:#e9f1f2;color:#274653}.panel{padding:14px;border-radius:13px;background:#f6f9f9;border:1px solid #e0e8e9;margin:10px 0}.panel p{line-height:1.55;margin:6px 0}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf3f4;font-size:12px;font-weight:700;margin-right:5px}.status{margin-top:10px;color:#52717c;font-size:14px}@media(max-width:700px){.modal{padding:20px}.modal h2{font-size:24px}.grid{grid-template-columns:1fr}.overlay{padding:12px}}
</style>
</head>
<body>
<main class="stage" aria-label="ESL Interactive Lessons for Kate">
  <img class="cover" id="coverImage" alt="ESL Interactive Lessons for Smart College Student Kate">
  <button class="hot" id="modules" aria-label="Modules"></button>
  <button class="hot" id="speaking" aria-label="Speaking Lessons"></button>
  <button class="hot" id="grammar" aria-label="Grammar"></button>
  <button class="hot" id="lexis" aria-label="Lexis"></button>
  <button class="hot" id="focus1" aria-label="Academic Vocabulary"></button>
  <button class="hot" id="focus2" aria-label="Grammar in Context"></button>
  <button class="hot" id="focus3" aria-label="Speaking Practice"></button>
  <button class="hot" id="word1" aria-label="Opportunity"></button>
  <button class="hot" id="word2" aria-label="Perspective"></button>
  <button class="hot" id="word3" aria-label="Achieve"></button>
  <button class="hot" id="word4" aria-label="Ambitious"></button>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="modal"><button class="close" id="close" aria-label="Close">×</button><h2 id="modalTitle"></h2><p class="lead" id="modalLead"></p><div id="modalBody"></div></section></div>
<script>
const coverImage=document.getElementById('coverImage');
Promise.all(Array.from({length:4},(_,i)=>fetch(`assets/kate-exact-${String(i).padStart(2,'0')}.txt`).then(r=>{if(!r.ok)throw new Error('image');return r.text()}))).then(parts=>{coverImage.src='data:image/webp;base64,'+parts.join('')}).catch(()=>{coverImage.src='assets/kate-cover.webp'});
(()=>{const $=s=>document.querySelector(s),overlay=$('#overlay'),title=$('#modalTitle'),lead=$('#modalLead'),body=$('#modalBody');const open=(t,l,h)=>{title.textContent=t;lead.textContent=l||'';body.innerHTML=h;overlay.classList.add('open');wireInside()};const close=()=>overlay.classList.remove('open');$('#close').addEventListener('click',close);overlay.addEventListener('click',e=>{if(e.target===overlay)close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
const modules=`<div class="grid"><div class="tile"><h3>1. College Life</h3><p>Academic vocabulary, study habits, discussion.</p><button class="lessonbtn" data-open="academic">Open module</button></div><div class="tile"><h3>2. Communication</h3><p>Speaking, opinions, interviews and confidence.</p><button class="lessonbtn" data-open="speaking">Open module</button></div><div class="tile"><h3>3. Grammar Lab</h3><p>Grammar in context with short challenge tasks.</p><button class="lessonbtn" data-open="grammar">Open module</button></div><div class="tile"><h3>4. Vocabulary Builder</h3><p>Collocations, word formation and phrasal verbs.</p><button class="lessonbtn" data-open="lexis">Open module</button></div><div class="tile"><h3>5. Review</h3><p>Mixed practice and quick checks.</p><button class="lessonbtn" data-open="review">Open review</button></div></div>`;
function showModules(){open('Modules','Choose a section. The original hub design stays on the main screen.',modules)}
function showSpeaking(){open('Speaking Lessons','Build fluency and confidence.',`<div class="panel"><span class="badge">30–40 sec</span><span class="badge">B1–B2</span><h3>Speaking Practice</h3><p><b>Prompt:</b> What skill would you most like to improve this year, and why?</p><p>Use: <i>From my perspective… / One reason is… / For example… / That would help me…</i></p></div><div class="panel"><h3>Follow-up challenge</h3><p>Give one advantage, one difficulty and one practical step.</p></div>`)}
function showGrammar(){open('Grammar','Short grammar-in-context practice.',`<div class="panel"><p><b>Choose the correct sentence.</b></p><button class="choice" data-correct="0">If I would have more time, I would join the course.</button><button class="choice" data-correct="1">If I had more time, I would join the course.</button><button class="choice" data-correct="0">If I have more time, I would joined the course.</button><div class="status" id="feedback"></div></div>`)}
function showLexis(){open('Lexis','Useful words and phrases for study and discussion.',`<div class="grid"><div class="tile"><h3>Collocations</h3><p>meet a deadline • gain experience • take responsibility</p></div><div class="tile"><h3>Word formation</h3><p>achieve → achievement<br>ambition → ambitious</p></div><div class="tile"><h3>Phrasal verbs</h3><p>keep up with • figure out • work on</p></div></div>`)}
function academic(){open('Academic Vocabulary','Today’s focus.',`<div class="panel"><h3>Mini challenge</h3><p>Complete the sentence with the strongest phrase:</p><p><b>The internship gave me a valuable ______ to gain practical experience.</b></p><button class="choice" data-correct="1">opportunity</button><button class="choice" data-correct="0">perspective</button><button class="choice" data-correct="0">ambition</button><div class="status" id="feedback"></div></div>`)}
function review(){open('Quick Review','A short mixed check.',`<div class="panel"><p><b>Which sentence sounds most natural?</b></p><button class="choice" data-correct="0">I achieved to finish the task.</button><button class="choice" data-correct="1">I managed to finish the task on time.</button><button class="choice" data-correct="0">I made the task successfully.</button><div class="status" id="feedback"></div></div>`)}
const words={word1:['opportunity','a good chance to do or achieve something','The course gave her an opportunity to practise speaking.'],word2:['perspective','a particular way of thinking about or viewing something','The discussion helped me see the issue from a different perspective.'],word3:['achieve','to succeed in reaching a goal','She worked consistently to achieve her goal.'],word4:['ambitious','determined to be successful or achieve something difficult','He is ambitious and willing to work hard.']};
function wordCard(id){const [w,m,e]=words[id];open(w,'Quick Review Vocabulary',`<div class="flash" id="flash"><div>${w}<small>click to reveal meaning</small></div></div><div class="status">Click the card to flip it.</div>`);let flip=false;$('#flash').addEventListener('click',()=>{flip=!flip;$('#flash').innerHTML=flip?`<div>${m}<small>${e}</small></div>`:`<div>${w}<small>click to reveal meaning</small></div>`})}
function wireInside(){body.querySelectorAll('[data-open]').forEach(b=>b.addEventListener('click',()=>({academic,showSpeaking,showGrammar,showLexis,review,speaking:showSpeaking,grammar:showGrammar,lexis:showLexis}[b.dataset.open]||academic)()));body.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>{body.querySelectorAll('.choice').forEach(x=>x.disabled=true);b.classList.add(b.dataset.correct==='1'?'correct':'wrong');const f=$('#feedback');if(f)f.textContent=b.dataset.correct==='1'?'Correct.':'Try the option that fits the context and grammar best.'}))}
$('#modules').addEventListener('click',showModules);$('#speaking').addEventListener('click',showSpeaking);$('#grammar').addEventListener('click',showGrammar);$('#lexis').addEventListener('click',showLexis);$('#focus1').addEventListener('click',academic);$('#focus2').addEventListener('click',showGrammar);$('#focus3').addEventListener('click',showSpeaking);['word1','word2','word3','word4'].forEach(id=>$('#'+id).addEventListener('click',()=>wordCard(id)));
})();
</script>
</body>
</html>
