<style>
.rusel{font-size:18px;padding:7px 10px;border:2px solid #9fb0cb;border-radius:9px;background:#fff;max-width:300px}
.stim mark{background:#d9efe9;color:inherit;font-weight:700;border-radius:4px;padding:0 2px}
.panel.rback{background:var(--ink);color:#fff;border-color:var(--ink)}
.rback .ey{font-size:15px;letter-spacing:1px;text-transform:uppercase;color:#b8c4dc;margin-bottom:8px}
.rback .bk{font-size:20px;line-height:1.42;margin:0 0 8px}
.rback .bk.sm{font-size:16px;color:#dbe2f0}
.rback .bk i,.rback .rq i,.rback .bkl i{color:#f2b9a6;font-style:normal;font-weight:700}
.rback .bkl{font-size:21px;line-height:1.4;margin:0 0 8px;padding-left:28px}
.rback .bkl li{margin-bottom:8px;padding:0}
.rback .rq{border-top:1px solid #3b4a6b;padding:8px 0 4px}
.rback .rq:first-of-type{border-top:0}
.rback .rq b{font-size:20px;line-height:1.35;color:#fff;display:block}
.rback .rq p{font-size:19px;line-height:1.4;margin:4px 0 0}
.rback .tg{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink);background:#9fd8cc;border-radius:6px;padding:1px 7px;margin-right:8px;vertical-align:2px}
.ruad{flex:0 0 250px;min-height:150px;border-radius:10px;color:#fff;display:flex;flex-direction:column;justify-content:center;gap:8px;padding:14px 16px;text-align:center}
.ruad b{font-size:23px;line-height:1.2}
.ruad span{font-size:16px;opacity:.92}
.slot{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:118px;border:2px dashed #9fb0cb;border-radius:8px;background:#f6f8fc;padding:8px;cursor:pointer;font-weight:600}
.slot span{font-size:15px;line-height:1.25}
.slot i{font-style:normal;font-size:13px;color:var(--muted);font-weight:400}
.pics img{max-height:150px;object-fit:cover}
@media(max-height:640px){.rback .ey{margin-bottom:4px}.rback .bk{font-size:17px;line-height:1.36;margin-bottom:5px}.rback .bkl{font-size:18.5px;line-height:1.32;margin-bottom:4px}.rback .bkl li{margin-bottom:4px}.rback .rq b{font-size:18px}.rback .rq p{font-size:17px;line-height:1.35}.rback .rq{padding:5px 0 3px}}
.stage{perspective:1800px}
.flipcard{cursor:pointer;backface-visibility:hidden}
.flipout{animation:ruFo .17s ease-in forwards}
.flipin{animation:ruFi .26s ease-out}
@keyframes ruFo{to{transform:rotateY(90deg)}}
@keyframes ruFi{from{transform:rotateY(-90deg)}to{transform:none}}
@media(prefers-reduced-motion:reduce){.flipout,.flipin{animation-duration:.01s}}
</style>
