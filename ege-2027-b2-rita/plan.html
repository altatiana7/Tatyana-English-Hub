<h2>Занятие 1 · диагностика · онлайн, один на один · 60 минут</h2>
<p><b>Порядок:</b> сначала устная часть (вопросы, чтение вслух, монолог) и аудирование – пока ученица свежая и разговорилась; затем грамматика, лексика и чтение. Ошибки на уроке не разбираем: только фиксируем. Занятие проводится отдельно с каждой ученицей.</p>
<p><b>Как показывать:</b> ученица открывает <a href="lesson1.html?v=39">тренажёр</a> у себя, выбирает своё имя вверху и включает демонстрацию экрана – так она сама печатает и нажимает, записи звучат у неё без задержки, ответ записывается с её микрофона. Вы открываете ту же страницу у себя только для панели «Оценка учителя». Если показываете со своей доски, дайте ученице управление экраном и включите передачу звука компьютера.</p>

<tr><th style="width:80px">Время</th><th style="width:230px">Шаг</th><th>Что делает ученица</th><th>Что делает учитель</th></tr>
<tr><td>0–3</td><td>Вход</td><td>Выбирает своё имя, включает демонстрацию экрана, говорит, какие задания считает лёгкими, а какие слабыми.</td><td>Правила: без словаря, как на экзамене. Просит включить «Запись ответа».</td></tr>
<tr><td>3–9</td><td><b>1 · Интервью</b></td><td>Слушает пять вопросов по одному и отвечает, по 40 секунд на каждый. Текста вопросов не видит.</td><td>Не перебивает. Отмечает: 2–3 фразы или одна, время глагола, ответ на обе части вопроса.</td></tr>
<tr><td>9–13</td><td><b>2 · Вопросы</b></td><td>Полторы минуты готовится, задаёт четыре прямых вопроса по объявлению, по 20 секунд.</td><td>Отмечает порядок слов и вспомогательный глагол.</td></tr>
<tr><td>13–16</td><td><b>3 · Чтение вслух</b></td><td>Полторы минуты читает про себя, полторы – вслух.</td><td>Отмечает паузы, интонацию, трудные слова.</td></tr>
<tr><td>16–22</td><td><b>4 · Монолог</b></td><td>Две с половиной минуты готовится, до трёх минут говорит по двум фотографиям.</td><td>Отмечает обращение к другу, четыре пункта плана, вступление и заключение, число фраз.</td></tr>

<h3>Если времени не хватает</h3>
<p>Устную часть и аудирование не сокращайте – их нельзя проверить без вас. Чтение (шаг 9) можно оставить ученице на дом: страница занятия открывается у неё по той же ссылке.</p>
<h3>После урока</h3>
<p>Поставьте баллы за устную часть по записи в панели «Оценка учителя» и внесите результат во вкладку «Сводка диагностики» – там отдельные столбцы для каждой ученицы. Письмо 37 и 38 оцените по критериям, когда придёт домашний отчёт.</p>

<h2>Как устроена подготовка</h2>
<p>Ученицы занимаются онлайн, каждая отдельно: два занятия в неделю – около 68 встреч до экзамена у каждой: 51 занятие на 17 тематических блоков ФИПИ (по три на блок) и около 17 на повторение и пробники. Результат при таком графике даёт самостоятельная работа между уроками; урок нужен для того, что нельзя сделать одной: устная часть, разбор письма, анализ ошибок и новая стратегия. План по неделям общий, а карта ошибок и акценты – личные.</p>
<div class="two">
<div>
<h3>Урок · 60 минут</h3>
<ol>
<li><b>5 минут</b> – блиц по личной карте ошибок (10 пунктов из прошлых работ).</li>
<li><b>20 минут</b> – письмо: разбор работы, которую учитель проверил заранее: ученица сама находит потери по критериям и переписывает слабый абзац на экране.</li>
<li><b>25 минут</b> – устная часть: один новый приём, затем ответ в режиме экзамена с записью; ученица слушает запись и сама ставит себе баллы по критериям.</li>
<li><b>10 минут</b> – стратегия одного задания тестовой части и задание к следующему уроку.</li>
</ol>
<h3>Между уроками · 4–5 часов в неделю</h3>
<ul>
<li>Задания 19–36 – два блока по 20–25 минут.</li>
<li>Аудирование 1–9 – один вариант, 30 минут, затем разбор ошибок по тексту записи.</li>
<li>Чтение 10–18 – один вариант, 30 минут.</li>
<li>Письмо – одна работа в неделю (37 и 38 по очереди), строго по таймеру.</li>
<li>Устная часть – один полный вариант с записью, 17 минут.</li>
<li>Карта ошибок – 10 минут четыре раза в неделю.</li>
</ul>
</div>
<div>
<h3>Правила</h3>
<ul>
<li>Письменные работы и записи устных ответов приходят <b>накануне урока</b>: учитель проверяет заранее, на уроке только разбор.</li>
<li>Каждая ошибка попадает в карту: номер задания → что написала → как верно → правило. Ошибка, повторившаяся дважды, становится темой блица.</li>
<li>Материал – Открытый банк заданий ФИПИ, демоверсия, кодификатор и спецификация 2027 года. Сборники – только для пробников.</li>
<li>Время на разделы – как рекомендует ФИПИ: аудирование 30 минут, чтение 30, грамматика и лексика 40, письмо 90. Цель для 19–36 – уложиться в 25–30 минут; сэкономленное время уходит на письмо.</li>
</ul>
<h3>Ориентиры на 80 тестовых баллов</h3>
<table>
<tr><th>Раздел</th><th>Максимум</th><th>Цель</th></tr>
<tr><td>Аудирование</td><td>12</td><td>10</td></tr>
<tr><td>Чтение</td><td>12</td><td>10</td></tr>
<tr><td>Грамматика и лексика</td><td>18</td><td>15</td></tr>
<tr><td>Письмо</td><td>20</td><td>15</td></tr>
<tr><td>Устная часть</td><td>20</td><td>16</td></tr>
<tr><td><b>Всего</b></td><td><b>82</b></td><td><b>66</b></td></tr>
</table>
<p class="note">80 тестовых – это примерно 66 первичных баллов из 82, то есть можно потерять около 16. Точное соответствие зависит от шкалы перевода, которую Рособрнадзор утверждает на каждый год. Больше всего баллов обычно теряют в письме 38 и устной 4 – на них и уходит основное время уроков.</p>
</div>

<p>По проекту демоверсии 2027 года структура и содержание КИМ не изменились по сравнению с 2026 годом. Максимум – 82 первичных балла. Письменная часть – 3 часа 10 минут, устная – 17 минут, в разные дни.</p>

<h3>Задание 37 · 6 баллов</h3>
<ul>
<li><b>К1 Решение коммуникативной задачи – 2:</b> ответы на три вопроса, три вопроса по заданной теме, обращение, благодарность или реакция на письмо, надежда на контакт, завершающая фраза, подпись; неофициальный стиль.</li>
<li><b>К2 Организация – 2:</b> логика, абзацы, средства связи, оформление по нормам письма.</li>
<li><b>К3 Языковое оформление – 2.</b></li>

<h3>Задание 38 · 14 баллов</h3>
<ul>

</ul>

<ul>

<li><b>2:</b> косвенный вопрос, неверный порядок слов, пропуск вспомогательного глагола, вопрос не по пункту.</li>
<li><b>3:</b> ответ из одной фразы, ответ на половину двойного вопроса, неверное время глагола.</li>

function wrap(t){const p=el('div','panel grow');p.append(t.content.cloneNode(true));const s=el('div','stage');s.append(p);return s;}
const ROWS=[['Аудирование 1–9',12,10,'дом'],['Чтение 10, 12–18',10,8,'дом'],['Чтение 11',2,2,'урок'],['Грамматика и лексика 19–36',18,15,'урок'],['Письмо 37',6,5,'дом'],['Письмо 38',14,10,'дом'],['Устная 1',1,1,'урок'],['Устная 2',4,3,'урок'],['Устная 3',5,4,'урок'],['Устная 4',10,8,'урок']];
const NAMES=['Ученица 1','Ученица 2'],vals=[ROWS.map(()=>''),ROWS.map(()=>'')];
function summary(){
  const st=el('div','stage'),a=el('div','panel grow doc'),b=el('div','panel side doc');
  a.append(el('h2',null,'Сводка диагностики'),el('p','note','Впишите баллы с экрана «Итоги» и из домашних отчётов. Данные не сохраняются: скопируйте итог кнопкой справа.'));
  const g=el('div','calc');g.style.gridTemplateColumns='1fr 90px 90px 80px 60px 60px';['Раздел','Ученица 1','Ученица 2','Максимум','Цель','Где'].forEach(x=>g.append(el('b',null,x)));
  ROWS.forEach((r,k)=>{g.append(el('span',null,r[0]));[0,1].forEach(w=>{const i=el('input');i.type='number';i.min=0;i.max=r[1];i.value=vals[w][k];i.setAttribute('aria-label',NAMES[w]+' · '+r[0]);i.oninput=()=>{vals[w][k]=i.value;upd();};g.append(i);});g.append(el('span',null,String(r[1])),el('span',null,String(r[2])),el('span','note',r[3]));});
  a.append(g);const out=el('div');b.append(el('h2',null,'Результат'),out);
  const sum=w=>ROWS.reduce((s,r,k)=>s+Math.min(r[1],Math.max(0,+vals[w][k]||0)),0);
  const weak=w=>ROWS.map((r,k)=>[r,vals[w][k]]).filter(x=>x[1]!==''&&+x[1]<x[0][2]).sort((x,y)=>(x[1]/x[0][1])-(y[1]/y[0][1]));
  const text=()=>'Диагностика ЕГЭ 2027\n'+[0,1].map(w=>NAMES[w]+': '+sum(w)+' / 82\n'+ROWS.map((r,k)=>'  '+r[0]+': '+(vals[w][k]===''?'—':vals[w][k])+' / '+r[1]+' (цель '+r[2]+')').join('\n')).join('\n');
  function upd(){out.innerHTML=[0,1].map(w=>{const wk=weak(w);return '<h3>'+NAMES[w]+' · '+sum(w)+' / 82 · '+Math.round(sum(w)/82*100)+'%</h3>'+(wk.length?'<ul>'+wk.map(x=>'<li>'+x[0][0]+': '+x[1]+' из '+x[0][1]+', до цели '+(x[0][2]-x[1])+'</li>').join('')+'</ul>':'<p class="note">Нет разделов ниже цели или баллы не внесены.</p>');}).join('')+'<p class="note">Цель на экзамен – около 66 первичных (80 тестовых).</p>';}
  upd();const msg=el('span','note'),cb=el('button','btn main','Скопировать сводку');cb.type='button';cb.onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(text()):Promise.reject()).then(()=>{msg.textContent=' Скопировано.';}).catch(()=>{msg.textContent=' Не получилось скопировать.';});};
  b.append(cb,msg);st.append(a,b);main.append(st);
}
function months(){main.append(el('h1','ttl','17 тематических блоков ФИПИ <span>2 занятия в неделю · по 3 на блок</span>'));
  const p=el('div','panel grow doc');let h='<table><tr><th style="width:40px">№</th><th style="width:210px">Блок</th><th>Тема ФИПИ</th><th style="width:150px">Даты</th><th style="width:70px">Уроки</th><th style="width:200px">Задания ЕГЭ в фокусе</th></tr>';
  BL.forEach(b=>{h+='<tr'+(b.n===SC.curBlock?' class="lesson"':'')+'><td><b>'+b.n+'</b></td><td><b>'+b.en+'</b></td><td>'+b.ru+'</td><td>'+SC.blockDates(b.n)+'</td><td>'+(3*b.n-2)+'–'+(3*b.n)+'</td><td>'+b.focus+(b.mock?' · <b>'+b.mock+'</b>':'')+'</td></tr>';});
  h+='<tr><td><b>18</b></td><td><b>Повторение</b></td><td>Все 17 тем вразнобой, полные варианты, пробник 4</td><td>19 апр – июнь</td><td>52–68</td><td>все задания</td></tr>';
  p.innerHTML=h+'</table>';const st=el('div','stage');st.append(p);main.append(st);
  main.append(el('div','note','Темы – тематическое содержание речи ЕГЭ по английскому языку (ФИПИ, навигатор подготовки).'));}
const TABS=[['17 блоков ФИПИ',months],['Занятие 1',lessonPage],['План по неделям',weeks],['Сводка диагностики',summary],['Система работы',()=>main.append(wrap($('#t-system')))],['Формат и критерии',()=>main.append(wrap($('#t-format')))]];
let cur=0;
function draw(){tabs.innerHTML='';TABS.forEach((t,k)=>{const b=el('button','tab'+(k===cur?' on':''),t[0]);b.type='button';b.onclick=()=>{cur=k;draw();};tabs.append(b);});main.innerHTML='';TABS[cur][1]();}
draw();
</script>
