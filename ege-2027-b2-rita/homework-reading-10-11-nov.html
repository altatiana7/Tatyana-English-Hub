<style>*{box-sizing:border-box}body{margin:0;background:#eef3fa;color:#192f4a;font:16px/1.5 Arial,sans-serif}button,select{font:inherit;cursor:pointer}.wrap{max-width:1400px;margin:auto;padding:12px}.head,.card{background:white;border:1px solid #dbe5f3;border-radius:14px;padding:15px}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:22px;margin:0}h2{font-size:20px;margin:0 0 9px}.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.tab{background:white;border:1px solid #c5d5ed;border-radius:8px;padding:8px 12px;font-weight:bold;color:#254a7e}.tab.on{background:#2855d9;color:white}.tab.ready{border-color:#4d9b73}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px;align-items:start}.text{font:18px/1.65 Georgia,serif}.text p{margin:0 0 13px}.text b{font-family:Arial}.right{display:grid;gap:12px}.choice{padding:5px 0;border-bottom:1px solid #e9edf5}.answer{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.answer label{display:grid;text-align:center;font-weight:700;gap:4px}.answer select{width:100%;border:1px solid #a6bbd4;background:white;padding:8px 1px;border-radius:7px}.btn{background:#2855d9;color:white;border:0;border-radius:9px;padding:9px 14px;font-weight:700;margin-top:12px}.sub{color:#687788;font-size:13px}.feedback{background:#eef8f1;border-radius:9px;padding:8px;margin-top:9px;font-weight:700}.correct{color:green}.wrong{color:#b12a3c}@media(max-width:840px){.grid{grid-template-columns:1fr}.wrap{padding:7px}.text{font-size:16px}}</style><script src="../shared/hw-parts.js?v=1"></script></head><body><div class="wrap"><div class="head"><div><div class="sub">РИТА · ЕГЭ · ДОМАШНЕЕ ЧТЕНИЕ</div><h1>10 текстов · Задания 10 и 11</h1><div class="sub">5 заданий на заголовки + 5 заданий на восстановление пропусков</div></div><div id="send"></div></div><nav id="tabs" class="tabs"></nav><main id="content"></main></div><script>
const DATA=[{"type":10,"title":"Emperor penguins","headings":["Shifting responsibilities","Fast way of travelling","Learning to survive","Safer and merrier","Changing conditions","Difficult incubation","Cold-climate companions","First important steps"],"paragraphs":["Emperor penguins are well-known for their cliff-diving. Normally, young penguins jump only a couple of feet from floating sea ice into the water when they feed. However, this is not always the case. Sometimes juveniles find themselves in a tricky location for a water entry when they become very hungry. Such situations force them to jump from a great height no matter what. This is a true demonstration of the penguins’ fortitude. These fascinating birds have evolved over millions of years to survive on the coldest, windiest, and driest continent on Earth.","Emperor penguins can grow up to 45 inches tall and weigh up to 88 pounds. Many of their most amazing traits can be only seen during nesting season, which runs through the most difficult time of year. Female emperor penguins lay a single pear-shaped egg early in the Antarctic winter when temperatures can fall to minus 50 degrees Fahrenheit and winds can reach hurricane force. Needing to refill their energy reserves, they quickly shuffle the eggs to their mates to take care while they move to the ocean to feed.","Male emperor penguins spend the next two months incubating the eggs balanced on top of their webbed feet and shielded from the cold by a flap of the penguin’s abdominal skin that forms a pocket, or so called “brood pouch”. The soon-to-be fathers will go nearly four months without food, losing roughly half their weight during breeding season. Eggs typically hatch by August, just as the females are returning to provide their young with a first meal. Then the chicks will be fed and warmed by their parents over the next five months.","Huddling etiquette is a survival skill all young emperor penguins must learn. The youngsters learn to huddle, but not always neatly. In fact, there is always a big mess about huddling. Instead of waiting for their turn to reach the warm centre, impatient chicks will often jump right in. A few nestle together, then others race up and slam into the pile. As the huddle grows, latecomers try pushing in right in the warm portion of the huddle. Huddled together, the little penguins begin to socialize with each other.","By mid-December, as the Antarctic summer approaches, the chicks have started to shed their fluffy down for waterproof plumage. After that, the chicks no longer require parental care – adults leave them in groups of chicks called crèches while they go out to fish. From then on, the juveniles have to fend for themselves. They quickly leave their colony in search of food. To do that, they have to take a literal leap of faith into the sea. It is a very important moment when they begin their life in the ocean, where they’ll spend an average of five years before returning to breed.","Emperor penguins settled in the unforgiving climate of Antarctica, hence they have a thicker layer of body fat, scalelike feathers, and clawlike feet especially suited to walking on the ice. However, penguins use more than their feet for movement. On land, where their waddling slows them down, emperor penguins often resort to tobogganing – sliding on their bellies while pushing with their flippers and feet. This transportation allows them to cover vast distances across the icy expanse as they travel to and from the sea.","Scientists do not believe that cliff-jumping by young penguins is directly caused by climate change. However, one expert suggests that rising temperatures might push more emperor penguins to breed on permanent ice shelves instead of sea ice. If this happens, young penguins would have to jump from taller heights when leaving the nest, which could increase risks. This case emphasises a harsh reality: under some climate scenarios, scientists predict, 80 percent of Antarctica’s emperor penguin colonies will disappear by the turn of the century."],"key":"8164325"},{"type":10,"title":"Lions","headings":["Lions’ home","Lions in danger","Necessary for nature","Problems of family life","Appearance matters","Giving a helping hand","Looking after their young","Clever strategies for food"],"paragraphs":["The magnificent lion is the symbol of Africa. Powerful and beautiful, the king of the beasts has no natural enemies. Lions have strong, compact bodies and powerful forelegs, teeth, and jaws for pulling down their food. Their coats are yellow-gold, and adult males have manes that range in colour from blond, to reddish-brown and black. The length and the colour of a lion’s mane are likely determined by age, genetics, and hormones. Young lions have light spots on their coats that disappear as they grow.","Lions are mammals and the most sociable of all big cats. They live in groups called prides, which usually consist of related females and their cubs. Males often fight to maintain dominance. Young females usually stay in their mothers’ prides for life, unless food shortage forces them out. Young males are driven from their prides when they grow large enough to compete with the dominant males. This usually happens when young males are between the ages of 2 and 4.","Today, lions are not at risk of extinction in Africa. However, three-quarters of their populations are in decline. The main threats to African lions are conflicts with people and the loss of living space, as well as climate change and wildlife trade. Some African lion populations have become small and isolated. Besides, the number of plant-eating animals they hunt for is being reduced. With around 23,000 African lions left in the wild, they are now officially classified as “vulnerable.”","African lions are highly adaptable animals and can be found in a wide variety of habitats, including desert areas. They prefer open woodland and thick bush, as well as scrub and grasslands. Such environments help them to hunt and also to find shade to rest during the hottest part of the day. African lions used to be spread across most of the continent. But now they are only found in sub-Saharan Africa, with 80% in eastern or southern Africa. Three of the five largest populations are in Tanzania.","Lions are top hunters in their environments, whether that is grassland, desert, or open woodland. It means they play an important role in keeping a healthy balance of numbers among other animals, especially plant-eating ones, like zebra and wildebeest. This influences the condition of grasslands and forests. By protecting a lion’s landscape, people are helping the whole area to grow and develop, which does not just benefit wildlife, but the people who rely on local natural resources, too.","Lions do most of their hunting at night as their eyes have adapted to the dark. This gives them a huge advantage over the animals they hunt for. Interestingly, lions also hunt during storms. The noise, rain, and wind make it harder for other animals to see and hear lions, increasing their chances of a successful hunt. Females are the primary hunters, although males will sometimes join them during a hunt. When hunting, females have specific roles. Some chase the animal towards those in the centre.","To save lions, new protected areas of habitat in east Africa are organised. There is a special conservation programme in Kenya that monitors and protects lions. The programme educates local people on lion conservation, too. This includes working with local communities, such as anti-poisoning actions. They also provide better fenced areas for farm animals in local villages. Taking school children on trips to see the wild animals they are saving is one more important action to support wildlife."],"key":"5421386"},{"type":10,"title":"Inventions","headings":["From natural to technological","Present everywhere","Smart ideas changing the world","Making our lives less boring","Cheaper and stronger over time","Changing habits","Necessary at sea","Helping to get around"],"paragraphs":["Humans are naturally curious and creative. This led our species to many scientific and technological discoveries. Since many years ago our earliest ancestors hit a rock to make the first sharp-edged tool, humans have continued to innovate. From the debut of the wheel to the launch of Mars rovers, several of these key findings stand out as especially revolutionary. Some inventions were made by chance. However, most of them were the work of innovative thinkers who had put many years into their discoveries.","Finding your way in the world was much harder in the past. People used tools like compasses, maps and stars to explore and settle in most parts of our planet. However, these old methods didn’t work well for exact navigation, especially for airplanes or when walking in unfamiliar places. The invention of GPS fixed this problem. GPS is a system of satellites that send signals to Earth. Anyone with a GPS device can use these signals to know exactly where they are. GPS is very important for safety.","Before the invention of the wheel, humans were limited in how much stuff we could transport over land, and how far. The wheel itself was not the most difficult part of “inventing the wheel.” When time came to connect a platform to the wheel, things got tricky. For instance, the holes at the centre of the wheels had to be nearly perfectly round and smooth. The hard work paid off. Wheeled carts helped agriculture and transportation of goods. Now, wheels are found in everything from clocks to vehicles or turbines.","Ancient mariners used the stars for navigation, but this method didn’t work during the day or on cloudy nights, making it dangerous to travel far from land. The first compass was invented in China. It was used for navigation for the first time between the 11th and 12th centuries. Soon after, the technology was brought to the West. The compass helped mariners to navigate safely far from land. It opened up the world for exploration and the development of global trade. This instrument is still widely used today.","The invention of the light bulb transformed our world. It made us less dependent on natural light. It allowed us to be productive at any time, day or night. Thomas Edison is credited as the primary inventor of the technology because he made a lighting system in 1879. This invention introduced electricity to homes of the Western world. It also had a rather unexpected result of modifying people’s sleep patterns. Instead of going to bed at nightfall and sleeping in segments throughout the night, we now sleep all in one go.","People first made nails over 2,000 years ago in Ancient Rome. This became possible when humans learned how to work with metal. Before this, builders had to fit wooden pieces together in special ways, which was much harder and took more time. Until about 200 years ago, workers made nails by hand. A blacksmith would heat an iron rod and hammer it into shape. Machines started making nails between 1790 and 1820, which made them more available. The way we make nails keeps improving. Now nails are made from steel and last longer.","People have been keeping food cold for thousands of years. In ancient times, they used ice or cold water, depending on where they lived. The first artificial cooling system appeared in 1748. In 1834, American engineer Jacob Perkins created a new cooling system using compressed gas. Then in 1876, German engineer Carl von Linde found a way to turn gas into liquid. The first home refrigerator was invented in 1913 by American engineer Fred Wolf. As more people wanted fresh food, refrigerators became common in houses."],"key":"3827651"},{"type":10,"title":"AI","headings":["You need to believe it","Not only for the study","Just progress, nothing more","Develop your thinking skills – write by yourself","Too many emotions","Cleverer than some may think","Individuality matters","More than grammar and vocab"],"paragraphs":["I have just finished my college applications. When I was doing them, I visited several websites, and each one stressed this fact: essay readers want to hear a student’s voice. AI can write well-structured essays in two minutes, but these essays have no voice. They are formulaic and dry, and they will not help a student get into a university. To have a chance, their essays must be interesting and engaging. So, a student must put in the work, writing and rewriting until they have produced an essay that tells readers who they are.","While AI has its advantages, it can’t bring the satisfaction which comes from writing by yourself. AI uses the existing ideas of others in order to generate an answer. However, the response is not unique and does not truly represent the idea the way you would. When you write, it causes you to reflect on a topic and come up with an original idea. You understand a topic in greater depth. It creates a sense of clarity, and you look at a problem from different angles. So, it is still important to learn to be a good writer.","If you are writing an essay using AI, that is plagiarism. It can get you in a lot of trouble because it is against the law to try to make it seem like it is your writing. So I believe that learning how to be a good writer still matters a lot. When you write any sort of essay, you learn to communicate your ideas to your audience. This skill can be used in your daily life. You need to clearly express yourself when you talk to your teachers, write emails, or send a text message to your friends. This is something that AI cannot help you with.","Writing is still an important skill, but maybe not in the same way it was in the past. In an era of improving AI, topics such as grammar and spelling are less important than ever. Platforms already correct small grammar mistakes; how long till they can suggest improving sentences? However, being a good writer is not just using grammar or vocabulary correctly. It is about collecting your thoughts into a logical text. If you want to communicate your own ideas, you are better off just writing it yourself.","AI will eventually replace the need for the average person to write at the level that they do. AI is no different than every other tech advancement we have made, which have made tasks like writing easier. Similar concerns could have been raised with the introduction of computers in the classroom, and the loss of people having great handwriting. I don’t think the prospect should be worrying. AI is a tool. Having it write for us will allow us to focus on more important things that AI is not yet capable of.","AI is becoming more and more competent. This could mean more students will find their way to an AI site to look for an answer. I agree that this could spell trouble for student intelligence if answers are so readily available. But you might want to consider the students themselves. The majority are hardworking and smart. They are not just smart about subjects at school, but about using AI for their school work. Students will probably not use this tech first hand until it stops making errors, and that will take some time.","Learning to be a good writer absolutely still matters in the age of AI. While artificial intelligence can assist with certain aspects of writing, such as grammar checking, it cannot replace the creativity, critical thinking, and emotional intelligence that we human writers bring to the table. Another reason is that storytelling is part of human life. A good writer inspires thoughts, feelings, and actions. AI may boost efficiency, but it cannot copy the truthfulness that a human writer brings to their work."],"key":"7428365"},{"type":10,"title":"Studying","headings":["Small pleasures for big efforts","Study time, digital silence","Beat delay by starting strong","Two heads learn better than one","The smart way to press pause","Learning works differently","Too late to take a break","One thing at a time"],"paragraphs":["Figuring out the way you learn best will help you in your academic life. Over the years, researchers and psychologists have tried to understand how we learn. The VARK model proposes that if you are a visual learner, you need to use visuals such as diagrams, charts and colour in your notes. Auditory learners can learn best through listening. Kinaesthetic learners prefer using all their senses or moving around. Of course, we learn through a mix of styles and methods, but one may be more useful than the others.","Studying on your own can be productive; however, there are times when studying in a group can be more effective. Studying in a group or with a partner can make the experience more enjoyable. It can provide you with new views and experiences. It can also be helpful in revealing knowledge gaps or gaps in your understanding. For example, when explaining a concept to the members of your study group, you may realise that you get stuck while explaining a step of a process.","Our attention span is between 45 to 60 minutes so continuous studying is not as productive as you may think. Taking a break will help you prevent study fatigue and allow you to return to your notes with fresh focus. However, if the breaks are too long, you will lose motivation to return to your studies. Try using the Pomodoro Technique where you balance study and breaks. Set a timer for 25 minutes and completely focus on your task. When the time is up, take a short 3-to-5-minute break.","In order to be productive and study efficiently, it is important to reward yourself for your hard work. This can help to keep you motivated and will also reinforce the behaviour. There are several ways that you can reward yourself. Give yourself one evening off once you have achieved your study goals. Reward a study session with a half hour of your favourite show or game. You can take a nap, or meet up with a friend, whatever makes you happy. You complete your study, you get a reward!","A popular productivity and time management method used by many around the world, is the “Eat the Frog” technique. This is how it works. First, choose a “frog” (difficult task) for the day. You should try to get your task done early in the day. It helps when you have an assignment with a near deadline, but you are not sure how to start. When a task is difficult, we tend to put it off. By completing the most difficult tasks of the day first thing in the morning, you are putting a stop to procrastination.","Most of us buy into the idea that we can multitask effectively, but in reality, we cannot focus on multiple tasks at the same time. What usually happens is that our focus moves from task to task. As a result of this, the task we are trying to complete takes longer, and we are more likely to make mistakes. Instead of multitasking, try to focus on single tasks at a time. You might spend an hour studying with the TV on, but instead focus only on your study for 45 minutes and this will allow you to watch TV for 15 minutes.","When we talk about productivity, it is true that there are some unavoidable distractions that students face. However, there are certain things that we can do to limit distractions and therefore improve our productivity. Firstly, it is important to minimise the use of devices when trying to study or be productive. If we receive a message and we decide not to check it, it will hold our attention. It is best to keep devices out of sight and out of mind. Also take away smart watches. They may alert you and break your focus."],"key":"6451382"},{"type":11,"title":"Climate change","text":"Climate change is putting hundreds of millions of people’s lives at risk, and is threatening nature worldwide – from the poles to the tropics, from mountains to oceans. Many of the world’s biggest challenges, from poverty to dying wildlife, are increased by the climate crisis. Climate change is caused by increasing greenhouse gases in the atmosphere, A__________ the planet’s weather patterns. Such a rise in the average temperature is often referred to as “global warming.” Climate and weather are often confused. Weather refers to short-term changes in atmospheric conditions, B__________ a much longer period. That is why we still experience cold, snowy days, even though we are now facing a climate crisis, C_________. The impact of climate change can be seen everywhere, from melting glaciers resulting in a global rise in the sea level, D__________, more frequent heatwaves, and other extreme weather events. All these extreme weather events threaten people’s lives and nature across the planet. They are also more difficult E__________. The longer people wait to act, the worse the situation will become. While climate change is a global crisis, its effects are not felt evenly worldwide. The poorest, native people, and future generations are those F__________ greenhouse gases. However, they are often the most affected by the climate crisis.","options":["while climate refers to changes over","resulting in serious, long-term shifts in","who is living in harmony with nature","which has resulted from global warming","who are the least responsible for","and more expensive to recover from","to heavier rainstorms, more droughts"],"key":"214765"},{"type":11,"title":"Eastern Himalayas","text":"The Himalayas are the greatest mountain system in Asia, and one of the planet’s youngest mountain ranges. The mountain range extends for A__________ of Bhutan, China, India, Nepal, and Pakistan. The Himalayas are categorised into three regions – Western, Central, and Eastern Himalayas – from west to east. Best known for B__________, the region of Eastern Himalayas is an important environment for lots of wildlife and people. The wide range of weather conditions there means C_________. Its lowlands and forests are home to tigers, elephants, and rhinos. It is one of the few places on Earth D__________. Rare snow leopards move around its upper slopes. Its glaciers and snow caps feed millions of people downstream with fresh water. The Himalayas are sometimes referred to as the “third pole” E__________ than anywhere outside of the poles. It is a cultural haven too. It is the birthplace of major religions and cultures. Local traditions and lifestyles have been greatly shaped by the environment there. In this economically poor part of the world, isolated communities are very dependent on natural resources. Sadly, only about a quarter of the area’s original environment is not spoiled in any way. Big parts of forest have been lost in recent decades. And F__________, 90% could be gone by the end of the century! Environmentalists are working hard to stop this.","options":["that there is a great variety of wildlife","because so many exotic animals are","more than 2,400 km across the nations","because they contain more frozen water","where one finds all three living together","if people do not do anything to prevent it","having some of the world’s highest peaks"],"key":"371546"},{"type":11,"title":"Amur River region","text":"The Amur River is also known as the Heilong in China. The river covers parts of Russia, China, and Mongolia, A__________ China and south-east Russia. A large region of grasslands and forests, about 1.85 million sq km in size, is around the river. The Amur region has some of the world’s most extensive temperate forests. These are forests of a rather mild climate area B__________. Although the region there experiences very cold winters, it still supports a varied wildlife. The forests are home for not just rare animals, but trees like the Korean pine, and wild ginseng, C_________. The most famous residents of the region include Amur or Siberian tigers, and the last remaining wild population of Amur leopards. Amur leopards are critically endangered D__________. Amur tigers and Amur leopards are top predators with no natural enemies. They play a great role in keeping a healthy balance of wildlife in their environment. This is very important for the local people, animals, and plants that depend on that. Many of the forest areas in the Amur region remain largely unchanged, E__________ increasing development and the need for resources. The forests also suffer from frequent fires, natural and man-made. Rising temperatures and changing rainfall patterns affect them as well. So, people should be working globally and locally F__________ climate change.","options":["that receives rather heavy rainfall","which is endangered and should be","to deal with the causes and effects of","but they are coming under pressure from","which is a traditional medicinal plant","as there may be about 120 left in the wild","forming the border between north-east"],"key":"715643"},{"type":11,"title":"Rivers and streams","text":"The UK rivers and streams are very important natural features. Not only do they help to make the British landscape attractive and lively, but they have always been crucial for the growth of towns and cities. They have been providing fresh water for drinking and farming, A__________. Some of the most beautiful rivers in England are called “chalk streams.” Their pure, clear, constant water from underground chalk springs, flowing across gravel beds, makes them perfect sources of clean water. They are ideal places B__________. They are home to all kinds of animals, fish, insects, and plants. The majority of the world’s chalk streams are found in England. There are only about 200 chalk streams in the world. And most of them are in the southern part of England, with a few more in France, C_________. Unfortunately, far too many of the UK waterways have been overused and undervalued. Several of them are almost dry in some places, and polluted in others. Less than a fifth of England’s rivers are healthy, D__________ on them. In fact, population growth and a big increase in water use have both badly affected the ecosystems of rivers and streams. And recent research has shown E__________ local rivers is wasted. People can turn this around. Ecologists know F__________ enough water for people and nature if they are looked after properly.","options":["which makes them all even more special","for lots of wild creatures to breed and grow","where there are so many chalk streams that","that local rivers and streams can provide","that a third of the water people take from","and for business and transport over centuries","and climate change is putting more pressure"],"key":"621754"},{"type":11,"title":"Theatre and cinema","text":"Theatre and cinema are two fun ways people enjoy stories. Both show stories and let us feel emotions, A__________. Theatre is a live show. Actors perform on stage in front of an audience, creating a special atmosphere B__________. The energy in the room can change with each performance, and people often feel a strong connection to the actors. Sometimes, theatre even invites the audience to take part, C_________. Many people – like actors, directors, and helpers – work together to make the play happen. Cinema, in contrast, uses films that are recorded and edited before being shown on a big screen. This allows for special effects, close-up shots, and perfect timing, D__________. Every time you watch a movie, it is exactly the same. Cinemas show many movies at different times, E__________. Making a movie takes many steps and people, and actors can do scenes many times to get them perfect. Both theatre and cinema have their own strengths. Theatre is special because it is live, and you can feel the excitement in the room. But tickets can be expensive, and theatres are not everywhere. Cinema is famous for its visual effects, sound, and the ability to reach large audiences. It is often cheaper and shows many different films. Some people love the live feeling of theatre, F__________. Each form has a special place in the world of entertainment, and both continue to attract teenagers and adults alike.","options":["where every show is a little bit different","though both are forms of performing arts","while others enjoy watching movies in a cinema","which can make the story more exciting or realistic","but they do this in almost completely different ways","making the experience more interactive and personal","so people can choose what and when to watch"],"key":"516473"}];

document.getElementById('content').innerHTML='<div class="grid"><article class="card"><h2>'+esc(t.title)+'</h2><div class="sub">Задание '+t.type+' · '+(headings?'Соотнесите тексты A–G с заголовками 1–8. Один лишний.':'Заполните пропуски A–F фрагментами 1–7. Один лишний.')+'</div><div class="text">'+text+'</div></article><section class="right"><div class="card"><h2>'+(headings?'Заголовки':'Фрагменты')+'</h2>'+opts.map((v,j)=>'<div class="choice"><b>'+(j+1)+'.</b> '+esc(v)+'</div>').join('')+'</div><div class="card"><h2>Бланк ответов</h2><div class="answer">'+answers+'</div>'+(done?'<div class="feedback">Результат: '+score(cur)+' / '+t.key.length+'</div>':(!sent?'<button class="btn" onclick="check()">Проверить текст</button>':'<p>Отправлено учителю</p>'))+(TEACHER?'<details><summary>Ключ учителя</summary>'+t.key+'</details>':'')+'<p class="sub">Ответы сохраняются. Выполненные задания можно отправлять учителю частями.</p></div></section></div>';
let bar=document.getElementById('send');bar.innerHTML='';bar.appendChild(P.bar(()=>id(cur),{compact:true}));}
render();</script></body></html>
