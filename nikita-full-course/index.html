<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Outcomes Pre-Intermediate • Interactive Course</title><style>body{margin:0;background:#071b27;color:white;font-family:Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.l{text-align:center}.s{opacity:.65;font-size:13px}</style></head><body><div class="l"><b>Opening Nikita's course…</b><div class="s">Loading interactive materials</div></div><script>(async()=>{const names=['q01.txt','q02.txt','q03.txt','q04.txt','q05.txt','q06.txt','q07.txt','q08.txt','q09.txt','q10.txt','q11.txt','q12.txt','q13.txt','q14.txt','q15.txt','q16.txt','q17.txt','q18.txt','q19.txt','q20.txt','q21.txt','q22.txt','q23.txt','q24.txt','q25.txt','q26.txt','q27.txt','q28.txt','q29.txt'];let s='';for(const n of names)s+=await fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()});const bin=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close();})().catch(e=>{document.body.innerHTML='<div style="padding:30px">Course could not be loaded. Please refresh the page.</div>';console.error(e)});</script></body></html>
