<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Maya · English File Pre-Intermediate</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}body{overflow:hidden;background:#111}button{font:inherit;cursor:pointer}
#stage{position:fixed;inset:0;overflow:hidden;background:#111}#approvedCover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;user-select:none;-webkit-user-drag:none}
#hotspots{position:absolute;inset:0;z-index:3}.hotspot{position:absolute;border:0;background:transparent;padding:0;border-radius:8px;color:transparent}.hotspot:focus-visible{outline:2px solid rgba(255,255,255,.8);outline-offset:2px}
#links{display:none!important}.tools{display:none}
#screen{position:fixed;inset:0;background:#f5f7fb;z-index:10;display:flex;flex-direction:column}#screen[hidden]{display:none}header{min-height:52px;padding:7px 14px;background:#344150;color:#fff;display:flex;align-items:center;gap:12px}header h1{font-size:16px;flex:1;margin:0}header button{border:1px solid #ffffff44;background:#ffffff12;color:#fff;padding:8px 12px;border-radius:10px}#body{flex:1;min-height:0;overflow:auto;padding:24px}#body.embedded{padding:0;overflow:hidden}iframe{width:100%;height:100%;border:0;background:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;max-width:1100px;margin:30px auto}.card{border:1px solid #dce5ef;border-radius:16px;background:#fff;color:#172d50;padding:24px;text-align:left}.card strong{display:block;font-size:23px;margin:8px 0}.card small{color:#63758d}.empty{text-align:center;margin:10vh auto;max-width:650px}.stats{text-align:center;margin:7vh auto}.stats strong{font-size:64px;color:#596877}.local{padding:12px;background:#fff;border:1px solid #dce5ef;border-radius:8px}
@media(max-aspect-ratio:16/9){#approvedCover{object-position:left center}}
</style></head><body>
<main id="stage">
<img id="approvedCover" src="449A78D6-2EE0-4536-B105-B65AC301E42D.png" alt="Maya English Hub · English File Pre-Intermediate · 4th & 5th Editions">

</main>
<div class="tools"><button id="full">Full screen</button></div>

<script src="app.js"></script><script>
(()=>{const W=1536,H=864,boxes=[[22,123,238,62],[22,193,238,63],[22,264,238,63],[22,335,238,63],[22,405,238,63],[22,476,238,63],[22,547,238,63],[22,617,238,64],[22,688,238,63],[22,759,238,63]];function place(){const vw=innerWidth,vh=innerHeight,s=Math.max(vw/W,vh/H),rw=W*s,rh=H*s,ox=(vw/rw<1&&vw/vh<16/9)?0:(vw-rw)/2,oy=(vh-rh)/2;document.querySelectorAll('.hotspot').forEach((b,i)=>{const q=boxes[i];Object.assign(b.style,{left:(ox+q[0]*s)+'px',top:(oy+q[1]*s)+'px',width:(q[2]*s)+'px',height:(q[3]*s)+'px'});});}document.querySelectorAll('.hotspot').forEach(b=>b.addEventListener('click',()=>moduleView(+b.dataset.module)));addEventListener('resize',place);place();})();
</script><script src="enhancements.js"></script><script src="scrollfix.js"></script></body></html>
