<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maya · English Course</title>
<style>
*{box-sizing:border-box}html,body{width:100%;min-height:100%}body{margin:0;font-family:Inter,Arial,sans-serif;color:#162033;background:#f5f7fb}button,a{font:inherit}button{cursor:pointer}
#stage{min-height:100vh;padding:34px 38px 44px;background:radial-gradient(circle at 82% 12%,#dceeff 0,transparent 28%),linear-gradient(135deg,#f8fbff 0%,#eef3fa 100%);overflow:auto}
#cover{display:none}.hero{max-width:1380px;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:30px}.brand{display:flex;align-items:center;gap:13px}.logo{width:46px;height:46px;border-radius:15px;background:#152a4f;color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6c7b92;font-weight:800}.brand h1{margin:3px 0 0;font-size:24px;letter-spacing:-.03em}.level{padding:9px 13px;border:1px solid #d8e1ed;border-radius:999px;background:#ffffffb8;font-size:12px;font-weight:800;color:#53637a}
.intro{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-bottom:22px}.welcome,.quick{background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:26px;box-shadow:0 14px 40px rgba(24,42,76,.06)}.welcome h2{font-size:38px;line-height:1.02;margin:0 0 10px;letter-spacing:-.05em}.welcome p{margin:0;color:#65748a;line-height:1.5}.quick{display:flex;align-items:center;gap:10px}.quick button{flex:1;border:0;border-radius:16px;padding:18px 10px;font-weight:850;background:#eef4fb;color:#203657}.quick button:first-child{background:#17345f;color:#fff}
.sectionHead{display:flex;justify-content:space-between;align-items:end;margin:28px 2px 12px}.sectionHead h3{margin:0;font-size:18px}.sectionHead span{font-size:12px;color:#7a8798}
.moduleGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.module{border:1px solid #dfe6ef;background:#fff;border-radius:20px;padding:17px;text-align:left;min-height:146px;box-shadow:0 8px 25px rgba(30,49,80,.045);transition:.18s}.module:hover{transform:translateY(-3px);border-color:#a9bfdc;box-shadow:0 15px 30px rgba(30,49,80,.09)}.num{font-size:11px;color:#8190a5;font-weight:900;letter-spacing:.1em}.module strong{display:block;font-size:17px;margin:11px 0 17px;line-height:1.15}.lessons{display:flex;gap:5px}.lessons span{width:27px;height:27px;border-radius:8px;background:#f0f4f9;display:grid;place-items:center;font-size:11px;font-weight:900;color:#4b607c}.module.ready{border-color:#bfd9f2}.module.ready .num{color:#2471b8}.module.ready .lessons span:nth-child(2),.module.ready .lessons span:nth-child(3){background:#dcecff;color:#175e9e}
#links{display:none}.tools{position:fixed;right:14px;bottom:14px;z-index:4}.tools button{border:1px solid #d7e0eb;border-radius:12px;background:#fffffff0;color:#263a57;padding:9px 12px;font-size:12px}
#screen{position:fixed;inset:0;background:#f5f7fb;z-index:10;display:flex;flex-direction:column}#screen[hidden]{display:none}header{min-height:52px;padding:7px 14px;background:#172d50;color:#fff;display:flex;align-items:center;gap:12px}header h1{font-size:16px;flex:1;margin:0}header button{border:1px solid #ffffff44;background:#ffffff12;color:#fff;padding:8px 12px;border-radius:10px}#body{flex:1;min-height:0;overflow:auto;padding:24px}#body.embedded{padding:0;overflow:hidden}iframe{width:100%;height:100%;border:0;background:#fff}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;max-width:1100px;margin:30px auto}.card{border:1px solid #dce5ef;border-radius:18px;background:#fff;color:#172d50;padding:24px;text-align:left;box-shadow:0 8px 24px #06366b0a}.card strong{display:block;font-size:23px;margin:8px 0}.card small{color:#63758d}.card:hover{border-color:#7ca8d4}.empty{text-align:center;margin:10vh auto;max-width:650px}.empty h2{font-size:36px}.empty p{color:#65748a;line-height:1.6}.stats{text-align:center;margin:7vh auto}.stats strong{font-size:64px;color:#2773b9}progress{width:min(600px,80vw);height:22px}.local{padding:12px;background:#fff;border:1px solid #dce5ef;border-radius:8px;color:#172d50}
@media(max-width:1000px){.moduleGrid{grid-template-columns:repeat(2,1fr)}.intro{grid-template-columns:1fr}}@media(max-width:600px){#stage{padding:20px 14px 80px}.top{align-items:flex-start}.level{display:none}.welcome h2{font-size:30px}.quick{padding:14px}.moduleGrid{grid-template-columns:1fr 1fr}.module{min-height:135px;padding:14px}header h1{font-size:13px}#body{padding:12px}}
</style>
</head>
<body>
<main id="stage">
  <img id="cover" src="cover.png" alt="">
  <div class="hero">
    <div class="top"><div class="brand"><div class="logo">M</div><div><div class="eyebrow">Interactive English</div><h1>Maya's Course</h1></div></div><div class="level">PRE-INTERMEDIATE · A2–B1</div></div>
    <div class="intro">
      <section class="welcome"><div class="eyebrow">COURSE DASHBOARD</div><h2>Choose a module.<br>Start the lesson.</h2><p>All lessons are one click away. No hidden menus and no long scrolling.</p></section>
      <section class="quick"><button onclick="lesson('1C')">Continue 1C</button><button onclick="category('Practice')">Practice</button><button onclick="category('Progress')">Progress</button></section>
    </div>
    <div class="sectionHead"><h3>Modules</h3><span>10 modules · 40 lessons</span></div>
    <div class="moduleGrid">
      <button class="module ready" onclick="moduleView(1)"><span class="num">MODULE 01</span><strong>People</strong><span class="lessons"><span>A</span><span>B</span><span>C</span><span>D</span></span></button>
      <button class="module" onclick="moduleView(2)"><span class="num">MODULE 02</span><strong>A good life</strong><span class="lessons"><span>A</span><span>B</span><span>C</span><span>D</span></span></button>
      <button class="module" onclick="moduleView(3)"><span class="num">MODULE 03</span><strong>Everyday life</strong><span class="lessons"><span>A</span><span>B</span><span>C</span><span>D</span></span></button>
      <button class="module" onclick="moduleView(4)"><span class="num">MODULE 04</span><strong>The world around us</strong><span class="lessons"><span>A</span><span>B</span><span>C</span><span>D</span></span></button>
      <button class="module" onclick="moduleView(5)"><span class="num">MODULE 05</span><strong>Work</strong><span class="lessons"><span>A</span><span>B</span><span>C</span><span>D</span></span></button>
      <button class="module" onclick="moduleView(6)"><span class="num">MODULE 06</span><strong>Free time</strong><span class="lessons"><span>A</span><span>B</span><span>C</span><span>D</span></span></button>
      <button class="module" onclick="moduleView(7)"><span class="num">MODULE 07</span><strong>Speed</strong><span class="lessons"><span>A</span><span>B</span><span>C</span><span>D</span></span></button>
      <button class="module" onclick="moduleView(8)"><span class="num">MODULE 08</span><strong>People and places</strong><span class="lessons"><span>A</span><span>B</span><span>C</span><span>D</span></span></button>
      <button class="module" onclick="moduleView(9)"><span class="num">MODULE 09</span><strong>Communication</strong><span class="lessons"><span>A</span><span>B</span><span>C</span><span>D</span></span></button>
      <button class="module" onclick="moduleView(10)"><span class="num">MODULE 10</span><strong>A brighter future</strong><span class="lessons"><span>A</span><span>B</span><span>C</span><span>D</span></span></button>
    </div>
  </div>
  <nav id="links" aria-label="Modules and lessons"></nav>
</main>
<div class="tools"><button id="full">⛶ Full screen</button></div>
<section id="screen" hidden><header><button id="back">← Course</button><h1 id="title"></h1><button id="complete" hidden>Mark complete</button></header><div id="body"></div></section>
<script src="app.js"></script><script src="hotspots-v2.js"></script><script src="enhancements.js"></script><script src="scrollfix.js"></script>
</body></html>
