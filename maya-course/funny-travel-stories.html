<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funny Travel Stories — Past Simple</title>
<style>
*{box-sizing:border-box}
:root{
  --navy:#0f2537;
  --navy-2:#193852;
  --orange:#f25c05;
  --orange-2:#ff7a29;
  --cream:#fffdf8;
  --sand:#f6efe2;
  --border:#e8dcc8;
  --green:#238636;
  --green-bg:#d3f5dd;
  --red:#c92a2a;
  --red-bg:#ffd8d8;
  --sky:#0b7285;
  --shadow:0 12px 30px rgba(10,28,46,.26);
  --shadow-sm:0 4px 14px rgba(10,28,46,.13);
}
html,body{min-height:100%;margin:0}
body{
  font-family:'Poppins','Segoe UI',system-ui,-apple-system,Arial,sans-serif;
  color:var(--navy);
  background-color:#cbe7f5;
  background-image:
    linear-gradient(180deg, rgba(215,240,255,.52) 0%, rgba(255,255,255,.12) 28%, rgba(12,32,50,.18) 100%),
    var(--bg-url);
  background-size:cover;
  background-position:center center;
  background-attachment:fixed;
  overflow-x:hidden;
}

/* Floating top bar */
.topbar{
  max-width:1180px;
  margin:0 auto;
  padding:16px 22px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
  position:relative;
  z-index:5;
}
.top-grp{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

.glass-pill{
  display:inline-flex;
  align-items:center;
  gap:7px;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:var(--navy);
  border:2px solid rgba(255,255,255,.95);
  border-radius:999px;
  padding:8px 16px;
  font:600 14px/1.2 inherit;
  cursor:pointer;
  box-shadow:0 4px 14px rgba(12,32,52,.18);
  transition:transform .16s ease,box-shadow .16s ease,background .16s ease;
  user-select:none;
}
.glass-pill:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(12,32,52,.25);background:#fff}
.glass-pill:active{transform:translateY(0)}
.glass-pill svg{width:16px;height:16px;flex:none}
.glass-pill.orange{
  background:linear-gradient(135deg,#ff6b1a,#e85002);
  color:#fff;
  border-color:rgba(255,255,255,.45);
  box-shadow:0 6px 18px rgba(232,80,2,.38);
}
.glass-pill.orange:hover{background:linear-gradient(135deg,#ff792e,#f25c05)}
.glass-pill.dark{
  background:var(--navy);
  color:#fff;
  border-color:var(--navy);
}

#app{
  max-width:1080px;
  margin:0 auto;
  padding:6px 22px 44px;
  position:relative;
  z-index:2;
}
.fade-in{animation:slideUp .42s cubic-bezier(.2,.8,.2,1) both}
/* A softly frosted travel-journal mat keeps the portraits distinct from the scenery. */
.home-stage{
  position:relative;
  isolation:isolate;
  padding:clamp(12px,2vw,22px);
  border-radius:30px;
  border:1.5px solid rgba(255,255,255,.86);
  background:linear-gradient(145deg,rgba(255,253,248,.90),rgba(235,244,245,.84));
  box-shadow:0 18px 48px rgba(10,28,46,.30),inset 0 1px 0 rgba(255,255,255,.92);
  -webkit-backdrop-filter:blur(10px) saturate(.84);
  backdrop-filter:blur(10px) saturate(.84);
}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* Home Hero — inspired by cast showcase + world travel */
.hero{
  text-align:center;
  margin:2px auto 20px;
  max-width:980px;
}
.hero-title-row{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
  padding:4px 18px;
  border-radius:24px;
}
.hero-title{
  margin:0;
  font-size:clamp(30px,4.6vw,50px);
  font-weight:900;
  letter-spacing:-.8px;
  line-height:1.08;
  color:var(--navy);
  text-shadow:0 2px 14px rgba(255,255,255,.92),0 1px 2px rgba(255,255,255,.95);
}
.hero-title .accent{
  color:var(--orange);
  text-shadow:0 2px 14px rgba(255,255,255,.92),0 1px 2px rgba(255,255,255,.95);
}
.vol-badge{
  background:var(--navy);
  color:#fff;
  font-size:clamp(14px,1.8vw,19px);
  font-weight:800;
  padding:6px 16px;
  border-radius:999px;
  box-shadow:0 4px 12px rgba(15,37,55,.28);
  letter-spacing:.2px;
}
.hero-subrow{
  margin-top:12px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  flex-wrap:wrap;
}
.hero-banner{
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(8px);
  border-radius:999px;
  padding:9px 22px;
  font-size:15px;
  font-weight:600;
  color:var(--navy);
  box-shadow:0 4px 16px rgba(12,32,52,.16);
  border:2px solid rgba(255,255,255,.95);
}

/* 4x2 Portrait Cast Grid */
.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-top:16px;
}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr);gap:15px}}
@media(max-width:460px){.cards{grid-template-columns:repeat(2,1fr);gap:10px}}

.card{
  position:relative;
  aspect-ratio:1/1;
  border-radius:20px;
  overflow:hidden;
  border:3.5px solid #fff;
  background:#dce8f0;
  cursor:pointer;
  box-shadow:var(--shadow);
  animation:popIn .48s cubic-bezier(.2,.8,.2,1) both;
  transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s ease,border-color .2s;
  user-select:none;
}
@keyframes popIn{from{opacity:0;transform:scale(.9) translateY(12px)}to{opacity:1;transform:none}}
.card:nth-child(2){animation-delay:.05s}
.card:nth-child(3){animation-delay:.10s}
.card:nth-child(4){animation-delay:.15s}
.card:nth-child(5){animation-delay:.20s}
.card:nth-child(6){animation-delay:.25s}
.card:nth-child(7){animation-delay:.30s}
.card:nth-child(8){animation-delay:.35s}

.card:hover{
  transform:translateY(-7px) scale(1.015);
  box-shadow:0 20px 36px rgba(8,24,40,.38);
}
.card.d{border-color:#4cd964}
.card .ph{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
  transition:transform .38s ease;
}
.card:hover .ph{transform:scale(1.07)}

.card-shade{
  position:absolute;
  inset:0;
  background:linear-gradient(180deg, rgba(10,25,40,.32) 0%, rgba(10,25,40,0) 30%, rgba(10,25,40,0) 48%, rgba(8,20,34,.88) 100%);
  pointer-events:none;
}
.card-route{
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(15,37,55,.78);
  backdrop-filter:blur(6px);
  color:#fff;
  font-size:11.5px;
  font-weight:700;
  padding:4px 10px;
  border-radius:999px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border:1px solid rgba(255,255,255,.25);
  max-width:calc(100% - 58px);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.card-voice{
  position:absolute;
  top:10px;
  right:10px;
  width:32px;
  height:32px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:800;
  color:#fff;
  backdrop-filter:blur(6px);
  border:1.5px solid rgba(255,255,255,.55);
  transition:transform .2s,background .2s;
}
.card-voice.f{background:rgba(214,51,108,.85)}
.card-voice.m{background:rgba(24,100,171,.85)}
.card:hover .card-voice{transform:scale(1.1)}

.card-stamp{
  position:absolute;
  top:46px;
  right:10px;
  background:#238636;
  color:#fff;
  font-size:11px;
  font-weight:800;
  letter-spacing:.6px;
  padding:3px 9px;
  border-radius:8px;
  border:1.5px dashed rgba(255,255,255,.8);
  transform:rotate(-6deg);
  box-shadow:0 3px 10px rgba(0,0,0,.25);
}

.card-info{
  position:absolute;
  left:14px;
  right:14px;
  bottom:12px;
  color:#fff;
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:8px;
}
.card-name{
  font-size:clamp(20px,2.2vw,27px);
  font-weight:800;
  line-height:1.08;
  letter-spacing:-.3px;
  text-shadow:0 2px 8px rgba(0,0,0,.65);
}
.card-sub{
  font-size:12.5px;
  font-weight:600;
  opacity:.92;
  margin-top:2px;
  text-shadow:0 1px 4px rgba(0,0,0,.65);
}
.card-go{
  background:var(--orange);
  color:#fff;
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
  opacity:0;
  transform:translateX(-6px);
  transition:opacity .2s,transform .2s;
  box-shadow:0 4px 10px rgba(0,0,0,.3);
}
.card:hover .card-go{opacity:1;transform:none}
.clk{animation:bounce .28s}@keyframes bounce{45%{transform:scale(.94)}100%{transform:scale(1)}}

/* Boarding Pass Header inside Lesson */
.boarding{
  background:rgba(255,252,245,.96);
  backdrop-filter:blur(12px);
  border-radius:22px;
  border:2px solid #fff;
  box-shadow:var(--shadow);
  overflow:hidden;
  margin-bottom:18px;
}
.airmail-bar{
  height:7px;
  background:repeating-linear-gradient(
    -45deg,
    #e8590c 0 14px,
    #fffdf8 14px 22px,
    #193852 22px 36px,
    #fffdf8 36px 44px
  );
}
.bp-top{
  padding:16px 22px 12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
  border-bottom:2px dashed var(--border);
}
.bp-route{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}
.bp-av{
  width:52px;
  height:52px;
  border-radius:50%;
  object-fit:cover;
  border:2.5px solid var(--orange);
  box-shadow:0 3px 8px rgba(0,0,0,.15);
}
.bp-pass{
  font-size:11.5px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1.1px;
  color:#6c7a89;
}
.bp-cities{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:18px;
  font-weight:800;
  color:var(--navy);
}
.bp-plane{
  color:var(--orange);
  display:inline-flex;
  align-items:center;
  gap:4px;
  font-size:14px;
}
.voice-tag{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:4px 11px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}
.voice-tag.f{background:#ffe3ec;color:#a61e4d}
.voice-tag.m{background:#dbeafe;color:#1e40af}

.bp-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{
  border:2px solid var(--border);
  background:#fff;
  border-radius:999px;
  padding:8px 16px;
  font:700 14px/1.2 inherit;
  cursor:pointer;
  color:var(--navy);
  display:inline-flex;
  align-items:center;
  gap:6px;
  transition:transform .15s,box-shadow .15s,border-color .15s,background .15s;
}
.pill:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(0,0,0,.1);border-color:#d0bfa6}
.pill.next{
  background:linear-gradient(135deg,#ff6b1a,#e85002);
  color:#fff;
  border-color:transparent;
  animation:glow 2s infinite;
}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(242,92,5,.24)}}

.bp-steps{
  display:flex;
  align-items:center;
  gap:6px;
  padding:10px 22px;
  background:rgba(246,239,226,.65);
  overflow-x:auto;
}
.st-btn{
  border:none;
  background:transparent;
  padding:7px 13px;
  border-radius:999px;
  font:700 13px/1.2 inherit;
  color:#5c6f82;
  cursor:pointer;
  white-space:nowrap;
  transition:background .18s,color .18s;
}
.st-btn:hover{background:rgba(255,255,255,.8);color:var(--navy)}
.st-btn.active{
  background:var(--navy);
  color:#fff;
  box-shadow:0 2px 8px rgba(15,37,55,.22);
}
.bp-head-body{
  padding:14px 22px 18px;
}
.bp-head-body h1{
  margin:0;
  font-size:clamp(22px,3vw,29px);
  font-weight:800;
  color:var(--navy);
}
.bp-head-body .sub{
  margin:4px 0 0;
  color:#526477;
  font-size:15px;
  font-weight:500;
}

/* Postcard & Exercise Boxes */
.postcard{
  position:relative;
  background:rgba(255,253,248,.96);
  backdrop-filter:blur(10px);
  border-radius:20px;
  padding:22px;
  margin-bottom:16px;
  border:2px solid #fff;
  box-shadow:var(--shadow);
}
.postmark{
  position:absolute;
  top:16px;
  right:18px;
  border:2px dashed rgba(232,89,12,.45);
  color:rgba(232,89,12,.78);
  font-size:11px;
  font-weight:800;
  letter-spacing:1px;
  padding:5px 10px;
  border-radius:8px;
  transform:rotate(4deg);
  pointer-events:none;
}
@media(max-width:600px){.postmark{display:none}}

.player-row{
  display:flex;
  align-items:center;
  gap:18px;
  flex-wrap:wrap;
}
.av-wrap{
  position:relative;
  flex:none;
}
.av{
  width:96px;
  height:96px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #fff;
  box-shadow:0 6px 18px rgba(15,37,55,.22);
  display:block;
}
.av-wrap.playing::after{
  content:"";
  position:absolute;
  inset:-5px;
  border-radius:50%;
  border:3px solid var(--orange);
  animation:ringPulse 1.3s ease-out infinite;
}
@keyframes ringPulse{0%{transform:scale(.96);opacity:1}100%{transform:scale(1.14);opacity:0}}

.audio-ctrl{
  flex:1;
  min-width:240px;
}
.audio-btns{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:10px;
}
.play-main{
  background:linear-gradient(135deg,#ff6b1a,#e85002);
  color:#fff;
  border:none;
  border-radius:999px;
  padding:10px 20px;
  font:700 15px/1.2 inherit;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:8px;
  box-shadow:0 5px 14px rgba(232,80,2,.32);
  transition:transform .15s,box-shadow .15s;
}
.play-main:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(232,80,2,.4)}
.scrub-wrap{
  display:flex;
  align-items:center;
  gap:10px;
}
.scrub{
  flex:1;
  height:9px;
  background:#e9dfd0;
  border-radius:999px;
  overflow:hidden;
  cursor:pointer;
  position:relative;
}
.scrub i{
  display:block;
  height:100%;
  width:0%;
  background:linear-gradient(90deg,var(--navy),var(--orange));
  border-radius:999px;
  transition:width .1s linear;
}
.time-lbl{
  font-size:12.5px;
  font-weight:700;
  color:#5c6f82;
  min-width:74px;
  text-align:right;
  font-variant-numeric:tabular-nums;
}

.story{
  font-size:18.5px;
  font-weight:450;
  line-height:1.75;
  margin:16px 0 0;
  padding:16px 18px;
  background:var(--sand);
  border-left:4px solid var(--orange);
  border-radius:12px;
  color:var(--navy);
}
.story mark.vb{
  background:#ffe0b2;
  color:#9c3600;
  font-weight:700;
  padding:1px 6px;
  border-radius:6px;
}
.hid{display:none}

/* 3D Luggage-Tag / Postcard Flashcards */
.sec-label{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:18px 2px 10px;
}
.sec-label h3{
  margin:0;
  font-size:16px;
  font-weight:800;
  color:var(--navy);
  background:rgba(255,255,255,.9);
  padding:6px 14px;
  border-radius:999px;
  box-shadow:var(--shadow-sm);
}
.cnt{
  margin:0;
  font-weight:800;
  font-size:14px;
  color:var(--orange);
  background:rgba(255,255,255,.92);
  padding:6px 14px;
  border-radius:999px;
  box-shadow:var(--shadow-sm);
}
.fgrid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(185px,1fr));
  gap:14px;
}
.fc{perspective:950px;height:126px;cursor:pointer;user-select:none}
.fi{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.8,.2,1);transform-style:preserve-3d}
.fc.f .fi{transform:rotateY(180deg)}
.ff,.fb{
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;
  border-radius:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:21px;
  font-weight:800;
  text-align:center;
  padding:12px;
  box-shadow:0 6px 18px rgba(10,28,46,.22);
  border:2.5px solid rgba(255,255,255,.85);
}
.ff{
  background:linear-gradient(145deg,#12293d,#1e4363);
  color:#fff;
}
.ff small{font-size:12px;opacity:.72;font-weight:500;margin-top:7px}
.fb{
  background:linear-gradient(145deg,#f25c05,#ff7f36);
  color:#fff;
  transform:rotateY(180deg);
}
.fb small{font-size:11.5px;opacity:.85;font-weight:600;margin-top:6px}

/* Step 1: Comprehension Ticket Rows */
.row{
  display:flex;
  background:rgba(255,253,248,.96);
  border-radius:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow-sm);
  border:2px solid #fff;
  overflow:hidden;
  cursor:pointer;
  min-height:84px;
  animation:slideUp .35s ease both;
  transition:transform .16s ease,box-shadow .16s ease;
}
.row:hover{transform:translateX(6px);box-shadow:var(--shadow)}
.num{
  background:var(--navy);
  color:#fff;
  font-size:24px;
  font-weight:800;
  width:56px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:none;
}
.q{
  flex:1;
  padding:14px 20px;
  font-size:20px;
  font-weight:700;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.q-hint{font-size:12.5px;font-weight:600;color:#7a8b9c;margin-top:3px}
.ans{font-size:17.5px;font-weight:700;color:var(--green);margin-top:6px}
.rp{
  padding:0 18px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  font-size:13.5px;
  font-weight:800;
  color:var(--orange);
  border-left:2px dashed var(--border);
  background:rgba(246,239,226,.5);
  transition:background .15s;
}
.rp:hover{background:#ffe8d6}

/* Step 2, 3, 4 Boxes */
.box{
  background:rgba(255,253,248,.96);
  border-radius:16px;
  padding:18px 20px;
  margin-bottom:12px;
  box-shadow:var(--shadow-sm);
  border:2px solid #fff;
  font-size:19px;
  font-weight:650;
  line-height:1.5;
}
.o{
  display:inline-block;
  border:2px solid var(--border);
  background:var(--sand);
  border-radius:12px;
  padding:7px 18px;
  margin:8px 8px 0 0;
  cursor:pointer;
  font-size:17px;
  font-weight:700;
  transition:transform .14s,background .18s,border-color .18s;
  user-select:none;
}
.o:hover{transform:scale(1.05);background:#fff;border-color:#cbb89d}
.ok{background:var(--green-bg)!important;border-color:var(--green)!important;color:#14532d!important;animation:pulse .45s}
.bad{background:var(--red-bg)!important;border-color:var(--red)!important;color:#7f1d1d!important;animation:shake .38s}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

input.gap-in{
  font:700 18px inherit;
  padding:5px 12px;
  border:2px solid #d5c5ad;
  background:#fff;
  border-radius:10px;
  width:155px;
  color:var(--navy);
  margin:0 4px;
  transition:border-color .15s,box-shadow .15s;
}
input.gap-in:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(242,92,5,.18)}
.gap-ans{
  display:inline-block;
  margin-left:8px;
  font-size:15px;
  font-weight:800;
  color:var(--green);
}
.check-bar{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin-top:14px;

/* Safe storage wrapper (works in sandboxed iframes without allow-same-origin) */
function sGet(k, def){ try{ const v=localStorage.getItem(k); return v===null?def:v; }catch(e){ return def; } }

/* UI Sound Effects */
function tone(f,d=.12,type='sine',v=.14,t0=0){
  if(!SND) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === 'suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain(), t=AC.currentTime+t0;
    o.type=type; o.frequency.setValueAtTime(f,t);
    g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d);
  }catch(e){}
}
const sfx={
  click:()=>tone(540,.07,'triangle',.12),

  bad:()=>{tone(220,.18,'sawtooth',.09);tone(170,.22,'sawtooth',.09,.12)},
  next:()=>{tone(440,.08,'square',.05);tone(660,.1,'square',.05,.07)},
  win:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.25,'sine',.14,i*.1))
};

/* =====================================================================
   VOICE ENGINE:
   1. Studio Neural Female (voice-00) & Male (voice-01) MP3s for all 8 stories
   2. Smart Gender-Matched speechSynthesis (Female vs Male) for flashcards/clues
   ===================================================================== */
const player = new Audio();
player.preload = 'auto';
let playingKey = null;

function fmtTime(sec){
  if(!isFinite(sec)||sec<0) sec=0;
  const m=Math.floor(sec/60), s=Math.floor(sec%60);
  return m+':'+(s<10?'0':'')+s;
}

function syncPlayerUI(){
  const btn = $('#playBtn');
  const avw = $('#avWrap');
  const bar = $('#scrubFill');
  const lbl = $('#timeLbl');
  const isPlaying = !player.paused && !player.ended && player.currentSrc;
  if(btn){
    btn.innerHTML = isPlaying ? `${ico('pause')} Pause` : `${ico('play')} Listen`;
  }
  if(avw){
    avw.classList.toggle('playing', !!isPlaying);
  }
  if(bar && player.duration){
    bar.style.width = Math.min(100, (player.currentTime / player.duration)*100) + '%';
  }
  if(lbl){
    lbl.textContent = `${fmtTime(player.currentTime)} / ${fmtTime(player.duration||0)}`;
  }
}
player.addEventListener('timeupdate', syncPlayerUI);
player.addEventListener('loadedmetadata', syncPlayerUI);
player.addEventListener('play', syncPlayerUI);
player.addEventListener('pause', syncPlayerUI);
player.addEventListener('ended', syncPlayerUI);

function stopAllAudio(){
  try{ if(window.CardAudio) CardAudio.stop(); }catch(e){}
  try{ player.pause(); }catch(e){}
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  syncPlayerUI();
}

/* Gender-aware Web Speech synthesis for vocabulary cards & fallback */
let cachedVoices = [];
function refreshVoices(){
  try{
    if(window.speechSynthesis) cachedVoices = speechSynthesis.getVoices() || [];
  }catch(e){}
}
refreshVoices();
if(typeof window !== 'undefined' && 'speechSynthesis' in window){
  speechSynthesis.onvoiceschanged = refreshVoices;
}

const FEMALE_RE = /zira|aria|jenny|sonia|libby|maisie|natasha|clara|molly|hazel|susan|catherine|linda|heather|eva|samantha|ava|allison|victoria|karen|moira|tessa|fiona|serena|veena|nicky|kathy|uk english female|us english|female|woman|girl|sfg|iob|gba|tpf/i;
const MALE_RE   = /david|mark|guy|ryan|christopher|eric|steffan|roger|george|james|richard|william|liam|connor|mitchell|alex|daniel|fred|oliver|thomas|aaron|arthur|rishi|gordon|lee|uk english male|\bmale\b|\bman\b|iom|tpd|gbd|sfb/i;

function pickGenderVoice(gender){
  refreshVoices();
  const en = cachedVoices.filter(v => /^en([-_]|$)/i.test(v.lang));
  const pool = en.length ? en : cachedVoices;
  if(!pool.length) return null;

  if(gender === 'f'){
    const strictF = pool.filter(v => FEMALE_RE.test(v.name) && !MALE_RE.test(v.name));
    if(strictF.length){
      return strictF.find(v => /natural|neural|google|samantha|aria|jenny|sonia|zira/i.test(v.name)) || strictF[0];
    }
    const nonMale = pool.filter(v => !MALE_RE.test(v.name));
    if(nonMale.length) return nonMale[0];
  } else {
    const strictM = pool.filter(v => MALE_RE.test(v.name) && !(/female|zira|samantha|victoria|karen|aria|jenny|sonia/i.test(v.name)));
    if(strictM.length){
      return strictM.find(v => /natural|neural|google|guy|ryan|daniel|alex|david/i.test(v.name)) || strictM[0];
    }
    const nonFem = pool.filter(v => !FEMALE_RE.test(v.name));
    if(nonFem.length) return nonFem[0];
  }
  return pool[0];
}

function say(text, gender){
  try{ player.pause(); }catch(e){}
  if(window.CardAudio){ CardAudio.say(text); return; }
  const g = gender || (cur !== null ? D[cur].g : 'f');
  try{ player.pause(); }catch(e){}
  if(!('speechSynthesis' in window)) return;
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = slowMode ? 0.8 : 0.92;
    const v = pickGenderVoice(g);
    if(v){
      u.voice = v;
      u.lang = v.lang || 'en-US';
      const matched = g === 'f' ? FEMALE_RE.test(v.name) : MALE_RE.test(v.name);
      u.pitch = matched ? (g === 'f' ? 1.05 : 0.94) : (g === 'f' ? 1.2 : 0.82);
    } else {
      u.pitch = g === 'f' ? 1.18 : 0.84;
    }
    speechSynthesis.speak(u);
  }catch(e){}
}

function playStory(forceRestart){
  if(cur === null) return;
  const p = D[cur];
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  const src = AUD[p.k];
  if(!src){
    say(p.s, p.g);
    return;
  }
  if(playingKey !== p.k || !player.src){
    playingKey = p.k;
    player.src = src;
  }
  player.playbackRate = slowMode ? 0.85 : 1.0;
  if(forceRestart){
    player.currentTime = 0;
    player.play().catch(()=>say(p.s, p.g));
    return;
  }
  if(player.paused || player.ended){
    if(player.ended) player.currentTime = 0;
    player.play().catch(()=>say(p.s, p.g));
  } else {
    player.pause();
  }
}

function seekAudio(ev){
  if(!player.duration) return;
  const rect = ev.currentTarget.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (ev.clientX - rect.left) / rect.width));
  player.currentTime = ratio * player.duration;
  syncPlayerUI();
}

function toggleSlow(){
  sfx.click();
  slowMode = !slowMode;
  player.playbackRate = slowMode ? 0.85 : 1.0;
  const b = $('#slowBtn');
  if(b) b.textContent = slowMode ? '0.85× Slow' : '1× Speed';
}

/* Inline SVG Icons */

    cafe: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14"><path d="M17 8h1a4 4 0 1 1 0 8h-1"/><path d="M3 8h14v9a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4Z"/><line x1="6" y1="2" x2="6" y2="4"/><line x1="10" y1="2" x2="10" y2="4"/><line x1="14" y1="2" x2="14" y2="4"/></svg>',

    trophy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"/><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"/><path d="M4 22h16"/><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>',

    play: '<svg viewBox="0 0 24 24" fill="currentColor" width="16" height="16"><polygon points="6 4 20 12 6 20 6 4"/></svg>',

function kindIcon(k){
  return k === 'cafe' ? ico('cafe') : (k === 'hotel' ? ico('hotel') : ico('plane'));
}

  const doneCount = Object.keys(done).filter(k => done[k]).length;
  $('#topbar').innerHTML = `
    <div class="top-grp">
      ${window.parent!==window ? `<button class="glass-pill dark" onclick="stopAllAudio();parent.postMessage('fts-close','*')">‹ Lesson 2B</button>` : ''}
      <button class="glass-pill" onclick="sfx.click();openTeacherNotes()">
        ${ico('compass')} Teacher notes
      </button>
      ${cur !== null ? `<button class="glass-pill" onclick="sfx.click();home()">← All Travellers</button>` : ''}
    </div>
    <div class="top-grp">
      <span class="glass-pill" style="cursor:default" title="Completed travel stories">
        Passport: ${doneCount}/${D.length}
      </span>
      <button class="glass-pill" id="sbtn" onclick="toggleSnd()">
        ${ico('snd')} SFX: ${SND?'on':'off'}
      </button>
      ${doneCount > 0 ? `<button class="glass-pill" onclick="resetProgress()" title="Reset completed stamps">↺ Reset</button>` : ''}

function toggleSnd(){
  SND = !SND;
  sSet('snd', SND ? '1' : '0');
  renderTopbar();

}

function resetProgress(){
  sfx.click();
  done = {};
  saveDone();
  renderTopbar();
  if(cur === null) home();
}

function pic(p, cls){
  return IMG[p.k] ? `<img class="${cls}" src="${IMG[p.k]}" alt="${p.n}">` : `<div class="${cls}">${p.n[0]}</div>`;
}

function openCard(i, el){
  sfx.click();
  el.classList.add('clk');
  setTimeout(()=>{
    cur = i;
    step = 0;
    markVerbs = false;
    go(true);
  }, 200);
}

function jumpStep(s){
  sfx.click();
  step = s;
  go(false);
}

function nx(){
  sfx.next();
  if(step < 4){
    step++;
    go(false);
  } else {
    done[cur] = 1;
    saveDone();
    sfx.win();
    confetti();
    home();
  }
}

function highlightStory(p){
  if(!markVerbs) return p.s;
  let out = p.s;
  const sorted = [...p.verbs].sort((a,b)=>b.length - a.length);
  sorted.forEach(v => {
    const escaped = v.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`\\b(${escaped})\\b`, 'gi');
    out = out.replace(re, '<mark class="vb">$1</mark>');
  });
  return out;
}

          </div>
        </div>

function flip(el, rawWord){
  el.classList.toggle('f');
  sfx.flip();
  say(rawWord, D[cur].g);
  const n = document.querySelectorAll('.fc.f').length;
  const all = document.querySelectorAll('.fc').length;
  const cnt = $('#cnt');
  if(cnt) cnt.textContent = `Postcards flipped: ${n}/${all}`;
}

function toggleText(b){
  sfx.click();
  const t = $('#story');
  const vb = $('#verbBtn');
  t.classList.toggle('hid');
  const hidden = t.classList.contains('hid');
  b.textContent = hidden ? 'Show text' : 'Hide text';
  if(vb) vb.style.display = hidden ? 'none' : 'inline-flex';
}

function toggleVerbs(b){
  sfx.click();
  markVerbs = !markVerbs;
  const t = $('#story');
  if(t) t.innerHTML = highlightStory(D[cur]);
  b.classList.toggle('dark', markVerbs);
  b.textContent = markVerbs ? 'Verbs highlighted' : 'Highlight Past Simple';
}

function go(autoPlay){
  stopAllAudio();
  renderTopbar();
  const p = D[cur];
  let h = '<div class="fade-in">';

  if(step === 0){
    h += bpHeader('Listen to the travel story', 'Listen first in ' + p.n + '\'s voice. Open the text only if you need help.') + `
      <div class="postcard">
        <div class="postmark">${p.stamp}</div>
        <div class="player-row">
          <div class="av-wrap" id="avWrap">${pic(p,'av')}</div>
          <div class="audio-ctrl">
            <div class="audio-btns">
              <button class="play-main" id="playBtn" onclick="sfx.click();playStory(false)">${ico('play')} Listen</button>
              <button class="pill" onclick="sfx.click();playStory(true)">↺ Replay</button>
              <button class="pill" id="slowBtn" onclick="toggleSlow()">${slowMode ? '0.85× Slow' : '1× Speed'}</button>
              <button class="pill" onclick="toggleText(this)">Show text</button>
              <button class="pill" id="verbBtn" style="display:none" onclick="toggleVerbs(this)">Highlight Past Simple</button>
            </div>
            <div class="scrub-wrap">
              <div class="scrub" onclick="seekAudio(event)"><i id="scrubFill"></i></div>
              <div class="time-lbl" id="timeLbl">0:00 / 0:00</div>
            </div>
          </div>
        </div>
        <p class="story hid" id="story">${highlightStory(p)}</p>
      </div>

      <div class="sec-label">
        <h3>Travel Vocabulary Postcards (tap to flip &amp; listen)</h3>
        <p class="cnt" id="cnt">Postcards flipped: 0/${p.w.length}</p>
      </div>
      <div class="fgrid">
        ${p.w.map(w => {
          const spoken = w[0].replace(' → ', ', ').replace(/'/g, "\\'");
          return `<div class="fc" onclick="flip(this,'${spoken}')">
            <div class="fi">
              <div class="ff">${w[0]}<small>tap to flip</small></div>
              <div class="fb">${w[1]}<small>${w[0]}</small></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    `;
  }

  if(step === 1){
    h += bpHeader('Check your understanding', 'Answer out loud in full Past Simple sentences. Tap each ticket to check!') +
      p.l.map((q,i)=>`
        <div class="row" onclick="sfx.click();this.querySelector('.ans').style.display='block';this.querySelector('.q-hint').style.display='none'">
          <div class="num">${i+1}</div>
          <div class="q">
            ${q[0]}
            <div class="q-hint">Tap to reveal answer</div>
            <div class="ans" style="display:none">✓ ${q[1]}</div>
          </div>
          <div class="rp" onclick="event.stopPropagation();sfx.click();playStory(false)">Story</div>
        </div>
      `).join('');
  }

  if(step === 2){
    h += bpHeader('Choose the right verb', 'Tap the correct Past Simple form from ' + p.n + '\'s trip.') +
      p.ch.map((q,i)=>`
        <div class="box">
          ${i+1}. ${q[0]}<br>
          ${q[1].map((o,k)=>`<span class="o" onclick="pick(this,${i},${k})">${o}</span>`).join('')}
        </div>
      `).join('');
  }

  if(step === 3){
    h += bpHeader('Put the verb in Past Simple', 'Type the missing Past Simple verb and press Check.') +
      p.gap.map((q,i)=>`
        <div class="box">
          ${i+1}. ${q[0].replace('___', `<input class="gap-in" id="g${i}" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')chk()">`)}
          <span class="gap-ans hid" id="ga${i}">→ ${q[1]}</span>
        </div>
      `).join('') + `
      <div class="check-bar">
        <button class="pill next" onclick="chk()">Check answers</button>
        <button class="pill hid" id="showAnsBtn" onclick="revealGaps()">Show answers</button>
        <span id="res" style="font-weight:800;font-size:16px"></span>
      </div>`;
  }

  if(step === 4){
    h += bpHeader('True or false?', 'Read each travel statement and choose True or False.') +
      p.cmp.map((q,i)=>`
        <div class="box">
          ${i+1}. ${q[0]}<br>
          <span class="o" onclick="tf(this,${i},true)">True</span>
          <span class="o" onclick="tf(this,${i},false)">False</span>
        </div>
      `).join('');
  }

  h += '</div>';
  app.innerHTML = h;

  if(step === 0){
    playingKey = p.k;
    player.src = AUD[p.k] || '';
    player.playbackRate = slowMode ? 0.85 : 1.0;
    if(autoPlay){
      player.play().catch(()=>say(p.s, p.g));
    }
  }
}

function lock(el){
  if(el.parentNode.dataset.l) return true;
  el.parentNode.dataset.l = '1';
  return false;
}

function pick(el, i, k){
  if(lock(el)) return;
  const a = D[cur].ch[i][2];
  if(k === a){
    sfx.ok();
    el.classList.add('ok');
  } else {
    sfx.bad();
    el.classList.add('bad');
    el.parentNode.querySelectorAll('.o')[a].classList.add('ok');
  }
}

function tf(el, i, v){
  if(lock(el)) return;
  const a = D[cur].cmp[i][1];
  if(v === a){
    sfx.ok();
    el.classList.add('ok');
  } else {
    sfx.bad();
    el.classList.add('bad');
    el.parentNode.querySelectorAll('.o')[a ? 0 : 1].classList.add('ok');
  }
}

function chk(){
  let c = 0;
  D[cur].gap.forEach((q,i)=>{
    const e = $('#g'+i);
    e.classList.remove('ok','bad');
    void e.offsetWidth;
    if(e.value.trim().toLowerCase() === q[1].toLowerCase()){
      c++;
      e.classList.add('ok');
    } else {
      e.classList.add('bad');
    }
  });
  $('#res').textContent = `${c}/${D[cur].gap.length}` + (c === D[cur].gap.length ? ' — Perfect trip!' : ' — Try again!');
  const sb = $('#showAnsBtn');
  if(sb && c < D[cur].gap.length) sb.classList.remove('hid');
  if(c === D[cur].gap.length){ sfx.win(); confetti(); }
  else if(c > 0) sfx.ok();
  else sfx.bad();
}

function revealGaps(){
  sfx.click();
  D[cur].gap.forEach((q,i)=>{
    const ga = $('#ga'+i);
    if(ga) ga.classList.remove('hid');
  });
}

  {q: "I tried to order coffee in French, and the waiter brought me a huge chocolate cake!", k: "lena", opts: ["anna","lena","mei","sofia"]},

          <div class="b-choices" id="bChoices">
            ${item.opts.map(ok => {
              const ch = D.find(x => x.k === ok);
              return `<button class="b-opt" onclick="pickBonus(this,'${ok}','${item.k}')">
                <img src="${IMG[ch.k]}" alt="${ch.n}">
                <div><div>${ch.n}</div><small style="font-weight:500;color:#5c6f82">${ch.t}</small></div>
              </button>`;
            }).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
}

function pickBonus(btn, chosen, right){
  const wrap = $('#bChoices');
  if(!wrap || wrap.dataset.l) return;
  wrap.dataset.l = '1';
  if(chosen === right){
    bScore++;
    sfx.ok();
    btn.classList.add('ok');
  } else {
    sfx.bad();
    btn.classList.add('bad');
    [...wrap.querySelectorAll('.b-opt')].forEach(b => {
      if(b.getAttribute('onclick').includes(`'${right}'`)) b.classList.add('ok');
    });
  }
  setTimeout(()=>{ bIdx++; renderBonus(); }, 950);
}

home();
{const h=location.hash.slice(1),i=D.findIndex(p=>p.k===h);if(i>=0){cur=i;step=0;go(false);}}
</script>
