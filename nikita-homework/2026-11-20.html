function Cards(box,list){
 let i=0;
 box.innerHTML='<div class="qc-top"><span class="cnt"></span><button class="uk">▶ UK</button></div><div class="qcard"><div class="qin"><div class="face f"><div class="term"></div></div><div class="face b"><div class="mean"></div><div class="ru"></div><div class="ex"></div></div></div></div><div class="qc-nav"><button class="arr pv">←</button><button class="arr nx">→</button></div>';
 const c=box.querySelector('.qcard'),q=s=>box.querySelector(s);
 function draw(){c.classList.remove('fl');const w=list[i];q('.cnt').textContent=(i+1)+' / '+list.length;q('.f .term').textContent=w[0];q('.mean').textContent=w[1];q('.ru').textContent=w[2];q('.ex').textContent=w[3];}
 c.onclick=()=>{c.classList.toggle('fl');if(c.classList.contains('fl'))say(list[i][0]);};
 q('.uk').onclick=()=>say(list[i][0]);
 q('.pv').onclick=()=>{i=(i+list.length-1)%list.length;draw();};
 q('.nx').onclick=()=>{i=(i+1)%list.length;draw();};
 draw();
}

/* ---------- quiz: one question at a time, free navigation, one attempt ---------- */
function Quiz(box,id,title,items){
 const S=ST[id]||(ST[id]={a:{},o:{}});
 items.forEach((it,k)=>{if(!S.o[k])S.o[k]=shuffle(it.o.map((_,j)=>j));});
 let i=0;
 const done=()=>Object.keys(S.a).length===items.length;
 function result(){
  const wrong=items.map((it,k)=>[it,k]).filter(([it,k])=>S.a[k]!==it.a);
  box.innerHTML='<h3>'+title+'</h3><p class="res">'+(items.length-wrong.length)+' / '+items.length+'</p>'+(wrong.length?'<p class="note">Check these:</p><ol class="rev">'+wrong.map(([it])=>'<li>'+it.q.replace('___','<b>'+it.o[it.a]+'</b>')+'</li>').join('')+'</ol>':'<p class="q">All correct.</p>');
 }
 function draw(){
  if(done()&&S.seen){result();return;}
  const it=items[i],ans=S.a[i];
  box.innerHTML='<h3>'+title+'</h3><div class="dots">'+items.map((x,k)=>'<button class="dot'+(k===i?' cur':'')+(S.a[k]==null?'':S.a[k]===x.a?' r':' w')+'" data-k="'+k+'">'+(k+1)+'</button>').join('')+'</div><p class="q">'+it.q+'</p><div class="opts">'+S.o[i].map(j=>'<button class="opt" data-j="'+j+'">'+it.o[j]+'</button>').join('')+'</div><div class="expl"></div><div class="qnav"><button class="arr pv">←</button><button class="arr nx">'+(done()?'See result':'→')+'</button></div>';
  box.querySelectorAll('.dot').forEach(d=>d.onclick=()=>{i=+d.dataset.k;draw();});
  box.querySelector('.pv').onclick=()=>{i=(i+items.length-1)%items.length;draw();};
  box.querySelector('.nx').onclick=()=>{if(done()){S.seen=1;save();result();return;}i=(i+1)%items.length;draw();};
  if(ans!=null)mark(ans);
  else box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{S.a[i]=+b.dataset.j;save();draw();});
 }
 function mark(ans){
  const it=items[i];
  box.querySelectorAll('.opt').forEach(b=>{b.disabled=true;const j=+b.dataset.j;if(j===it.a)b.classList.add('ok');else if(j===ans)b.classList.add('bad');});
  box.querySelector('.expl').textContent=(ans===it.a?'Correct. ':'Not quite. ')+it.e;
 }
 draw();
 return {done};
}
