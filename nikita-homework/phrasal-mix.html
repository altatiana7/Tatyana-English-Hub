  {v:'put away',ru:'убрать на место',s:'{Put} your things [away] before dinner.',q:'Are you good at putting things away?',x:['back']},
  {v:'clear out',ru:'освободить, расчистить',s:'We {cleared} [out] the garage at the weekend.',q:'When did you last clear out your cupboards?',x:['up']}]],
 ['Money',[
  {v:'pay back',ru:'вернуть (долг)',s:'Don’t worry, I’ll {pay} you [back] on Friday.',q:'Would you lend money again to a friend who never paid you back?'},
  {v:'save up',ru:'копить',s:'I’m {saving} [up] for a new car.',q:'What are you saving up for?'},
  {v:'splash out',ru:'раскошелиться, потратиться на дорогое',s:'For our anniversary we {splashed} [out] on a luxury hotel.',q:'What would you splash out on?'},
  {v:'take out',ru:'взять (кредит)',s:'They {took} [out] a loan to buy a flat.',q:'Would you take out a loan to pay for education?'},
  {v:'live on',ru:'жить на (сумму)',s:'It’s hard to {live} [on] a student grant.',q:'Could you live on half your income?'}]],
 ['Events',[
  {v:'put off',ru:'отложить',s:'The meeting has been {put} [off] until Monday.',q:'What do you always put off?',x:['back']},
  {v:'call off',ru:'отменить',s:'They {called} [off] the match because of the rain.',q:'Have you ever called off a party or a trip?'},
  {v:'turn up',ru:'прийти, появиться',s:'We invited fifty people, but only five {turned} [up].',q:'What do you do when guests turn up late?',x:['out']},
  {v:'go ahead',ru:'состояться (по плану)',s:'The festival will {go} [ahead] despite the weather.',q:'Should outdoor events go ahead in bad weather?'},
  {v:'dress up',ru:'нарядиться',s:'Everyone {dressed} [up] for the wedding.',q:'Do you like dressing up for events?'}]]
];
/* plain English meaning for the second Match set */
const EN={"take on": "hire; accept (work)", "set up": "establish (a business)", "turn down": "reject (an offer)", "carry on": "continue", "fill in": "complete (a form)", "try on": "put on to check the size", "pick up": "buy (often cheaply)", "shop around": "compare prices in different shops", "take back": "return (to a shop)", "go for": "choose", "set off": "start a journey", "get on": "board (a bus, train, plane)", "get off": "leave (a bus, train, plane)", "drop off": "drive someone somewhere and leave them", "hold up": "delay", "eat out": "eat in a restaurant", "cut down on": "reduce", "go off": "go bad", "heat up": "make (food) hot again", "run out of": "have none left", "chill out": "relax", "hang out": "spend free time with friends", "take up": "start (a hobby)", "sleep in": "sleep later than usual", "get away": "go on holiday", "get on with": "have a good relationship with", "look after": "take care of", "bring up": "raise (a child)", "fall out": "quarrel", "take after": "resemble (a relative)", "break into": "enter illegally", "get away with": "escape punishment for", "lock up": "imprison", "let off": "not punish", "turn yourself in": "surrender to the police", "move in": "start living in a new home", "move out": "leave your home for good", "do up": "renovate", "settle in": "get used to a new place", "tidy up": "make neat", "drop out": "leave a course without finishing", "catch up": "reach the same level as others", "look up": "search for (information)", "hand in": "submit", "fall behind": "fail to keep up", "work out": "exercise", "give up": "quit (a habit)", "get over": "recover from", "pass out": "faint", "warm up": "prepare your body for exercise", "check in": "register on arrival", "check out": "pay and leave (a hotel)", "put up": "give someone a bed for the night", "stop over": "break a long journey", "look around": "explore (a place)", "find out": "discover", "carry out": "conduct (research)", "come up with": "think of, invent", "die out": "become extinct", "figure out": "understand, solve", "hang up": "end a phone call", "call back": "return a phone call", "hold on": "wait (on the phone)", "get through": "manage to reach someone by phone", "cut off": "disconnect", "come out": "be released", "put on": "stage (a show)", "sell out": "have no tickets left", "go out": "go somewhere to have fun", "make up": "invent (a story)", "throw away": "discard", "give away": "give for free", "sort out": "organise; resolve", "put away": "return to its place", "clear out": "empty (a room or cupboard)", "pay back": "repay", "save up": "keep money for something", "splash out": "spend a lot of money", "take out": "get (a loan)", "live on": "have just this money to live", "put off": "postpone", "call off": "cancel", "turn up": "arrive, appear", "go ahead": "take place as planned", "dress up": "wear smart clothes"};
const ALL=T.flatMap((t,ti)=>t[1].map((it,k)=>({...it,t:t[0],ti,k,en:EN[it.v]})));
const blankVerb=s=>esc(s).replace(/\{(.+?)\}/g,'<span class="gap">&nbsp;</span>').replace(/\[(.+?)\]/g,'<span class="gap">&nbsp;</span>');
const P1=['up','out','off','on','in','away','back','down','over','after','around','into','for','ahead','behind','through'];
const P2=['on with','away with','out of','down on','up with','up to','in for','out with'];
const part=it=>it.s.match(/\[(.+?)\]/)[1];
const verbHTML=(s,fill,cls)=>esc(s).replace(/\{(.+?)\}/g,'<b class="pv">$1</b>').replace(/\[(.+?)\]/g,(m,p)=>`<span class="gap ${cls||''}">${fill?esc(fill):'&nbsp;'}</span>`);
const full=s=>esc(s).replace(/\{(.+?)\}/g,'<b class="pv">$1</b>').replace(/\[(.+?)\]/g,'<b class="pv">$1</b>');
function optsFor(it){const c=part(it),pool=(c.includes(' ')?P2:P1).filter(p=>p!==c&&!(it.x||[]).includes(p));return shuffle([c,...shuffle(pool).slice(0,3)])}
function say(t){try{if(!('speechSynthesis' in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-GB';u.rate=.9;const v=speechSynthesis.getVoices().find(x=>/en-GB/i.test(x.lang));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
/* split items into even pages of at most `size` */
function chunks(a,size){const n=Math.ceil(a.length/size),out=[];let i=0;for(let k=0;k<n;k++){const len=Math.ceil((a.length-i)/(n-k));out.push(a.slice(i,i+len));i+=len}return out}

/* ---------- state ---------- */
const MODES=['Cards','Particle','Match','Speak'];
let round=0,topic=-1,mode=0,timers=[],keyFn=null;
const items=()=>topic>=0?ALL.filter(x=>x.ti===topic):ALL.filter(x=>x.k===round);
const srcName=()=>topic>=0?`Topic: ${T[topic][0]}`:`Mix ${round+1}: one verb from each of the 17 topics`;
function clear(){timers.forEach(clearInterval);timers=[];keyFn=null;try{speechSynthesis.cancel()}catch(e){}}
const every=(ms,f)=>{const t=setInterval(f,ms);timers.push(t);return t};
const scr=$('#scr');
function frame(title,sub,body,o={}){scr.innerHTML=`<div class="head"><div><h2>${title}</h2><p class="sub">${sub}</p></div><div>${o.right||''}</div></div><div class="body">${body}</div><div class="foot">${o.left||'<span></span>'}<span>${o.mid||''}</span>${o.next||'<span></span>'}</div>`}

$('#rounds').innerHTML=[0,1,2,3,4].map(i=>`<button data-r="${i}">Mix ${i+1}</button>`).join('');
$('#topic').innerHTML=`<option value="-1">All topics (mix)</option>`+T.map((t,i)=>`<option value="${i}">${t[0]}</option>`).join('');
$('#tabs').innerHTML=MODES.map((m,i)=>`<button data-m="${i}">${m}</button>`).join('');
$$('[data-r]').forEach(b=>b.onclick=()=>{round=+b.dataset.r;topic=-1;$('#topic').value='-1';render()});
$('#topic').onchange=e=>{topic=+e.target.value;render()};
$$('[data-m]').forEach(b=>b.onclick=()=>{mode=+b.dataset.m;render()});
$('#brand').onclick=()=>{round=0;topic=-1;mode=0;$('#topic').value='-1';render()};
if(new URLSearchParams(location.search).has('embed'))$('#back').style.display='none';
document.addEventListener('keydown',e=>{if(keyFn&&!e.target.closest('select'))keyFn(e)});

function render(){clear();
  $$('[data-r]').forEach(b=>b.classList.toggle('on',topic<0&&+b.dataset.r===round));
  $$('[data-m]').forEach(b=>b.classList.toggle('on',+b.dataset.m===mode));
  [cards,particle,match,speak][mode]()}

/* ---------- 1. Cards (Quizlet style) ---------- */
function cards(){const list=items();let order=list.map((_,i)=>i),pos=0,fl=false,know=new Set(),learn=new Set(),fin=false;
  const go=d=>{fl=false;pos=Math.max(0,pos+d);if(pos>=order.length)fin=true;draw()};
  const mark=k=>{const i=order[pos];(k?know:learn).add(i);(k?learn:know).delete(i);go(1)};
  function draw(){
    if(fin){keyFn=null;frame('Flashcards',srcName(),`<div class="done"><div class="dt">Round complete</div><div class="rq"><b class="v">Know it: ${know.size}</b> &nbsp;·&nbsp; <b class="x">Still learning: ${learn.size}</b></div>${learn.size?`<div class="chips" style="justify-content:center">${[...learn].map(i=>`<span class="chip">${esc(list[i].v)}</span>`).join('')}</div>`:''}<div style="display:flex;gap:8px">${learn.size?`<button class="btn gold" id="ag">Study these ${learn.size} again</button>`:''}<button class="btn ghost" id="rs">Start again</button></div></div>`,{next:`<button class="btn" onclick="mode=1;render()">Particle game →</button>`});
      const a=$('#ag');if(a)a.onclick=()=>{order=[...learn];learn=new Set();pos=0;fin=false;draw()};$('#rs').onclick=()=>cards();return}
    const it=list[order[pos]];
    frame('Flashcards',srcName()+'. Say the meaning in Russian, then flip. Space flips, arrows move.',`<div class="qz"><div class="flip qcard ${fl?'f':''}"><div class="in">
      <div class="face a"><span class="qtop label">${esc(it.t)}</span><div class="qterm">${esc(it.v)}</div><button class="play" data-say aria-label="Listen">▶</button><div class="qhint">click the card to flip</div></div>
      <div class="face b"><span class="qtop label">${esc(it.t)}</span><div class="qru">${esc(it.ru)}</div><div class="qex">${full(it.s)}</div><button class="play" data-say aria-label="Listen">▶</button></div></div></div>
      <div class="qprog"><i style="width:${pos/order.length*100}%"></i></div>
      <div class="qbar"><div class="qnav"><button class="btn ghost sm" id="pv" ${pos?'':'disabled'} aria-label="Previous">←</button><span class="cnt">${pos+1} / ${order.length}</span><button class="btn ghost sm" id="nx" aria-label="Next">→</button></div>
      <div class="qk"><button class="btn ghost sm learn" id="ln">Still learning</button><button class="btn ghost sm know" id="kn">Know it</button></div><button class="btn ghost sm" id="sh">Shuffle</button></div></div>`);
    const card=$('.qcard');card.onclick=e=>{if(e.target.closest('button'))return;fl=!fl;card.classList.toggle('f',fl)};
    $$('[data-say]').forEach(b=>b.onclick=e=>{e.stopPropagation();say(fl?it.s.replace(/[{}\[\]]/g,''):it.v)});
    $('#pv').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);$('#kn').onclick=()=>mark(1);$('#ln').onclick=()=>mark(0);
    $('#sh').onclick=()=>{order=shuffle(order);pos=0;fl=false;draw()};
    keyFn=e=>{if(e.key===' '){e.preventDefault();card.click()}else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft'&&pos)go(-1)}}
  draw()}

/* ---------- 2. Particle: bombs, 15 seconds each ---------- */
function particle(){const list=shuffle(items()),pages=chunks(list,4);let pg=0;
  const st=list.map(it=>({it,opts:optsFor(it),pick:null,boom:false,left:15,run:false}));
  const score=()=>st.filter(s=>s.pick===part(s.it)).length;
  every(1000,()=>{let boom=false;st.forEach((s,i)=>{if(s.run&&s.pick==null&&!s.boom){s.left--;if(s.left<=0){s.boom=true;s.run=false;boom=true}else{const b=$(`.bomb[data-b="${i}"]`);if(b)b.textContent=s.left}}});if(boom&&pg<pages.length)draw()});
  function draw(){
    if(pg>=pages.length){const wrong=st.filter(s=>s.pick!==part(s.it));
      frame('Particle game: result',srcName(),`<div class="done"><div class="dt">Score ${score()} / ${st.length}</div>${wrong.length?`<table class="mis">${wrong.map(s=>`<tr><td>${s.boom?'<b class="x">Too late</b>':`<b class="x">${esc(s.pick)}</b>`}</td><td>${full(s.it.s)}</td></tr>`).join('')}</table>`:'<div class="rq"><b class="v">No mistakes.</b></div>'}<button class="btn gold" id="pa">Play again</button></div>`,{left:`<button class="btn ghost" id="bk">← Back</button>`,next:`<button class="btn" onclick="mode=2;render()">Match →</button>`});
      $('#pa').onclick=()=>particle();$('#bk').onclick=()=>{pg--;draw()};return}
    const base=pages.slice(0,pg).reduce((n,p)=>n+p.length,0);
    frame('Particle game',srcName()+'. Tap a bomb, then choose the particle before it explodes.',`<div class="rows">${pages[pg].map((it,j)=>{const i=base+j,s=st[i],fin=s.pick!=null||s.boom,ok=s.pick===part(it);
      const bc=s.boom?'boom':(s.pick!=null?'safe':(s.run?'run':''));
      return `<div class="row brow"><button class="bomb ${bc}" data-b="${i}" ${fin?'disabled':''}>${s.boom?'BOOM':(s.pick!=null?(ok?'✓':'✕'):s.left)}</button><div><div class="rq"><span class="num">${i+1}</span>${fin?verbHTML(it.s,part(it),ok?'v':'x'):verbHTML(it.s)}<span class="tp">${esc(it.t)}</span></div>
      ${fin?`<div class="rx"><b class="${ok?'v':'x'}">${s.boom?'Too late.':(ok?'Correct.':`Not “${esc(s.pick)}”.`)}</b> <b>${esc(it.v)}</b> · ${esc(it.ru)}</div>`:(s.run?`<div class="opts">${s.opts.map(o=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`:'<div class="rx" style="color:var(--muted)">Tap the bomb to see the options.</div>')}</div></div>`}).join('')}</div>`,
      {right:`<span class="score">Score ${score()} / ${st.length}</span>`,left:pg?`<button class="btn ghost" id="bk">← Back</button>`:'<span></span>',mid:`<span class="cnt">Screen ${pg+1} / ${pages.length}</span>`,next:`<button class="btn" id="nx">${pg===pages.length-1?'See result':'Next screen →'}</button>`});
    $$('[data-b]').forEach(b=>b.onclick=()=>{const s=st[+b.dataset.b];if(s.run)return;s.run=true;draw()});
    $$('.opt[data-i]').forEach(b=>b.onclick=()=>{const s=st[+b.dataset.i];s.pick=b.textContent;s.run=false;draw()});
    $('#nx').onclick=()=>{pg++;draw()};const bk=$('#bk');if(bk)bk.onclick=()=>{pg--;draw()}}
  draw()}

/* ---------- 3. Match: verb ↔ Russian ---------- */
/* three Match sets: Russian, English meaning, in context */
const MSETS=[
 {name:'1 · Russian',sub:'Tap a phrasal verb, then its Russian meaning.',L:it=>esc(it.v),R:it=>esc(it.ru),cols:'1fr 1.25fr'},
 {name:'2 · English',sub:'Tap a phrasal verb, then its plain English meaning.',L:it=>esc(it.v),R:it=>esc(it.en),cols:'1fr 1.25fr'},
 {name:'3 · In context',sub:'Tap a sentence, then the phrasal verb that completes it.',L:it=>blankVerb(it.s),R:it=>esc(it.v),cols:'1.9fr 1fr'}];
let mset=0;
function match(){const ms=MSETS[mset],list=shuffle(items()),pages=chunks(list,6);let pg=0,miss=0,t=0;const done=new Set();
  every(1000,()=>{if(done.size<list.length&&pg<pages.length){t++;const s=$('#ms');if(s)s.textContent=stat()}});
  const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
  const stat=()=>`${done.size} / ${list.length} · ${fmt(t)} · mistakes ${miss}`;
  const setBar=`<div class="seg3">${MSETS.map((m,i)=>`<button class="${i===mset?'on':''}" data-set="${i}">${m.name}</button>`).join('')}</div>`;
  const wireSets=()=>$$('[data-set]').forEach(b=>b.onclick=()=>{mset=+b.dataset.set;render()});
  function draw(){
    if(pg>=pages.length){const nxt=mset<MSETS.length-1?`<button class="btn" id="ns">Next: set ${MSETS[mset+1].name} →</button>`:`<button class="btn" onclick="mode=3;render()">Speak →</button>`;
      frame('Match: result',srcName(),`<div class="done"><div class="label">Set ${ms.name}</div><div class="dt">All ${list.length} pairs in ${fmt(t)}</div><div class="rq">Mistakes: ${miss}</div><button class="btn gold" id="pa">Play again</button></div>`,{right:setBar,next:nxt});
      wireSets();$('#pa').onclick=()=>match();const ns=$('#ns');if(ns)ns.onclick=()=>{mset++;render()};return}
    const P=pages[pg],R=shuffle(P.map((_,i)=>i));let sel=null;
    frame('Match',srcName()+'. '+ms.sub,`<div class="match" style="grid-template-columns:${ms.cols}">${P.map((it,i)=>`<button class="mt l ${done.has(it)?'ok':''}" data-l="${i}">${ms.L(it)}</button><button class="mt ${mset<2?'':'l'} ${done.has(P[R[i]])?'ok':''}" data-r="${R[i]}">${ms.R(P[R[i]])}</button>`).join('')}</div>`,
      {right:setBar,left:`<span class="score" id="ms">${stat()}</span>`,mid:`<span class="cnt">Screen ${pg+1} / ${pages.length}</span>`,next:P.every(it=>done.has(it))?`<button class="btn" id="nx">${pg===pages.length-1?'See result':'Next screen →'}</button>`:'<span></span>'});
    wireSets();
    $$('[data-l]').forEach(b=>b.onclick=()=>{if(done.has(P[+b.dataset.l]))return;$$('[data-l]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=+b.dataset.l});
    $$('[data-r]').forEach(b=>b.onclick=()=>{const r=+b.dataset.r;if(sel==null||done.has(P[r]))return;
      if(r===sel){done.add(P[r]);sel=null;draw()}else{miss++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);$('#ms').textContent=stat()}});
    const nx=$('#nx');if(nx)nx.onclick=()=>{pg++;draw()}}
  draw()}

/* ---------- 4. Speak: question cards, answer on the back ---------- */
function speak(){const list=shuffle(items()),pages=chunks(list,4);let pg=0;
  function draw(){const P=pages[pg];
    frame('Speak',srcName()+'. Answer with the phrasal verb in a full sentence, then flip to check its meaning.',`<div class="sgrid">${P.map(it=>`<div class="flip"><div class="in"><div class="face a"><span class="qtop label">${esc(it.t)}</span><div class="sq">${esc(it.q)}</div><div class="qhint">click to flip</div></div>
      <div class="face b"><div class="qterm" style="font-size:26px">${esc(it.v)}</div><div class="qru">${esc(it.ru)}</div><div class="qex">${full(it.s)}</div></div></div></div>`).join('')}</div>`,
      {left:pg?`<button class="btn ghost" id="bk">← Back</button>`:'<span></span>',mid:`<span class="cnt">Screen ${pg+1} / ${pages.length}</span>`,next:pg<pages.length-1?`<button class="btn" id="nx">Next screen →</button>`:`<button class="btn ghost" id="ag">Start again</button>`});
    $$('.flip').forEach(f=>f.onclick=()=>f.classList.toggle('f'));
    const nx=$('#nx');if(nx)nx.onclick=()=>{pg++;draw()};const bk=$('#bk');if(bk)bk.onclick=()=>{pg--;draw()};const ag=$('#ag');if(ag)ag.onclick=()=>speak()}
  draw()}

render();
</script>
</body>
