<p><b>1. Усиление (эмфаза).</b> Отрицательное или ограничительное слово выносится в начало, и мысль звучит сильнее и драматичнее: <i>Never have I seen…</i> = «Никогда ещё я не видел…». Это как интонационное ударение, только на письме.</p>
<p><b>2. Формальный, «книжный» стиль.</b> Эссе, доклады, речи, дебаты, официальные письма. Это маркер уровня C1: на экзаменах (эссе, IELTS, CAE) инверсия даёт баллы за грамматический диапазон.</p>
<p><b>3. Условные предложения без if.</b> <i>Had I known…</i> = <i>If I had known…</i>; <i>Should you need help…</i> = <i>If you need help…</i>; <i>Were I you…</i> = <i>If I were you…</i> Звучит официально, особенно в письмах.</p>
<p><b>4. Связность текста.</b> Удобно начинать абзац или вывод с акцента: <i>Not only…, but also…</i>; <i>Only then did we realise…</i>; <i>Little did they know…</i></p>
<p><b>5. В разговорной речи</b> встречается редко, кроме устойчивых фраз: <i>So do I. / Neither do I.</i>, <i>Little did I know…</i>, <i>Here comes the bus.</i></p>
<p><b>Главное правило:</b> после выдвинутого вперёд слова порядок как в вопросе — вспомогательный глагол перед подлежащим; если вспомогательного нет, добавляем <i>do / does / did</i>.</p>`;

function qdeck(root,n,o){let order=[...Array(n).keys()],pos=0,fl=false,know=new Set(),learn=new Set(),fin=false;
  root.style.display='flex';root.style.flexDirection='column';
  const go=d=>{fl=false;pos+=d;if(pos<0)pos=0;if(pos>=order.length){fin=true}draw()};
  const mark=k=>{const i=order[pos];(k?know:learn).add(i);(k?learn:know).delete(i);go(1)};
  function draw(){
    if(fin){root.innerHTML=`<div class="qz"><div class="listen"><div class="qname">Round complete</div><div class="rq"><b class="v">Know it: ${know.size}</b> &nbsp;·&nbsp; <b class="x">Still learning: ${learn.size}</b></div>${learn.size?`<div class="chips" style="justify-content:center">${[...learn].map(i=>`<span class="chip">${esc(o.name(i))}</span>`).join('')}</div>`:''}<div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">${learn.size?`<button class="btn gold sm" data-q="again">Study these ${learn.size} again</button>`:''}<button class="btn ghost sm" data-q="restart">Start again</button></div></div></div>`;
      const a=$('[data-q=again]',root);if(a)a.onclick=()=>{order=[...learn];learn=new Set();pos=0;fin=false;draw()};
      $('[data-q=restart]',root).onclick=()=>{order=[...Array(n).keys()];know=new Set();learn=new Set();pos=0;fin=false;draw()};deckKey=null;return}
    const i=order[pos],sp=o.speak?`<button class="play big" data-q="say" aria-label="Listen">▶</button>`:'';
    root.innerHTML=`<div class="qz"><div class="flip qcard ${fl?'f':''}"><div class="in"><div class="face a">${o.front(i)}${sp}<div class="qhint">click the card to flip</div></div><div class="face b">${o.back(i)}${sp}</div></div></div>
      <div class="qprog"><i style="width:${pos/order.length*100}%"></i></div>
      <div class="qbar"><div class="qnav"><button class="btn ghost sm" data-q="prev" ${pos?'':'disabled'} aria-label="Previous">←</button><span class="cnt">${pos+1} / ${order.length}</span><button class="btn ghost sm" data-q="next" aria-label="Next">→</button></div>
      <div class="qk"><button class="btn ghost sm learn" data-q="learn">Still learning</button><button class="btn ghost sm know" data-q="know">Know it</button></div><button class="btn ghost sm" data-q="shuf">Shuffle</button></div></div>`;
    const card=$('.qcard',root);card.onclick=e=>{if(e.target.closest('button'))return;fl=!fl;card.classList.toggle('f',fl)};
    $$('[data-q=say]',root).forEach(b=>b.onclick=e=>{e.stopPropagation();say(o.speak(i))});
    $('[data-q=prev]',root).onclick=()=>go(-1);$('[data-q=next]',root).onclick=()=>go(1);
    $('[data-q=know]',root).onclick=()=>mark(1);$('[data-q=learn]',root).onclick=()=>mark(0);
    $('[data-q=shuf]',root).onclick=()=>{order=shuffle(order);pos=0;fl=false;draw()};
    deckKey=e=>{if(e.key===' '){e.preventDefault();card.click()}else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft'&&pos)go(-1)}}

  frame('Check · Bomb round','Activity 1: tap a bomb, then choose the word in 15 seconds. Activity 2: answer aloud, using the words.',`<div class="grid" style="grid-template-columns:1.25fr 1fr">${pane(1,'Bombs','bm','sb')}<div class="pane"><div class="ph"><span class="label" style="margin:0"><span class="pn">2</span>Say it</span></div><div class="pb rows">${SAY[pg.p].map((q,i)=>`<div class="row"><div class="rq" style="font-size:16.5px"><span class="num">${i+1}</span>${q}</div></div>`).join('')}</div></div></div>`,{left:pg.prev,next:pg.next});
  bombSet($('#bm'),CHECK.slice(pg.p*4,pg.p*4+4),$('#sb'))}}
]];
document.addEventListener('keydown',e=>{if(deckKey&&!e.target.closest('input,textarea,audio,video'))deckKey(e);if(e.key==='Escape')closeDrawers()});
show(0,0);
</script>
