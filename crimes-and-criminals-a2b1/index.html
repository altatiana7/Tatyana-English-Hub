<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crimes and Criminals · A2–B1</title>
<style>
:root{
  --ink:#16202e; --ink2:#2a3a50; --paper:#f4f1ea; --card:#ffffff; --line:#d9d3c5;
  --tape:#f2c230; --red:#c8372d; --green:#1f8a4c; --blue:#2457a6; --muted:#5d6675;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Segoe UI",Arial,sans-serif;background:var(--paper);color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}
/* top bar */
.top{display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:6px 12px;flex:0 0 auto}
.top .brand{font-family:Georgia,"Times New Roman",serif;font-weight:700;font-size:18px;white-space:nowrap;letter-spacing:.3px}
.top .brand span{color:var(--tape)}
.steps{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.steps button{background:var(--ink2);color:#dfe6f0;border:0;border-radius:6px;padding:6px 8px;font-size:13px;white-space:nowrap}
.steps button.on{background:var(--tape);color:var(--ink);font-weight:700}
.steps button.done{color:#9fd8b3}
.top .nav{display:flex;gap:6px}
.top .nav button{background:#fff;color:var(--ink);border:0;border-radius:6px;padding:6px 12px;font-size:14px;font-weight:600}
.top .nav button:disabled{opacity:.35;cursor:default}
/* stage */
.stage{flex:1;min-height:0;padding:12px 18px 12px;display:flex;flex-direction:column;overflow:auto}
.task{font-size:20px;font-weight:600;margin:0 0 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.task .tag{background:var(--ink);color:var(--tape);font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:4px 8px;border-radius:4px}
.task .right{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:16px;font-weight:600}
.pill{background:#fff;border:1px solid var(--line);border-radius:20px;padding:4px 12px}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-size:17px;font-weight:600}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.go{background:var(--blue)}
.btn.small{padding:6px 12px;font-size:15px}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-height:0}
.hidden{display:none!important}
.note{color:var(--muted);font-size:16px}
/* quiz */
.qwrap{display:flex;gap:18px;flex:1;min-height:0}
.qimg{flex:0 0 42%;border-radius:10px;overflow:hidden;background:#ddd;max-height:100%}
.qimg img{width:100%;height:100%;object-fit:cover;display:block}
.qbody{flex:1;display:flex;flex-direction:column;gap:12px;min-width:0}
.question{font-size:25px;font-weight:600;line-height:1.35}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 14px;font-size:19px;text-align:left;color:var(--ink)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{background:#e3f4ea;border-color:var(--green);color:#0f5a30;font-weight:700}
.opt.wrong{background:#fbe5e3;border-color:var(--red);color:#8f1f17;font-weight:700}
.opt:disabled{cursor:default}
.feedback{font-size:18px;line-height:1.4;padding:10px 14px;border-radius:8px;background:#fff;border-left:5px solid var(--ink)}
.feedback.ok{border-color:var(--green)} .feedback.bad{border-color:var(--red)}
.bar{height:8px;background:#e2ddd0;border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--tape);transition:width .3s}
/* vocab row */
.vrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.vcell{background:#fff;border:2px solid var(--line);border-radius:8px;padding:8px 10px;font-size:19px;min-height:62px}
.vcell small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:2px}
.vcell.target{border-color:var(--tape);background:#fff8dd}
.vcell.blank{color:#aaa}
/* result */
.result{display:flex;gap:18px;flex:1;min-height:0}
.result .score{flex:0 0 260px;background:var(--ink);color:#fff;border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.result .score b{font-size:46px;color:var(--tape);font-family:Georgia,serif}
.result .review{flex:1;overflow:auto;background:#fff;border-radius:12px;padding:12px 16px;font-size:17px}
.review .it{padding:6px 0;border-bottom:1px solid #eee;line-height:1.4}
.review .x{color:var(--red);font-weight:700} .review .v{color:var(--green);font-weight:700}
table.vt{width:100%;border-collapse:collapse;font-size:16px}
table.vt th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);padding:2px 6px}
table.vt td{padding:3px 6px;border-top:1px solid #eee}
/* cards grid */
.grid{display:grid;gap:12px;flex:1;min-height:0}
.film{position:relative;border-radius:10px;overflow:hidden;background:#000;border:0;padding:0}
.film img{width:100%;height:100%;object-fit:cover;display:block;opacity:.95}
.film .cap{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.85));color:#fff;padding:22px 12px 8px;font-size:19px;font-weight:700;text-align:left}
.film .cap.q{color:var(--tape)}
.overlay{position:fixed;inset:0;background:rgba(10,16,26,.75);display:flex;align-items:center;justify-content:center;z-index:9;padding:30px}
.modal{background:#fff;border-radius:14px;max-width:1000px;width:100%;max-height:100%;display:flex;overflow:hidden}
.modal img{width:48%;object-fit:cover}
.modal .mt{padding:22px 26px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.modal h2{margin:0;font-family:Georgia,serif;font-size:30px}
.modal p{margin:0;font-size:21px;line-height:1.45}
/* match pics */
.pic{background:#fff;border:3px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;padding:0;text-align:left}
.pic img{width:100%;flex:1;min-height:0;object-fit:cover;display:block}
.pic .lab{padding:8px 10px;font-size:19px;font-weight:700;min-height:44px;display:flex;align-items:center;gap:8px}
.pic .num{background:var(--ink);color:#fff;border-radius:50%;width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
.pic.sel{border-color:var(--blue)}
.pic.right{border-color:var(--green)} .pic.wrong{border-color:var(--red)}
.chip{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:7px 12px;font-size:18px;color:var(--ink)}
.chip.sel{background:var(--ink);color:#fff}
.chip.used{opacity:.35}
.defs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.def{background:#fff;border-radius:8px;padding:10px 12px;font-size:16px;line-height:1.4;border:1px solid var(--line)}
.def b{font-size:18px}
/* gaps */
.gap{display:inline-block;min-width:120px;border:0;border-bottom:3px solid var(--ink);background:#fff8dd;padding:1px 8px;margin:0 2px;font:inherit;font-weight:700;color:var(--blue);border-radius:4px 4px 0 0;text-align:center}
.gap.sel{outline:3px solid var(--blue)}
.gap.right{background:#e3f4ea;border-color:var(--green);color:#0f5a30}
.gap.wrong{background:#fbe5e3;border-color:var(--red);color:#8f1f17}
.dialogue{background:#fff;border-radius:12px;padding:12px 18px;font-size:clamp(17px,2.7vh,21px);line-height:1.75;flex:1;min-height:0;overflow:auto}
.dialogue p{margin:0 0 clamp(0px,1.2vh,12px)}
.dialogue.tight p{margin:0 0 clamp(0px,.6vh,8px)}
.dialogue .who{font-weight:700;color:var(--ink2)}
/* grammar */
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;flex:1;min-height:0}
.panel{background:#fff;border-radius:12px;padding:12px 16px;overflow:auto}
.panel h3{margin:0 0 8px;font-family:Georgia,serif;font-size:24px}
.panel.ps h3{color:var(--blue)} .panel.pc h3{color:var(--red)}
.rule{font-size:17px;line-height:1.4;margin:0 0 9px}
.rule em{display:block;font-style:normal;color:var(--ink2);background:#f6f3ec;border-left:4px solid var(--tape);padding:3px 8px;margin-top:3px}
.ps .rule em{border-color:var(--blue)} .pc .rule em{border-color:var(--red)}
.formula{font-size:18px;line-height:1.6}
.formula code{font-family:inherit;font-weight:700;background:#f1eee6;padding:1px 6px;border-radius:4px}
.markers{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.markers span{background:#f1eee6;border-radius:14px;padding:3px 10px;font-size:15px}
.subtabs{display:flex;gap:6px}
.subtabs button{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:4px 14px;font-size:15px;font-weight:600;color:var(--ink)}
.subtabs button.on{background:var(--ink);color:#fff}
/* alibi */
.alibi{background:#fff;border:3px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;padding:0;text-align:left;color:var(--ink)}
.alibi img{width:100%;flex:1;min-height:0;object-fit:cover;display:block}
.alibi .nm{padding:6px 10px;font-size:18px;font-weight:700}
.alibi .ans{padding:0 10px 8px;font-size:16px;color:var(--green);font-weight:600;min-height:22px}
.starters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.starter{background:#fff8dd;border:1px dashed #b8902a;border-radius:6px;padding:5px 10px;font-size:16px;color:var(--ink)}
.say{background:#fff;border-radius:8px;border:2px solid var(--line);padding:6px 12px;font-size:19px;min-height:40px;flex:1}
/* schedule */
.sched{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;flex:1;min-height:0}
.sched.ans .slot{font-size:clamp(15px,2.3vh,19px);line-height:1.25;padding:3px 10px}
.slot{background:#fff;border:2px solid var(--line);border-radius:8px;padding:6px 10px;font-size:clamp(17px,2.8vh,22px);text-align:left;color:var(--ink);display:flex;flex-direction:column;justify-content:center}
.slot .t{font-size:14px;font-weight:700;color:var(--muted)}
.slot.miss{background:#fff8dd;border-style:dashed;border-color:#b8902a}
.slot.shown{background:#e3f4ea;border-color:var(--green);border-style:solid}
/* typed */
.tin{font:inherit;font-size:21px;font-weight:600;color:var(--blue);border:0;border-bottom:3px solid var(--ink);background:#fff8dd;padding:2px 8px;width:250px;border-radius:4px 4px 0 0}
.tin.right{background:#e3f4ea;border-color:var(--green);color:#0f5a30}
.tin.wrong{background:#fbe5e3;border-color:var(--red);color:#8f1f17}
.sentence{font-size:25px;line-height:2;background:#fff;border-radius:12px;padding:16px 20px}
.lives span{display:inline-block;width:18px;height:18px;border-radius:50%;background:var(--red);margin-left:4px}
.lives span.lost{background:#ddd}
.bet{display:flex;gap:8px;align-items:center;font-size:17px}
.bet button{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:5px 12px;font-weight:600;color:var(--ink)}
.bet button.on{background:var(--tape)}
.gapnow{background:var(--tape);padding:0 8px;border-radius:4px;font-weight:700}
.links{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;flex:1;min-height:0}
.lcard{background:#fff;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--line)}
.lcard img{width:100%;height:55%;object-fit:cover;display:block}
.lcard .lt{padding:12px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.lcard h3{margin:0;font-family:Georgia,serif;font-size:23px}
.lcard p{margin:0;font-size:17px;line-height:1.4;color:var(--ink2)}
.lcard a{margin-top:auto;align-self:flex-start;text-decoration:none}
.qa{background:#fff;border-radius:8px;padding:8px 12px;font-size:17px;line-height:1.4;border:1px solid var(--line)}
.qa .a{color:var(--green);font-weight:600;margin-top:4px}
</style>
</head>

 {s:'The detective {receive|received} an anonymous call that {help|helped} solve the case.', why:'Two finished actions in the past, one after another: past simple.'},
 {s:'The detective {question|was questioning} the witness when suddenly the lights {go|went} out.', why:'An action in progress (was questioning) is interrupted by a sudden short action (went out).'},
 {s:'Detective Johnson {walk|was walking} down the dark alley when she {hear|heard} a loud noise coming from behind the corner.', why:'Longer action in progress + when + short action in past simple.'},
 {s:'The security cameras {record|were recording;recorded} the suspect’s every move during the burglary.', why:'The recording was in progress during the whole burglary, so past continuous is best (past simple is also possible).'}
];

// choose game: {a/b*} * = correct
const CHOOSE = [
 {s:'The detective {questioned/was questioning*} the suspect while he {sweated/was sweating*} nervously under the bright lights.', why:'While: two long actions in progress at the same time.'},
 {s:'The thief {stole*/was stealing} a sculpture from the museum.', why:'A single finished action: past simple.'},
 {s:'The detective {received*/was receiving} a cryptic message that {led*/was leading} her to an old house.', why:'Two finished actions in sequence: past simple.'},
 {s:'The witness {saw*/was seeing} the suspect running away from the crime scene while she {walked/was walking*} her dog.', why:'Short action (saw) during a longer one (was walking). We don’t usually say “was seeing”.'},
 {s:'While James {shoplifted/was shoplifting*} a wallet from the store, Sarah {kept/was keeping*} a lookout at the door.', why:'While: two actions in progress at the same time.'},
 {s:'While Emma {walked/was walking*} home alone, she was suddenly mugged by someone.', why:'A longer action interrupted by a sudden event.'},
 {s:'She {reported*/was reporting} the crime to the police yesterday.', why:'Finished action at a specific time (yesterday): past simple.'},
 {s:'The police officer {arrived*/was arriving} at the crime scene, {secured*/was securing} the area, and {called*/was calling} for backup.', why:'A chain of actions in chronological order: past simple.'},
 {s:'The witness {described/was describing*} the criminal to the police while the sketch artist {drew/was drawing*} the suspect’s face.', why:'While: two actions in progress at the same time.'},
 {s:'The police {searched/were searching*} for clues the whole night.', why:'An action in progress over a long period (the whole night).'}
];

/* generic quiz engine */
function quiz(el, cfg){
  // cfg: items[], tag, title, render(item, box) -> returns {question html, options[], correct, img, explain}
  let order = shuffle(cfg.items.map((_,i)=>i)), qi=0, score=0, streak=0, mistakes=[];
  function draw(){
    if(qi>=order.length) return finish();
    const it = cfg.make(cfg.items[order[qi]]);
    el.innerHTML = header(cfg.tag, cfg.title, `<span class="pill">${qi+1} / ${order.length}</span><span class="pill">Score: ${score}</span>${streak>1?`<span class="pill">Streak ×${streak}</span>`:''}`)
      + `<div class="bar" style="margin-bottom:12px"><i style="width:${qi/order.length*100}%"></i></div>
         <div class="qwrap">${it.img?`<div class="qimg"><img src="${it.img}" alt=""></div>`:''}
         <div class="qbody"><div class="question">${it.q}</div>${it.extra||''}<div class="opts"></div><div class="fb"></div></div></div>`;
    const box=$('.opts',el);
    if(it.oneCol) box.style.gridTemplateColumns='1fr';
    it.options.forEach(o=>{const b=h(`<button class="opt"></button>`); b.textContent=o; b.onclick=()=>answer(b,o,it); box.appendChild(b);});
  }
  function answer(btn,o,it){
    const ok = o===it.correct;
    el.querySelectorAll('.opt').forEach(b=>{b.disabled=true; if(b.textContent===it.correct) b.classList.add('right');});
    if(!ok){ btn.classList.add('wrong'); streak=0; mistakes.push({q:it.plain||it.q, your:o, right:it.correct}); }
    else { streak++; score += 100 + (streak>1? (streak-1)*20 : 0); }
    if(it.after) it.after(ok);
    const last = qi===order.length-1;
    const fb=h(`<div class="row"><div class="feedback ${ok?'ok':'bad'}" style="flex:1">${ok?'<b>Correct!</b> ':'<b>Not quite.</b> The answer is <b>'+it.correct+'</b>. '}${it.explain||''}</div><button class="btn go">${last?'See result':'Next question ›'}</button></div>`);
    $('.fb',el).appendChild(fb);
    $('button',fb).onclick=()=>{qi++; draw();};
    $('.task .right',el).innerHTML=`<span class="pill">${qi+1} / ${order.length}</span><span class="pill">Score: ${score}</span>`;
  }
  function finish(){
    el.innerHTML = header(cfg.tag, cfg.title) + `<div class="result"><div class="score"><div>Your score</div><b>${score}</b><div>${order.length-mistakes.length} of ${order.length} correct</div><button class="btn alt" style="margin-top:auto">Play again</button></div><div class="review"></div></div>`;
    const r=$('.review',el);
    r.innerHTML = mistakes.length ? '<b>Check your mistakes:</b>' + mistakes.map(m=>`<div class="it">${m.q}<br><span class="x">✕ ${m.your}</span> &nbsp; <span class="v">✓ ${m.right}</span></div>`).join('') : '<b>No mistakes. Excellent work!</b>';
    if(cfg.summary) r.insertAdjacentHTML('beforeend', cfg.summary());
    $('.score button',el).onclick=()=>{order=shuffle(order);qi=0;score=0;streak=0;mistakes=[];draw();};
  }
  draw();
}

      }).join('');

/* gap-fill engine */
function gapFill(container, bankWords, bankEl, onDone){
  let sel=null;
  const gaps=[...container.querySelectorAll('.gap')];
  function pick(g){ sel=g; gaps.forEach(x=>x.classList.toggle('sel',x===sel)); }
  gaps.forEach(g=>g.onclick=()=>{ if(g.dataset.v){ g.dataset.v=''; g.textContent='      '; syncBank(); } pick(g); });
  shuffle(bankWords).forEach(w=>{const c=h(`<button class="chip"></button>`); c.textContent=w; c.onclick=()=>{
      if(c.classList.contains('used')) return;
      const target = sel && !sel.dataset.v ? sel : gaps.find(g=>!g.dataset.v); if(!target) return;
      target.dataset.v=w; target.textContent=w; target.classList.remove('right','wrong'); syncBank();
      const nx=gaps.find(g=>!g.dataset.v); pick(nx||null);
    }; bankEl.appendChild(c);});
  function syncBank(){ const used=gaps.map(g=>g.dataset.v).filter(Boolean); [...bankEl.querySelectorAll('.chip')].forEach(c=>{const n=used.filter(u=>u===c.textContent).length; c.classList.toggle('used',n>0);}); }
  gaps.forEach(g=>{g.textContent='      ';});
  pick(gaps[0]);
  return {
    check(){ let ok=0; gaps.forEach(g=>{ g.classList.remove('right','wrong'); if(!g.dataset.v) return; const r=g.dataset.v===g.dataset.a; g.classList.add(r?'right':'wrong'); if(r) ok++; }); return ok; },
    show(){ gaps.forEach(g=>{g.dataset.v=g.dataset.a; g.textContent=g.dataset.a; g.classList.remove('wrong'); g.classList.add('right');}); syncBank(); },
    total:gaps.length
  };
}
const withGaps = s => s.replace(/\{([^}]+)\}/g,(_,a)=>`<button class="gap" data-a="${a}"></button>`);

          <b>?</b> <code>Was / Were</code> + subject + <code>V-ing</code> — <b>Was</b> the detective <b>investigating</b> the crime?</div>
          <p class="rule" style="margin-top:10px"><b>Time words:</b></p>
          <div class="markers"><span>while</span><span>when</span><span>all day</span><span>all evening</span><span>for hours</span><span>at that time</span><span>yesterday at 3 am</span></div></div></div>
        <div class="feedback" style="margin-top:10px">Your turn: make your own examples in both tenses about a crime or a detective.</div>`);
    }
  }
  draw();
}

/* 9. Alibi */
function stepAlibi(el){
  el.innerHTML = header('What is their alibi?','Detective Freedman is investigating a crime. What were the suspects doing at the time? Use the past continuous.', `<button class="btn small alt" id="all">Show all answers</button>`)
   + `<div class="grid" style="grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr"></div>
      <div class="starters" style="margin-top:10px"><span class="note">Click to start:</span>
        <button class="starter">At the time of the crime, … was …</button><button class="starter">… couldn't do it because … was …</button><button class="starter">I think …'s alibi is (not) solid because …</button><button class="starter">Whose alibi looks solid?</button></div>
      <div class="row" style="margin-top:8px"><div class="say" contenteditable="true" spellcheck="false"></div><button class="btn small alt" id="clr">Clear</button></div>`;
  const g=$('.grid',el);
  ALIBI.forEach(a=>{const c=h(`<button class="alibi"><img src="${a.img}" alt=""><div class="nm">${a.n}</div><div class="ans"></div></button>`); c.onclick=()=>{const x=$('.ans',c); x.textContent = x.textContent?'':a.a;}; g.appendChild(c);});
  $('#all',el).onclick=()=>g.querySelectorAll('.alibi').forEach((c,i)=>$('.ans',c).textContent=ALIBI[i].a);
  el.querySelectorAll('.starter').forEach(s=>s.onclick=()=>{$('.say',el).textContent=s.textContent; $('.say',el).focus();});
  $('#clr',el).onclick=()=>$('.say',el).textContent='';
}

/* 10. Day off */
function stepDay(el){
  let card=1; const shown=new Set();
  function draw(){
    el.innerHTML = header('Detective Freedman’s day off','Work in pairs. Ask about the missing activities. Use the past simple or past continuous.',
      `<div class="subtabs"><button data-c="1" class="${card===1?'on':''}">Card 1</button><button data-c="2" class="${card===2?'on':''}">Card 2</button><button data-c="0" class="${card===0?'on':''}">Answers</button></div>`)
      + `<div class="starters" style="margin-bottom:8px"><span class="note">Ask:</span><span class="starter">What was she doing from … to …?</span><span class="starter">What did she do at …?</span><span class="note">Click a yellow slot to check.</span></div>
         <div class="sched ${card===0||shown.size?'ans':''}"></div>`;
    el.querySelectorAll('.subtabs button').forEach(b=>b.onclick=()=>{card=+b.dataset.c; shown.clear(); draw();});
    const s=$('.sched',el);
    DAY.forEach((d,i)=>{
      const has = card===0 || d[2]===0 || d[2]===card;
      const b=h(`<button class="slot ${has?'':'miss'} ${shown.has(i)?'shown':''}"><span class="t">${d[0]}</span><span>${card===0||shown.has(i)?d[3]:(has?d[1]:'?')}</span></button>`);
      if(!has) b.onclick=()=>{shown.has(i)?shown.delete(i):shown.add(i); draw();};
      s.appendChild(b);
    });
  }
  draw();
}

/* 11. Typed practice */
function stepTyped(el){
  let order=shuffle(TYPED.map((_,i)=>i)), qi=0, score=0, mistakes=[];
  function draw(){
    if(qi>=order.length) return finish();
    const it=TYPED[order[qi]]; const n=it.s.match(/\{/g).length;
    let k=0;
    const html=it.s.replace(/\{([^|]+)\|([^}]+)\}/g,(_,base,ans)=>`<input class="tin" data-a="${ans}" placeholder="(${base})" autocomplete="off" spellcheck="false" data-i="${k++}"> <span class="note">(${base})</span>`);
    el.innerHTML = header("Let's practise",'Type the verb in the past simple or past continuous. Press Enter to check.', `<span class="pill">${qi+1} / ${order.length}</span><span class="pill">Score: ${score}</span>`)
      + `<div class="bar" style="margin-bottom:14px"><i style="width:${qi/order.length*100}%"></i></div>
         <div class="sentence">${html}</div>
         <div class="row" style="margin-top:14px" id="act"><button class="btn go" id="chk">Check</button></div><div id="fb" style="margin-top:12px"></div>`;
    const ins=[...el.querySelectorAll('.tin')]; ins[0].focus();
    ins.forEach((x,i)=>x.onkeydown=e=>{ if(e.key==='Enter'){ if(i<ins.length-1 && !ins[i+1].value) ins[i+1].focus(); else check(); } });
    $('#chk',el).onclick=check;
    let done=false;
    function check(){
      if(done){ qi++; draw(); return; }
      done=true; let all=true;
      ins.forEach(x=>{const acc=x.dataset.a.split(';'); const ok=acc.some(a=>norm(a)===norm(x.value)); x.classList.add(ok?'right':'wrong'); x.disabled=true; if(!ok){all=false; x.insertAdjacentHTML('afterend',` <b style="color:var(--green)">✓ ${acc[0]}</b>`);} });
      if(all) score+=100; else mistakes.push({q:it.s.replace(/\{([^|]+)\|([^;}]+)[^}]*\}/g,'<b>$2</b>'), your:ins.map(x=>x.value||'—').join(' / ')});
      const last=qi===order.length-1;
      $('#fb',el).innerHTML=`<div class="feedback ${all?'ok':'bad'}">${all?'<b>Correct!</b> ':'<b>Not quite.</b> '}${it.why}</div>`;
      $('#chk',el).textContent= last?'See result':'Next question ›';
      $('.task .right',el).innerHTML=`<span class="pill">${qi+1} / ${order.length}</span><span class="pill">Score: ${score}</span>`;
      setTimeout(()=>{const b=$('#chk',el); b&&b.focus();},0);
    }
  }
  function finish(){
    el.innerHTML = header("Let's practise",'Past simple or past continuous') + `<div class="result"><div class="score"><div>Your score</div><b>${score}</b><div>${order.length-mistakes.length} of ${order.length} sentences correct</div><button class="btn alt" style="margin-top:auto">Play again</button></div><div class="review">${mistakes.length?'<b>Check your mistakes:</b>'+mistakes.map(m=>`<div class="it">${m.q}<br><span class="x">✕ you wrote: ${m.your}</span></div>`).join(''):'<b>No mistakes. Excellent work!</b>'}</div></div>`;
    $('.score button',el).onclick=()=>{order=shuffle(order);qi=0;score=0;mistakes=[];draw();};
  }
  draw();
}

/* 12. Choose game with lives and bets */
function stepChoose(el){
  // flatten into gap-questions
  let qs=[];
  CHOOSE.forEach((c,si)=>{ const parts=[...c.s.matchAll(/\{([^}]+)\}/g)]; parts.forEach((m,gi)=>qs.push({si,gi})); });
  let qi=0, score=0, lives=3, bet=1, mistakes=[], filled={};
  function sentenceHTML(si,gi){
    let k=0;
    return CHOOSE[si].s.replace(/\{([^}]+)\}/g,(_,opts)=>{ const i=k++; const right=opts.split('/').find(o=>o.endsWith('*')).replace('*','');
      if(i<gi) return `<b style="color:var(--green)">${filled[si+'_'+i]||right}</b>`;
      if(i===gi) return `<span class="gapnow">?</span>`;
      return '<span class="note">_____</span>'; });
  }
  function draw(){
    if(qi>=qs.length || lives<=0) return finish();
    const {si,gi}=qs[qi]; const opts=[...CHOOSE[si].s.matchAll(/\{([^}]+)\}/g)][gi][1].split('/');
    const right=opts.find(o=>o.endsWith('*')).replace('*','');
    el.innerHTML = header('Case game','Choose the correct verb form. Bet double if you are sure!',
      `<span class="pill">Sentence ${si+1} / ${CHOOSE.length}</span><span class="pill">Score: ${score}</span><span class="pill lives">Lives${[0,1,2].map(i=>`<span class="${i<lives?'':'lost'}"></span>`).join('')}</span>`)
     + `<div class="bar" style="margin-bottom:12px"><i style="width:${qi/qs.length*100}%"></i></div>
        <div class="sentence" style="font-size:29px;padding:22px 26px">${sentenceHTML(si,gi)}</div>
        <div class="bet" style="margin:16px 0"><span>How sure are you?</span><button data-b="1" class="${bet===1?'on':''}">Not sure: 100 points</button><button data-b="2" class="${bet===2?'on':''}">Sure: 200 points, but a wrong answer costs a life and 100 points</button></div>
        <div class="opts"></div><div class="fb" style="margin-top:12px"></div>`;
    el.querySelectorAll('.bet button').forEach(b=>b.onclick=()=>{bet=+b.dataset.b; el.querySelectorAll('.bet button').forEach(x=>x.classList.toggle('on',x===b));});
    const box=$('.opts',el);
    opts.map(o=>o.replace('*','')).forEach(o=>{const b=h(`<button class="opt" style="font-size:25px;text-align:center;padding:20px 14px"></button>`); b.textContent=o; b.onclick=()=>answer(b,o,right,si,gi); box.appendChild(b);});
  }
  function answer(btn,o,right,si,gi){
    const ok=o===right;
    el.querySelectorAll('.opt').forEach(b=>{b.disabled=true; if(b.textContent===right) b.classList.add('right');});
    el.querySelectorAll('.bet button').forEach(b=>b.disabled=true);
    if(ok){ score+=100*bet; }
    else { btn.classList.add('wrong'); lives-=1; if(bet===2) score=Math.max(0,score-100); mistakes.push({q:CHOOSE[si].s.replace(/\{([^}]+)\}/g,(_,x)=>'<b>'+x.split('/').find(z=>z.endsWith('*')).replace('*','')+'</b>'), your:o, right}); }
    filled[si+'_'+gi]=right;
    const last = qi===qs.length-1 || lives<=0;
    const fb=h(`<div class="row"><div class="feedback ${ok?'ok':'bad'}" style="flex:1">${ok?'<b>Correct!</b> ':'<b>Not quite.</b> The answer is <b>'+right+'</b>. '}${CHOOSE[si].why}</div><button class="btn go">${last?'See result':'Next question ›'}</button></div>`);
    $('.fb',el).appendChild(fb); $('button',fb).onclick=()=>{qi++; bet=1; draw();};
    $('.task .right',el).innerHTML=`<span class="pill">Sentence ${si+1} / ${CHOOSE.length}</span><span class="pill">Score: ${score}</span><span class="pill lives">Lives${[0,1,2].map(i=>`<span class="${i<lives?'':'lost'}"></span>`).join('')}</span>`;
  }
  function finish(){
    const solved = lives>0;
    el.innerHTML = header('Case game', solved?'Case closed!':'Out of lives. The suspect got away this time.') + `<div class="result"><div class="score"><div>Your score</div><b>${score}</b><div>${solved?'You solved all 10 sentences.':'You reached sentence '+(qs[Math.min(qi,qs.length-1)].si+1)+' of 10.'}</div><div>Lives left: ${lives}</div><button class="btn alt" style="margin-top:auto">Play again</button></div><div class="review">${mistakes.length?'<b>Check your mistakes:</b>'+mistakes.map(m=>`<div class="it">${m.q}<br><span class="x">✕ ${m.your}</span> &nbsp; <span class="v">✓ ${m.right}</span></div>`).join(''):'<b>No mistakes. Excellent work!</b>'}</div></div>`;
    $('.score button',el).onclick=()=>{qi=0;score=0;lives=3;bet=1;mistakes=[];filled={};draw();};
  }
  draw();
}
