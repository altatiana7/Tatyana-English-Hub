*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eefdfa,#fff8e8 55%,#f1edff);color:#17323f;min-height:100vh}.wrap{width:min(1120px,calc(100% - 28px));margin:28px auto}.hero{background:linear-gradient(120deg,#17323f,#2f6bff 62%,#7657ff);color:#fff;padding:26px 28px;border-radius:26px}.hero small{font-weight:950;letter-spacing:.14em;color:#b9f4ef}.hero h1{font-size:clamp(30px,5vw,48px);margin:7px 0}.card{margin-top:16px;background:#fff;border:1px solid #dfe9ea;border-radius:22px;padding:20px;box-shadow:0 14px 35px #243e4315}textarea{width:100%;min-height:110px;border:2px solid #dce6e8;border-radius:13px;padding:12px;font:14px ui-monospace,Consolas,monospace}.btn{border:0;border-radius:13px;padding:12px 16px;background:#17323f;color:#fff;font-weight:950;cursor:pointer;margin-top:10px}.status{font-weight:900;margin-top:10px}.bad{color:#d84e65}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.stat{background:#f5faf9;border:1px solid #e1edeb;border-radius:17px;padding:16px}.stat b{font-size:28px}.stat span{display:block;color:#6d7d85;font-size:12px;font-weight:850}.rows{display:grid;gap:7px}.row{display:grid;grid-template-columns:56px 1.7fr 1fr 1fr 80px;gap:8px;align-items:center;border:1px solid #e3ebed;border-radius:13px;padding:9px 10px}.row.ok{background:#f4fff9;border-color:#cce8db}.row.no{background:#fff5f7;border-color:#f0c4cd}.head{background:#f3f7f7;font-size:12px;font-weight:950;text-transform:uppercase;color:#687a82}.ans{font-family:ui-monospace,Consolas,monospace;font-weight:900}.res{font-weight:1000}.good{color:#22835e}.wrong{color:#d84e65}.hidden{display:none}.note{color:#6d7d85;font-size:13px}.back{color:#17323f;font-weight:900;text-decoration:none;display:inline-block;margin-bottom:10px}@media(max-width:760px){.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:42px 1fr 1fr}.row .q{grid-column:1/-1}.row .res{grid-column:3}.head{display:none}}</style></head><body><main class="wrap"><a class="back" href="teacher-check.html">← Teacher checker</a><section class="hero"><small>TEACHER ONLY · GABI</small><h1>Lesson 5 checker</h1><p>Family · Life Stages · Decisions</p></section><section class="card"><label><b>Paste Gabi’s Lesson 5 homework code</b></label><textarea id="code" placeholder="Paste code here"></textarea><button class="btn" id="check">Check homework</button><div id="status" class="status"></div><p class="note">Checks all 36 answers and shows every mistake.</p></section><section class="card hidden" id="result"><div id="meta"></div><div class="summary" id="summary"></div><div class="rows" id="rows"></div></section></main><script>
const tasks=[{"title":"Family Challenge","instruction":"Read the family situation and choose the correct answer.","items":[{"q":"Your mum’s brother has a son. Who is he to you?","opts":["cousin","nephew","brother-in-law"],"a":"cousin"},{"q":"Your sister has a baby boy. Who is the baby to you?","opts":["nephew","cousin","half-brother"],"a":"nephew"},{"q":"Your dad gets married again. His new wife is your ___.","opts":["stepmother","mother-in-law","sister-in-law"],"a":"stepmother"},{"q":"You and Alex have the same dad but different mums. Alex is your ___.","opts":["half-brother","stepbrother","brother-in-law"],"a":"half-brother"},{"q":"Your brother gets married. His wife is your ___.","opts":["sister-in-law","niece","stepmother"],"a":"sister-in-law"},{"q":"Your sister gets married. Her husband is your ___.","opts":["brother-in-law","nephew","stepfather"],"a":"brother-in-law"},{"q":"Your brother has a daughter. She is your ___.","opts":["niece","cousin","half-sister"],"a":"niece"},{"q":"A person in your family who lived many generations ago is your ___.","opts":["ancestor","descendant","relative-in-law"],"a":"ancestor"},{"q":"A person born many generations after an ancestor is their ___.","opts":["descendant","ancestor","stepchild"],"a":"descendant"},{"q":"You have the same sense of humour as your dad. You probably ___.","opts":["take after him","look like him","are married to him"],"a":"take after him"},{"q":"People often say your face is very similar to your mum’s. You ___.","opts":["look like her","take after her personality","are related by marriage"],"a":"look like her"},{"q":"You talk to your older sister about almost everything and trust her a lot. You are ___.","opts":["close to her","related to her by law","descended from her"],"a":"close to her"}]},{"title":"Stages of Life","instruction":"Choose the option that fits the life stage.","items":[{"q":"After school, many teenagers decide to ___ before university.","opts":["take a gap year","retire","raise a child"],"a":"take a gap year"},{"q":"When people become adults, they may ___ and start earning money.","opts":["get a job","be born","retire"],"a":"get a job"},{"q":"Some couples ___ before they get married.","opts":["get engaged","get divorced","retire"],"a":"get engaged"},{"q":"When a couple separates legally, they ___.","opts":["get divorced","get engaged","grow up"],"a":"get divorced"},{"q":"Parents usually ___ until he or she becomes independent.","opts":["raise a child","take a gap year","retire"],"a":"raise a child"},{"q":"Some families choose to ___ if they cannot or do not want to have a biological child.","opts":["adopt a child","leave school","retire"],"a":"adopt a child"},{"q":"As children become teenagers and adults, they ___.","opts":["grow up","retire","get engaged"],"a":"grow up"},{"q":"At around 65, many people stop working and ___.","opts":["retire","get a job","start school"],"a":"retire"},{"q":"When you continue studying after school, you may go into ___ education.","opts":["further","farther","future"],"a":"further"},{"q":"At the beginning of life, a baby is ___.","opts":["born","retired","divorced"],"a":"born"},{"q":"A child normally ___ at the age of about five or six.","opts":["starts school","gets married","retires"],"a":"starts school"},{"q":"At some point, many people ___, have children, and build a family.","opts":["get married","leave school","be born"],"a":"get married"}]},{"title":"Decisions in Family Life","instruction":"Choose the most natural expression.","items":[{"q":"After thinking for days, Mia finally ___ to move abroad with her family.","opts":["made a decision","did a decision","made a resolution"],"a":"made a decision"},{"q":"Leo wishes he had not argued with his sister. He ___ his decision to shout at her.","opts":["regrets","intends","struggles"],"a":"regrets"},{"q":"Nina wants to stop wasting time online, so she decides to ___.","opts":["make a resolution","take a decision","have courage"],"a":"make a resolution"},{"q":"Sam is nervous about speaking to his father, but he finally ___.","opts":["has the courage to do it","makes courage to do it","takes courage for it"],"a":"has the courage to do it"},{"q":"I ___ talk to my cousin this weekend and apologise.","opts":["intend to","regret to","struggle to"],"a":"intend to"},{"q":"He often ___ making important decisions quickly.","opts":["struggles with","regrets about","intends with"],"a":"struggles with"},{"q":"Before choosing a school, we need ___ information.","opts":["further","farther","more further"],"a":"further"},{"q":"She was ___ enough to tell her parents the truth.","opts":["brave","courage","bravery"],"a":"brave"},{"q":"I don’t want to ___ not spending more time with my grandparents.","opts":["regret","intend","resolve"],"a":"regret"},{"q":"My cousin plans to study abroad. He ___ apply next year.","opts":["intends to","regrets to","struggles with"],"a":"intends to"},{"q":"It took a lot of ___ to admit he was wrong.","opts":["courage","brave","resolution"],"a":"courage"},{"q":"Sometimes people ___ family expectations when deciding what to do with their lives.","opts":["struggle with","regret to","intend with"],"a":"struggle with"}]}];

function decode(s){s=s.trim().replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))))}
document.getElementById('check').onclick=()=>{const st=document.getElementById('status'),result=document.getElementById('result');result.classList.add('hidden');try{const p=decode(document.getElementById('code').value);if(p.assignment!=='gabi-hw-2026-09-08'||!Array.isArray(p.answers)||p.answers.length!==3)throw new Error('This is not the Lesson 5 homework code.');let total=0;const per=[0,0,0];let html='<div class="row head"><div>#</div><div>Question</div><div>Student</div><div>Correct</div><div>Result</div></div>';tasks.forEach((t,ti)=>{if(!Array.isArray(p.answers[ti])||p.answers[ti].length!==t.items.length)throw new Error('The Lesson 5 code is incomplete.');t.items.forEach((item,qi)=>{const v=p.answers[ti][qi]||'',ok=v===item.a;if(ok){total++;per[ti]++;}html+=`<div class="row ${ok?'ok':'no'}"><div><b>T${ti+1}·${qi+1}</b></div><div class="q">${item.q}</div><div class="ans">${v||'—'}</div><div class="ans">${item.a}</div><div class="res ${ok?'good':'wrong'}">${ok?'✓':'✕'}</div></div>`})});document.getElementById('rows').innerHTML=html;document.getElementById('summary').innerHTML=`<div class="stat"><b>${total}/36</b><span>TOTAL</span></div><div class="stat"><b>${per[0]}/12</b><span>FAMILY</span></div><div class="stat"><b>${per[1]}/12</b><span>LIFE STAGES</span></div><div class="stat"><b>${per[2]}/12</b><span>DECISIONS</span></div>`;const dt=p.submitted?new Date(p.submitted):null;document.getElementById('meta').innerHTML='<b>Module 1 · Lesson 5 · Homework</b>'+(dt&&!isNaN(dt)?'<br><span class="note">Submitted: '+dt.toLocaleString()+'</span>':'');result.classList.remove('hidden');st.textContent='Submission opened ✓';st.className='status'}catch(e){st.textContent=e.message||'Could not open code.';st.className='status bad'}};
</script></body></html>
