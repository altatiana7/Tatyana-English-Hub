<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#20b8b0">
<title>Gabi · Lesson 4 · Family & Life</title>
<style>
:root{--ink:#17324a;--muted:#6b7f90;--teal:#20a89f;--teal2:#67c4b5;--blue:#4255ff;--line:#d9e8ec;--paper:#fff;--bg:#eff8f8;--shadow:0 16px 42px rgba(28,74,92,.13)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#dff5ef 0,transparent 28%),radial-gradient(circle at 95% 12%,#e4efff 0,transparent 26%),linear-gradient(135deg,#f8fcff,#eef9f5)}button{font:inherit}.shell{width:min(1120px,94vw);margin:auto;min-height:100vh;display:grid;grid-template-columns:220px 1fr;gap:24px;align-items:center;padding:22px 0}.side{align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:10px}.back{display:inline-flex;align-items:center;gap:7px;text-decoration:none;color:#315369;font-weight:900;font-size:13px;margin-bottom:12px}.brand{padding:16px 4px 14px}.brand small{display:block;color:var(--teal);font-weight:900;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}.brand h1{margin:0;font-size:27px;line-height:1.04}.brand p{margin:7px 0 0;color:var(--muted);font-size:13px;line-height:1.4}.cat{border:1px solid var(--line);background:rgba(255,255,255,.82);color:var(--ink);border-radius:14px;padding:13px 14px;text-align:left;font-weight:900;cursor:pointer;transition:.18s}.cat:hover{transform:translateY(-1px)}.cat.on{background:linear-gradient(135deg,var(--teal),var(--teal2));color:#fff;border-color:transparent;box-shadow:0 10px 24px rgba(32,168,159,.18)}.note{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.45}.main{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:13px}.header{width:min(650px,100%);display:flex;justify-content:space-between;gap:12px;align-items:flex-end}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;color:var(--teal)}.header h2{margin:3px 0 0;font-size:25px}.counter{font-size:13px;font-weight:900;color:var(--muted)}.wrap{width:min(650px,100%);height:350px;perspective:1200px}.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.2,.7,.2,1);cursor:pointer}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:25px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px}.backface{transform:rotateY(180deg);background:linear-gradient(160deg,#fff,#f2fbf8)}.word{font-size:clamp(38px,5vw,58px);font-weight:950;letter-spacing:-1.3px}.translation{font-size:clamp(27px,3vw,38px);font-weight:950}.age{display:none;margin:12px 0 4px;padding:7px 12px;border-radius:999px;background:#e3f5f1;color:#197a72;font-size:13px;font-weight:950}.example{margin-top:17px;max-width:88%;font-size:18px;line-height:1.42;color:#486276}.hint{position:absolute;bottom:18px;color:#8ca0ad;font-size:12px}.speak{position:absolute;right:17px;top:17px;width:45px;height:45px;border:0;border-radius:50%;background:#edf7fa;color:#246e7a;font-weight:950;cursor:pointer}.controls{width:min(650px,100%);display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:9px}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:13px;padding:12px 14px;font-weight:950;cursor:pointer;box-shadow:0 6px 18px rgba(30,75,92,.06)}.btn.primary{border-color:transparent;background:linear-gradient(135deg,var(--blue),#6576ff);color:#fff}.bottom{width:min(650px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px}.shuffle{border:0;background:transparent;color:#397083;font-weight:950;cursor:pointer;padding:6px 2px}.progress{height:6px;flex:1;background:#deeaee;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:var(--teal);width:0;transition:.2s}@media(max-width:760px){.shell{grid-template-columns:1fr;align-items:start;padding:14px 0 24px}.side{align-self:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.brand,.back,.note{grid-column:1/-1}.brand{padding-bottom:2px}.cat{text-align:center;font-size:12px;padding:10px 7px}.wrap{height:310px}.header h2{font-size:21px}.example{font-size:16px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side">
<a class="back" href="./">← Homework Hub</a>
<div class="brand"><small>Lesson 4 · 4 September</small><h1>Family & Life</h1><p>Study the cards. Say the meaning before you flip.</p></div>
<button class="cat on" data-cat="family">Family & Relatives</button>
<button class="cat" data-cat="stages">Stages of Life + Age</button>
<button class="cat" data-cat="events">Life Events</button>
<div class="note">Front: English + audio. Back: Russian meaning, age when needed, and a short example.</div>
</aside>
<main class="main">
<div class="header"><div><div class="eyebrow">Quizlet-style cards</div><h2 id="title"></h2></div><div class="counter" id="counter"></div></div>
<div class="wrap"><div class="card" id="card">
<div class="face"><button class="speak" id="speak1" aria-label="Listen">▶</button><div class="word" id="word"></div><div class="hint">Click the card to flip</div></div>
<div class="face backface"><button class="speak" id="speak2" aria-label="Listen">▶</button><div class="translation" id="translation"></div><div class="age" id="age"></div><div class="example" id="example"></div><div class="hint">Click again to see the English</div></div>
</div></div>
<div class="controls"><button class="btn" id="prev">← Back</button><button class="btn primary" id="flip">Flip</button><button class="btn" id="next">Next →</button></div>
<div class="bottom"><button class="shuffle" id="shuffle">Shuffle cards</button><div class="progress"><i id="bar"></i></div></div>
</main>
</div>
<script>
const decks={
family:{title:'Family & Relatives',cards:[
{w:'siblings',t:'братья и сёстры',e:'I have two siblings.'},
{w:'only child',t:'единственный ребёнок',e:'He is an only child.'},
{w:'cousin',t:'двоюродный брат / сестра',e:'My cousin lives in another city.'},
{w:'niece',t:'племянница',e:'My niece is five years old.'},
{w:'nephew',t:'племянник',e:'Her nephew loves football.'},
{w:'stepbrother',t:'сводный брат',e:'My stepbrother is older than me.'},
{w:'stepsister',t:'сводная сестра',e:'His stepsister goes to the same school.'},
{w:'relative',t:'родственник',e:'We have relatives in another city.'},
{w:'close relative',t:'близкий родственник',e:'A grandparent is a close relative.'},
{w:'distant relative',t:'дальний родственник',e:'I met a distant relative at a family celebration.'},
{w:'twins',t:'близнецы',e:'The twins look similar, but their personalities are different.'}
]},
stages:{title:'Stages of Life + Age',cards:[
{w:'baby',t:'младенец',age:'0–1',e:'A baby needs a lot of care.'},
{w:'toddler',t:'малыш',age:'1–3',e:'The toddler is learning to walk.'},
{w:'child',t:'ребёнок',age:'4–12',e:'A child usually starts school at about six or seven.'},
{w:'teenager',t:'подросток',age:'13–19',e:'A teenager often becomes more independent.'},
{w:'young adult',t:'молодой взрослый',age:'18–25',e:'Many young adults study or start their first job.'},
{w:'adult',t:'взрослый',age:'about 25–40',e:'An adult usually has more responsibilities.'},
{w:'middle-aged',t:'среднего возраста',age:'about 40–60',e:'A middle-aged person may have teenage or adult children.'},
{w:'elderly / older person',t:'пожилой человек',age:'60+',e:'Older people often have a lot of life experience.'},
{w:'retired',t:'на пенсии',age:'usually 60–65+',e:'My grandfather is retired and enjoys travelling.'}
]},
events:{title:'Life Events',cards:[
{w:'be born',t:'родиться',e:'I was born in September.'},
{w:'start school',t:'пойти в школу',e:'Most children start school at six or seven.'},
{w:'become a teenager',t:'стать подростком',e:'You become a teenager when you turn thirteen.'},
{w:'leave school',t:'закончить школу',e:'Many students leave school at seventeen or eighteen.'},
{w:'go to university',t:'поступить / пойти в университет',e:'She wants to go to university after school.'},
{w:'get a job',t:'устроиться на работу',e:'He got a summer job at sixteen.'},
{w:'move out',t:'съехать от родителей',e:'Some young adults move out when they start university.'},
{w:'get married',t:'жениться / выйти замуж',e:'They got married after university.'},
{w:'have children',t:'завести детей',e:'Some adults decide to have children later in life.'},
{w:'start a family',t:'создать семью',e:'They want to start a family in the future.'},
{w:'retire',t:'выйти на пенсию',e:'Many people retire in their sixties.'}
]}};
let cat='family',i=0,cards=[...decks.family.cards];
const $=id=>document.getElementById(id),card=$('card');
function render(){const c=cards[i];card.classList.remove('flip');$('title').textContent=decks[cat].title;$('counter').textContent=(i+1)+' / '+cards.length;$('word').textContent=c.w;$('translation').textContent=c.t;$('example').textContent=c.e;if(c.age){$('age').style.display='inline-block';$('age').textContent='AGE · '+c.age}else{$('age').style.display='none'}$('bar').style.width=((i+1)/cards.length*100)+'%'}
function flip(){card.classList.toggle('flip')}function next(){i=(i+1)%cards.length;render()}function prev(){i=(i-1+cards.length)%cards.length;render()}function speak(){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cards[i].w);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}
function shuffle(){for(let n=cards.length-1;n>0;n--){const j=Math.floor(Math.random()*(n+1));[cards[n],cards[j]]=[cards[j],cards[n]]}i=0;render()}
document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;cards=[...decks[cat].cards];i=0;render()});$('flip').onclick=flip;$('next').onclick=next;$('prev').onclick=prev;$('shuffle').onclick=shuffle;card.onclick=e=>{if(!e.target.classList.contains('speak'))flip()};$('speak1').onclick=e=>{e.stopPropagation();speak()};$('speak2').onclick=e=>{e.stopPropagation();speak()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key===' '){e.preventDefault();flip()}});render();
</script>
</body></html>
