<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gabi · Family & Life</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;color:#17324a;background:linear-gradient(135deg,#eff8f8,#f7fbff)}button{font:inherit}.shell{width:min(1080px,94vw);margin:auto;min-height:100vh;display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:center}.side{display:flex;flex-direction:column;gap:9px}.back{text-decoration:none;color:#315369;font-weight:900;font-size:13px;margin-bottom:8px}.brand small{color:#20a89f;font-weight:900}.brand h1{font-size:28px;margin:4px 0}.brand p{font-size:13px;color:#6b7f90;margin:0 0 8px}.cat{border:1px solid #d9e8ec;background:#fff;border-radius:13px;padding:12px;text-align:left;font-weight:900;cursor:pointer}.cat.on{background:#20a89f;color:#fff}.main{display:flex;flex-direction:column;align-items:center;gap:12px}.header{width:min(660px,100%);display:flex;justify-content:space-between;align-items:end}.eyebrow{font-size:11px;font-weight:950;letter-spacing:.1em;text-transform:uppercase;color:#20a89f}.header h2{margin:4px 0 0;font-size:26px}.counter{font-size:13px;font-weight:900;color:#6b7f90}.wrap{width:min(660px,100%);height:340px;perspective:1200px}.card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:.45s;cursor:pointer}.card.flip{transform:rotateY(180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;background:#fff;border:1px solid #d9e8ec;box-shadow:0 16px 42px rgba(28,74,92,.13);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:34px}.backface{transform:rotateY(180deg);background:linear-gradient(160deg,#fff,#f2fbf8)}.word{font-size:52px;font-weight:950}.translation{font-size:34px;font-weight:950}.age{display:none;margin:10px 0;padding:7px 12px;border-radius:999px;background:#e3f5f1;color:#197a72;font-size:13px;font-weight:950}.example{margin-top:15px;font-size:18px;color:#486276}.speak{position:absolute;right:16px;top:16px;width:44px;height:44px;border:0;border-radius:50%;background:#edf7fa;font-weight:950;cursor:pointer}.controls{width:min(660px,100%);display:grid;grid-template-columns:1fr 1.25fr 1fr;gap:9px}.btn{border:1px solid #d9e8ec;background:#fff;border-radius:13px;padding:12px;font-weight:950;cursor:pointer}.primary{background:#4255ff;color:#fff}.bottom{width:min(660px,100%);display:flex;gap:10px;align-items:center}.shuffle{border:0;background:transparent;color:#397083;font-weight:950;cursor:pointer}.progress{height:6px;flex:1;background:#deeaee;border-radius:999px;overflow:hidden}.progress i{display:block;height:100%;background:#20a89f;width:0}@media(max-width:760px){.shell{grid-template-columns:1fr;padding:14px 0}.side{display:grid;grid-template-columns:repeat(3,1fr)}.brand,.back{grid-column:1/-1}.wrap{height:300px}.word{font-size:40px}}</style></head><body><div class="shell"><aside class="side"><a class="back" href="./">← Homework Hub</a><div class="brand"><small>Lesson 4 · 4 September</small><h1>Family & Life</h1><p>Say the meaning before you flip.</p></div><button class="cat on" data-cat="family">Family & Relatives</button><button class="cat" data-cat="stages">Stages of Life + Age</button><button class="cat" data-cat="events">Life Events</button></aside><main class="main"><div class="header"><div><div class="eyebrow">Quizlet-style cards</div><h2 id="title"></h2></div><div class="counter" id="counter"></div></div><div class="wrap"><div class="card" id="card"><div class="face"><button class="speak" id="s1">▶</button><div class="word" id="word"></div></div><div class="face backface"><button class="speak" id="s2">▶</button><div class="translation" id="translation"></div><div class="age" id="age"></div><div class="example" id="example"></div></div></div></div><div class="controls"><button class="btn" id="prev">← Back</button><button class="btn primary" id="flip">Flip</button><button class="btn" id="next">Next →</button></div><div class="bottom"><button class="shuffle" id="shuffle">Shuffle cards</button><div class="progress"><i id="bar"></i></div></div></main></div><script>const decks={family:{title:'Family & Relatives',cards:[['siblings','братья и сёстры','I have two siblings.'],['only child','единственный ребёнок','He is an only child.'],['cousin','двоюродный брат / сестра','My cousin lives in another city.'],['niece','племянница','My niece is five years old.'],['nephew','племянник','Her nephew loves football.'],['stepbrother','сводный брат','My stepbrother is older than me.'],['stepsister','сводная сестра','His stepsister goes to the same school.'],['relative','родственник','We have relatives in another city.'],['close relative','близкий родственник','A grandparent is a close relative.'],['distant relative','дальний родственник','I met a distant relative at a family celebration.'],['twins','близнецы','The twins look similar, but their personalities are different.']]},stages:{title:'Stages of Life + Age',cards:[['baby','младенец','A baby needs a lot of care.','0–1'],['toddler','малыш','The toddler is learning to walk.','1–3'],['child','ребёнок','A child usually starts school at about six or seven.','4–12'],['teenager','подросток','A teenager often becomes more independent.','13–19'],['young adult','молодой взрослый','Many young adults study or start their first job.','18–25'],['adult','взрослый','An adult usually has more responsibilities.','25–40'],['middle-aged','среднего возраста','A middle-aged person may have teenage or adult children.','40–60'],['elderly / older person','пожилой человек','Older people often have a lot of life experience.','60+'],['retired','на пенсии','My grandfather is retired and enjoys travelling.','usually 60–65+']]},events:{title:'Life Events',cards:[['be born','родиться','I was born in September.'],['start school','пойти в школу','Most children start school at six or seven.'],['become a teenager','стать подростком','You become a teenager when you turn thirteen.'],['leave school','закончить школу','Many students leave school at seventeen or eighteen.'],['go to university','поступить / пойти в университет','She wants to go to university after school.'],['get a job','устроиться на работу','He got a summer job at sixteen.'],['move out','съехать от родителей','Some young adults move out when they start university.'],['get married','жениться / выйти замуж','They got married after university.'],['have children','завести детей','Some adults decide to have children later in life.'],['start a family','создать семью','They want to start a family in the future.'],['retire','выйти на пенсию','Many people retire in their sixties.']]}};let cat='family',i=0,cards=[...decks.family.cards];const $=x=>document.getElementById(x),card=$('card');function render(){const c=cards[i];card.classList.remove('flip');$('title').textContent=decks[cat].title;$('counter').textContent=(i+1)+' / '+cards.length;$('word').textContent=c[0];$('translation').textContent=c[1];$('example').textContent=c[2];if(c[3]){$('age').style.display='inline-block';$('age').textContent='AGE · '+c[3]}else $('age').style.display='none';$('bar').style.width=((i+1)/cards.length*100)+'%'}function flip(){card.classList.toggle('flip')}function next(){i=(i+1)%cards.length;render()}function prev(){i=(i-1+cards.length)%cards.length;render()}function speak(){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cards[i][0]);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{document.querySelectorAll('.cat').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;cards=[...decks[cat].cards];i=0;render()});$('flip').onclick=flip;$('next').onclick=next;$('prev').onclick=prev;$('shuffle').onclick=()=>{cards.sort(()=>Math.random()-.5);i=0;render()};card.onclick=e=>{if(!e.target.classList.contains('speak'))flip()};$('s1').onclick=e=>{e.stopPropagation();speak()};$('s2').onclick=e=>{e.stopPropagation();speak()};render();</script></body></html>
