<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gabi Homework — Family & Life Stages</title>
<style>
:root{--bg:#f4fbff;--ink:#11253d;--muted:#60758b;--blue:#2f6bff;--teal:#00b8a9;--lime:#b7e532;--yellow:#ffd84d;--orange:#ff9f1c;--purple:#7657ff;--card:#fff;--border:#d7e5f0;--good:#0c9b69;--bad:#d25c38}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:linear-gradient(135deg,#effcff 0%,#f8fff0 45%,#fff9e8 100%)}
.wrap{max-width:1100px;margin:auto;padding:18px} .header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.header h1{margin:0;font-size:clamp(26px,3vw,38px)} .sub{color:var(--muted);font-weight:700;letter-spacing:.05em;font-size:13px}
.nav{display:flex;gap:8px;flex-wrap:wrap} .nav button{border:1px solid var(--border);background:#fff;border-radius:12px;padding:10px 14px;font-weight:800;cursor:pointer}
.nav button.active{background:var(--blue);color:#fff;border-color:var(--blue)} .panel{display:none} .panel.active{display:block}
.cardWrap{display:grid;place-items:center;padding:12px 0} .flashcard{width:min(760px,100%);min-height:390px;border:1px solid var(--border);border-radius:26px;background:#fff;box-shadow:0 16px 42px rgba(45,87,124,.10);padding:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.word{font-size:clamp(36px,5vw,58px);font-weight:900;line-height:1.05} .ipa{font-size:22px;color:var(--purple);margin-top:14px;font-weight:700}
.backText{font-size:clamp(26px,3vw,40px);font-weight:850} .example{font-size:20px;margin-top:18px;color:var(--muted)}
.cardControls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px} .cardControls button{min-height:46px;border:none;border-radius:13px;padding:0 18px;font-weight:850;cursor:pointer}
.prev{background:#e8f1ff;color:#204aa8} .speak{background:var(--yellow)} .flip{background:var(--teal);color:#fff} .next{background:var(--orange);color:#fff}
.counter{text-align:center;color:var(--muted);font-weight:700;margin-top:10px}
.taskHead{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:12px} .taskHead h2{margin:0}
.score{background:#fff;border:1px solid var(--border);border-radius:999px;padding:8px 13px;font-weight:800}
.taskCard{background:#fff;border:1px solid var(--border);border-radius:22px;padding:22px;min-height:360px;box-shadow:0 14px 36px rgba(45,87,124,.08)}
.qnum{font-size:13px;font-weight:900;color:var(--muted);letter-spacing:.06em;text-transform:uppercase} .question{font-size:clamp(22px,3vw,32px);font-weight:900;line-height:1.25;margin:12px 0 18px}
.answers{display:grid;gap:10px} .answer{border:2px solid var(--border);background:#fff;border-radius:14px;padding:14px 15px;text-align:left;font-size:18px;font-weight:750;cursor:pointer}
.answer.correct{background:#e9fff6;border-color:var(--good);color:#08764f} .answer.wrong{background:#fff0ea;border-color:var(--bad);color:#9a4129} .feedback{min-height:28px;margin-top:12px;font-weight:850}
.taskControls{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px} .taskControls button{min-height:44px;border-radius:12px;border:1px solid var(--border);padding:0 16px;font-weight:800;cursor:pointer;background:#fff} .taskControls .primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.progress{height:10px;background:#e7eef4;border-radius:99px;overflow:hidden;margin-top:14px} .bar{height:100%;background:linear-gradient(90deg,var(--teal),var(--lime),var(--yellow),var(--orange),var(--purple));width:0}
.reportBox{background:#fff;border:1px solid var(--border);border-radius:22px;padding:22px;box-shadow:0 14px 36px rgba(45,87,124,.08)}
.reportGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.reportScore{border-radius:16px;padding:16px;font-weight:850;text-align:center}
.reportScore:nth-child(1){background:#dcfffb}.reportScore:nth-child(2){background:#fff0d7}.reportScore:nth-child(3){background:#eee9ff}
.mistakes{display:grid;gap:10px;margin-top:14px}.mistake{border:1px solid var(--border);border-radius:13px;padding:12px;background:#fafcfe}
.copyBtn{margin-top:14px;min-height:46px;border:0;border-radius:13px;padding:0 18px;background:var(--blue);color:#fff;font-weight:850;cursor:pointer}
@media(max-width:640px){.wrap{padding:12px}.flashcard{min-height:330px;padding:20px}.taskCard{padding:17px}.answer{font-size:16px}.reportGrid{grid-template-columns:1fr}}
</style></head><body>
<div class="wrap">
<div class="header"><div><div class="sub">GABI · HOMEWORK</div><h1>Family & Life Stages</h1></div>
<div class="nav"><button class="active" data-panel="cards">Flashcards</button><button data-panel="task1">Task 1</button><button data-panel="task2">Task 2</button><button data-panel="task3">Task 3</button><button data-panel="report">Result</button></div></div>
<section id="cards" class="panel active"><div class="cardWrap"><div id="flashcard" class="flashcard" tabindex="0"><div id="front"><div class="word" id="word"></div><div class="ipa" id="ipa"></div></div><div id="back" style="display:none"><div class="backText" id="translation"></div><div class="example" id="example"></div></div></div></div><div class="cardControls"><button class="prev" id="prevCard">← Back</button><button class="speak" id="speakBtn">🔊 Pronounce</button><button class="flip" id="flipBtn">Flip card</button><button class="next" id="nextCard">Next →</button></div><div class="counter" id="cardCounter"></div></section>
<section id="task1" class="panel"></section><section id="task2" class="panel"></section><section id="task3" class="panel"></section>
<section id="report" class="panel"><div class="reportBox"><div class="sub">TEACHER RESULT</div><h2 style="margin:5px 0 0">Gabi · 8 September</h2><div id="reportStatus" style="margin-top:8px;color:var(--muted);font-weight:700"></div><div class="reportGrid"><div class="reportScore">Family<br><span id="r0">0/12</span></div><div class="reportScore">Life Stages<br><span id="r1">0/12</span></div><div class="reportScore">Decisions<br><span id="r2">0/12</span></div></div><div><b>Total: <span id="rtotal">0/36</span></b></div><div id="mistakes" class="mistakes"></div><button id="copyReport" class="copyBtn">Copy result for teacher</button></div></section>
</div>
<script>
const cards=[["be related to", "/bi rɪˈleɪtɪd tuː/", "быть родственником / быть связанным родством", "Are you related to Emma?"], ["be married to", "/bi ˈmærid tuː/", "быть женатым / замужем за", "My aunt is married to a doctor."], ["get divorced", "/ɡet dɪˈvɔːst/", "развестись", "They got divorced two years ago."], ["get engaged", "/ɡet ɪnˈɡeɪdʒd/", "обручиться", "They got engaged last summer."], ["raise a child", "/reɪz ə tʃaɪld/", "воспитывать ребёнка", "It takes a lot of patience to raise a child."], ["adopt a child", "/əˈdɒpt ə tʃaɪld/", "усыновить / удочерить ребёнка", "They decided to adopt a child."], ["take after someone", "/teɪk ˈɑːftə ˈsʌmwʌn/", "быть похожим на кого-то из родственников", "I take after my dad in personality."], ["look like someone", "/lʊk laɪk ˈsʌmwʌn/", "быть внешне похожим на кого-то", "You look like your mother."], ["be close to someone", "/bi kləʊs tuː ˈsʌmwʌn/", "быть близким с кем-то", "She is very close to her older sister."], ["ancestor", "/ˈænsestə/", "предок", "One of his ancestors came from Italy."], ["descendant", "/dɪˈsendənt/", "потомок", "She is a descendant of a famous writer."], ["father-in-law", "/ˈfɑːðər ɪn lɔː/", "свёкор / тесть", "My father-in-law lives nearby."], ["mother-in-law", "/ˈmʌðər ɪn lɔː/", "свекровь / тёща", "Her mother-in-law is very friendly."], ["brother-in-law", "/ˈbrʌðər ɪn lɔː/", "деверь / шурин / зять", "My brother-in-law works in IT."], ["sister-in-law", "/ˈsɪstər ɪn lɔː/", "золовка / свояченица / невестка", "I met my sister-in-law at the wedding."], ["nephew", "/ˈnefjuː/", "племянник", "My nephew is nine years old."], ["niece", "/niːs/", "племянница", "My niece loves drawing."], ["stepfather", "/ˈstepfɑːðə/", "отчим", "His stepfather taught him to drive."], ["stepmother", "/ˈstepmʌðə/", "мачеха", "Her stepmother is a teacher."], ["half-brother", "/ˈhɑːf ˌbrʌðə/", "брат по одному родителю", "Tom is my half-brother."], ["half-sister", "/ˈhɑːf ˌsɪstə/", "сестра по одному родителю", "She has a younger half-sister."]];
const tasks=[{"title":"Family Challenge","instruction":"Read the family situation and choose the correct answer.","items":[{"q":"Your mum’s brother has a son. Who is he to you?","opts":["cousin","nephew","brother-in-law"],"a":"cousin"},{"q":"Your sister has a baby boy. Who is the baby to you?","opts":["nephew","cousin","half-brother"],"a":"nephew"},{"q":"Your dad gets married again. His new wife is your ___.","opts":["stepmother","mother-in-law","sister-in-law"],"a":"stepmother"},{"q":"You and Alex have the same dad but different mums. Alex is your ___.","opts":["half-brother","stepbrother","brother-in-law"],"a":"half-brother"},{"q":"Your brother gets married. His wife is your ___.","opts":["sister-in-law","niece","stepmother"],"a":"sister-in-law"},{"q":"Your sister gets married. Her husband is your ___.","opts":["brother-in-law","nephew","stepfather"],"a":"brother-in-law"},{"q":"Your brother has a daughter. She is your ___.","opts":["niece","cousin","half-sister"],"a":"niece"},{"q":"A person in your family who lived many generations ago is your ___.","opts":["ancestor","descendant","relative-in-law"],"a":"ancestor"},{"q":"A person born many generations after an ancestor is their ___.","opts":["descendant","ancestor","stepchild"],"a":"descendant"},{"q":"You have the same sense of humour as your dad. You probably ___.","opts":["take after him","look like him","are married to him"],"a":"take after him"},{"q":"People often say your face is very similar to your mum’s. You ___.","opts":["look like her","take after her personality","are related by marriage"],"a":"look like her"},{"q":"You talk to your older sister about almost everything and trust her a lot. You are ___.","opts":["close to her","related to her by law","descended from her"],"a":"close to her"}]},{"title":"Stages of Life","instruction":"Choose the option that fits the life stage.","items":[{"q":"After school, many teenagers decide to ___ before university.","opts":["take a gap year","retire","raise a child"],"a":"take a gap year"},{"q":"When people become adults, they may ___ and start earning money.","opts":["get a job","be born","retire"],"a":"get a job"},{"q":"Some couples ___ before they get married.","opts":["get engaged","get divorced","retire"],"a":"get engaged"},{"q":"When a couple separates legally, they ___.","opts":["get divorced","get engaged","grow up"],"a":"get divorced"},{"q":"Parents usually ___ until he or she becomes independent.","opts":["raise a child","take a gap year","retire"],"a":"raise a child"},{"q":"Some families choose to ___ if they cannot or do not want to have a biological child.","opts":["adopt a child","leave school","retire"],"a":"adopt a child"},{"q":"As children become teenagers and adults, they ___.","opts":["grow up","retire","get engaged"],"a":"grow up"},{"q":"At around 65, many people stop working and ___.","opts":["retire","get a job","start school"],"a":"retire"},{"q":"When you continue studying after school, you may go into ___ education.","opts":["further","farther","future"],"a":"further"},{"q":"At the beginning of life, a baby is ___.","opts":["born","retired","divorced"],"a":"born"},{"q":"A child normally ___ at the age of about five or six.","opts":["starts school","gets married","retires"],"a":"starts school"},{"q":"At some point, many people ___, have children, and build a family.","opts":["get married","leave school","be born"],"a":"get married"}]},{"title":"Decisions in Family Life","instruction":"Choose the most natural expression.","items":[{"q":"After thinking for days, Mia finally ___ to move abroad with her family.","opts":["made a decision","did a decision","made a resolution"],"a":"made a decision"},{"q":"Leo wishes he had not argued with his sister. He ___ his decision to shout at her.","opts":["regrets","intends","struggles"],"a":"regrets"},{"q":"Nina wants to stop wasting time online, so she decides to ___.","opts":["make a resolution","take a decision","have courage"],"a":"make a resolution"},{"q":"Sam is nervous about speaking to his father, but he finally ___.","opts":["has the courage to do it","makes courage to do it","takes courage for it"],"a":"has the courage to do it"},{"q":"I ___ talk to my cousin this weekend and apologise.","opts":["intend to","regret to","struggle to"],"a":"intend to"},{"q":"He often ___ making important decisions quickly.","opts":["struggles with","regrets about","intends with"],"a":"struggles with"},{"q":"Before choosing a school, we need ___ information.","opts":["further","farther","more further"],"a":"further"},{"q":"She was ___ enough to tell her parents the truth.","opts":["brave","courage","bravery"],"a":"brave"},{"q":"I don’t want to ___ not spending more time with my grandparents.","opts":["regret","intend","resolve"],"a":"regret"},{"q":"My cousin plans to study abroad. He ___ apply next year.","opts":["intends to","regrets to","struggles with"],"a":"intends to"},{"q":"It took a lot of ___ to admit he was wrong.","opts":["courage","brave","resolution"],"a":"courage"},{"q":"Sometimes people ___ family expectations when deciding what to do with their lives.","opts":["struggle with","regret to","intend with"],"a":"struggle with"}]}];
let cardIndex=0,flipped=false;function renderCard(){const c=cards[cardIndex];word.textContent=c[0];ipa.textContent=c[1];translation.textContent=c[2];example.textContent=c[3];front.style.display=flipped?'none':'block';back.style.display=flipped?'block':'none';cardCounter.textContent=(cardIndex+1)+' / '+cards.length}function flipCard(){flipped=!flipped;renderCard()}flashcard.addEventListener('click',flipCard);flipBtn.addEventListener('click',flipCard);prevCard.addEventListener('click',()=>{cardIndex=(cardIndex-1+cards.length)%cards.length;flipped=false;renderCard()});nextCard.addEventListener('click',()=>{cardIndex=(cardIndex+1)%cards.length;flipped=false;renderCard()});speakBtn.addEventListener('click',()=>{if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cards[cardIndex][0]);u.lang='en-GB';u.rate=.9;speechSynthesis.speak(u)}});document.querySelectorAll('.nav button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));document.getElementById(btn.dataset.panel).classList.add('active');if(btn.dataset.panel==='report')updateReport()}));const state=tasks.map(t=>t.items.map(()=>({done:false,correct:false,selected:null})));const idx=[0,0,0],scores=[0,0,0];function shuffle(a){return[...a].sort(()=>Math.random()-.5)}function mountTask(n){const host=document.getElementById('task'+(n+1));host.innerHTML=`<div class="taskHead"><div><div class="sub">TASK ${n+1} · 12 QUESTIONS</div><h2>${tasks[n].title}</h2></div><div class="score">Score: <span id="score${n}">0</span>/12</div></div><div class="taskCard"><div class="qnum" id="qnum${n}"></div><div class="question" id="q${n}"></div><div class="answers" id="ans${n}"></div><div class="feedback" id="fb${n}"></div><div class="progress"><div class="bar" id="bar${n}"></div></div></div><div class="taskControls"><button id="back${n}">← Back</button><button class="primary" id="next${n}" disabled>Next →</button></div>`;document.getElementById('back'+n).addEventListener('click',()=>{if(idx[n]>0){idx[n]--;renderTask(n)}});document.getElementById('next'+n).addEventListener('click',()=>{if(idx[n]<11){idx[n]++;renderTask(n)}});renderTask(n)}function renderTask(n){const i=idx[n],item=tasks[n].items[i],st=state[n][i];document.getElementById('qnum'+n).textContent=(i+1)+' / 12 · '+tasks[n].instruction;document.getElementById('q'+n).textContent=item.q;const box=document.getElementById('ans'+n);box.innerHTML='';shuffle(item.opts).forEach(opt=>{const b=document.createElement('button');b.className='answer';b.textContent=opt;if(st.done){b.disabled=true;if(opt===item.a)b.classList.add('correct');if(opt===st.selected&&!st.correct)b.classList.add('wrong')}b.addEventListener('click',()=>{if(st.done)return;st.done=true;st.selected=opt;st.correct=opt===item.a;if(st.correct)scores[n]++;saveProgress();renderTask(n);updateReport()});box.appendChild(b)});document.getElementById('fb'+n).textContent=st.done?(st.correct?'Correct ✓':'Not quite — look at the correct phrase.'):'';document.getElementById('score'+n).textContent=scores[n];document.getElementById('back'+n).disabled=i===0;document.getElementById('next'+n).disabled=!st.done||i===11;document.getElementById('bar'+n).style.width=((i+1)/12*100)+'%'}function saveProgress(){try{localStorage.setItem('gabi_hw_2026_09_08',JSON.stringify({state:state,idx:idx,scores:scores}))}catch(e){}}function loadProgress(){try{const saved=JSON.parse(localStorage.getItem('gabi_hw_2026_09_08')||'null');if(saved&&saved.state){saved.state.forEach((t,ti)=>t.forEach((v,vi)=>Object.assign(state[ti][vi],v)));saved.idx.forEach((v,i)=>idx[i]=v);saved.scores.forEach((v,i)=>scores[i]=v)}}catch(e){}}function updateReport(){const total=scores.reduce((a,b)=>a+b,0);r0.textContent=scores[0]+'/12';r1.textContent=scores[1]+'/12';r2.textContent=scores[2]+'/12';rtotal.textContent=total+'/36';const done=state.flat().filter(x=>x.done).length;reportStatus.textContent=done===36?'Homework completed.':'Completed '+done+' of 36 questions.';mistakes.innerHTML='';let errors=0;state.forEach((t,ti)=>t.forEach((st,qi)=>{if(st.done&&!st.correct){errors++;const d=document.createElement('div');d.className='mistake';d.innerHTML='<b>Task '+(ti+1)+', Q'+(qi+1)+'</b><br>'+tasks[ti].items[qi].q+'<br><span style="color:var(--bad)">Chosen: '+st.selected+'</span><br><span style="color:var(--good)">Correct: '+tasks[ti].items[qi].a+'</span>';mistakes.appendChild(d)}}));if(!errors)mistakes.innerHTML='<div class="mistake">No mistakes recorded yet.</div>'}function buildReportText(){let lines=['Gabi · Homework · 8 September','Family: '+scores[0]+'/12','Life Stages: '+scores[1]+'/12','Decisions: '+scores[2]+'/12','Total: '+scores.reduce((a,b)=>a+b,0)+'/36'];let n=0;state.forEach((t,ti)=>t.forEach((st,qi)=>{if(st.done&&!st.correct){n++;lines.push('Mistake '+n+': Task '+(ti+1)+' Q'+(qi+1)+' — chose "'+st.selected+'"; correct: "'+tasks[ti].items[qi].a+'"')}}));return lines.join('\n')}copyReport.addEventListener('click',async()=>{const text=buildReportText();try{await navigator.clipboard.writeText(text);copyReport.textContent='Copied ✓'}catch(e){window.prompt('Copy this result:',text)}});loadProgress();for(let n=0;n<3;n++)mountTask(n);renderCard();updateReport();
</script></body></html>
