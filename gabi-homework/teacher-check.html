<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17323f"><title>Teacher Homework Check</title><style>
:root{--ink:#17323f;--teal:#16b8b0;--muted:#6c7f89;--red:#d94e65;--green:#238760;--line:#dfe9ea}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eefdfa,#fff8e8 55%,#f2efff);color:var(--ink);min-height:100vh}.wrap{width:min(1120px,calc(100% - 28px));margin:28px auto}.hero{background:linear-gradient(125deg,#17323f,#1f6a72);color:#fff;border-radius:28px;padding:27px 30px;box-shadow:0 18px 45px #17323f2e}.hero small{font-weight:900;letter-spacing:.15em;color:#94ebe5}.hero h1{margin:7px 0 5px;font-size:clamp(30px,5vw,50px)}.hero p{margin:0;color:#d8eeee}.card{margin-top:16px;background:#fff;border:1px solid var(--line);border-radius:24px;padding:22px;box-shadow:0 12px 30px #2d4c5017}label{display:block;font-weight:900;margin:0 0 7px}input,textarea{width:100%;border:2px solid #dce6e8;border-radius:13px;padding:12px 13px;font:inherit;color:var(--ink);background:#fff}textarea{min-height:120px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.grid{display:grid;grid-template-columns:220px 1fr;gap:13px}.btn{border:0;border-radius:14px;padding:12px 17px;background:var(--ink);color:#fff;font-weight:900;cursor:pointer;margin-top:13px}.note{color:var(--muted);font-size:13px;line-height:1.5}.status{margin-top:12px;font-weight:900}.bad{color:var(--red)}.summary{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}.stat{border-radius:19px;padding:17px;background:#f5faf9;border:1px solid #e2efed}.stat b{display:block;font-size:27px}.stat span{color:var(--muted);font-size:11px;font-weight:850}.section-title{margin:24px 0 10px;font-size:23px}.rows{display:grid;gap:8px}.row{display:grid;grid-template-columns:48px 1.65fr 1fr 1fr 80px;gap:8px;align-items:center;border:1px solid #e3ebed;border-radius:14px;padding:10px 11px;background:#fff}.row.head{background:#f3f7f7;font-size:12px;font-weight:950;color:#6b7d85;text-transform:uppercase}.row.wrong{border-color:#f0c5ce;background:#fff6f8}.row.correct{border-color:#cde8dc;background:#f7fffb}.answer{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-weight:850}.result{font-weight:1000}.result.ok{color:var(--green)}.result.no{color:var(--red)}.hidden{display:none!important}@media(max-width:800px){.grid{grid-template-columns:1fr}.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:38px 1fr 1fr}.row .prompt{grid-column:1/-1}.row .result{grid-column:3}.row.head{display:none}}@media(max-width:500px){.summary{grid-template-columns:1fr}}
</style></head><body><main class="wrap"><section class="hero"><small>TEACHER ONLY</small><h1>Homework checker</h1><p>Paste the student code. Answers and scores appear only after the teacher PIN is entered.</p></section><section class="card"><div class="grid"><div><label for="pin">Teacher PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="••••"></div><div><label for="code">Submission code</label><textarea id="code" placeholder="Paste the code from the student here"></textarea></div></div><button class="btn" id="checkBtn">Open submission</button><div id="status" class="status"></div><p class="note">This page is not linked from the student homework page.</p></section><section id="results" class="card hidden"><div id="meta"></div><div class="summary" id="summary"></div><div id="sections"></div></section></main><script>
const encrypted={salt:'yFCYASeBv6vejkRMFeKnFQ==',iv:'horCc7x7le8iNihF',ct:'40xClGGhlUJDtlzfPkwWVebBKmBSCWkh0VsNDq/SLZ2iQzTJEUuaqMP1ktk/dc+ZtiIsl8TRBkVw2e+P1lBkXneDIRt3YegkJVWI5WbV1ejflmGAIX/GoopY1NtWJAL1VRSdouIFLscrFAyz3Oua/SQ+gL1A6nyL4B5hsbEKO8X7L2OWRlyq2IsRCn4VRocUVbtaPdiwbHWy0PdoARV6MQlVH+L+pRLO8V3LXBw8t5q+m8ZpMnAlqUKyuIsLPgIOQPEGV0ee45puXl7HjfVCEQFZR0scOke/bK9mzOniugajInIbbtFIdzEessnNtriU5nhY5z/1kwhX1J32GdUqkY0Sd0T3U8UrS45ycK3rZ+RdXTiJ4aeGpj7kfvF4ph9yME8DeV4jG3O6AsdteqWVo07Qlhx7xcwHt0W0UAjWxBRCcY2HscC+O+SnqWFFBKd/xqo93YEFxK8gzP2za8OzMQRhhcDbizfhmO+Z+Mbe9UYXaVmU/LpsyGYZphFT1WmgPqg='};
const oldLexKey=JSON.parse(atob('WyJyZWdyZXQiLCAiaW50ZW5kIiwgInBlcmhhcHMiLCAiZ2FwIHllYXIiLCAiZnVydGhlciIsICJzdHJ1Z2dsZWQiLCAicmVzb2x1dGlvbiIsICJoYWJpdCIsICJicmF2ZSIsICJjb3VyYWdlIiwgIm1pbmQiLCAiY2hhbmNlIl0='));
const oldLexPrompts=['Ella — drama club','Start homework earlier','Maybe summer camp','A year before university','Study more','Language difficulty','New Year promise','Waking up early','Speak before school','Audition alone','Keep an open …','Take the …'];
const oldWfPrompts=['FAVOUR →','ACT →','DIVE →','RELAX →','IMPORTANCE →','TRAVEL →','NERVE →','EXPERIENCE →','ARCHITECT →','EDUCATION →'];
const oldArticlePrompts=['entire year','new phone','latest model','advertisement','store','long line','hour','salesperson','different colors','features','new camera system','phone','photos','contacts','apps','new features','camera quality','battery life','entire day','charge','phone','advice','expensive purchase','money I saved','phone'];
const repair={
 vKey:['struggle','resolution','regret','intends','courage','take the chance','habit','Perhaps'],
 vPrompts:['Waking up at 6 a.m.','Daily English promise','Drama club','Future study plan','Speaking in public','Free exchange place','Reading before bed','Weekend possibility'],
 wfKey:['active','actively','activities','educational','decision'],wfPrompts:['ACT → role','ACT → clearly','ACT → after-school','EDUCATION → experience','DECIDE → future'],
 aKey:['an','a','the','zero','a','an','the','zero','an','a','the','zero','the','the','zero'],aPrompts:['engineer','new sports centre','sports centre again','go to school','doctor','interesting advert','close window','sleep','hour','bike','bike again','Italy','best decision','drama club','advice'],
 mKey:['a','struggled','the','habit','a','take the chance','a'],mPrompts:['photography course','getting up early','course again','waking up early','professional photographer','enter competition','life-changing experience']
};
function b64bytes(s){const bin=atob(s);return Uint8Array.from(bin,c=>c.charCodeAt(0))}function b64urlText(s){s=s.trim().replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}async function decryptKey(pin){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(pin),'PBKDF2',false,['deriveKey']);const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(encrypted.salt),iterations:150000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(encrypted.iv)},key,b64bytes(encrypted.ct));return JSON.parse(new TextDecoder().decode(plain))}function norm(s){return(s||'').trim().toLowerCase().replace(/’/g,"'")}function shown(v){return v==='zero'?'—':(v||'—')}function rowHTML(no,prompt,given,correct,ok){return `<div class="row ${ok?'correct':'wrong'}"><div><b>${no}</b></div><div class="prompt">${prompt}</div><div class="answer">${shown(given)}</div><div class="answer">${Array.isArray(correct)?correct.join(' / '):shown(correct)}</div><div class="result ${ok?'ok':'no'}">${ok?'✓':'✕'}</div></div>`}function head(){return '<div class="row head"><div>#</div><div>Item</div><div>Student</div><div>Correct</div><div>Result</div></div>'}function section(title,rows){return `<h2 class="section-title">${title}</h2><div class="rows">${rows}</div>`}function stat(score,label){return `<div class="stat"><b>${score}</b><span>${label}</span></div>`}
function renderOld(payload,key){if(!Array.isArray(payload.wf)||payload.wf.length!==10||!Array.isArray(payload.art)||payload.art.length!==25||!Array.isArray(payload.lex)||payload.lex.length!==12)throw new Error('The submission code is incomplete or from an older version.');let ls=0,ws=0,as=0,lh=head(),wh=head(),ah=head();payload.lex.forEach((v,i)=>{const correct=oldLexKey[i],ok=norm(v)===norm(correct);if(ok)ls++;lh+=rowHTML(i+1,oldLexPrompts[i],v,correct,ok)});payload.wf.forEach((v,i)=>{const accepted=key.wordFormation[i],ok=accepted.some(a=>norm(a)===norm(v));if(ok)ws++;wh+=rowHTML(i+1,oldWfPrompts[i],v,accepted,ok)});payload.art.forEach((v,i)=>{const correct=key.articles[i],ok=norm(v)===norm(correct);if(ok)as++;ah+=rowHTML(i+1,oldArticlePrompts[i],v,correct,ok)});document.getElementById('summary').innerHTML=stat((ls+ws+as)+'/47','TOTAL')+stat(ls+'/12','LEXICAL')+stat(ws+'/10','WORD FORMATION')+stat(as+'/25','ARTICLES');document.getElementById('sections').innerHTML=section('Lexical Check',lh)+section('Word Formation',wh)+section('Articles',ah);document.getElementById('meta').innerHTML='<b>Module 1 · Lesson 1 · Homework</b>'}
function scoreRows(vals,keys,prompts){let score=0,html=head();vals.forEach((v,i)=>{const ok=norm(v)===norm(keys[i]);if(ok)score++;html+=rowHTML(i+1,prompts[i],v,keys[i],ok)});return{score,html}}
function renderRepair(payload){if(!Array.isArray(payload.v)||payload.v.length!==8||!Array.isArray(payload.wf)||payload.wf.length!==5||!Array.isArray(payload.a)||payload.a.length!==15||!Array.isArray(payload.m)||payload.m.length!==7)throw new Error('The repair homework code is incomplete.');const v=scoreRows(payload.v,repair.vKey,repair.vPrompts),w=scoreRows(payload.wf,repair.wfKey,repair.wfPrompts),a=scoreRows(payload.a,repair.aKey,repair.aPrompts),m=scoreRows(payload.m,repair.mKey,repair.mPrompts),total=v.score+w.score+a.score+m.score;document.getElementById('summary').innerHTML=stat(total+'/35','TOTAL')+stat(v.score+'/8','VOCABULARY')+stat(w.score+'/5','WORD FORMATION')+stat(a.score+'/15','ARTICLES')+stat(m.score+'/7','CHALLENGE');document.getElementById('sections').innerHTML=section('Vocabulary Repair',v.html)+section('Word Formation',w.html)+section('Articles',a.html)+section('Mini Challenge',m.html);document.getElementById('meta').innerHTML='<b>Module 1 · Repair Homework</b>'}
document.getElementById('checkBtn').onclick=async()=>{const st=document.getElementById('status');st.className='status';st.textContent='Opening…';document.getElementById('results').classList.add('hidden');try{const key=await decryptKey(document.getElementById('pin').value.trim());const payload=JSON.parse(b64urlText(document.getElementById('code').value));if(payload.assignment==='life-plans-hw1'){if(payload.assignment!==key.assignment)throw new Error('This code belongs to another assignment.');renderOld(payload,key)}else if(payload.assignment==='gabi-repair-20260827'){renderRepair(payload)}else throw new Error('Unknown homework code.');const dt=payload.submitted?new Date(payload.submitted):null;if(dt&&!isNaN(dt))document.getElementById('meta').innerHTML+='<br><span class="note">Submitted: '+dt.toLocaleString()+'</span>';document.getElementById('results').classList.remove('hidden');st.textContent='Submission opened ✓'}catch(e){st.className='status bad';st.textContent=e.name==='OperationError'?'PIN is not correct.':(e.message||'Could not open this submission code.')}};
</script></body></html>
