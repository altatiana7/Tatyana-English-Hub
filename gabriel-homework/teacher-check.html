function checksum(body){let n=0;for(let i=0;i<body.length;i++)n=(n*17+ALPH.indexOf(body[i])+1)%1024;return ALPH[(n>>5)&31]+ALPH[n&31]}function decodeShort(code){const m=code.trim().toUpperCase().match(/^G2-([A-HJ-NP-Z2-9]{14})-([A-HJ-NP-Z2-9]{2})$/);if(!m)throw new Error('Short code format is not correct.');if(checksum(m[1])!==m[2])throw new Error('Short code has a typing error.');let n=0n;for(const ch of m[1])n=n*32n+BigInt(ALPH.indexOf(ch));const vals=Array(35).fill(0);for(let i=34;i>=0;i--){vals[i]=Number(n&3n);n>>=2n}return vals}

function decodeLesson5Short(code){
  const m=code.trim().toUpperCase().match(/^G5([A-HJ-NP-Z2-9]{11})([A-HJ-NP-Z2-9]{2})$/);
  if(!m)throw new Error('Lesson 5 short code format is not correct.');
  if(checksum(m[1])!==m[2])throw new Error('Lesson 5 short code has a typing error.');
  let n=0n;for(const ch of m[1])n=n*32n+BigInt(ALPH.indexOf(ch));
  const bits=Array(54).fill(0);for(let i=53;i>=0;i--){bits[i]=Number(n&1n);n>>=1n}
  return bits;
}
function renderLesson5Short(bits){
  if(!Array.isArray(bits)||bits.length!==54)throw new Error('Lesson 5 short code is incomplete.');
  let pos=0,total=0,sections='',stats='';
  lesson5.forEach((block)=>{
    let score=0,html=head();
    block.items.forEach((item,qi)=>{
      const ok=!!bits[pos++]; if(ok){score++;total++}
      html+=rowHTML(qi+1,item[0],ok?'correct':'incorrect',item[1],ok);
    });
    stats+=stat(score+'/12',block.title.toUpperCase());
    sections+=section(block.title,html);
  });
  let wfScore=0,wfHtml=head();
  lesson5wf.forEach((item,i)=>{
    const ok=!!bits[pos++]; if(ok){wfScore++;total++}
    wfHtml+=rowHTML(i+1,item[0],ok?'correct':'incorrect',item[1],ok);
  });
  stats+=stat(wfScore+'/18','WORD FORMATION');
  sections+=section('Word Formation',wfHtml);
  document.getElementById('summary').innerHTML=stat(total+'/54','TOTAL')+stats;
  document.getElementById('sections').innerHTML=sections;
  document.getElementById('meta').innerHTML='<b>Module 1 · Lesson 5 · Homework · short code</b>';
}

function renderLesson5(p){
  if(!Array.isArray(p.answers)||(p.answers.length!==3&&p.answers.length!==4))throw new Error('Lesson 5 code is incomplete.');
  let total=0,sections='',stats='',max=36;
  lesson5.forEach((block,ti)=>{
    const vals=p.answers[ti];
    if(!Array.isArray(vals)||vals.length!==block.items.length)throw new Error('Lesson 5 code is incomplete.');
    let score=0,html=head();
    vals.forEach((v,qi)=>{
      const correct=block.items[qi][1],ok=norm(v)===norm(correct);
      if(ok){score++;total++}
      html+=rowHTML(qi+1,block.items[qi][0],v,correct,ok);
    });
    stats+=stat(score+'/12',block.title.toUpperCase());
    sections+=section(block.title,html);
  });
  if(p.answers.length===4){
    const vals=p.answers[3];
    if(!Array.isArray(vals)||vals.length!==lesson5wf.length)throw new Error('Lesson 5 Word Formation code is incomplete.');
    let score=0,html=head();
    vals.forEach((v,i)=>{
      const correct=lesson5wf[i][1],ok=norm(v)===norm(correct);
      if(ok){score++;total++}
      html+=rowHTML(i+1,lesson5wf[i][0],v,correct,ok);
    });
    max=54;
    stats+=stat(score+'/18','WORD FORMATION');
    sections+=section('Word Formation',html);
  }
  document.getElementById('summary').innerHTML=stat(total+'/'+max,'TOTAL')+stats;
  document.getElementById('sections').innerHTML=sections;
  document.getElementById('meta').innerHTML='<b>Module 1 · Lesson 5 · Homework</b>';
}

const escT=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nz6=s=>String(s||'').toLowerCase().replace(/[’‘`´]/g,"'").replace(/[-–—]/g,' ').replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
function row6(no,prompt,given,model,state){const cls=state==='ok'?'correct':state==='no'?'wrong':'read';return `<div class="row ${cls}"><div><b>${no}</b></div><div class="prompt">${escT(prompt)}</div><div class="answer plain">${escT(given)||'—'}</div><div class="answer plain">${escT(model)}</div><div class="result ${state==='ok'?'ok':state==='no'?'no':'rd'}">${state==='ok'?'✓':state==='no'?'✕':'read'}</div></div>`}
function head6(c3,c4){return `<div class="row head"><div>#</div><div>Item</div><div>${c3}</div><div>${c4}</div><div>Result</div></div>`}
async function decodeLesson6(code){const m=code.replace(/\s+/g,'').match(/^G6(r?)\.([A-Za-z0-9_-]+)$/);if(!m)throw new Error('Lesson 6 code format is not correct. Copy the whole code.');
 let b=m[2].replace(/-/g,'+').replace(/_/g,'/');while(b.length%4)b+='=';
 try{const bytes=Uint8Array.from(atob(b),c=>c.charCodeAt(0));if(m[1])return JSON.parse(new TextDecoder().decode(bytes));const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(bytes);w.close();return JSON.parse(await new Response(ds.readable).text())}catch(e){throw new Error('Lesson 6 code is damaged or incomplete. Ask Gabi to copy it again.')}}
function renderLesson6(p){if(p.assignment!=='gabi-hw-2026-10-07'||!Array.isArray(p.steps))throw new Error('Unknown homework code.');
 let stats='',sections='';const S=p.steps;
 hw6.forEach((def,i)=>{const d=S[i]||{};let html='';
  if(def.kind==='open'||def.kind==='exact'){let sc=0;html=head6('Student',def.kind==='open'?'Model answer':'Accepted');def.items.forEach((it,k)=>{const v=(d.v||[])[k]||'',n=nz6(v);let st;
    if(def.kind==='exact'){st=it[1].some(x=>nz6(x)===n)?'ok':'no';html+=row6(k+1,it[0],v,it[1].join(' / '),st)}
    else{st=!n?'no':it[2].some(g=>g.every(w=>n.includes(w)))?'ok':'read';html+=row6(k+1,it[0],v,it[1],st)}
    if(st==='ok')sc++});
   stats+=stat(sc+'/'+def.items.length,def.title.replace(/^\d · /,'').toUpperCase()+(def.kind==='open'?' · KEY WORDS':''));
   if(!d.c)html+='<p class="note">Gabi did not press Check on this step.</p>'}
  else if(def.kind==='quiz'){stats+=stat((d.ok||0)+'/'+(d.n||8),'INEVITABLE QUIZ');html=`<p class="note">${d.d?'Finished':'Not finished'}: ${d.ok||0} of ${d.n||8} correct.</p>`}
  else if(def.kind==='free'){html=head6('Student','');def.items.forEach((q,k)=>{const v=(d.v||[])[k]||'';html+=row6(k+1,q,v,'',v.trim()?'read':'no')})}
  else if(def.kind==='map'){html=head6('Key words','');def.items.forEach((q,k)=>{const v=((d.v||[])[k]||[]).filter(Boolean).join(', ');html+=row6(k+1,q,v,'',v?'read':'no')})}
  else if(def.kind==='write'){const t=d.t||'',n=(t.trim().match(/[A-Za-z’']+/g)||[]).length;stats+=stat(n,'WORDS IN THE CALL ('+def.min+'–'+def.max+')');
   html=`<div class="essay">${escT(t)||'— not written —'}</div><ul class="chk6">${def.checks.map(c=>`<li class="${c[1](t)?'ok':'no'}">${c[1](t)?'✓':'✕'} ${escT(c[0])}</li>`).join('')}</ul>`}
  else if(def.kind==='talk'){stats+=stat((d.n||0)+'/'+(d.of||6),'SPOKEN QUESTIONS');html=`<p class="note">Timer started on ${d.n||0} of ${d.of||6} questions. Speaking is not recorded.</p>`}
  sections+=section(def.title,html)});
 document.getElementById('summary').innerHTML=stats;document.getElementById('sections').innerHTML=sections;
 document.getElementById('meta').innerHTML='<b>Module 1 · Lesson 6 · Homework · Teen Talk Time</b><br><span class="note">✓ matches the key · ✕ wrong or empty · read = free answer, check it yourself</span>';
 const dt=p.submitted?new Date(p.submitted):null;if(dt&&!isNaN(dt))document.getElementById('meta').innerHTML+='<br><span class="note">Submitted: '+dt.toLocaleString()+'</span>'}

document.getElementById('checkBtn').onclick=async()=>{const st=document.getElementById('status');st.className='status';st.textContent='Opening…';document.getElementById('results').classList.add('hidden');try{const key=await decryptKey(document.getElementById('pin').value.trim());const raw=document.getElementById('code').value.trim();let payload=null;if(/^G6r?\./.test(raw)){renderLesson6(await decodeLesson6(raw))}else if(/^G5[A-HJ-NP-Z2-9]{13}$/i.test(raw)){renderLesson5Short(decodeLesson5Short(raw))}else if(/^G2-/i.test(raw)){renderRepairShort(raw)}else{payload=JSON.parse(b64urlText(raw));if(payload.assignment==='life-plans-hw1')renderOld(payload,key);else if(payload.assignment==='gabi-repair-20260827')renderRepairLong(payload);else if(payload.assignment==='gabi-hw-2026-09-01')renderLesson3(payload);else if(payload.assignment==='gabi-hw-2026-09-08')renderLesson5(payload);else throw new Error('Unknown homework code.');const dt=payload.submitted?new Date(payload.submitted):null;if(dt&&!isNaN(dt))document.getElementById('meta').innerHTML+='<br><span class="note">Submitted: '+dt.toLocaleString()+'</span>'}document.getElementById('results').classList.remove('hidden');st.textContent='Submission opened ✓'}catch(e){st.className='status bad';st.textContent=e.name==='OperationError'?'PIN is not correct.':(e.message||'Could not open this submission code.')}};</script></body></html>
