function mountWordFormation(){const host=document.getElementById('task4');host.innerHTML='<div class="taskHead"><div><div class="sub">TASK 4 · 18 QUESTIONS</div><h2>Word Formation</h2><p style="margin:4px 0 0;color:var(--muted)">Change the word in brackets. The word must change form.</p></div><div class="score">Score: <span id="wfScore">0</span>/18</div></div><div class="taskCard"><div class="qnum" id="wfQnum"></div><div class="question" id="wfQ"></div><div class="wfBase" id="wfBase"></div><div style="margin-top:14px"><input id="wfInput" class="wfInput" autocomplete="off" spellcheck="false" placeholder="Type the changed word"></div><div class="feedback" id="wfFeedback"></div><div class="progress"><div class="bar" id="wfBar"></div></div></div><div class="taskControls"><button id="wfBack">← Back</button><button class="primary" id="wfCheck">Check</button><button class="primary" id="wfNext">Next →</button></div>';document.getElementById('wfBack').onclick=()=>{if(wfIndex>0){wfIndex--;renderWordFormation()}};document.getElementById('wfNext').onclick=()=>{if(wfState[wfIndex].done&&wfIndex<wfItems.length-1){wfIndex++;renderWordFormation()}};document.getElementById('wfCheck').onclick=()=>{const st=wfState[wfIndex];if(st.done)return;const v=document.getElementById('wfInput').value.trim().toLowerCase();if(!v)return;st.done=true;st.value=v;st.correct=v===wfItems[wfIndex].a;if(st.correct)wfScore++;saveProgress();renderWordFormation();updateReport()};renderWordFormation()}
function renderWordFormation(){const item=wfItems[wfIndex],st=wfState[wfIndex],input=document.getElementById('wfInput');document.getElementById('wfQnum').textContent=(wfIndex+1)+' / '+wfItems.length;document.getElementById('wfQ').textContent=item.q;document.getElementById('wfBase').textContent='('+item.base+')';input.value=st.value||'';input.disabled=st.done;input.className='wfInput'+(st.done?(st.correct?' wfCorrect':' wfWrong'):'');document.getElementById('wfFeedback').textContent=st.done?(st.correct?'Correct ✓':'Correct answer: '+item.a):'';document.getElementById('wfScore').textContent=wfScore;document.getElementById('wfBack').disabled=wfIndex===0;document.getElementById('wfCheck').disabled=st.done;document.getElementById('wfNext').disabled=!st.done||wfIndex===wfItems.length-1;document.getElementById('wfBar').style.width=((wfIndex+1)/wfItems.length*100)+'%'}
function saveProgress(){try{localStorage.setItem('gabi_hw_2026_09_08',JSON.stringify({state,idx,scores,wfState,wfIndex,wfScore}))}catch(e){}}
function loadProgress(){try{const saved=JSON.parse(localStorage.getItem('gabi_hw_2026_09_08')||'null');if(saved&&saved.state){saved.state.forEach((t,ti)=>{if(state[ti])t.forEach((v,vi)=>{if(state[ti][vi])Object.assign(state[ti][vi],v)})});(saved.idx||[]).forEach((v,i)=>{if(i<idx.length)idx[i]=v});(saved.scores||[]).forEach((v,i)=>{if(i<scores.length)scores[i]=v});if(Array.isArray(saved.wfState))saved.wfState.forEach((v,i)=>{if(wfState[i])Object.assign(wfState[i],v)});if(Number.isInteger(saved.wfIndex))wfIndex=Math.max(0,Math.min(saved.wfIndex,wfItems.length-1));if(Number.isInteger(saved.wfScore))wfScore=saved.wfScore;else wfScore=wfState.filter(x=>x.done&&x.correct).length}}catch(e){}}
function updateReport(){const baseTotal=scores.reduce((a,b)=>a+b,0),total=baseTotal+wfScore;r0.textContent=scores[0]+'/12';r1.textContent=scores[1]+'/12';r2.textContent=scores[2]+'/12';r3.textContent=wfScore+'/18';rtotal.textContent=total+'/54';const baseDone=state.flat().filter(x=>x.done).length,wfDone=wfState.filter(x=>x.done).length,done=baseDone+wfDone;reportStatus.textContent=done===54?'Homework completed.':'Completed '+done+' of 54 questions.';mistakes.innerHTML='';let errors=0;state.forEach((t,ti)=>t.forEach((st,qi)=>{if(st.done&&!st.correct){errors++;const d=document.createElement('div');d.className='mistake';d.innerHTML='<b>Task '+(ti+1)+', Q'+(qi+1)+'</b><br>'+tasks[ti].items[qi].q+'<br><span style="color:var(--bad)">Chosen: '+st.selected+'</span><br><span style="color:var(--good)">Correct: '+tasks[ti].items[qi].a+'</span>';mistakes.appendChild(d)}}));wfState.forEach((st,qi)=>{if(st.done&&!st.correct){errors++;const d=document.createElement('div');d.className='mistake';d.innerHTML='<b>Word Formation, Q'+(qi+1)+'</b><br>'+wfItems[qi].q+' ('+wfItems[qi].base+')<br><span style="color:var(--bad)">Answer: '+st.value+'</span><br><span style="color:var(--good)">Correct: '+wfItems[qi].a+'</span>';mistakes.appendChild(d)}});if(!errors)mistakes.innerHTML='<div class="mistake">No mistakes recorded yet.</div>'}
function buildReportText(){let lines=['Gabi · Homework · 8 September','Family: '+scores[0]+'/12','Life Stages: '+scores[1]+'/12','Decisions: '+scores[2]+'/12','Word Formation: '+wfScore+'/18','Total: '+(scores.reduce((a,b)=>a+b,0)+wfScore)+'/54'];let n=0;state.forEach((t,ti)=>t.forEach((st,qi)=>{if(st.done&&!st.correct){n++;lines.push('Mistake '+n+': Task '+(ti+1)+' Q'+(qi+1)+' — chose "'+st.selected+'"; correct: "'+tasks[ti].items[qi].a+'"')}}));wfState.forEach((st,qi)=>{if(st.done&&!st.correct){n++;lines.push('Mistake '+n+': Word Formation Q'+(qi+1)+' — "'+st.value+'"; correct: "'+wfItems[qi].a+'"')}});return lines.join('\n')}
copyReport.addEventListener('click',async()=>{const text=buildReportText();try{await navigator.clipboard.writeText(text);copyReport.textContent='Copied ✓'}catch(e){window.prompt('Copy this result:',text)}});
function encodePayload5(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj));let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
makeCode5.addEventListener('click',()=>{const done=state.flat().filter(x=>x.done).length+wfState.filter(x=>x.done).length;if(done!==54){reportStatus.textContent='Complete all 54 questions before creating the homework code.';return}const answers=[...state.map(t=>t.map(x=>x.selected||'')),wfState.map(x=>x.value||'')];const code=encodePayload5({v:2,assignment:'gabi-hw-2026-09-08',submitted:new Date().toISOString(),answers});submissionCode5.textContent=code;codeWrap5.hidden=false;reportStatus.textContent='Homework code created. Send this code to your teacher.'});
copyCode5.addEventListener('click',async()=>{const code=submissionCode5.textContent;if(!code)return;try{await navigator.clipboard.writeText(code);copyCode5.textContent='Copied ✓'}catch(e){window.prompt('Copy this code:',code)}});
loadProgress();for(let n=0;n<3;n++)mountTask(n);mountWordFormation();renderCard();updateReport();
