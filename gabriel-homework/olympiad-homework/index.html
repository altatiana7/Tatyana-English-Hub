ibes what causes interest."],["Visitors are not allowed ___ photos in this gallery.",["taking","take","to take","taken"],2,"Be allowed + to-infinitive."],["Neither the teacher nor the students ___ ready to leave.",["was","is","were","be"],2,"With neither...nor, the verb agrees with the nearer subject."],["The city, ___ historic centre is protected, attracts tourists.",["which","whose","who","where"],1,"Whose shows possession in relative clauses."],["It took us a while to ___ out what the sign meant.",["make","find","take","put"],1,"Find out = discover information."],["The route was ___ difficult than we expected.",["much","more","most","many"],1,"Comparative adjective: more difficult than."],["By the time we arrived, the museum ___.",["closed","has closed","had closed","was closing"],2,"Past Perfect for an action completed before another past event."],["The tour was cancelled ___ the heavy rain.",["because","because of","although","despite of"],1,"Because of + noun phrase; because + clause."],["You ___ book in advance; tickets are sold out every weekend.",["had better","would rather","used to","might as well to"],0,"Had better + base verb gives strong advice."]]};

 $('cardstage').innerHTML='<div class="grid"><section class="panel"><div class="flashcard" role="button" tabindex="0" aria-label="Flip landmark flashcard" onclick="flip()" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();flip()}">'+(flipped?back:front)+'</div><div class="flashcounter">CARD '+(card+1)+' / '+n+' · '+(flipped?'FACT & TRANSLATION':'PHOTO & NAME')+'</div><div class="flashbuttons"><button onclick="moveCard(-1)">← Previous</button><button class="blue" onclick="speak()">▶ Listen</button><button onclick="flip()">↺ Flip</button><button class="primary" onclick="moveCard(1)">Next →</button></div></section><aside class="panel rightguide"><div class="eyebrow">Olympiad · Landmarks</div><h2>Look · Listen · Remember</h2><p>1. Look at the photo and say the name.</p><p>2. Listen to its British pronunciation.</p><p>3. Flip. Learn the location and one short fact.</p><p>4. Say the fact from memory.</p><label for="jumpCards"><b>Choose a landmark</b></label><select id="jumpCards" class="jump" onchange="card=Number(this.value);flipped=false;renderCard()">'+options+'</select><p class="tiny">The card can be turned over by clicking anywhere on it. Audio uses the voice installed on the device.</p></aside></div>';
}
function writingView(){let i=tab-1,w=DATA.writing[i],v=drafts[i]||'';return `<div class="eyebrow">Writing workshop · ${esc(w.kind)}</div><h1>${esc(w.title)}</h1><div class="grid"><section class="panel"><p class="prompt">${esc(w.prompt)}</p><div class="navrow"><b>Write your answer here</b><span id="wc" class="counter">${countWords(v)} words · saved locally</span></div><textarea class="txt" id="draft" spellcheck="true" lang="en" placeholder="Type your complete text here…" oninput="saveDraft(${i},this.value)">${esc(v)}</textarea><div class="inline" style="margin-top:10px"><button class="primary" onclick="proofread(${i})">✓ Check before sending</button><button onclick="go(${i===2?5:tab+1})">${i===2?'Go to submission →':'Next writing task →'}</button></div><div id="checkresult" class="status">Browser spelling suggestions: right-click an underlined word to edit it.</div></section><aside class="panel"><h2>Writing coach</h2><p class="tiny">Read the task carefully. Use the template only as support — write your own text.</p><div class="inline"><button onclick="toggle('plan')">Template ▾</button><button onclick="toggle('phrases')">Useful phrases ▾</button><button onclick="toggle('tips')">Exam tips ▾</button></div><div class="entry hidden" id="plan"><b>Structure</b><ol>${w.plan.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div><div class="entry hidden" id="phrases"><b>Useful phrases</b><ul>${w.phrases.map(t=>`<li>${esc(t)}</li>`).join('')}</ul></div><div class="entry hidden" id="tips"><b>Teacher's tip</b><p>${esc(w.tips)}</p></div><h3>Required elements</h3><ul>${w.rules.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><div class="note">The page checks word count and some required elements. It does not replace a teacher’s assessment.</div></aside></div>`}
function toggle(id){$(id)?.classList.toggle('hidden')}
function proofread(i){let s=drafts[i].trim(),n=countWords(s),m=[];if(n<70)m.push('Your text is too short for the task ('+n+' words).');if(n>160)m.push('Your text is longer than the suggested limit ('+n+' words).');if(i===0){let w=DATA.writing[0].prompt.match(/Begin: “([^”]+)” End: “([^”]+)”/);if(w){if(!s.startsWith(w[1]))m.push('Check the exact opening sentences given in the task.');if(!s.endsWith(w[2]))m.push('Check the exact final sentence given in the task.')}if(!/[“"].+?[”"]/.test(s))m.push('Include direct speech.')}
if(i===1&&s.split(/\n/)[0].trim().length<8)m.push('Add an article title.');if(i===2&&!/^(dear|hi|hello)\b/i.test(s))m.push('Start with a greeting (Dear / Hi ...).');if(i===2&&!/(best wishes|write back|see you|all the best|love|bye)/i.test(s))m.push('Add a friendly closing.');
let el=$('checkresult');el.innerHTML=m.length?`<b class="bad">Revise before sending:</b> ${m.map(esc).join(' ')}`:`<b class="good">Basic checks passed.</b> Re-read for grammar, spelling and meaning before you submit.`;return m.length===0}
function choose(i){if(checked[q]!==undefined)return;selected[q]=i;checked[q]=i===DATA.quiz[q][2];render()}
function quizView(){if(q>=15){let score=Object.values(checked).filter(Boolean).length;return `<section class="panel"><h1>Use of English: ${score} / 15</h1><p>Grammar explanations are shown after each answer. Your result will be included when you send your writing.</p><div class="inline"><button onclick="q=0;checked={};selected={};render()">Restart</button><button class="primary" onclick="go(5)">Send to teacher →</button></div></section>`}let x=DATA.quiz[q],done=checked[q]!==undefined;return `<div class="eyebrow">Use of English · Olympiad-style test</div><h1>Choose one answer</h1><div class="grid"><section class="panel"><div class="navrow"><b>Question ${q+1} / 15</b><span>${Object.keys(checked).length} completed</span></div><div class="progress"><div style="width:${(q+1)/15*100}%"></div></div><h2 style="margin-top:21px">${esc(x[0])}</h2><div class="answers">${x[1].map((a,i)=>`<button class="answer ${done?(i===x[2]?'correct':selected[q]===i?'wrong':''):''}" ${done?'disabled':''} onclick="choose(${i})">${'ABCD'[i]} · ${esc(a)}</button>`).join('')}</div>${done?`<div class="note"><b>${checked[q]?'Correct.':'Review:'}</b> ${esc(x[3])}</div>`:''}<div class="navrow"><span class="tiny">One attempt per question</span><button class="primary" ${!done?'disabled':''} onclick="q++;render()">${q===14?'Result →':'Next →'}</button></div></section><aside class="panel"><h2>Focus</h2><p>Conditionals, gerunds, infinitives, passive voice, tenses, prepositions and collocations.</p><div class="note">Choose your answer first; then read the explanation.</div></aside></div>`}
const DB='https://lzxcmrlubhjfdhtqvqzt.supabase.co';const KEY='sb_publishable_PmyZRwzWne8lqprej4XJQA_XiujtjEI';
function makePayload(){let score=Object.values(checked).filter(Boolean).length;return {p_test_id:'gabi:'+PAGE,p_test_title:'Габи · Olympiad Homework · Writing (3) + Use of English',p_score:score,p_max_score:15,p_answers:{student:'Габи',task_1_story:drafts[0],task_2_article:drafts[1],task_3_email:drafts[2],use_of_english_score:score,quiz_answer_count:Object.keys(checked).length,quiz_choices:Array.from({length:15},(_,i)=>selected[i]===undefined?null:DATA.quiz[i][1][selected[i]])},p_details:[]}}
async function post(payload){const response=await fetch(DB+'/rest/v1/rpc/submit_arina_homework',{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!response.ok)throw Error('Server returned '+response.status);return true}
async function flush(){if(!outbox||outbox.state!=='pending')return;try{await post(outbox.payload);outbox.state='sent';localStorage.setItem(STORAGE+':outbox',JSON.stringify(outbox));sent=true;if(tab===5)render()}catch(e){if(tab===5){let x=$('sendresult');if(x)x.textContent='Saved on this device, but not sent yet. Connect to the internet and press Retry.'}}}
window.addEventListener('online',flush);window.addEventListener('load',()=>setTimeout(flush,800));
function review(){let issues=[];for(let i=0;i<3;i++){let n=countWords(drafts[i]);if(n<70)issues.push(TABS[i+1]+': only '+n+' words.');if(n>160)issues.push(TABS[i+1]+': '+n+' words (too long).')}if(Object.keys(checked).length<15)issues.push('Use of English is not completed.');if(issues.length){$('sendresult').innerHTML='<b class="bad">Please correct:</b> '+issues.map(esc).join('<br>');reviewed=false;return}reviewed=true;$('sendresult').innerHTML='<b class="good">Ready for your final check.</b> Read all three texts below. You can go back and edit any answer before pressing Send.';renderSend(true)}
function renderSend(isReview=false){if(sent){$('app').innerHTML=`<section class="panel"><h1>✓ Homework sent to teacher</h1><p>All three writing tasks and the Use of English result have been sent to your teacher's inbox.</p><p class="muted">Your drafts remain saved on this device.</p></section>`;return}let ready=isReview||reviewed, pending=outbox?.state==='pending';$('app').innerHTML=`<div class="eyebrow">Final step · Teacher review</div><h1>Check and send your writing</h1><p class="muted">Your teacher will receive your complete Story, Article, Email and Use of English score.</p><div class="grid"><section class="panel"><div class="note">Before sending, check spelling (right-click any marked word), grammar, organisation and required word count. You can still edit each text.</div>${DATA.writing.map((w,i)=>`<div class="entry"><div class="navrow"><b>${esc(w.kind)} · ${countWords(drafts[i])} words</b><button onclick="go(${i+1})">Edit ✎</button></div><div class="preview">${esc(drafts[i]||'Not written yet')}</div></div>`).join('')}<div class="inline"><button class="blue" onclick="review()">1 · Check all tasks</button><button class="primary" id="sendBtn" ${!ready?'disabled':''} onclick="sendAll()">2 · Send to teacher</button></div><div id="sendresult" class="status">${pending?'Offline copy saved. Waiting for internet; press Retry to send.':ready?'Ready. Review the texts, then send.':'First finish your writing and the Use of English test.'}</div>${pending?`<button onclick="flush()">Retry sending</button>`:''}</section><aside class="panel"><h2>Submission checklist</h2><ul><li>Story: original opening and ending, direct speech.</li><li>Article: title, clear facts and an opinion.</li><li>Email: greeting, recommendation and closing.</li><li>Use of English: 15 questions.</li></ul><p class="tiny">Your work is submitted to the existing teacher inbox, not to a public page. Internet connection is required to deliver; drafts work offline.</p></aside></div>`}
async function sendAll(){if(!reviewed){review();return}if(!confirm('Send all three texts and your test result to the teacher? You can edit before sending.'))return;let payload=makePayload();outbox={state:'pending',payload};localStorage.setItem(STORAGE+':outbox',JSON.stringify(outbox));let btn=$('sendBtn');if(btn)btn.disabled=true;$('sendresult').textContent='Sending…';await flush();if(!sent){let b=$('sendBtn');if(b)b.disabled=false}}
function render(){nav();if(tab===0){$('app').innerHTML='<div class="eyebrow">25 landmarks · 5 regions · facts & pronunciation</div><h1>Discover the English-speaking world</h1><div class="inline"><a class="cultureLink" href="culture-challenge.html?v=20261124-2">Open new flashcards &amp; Kahoot challenge →</a></div><div id="cardstage"></div>';renderCard()}else if(tab<4){$('app').innerHTML=writingView()}else if(tab===4){$('app').innerHTML=quizView()}else{renderSend()}}
render();
</script></body></html>
