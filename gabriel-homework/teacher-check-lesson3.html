<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17323f"><title>Teacher Check · Gabi Lesson 3</title><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(135deg,#eefdfa,#fff8e8 55%,#f1edff);color:#17323f;min-height:100vh}.wrap{width:min(1040px,calc(100% - 28px));margin:28px auto}.hero{background:linear-gradient(120deg,#17323f,#4e4aa8);color:#fff;padding:26px 28px;border-radius:26px}.hero small{font-weight:950;letter-spacing:.14em;color:#a9eee8}.hero h1{font-size:clamp(30px,5vw,48px);margin:7px 0}.card{margin-top:16px;background:#fff;border:1px solid #dfe9ea;border-radius:22px;padding:20px;box-shadow:0 14px 35px #243e4315}textarea{width:100%;min-height:110px;border:2px solid #dce6e8;border-radius:13px;padding:12px;font:14px ui-monospace,Consolas,monospace}.btn{border:0;border-radius:13px;padding:12px 16px;background:#17323f;color:#fff;font-weight:950;cursor:pointer;margin-top:10px}.status{font-weight:900;margin-top:10px}.bad{color:#d84e65}.summary{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:15px 0}.stat{background:#f5faf9;border:1px solid #e1edeb;border-radius:17px;padding:16px}.stat b{font-size:28px}.stat span{display:block;color:#6d7d85;font-size:12px;font-weight:850}.rows{display:grid;gap:7px}.row{display:grid;grid-template-columns:46px 1fr 1fr 90px;gap:8px;align-items:center;border:1px solid #e3ebed;border-radius:13px;padding:9px 10px}.row.ok{background:#f4fff9;border-color:#cce8db}.row.no{background:#fff5f7;border-color:#f0c4cd}.head{background:#f3f7f7;font-size:12px;font-weight:950;text-transform:uppercase;color:#687a82}.ans{font-family:ui-monospace,Consolas,monospace;font-weight:900}.res{font-weight:1000}.good{color:#22835e}.wrong{color:#d84e65}.hidden{display:none}.note{color:#6d7d85;font-size:13px}@media(max-width:650px){.row{grid-template-columns:35px 1fr 1fr}.row .res{grid-column:3}.head{display:none}.summary{grid-template-columns:1fr}}</style></head><body><main class="wrap"><section class="hero"><small>TEACHER ONLY · GABI</small><h1>Lesson 3 checker</h1><p>The Hollow · Articles · Smell vocabulary</p></section><section class="card"><label><b>Paste Gabi’s homework code</b></label><textarea id="code" placeholder="Paste code here"></textarea><button class="btn" id="check">Check articles</button><div id="status" class="status"></div><p class="note">Only the 25 article choices are scored. Vocabulary cards are revision.</p></section><section class="card hidden" id="result"><div id="meta"></div><div class="summary" id="summary"></div><div class="rows" id="rows"></div></section></main><script>const key=['the','a','the','the','a','zero','the','a','the','the','zero','the','the','the','the','zero','the','zero','zero','a','a','the','the','zero','a'];const labels=['music festival','huge field','city','country','whole year','tickets','morning','small tent','main stage','day','incredible bands','headliner','highlight','stage','crowd','performances','food stalls','pizza','vegan burgers','T-shirt','souvenir','end','night','live music','special kind of energy'];function decode(s){s=s.trim().replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const bin=atob(s);return JSON.parse(new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0))))}function show(v){return v==='zero'?'—':v}document.getElementById('check').onclick=()=>{const st=document.getElementById('status');document.getElementById('result').classList.add('hidden');try{const p=decode(document.getElementById('code').value);if(p.assignment!=='gabi-hw-2026-09-01'||!Array.isArray(p.art)||p.art.length!==25)throw new Error('This is not the Lesson 3 homework code.');let score=0;let html='<div class="row head"><div>#</div><div>Gap</div><div>Student / correct</div><div>Result</div></div>';p.art.forEach((v,i)=>{const ok=v===key[i];if(ok)score++;html+=`<div class="row ${ok?'ok':'no'}"><div><b>${i+1}</b></div><div>${labels[i]}</div><div class="ans">${show(v)} / ${show(key[i])}</div><div class="res ${ok?'good':'wrong'}">${ok?'✓':'✕'}</div></div>`});document.getElementById('rows').innerHTML=html;document.getElementById('summary').innerHTML=`<div class="stat"><b>${score}/25</b><span>ARTICLES</span></div><div class="stat"><b>${25-score}</b><span>MISTAKES</span></div>`;const dt=p.submitted?new Date(p.submitted):null;document.getElementById('meta').innerHTML='<b>Module 1 · Lesson 3 · Homework</b>'+(dt&&!isNaN(dt)?'<br><span class="note">Submitted: '+dt.toLocaleString()+'</span>':'');document.getElementById('result').classList.remove('hidden');st.textContent='Submission opened ✓';st.className='status'}catch(e){st.textContent=e.message||'Could not open code.';st.className='status bad'}};</script></body></html>
