<style>.letter{background:#fff;border-radius:12px;padding:8px 12px;font-size:15.5px;line-height:1.4;border-left:5px solid var(--acc)}.letter p{margin:0 0 5px}</style>

<body>
<script src="../gabi-english-hub/skills.js?v=20261014a"></script>
<script>
/* Homework 8, after Unit 2 lesson 1 (Law and order). Crime vocabulary: learn (flashcards + memory) -> recall (definitions, situations)
   -> word families + mistakes -> something else: advice to a teenager (writing). Two activities per screen. */
const LETTER=`<h4>Teen Help · your advice page</h4><div class="letter"><p>Dear Teen Help,</p><p>My best friend wants me to help him take sweets from a shop after school. I just have to watch the door. He says everybody does it and it isn’t a real crime. I don’t want to lose my friend. What should I do?</p><p>Sam, 13</p></div><h4>Useful language</h4><ul><li>It <b>is</b> / <b>isn’t</b> a crime because …</li><li>You <b>should</b> … · You <b>could</b> … · <b>Why don’t you</b> … ?</li><li><b>If I were you, I’d</b> …</li><li>A real friend wouldn’t …</li></ul>`;
const has3=t=>{const W=['theft','thief','steal','stole','stolen','shoplift','shoplifting','shoplifter','crime','criminal','pickpocket','burglar','robbery','rob','vandalism','fraud','police','illegal','arrest','punish'];const n=t.toLowerCase();return W.filter(w=>new RegExp('\\b'+w).test(n)).length>=3};
Lesson.boot({kicker:'Homework · 14 October',hub:'./',steps:[
{stage:'Learn',title:'13 crimes',hint:'Learn the words. Turn each card over to see the translation. <small>Then find the pairs in Memory.</small>',cols:'1fr 1.15fr',
 acts:[
 {type:'cards',title:'Flashcards',items:[
  {w:'theft',ru:'кража',d:'taking something that belongs to another person',img:'../gabi-english-hub/assets/u2/crimes/p-theft.jpg'},
  {w:'pickpocketing',ru:'карманная кража',d:'stealing from someone’s pocket or bag without them noticing',img:'../gabi-english-hub/assets/u2/crimes/p-pickpocketing.jpg'},
  {w:'burglary',ru:'кража со взломом',d:'breaking into a building, usually a house, to steal something',img:'../gabi-english-hub/assets/u2/crimes/p-burglary.jpg'},
  {w:'robbery',ru:'ограбление',d:'stealing something using force or threats',img:'../gabi-english-hub/assets/u2/crimes/p-robbery.jpg'},
  {w:'vandalism',ru:'вандализм',d:'damaging someone else’s property on purpose',img:'../gabi-english-hub/assets/u2/crimes/p-vandalism.jpg'},
  {w:'fraud',ru:'мошенничество',d:'tricking someone to get their money or personal information',img:'../gabi-english-hub/assets/u2/crimes/p-fraud.jpg'},
  {w:'cybercrime',ru:'киберпреступление',d:'a crime that uses computers or the internet',img:'../gabi-english-hub/assets/u2/crimes/p-cybercrime.jpg'},
  {w:'assault',ru:'нападение',d:'attacking someone and hurting them',img:'../gabi-english-hub/assets/u2/crimes/p-assault.jpg'},
  {w:'harassment',ru:'травля, преследование',d:'bothering or upsetting someone again and again',img:'../gabi-english-hub/assets/u2/crimes/p-harassment.jpg'},
  {w:'shoplifting',ru:'кража в магазине',d:'stealing something from a shop',img:'../gabi-english-hub/assets/u2/crimes/p-shoplifting.jpg'},
  {w:'arson',ru:'поджог',d:'starting a fire on purpose',img:'../gabi-english-hub/assets/u2/crimes/p-arson.jpg'},
  {w:'kidnapping',ru:'похищение человека',d:'taking someone away by force and keeping them',img:'../gabi-english-hub/assets/u2/crimes/p-kidnapping.jpg'},
  {w:'mugging',ru:'уличное ограбление',d:'attacking someone in the street and taking their things',img:'../gabi-english-hub/assets/u2/crimes/p-mugging.jpg'}]},
 {type:'memory',title:'Memory',cols:4,pairs:[{t:'burglary',img:'../gabi-english-hub/assets/u2/crimes/p-burglary.jpg'},{t:'robbery',img:'../gabi-english-hub/assets/u2/crimes/p-robbery.jpg'},{t:'vandalism',img:'../gabi-english-hub/assets/u2/crimes/p-vandalism.jpg'},{t:'fraud',img:'../gabi-english-hub/assets/u2/crimes/p-fraud.jpg'},{t:'shoplifting',img:'../gabi-english-hub/assets/u2/crimes/p-shoplifting.jpg'},{t:'kidnapping',img:'../gabi-english-hub/assets/u2/crimes/p-kidnapping.jpg'}]}]},
{stage:'Practise',title:'Remember the words',hint:'Write the crime for each meaning. Then name the crime in each story. <small>Three wrong answers and the floor is lava: start again.</small>',cols:'1fr 1.05fr',
 acts:[
 {type:'gaps',title:'What is the word?',dense:true,items:[
  {pre:'stealing from someone’s pocket or bag without them noticing',post:'',ph:'p…',ans:['pickpocketing']},
  {pre:'starting a fire on purpose',post:'',ph:'a…',ans:['arson']},
  {pre:'a crime that uses computers or the internet',post:'',ph:'c…',ans:['cybercrime']},
  {pre:'bothering or upsetting someone again and again',post:'',ph:'h…',ans:['harassment']},
  {pre:'tricking someone to get their money',post:'',ph:'f…',ans:['fraud']},
  {pre:'taking someone away by force',post:'',ph:'k…',ans:['kidnapping']}]},
 {type:'quiz',title:'Floor is lava',label:'Story',lives:3,cols:2,opts:['arson','cybercrime','pickpocketing','harassment','assault','fraud','shoplifting','mugging'],items:[
  {q:'Someone sets fire to an empty school building at night.',a:'arson'},
  {q:'A hacker steals passwords from thousands of computers.',a:'cybercrime'},
  {q:'On the metro, a man takes a wallet from a woman’s bag. She doesn’t notice.',a:'pickpocketing'},
  {q:'Two boys keep sending nasty messages to a girl in their class.',a:'harassment'},
  {q:'A man hits another man outside a café and hurts him.',a:'assault'},
  {q:'Someone phones an old lady, says he is from her bank and gets her card number.',a:'fraud'},
  {q:'A teenager puts a phone case in his pocket and leaves the shop.',a:'shoplifting'},
  {q:'A man grabs a tourist’s bag in the street and runs away.',a:'mugging'}]}]},
{stage:'Practise',title:'Word families and mistakes',hint:'Sort the words: the crime, the person, the verb. Then find the mistake in each sentence.',cols:'1fr 1.1fr',
 acts:[
 {type:'sort',title:'Crime · criminal · verb',cols:['crime','criminal','verb'],items:[{t:'mugging',c:0},{t:'mugger',c:1},{t:'mug',c:2},{t:'shoplifting',c:0},{t:'shoplifter',c:1},{t:'shoplift',c:2},{t:'kidnapping',c:0},{t:'kidnapper',c:1},{t:'kidnap',c:2},{t:'burglary',c:0},{t:'burglar',c:1},{t:'burgle',c:2}]},
 {type:'hunt',title:'Error hunter',tip:'Click the word with the mistake.',items:[
  {s:'Someone robbed my phone on the bus.',bad:1,fix:'stole',why:'steal a thing · rob a person or a place'},
  {s:'The thiefs ran away before the police came.',bad:1,fix:'thieves',why:'one thief, two thieves'},
  {s:'A burglary broke into our neighbour’s house.',bad:1,fix:'burglar',why:'burglary = the crime, burglar = the person'},
  {s:'He was arrested for shoplifter.',bad:4,fix:'shoplifting',why:'arrested for + the crime'},
  {s:'Two men stole the bank last night.',bad:2,fix:'robbed',why:'rob a bank'},
  {s:'The police is looking for the mugger.',bad:2,fix:'are',why:'the police are'}]}]},
{stage:'Write',title:'Advice for Sam',hint:'Sam wrote to an advice page. Write your answer (60–90 words). <small>The list turns green as you write. Then press Submit to teacher.</small>',split:'minmax(0,.85fr) minmax(0,1.15fr)',
 side:{card:LETTER},
 act:{type:'write',submit:true,to:'Sam',subject:'Re: My friend and the sweets',min:60,max:90,ph:'Hi Sam,',checks:[
  {label:'Hi Sam, / Dear Sam,',test:t=>/^\s*(hi|hello|dear)\s+sam/i.test(t)},
  {label:'Is it a crime? Say why (because)',test:t=>/\bcrime\b/i.test(t)&&/\bbecause\b/i.test(t)},
  {label:'Advice: should / could / why don’t you',test:t=>/\b(should|could|why don['’]?t you|if i were you)\b/i.test(t)},
  {label:'Three crime words',test:t=>has3(t)},
  {label:'A friendly ending',test:t=>/(good luck|take care|best wishes|bye|write back)/i.test(t)}]}},
{stage:'Send',title:'Send your homework',hint:'Check your work on the left. Then press <b>Send to teacher</b> and paste the code in your chat with your teacher.',
 act:{type:'report',name:'Gabi · Homework · Crime words',assignment:'gabi-hw-2026-10-14',prefix:'G8'}}
]});
</script>
</body>
</html>
