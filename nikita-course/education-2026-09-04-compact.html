<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>Nikita · Mystery Place · compact worksheet</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eef5f3}#lesson{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="lesson" src="education-2026-09-04.html?v=20260905-current" title="Nikita lesson"></iframe>
<script>
const frame=document.getElementById('lesson');
frame.addEventListener('load',()=>{
  const w=frame.contentWindow,d=w.document;
  const work=d.getElementById('work');
  if(!work || d.getElementById('wsCompactReady')) return;

  const style=d.createElement('style');
  style.id='wsCompactReady';
  style.textContent=`
  #work{max-width:1160px;margin:0 auto}
  #work .wsShell{display:flex;flex-direction:column;gap:9px}
  #work .wsBar{background:#fff;border:1px solid #d6e5e1;border-radius:16px;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  #work .wsTitle{font-size:21px;font-weight:950;color:#12384b;white-space:nowrap}
  #work .wsSteps{display:flex;gap:5px}
  #work .wsStep{width:38px;height:34px;border:1px solid #b9d8d1;border-radius:9px;background:#f7fbfa;color:#22695f;font-weight:950;cursor:pointer}
  #work .wsStep.on{background:#2b8c7e;color:#fff;border-color:#2b8c7e}
  #work .wsPart{display:none;background:#fff;border:1px solid #d6e5e1;border-radius:17px;padding:14px 16px}
  #work .wsPart.on{display:block}
  #work .wsPart h3{font-size:23px;margin:0 0 4px;color:#12384b}
  #work .wsHint{margin:0 0 9px;color:#647b86;font-size:13px}
  #work .promptGrid,#work .factGrid,#work .tfGrid,#work .slotGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
  #work .promptCard{min-height:93px;border:1px solid #d6e5e1;border-radius:13px;background:#f8fcfb;padding:13px;font-size:16px;line-height:1.35;font-weight:800;display:flex;align-items:center}
  #work .matchBoard{display:grid;grid-template-columns:.9fr 1.35fr;gap:10px}
  #work .matchCol{display:grid;gap:5px}
  #work .matchBtn{border:1px solid #c8ddd8;background:#fbfefd;border-radius:10px;padding:8px 10px;text-align:left;min-height:38px;cursor:pointer;font-size:13px;line-height:1.2;color:#12384b}
  #work .matchBtn.term{font-weight:950;color:#22695f}
  #work .matchBtn.sel{outline:3px solid #e4ac45;background:#fff8e9}
  #work .matchBtn.done{background:#e6f6f1;border-color:#75bcaf;color:#176357;opacity:.68;cursor:default}
  #work .factCard{border:1px solid #d6e5e1;border-radius:12px;background:#fbfefd;padding:9px 11px;font-size:14px;line-height:1.3}
  #work .factCard input{margin-top:6px;padding:7px 9px;font-size:14px}
  #work .skillRow{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
  #work .tfRow{border:1px solid #d6e5e1;border-radius:12px;background:#fbfefd;padding:8px 9px;display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;min-height:67px}
  #work .tfText{font-size:13px;line-height:1.25;font-weight:750}
  #work .seg,#work .letters{display:flex;gap:4px}
  #work .seg button,#work .letters button{border:1px solid #bdd5d0;background:#fff;color:#22695f;border-radius:8px;padding:6px 8px;min-width:32px;font-weight:950;cursor:pointer}
  #work .seg button.pick,#work .letters button.pick{background:#2b8c7e;color:#fff;border-color:#2b8c7e}
  #work .seg button.good,#work .letters button.good{background:#e6f6ee;color:#17643a;border-color:#74c493}
  #work .seg button.bad,#work .letters button.bad{background:#fff0f2;color:#a52637;border-color:#df8995}
  #work .bank{display:flex;flex-wrap:wrap;gap:6px;margin:3px 0 10px}
  #work .bankWord{border:1px solid #c2dad4;background:#e9f4f2;color:#22695f;border-radius:999px;padding:7px 10px;font-weight:900;cursor:pointer}
  #work .bankWord.used{opacity:.28;pointer-events:none}
  #work .slotRow{border:1px solid #d6e5e1;border-radius:11px;background:#fbfefd;padding:9px 10px;font-size:13px;line-height:1.3}
  #work .slot{display:inline-flex;min-width:112px;min-height:28px;align-items:center;justify-content:center;border:1.5px dashed #80bbae;background:#fff;border-radius:8px;margin-left:4px;padding:3px 7px;font-weight:950;color:#22695f;cursor:pointer}
  #work .slot.good{border-style:solid;border-color:#72c18f;background:#e7f7ed;color:#17643a}
  #work .slot.bad{border-style:solid;border-color:#df8995;background:#fff0f2;color:#a52637}
  #work .causeGrid{display:grid;grid-template-columns:1.15fr .95fr;gap:10px}
  #work .causeRows{display:grid;gap:6px}
  #work .causeRow{border:1px solid #d6e5e1;background:#fbfefd;border-radius:11px;padding:8px 9px;display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;font-size:13px;font-weight:800}
  #work .effects{margin:0;padding-left:27px;display:grid;gap:5px}
  #work .effects li{margin:0;border:1px solid #d6e5e1;background:#fbfefd;border-radius:9px;padding:6px 8px;font-size:13px;line-height:1.22}
  #work .wsActions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:9px}
  #work .score{font-size:13px;font-weight:900;color:#12384b;min-height:18px}
  #work .miniAns{display:none;margin-top:8px;padding:8px 10px;border:1px dashed #80bbae;border-radius:10px;background:#eef8f5;font-size:13px;line-height:1.35}
  @media(max-width:900px){#work .promptGrid,#work .factGrid,#work .tfGrid,#work .slotGrid,#work .matchBoard,#work .causeGrid{grid-template-columns:1fr}#work .wsBar{align-items:flex-start}#work .wsTitle{white-space:normal}#work .tfRow,#work .causeRow{grid-template-columns:1fr}}
  `;
  d.head.appendChild(style);

  const defs=[
    ['reoffending','committing another crime after leaving prison'],
    ['vocational training','education that teaches practical job skills'],
    ['rehabilitation','helping somebody return to a normal life'],
    ['reintegration','becoming part of society again'],
    ['inmate','a person who is in prison'],
    ['self-esteem','confidence and respect for yourself'],
    ['restrictions','rules that limit what somebody can do'],
    ['curriculum','the subjects and content taught in a school']
  ];
  const order=[4,1,6,3,0,7,2,5];
  const tfStatements=[
    'Norwegian prisoners only study basic reading and writing.',
    'Prison education can help people find better jobs after release.',
    'Prisoners always study in very large classes.',
    'Some inmates can continue into higher education.',
    'Every prisoner is highly motivated to study from the beginning.',
    'Security rules can sometimes make education more difficult.',
    'The system sees prisoners as people who will eventually return to society.',
    'All former prisoners in Norway find jobs immediately.'
  ];
  const causes=['Prisoners learn job skills.','Prisoners continue their education.','People gain confidence.','Former prisoners find work.','Reoffending falls.'];

  work.innerHTML=`
  <div class="wsShell">
    <div class="wsBar"><div class="wsTitle">Interactive Worksheet</div><div class="wsSteps">${[1,2,3,4,5,6].map(n=>`<button class="wsStep ${n===1?'on':''}" data-step="${n}" onclick="showWorksheetPart(${n})">${n}</button>`).join('')}</div></div>

    <div class="wsPart on" data-part="1"><h3>1. Before You Look</h3><p class="wsHint">Discuss. One question per card — no writing needed.</p><div class="promptGrid"><div class="promptCard">What do you think prisoners usually do during the day?</div><div class="promptCard">Should prisoners be allowed to study at school or university?</div><div class="promptCard">Which is more important: punishment or rehabilitation? Why?</div><div class="promptCard">What skills could help a person start a new life after prison?</div></div><div class="wsActions"><button class="btn" onclick="showWorksheetPart(2)">Next →</button></div></div>

    <div class="wsPart" data-part="2"><h3>2. Key Vocabulary — Match</h3><p class="wsHint">Click a word, then its definition. Correct pairs lock automatically.</p><div class="matchBoard"><div class="matchCol" id="wTerms">${defs.map((x,i)=>`<button class="matchBtn term" data-i="${i}" onclick="pickWMatch(this,'term')">${x[0]}</button>`).join('')}</div><div class="matchCol" id="wDefs">${order.map(i=>`<button class="matchBtn" data-i="${i}" onclick="pickWMatch(this,'def')">${defs[i][1]}</button>`).join('')}</div></div><div class="wsActions"><button class="btn alt" onclick="resetWMatch()">Reset</button><div class="score" id="wMatchScore">0 / 8 matched</div><button class="btn" onclick="showWorksheetPart(3)">Next →</button></div></div>

    <div class="wsPart" data-part="3"><h3>3. Find It Fast</h3><p class="wsHint">Short answers only.</p><div class="factGrid"><div class="factCard"><b>1.</b> One aim is to reduce…<input id="wf1" type="text"></div><div class="factCard"><b>2.</b> Three practical skills:<div class="skillRow"><input id="wf2" type="text"><input id="wf3" type="text"><input id="wf4" type="text"></div></div><div class="factCard"><b>3.</b> Some prisoners can even study at…<input id="wf5" type="text"></div><div class="factCard"><b>4.</b> Teachers in Norwegian prisons are…<input id="wf6" type="text"></div><div class="factCard"><b>5.</b> Prisoners may have classrooms, libraries and…<input id="wf7" type="text"></div><div class="factCard"><b>6.</b> Each prisoner can have a personal ___ plan.<input id="wf8" type="text"></div></div><div class="wsActions"><button class="btn" onclick="checkWFacts()">Check</button><button class="btn alt" onclick="toggleW('wfAns')">Answers</button><div class="score" id="wfScore"></div><button class="btn" onclick="showWorksheetPart(4)">Next →</button></div><div class="miniAns" id="wfAns">1 reoffending / recidivism · 2 cooking, welding, carpentry / car mechanics / driving · 3 university · 4 civilian / regular teachers · 5 computers · 6 education / learning</div></div>

    <div class="wsPart" data-part="4"><h3>4. True, False or Not Given?</h3><p class="wsHint">Tap T, F or NG — no dropdown menus.</p><div class="tfGrid">${tfStatements.map((s,i)=>`<div class="tfRow" data-q="${i}"><div class="tfText">${i+1}. ${s}</div><div class="seg"><button onclick="pickWTF(${i},'True',this)">T</button><button onclick="pickWTF(${i},'False',this)">F</button><button onclick="pickWTF(${i},'Not Given',this)">NG</button></div></div>`).join('')}</div><div class="wsActions"><button class="btn" onclick="checkWTF()">Check</button><button class="btn alt" onclick="toggleW('wtfAns')">Answers</button><div class="score" id="wtfScore"></div><button class="btn" onclick="showWorksheetPart(5)">Next →</button></div><div class="miniAns" id="wtfAns">1 F · 2 T · 3 F · 4 T · 5 NG · 6 T · 7 T · 8 F</div></div>

    <div class="wsPart" data-part="5"><h3>5. Complete the Ideas</h3><p class="wsHint">Click the words. They fill the blanks in order. Click a filled blank to clear it.</p><div class="bank">${['skills','confidence','punishment','society','opportunities','crime','curriculum','restrictions'].map(x=>`<button class="bankWord" data-word="${x}" onclick="useWWord(this)">${x}</button>`).join('')}</div><div class="slotGrid"><div class="slotRow">1. Education can give prisoners useful job <button class="slot" data-i="0" onclick="clearWSlot(this)">_____</button></div><div class="slotRow">2. Studying may help prisoners build <button class="slot" data-i="1" onclick="clearWSlot(this)">_____</button></div><div class="slotRow">3. Better qualifications create more job <button class="slot" data-i="2" onclick="clearWSlot(this)">_____</button></div><div class="slotRow">4. Reintegration means becoming part of <button class="slot" data-i="3" onclick="clearWSlot(this)">_____</button> again.</div><div class="slotRow">5. Rehabilitation rather than only <button class="slot" data-i="4" onclick="clearWSlot(this)">_____</button></div><div class="slotRow">6. Education may help break the cycle of <button class="slot" data-i="5" onclick="clearWSlot(this)">_____</button></div></div><div class="wsActions"><button class="btn" onclick="checkWSlots()">Check</button><button class="btn alt" onclick="resetWSlots()">Reset</button><div class="score" id="wslotScore"></div><button class="btn" onclick="showWorksheetPart(6)">Next →</button></div></div>

    <div class="wsPart" data-part="6"><h3>6. Cause → Effect</h3><p class="wsHint">Choose A–E for each cause. One tap per answer.</p><div class="causeGrid"><div class="causeRows">${causes.map((c,i)=>`<div class="causeRow" data-c="${i}"><span>${i+1}. ${c}</span><div class="letters">${['A','B','C','D','E'].map(l=>`<button onclick="pickWCause(${i},'${l}',this)">${l}</button>`).join('')}</div></div>`).join('')}</div><ol type="A" class="effects"><li>communities may become safer.</li><li>so they may feel more able to change their lives.</li><li>so they may have more opportunities after release.</li><li>so they may be less likely to return to crime.</li><li>so they can get qualifications they missed earlier.</li></ol></div><div class="wsActions"><button class="btn" onclick="checkWCause()">Check</button><button class="btn alt" onclick="toggleW('wcauseAns')">Answers</button><div class="score" id="wcauseScore"></div><button class="btn" onclick="goWorksheetNext()">Next: Education inside →</button></div><div class="miniAns" id="wcauseAns">1 C · 2 E · 3 B · 4 D · 5 A</div></div>
  </div>`;

  w.showWorksheetPart=n=>{d.querySelectorAll('#work .wsPart').forEach(x=>x.classList.toggle('on',+x.dataset.part===n));d.querySelectorAll('#work .wsStep').forEach(x=>x.classList.toggle('on',+x.dataset.step===n));d.querySelector('.stage').scrollTop=0};
  w.toggleW=id=>{const x=d.getElementById(id);x.style.display=x.style.display==='block'?'none':'block'};

  let mt=null,md=null,matched=0;
  w.pickWMatch=(btn,type)=>{if(btn.classList.contains('done'))return;const col=type==='term'?d.getElementById('wTerms'):d.getElementById('wDefs');col.querySelectorAll('.matchBtn').forEach(x=>x.classList.remove('sel'));btn.classList.add('sel');if(type==='term')mt=btn;else md=btn;if(mt&&md){if(mt.dataset.i===md.dataset.i){mt.classList.remove('sel');md.classList.remove('sel');mt.classList.add('done');md.classList.add('done');matched++;d.getElementById('wMatchScore').textContent=matched+' / 8 matched'}else{const a=mt,b=md;setTimeout(()=>{a.classList.remove('sel');b.classList.remove('sel')},300)}mt=null;md=null}};
  w.resetWMatch=()=>{matched=0;mt=md=null;d.querySelectorAll('#work .matchBtn').forEach(x=>{x.classList.remove('sel','done')});d.getElementById('wMatchScore').textContent='0 / 8 matched'};

  const norm=s=>String(s||'').toLowerCase().trim().replace(/[.]/g,'');
  w.checkWFacts=()=>{let good=0;const checks=[['wf1',['reoffending','recidivism']],['wf5',['university']],['wf6',['civilian teachers','regular teachers','civilian','regular']],['wf7',['computers','computer']],['wf8',['education','learning']]];checks.forEach(([id,ans])=>{const el=d.getElementById(id),ok=ans.some(a=>norm(el.value)===norm(a));el.style.borderColor=ok?'#198754':'#c93c4b';if(ok)good++});const pool=['cooking','cookery','car mechanics','mechanics','auto mechanics','welding','carpentry','driving','driver training','mechanic','car mechanic','welder'];['wf2','wf3','wf4'].forEach(id=>{const el=d.getElementById(id),ok=pool.includes(norm(el.value));el.style.borderColor=ok?'#198754':'#c93c4b';if(ok)good++});d.getElementById('wfScore').textContent='Score: '+good+' / 8'};

  const tfPick={};
  w.pickWTF=(i,val,btn)=>{tfPick[i]=val;btn.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('pick','good','bad'));btn.classList.add('pick')};
  w.checkWTF=()=>{const correct=['False','True','False','True','Not Given','True','True','False'];let score=0;d.querySelectorAll('#work .tfRow').forEach((row,i)=>row.querySelectorAll('button').forEach(b=>{b.classList.remove('good','bad');if(b.classList.contains('pick')){const val=b.textContent==='T'?'True':b.textContent==='F'?'False':'Not Given';const ok=val===correct[i];b.classList.add(ok?'good':'bad');if(ok)score++}}));d.getElementById('wtfScore').textContent='Score: '+score+' / 8'};

  w.useWWord=btn=>{const slot=[...d.querySelectorAll('#work .slot')].find(s=>!s.dataset.value);if(!slot)return;slot.dataset.value=btn.dataset.word;slot.textContent=btn.dataset.word;btn.classList.add('used');slot.classList.remove('good','bad')};
  w.clearWSlot=slot=>{if(!slot.dataset.value)return;const word=slot.dataset.value;const btn=[...d.querySelectorAll('#work .bankWord')].find(b=>b.dataset.word===word);if(btn)btn.classList.remove('used');delete slot.dataset.value;slot.textContent='_____';slot.classList.remove('good','bad');d.getElementById('wslotScore').textContent=''};
  w.resetWSlots=()=>{d.querySelectorAll('#work .slot').forEach(s=>{delete s.dataset.value;s.textContent='_____';s.classList.remove('good','bad')});d.querySelectorAll('#work .bankWord').forEach(b=>b.classList.remove('used'));d.getElementById('wslotScore').textContent=''};
  w.checkWSlots=()=>{const correct=['skills','confidence','opportunities','society','punishment','crime'];let score=0;d.querySelectorAll('#work .slot').forEach((s,i)=>{const ok=s.dataset.value===correct[i];s.classList.remove('good','bad');s.classList.add(ok?'good':'bad');if(ok)score++});d.getElementById('wslotScore').textContent='Score: '+score+' / 6'};

  const causePick={};
  w.pickWCause=(i,val,btn)=>{causePick[i]=val;btn.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('pick','good','bad'));btn.classList.add('pick')};
  w.checkWCause=()=>{const correct=['C','E','B','D','A'];let score=0;d.querySelectorAll('#work .causeRow').forEach((row,i)=>row.querySelectorAll('button').forEach(b=>{b.classList.remove('good','bad');if(b.classList.contains('pick')){const ok=b.textContent===correct[i];b.classList.add(ok?'good':'bad');if(ok)score++}}));d.getElementById('wcauseScore').textContent='Score: '+score+' / 5'};
  w.goWorksheetNext=()=>{const nav=d.querySelector('.nav[data-s="deep"]');if(nav)nav.click()};
});
</script>
</body>
</html>
