<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Education · 30 August</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef8ff,#fff8ea 52%,#eff8f4);color:#153448}.wrap{max-width:920px;margin:auto;padding:18px 24px}.head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:10px}.eyebrow{font-size:10px;font-weight:950;letter-spacing:.14em;color:#087c78}.head h1{font-size:28px;margin:4px 0 0}.date{font-weight:950;background:#fff;border-radius:999px;padding:8px 13px;box-shadow:0 6px 16px #163b5012;font-size:13px}.stackwrap{max-width:500px;margin:10px auto}.counter{text-align:center;font-weight:900;color:#6a4fc2;margin-bottom:7px;font-size:12px}.stack{height:370px;position:relative}.card{position:absolute;inset:0;background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 16px 38px #15394f20;border:1px solid #e1e9e7;display:none;cursor:pointer}.card.active{display:block}.photo{height:240px;background-size:cover;background-position:center}.face{height:130px;padding:12px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.word{font-size:27px;font-weight:1000;color:#16384c}.hint{margin-top:5px;font-size:11px;color:#7b8d96;font-weight:800}.back{display:none}.card.flipped .front{display:none}.card.flipped .back{display:flex}.translation{font-size:22px;font-weight:950;color:#6243c2}.definition{font-size:13px;line-height:1.35;margin-top:7px;color:#46606d}.controls{display:flex;justify-content:center;align-items:center;gap:9px;margin-top:14px}.arrow,.sound,.flip{border:0;cursor:pointer;font-weight:950}.arrow,.sound{width:42px;height:42px;border-radius:50%;font-size:20px}.arrow{background:#153448;color:#fff}.sound{background:#e9e4ff;color:#5f43b7;font-size:17px}.flip{padding:11px 18px;border-radius:13px;background:#ffca3a;color:#2b240d;font-size:12px}.dots{text-align:center;margin-top:9px;color:#82949c;font-size:11px}@media(max-width:720px){.wrap{padding:12px}.head h1{font-size:25px}.stackwrap{max-width:430px}.stack{height:335px}.photo{height:215px}.face{height:120px}.word{font-size:24px}}</style></head><body><main class="wrap"><div class="head"><div><div class="eyebrow">OUTCOMES · UNIT 8</div><h1>Education</h1></div><div class="date">30 August</div></div><div class="stackwrap"><div class="counter" id="counter"></div><div class="stack" id="stack"></div><div class="controls"><button class="arrow" onclick="move(-1)">‹</button><button class="sound" onclick="speak(event)">🔊</button><button class="flip" onclick="flipCard()">FLIP</button><button class="arrow" onclick="move(1)">›</button></div><div class="dots">word + picture → flip for meaning</div></div></main><script>const cards=[['rehabilitation','реабилитация','the process of helping someone return to a normal, useful life','https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=900&q=82'],['deterrence','сдерживание, устрашение','preventing crime by making people fear the consequences','https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=900&q=82'],['recidivism','повторная преступность','the tendency of a convicted criminal to reoffend','https://images.unsplash.com/photo-1567360425618-1594206637d2?auto=format&fit=crop&w=900&q=82'],['incarceration','лишение свободы','being kept in prison','https://images.unsplash.com/photo-1567360425618-1594206637d2?auto=format&fit=crop&w=900&q=82'],['conviction','обвинительный приговор','an official decision that someone is guilty','https://images.unsplash.com/photo-1589994965851-a8f479c573a9?auto=format&fit=crop&w=900&q=82'],['retribution','возмездие','punishment given because someone deserves it','https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=900&q=82'],['inmate','заключённый','a person who lives in a prison','https://images.unsplash.com/photo-1567360425618-1594206637d2?auto=format&fit=crop&w=900&q=82'],['qualification','квалификация / диплом','an official record showing that you completed training or study','https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=900&q=82'],['vocational training','профессиональное обучение','practical education for a particular job','https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&w=900&q=82'],['employment','трудоустройство, занятость','having paid work','https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=900&q=82'],['do a course','пройти курс','study a particular subject for a period of time','https://images.unsplash.com/photo-1524178232363-1fb2b075b655?auto=format&fit=crop&w=900&q=82'],['get a degree','получить диплом / степень','successfully complete a university programme','https://images.unsplash.com/photo-1523580846011-d3a5bc25702b?auto=format&fit=crop&w=900&q=82'],['graduate','окончить учебное заведение','successfully finish a course at a school or university','https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=900&q=82'],['go to university','поступить / учиться в университете','begin studying at university','https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=900&q=82']];let cur=0;stack.innerHTML=cards.map((c,i)=>`<div class="card ${i===0?'active':''}" onclick="flipCard()"><div class="photo" style="background-image:url('${c[3]}')"></div><div class="face front"><div class="word">${c[0]}</div><div class="hint">tap to flip</div></div><div class="face back"><div class="translation">${c[1]}</div><div class="definition">${c[2]}</div></div></div>`).join('');function update(){document.querySelectorAll('.card').forEach((x,i)=>{x.classList.toggle('active',i===cur);if(i!==cur)x.classList.remove('flipped')});counter.textContent=`${cur+1} / ${cards.length}`}function move(n){cur=(cur+n+cards.length)%cards.length;update()}function flipCard(){document.querySelectorAll('.card')[cur].classList.toggle('flipped')}function speak(e){e.stopPropagation();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cards[cur][0]);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}update();</script></body></html>
