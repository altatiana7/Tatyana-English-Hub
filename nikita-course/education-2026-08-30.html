<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>30 August · Quizlet</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Segoe UI,Arial,sans-serif;background:linear-gradient(135deg,#eef8ff,#fff8ea 52%,#eff8f4);color:#153448}.wrap{max-width:820px;margin:auto;padding:16px 22px}.head{text-align:center;margin-bottom:8px}.eyebrow{font-size:9px;font-weight:950;letter-spacing:.14em;color:#087c78}.head h1{font-size:24px;margin:4px 0 2px}.subtitle{font-size:11px;color:#738994;font-weight:800}.stackwrap{max-width:340px;margin:10px auto}.counter{text-align:center;font-weight:900;color:#6a4fc2;margin-bottom:6px;font-size:11px}.stack{height:260px;position:relative}.card{position:absolute;inset:0;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 12px 28px #15394f1d;border:1px solid #e1e9e7;display:none;cursor:pointer}.card.active{display:block}.photo{height:165px;background-size:cover;background-position:center;position:relative}.scene{position:absolute;left:8px;bottom:8px;background:rgba(9,38,52,.82);color:white;padding:5px 8px;border-radius:999px;font-size:8px;font-weight:900;letter-spacing:.05em}.face{height:95px;padding:9px 14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.word{font-size:21px;font-weight:1000;color:#16384c}.hint{margin-top:3px;font-size:9px;color:#7b8d96;font-weight:800}.back{display:none}.card.flipped .front{display:none}.card.flipped .back{display:flex}.translation{font-size:17px;font-weight:950;color:#6243c2}.definition{font-size:10px;line-height:1.3;margin-top:5px;color:#46606d}.controls{display:flex;justify-content:center;align-items:center;gap:7px;margin-top:10px}.arrow,.sound,.flip{border:0;cursor:pointer;font-weight:950}.arrow,.sound{width:34px;height:34px;border-radius:50%;font-size:16px}.arrow{background:#153448;color:#fff}.sound{background:#e9e4ff;color:#5f43b7;font-size:14px}.flip{padding:9px 14px;border-radius:11px;background:#ffca3a;color:#2b240d;font-size:10px}.dots{text-align:center;margin-top:7px;color:#82949c;font-size:9px}@media(max-width:720px){.wrap{padding:10px}.stackwrap{max-width:310px}.stack{height:240px}.photo{height:150px}.face{height:90px}.word{font-size:19px}}</style></head><body><main class="wrap"><div class="head"><div class="eyebrow">30 AUGUST</div><h1>Quizlet Cards</h1><div class="subtitle">Education vocabulary</div></div><div class="stackwrap"><div class="counter" id="counter"></div><div class="stack" id="stack"></div><div class="controls"><button class="arrow" onclick="move(-1)">‹</button><button class="sound" onclick="speak(event)">🔊</button><button class="flip" onclick="flipCard()">FLIP</button><button class="arrow" onclick="move(1)">›</button></div><div class="dots">word + picture → flip for meaning</div></div></main><script>const cards=[['rehabilitation','реабилитация','the process of helping someone return to a normal, useful life','https://images.unsplash.com/photo-1764173039323-04d1b1d85364?auto=format&fit=crop&w=700&q=82','STUDY · REBUILD'],['deterrence','сдерживание, устрашение','preventing crime by making people fear the consequences','https://images.unsplash.com/photo-1767972159674-460283907c21?auto=format&fit=crop&w=700&q=82','CONSEQUENCES'],['recidivism','повторная преступность','the tendency of a convicted criminal to reoffend','https://images.unsplash.com/photo-1601229542870-338109ad2789?auto=format&fit=crop&w=700&q=82','BACK TO PRISON'],['incarceration','лишение свободы','being kept in prison','https://images.unsplash.com/photo-1601229542870-338109ad2789?auto=format&fit=crop&w=700&q=82','PRISON'],['conviction','обвинительный приговор','an official decision that someone is guilty','https://images.unsplash.com/photo-1767972159674-460283907c21?auto=format&fit=crop&w=700&q=82','COURT DECISION'],['retribution','возмездие','punishment given because someone deserves it','https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=700&q=82','PUNISHMENT'],['inmate','заключённый','a person who lives in a prison','https://images.unsplash.com/photo-1567360425618-1594206637d2?auto=format&fit=crop&w=700&q=82','PRISONER'],['qualification','квалификация / диплом','an official record showing that you completed training or study','https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&w=700&q=82','DIPLOMA'],['vocational training','профессиональное обучение','practical education for a particular job','https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&w=700&q=82','LEARN A JOB'],['employment','трудоустройство, занятость','having paid work','https://images.unsplash.com/photo-1521737711867-e3b97375f902?auto=format&fit=crop&w=700&q=82','WORK'],['do a course','пройти курс','study a particular subject for a period of time','https://images.unsplash.com/photo-1758270704587-43339a801396?auto=format&fit=crop&w=700&q=82','TAKE CLASSES'],['get a degree','получить диплом / степень','successfully complete a university programme','https://images.unsplash.com/photo-1523580846011-d3a5bc25702b?auto=format&fit=crop&w=700&q=82','DEGREE'],['graduate','окончить учебное заведение','successfully finish a course at a school or university','https://images.unsplash.com/photo-1523050854058-8df90110c9f1?auto=format&fit=crop&w=700&q=82','GRADUATION'],['go to university','поступить / учиться в университете','begin studying at university','https://images.unsplash.com/photo-1562774053-701939374585?auto=format&fit=crop&w=700&q=82','UNIVERSITY']];let cur=0;stack.innerHTML=cards.map((c,i)=>`<div class="card ${i===0?'active':''}" onclick="flipCard()"><div class="photo" style="background-image:url('${c[3]}')"><div class="scene">${c[4]}</div></div><div class="face front"><div class="word">${c[0]}</div><div class="hint">tap to flip</div></div><div class="face back"><div class="translation">${c[1]}</div><div class="definition">${c[2]}</div></div></div>`).join('');function update(){document.querySelectorAll('.card').forEach((x,i)=>{x.classList.toggle('active',i===cur);if(i!==cur)x.classList.remove('flipped')});counter.textContent=`${cur+1} / ${cards.length}`}function move(n){cur=(cur+n+cards.length)%cards.length;update()}function flipCard(){document.querySelectorAll('.card')[cur].classList.toggle('flipped')}function speak(e){e.stopPropagation();speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cards[cur][0]);u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}update();</script></body></html>
