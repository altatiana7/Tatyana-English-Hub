<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Katya · Teacher Hub</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7efeb;font-family:Arial,Helvetica,sans-serif;color:#3b292d}
button,textarea{font:inherit}
button{cursor:pointer}

/* Exact supplied cover stays unchanged: 3:2, centered, no crop/no stretch. */
.stage{
  position:fixed;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:min(100vw,150vh);
  height:min(100vh,66.6666667vw);
  aspect-ratio:3/2;
  overflow:hidden;
  background:#f7efeb;
}
.cover{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}

/* Invisible interactive zones aligned to the supplied image. */
.hot{position:absolute;z-index:5;border:0;background:transparent;padding:0}
.hot:focus-visible{outline:2px solid rgba(183,123,120,.8);outline-offset:-2px;border-radius:10px}
#m1l1{left:2.2%;top:23.8%;width:14.6%;height:6.0%}
#m1l2{left:2.2%;top:29.8%;width:14.6%;height:6.0%}
#m1l3{left:2.2%;top:35.8%;width:14.6%;height:6.0%}
#m2{left:.7%;top:42.7%;width:16.7%;height:5.5%}
#m3{left:.7%;top:49.1%;width:16.7%;height:5.5%}
#m4{left:.7%;top:55.5%;width:16.7%;height:5.5%}
#m5{left:.7%;top:61.9%;width:16.7%;height:5.5%}
#m6{left:.7%;top:68.3%;width:16.7%;height:5.5%}
#m7{left:.7%;top:74.7%;width:16.7%;height:5.5%}
#m8{left:.7%;top:81.1%;width:16.7%;height:5.5%}
#notesHot{left:.7%;top:90.3%;width:16.7%;height:6.0%}

/* Full-screen lesson layer. */
.lesson-view{position:fixed;inset:0;z-index:30;background:#fff;display:none}
.lesson-view.on{display:grid;grid-template-rows:48px 1fr}
.lesson-bar{display:flex;align-items:center;gap:10px;background:#f0d9d5;border-bottom:1px solid #dfbeb9;padding:7px 10px}
.lesson-bar button{border:0;border-radius:10px;background:#d59e99;color:#fff;padding:8px 13px;font-weight:800}
.lesson-title{font-size:14px;font-weight:800;color:#4b3034;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lesson-frame{width:100%;height:100%;border:0;background:#fff}

/* Module pop-up for future modules. */
.modal{position:fixed;inset:0;z-index:25;display:none;place-items:center;background:rgba(55,35,40,.28);padding:20px}
.modal.on{display:grid}
.modal-card{width:min(470px,88vw);background:#fff9f6;border:1px solid #ead4d1;border-radius:24px;padding:21px;box-shadow:0 24px 70px rgba(70,40,45,.25)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.modal-head h2{margin:0;font-family:Georgia,serif;font-size:23px;color:#4a3035}
.modal-close{border:0;background:transparent;color:#684b50;font-size:25px;padding:2px 6px}
.lesson-choice{width:100%;border:0;border-radius:16px;background:#ead4d1;color:#493437;padding:13px 15px;margin:6px 0;text-align:left;font-weight:800}

/* Teacher notes. */
.notes{position:fixed;z-index:35;right:24px;top:24px;bottom:24px;width:min(390px,46vw);display:none;flex-direction:column;background:#fff9f6;border:1px solid #ead4d1;border-radius:22px;padding:16px;box-shadow:0 24px 70px rgba(70,40,45,.25)}
.notes.on{display:flex}
.notes h3{margin:0 0 10px;font-family:Georgia,serif;color:#493437}
.notes textarea{flex:1;min-height:0;border:1px solid #e3ccc8;border-radius:14px;padding:12px;resize:none;background:#fff}
.note-actions{display:flex;gap:8px;margin-top:10px}
.note-actions button{border:0;border-radius:11px;padding:9px 12px;font-weight:800}
.save{background:#d59e99;color:#fff}.clear{background:#efe2de;color:#5b4044}.close-note{margin-left:auto;background:#efe2de;color:#5b4044}
</style>
</head>
<body>

<main class="stage" aria-label="Katya English Hub">
  <img class="cover" src="/Tatyana-English-Hub/w-4n8q7m2p9x6k3r5t/katya-cover-exact.webp?v=20260928-0905" alt="Katya English Hub">
  <button id="m1l1" class="hot" aria-label="Lesson 1 Elections in Russia"></button>
  <button id="m1l2" class="hot" aria-label="Lesson 2 Generations"></button>
  <button id="m1l3" class="hot" aria-label="Lesson 3 Useful Tools"></button>
  <button id="m2" class="hot" aria-label="Module 2"></button>
  <button id="m3" class="hot" aria-label="Module 3"></button>
  <button id="m4" class="hot" aria-label="Module 4"></button>
  <button id="m5" class="hot" aria-label="Module 5"></button>
  <button id="m6" class="hot" aria-label="Module 6"></button>
  <button id="m7" class="hot" aria-label="Module 7"></button>
  <button id="m8" class="hot" aria-label="Module 8"></button>
  <button id="notesHot" class="hot" aria-label="Teacher Notes"></button>
</main>

<section id="lessonView" class="lesson-view" aria-hidden="true">
  <div class="lesson-bar">
    <button id="backBtn">← Назад</button>
    <div id="lessonTitle" class="lesson-title">Lesson</div>
  </div>
  <iframe id="lessonFrame" class="lesson-frame" title="Katya lesson"></iframe>
</section>

<div id="moduleModal" class="modal" aria-hidden="true">
  <div class="modal-card">
    <div class="modal-head"><h2 id="moduleTitle">Module</h2><button id="closeModal" class="modal-close">×</button></div>
    <div id="moduleLessons"></div>
  </div>
</div>

<aside id="notes" class="notes">
  <div style="display:flex;align-items:center;gap:8px">
    <h3>Teacher Notes</h3>
    <button id="closeNotes" class="close-note">×</button>
  </div>
  <textarea id="noteText" placeholder="Answers, mistakes, ideas, revision notes..."></textarea>
  <div class="note-actions">
    <button id="saveNote" class="save">Save</button>
    <button id="clearNote" class="clear">Clear</button>
  </div>
</aside>

<script>
const lessons={
  m1l1:{title:'Module 1 · Lesson 1 · Elections in Russia',url:'../kate-english-hub/extra-practice-elections-russia.html'},
  m1l2:{title:'Module 1 · Lesson 2 · Generations',url:'../kate-english-hub/homework-lesson2-generations.html'},
  m1l3:{title:'Module 1 · Lesson 3 · Useful Tools',url:'../kate-english-hub/useful-tools-false-synonyms.html'}
};

const lessonView=document.getElementById('lessonView');
const frame=document.getElementById('lessonFrame');
const title=document.getElementById('lessonTitle');

function openLesson(t,u){
  title.textContent=t;
  frame.src=u||'about:blank';
  lessonView.classList.add('on');
  lessonView.setAttribute('aria-hidden','false');
}
Object.entries(lessons).forEach(([id,l])=>{
  document.getElementById(id).addEventListener('click',()=>openLesson(l.title,l.url));
});
document.getElementById('backBtn').addEventListener('click',()=>{
  lessonView.classList.remove('on');
  lessonView.setAttribute('aria-hidden','true');
  frame.src='about:blank';
});

const modal=document.getElementById('moduleModal');
for(let n=2;n<=8;n++){
  document.getElementById('m'+n).addEventListener('click',()=>{
    document.getElementById('moduleTitle').textContent='Module '+n;
    const holder=document.getElementById('moduleLessons');
    holder.innerHTML='';
    for(let i=1;i<=3;i++){
      const b=document.createElement('button');
      b.className='lesson-choice';
      b.textContent='Lesson '+i;
      b.addEventListener('click',()=>{
        modal.classList.remove('on');
        openLesson('Module '+n+' · Lesson '+i,'about:blank');
      });
      holder.appendChild(b);
    }
    modal.classList.add('on');
    modal.setAttribute('aria-hidden','false');
  });
}
document.getElementById('closeModal').onclick=()=>{modal.classList.remove('on');modal.setAttribute('aria-hidden','true')};
modal.addEventListener('click',e=>{if(e.target===modal){modal.classList.remove('on');modal.setAttribute('aria-hidden','true')}});

const notes=document.getElementById('notes');
const noteText=document.getElementById('noteText');
document.getElementById('notesHot').onclick=()=>{
  noteText.value=localStorage.getItem('katya_teacher_notes')||'';
  notes.classList.add('on');
};
document.getElementById('closeNotes').onclick=()=>notes.classList.remove('on');
document.getElementById('saveNote').onclick=()=>localStorage.setItem('katya_teacher_notes',noteText.value);
document.getElementById('clearNote').onclick=()=>{noteText.value='';localStorage.removeItem('katya_teacher_notes')};
</script>
</body>
</html>
