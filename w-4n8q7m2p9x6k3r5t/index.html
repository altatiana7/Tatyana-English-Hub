    document.getElementById('moduleLessons').innerHTML=[1,2,3].map(i=>'<button class="lessonChoice" data-t="Module '+n+' · Lesson '+i+'">Lesson '+i+'</button>').join('');
    document.querySelectorAll('.lessonChoice').forEach(b=>b.onclick=()=>openLesson(b.dataset.t,'about:blank'));
    document.getElementById('modal').classList.add('on');
  };
}
document.getElementById('back').onclick=()=>{document.getElementById('lessonView').classList.remove('on');document.getElementById('frame').src='about:blank'};
document.getElementById('closeModal').onclick=()=>document.getElementById('modal').classList.remove('on');
document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')e.currentTarget.classList.remove('on')};
const notes=document.getElementById('notes'), ta=document.getElementById('noteText');
document.getElementById('notesHot').onclick=()=>{ta.value=localStorage.getItem('katya_teacher_notes')||'';notes.classList.toggle('on')};
document.getElementById('saveNote').onclick=()=>localStorage.setItem('katya_teacher_notes',ta.value);
document.getElementById('clearNote').onclick=()=>{ta.value='';localStorage.removeItem('katya_teacher_notes')};
</script>
</body></html>
