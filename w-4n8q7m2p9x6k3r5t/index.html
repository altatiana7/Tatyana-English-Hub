<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Katya · Teacher Hub</title>
<style>
:root{
  --deep:#123e49;
  --deep2:#184f5b;
  --active:#6f9fab;
  --ink:#103548;
  --muted:#5b7280;
  --line:rgba(255,255,255,.14);
  --paper:#ffffff;
  --soft:#eef6f7;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#edf3f3;color:var(--ink)}
button,textarea{font:inherit}
button{cursor:pointer}
#app{width:100%;height:100%;display:grid;grid-template-columns:232px 1fr}

/* LEFT PANEL — matches reference */
.sidebar{
  position:relative;
  z-index:50;
  height:100vh;
  background:linear-gradient(180deg,#123f49 0%,#0e3640 100%);
  color:#fff;
  padding:18px 14px 16px;
  overflow-y:auto;
  box-shadow:8px 0 30px rgba(9,36,43,.18);
  scrollbar-width:thin;
}
.logo-mark{
  width:46px;height:46px;margin:0 auto 12px;position:relative;opacity:.96
}
.logo-mark:before,.logo-mark:after{
  content:"";position:absolute;top:4px;width:19px;height:32px;border:2px solid rgba(255,255,255,.86);border-top-left-radius:13px;border-top-right-radius:3px
}
.logo-mark:before{left:4px;transform:skewY(6deg)}
.logo-mark:after{right:4px;transform:scaleX(-1) skewY(6deg)}
.brand{text-align:center;margin-bottom:12px}
.brand strong{display:block;font-family:Georgia,serif;font-size:16px;letter-spacing:.01em}
.brand span{display:block;font-size:8px;letter-spacing:.16em;text-transform:uppercase;opacity:.72;margin-top:3px}
.home-btn{
  width:100%;border:0;border-radius:12px;padding:10px 12px;margin:0 0 10px;
  color:#fff;background:rgba(117,167,180,.72);font-size:12px;font-weight:800;text-align:left
}
.home-btn:before{content:"⌂";display:inline-block;margin-right:9px;font-size:16px;vertical-align:-1px}
.module{margin-bottom:5px}
.module-toggle{
  width:100%;border:1px solid transparent;border-radius:10px;padding:8px 10px;
  color:#f5fbfc;background:transparent;font-size:11px;font-weight:800;text-align:left;
  display:flex;align-items:center;justify-content:space-between;gap:8px
}
.module-toggle:hover,.module-toggle.open{background:rgba(255,255,255,.10)}
.module-toggle .num{
  display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid rgba(255,255,255,.34);
  border-radius:6px;font-size:9px;margin-right:7px;flex:0 0 auto
}
.module-name{display:flex;align-items:center;min-width:0}
.arrow{font-size:12px;opacity:.75;transition:.2s}
.module-toggle.open .arrow{transform:rotate(90deg)}
.lesson-list{display:none;padding:4px 0 4px 29px}
.lesson-list.open{display:grid;gap:3px}
.lesson-btn{
  border:0;border-radius:8px;background:transparent;color:rgba(255,255,255,.76);
  padding:6px 8px;text-align:left;font-size:9.5px;font-weight:700;line-height:1.2
}
.lesson-btn:hover{background:rgba(255,255,255,.08);color:#fff}
.lesson-btn.current{background:rgba(123,176,188,.30);color:#fff}
.lesson-btn.empty{opacity:.62}

/* LESSON VIEW */
.lesson-view{position:absolute;inset:0;z-index:100;background:#fff;display:none}
.lesson-view.on{display:grid;grid-template-rows:46px 1fr}
.lessonbar{
  display:flex;align-items:center;gap:9px;padding:6px 10px;background:#123e49;color:#fff;
  border-bottom:1px solid rgba(255,255,255,.08)
}
.back{border:0;border-radius:9px;background:#6f9fab;color:#fff;padding:8px 12px;font-size:11px;font-weight:900}
.lesson-title{font-size:11px;font-weight:900}
.lessonbar .spacer{flex:1}
.notes-toggle{
  border:1px solid rgba(255,255,255,.26);border-radius:9px;background:rgba(255,255,255,.08);
  padding:7px 10px;font-size:10.5px;font-weight:900;color:#fff
}
.framewrap{position:relative;min-height:0;background:#fff}
iframe{width:100%;height:100%;border:0;display:block;background:#fff}
.placeholder{position:absolute;inset:0;display:none;place-items:center;background:#f4f8f8;padding:30px}
.placeholder.on{display:grid}
.placeholder-card{
  width:min(560px,90%);background:#fff;border:1px solid #dce9ea;border-radius:18px;
  padding:26px;text-align:center;box-shadow:0 16px 40px rgba(17,61,71,.10)
}
.placeholder-card .m{font-size:10px;font-weight:900;color:#5b98a4;letter-spacing:.14em;text-transform:uppercase}
.placeholder-card h2{margin:8px 0 7px;color:#123e49}.placeholder-card p{margin:0;color:#657b83;font-size:12px}
.notes-panel{
  position:absolute;right:10px;top:10px;bottom:10px;width:min(340px,42vw);z-index:5;
  background:rgba(255,255,255,.98);border:1px solid #d8e7e8;border-radius:14px;padding:11px;
  box-shadow:0 16px 38px rgba(0,0,0,.18);display:none
}
.notes-panel.on{display:flex;flex-direction:column}
.notes-panel h3{margin:0 0 7px;color:#123e49;font-size:13px}
textarea{
  width:100%;min-height:120px;border:1px solid #d6e5e6;border-radius:10px;padding:10px;
  resize:vertical;background:#fbfdfd;font-size:12px;outline:0
}
.notes-panel textarea{flex:1;min-height:0}
.note-actions{display:flex;gap:7px;margin-top:7px}
.note-actions button{border:0;border-radius:8px;padding:7px 10px;font-size:10.5px;font-weight:900}
.save{background:#4f919c;color:#fff}.clear{background:#edf3f3;color:#38545a}

@media(max-width:1180px){
  #app{grid-template-columns:205px 1fr}
  .home{grid-template-columns:48% 1fr}
  .copy-panel{padding:68px 34px 40px 46px}
  .features{gap:12px}
}
@media(max-width:860px){
  #app{grid-template-columns:180px 1fr}
  .home{grid-template-columns:1fr}
  .copy-panel{
    position:absolute;left:0;top:0;bottom:0;width:55%;min-width:390px;
    background:linear-gradient(90deg,rgba(255,255,255,.98),rgba(255,255,255,.9) 82%,rgba(255,255,255,.08))
  }
  .photo-panel{grid-column:1;grid-row:1}
  .features{display:none}
  .lead{font-size:15px}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="logo-mark" aria-hidden="true"></div>
    <div class="brand">
      <strong>Katya · Teacher Hub</strong>
      <span>Teacher workspace</span>
    </div>

    <button class="home-btn" onclick="goHome()">Home</button>
    <div id="modules"></div>
  </aside>

  <main class="workspace">
    <section class="home" id="home">
      <div class="cover-image" aria-label="Katya English Hub cover"></div>
    </section>

    <section class="lesson-view" id="lessonView">
      <div class="lessonbar">
        <button class="back" onclick="goHome()">← Back</button>
        <div class="lesson-title" id="lessonTitle">Lesson</div>
        <div class="spacer"></div>
        <button class="notes-toggle" onclick="toggleLessonNotes()">Teacher Notes</button>
      </div>

      <div class="framewrap">
        <iframe id="lessonFrame" title="Kate lesson"></iframe>

        <div class="placeholder" id="placeholder">
          <div class="placeholder-card">
            <div class="m" id="placeholderModule">Module</div>
            <h2 id="placeholderTitle">Lesson</h2>
            <p>This lesson slot is ready for the next class.</p>
          </div>
        </div>

        <aside class="notes-panel" id="notesPanel">
          <h3 id="notesHeading">Teacher Notes</h3>
          <textarea id="lessonNotes" placeholder="Answers, mistakes, ideas, revision notes..."></textarea>
          <div class="note-actions">
            <button class="save" onclick="saveLessonNotes()">Save</button>
            <button class="clear" onclick="clearLessonNotes()">Clear</button>
          </div>
        </aside>
      </div>
    </section>
  </main>
</div>

<script>
const COURSE = [
  {
    module:'Module 1',
    lessons:[
      {id:'m1l1',title:'Lesson 1 · Elections in Russia',url:'../kate-english-hub/extra-practice-elections-russia.html'},
      {id:'m1l2',title:'Lesson 2 · Generations',url:'../kate-english-hub/homework-lesson2-generations.html'},
      {id:'m1l3',title:'Lesson 3 · Useful Tools',url:'../kate-english-hub/useful-tools-false-synonyms.html'}
    ]
  },
  ...Array.from({length:7},(_,i)=>({
    module:'Module '+(i+2),
    lessons:[
      {id:'m'+(i+2)+'l1',title:'Lesson 1',url:''},
      {id:'m'+(i+2)+'l2',title:'Lesson 2',url:''},
      {id:'m'+(i+2)+'l3',title:'Lesson 3',url:''}
    ]
  }))
];

let currentLesson='';

function renderModules(){
  const root=document.getElementById('modules');
  root.innerHTML='';
  COURSE.forEach((mod,mi)=>{
    const wrap=document.createElement('div');
    wrap.className='module';

    const toggle=document.createElement('button');
    toggle.className='module-toggle'+(mi===0?' open':'');
    toggle.innerHTML='<span class="module-name"><span class="num">'+String(mi+1).padStart(2,'0')+'</span>'+mod.module+'</span><span class="arrow">›</span>';

    const list=document.createElement('div');
    list.className='lesson-list'+(mi===0?' open':'');

    toggle.onclick=()=>{
      toggle.classList.toggle('open');
      list.classList.toggle('open');
    };

    mod.lessons.forEach(lesson=>{
      const b=document.createElement('button');
      b.className='lesson-btn'+(!lesson.url?' empty':'');
      b.textContent=lesson.title;
      b.dataset.lesson=lesson.id;
      b.onclick=()=>openLesson(mi,lesson);
      list.appendChild(b);
    });

    wrap.appendChild(toggle);
    wrap.appendChild(list);
    root.appendChild(wrap);
  });
}

function openLesson(moduleIndex,lesson){
  currentLesson=lesson.id;
  document.querySelectorAll('.lesson-btn').forEach(b=>b.classList.remove('current'));
  const active=document.querySelector('[data-lesson="'+lesson.id+'"]');
  if(active) active.classList.add('current');

  document.getElementById('lessonTitle').textContent=COURSE[moduleIndex].module+' · '+lesson.title;
  document.getElementById('lessonView').classList.add('on');
  document.getElementById('notesPanel').classList.remove('on');
  document.getElementById('notesHeading').textContent=lesson.title+' · Notes';
  document.getElementById('lessonNotes').value=localStorage.getItem('kt_teacher_notes_'+lesson.id)||'';

  const frame=document.getElementById('lessonFrame');
  const placeholder=document.getElementById('placeholder');

  if(lesson.url){
    placeholder.classList.remove('on');
    frame.style.display='block';
    frame.src=lesson.url;
  }else{
    frame.src='about:blank';
    frame.style.display='none';
    document.getElementById('placeholderModule').textContent=COURSE[moduleIndex].module;
    document.getElementById('placeholderTitle').textContent=lesson.title;
    placeholder.classList.add('on');
  }
}

function goHome(){
  document.getElementById('lessonView').classList.remove('on');
  document.getElementById('lessonFrame').src='about:blank';
  document.getElementById('lessonFrame').style.display='block';
  document.getElementById('placeholder').classList.remove('on');
  document.getElementById('notesPanel').classList.remove('on');
  document.querySelectorAll('.lesson-btn').forEach(b=>b.classList.remove('current'));
  currentLesson='';
}

function toggleLessonNotes(){
  document.getElementById('notesPanel').classList.toggle('on');
}
function saveLessonNotes(){
  if(!currentLesson)return;
  localStorage.setItem('kt_teacher_notes_'+currentLesson,document.getElementById('lessonNotes').value);
}
function clearLessonNotes(){
  if(!currentLesson)return;
  document.getElementById('lessonNotes').value='';
  localStorage.removeItem('kt_teacher_notes_'+currentLesson);
}

renderModules();
</script>
</body>
</html>
