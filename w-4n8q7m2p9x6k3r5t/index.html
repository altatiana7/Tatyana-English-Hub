<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Katya · Teacher Hub</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4ede9;font-family:Arial,Helvetica,sans-serif}
#home{position:fixed;inset:0;background:#f4ede9}
#cover{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;display:block}
.hotspot{position:absolute;left:0;width:18.2%;border:0;background:transparent;cursor:pointer;z-index:5}
.hotspot:focus{outline:2px solid rgba(214,176,171,.45);outline-offset:-2px}
#l1{top:24.1%;height:5.3%}
#l2{top:30.0%;height:5.3%}
#l3{top:36.0%;height:5.3%}
#m2{top:42.7%;height:5.3%}
#m3{top:49.0%;height:5.3%}
#m4{top:55.4%;height:5.3%}
#m5{top:61.8%;height:5.3%}
#m6{top:68.1%;height:5.3%}
#m7{top:74.5%;height:5.3%}
#m8{top:80.9%;height:5.3%}
#notesHot{top:90.1%;height:6.1%}
.viewer{position:fixed;inset:0;z-index:20;background:#fff;display:none;grid-template-rows:48px 1fr}
.viewer.on{display:grid}
.bar{display:flex;align-items:center;gap:10px;padding:6px 10px;background:#f0d9d6;color:#3a292d;border-bottom:1px solid #e1c5c1}
.bar button{border:0;border-radius:12px;padding:8px 12px;background:#d6aaa6;color:#fff;font-weight:800;cursor:pointer}
.bar .title{font-weight:800;font-size:13px}
.framewrap{position:relative;min-height:0}
iframe{width:100%;height:100%;border:0;background:#fff}
.placeholder{position:absolute;inset:0;display:none;place-items:center;background:#fbf7f5}
.placeholder.on{display:grid}
.card{background:#fff;border:1px solid #ead7d3;border-radius:20px;padding:26px 30px;text-align:center;box-shadow:0 16px 40px rgba(80,45,50,.08)}
.card h2{margin:0 0 8px;color:#4a3137}.card p{margin:0;color:#7a666a;font-size:13px}
.notes{position:fixed;right:22px;top:22px;bottom:22px;width:min(360px,42vw);z-index:30;background:rgba(255,250,248,.98);border:1px solid #ead7d3;border-radius:20px;padding:16px;box-shadow:0 20px 60px rgba(70,40,45,.18);display:none;flex-direction:column}
.notes.on{display:flex}
.notes h3{margin:0 0 10px;color:#4a3137}
.notes textarea{flex:1;resize:none;border:1px solid #ead7d3;border-radius:14px;padding:12px;background:#fff;font:inherit}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{border:0;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer}
.save{background:#d6aaa6;color:white}.clear{background:#f1e7e4;color:#6d555b}
.closeNotes{position:absolute;right:12px;top:10px;border:0;background:transparent;font-size:22px;color:#795f64;cursor:pointer}
@media(max-width:900px){
  .hotspot{width:18.6%}
  .bar .title{font-size:11px}
}
</style>
</head>
<body>
<section id="home">
  <img id="cover" src="./assets/katya-strict-cover.webp" alt="Katya English Hub">
  <button class="hotspot" id="l1" aria-label="Lesson 1"></button>
  <button class="hotspot" id="l2" aria-label="Lesson 2"></button>
  <button class="hotspot" id="l3" aria-label="Lesson 3"></button>
  <button class="hotspot" id="m2" aria-label="Module 2"></button>
  <button class="hotspot" id="m3" aria-label="Module 3"></button>
  <button class="hotspot" id="m4" aria-label="Module 4"></button>
  <button class="hotspot" id="m5" aria-label="Module 5"></button>
  <button class="hotspot" id="m6" aria-label="Module 6"></button>
  <button class="hotspot" id="m7" aria-label="Module 7"></button>
  <button class="hotspot" id="m8" aria-label="Module 8"></button>
  <button class="hotspot" id="notesHot" aria-label="Teacher Notes"></button>
</section>

<section class="viewer" id="viewer">
  <div class="bar">
    <button id="back">← Назад</button>
    <div class="title" id="title">Lesson</div>
  </div>
  <div class="framewrap">
    <iframe id="frame" title="Katya lesson"></iframe>
    <div class="placeholder" id="placeholder"><div class="card"><h2 id="phTitle">Module</h2><p>Слот подготовлен для следующего урока.</p></div></div>
  </div>
</section>

<aside class="notes" id="notes">
  <button class="closeNotes" id="closeNotes">×</button>
  <h3>Teacher Notes</h3>
  <textarea id="noteText" placeholder="Ошибки, идеи, homework, vocabulary..."></textarea>
  <div class="actions"><button class="save" id="saveNote">Сохранить</button><button class="clear" id="clearNote">Очистить</button></div>
</aside>

<script>
const lessons={
 l1:['Module 1 · Lesson 1 · Elections in Russia','../kate-english-hub/extra-practice-elections-russia.html'],
 l2:['Module 1 · Lesson 2 · Generations','../kate-english-hub/homework-lesson2-generations.html'],
 l3:['Module 1 · Lesson 3 · Useful Tools','../kate-english-hub/useful-tools-false-synonyms.html']
};
const viewer=document.getElementById('viewer'), frame=document.getElementById('frame'), placeholder=document.getElementById('placeholder');
function openLesson(key){
 const [t,u]=lessons[key];
 document.getElementById('title').textContent=t;
 placeholder.classList.remove('on');
 frame.style.display='block';frame.src=u;viewer.classList.add('on');
}
function openModule(n){
 document.getElementById('title').textContent='Module '+n;
 frame.src='about:blank';frame.style.display='none';
 document.getElementById('phTitle').textContent='Module '+n+' · 3 lessons';
 placeholder.classList.add('on');viewer.classList.add('on');
}
document.getElementById('l1').onclick=()=>openLesson('l1');
document.getElementById('l2').onclick=()=>openLesson('l2');
document.getElementById('l3').onclick=()=>openLesson('l3');
[2,3,4,5,6,7,8].forEach(n=>document.getElementById('m'+n).onclick=()=>openModule(n));
document.getElementById('back').onclick=()=>{viewer.classList.remove('on');frame.src='about:blank';placeholder.classList.remove('on');frame.style.display='block'};
const notes=document.getElementById('notes'), note=document.getElementById('noteText');
document.getElementById('notesHot').onclick=()=>{note.value=localStorage.getItem('katya_teacher_notes')||'';notes.classList.add('on')};
document.getElementById('closeNotes').onclick=()=>notes.classList.remove('on');
document.getElementById('saveNote').onclick=()=>localStorage.setItem('katya_teacher_notes',note.value);
document.getElementById('clearNote').onclick=()=>{note.value='';localStorage.removeItem('katya_teacher_notes')};
</script>
</body>
</html>
