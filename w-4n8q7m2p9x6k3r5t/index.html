<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<title>Katya · Teacher Hub</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#efe5df;font-family:Arial,Helvetica,sans-serif;color:#2d2022}
button,textarea{font:inherit}
button{cursor:pointer}
#app{position:fixed;inset:0;overflow:hidden;background:#efe5df}
.blur-bg{position:absolute;inset:-28px;background-position:center;background-size:cover;background-repeat:no-repeat;filter:blur(24px) brightness(.92);transform:scale(1.06);opacity:.55}
.stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(100vw,150vh);aspect-ratio:3/2;max-height:100vh;background:#f6eee9;box-shadow:0 0 34px rgba(72,35,35,.16);overflow:hidden}
.cover{position:absolute;inset:0;background-position:center;background-size:100% 100%;background-repeat:no-repeat}
.hotspot{position:absolute;border:0;background:transparent;border-radius:18px;outline:none}
.hotspot:focus-visible{box-shadow:0 0 0 3px rgba(185,119,119,.32)}
.h-l1{left:2.2%;top:23.8%;width:15.2%;height:5.7%}
.h-l2{left:2.2%;top:29.7%;width:15.2%;height:5.7%}
.h-l3{left:2.2%;top:35.6%;width:15.2%;height:5.7%}
.h-m2{left:.7%;top:43.1%;width:16.8%;height:5.4%}
.h-m3{left:.7%;top:49.4%;width:16.8%;height:5.4%}
.h-m4{left:.7%;top:55.8%;width:16.8%;height:5.4%}
.h-m5{left:.7%;top:62.2%;width:16.8%;height:5.4%}
.h-m6{left:.7%;top:68.6%;width:16.8%;height:5.4%}
.h-m7{left:.7%;top:75.0%;width:16.8%;height:5.4%}
.h-m8{left:.7%;top:81.4%;width:16.8%;height:5.4%}
.h-notes{left:.7%;top:90.8%;width:16.8%;height:5.4%}

.lesson-view{position:fixed;inset:0;z-index:50;background:#fff;display:none;grid-template-rows:50px 1fr}
.lesson-view.on{display:grid}
.lessonbar{display:flex;align-items:center;gap:10px;padding:7px 10px;background:rgba(247,238,234,.98);border-bottom:1px solid #ead8d2}
.back,.notes-btn{border:0;border-radius:12px;padding:9px 13px;font-weight:800}
.back{background:#d8aaa5;color:#fff}
.notes-btn{margin-left:auto;background:#f1dfdc;color:#4a3436}
.lesson-title{font-weight:800;font-size:14px;color:#38282a}
.framewrap{position:relative;min-height:0}
iframe{display:block;width:100%;height:100%;border:0;background:#fff}

.modal{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:rgba(43,30,31,.26);padding:20px}
.modal.on{display:grid}
.card{width:min(430px,92vw);background:rgba(255,249,246,.98);border:1px solid #ead8d2;border-radius:22px;padding:20px;box-shadow:0 24px 70px rgba(58,34,36,.22)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card h2{margin:0;font-family:Georgia,serif;font-size:22px;font-weight:500}
.close{border:0;border-radius:10px;background:#f0dfdc;padding:8px 10px}
.lesson-options{display:grid;gap:8px}
.lesson-options button{border:1px solid #ead8d2;border-radius:14px;background:#fff8f5;padding:11px 12px;text-align:left;color:#3d2c2e;font-weight:700}
.lesson-options button:hover{background:#f5e7e3}
.note-area{width:100%;height:220px;border:1px solid #ead8d2;border-radius:14px;padding:12px;resize:none;background:#fff}
.note-actions{display:flex;gap:8px;margin-top:10px}
.note-actions button{border:0;border-radius:11px;padding:9px 12px;font-weight:800}
.save{background:#d3a29d;color:#fff}.clear{background:#f1e4e1;color:#523b3d}
.loading{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#f5ece7;color:#6b4d50;font-size:14px;font-weight:700}
.loading.hide{display:none}
</style>
</head>
<body>
<div id="app">
  <div class="blur-bg" id="blurBg"></div>
  <div class="stage">
    <div class="cover" id="cover"></div>

    <button class="hotspot h-l1" aria-label="Lesson 1 Elections in Russia" onclick="openLesson('Lesson 1 · Elections in Russia','../kate-english-hub/extra-practice-elections-russia.html')"></button>
    <button class="hotspot h-l2" aria-label="Lesson 2 Generations" onclick="openLesson('Lesson 2 · Generations','../kate-english-hub/homework-lesson2-generations.html')"></button>
    <button class="hotspot h-l3" aria-label="Lesson 3 Useful Tools" onclick="openLesson('Lesson 3 · Useful Tools','../kate-english-hub/useful-tools-false-synonyms.html')"></button>

    <button class="hotspot h-m2" aria-label="Module 2" onclick="openModule(2)"></button>
    <button class="hotspot h-m3" aria-label="Module 3" onclick="openModule(3)"></button>
    <button class="hotspot h-m4" aria-label="Module 4" onclick="openModule(4)"></button>
    <button class="hotspot h-m5" aria-label="Module 5" onclick="openModule(5)"></button>
    <button class="hotspot h-m6" aria-label="Module 6" onclick="openModule(6)"></button>
    <button class="hotspot h-m7" aria-label="Module 7" onclick="openModule(7)"></button>
    <button class="hotspot h-m8" aria-label="Module 8" onclick="openModule(8)"></button>
    <button class="hotspot h-notes" aria-label="Teacher Notes" onclick="openNotes()"></button>
  </div>
</div>

<div class="lesson-view" id="lessonView">
  <div class="lessonbar">
    <button class="back" onclick="goHome()">← Назад</button>
    <div class="lesson-title" id="lessonTitle">Lesson</div>
    <button class="notes-btn" onclick="openNotes()">Teacher Notes</button>
  </div>
  <div class="framewrap">
    <iframe id="lessonFrame" title="Katya lesson"></iframe>
  </div>
</div>

<div class="modal" id="moduleModal">
  <div class="card">
    <div class="card-top">
      <h2 id="moduleTitle">Module 2</h2>
      <button class="close" onclick="closeModal('moduleModal')">✕</button>
    </div>
    <div class="lesson-options">
      <button onclick="placeholderLesson(1)">Lesson 1</button>
      <button onclick="placeholderLesson(2)">Lesson 2</button>
      <button onclick="placeholderLesson(3)">Lesson 3</button>
    </div>
  </div>
</div>

<div class="modal" id="notesModal">
  <div class="card">
    <div class="card-top">
      <h2>Teacher Notes</h2>
      <button class="close" onclick="closeModal('notesModal')">✕</button>
    </div>
    <textarea class="note-area" id="notesText" placeholder="Notes for Katya lessons..."></textarea>
    <div class="note-actions">
      <button class="save" onclick="saveNotes()">Save</button>
      <button class="clear" onclick="clearNotes()">Clear</button>
    </div>
  </div>
</div>

<div class="modal" id="slotModal">
  <div class="card">
    <div class="card-top">
      <h2 id="slotTitle">Lesson</h2>
      <button class="close" onclick="closeModal('slotModal')">✕</button>
    </div>
    <p style="margin:0;color:#6f5a5c">Этот слот готов для следующего урока.</p>
  </div>
</div>

<div class="loading" id="loading">Загружаю обложку…</div>

<script>
let currentModule=2;
async function loadCover(){
  try{
    const parts=await Promise.all([
      fetch('./cover-data/01.b64').then(r=>r.text()),
      fetch('./cover-data/02.b64').then(r=>r.text()),
      fetch('./cover-data/03.b64').then(r=>r.text())
    ]);
    const b64=parts.join('').replace(/\s+/g,'');
    const uri='data:image/webp;base64,'+b64;
    document.getElementById('cover').style.backgroundImage='url("'+uri+'")';
    document.getElementById('blurBg').style.backgroundImage='url("'+uri+'")';
  } finally {
    document.getElementById('loading').classList.add('hide');
  }
}
function openLesson(title,url){
  document.getElementById('lessonTitle').textContent=title;
  document.getElementById('lessonFrame').src=url;
  document.getElementById('lessonView').classList.add('on');
}
function goHome(){
  document.getElementById('lessonView').classList.remove('on');
  document.getElementById('lessonFrame').src='about:blank';
}
function openModule(n){
  currentModule=n;
  document.getElementById('moduleTitle').textContent='Module '+n;
  document.getElementById('moduleModal').classList.add('on');
}
function placeholderLesson(n){
  closeModal('moduleModal');
  document.getElementById('slotTitle').textContent='Module '+currentModule+' · Lesson '+n;
  document.getElementById('slotModal').classList.add('on');
}
function openNotes(){
  document.getElementById('notesText').value=localStorage.getItem('katya_teacher_notes')||'';
  document.getElementById('notesModal').classList.add('on');
}
function saveNotes(){
  localStorage.setItem('katya_teacher_notes',document.getElementById('notesText').value);
  closeModal('notesModal');
}
function clearNotes(){
  document.getElementById('notesText').value='';
  localStorage.removeItem('katya_teacher_notes');
}
function closeModal(id){document.getElementById(id).classList.remove('on')}
loadCover();
</script>
</body>
</html>
