<style>
/* Layout: пробковая доска в деревянной раме → стикеры-разделы; в разделе: каталожная карточка Quizlet + два листа с заданиями, приколотые к доске */
:root{
  color-scheme:light;
  --cork:#c4955f; --cork-dark:#8a6034; --cork-light:#e2bd8c; --frame:#7a5232; --frame-hi:#a07047;
  --paper:#fffdf7; --card:#fffdf7; --ink:#2b241f; --muted:#6e6158; --line:#e7ddd0;
  --n-yellow:#fff1a6; --n-pink:#ffd3de; --n-mint:#c9efdc; --n-blue:#cfe2ff; --n-lilac:#e2d8ff; --n-peach:#ffdcbd; --kraft:#d8b98f;
  --pink:#d0557c; --pink-soft:#ffe1ea; --mint:#2f8f6c; --mint-soft:#d8f3e6; --lilac-soft:#efe9ff;
  --good:#23845f; --good-soft:#d7f2e4; --bad:#c23b5e; --bad-soft:#fde0e8; --accent:#c8463d;
  --shadow:0 1px 1px rgba(60,35,10,.18),0 8px 18px -6px rgba(60,35,10,.45);
  --f-display:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-body:"PT Serif",Georgia,"Times New Roman",serif;
}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.35;background:var(--frame)}
button{font-family:var(--f-body);font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
/* доска */
.app{height:100%;display:flex;flex-direction:column;box-sizing:border-box;
  padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));
  border:10px solid var(--frame);border-image:linear-gradient(135deg,var(--frame-hi),var(--frame) 40%,#5d3d24) 1;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25),inset 0 0 40px rgba(60,30,5,.45);
  background:
    radial-gradient(circle at 30% 40%,rgba(95,55,20,.45) 0 1px,transparent 1.6px) 0 0/7px 9px,
    radial-gradient(circle at 70% 20%,rgba(255,236,200,.35) 0 1px,transparent 1.6px) 0 0/11px 8px,
    radial-gradient(circle at 50% 80%,rgba(110,65,25,.35) 0 1.4px,transparent 2px) 0 0/17px 13px,
    radial-gradient(circle at 20% 60%,rgba(240,205,150,.3) 0 1.2px,transparent 2px) 0 0/23px 19px,

.btn{border:none;background:var(--paper);border-radius:3px;padding:6px 14px;box-shadow:var(--shadow);color:var(--ink)}
.btn:hover{transform:translateY(-1px)}
.btn.pri{background:var(--accent);color:#fff}
.btn.sm{padding:4px 11px;font-size:15px}
/* булавка */
.pin{position:absolute;top:-7px;left:50%;width:16px;height:16px;margin-left:-8px;border-radius:50%;z-index:2;
  background:radial-gradient(circle at 35% 30%,#fff 0 2px,var(--pc,#d2453c) 3px,color-mix(in srgb,var(--pc,#d2453c) 70%,#000) 9px);
  box-shadow:2px 3px 3px rgba(0,0,0,.35)}
.tape{position:absolute;top:-11px;left:50%;width:96px;height:22px;margin-left:-48px;z-index:2;
  background:rgba(255,248,225,.62);box-shadow:0 1px 2px rgba(0,0,0,.15);transform:rotate(-2deg);
  clip-path:polygon(3% 0,97% 4%,100% 50%,97% 100%,2% 96%,0 50%)}
/* хаб */
.hub{flex:1;display:flex;flex-direction:column;gap:14px;padding-block:16px 14px;min-height:0}
.hub-head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.title-card{position:relative;background:var(--paper);padding:10px 22px 10px;box-shadow:var(--shadow);transform:rotate(-1deg)}

.legend{display:flex;gap:8px;flex-wrap:wrap}
.legend span{font-size:14px;padding:3px 10px;box-shadow:var(--shadow);background:var(--c)}

  box-shadow:var(--shadow);transform:rotate(var(--r,0deg));transition:transform .15s ease,box-shadow .15s ease;
  clip-path:polygon(0 0,100% 0,100% 100%,9% 100%,0 91%)}
.tile::after{content:"";position:absolute;left:0;bottom:0;width:9%;height:9%;background:linear-gradient(45deg,rgba(0,0,0,0) 50%,rgba(0,0,0,.12) 50%,rgba(255,255,255,.5))}
.tile:hover{transform:rotate(0deg) scale(1.04);z-index:3}
.tile h2{font-size:17px;line-height:1.15;color:var(--ink);overflow-wrap:anywhere;hyphens:auto}
.tile .tag{font-size:13px;color:var(--muted);background:none;padding:0;box-shadow:none}

.top{display:flex;align-items:center;gap:12px;padding-block:12px 10px;flex-wrap:wrap}

.top .spacer{margin-left:auto}

.panel:nth-child(1){background:var(--n-yellow);transform:rotate(-.6deg)}
.panel:nth-child(2){transform:rotate(.25deg)}
.panel:nth-child(3){transform:rotate(-.25deg)}
.panel:nth-child(2),.panel:nth-child(3){background:linear-gradient(var(--paper),var(--paper)) padding-box;
  background-image:repeating-linear-gradient(transparent 0 31px,rgba(110,150,200,.16) 31px 32px);background-color:var(--paper)}
.ph{display:flex;align-items:center;gap:8px;padding:12px 12px 6px;font-family:var(--f-display)}
.ph .nm{flex:1;text-align:center;font-size:19px;font-weight:700}
.ph .cnt{font-family:var(--f-body);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.ph .sw{width:32px;height:32px;padding:0;border-radius:50%;display:grid;place-items:center;font-size:19px;line-height:1}

.pb{flex:1;padding:6px 16px 14px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:auto}

.ptitle{display:flex;justify-content:flex-end;align-items:baseline;gap:8px;min-height:18px}
.ptitle h3{display:none}
.score{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:auto;padding-top:4px;font-variant-numeric:tabular-nums}
.note{font-size:15px;color:var(--muted);font-style:italic}
/* quizlet: каталожная карточка */
.qz{display:flex;flex-direction:column;gap:12px;align-items:center;flex:1;min-height:0}
.qz-tools{display:flex;gap:6px;width:100%;align-items:center;justify-content:space-between}
.qz-tools select{flex:1;min-width:0;font-family:var(--f-body);font-size:15px;padding:4px 6px;border-radius:3px;border:none;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.qz-card{width:100%;max-width:310px;flex:1;max-height:250px;min-height:170px;perspective:1000px;cursor:pointer}
.qz-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.qz-card.fl .qz-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px 14px 14px;gap:8px;overflow:auto;box-shadow:var(--shadow)}
.face.front{background:linear-gradient(transparent 26px,rgba(200,70,61,.55) 26px 27px,transparent 27px),repeating-linear-gradient(transparent 0 27px,rgba(110,150,200,.22) 27px 28px),#fffef9}
.face.back{background:var(--n-mint);transform:rotateY(180deg)}
.face .big{font-size:26px;font-weight:700}
.face .mid{font-size:19px}
.face .ex{font-size:16px;font-style:italic;color:var(--muted)}
.face img{max-height:100px}
.face .hint{position:absolute;bottom:6px;right:10px;font-size:12px;color:var(--muted)}
.qz-nav{display:flex;align-items:center;gap:14px;font-variant-numeric:tabular-nums}
.arrow{width:42px;height:42px;border-radius:50%;font-size:22px;line-height:1;display:grid;place-items:center;padding:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-size:.8em;margin:0 2px}
.fr sup,.fr sub{font-size:1em;vertical-align:baseline}
.fr sup{border-bottom:2px solid currentColor;padding:0 2px 1px}
/* пункты заданий */
.items{display:flex;flex-direction:column;gap:9px}
.it{background:rgba(255,255,255,.75);border-left:3px solid var(--n-pink);padding:7px 10px;display:flex;flex-direction:column;gap:6px;box-shadow:0 1px 2px rgba(60,35,10,.12)}
.it:nth-child(2n){border-left-color:var(--n-blue)}
.it:nth-child(3n){border-left-color:var(--n-mint)}
.it .q{font-size:19px}
.it .hintq{font-size:15px;color:var(--muted)}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:none;background:var(--n-yellow);padding:3px 12px;font-size:18px;box-shadow:0 1px 2px rgba(60,35,10,.25)}
.opt:nth-child(2n){background:var(--n-blue)}.opt:nth-child(3n){background:var(--n-pink)}
.opts.long{gap:4px}.opts.long .opt{font-size:15px;padding:2px 8px;text-align:left;line-height:1.25}
.opt.ok{background:var(--good-soft)!important;outline:2px solid var(--good);font-weight:700}
.opt.no{background:var(--bad-soft)!important;outline:2px solid var(--bad)}
.gap{display:inline-block;min-width:44px;border:none;border-bottom:2px solid var(--accent);background:var(--n-yellow);padding:0 8px;margin:0 2px;font-size:19px;font-weight:700}
.gap.ok{background:var(--good-soft);border-color:var(--good)}
.gap.no{background:var(--bad-soft);border-color:var(--bad)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
/* карточки-перевёртыши */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;min-height:150px}
.fc{perspective:900px;cursor:pointer;min-height:90px}
.fc .qz-in{height:100%}
.fc.fl .qz-in{transform:rotateY(180deg)}
.fc .face{padding:10px;font-size:17px}
.fc .face.front{background:var(--n-pink);font-size:18px}
.fc:nth-child(2) .face.front{background:var(--n-blue)}
.fc:nth-child(3) .face.front{background:var(--n-lilac)}
.fc:nth-child(4) .face.front{background:var(--n-peach)}
.fc .face.back{background:var(--n-mint)}
/* matching */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:flex;flex-direction:column;gap:8px}
.mb{border:none;background:var(--n-yellow);padding:8px 10px;font-size:18px;text-align:left;min-height:44px;box-shadow:0 1px 3px rgba(60,35,10,.3)}
.mcol:nth-child(2) .mb{background:var(--n-blue)}
.mb.sel{outline:3px solid var(--accent)}
.mb.done{background:var(--good-soft)!important;cursor:default;opacity:.8}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* сортировка */
.bins{display:grid;gap:10px}
.bin{border:2px dashed rgba(110,80,50,.35);padding:6px 8px;min-height:64px;display:flex;flex-direction:column;gap:5px;background:rgba(255,255,255,.4)}
.bin.over,.bin.target{border-color:var(--accent);background:var(--pink-soft)}
.bin h4{margin:0;font-size:17px;font-family:var(--f-display)}
.bin .chips{display:flex;flex-wrap:wrap;gap:5px}
.pool{display:flex;flex-wrap:wrap;gap:7px;min-height:40px;padding:4px 0}
.sc{border:none;background:var(--n-yellow);padding:4px 11px;font-size:17px;cursor:grab;user-select:none;box-shadow:0 1px 3px rgba(60,35,10,.3)}
.sc:nth-child(3n+1){transform:rotate(-1.5deg)}.sc:nth-child(3n){transform:rotate(1.2deg);background:var(--n-pink)}.sc:nth-child(4n){background:var(--n-blue)}
.sc.sel{outline:3px solid var(--accent)}
.sc.placed{background:var(--good-soft)!important;cursor:default;font-size:15px;transform:none}
/* доктор грамматика */
.pat .prow{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.pat .pnum{font-family:var(--f-display);font-size:15px;color:var(--accent)}
.pat .pst{font-size:15px;color:var(--muted)}
.pat.cured{border-left-color:var(--good)!important;background:rgba(232,247,238,.85)}
.pat.lost{border-left-color:var(--bad)!important}
.pat.cured .pst{color:var(--good);font-weight:700}.pat.lost .pst{color:var(--bad);font-weight:700}
.tk{border:none;background:transparent;font:inherit;color:inherit;padding:0 2px;margin:0;border-bottom:2px dotted rgba(110,80,50,.35);cursor:pointer}
.tk:hover:not(:disabled){background:var(--n-yellow)}
.tk:disabled{cursor:default;border-bottom-color:transparent}
.tk.sick{background:var(--bad-soft);outline:2px dashed var(--bad)}
.tk.no{background:var(--bad-soft);outline:2px solid var(--bad)}
.heal{background:var(--good-soft);padding:0 4px;outline:2px solid var(--good)}
.opt.well{background:var(--n-mint)!important}
.drow{align-items:center}.rx{font-size:15px;color:var(--muted);margin-right:2px}
.expl{color:var(--ink)!important;font-style:italic}
.gsel{margin-right:auto;max-width:60%;min-width:0;font-family:var(--f-body);font-size:14px;padding:2px 4px;border:none;border-radius:3px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
/* сборка предложения */
.ord{display:flex;flex-direction:column;gap:6px}
.line{min-height:40px;border-bottom:2px solid rgba(110,80,50,.35);display:flex;flex-wrap:wrap;gap:5px;padding:4px 0}
.line.ok{border-color:var(--good)} .line.no{border-color:var(--bad)}
.w{border:none;background:var(--n-yellow);padding:2px 9px;font-size:18px;box-shadow:0 1px 2px rgba(60,35,10,.3)}
.tin{font-family:var(--f-body);font-size:19px;padding:3px 8px;border:none;border-bottom:2px solid var(--accent);background:rgba(255,255,255,.8);color:var(--ink);width:11em;max-width:100%}
.tin.ok{background:var(--good-soft);border-color:var(--good)}.tin.no{background:var(--bad-soft);border-color:var(--bad)}
.seqdone{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:3px;font-size:17px}
.seqdone li{background:var(--good-soft);padding:2px 8px}
/* speed game */
.bomb{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;flex:1;justify-content:center}
.bomb .ball{width:92px;height:92px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;position:relative;box-shadow:var(--shadow)}
.bomb .fuse{width:100%;max-width:340px;height:8px;background:rgba(110,80,50,.2);overflow:hidden}
.bomb .fuse i{display:block;height:100%;background:linear-gradient(90deg,#e8a33d,var(--accent));transition:width 1s linear}
.bomb .q{font-size:21px}
.boom{animation:boom .6s}
@keyframes boom{0%{transform:scale(1)}30%{transform:scale(1.5);background:var(--bad)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.res{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;flex:1;justify-content:center}
.res .big{font-size:32px;font-family:var(--f-display)}
/* окна */
.ov{position:fixed;inset:0;background:rgba(40,25,10,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:12px}
.ov-box{background:var(--paper);max-width:min(960px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:var(--shadow)}
.ov-h{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.ov-h h2{font-size:20px;margin-right:auto}
.ov-b{overflow:auto;padding:12px}
.ov-b img{display:block;margin:0 auto;max-width:100%}
.tbl{border-collapse:collapse;font-size:15px;width:100%}
.tbl th,.tbl td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.tbl th{background:var(--n-yellow)}
.tw{overflow-x:auto}
.ov-b h3{font-size:18px;margin:12px 0 6px}
.ov-b ol{margin:0;padding-left:20px;font-size:15px}
@media (max-width:1050px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:auto}
  .tile{min-height:120px}
  .sec{grid-template-columns:1fr;overflow:visible}

}
@media (max-height:640px) and (min-width:1051px){
  .top{padding-block:8px 4px}.top h1{font-size:21px}
  .sec{gap:16px;padding-block:6px 10px}

const prefixWords=[];

  let pre=p.split(' / ')[0].replace('-','');
  if(p.startsWith('in-')) pre=w.slice(0,2);
  if(p.startsWith('a-')) pre=/^an[aeiou]/.test(w)?'an':'a';
  prefixWords.push({w,ru,group:p,pre,root:pre==='non'?w.slice(4):w.slice(pre.length)});
}
const PRE_OPTS=['un','in','im','il','ir','dis','non-','mis','de','counter','a','an'];
const prefixChoice=prefixWords.filter(x=>!['anxious','apathy'].includes(x.w)).map(x=>{
  const a=x.pre==='non'?'non-':x.pre;
  const pool=shuffle(PRE_OPTS.filter(o=>o!==a)).slice(0,3);
  return {q:'___'+x.root, hint:x.ru, opts:shuffle([a,...pool]), a, after:x.w};
});
function lexQuiz(){
  const out=[];
  for(const g of LEX){ if(g.noquiz) continue;
    for(const e of g.w){
      const key=e[4]||e[0];
      const re=new RegExp('\\b'+key.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(s|es|ed|d|ing)?\\b','gi');
      if(!re.test(e[2])) continue;
      const q=e[2].replace(re,'___').replace(/ — .*/,'');
      const others=g.w.filter(x=>x!==e).map(x=>x[4]||x[0]);
      out.push({q, hint:e[1], opts:shuffle([key,...shuffle(others).slice(0,3)]), a:key, group:g.g});
    }
  }
  return out;
}

}

/* ====== хаб ====== */
const app=$('#app');
let cleanups=[];
function clean(){cleanups.forEach(f=>f());cleanups=[]}
function hub(){

  const rot=i=>[-2.2,1.4,-0.8,2,-1.5,0.9,-2.6,1.8,-0.5,2.4,-1.2,0.6,-1.9,1.1][i%14];
  const pins=['#d2453c','#2f6fd1','#2f9a63','#e0a12b','#8a4fd1'];
  app.innerHTML=`<div class="hub">

   <div class="legend"><span style="--c:var(--n-yellow)">30–36</span><span style="--c:var(--n-lilac)">19–29</span><span style="--c:var(--n-pink)">письмо 37–38</span><span style="--c:var(--n-mint)">устная часть</span></div>
   <button class="btn" id="teach">Для учителя</button></div>
   <div class="tiles">${SECTIONS.map((s,i)=>`<button class="tile" data-id="${s.id}" style="--c:${col(s.tag)};--r:${rot(i)}deg"><span class="pin" style="--pc:${pins[i%5]}"></span>
     <h2>${esc(s.title)}</h2><div><div class="tag">${esc(s.tag)}</div><div class="meta">${s.cards.length} карточек · ${s.acts.length} игр</div></div></button>`).join('')}
     <button class="tile" id="teach2" style="--c:var(--kraft);--r:1.6deg"><span class="pin" style="--pc:#2f6fd1"></span><h2>Маршрутная карта</h2><div><div class="tag">для учителя</div><div class="meta">план по месяцам</div></div></button>
   </div></div>`;

/* ====== раздел ====== */
function openSec(id){
  clean();
  const s=SECTIONS.find(x=>x.id===id);
  app.innerHTML=`<div class="top"><button class="btn sm" id="home">← Главная</button><div class="title-card"><h1>${esc(s.title)}</h1></div><span class="tag">${esc(s.tag)}</span><span class="spacer"></span>
    ${(s.img||s.imgs)?'<button class="btn sm" id="memo">Памятка</button>':''}</div>
    <div class="sec"><div class="panel" id="p0"></div><div class="panel" id="p1"></div><div class="panel" id="p2"></div></div>`;
  $('#home').onclick=hub;
  if(s.img||s.imgs) $('#memo').onclick=()=>overlay(s.title,(s.imgs||[s.img]).map(u=>`<img src="${u}" alt="Памятка: ${esc(s.title)}" style="margin-bottom:10px">`).join(''));
  quizlet($('#p0'),s);
  const sel=[0,1];
  [1,2].forEach(pi=>{
    const p=$('#p'+pi);
    const draw=()=>{
      const k=sel[pi-1], n=s.acts.length;
      p.innerHTML=`<span class="tape"></span><div class="ph"><button class="btn sw pv" aria-label="Предыдущее задание">‹</button><span class="nm">${esc(s.acts[k].n)}</span><span class="cnt">${k+1}/${n}</span><button class="btn sw nx" aria-label="Следующее задание">›</button></div><div class="pb"></div>`;
      const step=d=>{let j=k;do{j=(j+d+n)%n}while(j===sel[2-pi]&&n>1);sel[pi-1]=j;draw()};
      p.querySelector('.pv').onclick=()=>step(-1); p.querySelector('.nx').onclick=()=>step(1);
      if(p._cl) p._cl(); p._cl=null;
      mount(p.querySelector('.pb'),s.acts[k],p);
    };
    p._draw=draw;
  });
  const redrawAll=()=>{$('#p1')._draw();$('#p2')._draw()};
  redrawAll();
  cleanups.push(()=>{['#p1','#p2'].forEach(x=>{const p=$(x);if(p&&p._cl)p._cl()})});
}

/* ====== Quizlet ====== */
function quizlet(p,s){
  let list=s.cards, i=0, fl=false;
  p.innerHTML=`<span class="pin"></span><div class="ph label">Карточки</div><div class="pb"><div class="qz">
   <div class="qz-tools">${s.groups?`<select id="qg" aria-label="Группа слов"><option value="">Все слова (${s.cards.length})</option>${s.groups.map(g=>`<option>${esc(g)}</option>`).join('')}</select>`:'<span class="note">Нажми на карточку</span>'}
   <button class="btn sm" id="qs">Перемешать</button></div>
   <div class="qz-card" id="qc"><div class="qz-in"><div class="face front"></div><div class="face back"></div></div></div>
   <div class="qz-nav"><button class="btn arrow" id="qp" aria-label="Назад">‹</button><span id="qn"></span><button class="btn arrow" id="qx" aria-label="Вперёд">›</button></div>
  </div></div>`;
  const card=$('#qc',p);
  const show=()=>{
    const c=list[i]; fl=false; card.classList.remove('fl');
    const f=c.frac?fr(c.f):esc(c.f);
    $('.front',card).innerHTML=(c.img?`<img src="${c.img}" alt="">`:'')+`<div class="${c.img?'mid':'big'}">${f}</div>`+(c.fs?`<div class="ex">${esc(c.fs)}</div>`:'')+'<span class="hint">перевернуть</span>';
    $('.back',card).innerHTML=`<div class="mid"><b>${c.raw?c.b:esc(c.b)}</b></div>`+(c.ex?`<div class="ex">${c.raw?c.ex:esc(c.ex)}</div>`:'');
    $('#qn',p).textContent=(i+1)+' / '+list.length;
  };
  card.onclick=()=>{fl=!fl;card.classList.toggle('fl',fl)};
  $('#qp',p).onclick=()=>{i=(i-1+list.length)%list.length;show()};
  $('#qx',p).onclick=()=>{i=(i+1)%list.length;show()};
  $('#qs',p).onclick=()=>{list=shuffle(list);i=0;show()};
  const g=$('#qg',p); if(g) g.onchange=()=>{list=g.value?s.cards.filter(c=>c.group===g.value):s.cards;i=0;show()};
  const key=e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')$('#qp',p).click();else if(e.key==='ArrowRight')$('#qx',p).click();};
  document.addEventListener('keydown',key); cleanups.push(()=>document.removeEventListener('keydown',key));
  show();
}

/* ====== активности ====== */
function mount(el,a,panel){
  ({gaps,choice,flip,match,sort,doctor,order,bomb,seq,type:typeIn})[a.type](el,a,panel);
}
function fit(el,per,render,min=2){
  // уменьшаем число пунктов на странице, пока панель не вмещает всё без прокрутки
  let n=per; render(n);
  if(window.innerWidth<=1050) return;
  while(n>min && el.scrollHeight>el.clientHeight+2){n--;render(n)}
}
function head(a,score){return `<div class="ptitle"><h3>${esc(a.n)}</h3>${a.groups?`<select class="gsel" aria-label="Группа слов"><option value="">Все группы</option>${a.groups.filter(g=>a.items.some(i=>i.group===g)).map(g=>`<option${a._g===g?' selected':''}>${esc(g)}</option>`).join('')}</select>`:''}<span class="score">${score||''}</span></div>${a.lead?`<div class="note">${esc(a.lead)}</div>`:''}`}
function result(el,txt,again){
  el.innerHTML=`<div class="res"><div class="big">${txt}</div><button class="btn pri">Ещё раз</button></div>`;
  el.querySelector('button').onclick=again;
}

function paged(el,a,items,per,renderItems,onDone){
  let page=0, n=per;
  const draw=()=>{
    const pages=Math.ceil(items.length/n); if(page>=pages)page=pages-1;
    const chunk=items.slice(page*n,page*n+n);
    el.innerHTML=head(a,a._score?a._score():'')+`<div class="items"></div><div class="pager"><button class="btn sm pv">‹</button><span>${page+1} / ${pages}</span><button class="btn sm nx">${page===pages-1?'Итог':'›'}</button></div>`;
    renderItems(el.querySelector('.items'),chunk,page*n);
    const gs=el.querySelector('.gsel'); if(gs) gs.onchange=()=>{a._g=gs.value; a._restart&&a._restart()};
    el.querySelector('.pv').onclick=()=>{if(page>0){page--;draw()}};
    el.querySelector('.nx').onclick=()=>{if(page<pages-1){page++;draw()}else onDone()};
  };
  fit(el,per,k=>{n=k;draw()},a.min||2);
}

function choice(el,a){
  let items, right, done;
  const start=()=>{
    const src=a._g?a.items.filter(i=>i.group===a._g):a.items; a._restart=start;
    items=shuffle(src).slice(0,src.length>40?20:src.length); right=0; done=new Set();
    a._score=()=>`верно: ${right} из ${items.length}`;
    paged(el,a,items,4,(box,chunk,off)=>{
      chunk.forEach((it,k)=>{
        const d=document.createElement('div'); d.className='it';
        d.innerHTML=`<div class="q">${it.html?fr(it.q):esc(it.q)}</div>${it.hint?`<div class="hintq">${esc(it.hint)}</div>`:''}<div class="opts${it.opts.some(o=>String(o).length>28)?' long':''}">${it.opts.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}</div>`;
        if(it.q.length>70) d.querySelector('.q').style.fontSize='17px';
        const id=off+k;
        d.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
          if(done.has(id))return; done.add(id);
          const ok=norm(b.textContent)===norm(it.a);
          if(ok){right++}else b.classList.add('no');
          d.querySelectorAll('.opt').forEach(x=>{if(norm(x.textContent)===norm(it.a))x.classList.add('ok');x.disabled=true});
          if(it.after){const h=document.createElement('div');h.className='hintq expl';h.textContent='→ '+it.after;d.appendChild(h)}
          el.querySelector('.score').textContent=a._score();
        });
        box.appendChild(d);
      });
    },()=>result(el,`${right} из ${items.length}`,start));
  };
  start();
}

function gaps(el,a){
  const OPTS=['a','an','the','Ø'];
  let items,state,checked,right;
  const start=()=>{
    items=a.items; state=items.map(it=>it[1].map(()=>-1)); checked=new Set(); right=0;
    a._score=()=>`верно: ${right}`;
    paged(el,a,items,4,(box,chunk,off)=>{
      chunk.forEach((it,k)=>{
        const id=off+k, parts=it[0].split('_');
        const d=document.createElement('div'); d.className='it';
        d.innerHTML=`<div class="q">${parts.map((p,j)=>esc(p)+(j<parts.length-1?`<button class="gap" data-j="${j}">${state[id][j]<0?'…':OPTS[state[id][j]]}</button>`:'')).join('')}</div>
          <div class="row"><button class="btn sm ck">Проверить</button><button class="btn sm sh">Ответ</button></div>`;
        const gs=d.querySelectorAll('.gap');
        gs.forEach(g=>g.onclick=()=>{const j=+g.dataset.j;state[id][j]=(state[id][j]+1)%4;g.textContent=OPTS[state[id][j]];g.classList.remove('ok','no')});
        const mark=reveal=>{let all=true;gs.forEach(g=>{const j=+g.dataset.j,ans=it[1][j];
          if(reveal){state[id][j]=OPTS.findIndex(o=>norm(o)===norm(ans));g.textContent=ans}
          const ok=state[id][j]>=0&&norm(OPTS[state[id][j]])===norm(ans);g.classList.toggle('ok',ok);g.classList.toggle('no',!ok);if(!ok)all=false});
          if(all&&!reveal&&!checked.has(id)){checked.add(id);right++;el.querySelector('.score').textContent=a._score()}
          if(reveal)checked.add(id);};
        d.querySelector('.ck').onclick=()=>mark(false);
        d.querySelector('.sh').onclick=()=>mark(true);
        box.appendChild(d);
      });
    },()=>result(el,`${right} из ${items.length}`,start));
  };
  start();
}

function flip(el,a){
  let page=0,n=4;
  const draw=()=>{
    const pages=Math.ceil(a.items.length/n); const chunk=a.items.slice(page*n,page*n+n);
    el.innerHTML=head(a)+`<div class="fgrid">${chunk.map(it=>`<div class="fc" tabindex="0"><div class="qz-in"><div class="face front">${a.frac?fr(it.f):esc(it.f)}</div><div class="face back">${a.frac?fr(it.b):it.b}</div></div></div>`).join('')}</div>
     <div class="pager"><button class="btn sm pv">‹</button><span>${page+1} / ${pages}</span><button class="btn sm nx">${page===pages-1?'Сначала':'›'}</button></div>`;
    el.querySelectorAll('.fc').forEach(c=>{c.onclick=()=>c.classList.toggle('fl');c.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();c.classList.toggle('fl')}}});
    el.querySelector('.pv').onclick=()=>{if(page>0){page--;draw()}};
    el.querySelector('.nx').onclick=()=>{page=page<pages-1?page+1:0;draw()};
  };
  fit(el,4,k=>{n=k;draw()});
}

function rounds(pairs,size){
  const pool=shuffle(pairs), out=[];
  while(pool.length){const r=[],used=new Set();
    for(let i=0;i<pool.length&&r.length<size;){if(!used.has(pool[i][1])){used.add(pool[i][1]);r.push(pool.splice(i,1)[0])}else i++}
    out.push(r)}
  return out;
}
function match(el,a){
  let rs,ri,errors;
  const start=(force)=>{const sz=force||(el.clientHeight&&el.clientHeight<430&&window.innerWidth>1050?3:4);rs=a.byGroup?shuffle(a.byGroup.filter(g=>g.length>=3)).slice(0,4).map(g=>rounds(g,sz)[0]):rounds(a.pairs,sz).slice(0,4);ri=0;errors=0;draw();if(!force&&sz>3&&window.innerWidth>1050&&el.scrollHeight>el.clientHeight+2)start(3)};
  const draw=()=>{
    const r=rs[ri]; let selL=null,selR=null,left=r.length;
    const fmt=t=>a.frac?fr(t):esc(t);
    el.innerHTML=head(a,`раунд ${ri+1} / ${rs.length} · ошибок: ${errors}`)+`<div class="match"><div class="mcol">${r.map((p,i)=>`<button class="mb L" data-i="${i}">${fmt(p[0])}</button>`).join('')}</div><div class="mcol">${shuffle(r.map((p,i)=>[p[1],i])).map(([t,i])=>`<button class="mb R" data-i="${i}">${esc(t)}</button>`).join('')}</div></div><div class="pager" style="min-height:38px"></div>`;
    const tryM=()=>{ if(!selL||!selR)return;
      const pl=r[+selL.dataset.i], pr=r[+selR.dataset.i];
      if(pl[1]===pr[1]){[selL,selR].forEach(b=>{b.classList.remove('sel');b.classList.add('done');b.disabled=true});left--;
        if(!left){const pg=el.querySelector('.pager');pg.innerHTML=`<button class="btn pri">${ri<rs.length-1?'Следующий раунд':'Итог'}</button>`;pg.firstChild.onclick=()=>{if(ri<rs.length-1){ri++;draw()}else result(el,`Ошибок: ${errors}`,start)}}}
      else{errors++;[selL,selR].forEach(b=>{b.classList.remove('sel');b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400)});el.querySelector('.score').textContent=`раунд ${ri+1} / ${rs.length} · ошибок: ${errors}`}
      selL=selR=null;};
    el.querySelectorAll('.mb').forEach(b=>b.onclick=()=>{ if(b.classList.contains('done'))return;
      const isL=b.classList.contains('L');
      el.querySelectorAll(isL?'.L':'.R').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
      if(isL)selL=b;else selR=b; tryM();});
  };
  start();
}

function sort(el,a){
  let ri=0,errors=0;
  const roundsList=a.rounds||[a.bins];
  const itemsFor=bins=>{
    if(a.phr) return shuffle(a.items.filter(x=>bins.includes(x.group))).map(x=>[x.w,x.group]);
    if(a.rounds) return shuffle(a.items.filter(x=>bins.includes(x.group)||(bins.includes(x.pre+'-'))).map(x=>[x.w, bins.find(b=>b===x.group||b.split(' / ').includes(x.pre+'-'))])).slice(0,a.per);
    return shuffle(a.items).slice(0,a.per);
  };
  let per=a.per;
  const start=()=>{ri=0;errors=0;per=a.per;draw();while(per>3&&window.innerWidth>1050&&el.scrollHeight>el.clientHeight+2){per-=1;draw()}};
  const draw=()=>{
    const bins=roundsList[ri%roundsList.length]; const items=itemsFor(bins).slice(0,bins.length>2&&window.innerWidth>1050&&el.clientHeight<500?Math.min(per,6):per); let left=items.length, sel=null;
    el.innerHTML=head(a,`раунд ${ri+1} · ошибок: ${errors}`)+`<div class="note">Перетащи или нажми слово, потом корзину.</div>
      <div class="pool">${items.map((it,i)=>`<span class="sc" draggable="true" data-i="${i}" tabindex="0">${esc(it[0])}</span>`).join('')}</div>
      <div class="bins" style="grid-template-columns:repeat(${bins.length===3?3:bins.length>2?2:bins.length},minmax(0,1fr))">${bins.map(b=>`<div class="bin" data-b="${esc(b)}"><h4>${esc(b)}</h4><div class="chips"></div></div>`).join('')}</div><div class="pager" style="min-height:38px"></div>`;
    const put=(chip,bin)=>{
      const it=items[+chip.dataset.i];
      if(it[1]===bin.dataset.b){chip.classList.remove('sel');chip.classList.add('placed');chip.draggable=false;bin.querySelector('.chips').appendChild(chip);left--;sel=null;
        if(!left){const pg=el.querySelector('.pager');pg.innerHTML=`<button class="btn pri">${a.rounds&&ri<roundsList.length-1?'Следующий раунд':'Новые слова'}</button>`;pg.firstChild.onclick=()=>{ri++;draw()}}}
      else{errors++;chip.classList.add('shake');setTimeout(()=>chip.classList.remove('shake'),400);el.querySelector('.score').textContent=`раунд ${ri+1} · ошибок: ${errors}`}
    };
    el.querySelectorAll('.sc').forEach(c=>{
      c.onclick=()=>{if(c.classList.contains('placed'))return;el.querySelectorAll('.sc').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');sel=c};
      c.ondragstart=e=>{e.dataTransfer.setData('text/plain',c.dataset.i);sel=c};
    });
    el.querySelectorAll('.bin').forEach(b=>{
      b.onclick=()=>{if(sel)put(sel,b)};
      b.ondragover=e=>{e.preventDefault();b.classList.add('over')};
      b.ondragleave=()=>b.classList.remove('over');
      b.ondrop=e=>{e.preventDefault();b.classList.remove('over');const c=el.querySelector(`.sc[data-i="${e.dataTransfer.getData('text/plain')}"]`);if(c&&!c.classList.contains('placed'))put(c,b)};
    });
  };
  start();
}

function doctor(el,a){
  // Доктор Грамматика: найди «больное» слово, затем выбери лекарство
  let items,cured,misdiag;
  const start=()=>{
    const src=a._g?a.items.filter(i=>i.group===a._g):a.items; a._restart=start;
    items=shuffle(src).slice(0,Math.min(12,src.length)).map(it=>{
      const wrongs=it.opts.filter(o=>norm(o)!==norm(it.a));
      const sick=wrongs.length>0&&Math.random()<0.72;
      return Object.assign({},it,{sick,bad:sick?shuffle(wrongs)[0]:null});
    });
    cured=0; misdiag=0;
    a._score=()=>`вылечено: ${cured} из ${items.length}`;
    paged(el,a,items,4,(box,chunk,off)=>chunk.forEach((it,k)=>box.appendChild(patient(it,off+k+1))),
      ()=>result(el,`Вылечено: ${cured} из ${items.length}<div class="note" style="font-family:var(--f-body);font-size:17px;margin-top:6px">неверных диагнозов: ${misdiag}</div>`,start));
  };
  const words=(q,fill)=>{
    const t=q.replace(/___/g,'\u0001'+fill+'\u0002').split(/\s+/).filter(Boolean); let inside=false;
    return t.map(w=>{const has=w.includes('\u0001')||w.includes('\u0002')||inside;
      if(w.includes('\u0001'))inside=true; if(w.includes('\u0002'))inside=false;
      return {w:w.replace(/[\u0001\u0002]/g,''),err:has}});
  };
  const healed=(it,cls)=>esc(it.q).replace(/___/g,`<b class="${cls}">${esc(it.a)}</b>`);
  function patient(it,num){
    const d=document.createElement('div'); d.className='it pat'+(it._st?' '+it._st:'');
    const ws=words(it.q,it.sick?it.bad:it.a);
    d.innerHTML=`<div class="prow"><span class="pnum">Пациент ${num}</span><span class="pst">${it._msg||'Поставь диагноз'}</span></div>
      <div class="q">${it._html||ws.map((x,i)=>`<button class="tk" data-i="${i}">${esc(x.w)}</button>`).join(' ')}</div>
      ${it.hint&&a.hints?`<div class="hintq">${esc(it.hint)}</div>`:''}
      <div class="opts drow">${it._done||it._cure?'':'<button class="opt well">Здоров</button>'}</div>`;
    if(it.q.length>70) d.querySelector('.q').style.fontSize='17px';
    const st=(msg,cls)=>{it._msg=msg;d.querySelector('.pst').textContent=msg;if(cls){it._st=cls;d.classList.add(cls)}};
    const score=()=>{const sc=el.querySelector('.score');if(sc)sc.textContent=a._score()};
    const finish=()=>{it._done=true;it._html=d.querySelector('.q').innerHTML;d.querySelectorAll('.tk').forEach(x=>x.disabled=true);it._cure=false};
    const showCure=ok=>{
      it._cure=true; it._diag=ok;
      d.querySelectorAll('.tk').forEach((x,i)=>{x.disabled=true;if(ws[i].err)x.classList.add('sick')});
      const row=d.querySelector('.drow');
      row.innerHTML='<span class="rx">Лекарство:</span>'+shuffle(it.opts).map(o=>`<button class="opt">${esc(o)}</button>`).join('');
      row.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        if(it._done)return;
        const good=norm(b.textContent)===norm(it.a);
        row.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(norm(x.textContent)===norm(it.a))x.classList.add('ok')});
        if(good){ if(it._diag){cured++;st('Вылечен','cured')} else st('Лекарство верное, но диагноз был неточным','half'); d.querySelector('.q').innerHTML=healed(it,'heal'); }
        else { b.classList.add('no'); st('Осложнение — правильно: '+it.a,'lost'); d.querySelector('.q').innerHTML=healed(it,'heal'); }
        if(it.after){const h=document.createElement('div');h.className='hintq expl';h.textContent='→ '+it.after;d.appendChild(h)}
        finish(); score();
      });
    };
    if(it._done){d.querySelectorAll('.tk').forEach(x=>x.disabled=true);return d}
    if(it._cure){showCure(it._diag);return d}
    d.querySelectorAll('.tk').forEach(b=>b.onclick=()=>{
      const x=ws[+b.dataset.i];
      if(!it.sick){misdiag++;b.classList.add('no');st('Ошибка: пациент был здоров','lost');d.querySelector('.q').innerHTML=healed(it,'heal');d.querySelector('.drow').innerHTML='';finish();score();return}
      if(x.err){st('Диагноз верный — выбери лекарство');showCure(true)}
      else{misdiag++;b.classList.add('no');st('Не то слово. Больное слово выделено — выбери лекарство');showCure(false)}
      score();
    });
    d.querySelector('.well').onclick=()=>{
      if(!it.sick){cured++;st('Здоров — диагноз верный','cured');d.querySelector('.drow').innerHTML='';finish();score();return}
      misdiag++; st('Пациент болен! Больное слово выделено — выбери лекарство'); showCure(false); score();
    };
    return d;
  }
  start();
}

function order(el,a){
  let items,right;
  const start=()=>{
    items=shuffle(a.items); right=0; a._score=()=>`верно: ${right}`;
    paged(el,a,items,3,(box,chunk)=>{
      chunk.forEach(s=>{
        const words=s.split(' '); let mix=shuffle(words.map((w,i)=>[w,i])); if(mix.map(x=>x[1]).join()===words.map((w,i)=>i).join()) mix=mix.reverse();
        const d=document.createElement('div'); d.className='it ord';
        d.innerHTML=`<div class="line"></div><div class="row bank">${mix.map(([w])=>`<button class="w">${esc(w)}</button>`).join('')}</div><div class="row"><button class="btn sm ck">Проверить</button><button class="btn sm sh">Ответ</button></div>`;
        const line=d.querySelector('.line'), bank=d.querySelector('.bank');
        d.querySelectorAll('.w').forEach(w=>w.onclick=()=>{(w.parentNode===bank?line:bank).appendChild(w);line.classList.remove('ok','no')});
        let counted=false;
        d.querySelector('.ck').onclick=()=>{const t=[...line.children].map(x=>x.textContent).join(' ');const ok=t===s;line.classList.toggle('ok',ok);line.classList.toggle('no',!ok);if(ok&&!counted){counted=true;right++;el.querySelector('.score').textContent=a._score()}};
        d.querySelector('.sh').onclick=()=>{line.innerHTML='';bank.innerHTML='';line.textContent=s;line.classList.add('ok');counted=true};
        box.appendChild(d);
      });
    },()=>result(el,`${right} из ${items.length}`,start));
  };
  start();
}

        d.querySelector('.ck').onclick=check; inp.onkeydown=e=>{if(e.key==='Enter')check()};

  start();
}


function seq(el,a){

  const draw=()=>{
    const r=a.rounds[ri]; let next=0;
    el.innerHTML=head(a,`раунд ${ri+1} / ${a.rounds.length} · ошибок: ${errors}`)+`<div class="note">${esc(r.t)}: нажимай по порядку.</div>
      <ol class="seqdone"></ol><div class="pool">${shuffle(r.items.map((t,i)=>[t,i])).map(([t,i])=>`<button class="sc" data-i="${i}">${esc(t)}</button>`).join('')}</div><div class="pager" style="min-height:38px"></div>`;
    const done=el.querySelector('.seqdone');
    el.querySelectorAll('.pool .sc').forEach(b=>b.onclick=()=>{
      if(+b.dataset.i===next){next++;const li=document.createElement('li');li.textContent=b.textContent;done.appendChild(li);b.remove();
        if(next===r.items.length){const pg=el.querySelector('.pager');pg.innerHTML=`<button class="btn pri">${ri<a.rounds.length-1?'Следующий раунд':'Итог'}</button>`;pg.firstChild.onclick=()=>{if(ri<a.rounds.length-1){ri++;draw()}else result(el,`Ошибок: ${errors}`,start)}}}
      else{errors++;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);el.querySelector('.score').textContent=`раунд ${ri+1} / ${a.rounds.length} · ошибок: ${errors}`}
    });
  };
  start();
}

function bomb(el,a,panel){
  let items,qi,score,boom,iv;
  const stop=()=>{clearInterval(iv)};
  panel._cl=stop;
  const intro=()=>{stop();el.innerHTML=head(a)+`<div class="bomb"><div class="ball">15</div><div class="q">10 вопросов. На каждый — 15 секунд.<br>Отвечай быстро и точно.</div><button class="btn pri" id="go">Старт</button></div>`;el.querySelector('#go').onclick=start};
  const start=()=>{items=shuffle(a.items).slice(0,10);qi=0;score=0;boom=0;ask()};
  const ask=()=>{
    stop(); if(qi>=items.length){result(el,`Верно: ${score} из ${items.length}`,start);return}
    const it=items[qi]; let t=15, answered=false;
    el.innerHTML=head(a,`${qi+1} / ${items.length} · верно: ${score} · ошибок: ${boom}`)+`<div class="bomb"><div class="ball">15</div><div class="fuse"><i style="width:100%"></i></div><div class="q">${it.html?fr(it.q):esc(it.q)}</div>${it.hint?`<div class="hintq note">${esc(it.hint)}</div>`:''}<div class="opts" style="justify-content:center">${it.opts.map(o=>`<button class="opt">${esc(o)}</button>`).join('')}</div><div class="nextb" style="min-height:38px"></div></div>`;
    const ball=el.querySelector('.ball'), fuse=el.querySelector('.fuse i');
    const finish=ok=>{answered=true;stop();
      el.querySelectorAll('.opt').forEach(x=>{if(norm(x.textContent)===norm(it.a))x.classList.add('ok');x.disabled=true});
      if(ok){score++;ball.textContent='✓';ball.style.background='var(--good)'}
      else{boom++;ball.textContent=t<=0?'время':'нет';ball.style.fontSize='22px';ball.classList.add('boom');}
      el.querySelector('.score').textContent=`${qi+1} / ${items.length} · верно: ${score} · ошибок: ${boom}`;
      const nb=el.querySelector('.nextb');nb.innerHTML=`<button class="btn pri">${qi<items.length-1?'Следующий вопрос':'Итог'}</button>`;nb.firstChild.onclick=()=>{qi++;ask()};
    };
    el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(answered)return;const ok=norm(b.textContent)===norm(it.a);if(!ok)b.classList.add('no');finish(ok)});
    requestAnimationFrame(()=>{fuse.style.width=(14/15*100)+'%'});
    iv=setInterval(()=>{t--;ball.textContent=t;fuse.style.width=Math.max(0,(t-1)/15*100)+'%';if(t<=0)finish(false)},1000);
  };
  intro();
}
