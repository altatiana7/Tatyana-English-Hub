er, could hardly)."], [["named", "called", "referred", "described"], 1, "call sb + noun / adjective — describe someone in this way."], [["feeling", "brain", "heart", "mind"], 2, "with all one's heart — completely, sincerely."], [["told", "said", "spoke", "talked"], 0, "tell — say something to someone, tell a story (tell sb)."], [["approving", "attending", "participating", "visiting"], 1, "attend lectures — go to them."], [["admired", "pleased", "enjoyed", "attracted"], 2, "enjoy — take pleasure in (enjoy doing / oneself)."], [["remind", "remember", "review", "repeat"], 1, "remember — keep in your memory (remember to do — not forget; remember doing — recall)."]]}, {"t": "A festival in Pepin", "src": "A", "text": "There are many interesting festivals in the USA. If you want to experience village life of the nineteenth century, you should go to the annual Laura Ingalls Wilder Days festival. It takes {0} in the Village of Pepin. This event is devoted to an American writer Laura Ingalls Wilder known for the “Little House on the Prairie” series of children’s novels based on her childhood in a settler family. This is the perfect festival for those who have read the books and {1} what life really was like for Laura and her family. Several thousand people come to see a beautiful parade and {2} many other activities at the two-day event.\n\nCome join us for this fun-filled weekend! The annual Laura Days celebration is {3} on the second weekend in September. Saturday events include a parade, children’s pioneer games and activities in the park, craft demonstrations and a food tent. {4} the same time, there are many other activities, such as Little Miss Laura contest, a greased pig contest, tours of the Masters Hotel, and more! {5}, you can visit an old church on Sunday morning or go to the Laura Ingalls Wilder Museum, which features many items Laura and her family had and recalls the era in which they lived. And we {6} recommend finishing your visit to Pepin with a picnic on the shore of Lake Pepin, picking up pretty pebbles as Laura did so many years ago.", "g": [[["side", "time", "place", "part"], 2, "place — put carefully in a position (formal)."], [["expected", "wondered", "doubted", "believed"], 1, "wonder what… — ask yourself."], [["please", "satisfy", "amuse", "enjoy"], 3, "enjoy — take pleasure in (enjoy doing / oneself)."], [["held", "done", "put", "kept"], 0, "hold — have in your hands; organise (hold a meeting)."], [["On", "By", "At", "In"], 2, "At the same time — a fixed phrase."], [["Though", "Therefore", "However", "Besides"], 3, "besides — also, in addition (informal)."], [["strongly", "deeply", "hardly", "strictly"], 0, "strongly recommend — a fixed collocation."]]}, {"t": "A summer by the lake", "src": "A", "text": "Barbara and Michael were sister and brother – twelve and eight years old. They were {0} vacation, but Barbara was bored out of her mind. Ever since Michael was born, their family had been coming to Emerald Lake, a crystal blue lake which stretched as far as the eye could {1}. They had stayed in the same cabin, an old wooden house just several steps from where the water met the sandy beach. And ever since Barbara was ten, she had hated coming here. The mosquitoes got bigger every year. By now they were larger, it seemed, than her fist. The humidity got worse, and the rain became more constant. If this is what people meant by climate change, she thought, she was not {2} with it. Everybody in the family knew about it as Barbara never {3} to love this place. She spent most of the day reading in bed, stretched out on the woollen blanket on top of the rock-hard mattress, wishing she was at home with her friends doing normal summer stuff: going to the mall, watching movies, eating popsicles in the park. She wished she was anywhere but Emerald Lake. {4}, there was nowhere else Michael wanted to be. He didn’t mind the humidity, he found the constant rain soothing, and thought the giant mosquitoes were the most amazing animals he had ever seen. Michael paid {5} to every little animal and plant around him. He didn’t have time for reading on a woollen blanket because he was in love with the lake. The boy was {6} the most of his summertime by the lake.", "g": [[["to", "on", "in", "at"], 1, "be on vacation / on holiday."], [["glance", "look", "watch", "see"], 3, "see — notice with your eyes without trying; see a film at the cinema."], [["affected", "satisfied", "interested", "convinced"], 1, "satisfied — happy with what you got (satisfied with)."], [["presented", "preserved", "pretended", "previewed"], 2, "pretend to do sth — act as if something is true."], [["However", "Moreover", "Although", "Therefore"], 0, "however — but (starts a new sentence, followed by a comma)."], [["affection", "connection", "attention", "relation"], 2, "attention — interest, notice (pay attention to)."], [["turning", "keeping", "giving", "making"], 3, "make — make a decision, a mistake, money, a speech, friends."]]}, {"t": "A new coat", "src": "A", "text": "At the weekend Dotty went to Anna for tea and Anna’s mother Miranda gasped when she saw Dotty. She had changed a lot. Anna had {0} Dotty to the hairdresser’s and now she had a very beautiful hairstyle with a fringe. {1}, Miranda knew that the girls had bought a new suit for Dotty.\n“You look completely different with your hair like that,” Miranda said approvingly, then, “Did you bring your suit with you? Anna told me how nice it was.”\nDotty waved a bag at her. “Yes, I did. Anna is going to let me borrow one of her coats which would match my suit. She says I'm not {2} to wear this one now.”\n“Well, I certainly agree with her on that point but I think you may take my woollen coat {3} of Anna’s. I never wear it any more so if you like it you’re more than welcome to keep it.” Miranda disappeared to return minutes later with a very smart swing coat in navy blue folded across her arm. “Here, try this on,” she encouraged and Dotty slipped it on. “It’s just perfect,” Miranda told her. “And I have to say it looks so much better on you than it ever did on me. Take it and wear it in good health.”\n“But I couldn’t,” Dotty spluttered. “It must have cost a {4} and I really can’t take it.”\n“Of course you can,” Miranda said. What good is it to me, hanging in the wardrobe and never {5} the light of day? You’ll be {6} me a favour taking it out of the way.” Dotty was really pleased with Miranda’s present.", "g": [[["proceeded", "accompanied", "followed", "addressed"], 1, "accompany sb — go somewhere with them."], [["Therefore", "Otherwise", "Moreover", "Although"], 2, "moreover — in addition, what is more."], [["agreed", "accepted", "afforded", "allowed"], 3, "allow — give permission (allow sb to do)."], [["instead", "besides", "against", "outside"], 0, "instead — in place of (instead of + noun / -ing)."], [["price", "thing", "fortune", "wealth"], 2, "cost a fortune — be very expensive."], [["looking", "seeing", "watching", "glancing"], 1, "see — notice with your eyes without trying; see a film at the cinema."], [["making", "getting", "doing", "giving"], 2, "do — do well, do homework, do business, do sb a favour."]]}, {"t": "Mary", "src": "A", "text": "When Mary left her office, she walked home to her apartment on Twilight Road. The chill of the early morning made her {0} her hands into the pockets of her stylish jacket and pick up her pace. The weather brought to mind a long-forgotten line from Little Women. One of the sisters – she couldn’t {1} whether it was Berth or Amy – said that November was a disagreeable month, and Jo agreed, commenting that that was why she was born in it.\nMe, too, Mary thought, “My birthday is November the twenty-forth. The Thanksgiving baby they called me. Thanksgiving and birthdays {2} to be fun, but not for me. I had to jog between two dinners and there was no one to help me. It was a problem to manage two dinners in different places at the same time. Of course, my domestic problem is small, compared with Millie’s,” she thought as she {3} her street and turned west. Millie was her best friend and she was in {4}.\nYesterday her meeting with Millie was strange. Millie had stayed at the office for about an hour. Over a cup of tea, Millie had insisted that Mary keep the turquoise ring. “If something were to happen to me, it’s important that you have it just in {5} the woman who phoned you contacts you again,” she had said. She doesn’t mean if something happens to her; she means when, Mary thought, as she opened the door and turned {6} the light in her apartment.", "g": [[["lie", "lay", "stay", "put"], 3, "put — move into a place (put – put – put)."], [["realize", "remember", "recover", "remind"], 1, "remember — keep in your memory (remember to do — not forget; remember doing — recall)."], [["kept", "took", "used", "held"], 2, "use — used to do — did regularly in the past."], [["arrived", "completed", "reached", "achieved"], 2, "reach — get to a place or level (no preposition)."], [["trouble", "fault", "problem", "failure"], 0, "trouble — difficulties, problems."], [["time", "case", "event", "fact"], 1, "case — a situation (in case, in that case)."], [["in", "of", "off", "on"], 3, "turn on the light."]]}, {"t": "Lincoln", "src": "A", "text": "Lincoln stood in the library of William’s house in Russell Square, staring at the Renoir painting of the two red-headed young women. It hung above the fireplace, and Lincoln understood why it took pride of place in this room. It was a masterpiece, and he could see that it {0} William of Lily and Emily.\nLincoln had told William he needed to speak to him privately, and they had {1} to meet here. Lily was still in Brighton with the children. The house was empty and very quiet this afternoon. John came in and, clearing his throat, asked, “Would you like something, sir? Perhaps, a cup of tea?”\n“No, thank you, John,” Lincoln answered. Lincoln continued to study the marvelous Renoir. Suddenly William entered the room and apologized for {2} him waiting.\n“What’s this all about, Lincoln? You {3} rather serious, even sad,” William said. Lincoln was silent. He went and sat on a chair near the fireplace. William took the other chair, staring at him attentively.\n“Brad Winston telephoned me just as I was leaving for lunch. He had apparently attempted to get hold of you here, but the line was busy. In {4}, he tried several times with no success. That’s why he finally got {5} touch with me. He said that there was a terrible car {6} sometime last night. Your brother George is in hospital now,” Lincoln said.", "g": [[["remembered", "reviewed", "recorded", "reminded"], 3, "remind — make someone remember (remind sb to do / of / about)."], [["managed", "arranged", "established", "coordinated"], 1, "arrange to do sth — plan to do it."], [["keeping", "holding", "fixing", "carrying"], 0, "keep — continue; have and not give back (keep doing)."], [["watch", "see", "look", "glance"], 2, "look — turn your eyes towards something on purpose (look at sth)."], [["time", "fact", "place", "point"], 1, "fact — something true (in fact, the fact that)."], [["on", "at", "by", "in"], 3, "get in touch with sb — contact them."], [["incident", "accident", "occasion", "event"], 1, "accident — an unplanned bad event, a crash; chance."]]}, {"t": "Gordon", "src": "A", "text": "Gordon Fink had felt restless all day. Early Sunday morning he had gone for a run in Central Park. Afterwards he came home and {0} a cheese sandwich. He didn’t eat much for breakfast. During his marriage he had been the regular morning chef, but he had got {1} of the habit when his family left. He never bothered to fix anything for himself now. He read the Times while he ate, but {2}, after pouring a second cup of coffee, he found he was unable to concentrate, so he {3} down the paper and walked to the window.\nIt was eleven o’clock. His apartment overlooked the park, and he could see that the sunny day had already brought out a lot of people. There were many couples and family groups. Gordon {4} an elderly woman settle on a bench and turn her face so that the sun shone on it. She looked calm and happy.\nHe turned away from the window and went into the bedroom. He had to pack for his trip tomorrow, and the prospect irritated him. It was almost over though. There was only one week more of publicity for the book, and then he would take a week off to himself. The {5} agent had prepared a list of cruise ships with empty first-class space that would accommodate his schedule. He went back to his desk to look at it. Although he trusted his agent, he wanted to choose a cruise ship himself. He looked {6} to having a pleasant rest after a year of hard work.", "g": [[["cooked", "baked", "did", "made"], 3, "make — make a decision, a mistake, money, a speech, friends."], [["over", "out", "down", "up"], 1, "get out of the habit — stop doing something regularly."], [["definitely", "directly", "finally", "completely"], 2, "finally — in the end, after a long time."], [["placed", "arranged", "laid", "rested"], 2, "lay — put down carefully (lay – laid – laid)."], [["watched", "looked", "viewed", "glanced"], 0, "watch — look at something that moves or changes for some time."], [["tour", "travel", "trip", "voyage"], 1, "travel — travelling in general (uncountable); also a verb."], [["on", "in", "through", "forward"], 3, "look forward to doing sth."]]}, {"t": "A jazz evening", "src": "A", "text": "Jessica was talking about jazz music with her mother. Her mom was telling her about one song that was a revolutionary piece of music in the last century. Jessica was surprised to {0} out that it was still listened to by jazz audiences all around the world. She loved how music could be passed down through generations.\n“Well, it sounds like you’re interested {1} jazz history all of a sudden. What’s making you ask all these questions?” Jessica’s mom asked.\nThe girl explained that she wanted to learn something new. She had learned enough classical music and wanted to move on to something else.\n“Then start improvising!” Jessica’s mom told her. “Jazz is all about improvising. So many solos are just musicians playing what their heart feels.”\nJessica thought about improvising. She could {2} imagine just sitting down at the piano and playing anything that came to her mind, just piecing together notes in a way that would captivate her listeners. She {3} silent for a while, concentrating on what she could possibly play off the top of her head.\nHer mom noticed Jessica’s hesitation. “The only way you’re going to learn how to improvise is if you try,” she told her daughter. She {4} quickly at Jessica, walked over to the piano and pulled out the bench. She patted it and looked at Jessica.\n“Let’s start now!” she said with excitement in her eyes. {5} Jessica had never done it before, she decided to give it a try. She was full of inspiration. The girl didn’t say anything; she just nodded her head in {6} and sat down at the piano.", "g": [[["sort", "find", "turn", "look"], 1, "find — discover where something is (find – found – found)."], [["in", "of", "on", "at"], 0, "be interested in sth."], [["nearly", "merely", "hardly", "rarely"], 2, "hardly — almost not (hardly ever, could hardly)."], [["remained", "recovered", "reacted", "reclined"], 0, "remain — stay the same; stay in a place."], [["stared", "watched", "looked", "saw"], 2, "look — turn your eyes towards something on purpose (look at sth)."], [["Therefore", "Nevertheless", "However", "Although"], 3, "although — even though (+ subject + verb)."], [["argument", "agreement", "achievement", "arrangement"], 1, "nod in agreement — a fixed phrase."]]}, {"t": "How to become a good leader", "src": "A", "text": "Being a good leader takes work. It is not hard at all to {0} the difference between a good and a bad boss. Exceptional leaders – those who are respected and {1} by their team – have a lot of secret skills that they put to use every day.\nFirstly, building relationships – both with your team and your partners – is crucial in leading a team. That means your success depends greatly {2} interpersonal skills and emotional intelligence. Emotional intelligence is the ability to recognize, understand, and manage our emotions, as well as understand the emotions of others. It’s a part of how we navigate social situations and then make decisions to {3} goals. Several studies have found that a strong emotional intelligence is a top factor for a leader’s success. {4} to the research, managers with the strongest emotional intelligence were much more likely to succeed.\nExceptional leaders are ones who regularly {5} employees of the main goal. A team needs to know what they’re marching toward. With a larger vision in mind, their day-to-day work has more purpose.\nGreat leaders {6} sure their daily behavior is a model for their team. They’re reliable (meaning they always follow through on what they’ve promised), they respect people’s time (meaning they don’t make others wait unnecessarily), and they retain a thoughtful, objective approach to problems or issues.", "g": [[["talk", "speak", "say", "tell"], 3, "tell — say something to someone, tell a story (tell sb)."], [["amazed", "admired", "impressed", "enjoyed"], 1, "admire — respect and like (admire sb for sth)."], [["in", "from", "on", "for"], 2, "depend on sth."], [["complete", "master", "manage", "achieve"], 3, "achieve — reach a goal or result."], [["According", "Including", "Concerning", "Regarding"], 0, "according to — as said by a source."], [["revise", "remind", "review", "recall"], 1, "remind — make someone remember (remind sb to do / of / about)."], [["keep", "make", "hold", "take"], 1, "make — make a decision, a mistake, money, a speech, friends."]]}, {"t": "My children", "src": "A", "text": "Miss Davidson’s school was half-way between Harry’s house and mine. My elder daughter Sophia had been going there for some years, and now my younger daughter began to go, too. It was not hard to {0} the difference between my daughters. My elder daughter {1} after me. She had black hair, green eyes and a large forehead. She was very impulsive and often lost her temper. She was lazy but studied well. Her teachers always praised her. My younger daughter didn’t {2} me. She was the picture of my wife’s mother. She had blond hair and blue eyes. She was very obedient and never made noise but she was not very good {3} studies. I thought she was always shy and that prevented her from having good marks.\n\nLiza, our nursemaid, would set off in the morning with two of my children and Ned, Harry’s son. She usually took a mail-cart with her. This was for Ned to ride in when he was tired but it was not often that Ned would {4} that he was tired. The maid left the girls at Miss Davidson’s and then brought Ned on to the Beeches. She would take him back in time to {5} the girls when school was over. I often watched them play with Ned in the backyard or tell him fairy-tales. My daughters adored Ned but he didn’t {6} attention to them.", "g": [[["speak", "talk", "tell", "say"], 2, "tell — say something to someone, tell a story (tell sb)."], [["took", "looked", "seemed", "felt"], 0, "take — take place, take part, take time."], [["review", "remind", "resemble", "remember"], 2, "resemble — look like someone (no preposition)."], [["in", "for", "on", "at"], 3, "be good at sth."], [["accept", "admit", "allow", "adopt"], 1, "admit — agree that something is true (admit doing); accept into a university."], [["pull", "pick", "gather", "collect"], 3, "collect sb from school — pick them up."], [["pay", "give", "take", "hold"], 0, "pay attention to sb / sth."]]}, {"t": "A special lunch", "src": "A", "text": "Dotty came to meet the editor Jerry Green in his London office. He praised her work and {0} to publish her stories in his magazine. After discussing the contract Jerry invited Dotty for lunch. It was her first visit to a big city, so the young lady was really excited.\nA shiny black cab stopped next to the beautiful building and Jerry took Dotty into the restaurant. A smart waiter in a black suit took their coats and escorted them to a table by the window.\n“Please order {1} you like,” Jerry told her as the waiter handed her a menu, and Dotty got lost. She had been {2} up on very plain food and everything on the menu looked so fancy and expensive. Jerry saw her discomfort. {3}, he asked after a while if he could order for her. Dotty gratefully agreed. The meal was like nothing she had ever eaten before, and as one delicious course followed another she began to relax a little as she found that Jerry was good company and very easy to talk to. He {4} Dotty of her elder brother.\n“Thank you so much for a lovely day and a lovely meal,” Dotty said when the lunch was over. She was so full that she was sure she wouldn't be able to eat another thing for at least a month.\n“It was my pleasure,” he assured her. “I’ve really enjoyed today. And I hope this will be the start of a long working relationship. I’ll be {5} touch soon.” Then she {6} goodbye and caught a cab to the railway station. It had been a truly unforgettable day.", "g": [[["suggested", "provided", "proposed", "offered"], 3, "offer — say you will give or do something (offer to do)."], [["whenever", "wherever", "whoever", "whatever"], 3, "whatever — anything that; no matter what."], [["grown", "raised", "brought", "risen"], 2, "bring — come here with something."], [["However", "Therefore", "Although", "Otherwise"], 1, "therefore — so, for this reason."], [["reminded", "remembered", "revised", "reviewed"], 0, "remind — make someone remember (remind sb to do / of / about)."], [["at", "in", "on", "by"], 1, "be in touch — keep in contact."], [["spoke", "told", "said", "talked"], 2, "say — use words; say sth (to sb), no person right after say."]]}, {"t": "My second visit", "src": "A", "text": "It was my second visit to Dr Boxer. He answered the door exactly as he had done the first time, by opening only a crack and looking through it warily, as if there were something that he was {0} not everyone should see. He {1} me of a gatekeeper in a fairy story: ageless and watchful. It was a feeling I would come to know well in the next months. Even now, years later and far away, sometimes in my dreams, I find myself standing before that white door, {2} for him to open it. When he {3} it was me, he opened the door slightly wider than he had done the first time. He let me in.\nIt was a beautiful room, not an office at all, and much bigger than it looked from outside – airy and white, with a high ceiling and two windows. In the corner, near a low bookshelf, was a big round table with teapots and Greek books, and there were flowers everywhere. I was surprised and {4} at the same time. Everywhere I looked, there was something beautiful – Oriental carpets, tiny paintings and white vases with flowers. He sat in an armchair by the window and said, “I {5} you’ve come about the Greek class.”\n“Yes.”\n“It’s rather late in the term,” he said. “Young people often find Greek a bore, which is not to say that it isn’t good for them.”\n“I’d like to study it again. It seems a shame to {6} it after two years”.\nAfter a moment Dr Boxer said slowly, “If you’d like, I’d be happy to take you as a pupil, Mr Brown.”", "g": [[["cheerful", "forgetful", "careful", "doubtful"], 2, "be careful (that)… — take care."], [["recovered", "reviewed", "reminded", "remembered"], 2, "remind — make someone remember (remind sb to do / of / about)."], [["waiting", "expecting", "delaying", "pausing"], 0, "wait — stay until something happens (wait for)."], [["viewed", "saw", "watched", "looked"], 1, "see — notice with your eyes without trying; see a film at the cinema."], [["inclined", "influenced", "inspired", "impressed"], 3, "impress — make someone admire you (be impressed by)."], [["suggest", "suppose", "submit", "supervise"], 1, "suppose — think something is probably true; be supposed to — should."], [["end", "drop", "fall", "sink"], 1, "drop a subject — stop studying it."]]}, {"t": "My uncle", "src": "A", "text": "I didn’t like my uncle Conrad. When he rose in the morning, he somehow {0} to wake the entire household. No one complained, as he was the breadwinner in the family, and in any {1}, he was cheaper and more reliable than an alarm clock.\nThe first noise I would hear was the bedroom door slamming. This would be followed by my uncle tramping along the creaky wooden landing and down the stairs. Then another door would slam as he {2} into the bathroom. If anyone was still asleep, the rush of water, followed by two more slammed doors before he returned to the bedroom, served to {3} them that my uncle expected his breakfast to be on the table by the time he walked into the kitchen. He only had a wash and a shave on Saturday evenings before going to the cinema. He {4} a bath four times a year on quarter-day. No one was going to accuse him of wasting his hard-earned cash on soap.\nMy mum would be next up, leaping out of bed moments after the first slammed door. There would be a bowl of porridge on the stove by the time my uncle came out of the bathroom. Grandma followed shortly afterwards, and would {5} her daughter in the kitchen before my uncle had taken his place at the head of the table. I had to be down within 5 minutes of the first slammed door if I hoped to get any breakfast. This daily {6} in the household never varied.", "g": [[["resulted", "achieved", "managed", "succeeded"], 2, "manage — succeed in doing something difficult (manage to do)."], [["case", "view", "way", "sense"], 0, "case — a situation (in case, in that case)."], [["departed", "digressed", "distracted", "disappeared"], 3, "disappear into a room — go in and be gone."], [["review", "remind", "revise", "remember"], 1, "remind — make someone remember (remind sb to do / of / about)."], [["took", "made", "kept", "held"], 0, "take — take place, take part, take time."], [["add", "link", "fit", "join"], 3, "join — become a member; meet someone (join sb)."], [["plan", "topic", "routine", "theme"], 2, "daily routine — what you usually do every day."]]}, {"t": "Memories", "src": "A", "text": "Jessica was having dinner with her family. They were listening to jazz music and discussing the history of jazz. Jessica {0} quickly at her mom and asked if she had listened to jazz while growing up.\n“Oh, all the time! I can {1} think of an evening without jazz music at home,” she exclaimed. “My dad was really keen {2} jazz and swing music. He was a pianist himself. He learned how to play from his father – my grandfather – who was around when swing music was just becoming popular,” she explained.\n“When was that?” Jessica asked.\n“Well, swing music – a type of jazz style with a strong beat that really makes you want to dance – had been played for a long time by the\nAfrican-American community before it really became popular. My grandfather and his father had been playing swing long before it was heard on the radio. When the Great Depression hit in the 1930s, many Americans were out of jobs and money. So of course they needed something to {3} them up. When people heard swing music, they forgot about their problems. The music was just so uplifting; it {4} them of all the good times they had had. So big bands, like the one led by Duke Ellington, started to play at famous ballrooms and theaters all across the United States and even Europe,” her mom explained.\n“And so that’s when your grandpa was around?” Jessica asked. She was so excited to learn that she had a connection to this music.\n“Yes,” her mother nodded her head in {5}. “He loved to go dancing and never missed a music party. {6}, he saw the famous Duke Ellington and his band play live once!” she replied.", "g": [[["stared", "watched", "saw", "looked"], 3, "look — turn your eyes towards something on purpose (look at sth)."], [["nearly", "rarely", "hardly", "merely"], 2, "hardly — almost not (hardly ever, could hardly)."], [["at", "on", "of", "in"], 1, "be keen on sth — like it very much."], [["cheer", "grow", "bring", "clear"], 0, "cheer sb up — make someone happier."], [["revised", "reminded", "recalled", "remembered"], 1, "remind — make someone remember (remind sb to do / of / about)."], [["arrangement", "argument", "agreement", "achievement"], 2, "nod in agreement — a fixed phrase."], [["Nevertheless", "Although", "However", "Moreover"], 3, "moreover — in addition, what is more."]]}, {"t": "A visit", "src": "A", "text": "Early the next afternoon, Peter dropped by for a visit. “It’s hot in here,” he said, taking {0} his wet coat and throwing it over the back of a chair. His hair was wet, his face flushed. “Don’t go outside, whatever you do,” he said. “It’s terrible outside. By the way, you haven’t {1} Dave, have you?”\nI ran a hand through my hair. It was a Friday afternoon, no class and I hadn’t been out of my room all day. I worked hard translating a Greek poem.\n“Dave stopped by last night,” I said. Peter reached to the pocket of his overcoat and pulled out a pack. “I {2} you a sandwich since you weren’t at lunch.” It was cream cheese and marmalade, I knew without looking. Peter was fanatical about them, but I didn’t like them much. I unwrapped a corner of it and took a bite, pretended to {3} it, then set it down on my desk. “Have you talked to Dave recently?” I said.\n“Just this morning. He drove me to the bank.” Peter reached into his pocket again and took out a sheet of paper covered with numbers. Mechanically, I took the sheet of paper from him. It was covered with algebraic formulas, but at the moment it was frankly the last thing on my {4}. I shook my head and was on the {5} of handing it back when something stopped me. I wasn’t very good at mathematics but I knew I should {6} in solving this problem.", "g": [[["on", "in", "off", "of"], 2, "take off a coat."], [["seen", "watched", "looked", "glanced"], 0, "Have you seen sb? — see (meet, notice)."], [["brought", "took",  [["However", "Although", "Therefore", "Moreover"], 0, "however — but (starts a new sentence, followed by a comma)."], [["bothered", "annoyed", "worried", "troubled"], 2, "worry — feel nervous (worry about)."], [["destruction", "demonstration", "departure", "determination"], 2, "departure — leaving a job or a place."], [["recognised", "respected", "regarded", "remained"], 1, "be respected by sb — admired for good qualities."], [["admire", "accept", "appreciate", "approve"], 3, "approve of sth — think it is right."]]}, {"t": "Good news", "src": "A", "text": "Barbara was doing a course in the traditional Hawaiian dancing, which is called hula. She and her groupmates were sitting at the meeting in their dance school when their teacher announced the final preparations for the graduation ceremony. The girls and boys {0} at one another in excitement – they had been training hard in order to graduate and become professional hula dancers. They were all waiting {1} this moment.\n“That means that you all must stay in the school unless you have a very good reason to leave. I don’t want you to {2} out of energy now, so we’ll only practice once a day in order to give your bodies rest,” the dance teacher told her students. Barbara and her friends all let out a sigh of relief. They expected to practice more than usual before their big graduation performance. {3}, their teacher had a different plan.\nAfter the meeting the girls and boys got up to eat breakfast. They walked to the kitchen where fresh fruit was already scattered across the table. Barbara picked up a mango and a knife and began to cut. As she passed around juicy mango slices to her friends, they {4} their excitement for graduation with each other.\n“I can’t wait to see my family!” a boy named Keanu said. Everyone nodded their heads in {5}. It had been a month since everyone had seen their family and friends. Although they loved living in the dance school, it was sort of a boarding school and they could not go home {6} said. His voice {6}, there was a threat in it. “You can do better than that.”\n“Sorry,” I said, pushed back from the table, got my coat and left.", "g": [[["watched", "saw", "looked", "glimpsed"], 2, "look — turn your eyes towards something on purpose (look at sth)."], [["satisfied", "preferred", "enjoyed", "approved"], 2, "enjoy — take pleasure in (enjoy doing / oneself)."], [["making", "doing", "going", "passing"], 0, "make — make a decision, a mistake, money, a speech, friends."], [["individually", "respectively", "independently", "separately"], 1, "respectively — in the order mentioned."], [["reminded", "recollected", "repeated", "resembled"], 3, "resemble — look like someone (no preposition)."], [["keeping", "holding", "taking", "putting"], 1, "hold — have in your hands; organise (hold a meeting)."], [["raised", "rose", "grew", "lifted"], 1, "rise — go up (no object: rise – rose – risen)."]]}, {"t": "Michael’s holidays", "src": "A", "text": "Michael was very happy. He was {0} holidays with his family, making the most of his time by Emerald Lake. Early in the morning, as soon as dawn broke, he was on its shore – building fantastic sand castles from the gritty sand. He imitated the birds, trying to get their {1}. He chased the lizards, hoping they would want to play. He threw rocks into the water doing everything he could to entertain the fish. Michael loved nature — even if the hundreds of mosquito bites that covered his arms and legs were proof that nature didn’t love him back. Camping in the nature was {2} the best way to spend your summer holidays.\nMichael saw his sister Barbara sitting on the sand. At first, he didn’t want to {3} her, but he had a great idea to share. So he came up to her and stated, “I bet the other side of the lake is even better than this side!”\nTrying to act interested, Barbara asked, “What {4} you think so?”\n“It’s tough to believe, I know, because this side is so unbelievably perfect. There are birds and lizards and mosquitoes and fish. {5}, something in my gut tells me that it’s even better over there.”\nThe summer before, Barbara and her mother had driven to the other side of the lake to buy shampoo at the drugstore. The other side of the lake was nothing very exciting: strip malls and gas stations, with a shopping mall in the middle. But before she {6} the truth, she wanted to know what he was imagining. “Describe it to me,” she asked. “Describe everything that’s on the other side of the lake.”", "g": [[["to", "on", "in", "at"], 1, "be on holiday."], [["affection", "connection", "attention", "relation"], 2, "attention — interest, notice (pay attention to)."], [["considerably", "completely", "perfectly", "definitely"], 3, "definitely — certainly, without doubt."], [["bother", "demand", "escape", "concern"], 0, "bother — disturb; make an effort (don't bother)."], [["turns", "gives", "makes", "takes"], 2, "make — make a decision, a mistake, money, a speech, friends."], [["Although", "Nevertheless", "Moreover", "Otherwise"], 1, "nevertheless — in spite of that."], [["talked", "told", "spoke", "said"], 1, "tell — say something to someone, tell a story (tell sb)."]]}, {"t": "A hard task", "src": "A", "text": "I barely made the 8:30 a.m. Saturday train to Huntington, a town on the north shore of Long Island. The railroad stopped service because of the snowfall the night before; sleepy commuters wearing smart suits crowded in the train. They seemed really tired and eager to get home and finally {0} the rest of the weekend with their families.\nI had planned on using this one-hour train ride to get a good start on a short story I was {1} to submit to a magazine on Monday morning. But standing there, sandwiched between a stroller and an exhausted businessman, I couldn’t even get my journal out of my backpack. It was absolutely impossible to compose my thoughts on its pages. Of course, it was a {2} for me as I was forced to relax instead of struggling with my blank journal pages. Frankly {3},\nI’d been struggling to come up with an idea for the story for days, my thoughts circling aimlessly in the warehouse of my mind. The harder I {4} for the idea, the emptier my head seemed. And then, unexpectedly, as I was trying hard to maintain my balance, pressed against the bathroom door and a crowd of commuters, I finally got an idea – or rather, an idea for how to get an idea.\nI decided that by the end of {5} adventure I have this weekend, I will write a short story about it. I told my friend Bennett about my decision when I was getting inside his car at the station. And the two of us set {6} on our adventure.", "g": [[["admire", "enjoy", "adore", "envy"], 1, "enjoy — take pleasure in (enjoy doing / oneself)."], [["suspected", "succeeded", "supported", "supposed"], 3, "suppose — think something is probably true; be supposed to — should."], [["refund", "revenge", "relief", "regret"], 2, "a relief — a feeling of comfort when worry ends."], [["telling", "talking", "saying", "speaking"], 3, "speak — use a language; give a formal talk."], [["looked", "watched", "glanced", "saw"], 0, "look — turn your eyes towards something on purpose (look at sth)."], [["wherever", "whenever", "whatever", "whoever"], 2, "whatever — anything that; no matter what."], [["round", "off", "over", "down"], 1, "set off — start a journey."]]}, {"t": "The effect of the temperature", "src": "A", "text": "Many people believe that office conditions can influence our work. For a {0} time achieving a comfortable room temperature in hot climates was a constant struggle. Research discovered an obvious fact: finding an office temperature to {1} everyone all the time is basically impossible. “Part of the problem is trying to work out the “correct” temperature. It depends {2} what you’re measuring,” said researcher David House.\nOne study {3} at the impact of the room temperature on worker productivity, by tracking the activity of managers in an office. {4} it measured the activity of just nine women, the results were impressive. At 25°C they were typing non-stop with an error rate of just 10%. When the temperature dropped to 20°C, they were half as productive, more than doubling the number of mistakes.\nBut it’s not quite that simple. When students in the other study were asked to solve a math problem in either a cool or a warm room, the group in the cooler room {5} in this task twice as often. It means that complex decisions are more difficult when we’re warm. When the temperature is above 27°C, we’re not so good at mathematics.\nIn fact, the room temperature can do more than influence your productivity – it can change the way you think. Warm environments are better for creative thinking, while cooler workplaces are thought to {6} people active during repetitive or monotonous tasks.", "g": [[["huge", "high", "big", "long"], 3, "long — measuring a lot from end to end; lasting a lot of time."], [["please", "amuse", "enjoy", "prefer"], 0, "please everyone — make everyone happy."], [["in", "from", "on", "for"], 2, "depend on sth."], [["observed", "looked", "watched", "glanced"], 1, "look — turn your eyes towards something on purpose (look at sth)."], [["Although", "Moreover", "Therefore", "However"], 0, "although — even though (+ subject + verb)."], [["fulfilled", "managed", "achieved", "succeeded"], 3, "succeed — do well, be successful (no object)."], [["stay", "gain", "keep", "hold"], 2, "keep — continue; have and not give back (keep doing)."]]}, {"t": "A famous athlete", "src": "A", "text": "Victoria Green is a tennis player who holds the most combined major titles among active players. But how did she {0} to get all of those cups? She dominates the court with her strength and agility. Her serve is {1} one of the best serves in women's tennis history. She serves with power and places the ball with accuracy. At Wimbledon in 2010, Green not only won the tournament, but she also {2} the tournament's record when she served 100 aces throughout her matches in the tournament!\nGreen uses her mental strength and resilience to win tennis matches. Victoria has made incredible comebacks in her career. In the 2013 US Open Final, she was losing to her opponent towards the end of the game. {3} she was two points away from losing the whole match, Green did not give up. Finally, she made a comeback and won the championship! Her victories in high-pressure tournaments illustrate her remarkable focus and {4}.\nVictoria Green continues to play professional tennis and also runs her own businesses. She has been on the cover of many popular magazines. She has also created her own charitable organization that {5} educational opportunities for underprivileged youth around the world. Victoria Green {6} young people that they can accomplish their dreams through hard work and dedication.", "g": [[["succeed", "complete", "achieve", "manage"], 3, "manage — succeed in doing something difficult (manage to do)."], [["considered", "convinced", "concerned", "confessed"], 0, "be considered (to be) sth — be thought of as."], [["pushed", "fought", "crashed", "broke"], 3, "break a record."], [["However", "Nevertheless", "Although", "Moreover"], 2, "although — even though (+ subject + verb)."], [["admiration", "determination", "expectation", "appreciation"], 1, "determination — a strong wish to succeed."], [["provides", "predicts", "permits", "pretends"], 0, "provide — give, supply (provide sb with sth)."], [["reviews", "revises", "remembers", "reminds"], 3, "remind — make someone remember (remind sb to do / of / about)."]]}, {"t": "Solo travelling", "src": "A", "text": "I like travelling alone. I have visited many places, such as Thailand, Europe, South America and the USA on my own, which was a great challenge. Every time I travel solo I {0} myself of how strong I am. Travelling with others, you tend to rely on different people for different things. For example, Joe handles the map because he’s good {1} navigation, while Jennifer deals with the arguments because she’s an excellent problem solver. When you’re travelling by yourself, only you’re {2} for it all: reading the map, navigating local transportation, communicating through language barriers to order food or a bus ticket, and any other travel situation.\nSolo travelling also developed my communication skills. I think I truly reached my full socializing potential when I was travelling alone in Europe. I can {3} that European culture is extremely social in itself. Suddenly, people were coming up and starting conversations with me in money exchanges, train stations, parks, buses, piazzas, hostels. As I got used to the European culture, I began initiating conversations myself. I still {4} in touch with most of the friends I made on that trip. They are very kind and helpful people. {5}, I realized how easy it was to make friends once you came out of your shell. These communication skills have helped me to {6} in work, friendship and relationships.", "g": [[["revise", "review", "remind", "recall"], 2, "remind — make someone remember (remind sb to do / of / about)."], [["in", "at", "on", "of"], 1, "be good at sth."], [["dependable", "consistent", "reliable", "responsible"], 3, "be responsible for sth."], [["say", "speak", "talk", "tell"], 0, "say — use words; say sth (to sb), no person right after say."], [["take", "hold", "keep", "make"], 2, "keep — continue; have and not give back (keep doing)."], [["Therefore", "Otherwise", "However", "Moreover"], 3, "moreover — in addition, what is more."], [["succeed", "fulfill", "achieve", "manage"], 0, "succeed — do well, be successful (no object)."]]}, {"t": "Olivia", "src": "A", "text": "I never took Olivia to the theatre, but it was there I met her. I {0} the habit now of going every Saturday night, usually alone, sometimes with George. It was George who {1} me to Olivia Nelson. She was an only child whose father, a cotton merchant, had died and left her all he had. She was not very beautiful but she was tall, very graceful, smartly dressed and {2} me at once. Olivia got interested when George said that I was a novelist. Novelists were not too common in Cornwell then, though I believe they are now as numerous as knights. Olivia adored famous people. She was delighted to meet me. It turned {3} that Olivia had read my books, at least some of them and she liked them. She could {4} intelligently about them. She praised them and criticized them with a good deal of common sense. She discussed new plays and new books with me. She developed a habit of being wherever I was to be found. We had a few meals together at restaurants, and I {5} that I was dressing with unusual care.\nShe was so excited and happy, so full of good conversation, that I was charmed and captivated by her company. But I couldn’t help thinking that something was wrong. There was no {6} to think the worst. However, I couldn’t make myself propose to her.", "g": [[["kept", "held", "used", "formed"], 3, "form a habit — start doing something regularly."], [["called", "greeted", "introduced", "met"], 2, "introduce sb to sb — make two people meet."], [["involved", "attracted", "appealed", "engaged"], 1, "attract sb — make someone interested."], [["up", "down", "on", "out"], 3, "it turned out that… — it became known that."], [["talk", "tell", "discuss", "say"], 0, "talk — have a conversation (talk to sb about)."], [["determined", "discovered", "revealed", "disclosed"], 1, "discover — find something that already existed."], [["matter", "account", "reason", "cause"], 2, "reason — why something happens (a reason for)."]]}, {"t": "Mr. Thoreau in Concord", "src": "A", "text": "Concord, Massachusetts, is one of the New England towns that everybody likes to visit. When tourists {0} Boston they usually make a point of going to Concord by electric train because they have read about the famous battle ground of the great Revolutionary War there. They also want to see the homes of American writers Hawthorne, Emerson, and Thoreau. {1}, Concord is the place that everybody likes to visit.\nThe philosopher Henry Thoreau, who was born in Concord, was {2} on hiking. He loved the town so much that he spent most of his life walking through its fields and forests. You might {3} it was his life’s work, for he never had any real profession, and he walked between four to eight hours a day.\nWhen Mr. Thoreau started out on a long walk in the woods, he wore a wide-brimmed straw hat, stout shoes, and strong grey trousers to {4} sure that they would not show spots too easily, and would survive tree-climbing. Under his arm he usually carried an old music book in which to press plants, and in his pocket he kept a pencil and his diary. His friend, William Ellery Channing, often {5} the writer on his walks in the forest. They agreed that a week's camping was more fun than all the books in the world. Once they tried camping in Canada. They wore overalls most of the time, and {6} of suitcases, they tied a few changes of clothing into bundles, and each man took an umbrella. They called themselves “Knights of the Umbrella and Bundle”.", "g": [[["achieve", "reach", "enter", "arrive"], 1, "reach — get to a place or level (no preposition)."], [["Therefore", "Although", "Moreover", "However"], 0, "therefore — so, for this reason."], [["fond", "crazy", "eager", "keen"], 3, "keen — keen on — very interested in."], [["say", "speak", "talk", "tell"], 0, "say — use words; say sth (to sb), no person right after say."], [["take", "keep", "make", "gain"], 2, "make — make a decision, a mistake, money, a speech, friends."], [["attached", "accompanied", "connected", "attended"], 1, "accompany sb — go somewhere with them."], [["against", "outside", "besides", "instead"], 3, "instead — in place of (instead of + noun / -ing)."]]}, {"t": "Sandy", "src": "B", "text": "Sandy called Dan Atkins the following week, to give Berta Canning, her literary agent, plenty of time to get in touch with him and send him the manuscript he could read. She hoped he would {0} to help her to edit her first book. And when Dan Atkins answered, he seemed as though she’d woken him out of a sound sleep. She {1} profusely, and he didn’t sound happy to hear from her. There was a long silence and then he told Sandy to come on Saturday. He explained that he lived near the university campus where he {2} to teach. She wasn’t looking forward to meeting him, but she didn’t want Berta to be angry with her either. So, she bicycled over to his address on Saturday. When Sandy got there, he took forever to answer the bell. She was {3} about to leave when he opened the door. She followed him upstairs to a large living room that would have been lovely if he tidied it once in a while. There were stacks of books everywhere, a pile of papers, a mountain of manuscripts on the desk and half eaten food on the coffee table. He obviously lived alone and needed a housekeeper desperately. He was as untidy as his living room. He had a long, unkempt beard, a mane of wild white hair that {4} Sally of Albert Einstein. He was wearing jeans, a sweater with holes in it, and tennis shoes. Sandy could {5} figure out his age. He seemed to be about seventy, {6} Berta told her later that he was only sixty. He said that he liked her book.", "g": [[["admit", "agree", "assume", "approve"], 1, "agree — have the same opinion (agree with sb, agree to do, agree on sth)."], [["apologized", "approached", "appeared", "applied"], 0, "apologise — say sorry (apologise to sb for sth)."], [["kept", "held", "took", "used"], 3, "use — used to do — did regularly in the past."], [["still", "yet", "just", "only"], 2, "just — a moment ago; exactly; only."], [["reminded", "remembered", "recognized", "regarded"], 0, "remind — make someone remember (remind sb to do / of / about)."], [["nearly", "hardly", "really", "rarely"], 1, "hardly — almost not (hardly ever, could hardly)."], [["moreover", "although", "nevertheless", "therefore"], 1, "although — even though (+ subject + verb)."]]}, {"t": "A new family
