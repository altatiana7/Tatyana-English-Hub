<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>EGE Tasks 30–36</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: лист КИМ ЕГЭ — белая бумага на сером столе, чёрный шрифт Times, номера заданий в квадратах, варианты «1) … 4)», поле «Ответ:» и клетки бланка. Один светлый вид намеренно: экзаменационный лист всегда белый. */
:root{
  --desk:#e4e5e8; --paper:#ffffff; --ink:#000000; --muted:#3f3f3f; --soft:#8a8a8a; --hair:#c4c4c4; --fill:#efefef;
  --ok:#1b6a37; --ok-soft:#e2f0e6; --bad:#b30000; --bad-soft:#f9e3e3;
  --f:"Times New Roman",Tinos,"Liberation Serif",Times,serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f);font-size:18px;line-height:1.4;display:flex;flex-direction:column;overflow:hidden}
button{font-family:var(--f);font-size:inherit;color:var(--ink);cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px dashed var(--ink);outline-offset:2px}
h1,h2,h3{font-family:var(--f);font-weight:700;margin:0;text-wrap:balance}

/* колонтитул КИМ */
.top{flex:none;display:flex;align-items:center;gap:14px;min-height:46px;background:var(--paper);border-bottom:3px double var(--ink);
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.top .home{border:1.5px solid var(--ink);background:var(--paper);border-radius:0;padding:3px 12px;font-weight:700;font-size:16px}
.top .home:hover{background:var(--fill)}
.kim{display:flex;flex-direction:column;line-height:1.15;min-width:0}
.kim .k1{font-size:15px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.kim .k2{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .where{margin-left:auto;font-size:16px;font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet{background:var(--paper);border:1px solid var(--hair);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* номер задания в квадрате, как в КИМ */
.tn{width:32px;height:32px;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none;font-variant-numeric:tabular-nums;background:var(--paper)}

/* главная */
.homegrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;height:100%;max-width:1320px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:12px}
.tile{text-align:left;padding:12px 14px;display:flex;flex-direction:column;gap:6px;border:1px solid var(--hair);background:var(--paper);box-shadow:0 1px 3px rgba(0,0,0,.12);border-radius:0;transition:border-color .12s}
.tile:hover{border-color:var(--ink);outline:1px solid var(--ink)}
.tile .th{display:flex;gap:10px;align-items:center}
.tile h2{font-size:20px;line-height:1.15}
.tile p{margin:0;color:var(--muted);font-size:16px}
.tile .count{margin-top:auto;font-size:15px;color:var(--muted);border-top:1px solid var(--hair);padding-top:5px;font-style:italic}
.instr{padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:8px}
.instr h2{font-size:19px;text-align:center;text-transform:uppercase;letter-spacing:.06em}
.instr .box{border:1.5px solid var(--ink);padding:8px 12px;font-size:16px;line-height:1.38;display:grid;gap:6px}
.instr .box p{margin:0;text-indent:1.4em;text-align:justify}
.instr .luck{text-align:center;font-weight:700;font-style:italic;margin-top:auto}

/* общее */
.btn{border:1.5px solid var(--ink);background:var(--paper);border-radius:0;padding:5px 14px;font-weight:700}
.btn:hover:not(:disabled){background:var(--fill)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover:not(:disabled){background:#333}
.btn:disabled{opacity:.4;cursor:default}
.muted{color:var(--muted)}
select{font-family:var(--f);font-size:16px;padding:4px 8px;border:1.5px solid var(--ink);border-radius:0;background:var(--paper);color:var(--ink);max-width:100%}

/* задание-строка */
.rows{display:grid;gap:8px}
.row{padding:8px 14px 8px 10px;border:1px solid var(--hair);background:var(--paper);display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;align-items:start;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.row .s{font-size:19px;line-height:1.4}
.slot{display:inline-block;min-width:80px;border-bottom:1.5px solid var(--ink);text-align:center;padding:0 4px;font-weight:700}
.slot.shown{font-style:italic;text-decoration:underline;text-underline-offset:4px;border-bottom-style:dotted}
.slot.ok{color:var(--ok);border-bottom-color:var(--ok)}
.slot.bad{color:var(--bad);border-bottom-color:var(--bad)}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.opt{border:1px solid var(--ink);background:var(--paper);border-radius:0;padding:3px 12px;font-size:18px;min-height:34px}
.opt .k{margin-right:4px}
.opt:hover:not(:disabled){background:var(--fill)}
.opt:disabled{cursor:default}
.opt.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700;border-width:2px}
.opt.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);text-decoration:line-through}
.otv{display:flex;align-items:center;gap:6px;font-size:16px;margin-left:6px}
.cell{width:32px;height:34px;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:20px;font-variant-numeric:tabular-nums;background:var(--paper)}
.cell.ok{color:var(--ok);border-color:var(--ok)} .cell.bad{color:var(--bad);border-color:var(--bad)}
.fb{font-size:16px;line-height:1.3;flex:1 1 240px;min-width:0}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.fb i{color:var(--muted);font-style:italic}

.drill{max-width:1120px;margin:0 auto;display:grid;gap:8px}
.drill .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.drill .head h2{font-size:20px}
.drill .head .muted{font-size:16px;font-style:italic}
.progress{display:flex;gap:3px;margin-left:auto}
.progress span{width:18px;height:18px;border:1px solid var(--ink);font-size:11px;display:grid;place-items:center;background:var(--paper)}
.progress span.ok{background:var(--ok-soft);border-color:var(--ok)} .progress span.bad{background:var(--bad-soft);border-color:var(--bad)}
.foot{display:flex;justify-content:flex-end;gap:10px;align-items:center}
.result{padding:14px 20px;display:grid;gap:10px}
.result .big{font-size:32px;font-weight:700}
.result ul{margin:0;padding-left:20px;display:grid;gap:4px;max-height:42vh;overflow:auto}
.result li{font-size:17px}
.result li b{color:var(--ok)}
.tabs{display:flex;gap:0;flex-wrap:wrap}
.tab{border:1px solid var(--ink);background:var(--paper);border-radius:0;padding:3px 12px;font-size:16px;margin-left:-1px}
.tab.on{background:var(--ink);color:var(--paper);font-weight:700}

/* карточки */
.cardsview{display:grid;grid-template-columns:minmax(0,520px) minmax(0,1fr);gap:16px;max-width:1240px;margin:0 auto;align-items:start}
.qcol{display:grid;gap:10px}
.flip{perspective:1400px;height:350px;cursor:pointer}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--paper);border:1.5px solid var(--ink);padding:16px 18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.face.back{transform:rotateY(180deg)}
.front{justify-content:center;align-items:center;text-align:center;gap:14px}
.front .words{font-size:33px;font-weight:700;line-height:1.25}
.front .theme{font-size:18px;font-style:italic;color:var(--muted)}
.front .tap{position:absolute;bottom:10px;font-size:14px;color:var(--soft)}
.back table{border-collapse:collapse;width:100%;font-size:16px;line-height:1.28}
.back td{padding:5px 6px;border:1px solid var(--ink);vertical-align:top}
.back td:first-child{font-weight:700;white-space:nowrap;font-size:17px}
.back td.ex{font-style:italic;color:var(--muted)}
.back .note{font-size:15px;color:var(--muted);margin-top:auto;padding-top:6px;font-style:italic}
.cardnav{display:flex;align-items:center;justify-content:center;gap:12px}
.cardnav .cnt{font-variant-numeric:tabular-nums;min-width:70px;text-align:center;font-weight:700}
.arrow{width:44px;height:36px;border:1.5px solid var(--ink);border-radius:0;background:var(--paper);font-size:20px;font-weight:700}
.arrow:hover{background:var(--fill)}
.side{display:grid;gap:8px;min-width:0}
.side .head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.side h2{font-size:19px}

/* вариант ЕГЭ */
.exam{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:10px 14px;max-width:1340px;margin:0 auto}
.exam .topline{grid-column:1/-1;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap}
.chip{border:1px solid var(--ink);background:var(--paper);border-radius:0;padding:2px 9px;font-size:15.5px;margin-left:-1px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);color:var(--paper);font-weight:700}
.chip.done:not(.on){background:var(--ok-soft)}
.text{padding:10px 18px}
.text .instr2{font-size:15.5px;font-weight:700;line-height:1.3;margin-bottom:8px;text-align:justify}
.text h3{font-size:19px;text-align:center;margin-bottom:4px}
.text .body{font-size:18.5px;line-height:1.6;white-space:pre-line;text-align:justify;text-indent:1.4em}
.gap{cursor:pointer;white-space:nowrap}
.gap .gn{font-weight:700;margin-right:2px}
.gap .gw{display:inline-block;min-width:64px;border-bottom:1.5px solid var(--ink);text-align:center;text-indent:0;padding:0 2px}
.gap.filled .gw{font-style:italic}
.gap.cur .gw{background:var(--fill);outline:1.5px dashed var(--ink);outline-offset:1px}
.gap.ok .gw{color:var(--ok);border-bottom-color:var(--ok);font-weight:700}
.gap.bad .gw{color:var(--bad);border-bottom-color:var(--bad);text-decoration:line-through}
.gap .fix{color:var(--ok);font-weight:700;margin-left:4px}
.ans{perspective:1600px}
.ans .inner{position:relative;transition:transform .55s;transform-style:preserve-3d;min-height:100%}
.ans.on .inner{transform:rotateY(180deg)}
.ans .face{position:relative;inset:auto;min-height:100%;padding:10px 14px;border:1px solid var(--hair)}
.ans .face.back{position:absolute;inset:0}
.ans .face.back .razbor{flex:1;min-height:0}
.ans h3{font-size:17px;margin-bottom:4px}
.qrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:8px;align-items:center;padding:3px 4px}
.qrow.cur{background:var(--fill)}
.qopts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--ink)}
.qopt{border:0;border-left:1px solid var(--ink);background:var(--paper);border-radius:0;padding:4px 6px;font-size:16.5px;text-align:left;min-height:34px;overflow-wrap:anywhere;line-height:1.15}
.qopt:first-child{border-left:0}
.qopt .k{margin-right:4px}
.qopt:hover:not(:disabled){background:var(--fill)}
.qopt.sel{background:var(--fill);font-weight:700;box-shadow:inset 0 0 0 2px var(--ink)}
.qopt.ok{background:var(--ok-soft);color:var(--ok);font-weight:700;box-shadow:inset 0 0 0 2px var(--ok)}
.qopt.bad{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.qopt:disabled{cursor:default}
.ansfoot{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.ansfoot .sc{font-weight:700;font-size:19px;margin-right:auto}
.razbor{display:grid;gap:6px;align-content:start;overflow:auto;font-size:16px;line-height:1.32}
.razbor div{display:grid;grid-template-columns:38px 1fr;gap:6px;align-items:start}
.razbor .rb{font-weight:700}
.razbor .x{color:var(--bad)}

/* speed game */
.bomb{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:14px;max-width:1180px;margin:0 auto}
.arena{padding:16px 20px;display:grid;gap:12px;position:relative;overflow:hidden}
.arena .hud{display:flex;align-items:center;gap:16px}
.bombpic{width:84px;height:84px;flex:none}
.timer{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;width:70px}
.timer.hot{color:var(--bad)}
.lives{display:flex;gap:6px;margin-left:auto;align-items:center}
.lives span{width:18px;height:18px;border:1.5px solid var(--ink);background:var(--ink);display:inline-block}
.lives span.off{background:var(--paper)}
.bq{font-size:23px;line-height:1.45;min-height:70px}
.bopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bopts .opt{font-size:20px;min-height:46px}
.bfb{min-height:24px;font-size:17px}
.boom{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;opacity:0}
.boom.go{animation:boom .9s ease-out}
.boom b{font-size:56px;color:var(--bad);letter-spacing:.04em}
@keyframes boom{0%{opacity:1;background:rgba(179,0,0,.10)}100%{opacity:0;background:rgba(179,0,0,0)}}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translate(-6px,2px)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}80%{transform:translate(3px,0)}}
.bside{padding:14px 16px;display:grid;gap:8px;align-content:start;overflow:auto}
.bside .big{font-size:30px;font-weight:700}
.bside ul{margin:0;padding-left:18px;font-size:16px;display:grid;gap:3px}
.bside li b{color:var(--ok)}

.refbox{padding:10px 14px;font-size:16px;columns:3 220px;column-gap:20px}
.refbox div{break-inside:avoid;padding:2px 0}

@media (max-width:900px){
  body{overflow:auto} main{overflow:visible}
  .view{position:static}
  .homegrid,.cardsview,.exam,.bomb{grid-template-columns:1fr;height:auto}
  .tiles{grid-template-columns:1fr 1fr}
  .kim .k2{display:none}
  .qopts{grid-template-columns:1fr 1fr}
  .qopt:nth-child(3){border-left:0}
  .qopt:nth-child(n+3){border-top:1px solid var(--ink)}
  .flip{height:380px}
}
@media (max-width:520px){.tiles{grid-template-columns:1fr}.front .words{font-size:26px}.bopts{grid-template-columns:1fr}.top .where{display:none}}

/* Цветовая тема: светло-зелёный, зелёный, бирюзовый */
:root{--desk:#dff2e7; --mint:#eaf7ef; --green:#2f8f5b; --green-d:#1f6e45; --teal:#16a19a; --teal-d:#0e7d77; --teal-soft:#d9f3f1; --fill:#d9f3f1; --hair:#a9d9c3; --muted:#3c4a44}
.top{border-bottom:3px double var(--green);background:linear-gradient(90deg,var(--mint),var(--paper) 60%)}
.kim .k1{color:var(--green-d)}
.top .home,.btn,.arrow,select{border-color:var(--teal-d)}
.top .home{color:var(--teal-d)}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--green-d)}
.tn{border-color:var(--teal);color:var(--teal-d);background:var(--teal-soft)}
.tile{border-color:var(--hair);border-top:4px solid var(--green)}
.tile:nth-child(even){border-top-color:var(--teal)}
.tile:hover{border-color:var(--teal);outline-color:var(--teal)}
.tile h2,.drill .head h2,.side h2,.text h3,.ans h3{color:var(--green-d)}
.instr h2{color:var(--green-d)}
.instr .box{border-color:var(--teal);background:var(--mint)}
.instr .luck{color:var(--teal-d)}
.row{border-color:var(--hair);border-left:4px solid var(--teal)}
.opt{border-color:var(--teal-d);background:var(--paper)}
.opt:hover:not(:disabled),.qopt:hover:not(:disabled){background:var(--teal-soft)}
.cell{border-color:var(--teal-d)}
.slot{border-bottom-color:var(--teal-d)}
.progress span{border-color:var(--teal)}
.tab,.chip{border-color:var(--teal-d)}
.tab.on,.chip.on{background:var(--teal-d);border-color:var(--teal-d);color:#fff}
.chip.done:not(.on){background:var(--mint)}
.face{border-color:var(--teal)}
.front .words{color:var(--green-d)}
.back td{border-color:var(--hair)}
.back td:first-child{color:var(--teal-d);background:var(--mint)}
.text .instr2{color:var(--green-d)}
.gap .gn{color:var(--teal-d)}
.gap .gw{border-bottom-color:var(--teal-d)}
.gap.cur .gw{background:var(--teal-soft);outline-color:var(--teal)}
.qopts{border-color:var(--teal-d)}
.qopt{border-left-color:var(--teal-d)}
.qopt.sel{background:var(--teal-soft);box-shadow:inset 0 0 0 2px var(--teal-d)}
.qrow.cur{background:var(--mint)}
.lives span{border-color:var(--green);background:var(--green)}
.lives span.off{background:var(--paper)}
.bside .big,.result .big,.timer{color:var(--green-d)}
.refbox b{color:var(--teal-d)}
@media (max-width:900px){.qopt:nth-child(n+3){border-top-color:var(--teal-d)}}
.side .row{padding:6px 10px 6px 8px;gap:8px}
.side .row .s{font-size:17.5px}
.side .opt{font-size:16.5px;padding:2px 9px;min-height:32px}
.side .cell{height:32px}
.side .otv{margin-left:2px}
.exam{grid-template-columns:minmax(0,1.38fr) minmax(0,1fr);align-items:start}
.text .instr2{font-size:14.5px;margin-bottom:4px}
.text h3{margin-bottom:2px}
.gap .gw{min-width:52px}
.exam .otv{font-size:0;gap:0;margin-left:2px} .exam .otv .cell{font-size:18px}
.qrow{grid-template-columns:32px minmax(0,1fr) auto;gap:6px}
.ans .face{box-sizing:border-box}.ans .face.back{min-height:0}
.exam .qopt{overflow-wrap:normal;white-space:nowrap;overflow:hidden;padding:4px 5px}
#examPick{flex:1 1 160px;min-width:0;max-width:100%}
.rcol{display:grid;gap:8px;align-content:start;min-width:0}
.rcol .topline{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rcol .topline .muted{font-size:14px;flex-basis:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <a class="home" href="index.html" style="text-decoration:none">&larr; Hub</a>
  <button class="home" id="homeBtn" type="button">Home</button>
  <div class="kim"><span class="k1">UNIFIED STATE EXAM (EGE) · ENGLISH</span><span class="k2">Section 3. Grammar and Vocabulary · Tasks 30–36 · practice</span></div>
  <span class="where" id="where"></span>
</header>
<main>
  <section class="view" id="v-home"></section>
  <section class="view" id="v-cards" hidden></section>
  <section class="view" id="v-drill" hidden></section>
  <section class="view" id="v-hunt" hidden></section>
  <section class="view" id="v-bomb" hidden></section>
  <section class="view" id="v-prep" hidden></section>

</main>

<script>
/* ===================== ДАННЫЕ ===================== */
const G = {
travel:["travel",[
 ["journey","going from A to B; the act of travelling itself","The journey to work takes an hour."],
 ["trip","a short trip there and back, with a purpose","a business trip, a day trip"],
 ["travel","travelling in general (uncountable); also a verb","Air travel is getting cheaper."],
 ["voyage","a long journey by sea or into space","a voyage across the Atlantic"],
 ["tour","a trip to visit and see places, often with a guide","a guided tour of the museum"]]],
custom:["customs and habits",[
 ["custom","a custom accepted in a society","local customs, It's a custom to…"],

const E_NEW=[{"t": "Becky", "src": "A", "text": "Becky met Professor Alan Dobson at the lecture. His lecture was devoted to the British role after the war. Becky had fallen in love with Alan even before he started to speak. It was love at first {0}. He was very handsome with a head of thick grey hair and large blue eyes. His athletic build belied his age, and {1} that he must spend almost as many hours in the gym as in the library.\nThe second he began to {2}, Becky was captivated by Dobson’s energy, and within moments he had everyone in the auditorium sitting on the edge of their seats. Students began furiously writing {3} his every word. Speaking without notes, the professor nimbly switched from subject to subject, the role of Downing Street after the war, the dollar as the new world currency, oil becoming the commodity that would dominate the second half of the century and the future role of the British monarchy.\nWhen his lecture came to an end, Becky’s only regret was that he’d scarcely {4} on transport, with just a passing mention of how the airplane would change the new world order, both for business and tourism. She wanted him to expand his views on the future of the British shipping industry. But like a seasoned pro, he {5} his audience that he had written a book on the subject. Becky wouldn’t be waiting for Christmas to get hold of a copy. It made her think about Ben, and hope his book {6} was going as well in France.", "g": [[["look", "sight", "view", "glimpse"], 1, "love at first sight — a fixed phrase."], [["offered", "proposed", "assumed", "suggested"], 2, "assume that… — think that something is true without proof."], [["speak", "tell", "mention", "chat"], 0, "speak — use a language; give a formal talk."], [["after", "into", "down", "over"], 2, "write sth down — make a note of it."], [["dwelt", "dealt", "talked", "touched"], 0, "dwell on sth — talk or think about something for a long time."], [["remembered", "reminded", "recollected", "revised"], 1, "remind — make someone remember (remind sb to do / of / about)."], [["trip", "travel", "tour", "journey"], 3, "journey — going from A to B; the act of travelling itself."]]}, {"t": "Emily", "src": "A", "text": "Emily was disappointed. She finally settled on the one person she felt she could seek advice from. She decided to turn {0} at the docks unannounced and hope George would be around when she knocked on his door.\nShe didn’t {1} either of her brothers who she was visiting. One of them would try to stop her, while the other would feel she betrayed a confidence. Emily could {2} wait until her day off, and once she had dropped Luke at school, she took a bus to the dockyard. She had chosen her time carefully: late morning, when George was still likely to be in his office, while her brothers would be fully {3} loading or unloading cargo at the other end of the dock. Emily said to the man on the gate that she’d come to apply for a job as a cleaner. He pointed indifferently towards the red-brick building and still didn’t {4} her. As she walked towards Spencer House, Emily looked up at the windows on the fifth floor and {5} which office was his. She recalled her encounter with Mrs. Gray, and the way she had been shown the door the moment she mentioned her name. Now Emily not only had a job she {6} and where she was respected, but she’d had two other offers in the past few days. She didn’t give Mrs. Gray another thought as she walked straight past the building and continued along the quayside.", "g": [[["off", "up", "in", "on"], 1, "turn up — arrive, appear (often unexpectedly)."], [["say", "speak", "talk", "tell"], 3, "tell — say something to someone, tell a story (tell sb)."], [["hardly", "merely", "rarely", "nearly"], 0, "hardly — almost not (hardly ever, could hardly)."], [["timed", "governed", "occupied", "tested"], 2, "be occupied (in) doing sth — be busy."], [["remember", "review", "remind", "revise"], 0, "remember — keep in your memory (remember to do — not forget; g", "struggling", "striving", "straining"], 1, "struggle with sth — fight against a feeling or a problem."], [["else", "still", "yet", "just"], 3, "just — a moment ago; exactly; only."], [["give", "make", "take", "keep"], 0, "give — give advice, give a talk, give sb a call."], [["However", "Therefore", "Although", "Moreover"], 2, "although — even though (+ subject + verb)."], [["connect", "link", "unite", "join"], 3, "join — become a member; meet someone (join sb)."], [["by", "on", "to", "at"], 0, "by chance — accidentally."]]}, {"t": "Going on a conference", "src": "A", "text": "Megan was preparing for her presentation at a very important conference in Texas. In fact, it {0} like every March the entire San Francisco Bay Area migrated to Austin for the conference. It was where big deals were made. It was\na time when you could walk into a restaurant and find yourself between one of the top guys at Google and a rock star. For an ambitious person {1} to make their mark in the technology world, it was a good place to be. That’s why Megan was there.\nShe met up with the rest of her team at the hotel. They were already communicating in the lobby. She {2} at the group – they were a small company, only ten people. She was the only woman, and the awareness of that fact made her work twice as hard. But she knew the company needed her, and the company results depended {3} her work. Everyone else in the team was an engineer or a designer, while Megan came from a business background. She was the one who had the vision to decide how and where their product would be attractive. {4}, she had the management skills to make sure everything got done.\n“How are you feeling?” asked Alex, the designer. “Ready for the big presentation?” Megan was {5} to do the presentation on stage, alone. She would be presenting their product in front of some of the most influential companies and investors in the world. Undoubtedly, she {6} her best to prepare for it.", "g": [[["showed", "held", "turned", "seemed"], 3, "it seemed like… — it looked as if."], [["attractive", "confused", "enthusiastic", "amused"], 2, "enthusiastic to do sth — very keen to do it."], [["noticed", "observed", "looked", "watched"], 2, "look — turn your eyes towards something on purpose (look at sth)."], [["for", "on", "from", "of"], 1, "depend on sb / sth."], [["Therefore", "However", "Moreover", "Otherwise"], 2, "moreover — in addition, what is more."], [["succeeded", "suspected", "supported", "supposed"], 3, "suppose — think something is probably true; be supposed to — should."], [["got", "did", "gave", "made"], 1, "do — do well, do homework, do business, do sb a favour."]]}, {"t": "Maggie", "src": "A", "text": "Maggie was happy. She had been given the task of entertaining Mrs King while her parents and Uncle William had some sort of business meeting in the library. She was glad they had asked her to {0} Mary King’s company because she really liked her. In fact, she {1} the woman. There was something about Mary that was intriguing and special. Maggie knew that Mary liked her in return, and there was an ease between them. That this woman was truly lovely to look {2} was a given; that she was charming, kind and extremely intelligent was a bonus, Maggie thought. She was {3} by the older woman’s knowledge of art and sculpture. Mary knew a great deal about certain artists and their work, especially French Impressionists and Post-Impressionists, and she was happy to share.\nThe two of them were seated in a yellow drawing room chatting. At one moment, Maggie couldn’t help thinking that Mary King {4} perfect in this amazing room tonight. She was {5} a most elegant and fashionable sapphire blue velvet dress and sapphire earrings, which exactly echoed the blue in some of the fabrics her mother had chosen for the room. She ought to be painted in here, Maggie thought, and it should be called Portrait in Blue.\nAfter a brief discussion about a recent art exhibition at a well-known gallery in Chelsea, with Mary {6} most of the talking, they fell silent. But it was a friendly silence.", "g": [[["hold", "fix", "keep", "bring"], 2, "keep — continue; have and not give back (keep doing)."], [["admired", "admitted", "approved", "attracted"], 0, "admire — respect and like (admire sb for sth)."], [["at", "for", "on", "in"], 0, "lovely to look at — look at sb / sth."], [["expressed", "impressed", "indicated", "involved"], 1, "impress — make someone admire you (be impressed by)."], [["looked", "watched", "saw", "glanced"], 0, "look — turn your eyes towards something on purpose (look at sth)."], [["bearing", "dressing", "clothing", "wearing"], 3, "wear clothes or jewellery — be wearing a dress."], [["making", "doing", "causing", "having"], 1, "do — do well, do homework, do business, do sb a favour."]]}, {"t": "A busy day", "src": "A", "text": "The January sales started and when the girls arrived at Browns department store, where they worked, there were a lot of people queuing along the street. {0} the time before Christmas had been very busy for shop assistants, they were shocked by such a big crowd outside the shop.\n“I’ve never {1} such a queue! Do they think we’re going to be giving the stuff away or something?” Anna asked her friend Lucy.\n“Well, you know what they say – the early bird catches the worm, and {2} to the radio, some people have been queuing all night in London to get the best bargains,” Lucy said. “Let’s think positively – if we are busy, the time will go quicker.”\nOn her {3} to the cosmetics department Anna was wondering if they would even have time for their breaks or lunch-hours. And she was quite right as there was no chance of a morning break but at last the girls were given {4} to go for a shortened lunch break and they met up in the staff dining room.\n“My God,” Lucy said as they stood at the counter. “I’ve actually had two ladies almost come to fight over a dress. I could {5} calm them down.”\n“It hasn’t been much better in the perfume and cosmetics department,” Anna remarked. “I ran out of Chanel perfume within an hour and the customers got angry with me, as if it was my {6}! I’ll tell you, at one point I was ready to walk out!”\nThat was really busy time for them. After all, the worst of the sales rush should be over soon.", "g": [[["Therefore", "Although", "However", "Moreover"], 1, "although — even though (+ subject + verb)."], [["glanced", "watched", "seen", "looked"], 2, "I've never seen… — see (not look or watch) with an object."], [["concerning", "regarding", "including", "according"], 3, "according to — as said by a source."], [["way", "track", "path", "road"], 0, "way — a way (the way to do / of doing); by the way."], [["promise", "proposal", "permission", "possibility"], 2, "be given permission to do sth — be allowed."], [["sharply", "hardly", "roughly", "nearly"], 1, "hardly — almost not (hardly ever, could hardly)."], [["harm", "shame", "blame", "fault"], 3, "fault — blame; a defect."]]}, {"t": "A sign of weakness?", "src": "A", "text": "What should you do when you realise that you have to apologise? Is it better to swallow your pride and say you’re sorry when somebody is waiting {0} your apology?\nThe psychologist Jack Black says that people worry that an apology will be {1} as a sign of weakness, rather than as their effort to understand and make up with the opponent. But he adds that effective apologies address the person’s feelings – they don’t prove a point.\nAs for how to do it, Professor Black has the following advice, “The right way to apologise is the way your mother taught you. Say you threw a stone at your brother. She’d have you go and {2} him in the eye and say: ‘I’m sorry I threw the stone at you and I won’t do it again.’ It’s important to name what you did wrong, to show yourself as being regretful in some way and to indicate what might be different in the future.”\nYou should {3} that the number of times you’ll need to repeat the apology may vary depending on where you live. {4} to preliminary data collected by Professor Black, for a minor offence, the optimal number is a single “I’m sorry”. “If the offence is large, then making two apologies seems to be the magic number for restoring trust and liking,” Jack Black says. {5}, if you’re British, you may need to double that. “A single ‘Sorry’ does not {6} as an apology: we have to say it so many times with a lot of adjectives,” says Professor Black.", "g": [[["out", "up", "for", "to"], 2, "wait for sb / sth."], [["treated", "referred", "connected", "related"], 0, "treat — give medical help (treat sb for)."], [["watch", "glance", "see", "look"], 3, "look — turn your eyes towards something on purpose (look at sth)."], [["review", "revise", "remember", "remind"], 2, "remember — keep in your memory (remember to do — not forget; remember doing — recall)."], [["Including", "According", "Concerning", "Regarding"], 1, "according to — as said by a source."], [["Although", "Therefore", "Otherwise", "However"], 3, "however — but (starts a new sentence, followed by a comma)."], [["count", "judge", "matter", "consider"], 0, "count as sth — be accepted as."]]}, {"t": "Good news", "src": "A", "text": "Dotty received a letter from a magazine editor, which was very surprising for her. {0} Dotty was writing for a long time, only her teacher Miss Simms was allowed to read her novels. The teacher {1} great success for her books.\nThere was a tap at the door then and when Dotty saw Miss Simms on the doorstep she almost pushed her into the room and pressed the letter into the woman’s hand.\n“Read this,” she commanded, then {2} her manners she added, “Oh, I’m so sorry. Hello, Miss Simms. I didn’t mean to be rude but I just got home and opened this and don’t quite know what to make of it. I’m afraid I’m absolutely confused.”\nMiss Simms took off her silk scarf, then removed her gloves and read the letter. Her face broke into a wide smile. “Why, Dotty, this is absolutely marvellous!” she exclaimed delightedly. “Well done. I’m so pleased you finally {3} to find the courage to show your work to someone. Didn’t I always {4} you it was good enough for publication?”\n“But I didn’t show it to anyone,” Dotty answered. “At least not to this magazine. I let Anna’s mother read it and she must have sent it to them.”\n“You mustn’t turn {5} this offer,” Miss Simms responded. “You really must telephone them, Dotty. They obviously love your work – and who knows where this might lead? I have a friend who has been trying to get some of her work published for years, so I know how hard it is. I’m so proud {6} you.”", "g": [[["Moreover", "Although", "However", "Therefore"], 1, "although — even though (+ subject + verb)."], [["admitted", "confirmed", "promised", "agreed"], 2, "promise sb sth — say that something will happen."], [["reminding", "reviewing", "revising", "remembering"], 3, "remember — keep in your memory (remember to do — not forget; remember doing — recall)."], [["managed", "succeeded", "achieved", "maintained"], 0, "manage — succeed in doing something difficult (manage to do)."], [["speak", "talk", "tell", "say"], 2, "tell — say something to someone, tell a story (tell sb)."], [["off", "down", "out", "over"], 1, "turn down an offer — refuse it."], [["at", "by", "to", "of"], 3, "be proud of sb / sth."]]}, {"t": "At the party", "src": "A", "text": "Nick and Nelly Wilson were delighted to see Zara when she got there, and welcomed her warmly. There was a group of people standing around the fireplace, trying to get warm. And as they did every year, the women were wearing long gowns or dressy cocktail dresses, and the men were wearing black-tie. It was the one night of the year when all the Wilsons’ friends {0} to dress up. Zara tried to get in the {1} but in vain. It was the coldest night so far that winter, breaking some kind of record for miserable weather, which made Zara long for her bed again. {2} she only saw them once a year, she recognized nearly everyone there that night, but there was one unfamiliar face in the crowd. His name was Patrick Edison. Nick {3} they had been college roommates.\n\nPatrick was a TV producer from Hollywood, Nelly whispered, and she told Zara that he produced several award-winning series, and coincidentally was single. She {4} then why they had insisted that she join them. She was the only single woman in the room and she was being offered some kind of blind date. This thought made the evening seem even more difficult and tiring before it began. Zara didn’t {5} trying to make conversation with him since she had noticed on the seating chart that they would be next to each other at dinner. She wasn’t looking {6} to it, no matter how successful his shows were.", "g": [[["accepted", "agreed", "assumed", "achieved"], 1, "agree — have the same opinion (agree with sb, agree to do, agree on sth)."], [["manner", "state", "tone", "mood"], 3, "mood — the way you feel (in a good mood)."], [["Otherwise", "Moreover", "Although", "However"], 2, "although — even though (+ subject + verb)."], [["spoke", "said", "told", "talked"], 1, "say — use words; say sth (to sb), no person right after say."], [["reviewed", "regretted", "recalled", "realised"], 3, "realise — understand suddenly."], [["concern", "worry", "bother", "trouble"], 2, "bother — disturb; make an effort (don't bother)."], [["forward", "away", "before", "after"], 0, "look forward to sth / doing sth."]]}, {"t": "A night at the Eifel Tower", "src": "A", "text": "Seven million people visit the Eiffel Tower every year. But have you ever dreamed {0} sleeping in this iconic structure?\nHoliday rental company Viva constructed a temporary VIP apartment on the first level of the tower, open only for the duration of the Euro football tournament from 10 June to 10 July 2016. The two-bedroom apartment, with the best Paris views was furnished with a big screen television for {1} the game. The space also included a seating area filled with hanging plants.\nA lot of people were attracted by the {2} to sleep in the apartment. To determine who got this chance, Viva {3} a contest asking entrants to describe how they would spend their night in the tower.\n“My two young sons are autistic and are both obsessed with lights and the tower itself so I’d spend the night {4} their excitement!” was the winning response from Michelle, in the UK.\nScott, from the United States, {5} to win a night’s stay with his response about reuniting five generations in Paris: his mother who first visited the city in 1953, his daughter and granddaughter who visited at 13 and 14 respectively, and a brand new granddaughter who joined the trip.\nThe four winners began their one-night stays from the 23rd of June. {6} there were no other nights to win, all the visitors to the Eiffel Tower had the chance to tour the apartment and join a match viewing party.", "g": [[["at", "over", "of", "for"], 2, "dream of doing sth."], [["staring", "watching", "seeing", "looking"], 1, "watch — look at something that moves or changes for some time."], [["probability", "ability", "availability", "opportunity"], 3, "the opportunity to do sth — a chance."], [["held", "kept", "took", "gave"], 0, "hold — have in your hands; organise (hold a meeting)."], [["amusing", "preferring", "enjoying", "pleasing"], 2, "enjoy — take pleasure in (enjoy doing / oneself)."], [["handled", "achieved", "maintained", "managed"], 3, "manage — succeed in doing something difficult (manage to do)."], [["Although", "Moreover", "Therefore", "However"], 0, "although — even though (+ subject + verb)."]]}, {"t": "At the library", "src": "A", "text": "It was early morning. Jason stood in the library at Norwood House, {0} up at the painting above the fireplace. What an extraordinary portrait it was, of a handsome man in the prime of his life. The great Horace Winton. His grandfather. His mother, Horace’s eldest daughter, Laura, had always {1} him that he would grow up to look like her father. She had been proved right.\nThis painting had been finished just a short time before Horace’s fortieth birthday, and in a few days’ time, he himself would be forty years old. And he was the spitting {2} of his grandfather; six foot four, broad of chest, with red-gold hair and blue eyes. He knew that if Horas Winton could step out of the portrait, come to stand next to him, they would look like twins, so close was their {3}.\nJason Casey finally turned away and walked out onto the terrace, headed through the hanging gardens, making for the ruined stronghold. His mother had constantly taken him there as a child, explaining that it had been her father’s favourite spot at Norwood, and {4} hers. She had {5} him up on Winton lore, and most of it had been about his grandfather. Jason knew so much about his grandfather and {6} never meeting him in person.", "g": [[["seeing", "watching", "blinking", "staring"], 3, "stare — look at someone for a long time."], [["said", "told", "talked", "spoke"], 1, "tell — say something to someone, tell a story (tell sb)."], [["replica", "image", "twin", "double"], 1, "the spitting image of sb — looks exactly like him."], [["resemblance", "reproduction", "recollection", "responsibility"], 0, "resemblance — similarity in appearance."], [["however", "moreover", "although", "therefore"], 3, "therefore — so, for this reason."], [["raised", "grown", "brought", "risen"], 2, "bring — come here with something."], [["regretted", "revealed", "remained", "registered"], 0, "regret — feel sorry about something you did."]]}, {"t": "A day in Chicago", "src": "A", "text": "Lily and her best friend Zoe were driving home from their vacation in California. That was a great adventure which they were enjoying a lot. They {0} to visit so many interesting places. As they were driving closer to Chicago, the ladies were {1} facts from the guidebook about this city, which was their little road ritual.\nThey had planned to stop first at Millennium Park, one of the city’s public parks made famous by its unique art displays. Lily had seen pictures of her friends posing with “The Bean,” a three-storey steel sculpture shaped like a giant legume, and she was {2} to have one of her own. The piece was completely reflective, so those standing around it could look at their reflections as if they were looking into a mirror. Everybody {3} it made spectacular photographs.\nThe two travellers spent the day walking around Chicago. They listened to music in Millennium Park, lying on their backs in the grass, peering up at the modern sculptures across the lawn. They took an overwhelming {4} of photographs at The Bean, much to Lily’s satisfaction. Finally, her dream to post this photo {5} true. They met some friends with whom they had gone to university to eat deep-dish pizza for dinner –\na Chicago staple. Even before the sun set, Zoe and Lily were exhausted. {6}, they still had one more thing to do.", "g": [[["achieved", "managed", "succeeded", "completed"], 1, "manage — succeed in doing something difficult (manage to do)."], [["reflecting", "reciting", "recovering", "restoring"], 1, "recite facts — say them aloud from memory."], [["amused", "confused", "attractive", "enthusiastic"], 3, "enthusiastic to do sth — very keen."], [["spoke", "told", "said", "talked"], 2, "say — use words; say sth (to sb), no person right after say."], [["quantity", "capacity", "volume", "number"], 3, "number — with countable nouns (a number of people)."], [["came", "got", "went", "held"], 0, "a dream comes true — a fixed phrase."], [["Although", "Therefore", "Nevertheless", "Moreover"], 2, "nevertheless — in spite of that."]]}, {"t": "Two years in a hut", "src": "A", "text": "Henry Thompson, a writer, built a hut on the shore of the pond and lived there all alone for two years. He did this for two reasons: because he wanted to {0} that people spend too much time and money on food and clothes and because he wanted a perfectly quiet chance to write more books. {1} to the writer, he spent only one hundred dollars a year while he lived in this hut. He raised beans on his land, ate wild berries, caught fish and “went visiting” his friends and neighbours now and then. To buy his woodsman’s clothes and a few necessities, he planted gardens, painted houses, and cut wood for his friends.\nThis period influenced Henry’s creative work a lot. He wrote a book called “The Wood” which {2} all about these seven or eight hundred days he lived in his hut. Several other books also describe the time when he {3} to live all by himself. These sold very well. In all of them Henry was boasting that he had found the only sensible way to live. “I am for simple living, and I {4} being alone!” he would declare in his books. He {5} you feel, when you read his books, that it is fine to walk around the fields, sniffing the wild grape and the green grass, and that no one can find pleasure like the man who rows, and skates, and swims. {6}, people passing by the pond used to hear him whistling old ballads, or playing very softly and beautifully on a flute, and they thought he sounded lonely and sad.", "g": [[["agree", "secure", "ensure", "prove"], 3, "prove that… — show that something is true."], [["According", "Inclining", "Regarding", "Concerning"], 0, "according to — as said by a source."], [["says", "talks", "tells", "speaks"], 2, "tell — say something to someone, tell a story (tell sb)."], [["kept", "made", "held", "used"], 3, "use — used to do — did regularly in the past."], [["amuse", "please", "enjoy", "satisfy"], 2, "enjoy — take pleasure in (enjoy doing / oneself)."], [["turns", "makes", "gives", "takes"], 1, "make — make a decision, a mistake, money, a speech, friends."], [["Although", "Otherwise", "However", "Moreover"], 2, "however — but (starts a new sentence, followed by a comma)."]]}, {"t": "In Willis Tower", "src": "A", "text": "Victoria and Mary were going up one of the tallest towers in America, called Willis Tower. First, they had to stand in a long line to enter the building. When the ladies came up to the lift, it was full of people who had to adjust themselves to {0} the two extra passengers in. As they rode up, Mary {1} the change in air pressure as they were getting higher. She looked at the screen flashing interesting facts about the height of the building – she found {2} that at 455 feet, they were at the height of the Great Pyramid of Giza; at 1,250 feet, they were at the height of the Empire State Building. Then, they finally {3} the top.\nThe elevator doors opened to a large room with walls made entirely of glass. Mary and Victoria looked at each other with jaws dropped. They could see the entire city, lit up with tiny lights. {4}, it was one of the best views of Chicago! Then a man in uniform guided them toward another line that wound around the room. “If you’d like to go out on the Ledge, please join the line here,” he {5} the group. Mary and Victoria had heard about the Ledge when they first bought their tickets to visit the tower – a glass box suspended 1,353 feet in the air, 4.3 feet out from the building. Visitors could step into the box and feel as though they were walking on air. “Oh man, another line?” Victoria whispered to Mary. {6} they could hardly wait, they joined the back of the line.", "g": [[["afford", "allow", "access", "attend"], 1, "allow — give permission (allow sb to do)."], [["remarked", "mentioned", "noticed", "reflected"], 2, "notice — become aware of something."], [["about", "over", "down", "out"], 3, "find out that… — learn a fact."], [["reached", "arrived", "achieved", "emerged"], 0, "reach — get to a place or level (no preposition)."], [["Hopefully", "Obviously", "Essentially", "Absolutely"], 1, "Obviously — clearly, as everyone can see."], [["spoke", "said", "told", "talked"], 2, "tell — say something to someone, tell a story (tell sb)."], [["Nevertheless", "Moreover", "However", "Although"], 3, "although — even though (+ subject + verb)."]]}, {"t": "The man on the trail", "src": "A", "text": "It was a cold grey day when the man walked into the main Yukon trail. He climbed the snow-covered river bank where a trail went through the pine forest. It was a high bank, and the man paused to breathe at the top and {0} at the sky. It was nine o’clock in the morning. There was no sun or even the promise of sunshine, {1} there was not a cloud in the sky. It was a clear day, but the sun was absent from the sky. This fact did not worry the man because he could hardly {2} a day when he had seen the sun.\nThe man had come a long way alone, and he was really proud {3} himself. The old man from the village warned him how cold it sometimes got in this country. He said that no man should travel alone in this season. Despite all the problems on the way, the man {4} to save himself.\nThe Yukon River was hidden under three feet of ice with as many feet of snow on top. It was all pure white. North and south, as far as the eye could see, it was white. There was only a thin dark line that curved to the south. This dark line was the trail – the main trail. It led south 500 miles to the Chilcoot Pass. It led north 75 miles to Dawson and still farther on to the north a thousand miles more. However, all this – the distant trail, no sun in the sky, and the great cold –\nhad no {5} on the man. It was not because he was long {6} with it. On the contrary, he was a newcomer in the land, and this was his first winter.", "g": [[["watched", "looked", "noticed", "observed"], 1, "look — turn your eyes towards something on purpose (look at sth)."], [["although", "therefore", "otherwise", "however"], 0, "although — even though (+ subject + verb)."], [["revise", "review", "remind", "remember"], 3, "remember — keep in your memory (remember to do — not forget; remember doing — recall)."], [["of", "at", "by", "on"], 0, "be proud of oneself."], [["achieved", "completed", "managed", "succeeded"], 2, "manage — succeed in doing something difficult (manage to do)."], [["mark", "effect", "change", "result"], 1, "effect — noun: a result (have an effect on)."], [["certain", "general", "common", "familiar"], 3, "familiar — well known to you (familiar to sb / with sth)."]]}, {"t": "Kevin Stone", "src": "A", "text": "Kevin Stone was driving north on the High Road, towards the mountains. He {0} on the radio and tuned in to Ask Dr Linda. It was a programme he had no intention of {1}. It always made him feel better.\n\nWhen he reached his destination, he remained in his car until the programme was over. Then he sat quietly for several minutes longer before getting out of the car. He walked to the water’s edge. The mountain air was cold and still. The lake surface shone under the autumn sun, but even so, there were dark {2} that hinted at the water’s depth. The trees surrounding the lake had begun to change colour and were far more vivid in their yellow, orange and red shades than the ones he had {3} in the city and suburbs closer in. For a long time, he sat on the ground at the lake side, his hands clasped over his knees. {4} there were tears in his eyes, he ignored them. Then he turned and went back to his car.\n\nAn hour later, he was at his mother’s house. He found his mother in her studio. At age sixty she had taken up painting, and in twelve years of serious work, her natural talent had {5} into a genuine gift. She was seated at the easel, her back to him, every inch of her slight, slender body totally absorbed in her work. She smiled when she saw him but was in no {6} to start a conversation.", "g": [[["fitted", "fixed", "turned", "started"], 2, "turn on the radio / the light."], [["missing", "failing", "lacking", "flopping"], 0, "miss — not catch; feel sad without someone."], [["areas", "regions", "spaces", "zones"], 0, "dark areas — parts of a surface."], [["viewed", "seen", "watched", "looked"], 1, "had seen — see (with an object, without looking on purpose)."], [["However", "Moreover", "Therefore", "Though"], 3, "Though + clause — although; however needs a full stop and a comma."], [["developed", "advanced", "improved", "increased"], 0, "develop into sth — grow into something better."], [["mood", "temper", "humour", "spirit"], 0, "mood — the way you feel (in a good mood)."]]}, {"t": "A girl from Uganda", "src": "A", "text": "It was a special day for the girl from Uganda, a country in Africa. She was {0} to meet the world’s greatest living chess player, which was a great honour for her. The girl was a chess player herself. She had been invited to {1} her story by a committee that had organized a conference in Moscow. That story was one of triumph. It was a story of her childhood in Katwe, Uganda. She would describe how the skills nourished by the principles of the game of chess had {2} her to come to that conference.\nThere is no word for chess in the girl’s native language. {3},\nthe game had taken her far from home, first to Sudan and Turkey, and finally to Russia. Chess had given her the opportunity to take her first flight above the clouds.\nOver the years, she had become the best female chess player in Uganda. Though the girl was only 17 years old, she had long competed at the highest level of the game. Her talent and {4} made her one of the most promising young players in the world. The girl’s story was the subject of a book, documentaries, and magazine articles.\nThe girl still couldn’t believe she was visiting the conference in Moscow. She was very {5} about meeting the world champion, the person she had idolized in her childhood. He had {6} her to push herself so that one day she might achieve the rank of Grand Master, the highest honour in the game.", "g": [[["supposed", "supplied", "suspected", "succeeded"], 0, "suppose — think something is probably true; be supposed to — should."], [["say", "talk", "speak", "tell"], 3, "tell — say something to someone, tell a story (tell sb)."], [["approved", "allowed", "admitted", "afforded"], 1, "allow — give permission (allow sb to do)."], [["However", "Despite", "Otherwise", "Likewise"], 0, "however — but (starts a new sentence, followed by a comma)."], [["reservation", "admiration", "appreciation", "determination"], 3, "determination — a strong wish to succeed."], [["enthusiastic", "abandoned", "controversial", "sympathetic"], 0, "enthusiastic about sth — very interested and excited."], [["involved", "intended", "impressed", "inspired"], 3, "inspire — give someone the wish to do something creative."]]}, {"t": "Ted", "src": "A", "text": "Ted Sanford was born nine minutes later than his brother Harry. It was his twin brother, Harry, who was {0} to become an earl, to inherit a castle in Scotland, 22,000 acres in Kent, twenty million pounds and one of the best banks in the City of London.\nHis parents adored Harry, especially his mother. He was her beloved son, she devoted all her spare time to Harry. Ted couldn’t understand why his parents loved him less than Harry. It was to be several years before young Ted worked {1} the full significance of coming second in life’s first race. His twin brother in the years that followed {2} not only the usual childhood illnesses but managed to add scarlet fever, diphtheria and meningitis to them. His mother, Lady Sanford, feared for his survival. Ted, on the other {3}, was a survivor, and inherited enough ambition for both his brother and himself. He was always a winner. Only a few years passed before those who came {4} contact with the brothers for the first time mistakenly assumed Ted was the heir to the earldom.\nAs the years passed Ted’s father tried desperately to discover something at which Harry might triumph over his brother – and {5}. When they were eight, the two boys were sent away to Summer Fields where many generations of Sanfords had been prepared for Eton. And there Ted beat Harry in every\n{6}.", "g": [[["thought", "understood", "mentioned", "supposed"], 3, "suppose — think something is probably true; be supposed to — should."], [["down", "out", "up", "over"], 1, "work out — understand after thinking."], [["held", "took", "caught", "kept"], 2, "catch an illness."], [["side", "part", "hand", "place"], 2, "on the other hand — a fixed phrase for contrast."], [["into", "for", "from", "to"], 0, "come into contact with sb — meet."], [["missed", "wished", "failed", "lacked"], 2, "fail — not succeed (fail to do, fail an exam)."], [["theme", "topic", "object", "subject"], 3, "a school subject."]]}, {"t": "Henry Thompson", "src": "A", "text": "Henry was the most talented child in the Thompson family. The whole family were really proud {0} him. Henry’s mother Mrs. Linda Thompson never tired of {1} everybody what fine letters and essays he could write when he studied at school. She bought a lot of different books to help Henry develop his skills.\nJust as his mother hoped, when Henry {2} up, he decided to be a writer. To begin with, he taught at school a while and gave lectures which people did not understand very well, for he had strange ideas for those times. {3}, Henry didn’t give up his philosophy and devoted his time to writing his thoughts down. No {4} how tired or busy he was, he wrote page after page, sitting in the woods, as he liked that activity better than anything else. It helped Henry to express his ideas and understand the world around him. He first wrote a report on a week's trip on the Concord and Merrimac rivers. This book did not sell very well, and one time he carried home from the publishers seven hundred copies that no one would buy, saying: “Well, I have quite a respectably sized library now — all my own writing, too!” His sense of humour never {5} him. Henry’s mother Linda was always by his side supporting him, reading his books. Mrs. Thompson often kept {6} Henry of his wonderful talent. She had no doubt that her son would succeed one day; it was only a question of time. And she was absolutely right.", "g": [[["by", "to", "of", "at"], 2, "be proud of sb."], [["saying", "talking", "telling", "speaking"], 2, "tell — say something to someone,
