et."], [["implied", "improved", "progressed", "promoted"], 1, "improve — become better, make better."], [["present", "provide", "afford", "allow"], 2, "afford — have enough money for (can afford)."]]}, {"t": "Sheila", "src": "B", "text": "Sheila had taken on a heavy load of six classes for her first semester. She wanted to get her obligatory classes out of the {0} as quickly as possible, so she took more than she could enjoy. But she found that she liked the ones she had signed up for, including an eighteenth-century\nEnglish literature class, which {1} writing. She knew it was good for her to write more than crime stories and mysteries. She had a lot of reading to do at night, and loved being challenged by the work. Most of her high school classes had been easy for her, and it was exciting to be taking more challenging courses, taught by professors she {2}. She noticed that one of her roommates studied as much as she did and they went to the library together. She was from China and a physics major. She’d wanted to {3} Oxford and didn’t get in, but was hoping to try again and transfer to sophomore year.\nAt the end of the first month, Sheila went home, delighted to see the family and have a weekend with them, {4} she had brought home a lot of reading to do. She {5} to write any of her own stories for a month, and was frustrated about it. Her sister Mary came to her room after dinner on her first night back, and they talked into the night. Mary was upset that Sheila had no social life, she preferred to spend every moment on her book. At last Sheila {6} to finish the book.", "g": [[["path", "trail", "track", "way"], 3, "way — a way (the way to do / of doing); by the way."], [["recorded", "remained", "received", "required"], 3, "require sth / doing sth — need it."], [["approved", "admired", "accepted", "admitted"], 1, "admire — respect and like (admire sb for sth)."], [["join", "enlist", "enter", "enroll"], 2, "enter — go into; take part in (enter a competition)."], [["although", "moreover", "therefore", "otherwise"], 0, "although — even though (+ subject + verb)."], [["lacked", "failed", "lost", "missed"], 1, "fail — not succeed (fail to do, fail an exam)."], [["fulfilled", "achieved", "succeeded", "managed"], 3, "manage — succeed in doing something difficult (manage to do)."]]}, {"t": "Donna", "src": "B", "text": "Donna was happy. By the end of the week, she {0} to finish and email the manuscript to her literary agent Polly Smith to hand in to the publisher. Polly informed her that her most recent book was currently climbing bestseller lists at a rapid rate. Donna had become a regular feature on it by then, but was never blasé about it. It thrilled her every time when she got emails from Polly congratulating her and {1} her that one of her books was on the list week after week. This was another big bestseller. Donna wrote under the pseudonym Alexander Green. Her publishers were still {2} that the books were written by a young woman, and her identity was the best- kept secret in the business. The publicity department occasionally planted an item about the author, that he was hunting in Wales, or researching a new book somewhere, or had just {3} to his ranch in Texas to start work on a new thriller. Donna almost believed he was real, like some alter ego. She always {4} it funny when they sent her a clipping about the elusive Alexander\nGreen, or an alleged sighting of him somewhere unlikely like Somali. After her editor left, Donna decided to look {5} a new apartment, since the second lease on hers was expiring in June.\nThis time it took her two weeks to find one. It was slightly smaller than the one she’d had, but it suited her. She liked to have her own place to live, {6} she missed her sisters and the warmth of being among them.", "g": [[["succeeded", "fulfilled", "managed", "achieved"], 2, "manage — succeed in doing something difficult (manage to do)."], [["speaking", "talking", "telling", "sayings"], 2, "tell — say something to someone, tell a story (tell sb)."], [["amazed", "approved", "accepted", "admitted"], 0, "amazed — very surprised (amazed at / by)."], [["remained", "returned", "reviewed", "required"], 1, "return to a place — come back."], [["regarded", "confirmed", "reasoned", "considered"], 3, "consider sth + adjective — think of it as."], [["after", "at", "for", "on"], 2, "look for sth — try to find."], [["although", "moreover", "therefore", "however"], 0, "although — even though (+ subject + verb)."]]}, {"t": "Julie", "src": "B", "text": "Two things happened to Julie in the summer before her senior year at Chicago College. Her literary agent Celesta sold her second and third books to the same publisher for twice the money for each book as Julie got for the first one. The reviews on her first book had been excellent, and the publisher was in a {0} to publish Heroes, her second book, in time for Christmas that year.\nCelesta hadn’t {1} them her recently finished fourth book. Julie and Hadson, her editor, still wanted to {2} it. And Celesta wanted to see how the next one did. If it was as successful as she hoped, she was going to ask for a lot more money on the next contract.\nThe second thing that happened that summer was that totally by {3}, through the creative writing professor, she got a summer job in Washington working for a major publisher for two months. The professor called her and asked if she’d be interested, and Julie wanted the {4}.\nIt was a different publisher than her own, and she wanted to learn more about the business. She discussed it with Celesta that night, who encouraged her to do it, and she {5} the next day.\nIt was an internship so the pay was minimal, but she had the money from her book deal, and still more than enough of what her father had left her. It was going to be an exciting summer for her.\nJulie loved being in Washington and learning more about publishing, and writing a completely different kind of book than she wrote before, {6} her first two books had terrific reviews.", "g": [[["hurry", "worry", "envy", "duty"], 0, "be in a hurry to do sth."], [["suggested", "provided", "supplied", "offered"], 3, "offer — say you will give or do something (offer to do)."], [["inspire", "improve", "impress", "influence"], 1, "improve — become better, make better."], [["occasion", "matter", "accident", "incident"], 2, "accident — an unplanned bad event, a crash; chance."], [["job", "career", "profession", "occupation"], 0, "job — paid work, a position (get a job)."], [["accepted", "assisted", "allowed", "admitted"], 0, "accept — say yes to (an invitation, an offer)."], [["therefore", "otherwise", "although", "moreover"], 2, "although — even though (+ subject + verb)."]]}, {"t": "Daphne", "src": "B", "text": "Daphne was a fan of Bedford Castle show. She watched a new scene being shot early the next morning when she went for a walk before breakfast. The actors were different this time, some of the younger stars, and the father on the show with them. Daphne {0} them all and stood rapt until they finished shooting. She couldn’t {1} getting tired of it or becoming blasé about it.\nIt was magical watching them.\nAfter breakfast, she walked up to the castle, and waited for a {2} of the parts they showed visitors. The history of the place was fascinating. Its heyday of opulence and luxury had been in the nineteenth and earlier part of the twentieth century. The Bedford family had had serious reverses after the Crash of 1929. Changing times had continued to diminish their fortune after the\nSecond World War, and by the 1960s they were in serious {3}. However, they {4} to hang on to the castle and estate by selling works of art, valuable objects like Faberge boxes, or the occasional investment that did well. The guide explained that the parts of the castle being used to film the show were the most beautiful but the tourists couldn’t see them at the moment because they were in use for filming on a daily basis. Learning about it was fascinating and Daphne bought a book about the family and the castle on the way out. She learnt that nothing had changed much in the castle. The family couldn’t {5} it. They had titles and a beautiful castle, but had no money to {6} it.", "g": [[["recognised", "resembled", "received", "reviewed"], 0, "recognise — know someone you have seen before."], [["visualise", "invent", "expect", "imagine"], 3, "can't imagine doing sth."], [["travel", "tour", "voyage", "journey"], 1, "tour — a trip to visit and see places, often with a guide."], [["problem", "fault", "trouble", "worry"], 2, "trouble — difficulties, problems."], [["managed", "succeeded", "fulfilled", "completed"], 0, "manage — succeed in doing something difficult (manage to do)."], [["approve", "arrange", "allow", "afford"], 3, "afford — have enough money for (can afford)."], [["arrange", "provide", "maintain", "continue"], 2, "maintain — keep something at the same level."]]}, {"t": "Pat", "src": "B", "text": "Pat checked her bags at the airport the next day. She carried her overstuffed hand luggage and boarded the plane to London, feeling like she was leaving home again but {0} to see her old friends too. The two years in Europe after college had been the beginning of her adult life, {1} she hadn’t changed physically. She still looked years younger than she was and could have passed for a teenager in ballet flats and jeans at twenty-four.\nShe didn’t {2} it but Sue and Vicky were at the airport to meet her, as a surprise when she came through customs. They held her tight when they hugged her and they both cried and so did\nPat. She’d seen them at her sister’s wedding ten months earlier, but that was a long time too. Her friends headed for the garage to get the car. Both her friends ascertained immediately that Pat looked happy and well, and she seemed to have more {3} after living on her own for two years. They thought that she was more beautiful than ever. Sue gave a sigh of relief as she started the car. Pat {4} them all about her recent trip around Europe on the drive from the airport.\nPat settled into her room that night. She unpacked her bags, and put her papers on her desk, and in a way, it was very odd. It was as though she had never left. She could {5} believe she had been away for two years. She went downstairs for breakfast with Vicky the next morning. Pat informed Vicky that she had an offer from a big production company to film one of her books.\nHowever, she didn’t decide whether to {6} it.", "g": [[["exciting", "excited", "interesting", "expected"], 1, "excited — feeling happy and enthusiastic (-ed: how you feel)."], [["moreover", "therefore", "otherwise", "although"], 3, "although — even though (+ subject + verb)."], [["expect", "inspect", "persist", "insist"], 0, "expect — think something will happen."], [["competence", "evidence", "confidence", "excellence"], 2, "confidence — belief in yourself (self-confidence)."], [["told", "said", "spoke", "talked"], 0, "tell — say something to someone, tell a story (tell sb)."], [["merely", "hardly", "nearly", "rarely"], 1, "hardly — almost not (hardly ever, could hardly)."], [["approve", "admire", "adapt", "accept"], 3, "accept — say yes to (an invitation, an offer)."]]}, {"t": "Light from the Past", "src": "D", "start": 32, "text": "When you stand and look at the stars, you are really looking at past history. The light from Alkaid, the end star in the handle of the Big Dipper, has taken about 210 years to {0} your eyes. If Alkaid stopped {1} today, people on earth would still see it {2} about 210 years. Some of the stars you see here tonight may have stopped existing several thousand years ago. The light from some {3} stars right now will not be seen on earth until thousands, or even millions, of years from now!\nIt's {4} breathtaking, and it {5} to the great mystery about the nature of light. Think about water waves. They get smaller and smaller in amplitude as they travel. Their energy is lost in friction among the water molecules. Think of sound waves in air. They too get weaker and weaker because of friction among the air molecules.\nBut light waves stop only if they strike something, and their energy is transferred {6} another form. {7}, they can go on and on, at the same terrific speed, with no loss of energy, forever!", "g": [[["approach", "reach", "hit", "achieve"], 1, "reach — get to a place (no preposition): reach your eyes."], [["burning", "flashing", "blushing", "shining"], 3, "shine — give light, as stars and the sun do."], [["after", "through", "for", "at"], 2, "for + a period of time: for about 210 years."], [["farewell", "faraway", "far", "fair"], 1, "faraway — distant; used before a noun."], [["quit", "quick", "quiet", "quite"], 3, "quite — completely, really (quite breathtaking)."], [["enlarges", "increases", "adds", "multiplies"], 2, "add to sth — make it bigger (add to the mystery)."], [["into", "onto", "for", "at"], 0, "transfer / turn into another form."], [["although", "otherwise", "whatever", "either"], 1, "Otherwise — if not, in other cases."]]}, {"t": "The First Day at School", "src": "D", "start": 32, "text": "Do you remember your first day at school? It was probably {0} confusing. Now, to {1} this confusion, many primary schools in England have a special teacher who welcomes new pupils. She is {2} a reception class teacher. The children are {3} with the idea of school and if they have been good, they can't understand why they have to go to school. They imagine that school is optional. When the child goes to school on his first day and watches his mother leaving he thinks that she is deserting him. The teacher must {4} him that at the end of the day his mother will be back and take him home.\nThe children are not the only people that are disturbed by going to school. The teacher sometimes has as much difficulty in {5} with the mothers. They hang around and dislike leaving the child without their protection.\nThe best way to {6} with the situation is to get the child used to the idea of school. Before the beginning of term, the mother should take her child to see the teacher and to look {7} the school. The first day should be something to emphasize the regularity of school.", "g": [[["enough", "rarely", "rather", "equally"], 2, "rather + adjective — quite, fairly (rather confusing)."], [["escape", "defeat", "beat", "avoid"], 3, "avoid — prevent something bad from happening."], [["named", "called", "said", "told"], 1, "be called — have a name or title."], [["afraid", "threatened", "endangered", "risked"], 1, "be threatened with sth — feel in danger because of it."], [["convince", "prove", "explain", "announce"], 0, "convince sb that… — make someone believe."], [["managing", "guiding", "coping", "handling"], 2, "cope with sb / sth — deal successfully with a difficult situation."], [["face", "deal", "touch", "consider"], 1, "deal with a situation — take action to solve it."], [["through", "about", "after", "round"], 3, "look round — visit a place and look at it."]]}, {"t": "Your Future World", "src": "D", "start": 32, "text": "What will you be doing in 2025? Will you be living in an undersea research station? Will you be the chief engineer {0} a bridge across the Atlantic Ocean? Will you be leading an {1} to the planet Mars? Will you be …?\nYou can daydream, of course, but nobody knows exactly what the world will be {2}. But scientists have made some guesses.\nBased on the advances made, they believe people will be healthier. Diphtheria, malaria, tuberculosis, polio and many other killers are under control now. These diseases are on the way out, {3} to germ-killing chemicals, new ways of finding out about our bodies, and new ways of providing clean, safe {4} and water.\nHealthier people live longer, so we can expect the world's population to {5} sharply. It may double in the next forty years! This brings up a serious problem: how will we find food, water, and minerals for such a huge population?\nScientists are at work on some {6}. From the ocean they hope to get new fertilizers to increase the yield of the soil, new chemicals to kill crop-destroying insects without {7} other animals, new sources of water or supplies of food.", "g": [[["inventing", "designing", "scheming", "doing"], 1, "design a bridge — plan how it will be built."], [["exploration", "expenditure", "expedition", "exhibit"], 2, "lead an expedition — an organised journey for research."], [["like", "alike", "likely", "likable"], 0, "What will the world be like? — what kind of world."], [["as a result", "because", "on account", "thanks"], 3, "thanks to sth — because of something good."], [["eat", "feed", "food", "cooking"], 2, "food and water — a noun is needed."], [["decrease", "distract", "dissolve", "increase"], 3, "increase sharply — grow quickly (people live longer)."], [["solutions", "alternatives", "preferences", "questions"], 0, "work on solutions to a problem."], [["hurting", "harming", "injuring", "wounding"], 1, "harm animals / the environment — damage in general."]]}, {"t": "Alaska", "src": "D", "start": 32, "text": "The first Europeans to visit what is now called Alaska were Russian sailors led by Captain Bering. The {0} was funded by Russian czar Peter the Great. In 1728 Bering and his crew {1} through the strait that is now named after him, between the easternmost part of Asia and the westernmost part of the Americas. Their journey {2} that Asia was not connected to North America; however, due to the heavy fog, they never actually saw the nearby land of North America. In 1741 Bering headed further south, landing on tiny Kayak Island off the {3} of what is now the southeastern part of the state.\nIn the 1780s and 1790s Russians began small colonies, first on Kodiak Island and later on the mainland. In 1799 the Russian-American Company was established to {4} Russian interests. For the next 68 years the company provided the only form of government for the European colonists, {5} never numbered more than a few hundred. The Russians ruled the {6} until the late 1860s, when they sold it to the United States for $7.2 million.\nThe {7} of gold in 1896 in the Yukon Territory started a huge gold rush that brought thousands of settlers.", "g": [[["travel", "trip", "journey", "expedition"], 3, "expedition — an organised journey to explore new places."], [["paddled", "sailed", "travelled", "rowed"], 1, "sail — travel by ship through a strait."], [["proved", "convinced", "persuaded", "appeared"], 0, "prove that… — show that something is true."], [["bank", "beach", "shore", "sea-side"], 2, "off the shore — in the sea near the land."], [["look after", "look at", "look for", "look away"], 0, "look after interests — take care of them."], [["which", "whose", "what", "who"], 3, "who — relative pronoun for people (the colonists)."], [["country", "area", "ground", "earth"], 1, "area — a region or part of a country."], [["discovery", "detection", "exploration", "innovation"], 0, "the discovery of gold — finding it for the first time."]]}, {"t": "Ordinary", "src": "D", "start": 32, "text": "“Ordinary” was the worst word she could find for anything. She and I would argue fiercely because I wanted to be ordinary as desperately as my mother wanted to be {0}.\n“I can't {1} that hair-do,” she said when I went to the hairdresser with my friend and came back with a pageboy haircut straight out of Seventeen magazine. “It's so terribly ordinary.” Not ugly, not unsuitable. But ordinary.\nHer {2} of ordinariness came out most strongly in her clothes.\n“Couldn't you please {3} something else?” I asked her when she was dressing for Parents' Day in tight-fitting pants and a bright pink sweater, with a Mexican cape.\n“What's wrong with my outfit?”\nWhat wasn't wrong with it!\n“It's just that I wish it would be something more plain,” I said sheepishly, “something that people won't {4} at.”\nShe looked at me angrily and drew herself {5} to her full height of five feet ten inches.\n“Are you {6} of your own mother? Because if you are, Isadora, I feel {7} for you. I really do.”", "g": [[["uncommon", "unusual", "odd", "peculiar"], 1, "unusual — different, not ordinary (in a positive way)."], [["stand", "approve", "agree", "vote"], 0, "can't stand sth — strongly dislike it."], [["worry", "trouble", "panic", "fear"], 3, "fear of sth — being afraid of it."], [["dress", "put", "wear", "clothe"], 2, "wear clothes — have them on your body."], [["watch", "stare", "glance", "peep"], 1, "stare at sb — look for a long time (rudely)."], [["up", "on", "over", "at"], 0, "draw yourself up — stand up straight and tall."], [["sorry", "shamed", "ashamed", "angry"], 2, "be ashamed of sb — feel embarrassed because of them."], [["regretful", "sorry", "guilty", "unhappy"], 1, "feel sorry for sb — feel pity."]]}, {"t": "Searching for a New Programme", "src": "D", "start": 32, "text": "A healthy lifestyle can vastly improve your well-being. This is a lifestyle designed for those who wish to feel more certain about their health and more in control of what the present and future will bring them in that important {0} of existence. None of us wants to be sick. None of us enjoys the idea that we may become a medical statistic. This is a simple, easy-to-follow health-style that can enable you to get cards very much in your {1}. The doctors were fortunate enough to come into {2} with a field of study that brought them to healing and well-being that they so desperately needed. They personally have {3} thousands of people improve their health using only a small part of information. Many more people begin to improve their health now. Embracing the most current information from many health-related fields, the programme of healthy lifestyle gives you an understanding of the impact of exercise, breathing, sunshine, sleep and much more on your health. In order for this programme to work for you, you have to be willing to apply at least some part of it. Some change will be {4}. And as you make those first modest changes, you will get positive results that encourage you to do more. Changing is fun. And if you realize that your new healthy lifestyle {5} the making of new habits, not the {6} of old ones, you will feel very positive about what the future holds for you.", "g": [[["sector", "region", "area", "territory"], 2, "area of life / existence — a part or subject."], [["benefit", "advantage", "privilege", "favour"], 3, "in your favour — to your advantage (a fixed phrase)."], [["touch", "contact", "view", "connection"], 1, "come into contact with sth — meet or experience it."], [["confessed", "witnessed", "determined", "recognized"], 1, "witness sb do sth — see it happen."], [["ordered", "commanded", "forced", "required"], 3, "be required — be necessary."], [["contains", "consists", "involves", "encloses"], 2, "involve sth — include it as a necessary part."], [["breaking", "damaging", "ruining", "destroying"], 0, "break a habit — stop doing it."]]}, {"t": "To the North of London", "src": "D", "start": 32, "text": "The Aldenham Country Park is a large and pleasant area easily reached if you are travelling north out of London. It is worth visiting if you want a quick breath of fresh air and a reasonably attractive place for a brief picnic. The most important point of the park is Aldenham Reservoir. It was built in 1796 to {0} the water level in the river {1} by the newly constructed Grand Union Canal, and more recently has been used as a reserve public water supply. Not far from there lies the busy town of Watford which can be recommended for a brief visit. And in any {2} much more interesting stretches of the canal are met further north. And if you make your way through the town you can visit the Watford Museum in the High Street which has materials on printing and paper-making on {3}. The picture gallery has changing exhibitions of works by artists who lived or painted in the area.\nAnother attraction of the neighbourhood is a fascinating complex of Roman buildings, the {4} of a great city, once the third largest centre of Roman Britain. The private houses were impressive, many of them furnished with mosaic floors. The beauty of the mosaics can hardly be described on paper, and it is best {5} by standing and looking for a while. The other principal Roman site to be visited is a long stretch of the city wall which {6} back to the 3rd century.", "g": [[["remain", "support", "hold", "maintain"], 3, "maintain a level — keep it the same."], [["confused", "affected", "bothered", "disturbed"], 1, "affected by sth — changed or influenced by it."], [["condition", "situation", "circumstance", "case"], 3, "in any case — anyway (a fixed phrase)."], [["presentation", "display", "demonstration", "exhibition"], 1, "on display — shown to the public."], [["remains", "wastes", "wreckage", "reminders"], 0, "remains — what is left of an ancient building or city."], [["praised", "approved", "appreciated", "regarded"], 2, "appreciate beauty — understand and enjoy its value."], [["dates", "returns", "follows", "comes"], 0, "date back to — have existed since."]]}, {"t": "Sharing Music with Friends", "src": "D", "start": 32, "text": "Brenda is a nineteen-year-old full-time college student, and she earns money working part time as a waitress. Brenda loves to listen to music like most young people, but she can't {0} the high CD prices that record companies {1} for popular CDs. Brenda says that the prices of CDs are ridiculously high at $17 to $20 each and there are only two or three good songs on each CD.\nShe {2} an apartment with three other roommates. She pays her own {3} and she also pays most of her {4}. Her solution to expensive CDs is to download or copy music from the Internet. Brenda and millions of other people are called “downloaders” because they download free file-sharing software and music. When Brenda later gives, shares, or trades her music files free over the Internet, she is also an uploader. She considers herself an active music uploader, but the music industry considers her a {5}. From 2001 on, the Recording Industry Association of America has sued and fined dozens of file-sharing services, for uploading music files, and hundreds of people, for {6} the law by downloading music.", "g": [[["provide", "supply", "afford", "allow"], 2, "can't afford sth — not have enough money for it."], [["offer", "charge", "suggest", "propose"], 1, "charge a price for sth — ask money for it."], [["leases", "lends", "hires", "rents"], 3, "rent an apartment — pay to live in it."], [["lessons", "classes", "tuition", "education"], 2, "tuition — money paid for teaching at college."], [["costs", "fees", "expenses", "payments"], 2, "expenses — money you spend on everyday things."], [["thief", "cheater", "burglar", "bandit"], 0, "thief — a person who steals."], [["undermining", "disobeying", "breaking", "ruining"], 2, "break the law — do something illegal."]]}, {"t": "British Theatre", "src": "D", "start": 32, "text": "The theatre has always been very strong in Britain. Its centre is, of course, London, where successful plays can {0} without a break for many years. London has several dozens of theatres, most of them not {1} from Trafalgar Square. {2} London even some quite big towns have no public theatre at all, but every town has its private theatres. British theatre is much admired. There you can {3} the best of everything — an excellent orchestra, famous conductors, celebrated actors and a well-dressed {4}.\nChoose a good play, and you'll enjoy yourself throughout from the moment the curtain {5} to the end of the last act. Get your seats beforehand, either at the box office or at the theatre itself. You'll probably want to sit as near to the {6} as possible.", "g": [[["show", "perform", "run", "produce"], 2, "a play runs — is shown regularly for a period."], [["far", "remote", "distant", "close"], 0, "not far from — near."], [["Inside", "Outside", "In", "Out"], 1, "Outside London — in other parts of the country."], [["take", "give", "hold", "get"], 3, "get the best of everything — receive it."], [["audience", "auditorium", "authority", "publicity"], 0, "audience — the people watching a play."], [["puts up", "sets up", "makes up", "goes up"], 3, "the curtain goes up — the play begins."], [["scene", "stage", "scenery", "performance"], 1, "stage — the place where actors perform."]]}, {"t": "A Chinese Vase", "src": "D", "start": 32, "text": "When I was a child I loved visiting my grandmother. I thought her house was as beautiful as a palace. As I grew older the house and garden seemed smaller, but I still loved visiting the old lady. There were so many lovely things to look {0} in the house.\nI loved her paintings and the old clock, but {1} all I loved a big Chinese vase which stood in the hall. It was {2} than me, and I couldn't see {3} it. I walked round and round it looking at the beautiful ladies and the birds and flowers and trees, and Grandmother often {4} me stories about these ladies. She said that her grandfather had brought the vase with him when he returned from a long {5} to China.\nWe live in a modern house, and I'm afraid my husband and I often nag at the children. “Don't make the new carpet dirty, Paul!” “Be careful with the new table, Philip!”\nBefore she died, Grandmother gave me the vase I loved so much. It {6} beautiful in our modern hall.\nOne day I came home from the shops. The boys met me at the door. “I'm as strong as George Best, Mummy,” said Paul. “I got a goal and I broke the vase.” Philip tried to be more diplomatic than Paul. “It doesn't really matter, does it? You told us it wasn't new. You aren't cross, are you?”", "g": [[["out", "at", "into", "about"], 1, "look at — direct your eyes to something."], [["mostly", "great of", "greatly", "most of"], 3, "most of all — more than anything else."], [["higher", "larger", "taller", "greater"], 2, "tall — of height (people, vases, buildings)."], [["about", "around", "inside", "outside"], 2, "see inside — look into the vase."], [["said", "spoke", "talked", "told"], 3, "tell sb stories."], [["voyage", "tour", "hike", "excursion"], 0, "voyage — a long journey by sea."], [["looked", "viewed", "appeared", "seemed"], 0, "look + adjective — seem (it looked beautiful)."]]}, {"t": "A Quiet House", "src": "D", "start": 32, "text": "It was April and John Moore was studying for an important examination. As the date of the exam {0} nearer, he decided to go somewhere and read by himself.\nHe did not want the amusements of the seaside, or the beauties of the countryside. He decided to find a quiet, little town and work there undisturbed. He {1} his suitcase with clothes and books. Then he looked in a railway timetable for a town that he did not know. He found one, and bought a ticket to go there. He did not tell anyone where he was going. After all, he did not want to be {2}.\nThat is how Moore arrived at Benchurch. It was a market town, and once a week it was quite busy for a few hours. The rest of the time it was a very quiet and sleepy place. Moore spent his first night at the only hotel in the town. The landlady was very kind and helpful, but the hotel was not really quiet enough for him. The second day he started {3} for a house to rent.\nThere was only one place that he liked. It was more than quiet — it was deserted and very lonely. It was a big, old seventeenth-century house. It had barred windows like a prison, and a high brick wall all around it. It would be hard to {4} a more unwelcoming place. But it suited Moore perfectly. He went to find the local lawyer, who was responsible for the house.\nMr. Carnford, the lawyer, was very happy to rent the house to him. “I'd be glad to let you have it free,” he said. “It's been empty so long that people have started to {5} a lot of foolish stories about it. You'll be able to prove that the stories are wrong.”\nMoore didn't think it was necessary to ask the lawyer for more details of the foolish stories. He paid his rent, and Mr. Carnford gave him the name of an old servant to {6} him. He came away from the lawyer with the keys of the house in his pocket.", "g": [[["appeared", "drew", "moved", "entered"], 1, "draw near / nearer — come closer in time."], [["wrapped", "laid", "piled", "packed"], 3, "pack a suitcase — put things in it for a trip."], [["bothered", "intervened", "interfered", "helped"], 0, "be bothered — be disturbed by other people."], [["finding", "looking", "skimming", "exploring"], 1, "look for — try to find."], [["understand", "imagine", "know", "seek"], 1, "It's hard to imagine — difficult to think of."], [["extend", "promote", "gossip", "spread"], 3, "spread stories — tell them to many people."], [["look at", "look about", "look after", "look around"], 2, "look after sb — take care of them."]]}, {"t": "Looking for a Job", "src": "D", "start": 32, "text": "My new home was a long way from the centre of London but it was becoming essential to find a job, so {0} I spent a whole morning getting to town and applying to London Transport for a job on the tube. It turned out that they were looking for guards, not drivers. This {1} me. I couldn't drive a car but I could probably guard a train and perhaps continue to write poems between stations. “Yes, I would be a tube guard,” I thought. I could see myself being cheerful, useful, a good man in a crisis.\nThe next day I sat down, with almost a hundred other {2}, for the intelligence test. I must have done all right because after half an hour's wait I was sent into another room for a psychological test. The examiner sat at a desk. You were signalled forward to occupy the seat opposite him when the previous occupant had been {3}. Sometimes the person was rejected quickly and sometimes after quite a while. Obviously the longer interviews were the most successful ones. Mine was the only one that lasted a minute and a half. I can remember the questions now: “Why did you leave your last job?” “Why did you leave your job before that?” “And the one before?” I can't {4} my answers, except they were short at first and grew shorter as we continued. His closing statement {5} a lack of sensitivity, which helped to explain why as a psychologist he had risen no higher than the underground railway. “You have failed this test and we are unable to offer you a position.” Failing to get that job was my low point. Or so I thought, believing that the work was easy. Actually, such a job {6} exactly this sort of elementary responsibility a dreamer like me is unlikely to have.", "g": [[["finally", "at the end", "lastly", "in conclusion"], 0, "finally — after a long time."], [["comforted", "matched", "fitted", "suited"], 3, "suit sb — be convenient or right for them."], [["friends", "members", "candidates", "nominees"], 2, "candidates — people applying for a job."], [["declined", "dismissed", "accepted", "abandoned"], 1, "be dismissed — be sent away."], [["recall", "memorize", "forget", "remind"], 0, "recall — remember."], [["discovered", "revealed", "disguised", "opened"], 1, "reveal — show something hidden."], [["expects", "offers", "demands", "asks"], 2, "demand — need a lot of something."]]}, {"t": "Tracy's Voyage", "src": "D", "start": 32, "text": "Tracy was as excited as a child about her first trip abroad. Early in the morning, she stopped at a {0} agency and reserved a suite on the Signal Deck of the Queen Elizabeth II. The next three days she spent buying clothes and luggage.\nOn the morning of the sailing, Tracy hired a limousine to drive her to the pier. When she {1} at Pier 90, where the Queen Elizabeth II was docked, it was crowded with photographers and television reporters, and for a moment Tracy was panic-stricken. Then she realized they were interviewing the two men posturing at the foot of the gangplank. The members of the crew were helping the passengers with their luggage. On deck, a steward looked at Tracy's ticket and {2} her to her stateroom. It was a lovely suite with a private terrace. It had been ridiculously expensive but Tracy {3} it was worth it.\nShe unpacked and then wandered along the corridor. In almost every cabin there were farewell parties going on, with laughter and champagne and conversation. She felt a sudden ache of loneliness. There was no one to see her {4}, no one for her to care about, and no one who cared about her. She was sailing into a completely unknown future.\nSuddenly she felt the huge ship shudder as the tugs started to pull it out of the harbour, and she stood {5} the passengers on the boat deck, watching the Statue of Liberty slide out of {6}, and then she went exploring.", "g": [[["journey", "trip", "travel", "tourist"], 2, "a travel agency — a fixed phrase."], [["achieved", "arrived", "entered", "reached"], 1, "arrive at a place."], [["set", "came", "headed", "directed"], 3, "direct sb to a place — show the way."], [["determined", "resolved", "decided", "assured"], 2, "decide that… — come to a conclusion."], [["in", "off", "of", "after"], 1, "see sb off — say goodbye at a station or port."], [["among", "along", "between", "besides"], 0, "among — in a group of people."], [["glance", "stare", "sight", "look"], 2, "out of sight — no longer visible."]]}, {"t": "Busy Day", "src": "D", "start": 32, "text": "Let me tell you what happened once when my dear Uncle Rodger decided to hang a picture on the wall. He told us not to {0} and just watch him do it. He said he would do it by himself. Well, he came up to the picture which was waiting to be put up in the dining room and took it. But suddenly it fell down and the glass {1} into pieces and he cut his finger. He started to {2} his handkerchief but couldn't find it because he had put it in his coat and none of us knew where his coat was.\n“Six of you!” Uncle Rodger exclaimed, “and you cannot find the coat that I put down only five minutes ago!” But then he got up from his chair and found that he had been sitting on his coat the whole time. “Oh, you can stop your {3}. I've found it myself!”\nThen after an hour was spent in tying up his finger Uncle Rodger wondered where the hammer had disappeared to. And while everybody was trying to get the hammer he was standing on the chair saying: “Well, I want to know if you are going to {4} me here all evening!”\nFinally the hammer was found, but we noticed that the nail which he had prepared was lost. And, of course, Uncle Rodger didn't keep {5} while he was waiting for another nail to be brought. We heard all he had to say about our habit of losing all the things he needed.\nWhen the picture was hanging on the wall at last, everybody looked very {6}, all except Uncle Rodger, who was as lively as ever. Aunt Maria remarked that if Uncle Rodger wanted to do a job like that again, she would spend a week with her mother until it was over.", "g": [[["scare", "disturb", "worry", "fear"], 2, "Don't worry — don't be nervous about it."], [["failed", "broke", "ruined", "fell"], 1, "break into pieces."], [["look at", "look to", "look after", "look for"], 3, "look for — try to find."], [["search", "investigation", "exploration", "study"], 0, "search — the act of looking for something."], [["stay", "keep", "put", "take"], 1, "keep sb waiting somewhere."], [["dumb", "cool", "still", "silent"], 3, "keep silent — say nothing."], [["dull", "tired", "fresh", "boring"], 1, "tired — needing rest."]]}, {"t": "A Storyteller", "src": "D", "start": 32, "text": "In my early 20s, after a year and a half in England, and four months in France, I returned to the United States and got a job at a camp in northern Virginia. My {0} that summer was Dan from Mississippi, and I am from Rhode Island. We worked together with a group of boys from 12 to 14 years old. I've always been a bit untidy, but Dan was {1} and clean, even after a night in the woods with our campers. We could not have been more different, but we got on because we shared the same {2} of humour.\nAt the end of the summer, a few of us went to {3} a cave in West Virginia and got stuck in the cave for the night. It wasn't as dramatic as it sounds. The park rangers had told us to stay there if anything happened. They knew where we were going, and when we should have been back. Dan hurt his right foot badly. So we had to {4} the night in the cave. Food and water were not a problem, but we turned off our lights to save power. In the distance, we could hear the sound of running water.\nTo {5} the time, we told stories. That night in the cave we moved from one family story to another. As the night wore on, I remembered more and more. I was not alone — the cave, the blue light and the flowing water released stories and memories that we had never revealed to anyone. It was as if a river of stories had started flowing in each of us.\nWhen the rangers came the next morning, we didn't want to {6}. “Can't we just tell a few more stories?” In the cave, that night, I became a storyteller.", "g": [[["friend", "teammate", "partner", "opponent"], 2, "partner — a person you work with."], [["clear", "neat", "exact", "careful"], 1, "neat — tidy."], [["feeling", "emotion", "reason", "sense"], 3, "a sense of humour."], [["explore", "analyze", "teach", "learn"], 0, "explore a cave — travel around it to learn about it."], [["lead", "spend", "hold", "waste"], 1, "spend the night somewhere."], [["keep", "waste", "spare", "pass"], 3, "pass the time — do something while you wait."], [["escape", "leave", "remain", "retire"], 1, "leave — go away from a place."]]}, {"t": "Nostalgia for the Old Neighbourhood", "src": "D", "start": 32, "text": "Life is made up of little things: some unimportant memories from childhood that, in fact, shaped your character. I {0} on Third Avenue in midtown Manhattan during the 1950s-60s where family life was centred around old {1} of flats and small stores. Third Avenue was my old neighbourhood and it had character. It was {2} with working families of Italian, German and Irish origin. We shopped together with all those people and their kids played together. Third Avenue influenced the way our family lived. I absorbed the street life. It gave me an {3} that I could not have received in any other place. To me, it was home.\nIn a recent walk around Third Avenue my eyes {4} signs of the old neighbourhood but couldn't find any. If I hadn't been born here and someone described the area, it would be {5} to believe. It wasn't because a few buildings had changed — everything had changed. The transformation began in the late 1950s and 60s when corporations replaced the old neighbourhood. In the early 1960s, the houses were pulled down. Families were forced to {6}, the small stores went out of business and the old neighbourhood was changed forever. And now there is a lack of character in the transformed neighbourhood.", "g": [[["brought up", "grew up", "went up", "got up"], 1, "grow up — spend your childhood somewhere."], [["blocks", "houses", "groups", "sets"], 0, "blocks of flats — large buildings with many flats."], [["covered", "held", "loaded", "filled"], 3, "be filled with — be full of."], [["knowledge", "information", "education", "training"], 2, "an education — learning that shapes you."], [["looked after", "looked for", "looked through", "looked at"], 1, "look for — try to find."], [["hard", "easy", "strange", "heavy"], 0, "hard to believe — difficult to believe."], [["stay out", "take out", "move out", "go out"], 2, "move out — leave your home to live elsewhere."]]}, {"t": "To Hear a Child", "src": "D", "start": 32, "text": "I believe in patience. I live as a volunteer residential counsellor in a small group home. These boys have brought joy and happiness into my life; they have made me laugh and made me proud. However, they have also challenged me, made me angry and tested my patience.\nEach day we start anew, going about a {0} routine. I drive them to school, pick them up, cook for them and help with homework. We spend the evenings {1} about what happened during the day. I meet their teachers and s const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const BANK = [];
S.forEach(([gid,text,ans,forms])=>{
  const g=G[gid]; const base=g[1].map(w=>w[0]); const opts=forms||base;
  let idx=opts.map((_,i)=>i);
  if(idx.length>4){const others=shuffle(idx.filter(i=>i!==ans)).slice(0,3);idx=[ans,...others]}
  BANK.push({gid,text,opts:idx.map(i=>opts[i]),ans:idx.indexOf(ans),note:base[ans]+" — "+g[1][ans][1]});
});
X.forEach(([gid,text,ans,opts,note])=>BANK.push({gid,text,opts,ans,note}));
const WORDBANK = BANK.filter(b=>G[b.gid]);

function sentenceHTML(text,slot){return esc(text).replace("___",slot)}
function makeRow(item,num,mode,onDone){
  const row=h("div","row");
  row.appendChild(h("div","tn",String(num)));
  const body=h("div","");
  let shown=null;
  if(mode==="hunt"){shown=Math.random()<0.4?item.ans:shuffle(item.opts.map((_,i)=>i).filter(i=>i!==item.ans))[0]}
  const s=h("div","s");
  const slotTxt=mode==="hunt"?esc(item.opts[shown]):"&nbsp;";
  s.innerHTML=sentenceHTML(item.text,`<span class="slot${mode==="hunt"?" shown":""}">${slotTxt}</span>`);
  body.appendChild(s);
  const opts=h("div","opts"); body.appendChild(opts);
  const fb=h("div","fb");
  let choices;
  if(mode==="hunt"){
    choices=[{label:"Correct",correct:shown===item.ans}].concat(shuffle(item.opts.map((o,i)=>({label:o,i})).filter(o=>o.i!==shown)).map(o=>({label:o.label,correct:shown!==item.ans&&o.i===item.ans,i:o.i})));
  } else {
    choices=shuffle(item.opts.map((o,i)=>({label:o,correct:i===item.ans,i})));
  }
  const cell=h("span","cell","");
  const btns=choices.map((c,k)=>{
    const b=h("button","opt",`<span class="k">${k+1})</span>${esc(c.label)}`); b.type="button";
    b.onclick=()=>{
      btns.forEach(x=>x.disabled=true);
      cell.textContent=k+1; cell.classList.add(c.correct?"ok":"bad");
      const slot=s.querySelector(".slot");
      if(c.correct){b.classList.add("ok");fb.className="fb ok";}
      else{b.classList.add("bad");fb.className="fb bad";btns[choices.findIndex(x=>x.correct)].classList.add("ok")}
      slot.classList.remove("shown");
      if(mode==="hunt"&&shown!==item.ans){slot.innerHTML=`<s style="color:var(--bad);font-weight:400">${esc(item.opts[shown])}</s> ${esc(item.opts[item.ans])}`;slot.classList.add("ok")}
      else{slot.textContent=item.opts[item.ans]; slot.classList.add(c.correct?"ok":"bad")}
      const right=choices.findIndex(x=>x.correct)+1;
      if(c.correct) fb.innerHTML=(mode==="hunt"&&shown!==item.ans?"Right, the mistake is fixed. ":"Right. ")+`<i>${esc(item.note)}</i>`;
      else fb.innerHTML=`The correct answer: ${right}) <b>${esc(choices[right-1].label)}</b>. <i>${esc(item.note)}</i>`;
      onDone&&onDone(c.correct,item);
    };
    opts.appendChild(b); return b;
  });
  const otv=h("span","otv","Answer:"); otv.appendChild(cell); opts.appendChild(otv);
  opts.appendChild(fb);
  row.appendChild(body);
  return row;
}

function Round(container,{title,mode,getPool,controls,size=12,per=4,intro}){
  const st={};
  function start(){
    const pool=getPool();
    st.items=shuffle(pool).slice(0,Math.min(size,pool.length));
    st.page=0; st.res=[]; draw();
  }
  function draw(){
    container.innerHTML="";
    const wrap=h("div","drill");
    const head=h("div","head",`<h2>${title}</h2>`);
    if(controls) head.appendChild(controls(start));
    const prog=h("div","progress"); st.items.forEach((_,i)=>{const sp=h("span");if(st.res[i]!=null)sp.className=st.res[i]?"ok":"bad";prog.appendChild(sp)});
    head.appendChild(prog); wrap.appendChild(head);
    if(intro) head.insertBefore(h("span","muted",intro),prog);
    if(st.page*per>=st.items.length){wrap.appendChild(result());container.appendChild(wrap);return}
    const rows=h("div","rows");
    const from=st.page*per, slice=st.items.slice(from,from+per);
    let answered=0;
    const next=h("button","btn primary",(from+per>=st.items.length)?"Result":"Next"); next.type="button"; next.disabled=true;
    slice.forEach((it,k)=>rows.appendChild(makeRow(it,from+k+1,mode,(ok)=>{
      st.res[from+k]=ok; prog.children[from+k].className=ok?"ok":"bad";
      if(++answered===slice.length) next.disabled=false;
    })));
    wrap.appendChild(rows);
    const foot=h("div","foot"); foot.appendChild(h("span","muted",`Screen ${st.page+1} of ${Math.ceil(st.items.length/per)}`));
    next.onclick=()=>{st.page++;draw()}; foot.appendChild(next); wrap.appendChild(foot);
    container.appendChild(wrap);
  }
  function result(){
    const ok=st.res.filter(Boolean).length, n=st.items.length;
    const box=h("div","sheet result");
    box.appendChild(h("div","big",`${ok} out of ${n}`));
    box.appendChild(h("div","muted",ok===n?"No mistakes at all. Move on to the next step.":ok>=n*0.75?"Good result. Look at your mistakes below.":"Revise the cards for these groups and play another round."));
    const wrong=st.items.filter((_,i)=>!st.res[i]);
    if(wrong.length){const ul=h("ul");wrong.forEach(it=>ul.appendChild(h("li","",sentenceHTML(it.text,`<b>${esc(it.opts[it.ans])}</b>`)+` <span class="muted">(${esc(it.note)})</span>`)));box.appendChild(ul)}
    const again=h("button","btn primary","Play again"); again.type="button"; again.onclick=start;
    const f=h("div","foot"); f.appendChild(again); box.appendChild(f);
    return box;
  }
  start();
}

let CARDS=null, ci=0;
function buildCards(){
  CARDS=[];
  Object.keys(G).forEach(k=>CARDS.push({gid:k,title:G[k][1].map(w=>w[0].toUpperCase()).join(" · "),theme:G[k][0],rows:G[k][1],note:G[k][2]}));
  SPECIAL.forEach(c=>CARDS.push(c));
}
function initCards(){
  if(!CARDS) buildCards();
  ci=0; drawCard();
}
function drawCard(){
  const v=$("#v-cards"); v.innerHTML="";
  const c=CARDS[ci];
  const wrap=h("div","cardsview");
  const col=h("div","qcol");
  const flip=h("div","flip"); flip.tabIndex=0; flip.setAttribute("role","button"); flip.setAttribute("aria-label","Flip the card");
  const rows=c.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td class="ex">${esc(r[2])}</td></tr>`).join("");
  flip.innerHTML=`<div class="inner">
    <div class="face front"><div class="words">${esc(c.title)}</div><div class="theme">${esc(c.theme)}</div><div class="tap">click to flip</div></div>
    <div class="face back"><table>${rows}</table>${c.note?`<div class="note">${esc(c.note)}</div>`:""}</div></div>`;
  flip.onclick=()=>flip.classList.toggle("on");
  flip.onkeydown=e=>{if(e.key===" "||e.key==="Enter"){e.preventDefault();flip.classList.toggle("on")}};
  col.appendChild(flip);
  const nav=h("div","cardnav");
  const prev=h("button","arrow","&larr;"),next=h("button","arrow","&rarr;"),turn=h("button","btn","Flip");
  [prev,next,turn].forEach(b=>b.type="button");
  prev.setAttribute("aria-label","Previous"); next.setAttribute("aria-label","Next");
  prev.onclick=()=>{ci=(ci-1+CARDS.length)%CARDS.length;drawCard()};
  next.onclick=()=>{ci=(ci+1)%CARDS.length;drawCard()};
  turn.onclick=()=>flip.classList.toggle("on");
  nav.append(prev,h("span","cnt",`${ci+1} / ${CARDS.length}`),next,turn);
  col.appendChild(nav);
  wrap.appendChild(col);
  const side=h("div","side");
  const head=h("div","head",`<h2>Check yourself: this group</h2>`);
  const more=h("button","btn","New sentences"); more.type="button";
  head.appendChild(more); side.appendChild(head);
  const list=h("div","rows"); side.appendChild(list);
  const fill=()=>{list.innerHTML="";shuffle(BANK.filter(b=>b.gid===c.gid)).slice(0,3).forEach((it,i)=>list.appendChild(makeRow(it,i+1,"choose")))};
  more.onclick=fill; fill();
  wrap.appendChild(side);
  v.appendChild(wrap);
}
document.addEventListener("keydown",e=>{
  if(current!=="cards"||e.target.tagName==="SELECT")return;
  if(e.key==="ArrowRight"){ci=(ci+1)%CARDS.length;drawCard()}
  if(e.key==="ArrowLeft"){ci=(ci-1+CARDS.length)%CARDS.length;drawCard()}
});

    const tm=$("#btimer"); if(!tm) return;
    tm.textContent=Math.ceil(left/1000); tm.classList.toggle("hot",left<5000);
    const frac=left/LIMIT; fuse.setAttribute("stroke-dashoffset",String(100-frac*100));
    const p=path.getPointAtLength(path.getTotalLength()*frac); spark.setAttribute("cx",p.x); spark.setAttribute("cy",p.y);
    if(left<=0){answer(-1,null);return}
    raf=requestAnimationFrame(tick);
  }
  function answer(i,btn){
    if(locked) return; locked=true; cancelAnimationFrame(raf);
    const btns=[...$("#bopts").children]; btns.forEach(b=>b.disabled=true);
    const slot=$("#bq .slot"); slot.textContent=cur.opts[cur.ans];
    if(i===cur.ans){score++;$("#bscore").textContent=score;btn.classList.add("ok");slot.classList.add("ok");$("#bfb").innerHTML=`<span class="fb ok">Right.</span> <span class="muted">${esc(cur.note)}</span>`;setTimeout(next,900);return}
    if(btn) btn.classList.add("bad");
    btns.find(b=>b.textContent===cur.opts[cur.ans]).classList.add("ok");
    slot.classList.add("bad"); lives--; drawLives();
    $("#bfb").innerHTML=`<span class="fb bad">${i<0?"Time is up.":"Wrong."}</span> <span class="muted">${esc(cur.note)}</span>`;
    const bm=$("#boom"); bm.classList.remove("go"); void bm.offsetWidth; bm.classList.add("go");
    arena.classList.remove("shake"); void arena.offsetWidth; arena.classList.add("shake");
    misses.push(cur); const li=h("li","",sentenceHTML(cur.text,`<b>${esc(cur.opts[cur.ans])}</b>`)); $("#bmiss").prepend(li);
    setTimeout(next,2200);
  }
  function over(){
    cancelAnimationFrame(raf);
    $("#bq").innerHTML=`<span style="font-family:var(--f-display);font-weight:700">Game over. Score: ${score}</span><br><span class="muted" style="font-size:17px">${score>=15?"Excellent speed: you are ready for tasks 30–36.":score>=8?"Good. Revise the words from your mistakes on the right.":"Study the cards and practise first, then come back to the Speed Game."}</span>`;
    const o=$("#bopts"); o.innerHTML=""; const b=h("button","btn primary","Play again"); b.type="button";
    b.onclick=()=>{queue=shuffle(BANK);qi=0;score=0;lives=3;$("#bscore").textContent=0;$("#bmiss").innerHTML="";drawLives();next()};
    o.appendChild(b); $("#bfb").textContent="";
  }
  drawLives(); next();
  bombState={stop(){cancelAnimationFrame(raf);locked=true}};
}

/* ===================== ВАРИАНТЫ ЕГЭ ===================== */
const SRC={A:"EGE texts · @into_teaching_elt",B:"FIPI Use of English 2026",D:"Tasks 30–36 · older format (8 gaps)",C:"Extra practice"};
let ex={v:0,order:[],chosen:[],checked:false,cur:0}; const done=new Set();
function initExam(){ex={v:0,order:[],chosen:[],checked:false,cur:0};done.clear();loadVar(0)}
function loadVar(i){
  ex.v=i; ex.checked=false; ex.cur=0; ex.flip=false; ex.chosen=Array(E[i].g.length).fill(-1);
  ex.order=E[i].g.map(g=>shuffle([0,1,2,3]));
  drawExam();
}
function fitExam(){
  const v=$("#v-exam"); const tx=v.querySelector(".text"), body=v.querySelector(".text .body"), rc=v.querySelector(".rcol"); if(!body) return;
  if(window.innerWidth<=900){body.style.fontSize="";return}
  const avail=v.clientHeight-24;
  let fs=18.5; body.style.fontSize=fs+"px"; body.style.lineHeight="1.6";
  while(tx.offsetHeight>avail && fs>14){fs-=0.5; body.style.fontSize=fs+"px"; if(fs<17)body.style.lineHeight="1.45"}
  if(tx.offsetHeight>avail){const ins=v.querySelector(".instr2"); if(ins)ins.style.fontSize="13px"; body.style.lineHeight="1.4";
    while(tx.offsetHeight>avail && fs>13){fs-=0.5; body.style.fontSize=fs+"px"}}
  const q=v.querySelectorAll(".qopt"); let qs=16.5;
  const wide=()=>[...q].some(x=>x.scrollWidth>x.clientWidth+1);
  while((rc.offsetHeight>avail||wide()) && qs>12.5){qs-=0.5; q.forEach(x=>x.style.fontSize=qs+"px")}
  if(rc.offsetHeight>avail){v.querySelectorAll(".qopt").forEach(x=>{x.style.minHeight="30px";x.style.padding="2px 5px"}); v.querySelectorAll(".exam .cell").forEach(x=>{x.style.height="30px"})}
}
window.addEventListener("resize",()=>{if(current==="exam")fitExam()});
function drawExam(){
  const v=$("#v-exam"); v.innerHTML="";
  const e=E[ex.v], st=e.start||30, n=e.g.length, last=st+n-1;
  const wrap=h("div","exam");
  const top=h("div","topline");
  const sel=h("select"); sel.id="examPick";
  Object.keys(SRC).forEach(k=>{const og=document.createElement("optgroup");og.label=SRC[k];
    E.forEach((x,i)=>{if((x.src||"C")!==k)return;const o=new Option(`${i+1}. ${x.t}${done.has(i)?"  ✓":""}`,i);og.appendChild(o)});
    if(og.children.length)sel.appendChild(og)});
  sel.value=String(ex.v); sel.onchange=()=>loadVar(+sel.value);
  const prev=h("button","btn","&larr;"),next=h("button","btn","&rarr;"),rnd=h("button","btn","Random text");
  [prev,next,rnd].forEach(b=>b.type="button");
  prev.setAttribute("aria-label","Previous text"); next.setAttribute("aria-label","Next text");
  prev.disabled=ex.v===0; next.disabled=ex.v===E.length-1;
  prev.onclick=()=>loadVar(ex.v-1); next.onclick=()=>loadVar(ex.v+1);
  rnd.onclick=()=>{let r;do{r=Math.floor(Math.random()*E.length)}while(r===ex.v&&E.length>1);loadVar(r)};
  top.append(prev,sel,next,rnd,h("span","muted",`${ex.v+1} / ${E.length} · ${esc(SRC[e.src||"C"])}`));
  const rcol=h("div","rcol"); rcol.appendChild(top);
  const tx=h("div","sheet text");
  tx.innerHTML=`<div class="instr2">Read the text below. Gaps ${st}–${last} correspond to tasks ${st}–${last}, which give four possible answers. Write the number 1, 2, 3 or 4 of the answer you choose in the answer field.</div><h3>${esc(e.t)}</h3>`;
  const body=h("div","body");
  const parts=esc(e.text).split(/\{(\d)\}/);
  let html="";
  parts.forEach((p,k)=>{
    if(k%2===0){html+=p;return}
    const gi=+p, g=e.g[gi], ch=ex.chosen[gi];
    let cls="gap", word="", fix="";
    if(ch>=0){cls+=" filled";word=esc(g[0][ch])}
    if(ex.checked){ if(ch===g[1]) cls+=" ok"; else {cls+=" bad"; fix=`<span class="fix">${esc(g[0][g[1]])}</span>`} }
    if(gi===ex.cur&&!ex.checked) cls+=" cur";
    html+=`<span class="${cls}" data-g="${gi}"><span class="gn">${st+gi}</span><span class="gw">${word||"&nbsp;"}</span>${fix}</span>`;
  });
  body.innerHTML=html;
  body.querySelectorAll(".gap").forEach(s=>s.onclick=()=>{if(ex.checked)return;ex.cur=+s.dataset.g;drawExam()});
  tx.appendChild(body); wrap.appendChild(tx);
  const ans=h("div","ans"+(ex.flip?" on":""));
  const inner=h("div","inner");
  const front=h("div","face sheet");
  front.appendChild(h("h3","",`Tasks ${st}–${last}`));
  e.g.forEach((g,gi)=>{
    const row=h("div","qrow"+(gi===ex.cur&&!ex.checked?" cur":""));
    const ch=ex.chosen[gi];
    const pos=ch>=0?ex.order[gi].indexOf(ch)+1:"";
    row.appendChild(h("div","tn",String(st+gi)));
    const qo=h("div","qopts");
    ex.order[gi].forEach((oi,k)=>{
      const b=h("button","qopt",`<span class="k">${k+1})</span>${esc(g[0][oi])}`); b.type="button";
      if(ch===oi) b.classList.add("sel");
      if(ex.checked){b.disabled=true; if(oi===g[1]) {b.classList.remove("sel");b.classList.add("ok")} else if(ch===oi){b.classList.remove("sel");b.classList.add("bad")}}
      b.onclick=()=>{ex.chosen[gi]=oi; ex.cur=Math.min(n-1,gi+1); if(ex.chosen.every(c=>c>=0)) ex.cur=gi; drawExam()};
      qo.appendChild(b);
    });
    row.appendChild(qo);
    const okc=ex.checked?(ch===g[1]?" ok":" bad"):"";
    row.appendChild(h("div","otv",`Answer: <span class="cell${okc}">${pos}</span>`));
    front.appendChild(row);
  });
  const foot=h("div","ansfoot");
  if(ex.checked){
    const sc=ex.chosen.filter((c,i)=>c===e.g[i][1]).length;
    foot.appendChild(h("span","sc",`${sc} out of ${n}`));
    const rb=h("button","btn primary","Explanations"); rb.type="button"; rb.onclick=()=>{ex.flip=true;drawExam()}; foot.appendChild(rb);
    const again=h("button","btn","Try again"); again.type="button"; again.onclick=()=>loadVar(ex.v); foot.appendChild(again);
    if(ex.v<E.length-1){const nx=h("button","btn","Next text");nx.type="button";nx.onclick=()=>loadVar(ex.v+1);foot.appendChild(nx)}
  } else {
    const left=ex.chosen.filter(c=>c<0).length;
    foot.appendChild(h("span","sc muted",left?`Empty answer fields: ${left}`:"All answer fields are filled in"));
    const chk=h("button","btn primary","Check"); chk.type="button"; chk.disabled=left>0;
    chk.onclick=()=>{ex.checked=true;done.add(ex.v);drawExam()};
    foot.appendChild(chk);
  }
  front.appendChild(foot);
  const back=h("div","face back sheet");
  back.appendChild(h("h3","","Explanations"));
  const rz=h("div","razbor");
  e.g.forEach((g,gi)=>{
    const ch=ex.chosen[gi], ok=ch===g[1];
    rz.appendChild(h("div","",`<span class="tn">${st+gi}</span><span><span class="rb">${ex.order[gi].indexOf(g[1])+1}) ${esc(g[0][g[1]])}</span>${ok||ch<0?"":` <span class="x">(your answer: ${esc(g[0][ch])})</span>`} — ${esc(g[2])}</span>`));
  });
  back.appendChild(rz);
  const bf=h("div","ansfoot"); const bk=h("button","btn","Back to the tasks"); bk.type="button"; bk.onclick=()=>{ex.flip=false;drawExam()}; bf.appendChild(bk); back.appendChild(bf);
  inner.append(front,back); ans.appendChild(inner); rcol.appendChild(ans); wrap.appendChild(rcol);
  v.appendChild(wrap);
  fitExam();
}

show("home");
</script>
