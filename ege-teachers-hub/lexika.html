<meta name="claude:viewport-fit-sides" content="cover">

<style>
/* Layout: тетрадный лист в клетку; компактная верхняя панель с блоками, ниже — карточка Quizlet слева и задания под вкладками справа */
:root{
  color-scheme: light;
  --paper:#f5f8f7; --grid:#e3ecea; --ink:#1d2b2a; --muted:#5d6f6c;
  --teal:#13806f; --teal-soft:#dff1ed; --pink:#c93d6e; --pink-soft:#fbe6ee;
  --card:#ffffff; --line:#d3e0dd; --ok:#1f8a4c; --ok-soft:#e1f4e8; --bad:#c2384a; --bad-soft:#fbe4e7;
  --display:"Playfair Display", Georgia, "Times New Roman", serif;
  --body:"PT Serif", Georgia, "Times New Roman", serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.45;
  padding-left:max(10px, env(safe-area-inset-left, 0px)); padding-right:max(10px, env(safe-area-inset-right, 0px));
}
@media (max-width:600px){ body{ padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); } }
button{font-family:var(--body); font-size:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--teal); outline-offset:2px}

.top{display:flex; align-items:center; gap:14px; padding-block:10px 8px; max-width:1320px; margin:0 auto; flex-wrap:wrap}
.tohub{flex:none;font-weight:700;font-size:.9rem;color:var(--ink);text-decoration:none;background:var(--card);border:1.5px solid var(--line);border-radius:8px;padding:5px 11px}
.tohub:hover{border-color:var(--teal)}
.brand{font-family:var(--display); font-size:1.35rem; font-weight:700; white-space:nowrap}
.brand span{color:var(--pink)}
.chips{display:flex; gap:6px; overflow-x:auto; flex:1; min-width:0; padding-bottom:4px; scrollbar-width:thin}
.chip{flex:none; border:1.5px solid var(--line); background:var(--card); border-radius:999px; padding:5px 12px; font-size:.9rem; white-space:nowrap}
.chip b{color:var(--teal); margin-right:4px}
.chip.on{background:var(--teal); border-color:var(--teal); color:#fff}
.chip.on b{color:#fff}

.stage{max-width:1320px; margin:0 auto; display:grid; grid-template-columns:minmax(0,440px) minmax(0,1fr); gap:20px; padding-block:6px 20px}
@media (max-width:900px){ .stage{grid-template-columns:1fr} }

.head h1{font-family:var(--display); font-size:1.7rem; margin:0; line-height:1.15; text-wrap:balance}
.head .meta{color:var(--muted); font-size:.92rem; margin-top:3px}
.head .meta em{color:var(--pink); font-style:normal}

/* Quizlet */
.ql{margin-top:12px}
.ql-top{display:flex; justify-content:space-between; align-items:center; font-size:.9rem; color:var(--muted); margin-bottom:6px}
.ql-top .seg{display:flex; border:1.5px solid var(--line); border-radius:8px; overflow:hidden; background:var(--card)}
.ql-top .seg button{border:0; background:none; padding:3px 10px; font-size:.85rem}
.ql-top .seg button.on{background:var(--teal-soft); color:var(--teal); font-weight:700}
.card{perspective:1200px; height:260px; cursor:pointer}
.card-in{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d}
.card.flip .card-in{transform:rotateY(180deg)}
.face{position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; background:var(--card); border:1.5px solid var(--line); border-radius:14px; box-shadow:0 6px 18px rgba(19,60,55,.08); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px 26px; text-align:center}
.face.back{transform:rotateY(180deg); border-color:var(--teal)}
.face .term{font-size:1.75rem; font-weight:700; line-height:1.2; text-wrap:balance}
.face .tr{font-size:1.4rem; color:var(--teal); font-weight:700; text-wrap:balance}
.face .ex{margin-top:12px; font-style:italic; color:var(--ink); font-size:1.02rem; max-width:34ch}
.face .hint{position:absolute; bottom:9px; font-size:.78rem; color:var(--muted)}
.ql-nav{display:flex; align-items:center; justify-content:center; gap:12px; margin-top:10px}
.round{width:44px; height:44px; border-radius:50%; border:1.5px solid var(--line); background:var(--card); font-size:1.3rem; line-height:1}
.round:hover{border-color:var(--teal); color:var(--teal)}
.count{min-width:70px; text-align:center; font-variant-numeric:tabular-nums; font-weight:700}
.ql-tools{display:flex; justify-content:center; gap:8px; margin-top:8px}
.btn{border:1.5px solid var(--line); background:var(--card); border-radius:8px; padding:5px 12px; font-size:.9rem}
.btn:hover{border-color:var(--teal)}
.btn.main{background:var(--teal); border-color:var(--teal); color:#fff}

/* Панель заданий */
.panel{background:var(--card); border:1.5px solid var(--line); border-radius:14px; display:flex; flex-direction:column; min-width:0; min-height:420px}
.tabs{display:flex; border-bottom:1.5px solid var(--line); overflow-x:auto}
.tab{flex:1; border:0; background:none; padding:11px 10px; font-weight:700; color:var(--muted); border-bottom:3px solid transparent; white-space:nowrap}
.tab.on{color:var(--pink); border-bottom-color:var(--pink)}
.tab small{font-weight:400; font-variant-numeric:tabular-nums}
.pbody{padding:14px 16px; flex:1; min-width:0}
.task{display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; flex-wrap:wrap}
.task h3{margin:0; font-size:1.05rem}
.task .score{font-variant-numeric:tabular-nums; color:var(--teal); font-weight:700}

/* matching */
.match{display:grid; grid-template-columns:1fr 1fr; gap:8px 14px}
.match .col{display:flex; flex-direction:column; gap:7px; min-width:0}
.tile{border:1.5px solid var(--line); background:#fbfdfc; border-radius:9px; padding:7px 10px; text-align:left; font-size:.98rem; transition:background .2s, border-color .2s}
.tile:hover{border-color:var(--teal)}
.tile.sel{border-color:var(--teal); background:var(--teal-soft)}
.tile.done{border-color:var(--ok); background:var(--ok-soft); color:var(--ok); cursor:default}
.tile.err{animation:shake .35s; border-color:var(--bad); background:var(--bad-soft)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* facts */
.facts{display:grid; grid-template-columns:1fr; gap:9px}
.fact{perspective:900px; min-height:78px}
.fact-in{position:relative; transition:transform .45s; transform-style:preserve-3d; display:grid}
.fact.flip .fact-in{transform:rotateX(180deg)}
.fact .f{grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden; border:1.5px solid var(--line); border-radius:10px; padding:9px 12px; display:flex; align-items:center; gap:12px; background:#fbfdfc}
.fact .f.b{transform:rotateX(180deg); cursor:pointer}
.fact .f.b.ok{background:var(--ok-soft); border-color:var(--ok)}
.fact .f.b.no{background:var(--bad-soft); border-color:var(--bad)}
.fact .txt{flex:1; min-width:0}
.fact .tf{display:flex; gap:6px; flex:none}
.tf button{border:1.5px solid var(--line); background:var(--card); border-radius:8px; padding:4px 10px; font-size:.9rem}
.tf button:hover{border-color:var(--teal)}
.verdict{font-weight:700}
.f.b.ok .verdict{color:var(--ok)} .f.b.no .verdict{color:var(--bad)}
.pager{display:flex; justify-content:center; align-items:center; gap:10px; margin-top:10px}

/* text */
.textbox{font-size:1.06rem; line-height:2.05}
.textbox h4{font-family:var(--display); font-size:1.15rem; margin:0 0 4px}
.opt{display:inline-flex; gap:4px; vertical-align:baseline}
.opt button{border:1.5px dashed var(--teal); background:var(--teal-soft); border-radius:7px; padding:0 8px; font-size:.98rem; line-height:1.6}
.opt button.x{text-decoration:line-through; border-color:var(--bad); background:var(--bad-soft); color:var(--bad)}
.gap-ok{background:var(--ok-soft); color:var(--ok); font-weight:700; border-radius:6px; padding:1px 6px}

/* pronunciation */
.pron{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px}
@media (max-width:600px){ .pron{grid-template-columns:1fr} .match{gap:6px 8px} }
.pr{border:1.5px solid var(--line); border-radius:10px; padding:8px 11px; background:#fbfdfc}
.pr .w{font-weight:700; font-size:1.08rem}
.pr .ipa{color:var(--muted); font-size:.95rem; margin-left:6px}
.pr .opts{display:flex; flex-wrap:wrap; gap:5px; margin-top:5px}
.pr .opts button{border:1.5px solid var(--line); background:var(--card); border-radius:7px; padding:2px 8px; font-size:.92rem}
.pr .opts button:hover{border-color:var(--pink)}
.pr .opts button.x{border-color:var(--bad); background:var(--bad-soft); color:var(--bad)}
.pr.done{border-color:var(--ok); background:var(--ok-soft)}
.pr.done .ru{color:var(--ok); font-weight:700}
.note{font-size:.85rem; color:var(--muted); margin-top:10px}
@media (prefers-reduced-motion:reduce){ .card-in,.fact-in{transition:none} .tile.err{animation:none} }
</style>

const $ = id => document.getElementById(id);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

let bi=0, order=[], ci=0, dir="en", tab="col", state={};

function chips(){
  $("chips").innerHTML = B.map((b,i)=>`<button class="chip${i===bi?" on":""}" data-i="${i}"><b>${i+1}</b>${b.short}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>pick(+c.dataset.i));
}
function pick(i){
  bi=i; const b=B[i];
  $("bTitle").textContent=b.t;
  $("bMeta").innerHTML=`<em>Блок ${i+1}</em> · ${b.src}`;
  order=b.cards.map((_,k)=>k); ci=0;
  state={col:{done:0}, facts:{page:0, ans:{}, right:0}, text:{right:0, done:0}, pron:{right:0, done:0}};
  chips(); showCard(false); renderTab(); scores();
  document.querySelector(".chip.on")?.scrollIntoView({block:"nearest", inline:"center"});
}

/* Quizlet */
function showCard(keepFlip){
  const b=B[bi], c=b.cards[order[ci]], card=$("card"), inner=card.querySelector(".card-in");
  if(!keepFlip){ inner.style.transition="none"; card.classList.remove("flip"); void inner.offsetWidth; inner.style.transition=""; }
  $("cFront").textContent = dir==="en"?c[0]:c[1];
  $("cBack").textContent = dir==="en"?c[1]:c[0];
  $("cEx").textContent = c[2]||"";
  $("count").textContent = `${ci+1} / ${order.length}`;
}
$("card").onclick=()=>$("card").classList.toggle("flip");
$("card").onkeydown=e=>{ if(e.key===" "||e.key==="Enter"){e.preventDefault(); $("card").classList.toggle("flip");} };
$("prev").onclick=()=>{ ci=(ci-1+order.length)%order.length; showCard(false); };
$("next").onclick=()=>{ ci=(ci+1)%order.length; showCard(false); };
$("shuffle").onclick=()=>{ order=shuffle(order); ci=0; showCard(false); };
$("restart").onclick=()=>{ order=B[bi].cards.map((_,k)=>k); ci=0; showCard(false); };
$("dirEn").onclick=()=>{ dir="en"; $("dirEn").classList.add("on"); $("dirRu").classList.remove("on"); showCard(false); };
$("dirRu").onclick=()=>{ dir="ru"; $("dirRu").classList.add("on"); $("dirEn").classList.remove("on"); showCard(false); };
document.addEventListener("keydown",e=>{
  if(e.target.closest("button")) return;
  if(e.key==="ArrowRight") $("next").click();
  if(e.key==="ArrowLeft") $("prev").click();
});

/* Tabs */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  tab=t.dataset.t; document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t)); renderTab();
});
function scores(){
  const b=B[bi];
  $("s-col").textContent=`${state.col.done}/${b.col.length}`;
  $("s-facts").textContent=`${Object.keys(state.facts.ans).length}/${b.facts.length}`;
  $("s-text").textContent=`${state.text.done}/${b.text.s.length}`;
  $("s-pron").textContent=`${state.pron.done}/${b.pron.length}`;
}
function renderTab(){ ({col:renderCol, facts:renderFacts, text:renderText, pron:renderPron})[tab](); }

/* Matching */
function renderCol(){
  const b=B[bi], P=$("pbody"); state.col.done=0; scores();
  const L=shuffle(b.col.map((p,i)=>({i,v:p[0]}))), R=shuffle(b.col.map((p,i)=>({i,v:p[1]})));
  P.innerHTML=`<div class="task"><h3>Соедини слова в устойчивые сочетания</h3><span class="score" id="colScore">0 / ${b.col.length}</span></div>
  <div class="match"><div class="col" id="mL">${L.map(x=>`<button class="tile" data-i="${x.i}">${esc(x.v)}</button>`).join("")}</div>
  <div class="col" id="mR">${R.map(x=>`<button class="tile" data-i="${x.i}">${esc(x.v)}</button>`).join("")}</div></div>
  <div class="pager"><button class="btn" id="colAgain">Заново</button></div>`;
  let sel=null;
  P.querySelectorAll("#mL .tile").forEach(t=>t.onclick=()=>{ if(t.classList.contains("done"))return; P.querySelectorAll("#mL .tile").forEach(x=>x.classList.remove("sel")); t.classList.add("sel"); sel=t; });
  P.querySelectorAll("#mR .tile").forEach(t=>t.onclick=()=>{
    if(t.classList.contains("done")||!sel) return;
    const ok = b.col[+sel.dataset.i][1]===b.col[+t.dataset.i][1];
    if(ok){ sel.classList.remove("sel"); sel.classList.add("done"); t.classList.add("done"); sel=null; state.col.done++; $("colScore").textContent=`${state.col.done} / ${b.col.length}`; scores(); }
    else { [sel,t].forEach(x=>{x.classList.remove("err"); void x.offsetWidth; x.classList.add("err");}); }
  });
  $("colAgain").onclick=renderCol;
}

/* Facts: true / false flip cards */
function renderFacts(){
  const b=B[bi], P=$("pbody"), per=5, pages=Math.ceil(b.facts.length/per), st=state.facts;
  const start=st.page*per, items=b.facts.slice(start,start+per);
  P.innerHTML=`<div class="task"><h3>Верно или неверно?</h3><span class="score">Верных ответов: ${st.right} / ${Object.keys(st.ans).length}</span></div>
  <div class="facts">${items.map((f,k)=>{const i=start+k, a=st.ans[i]; const good = a!==undefined && a===f[1];
    return `<div class="fact${a!==undefined?" flip":""}" data-i="${i}"><div class="fact-in">
      <div class="f"><span class="txt">${esc(f[0])}</span><span class="tf"><button data-v="1">Верно</button><button data-v="0">Неверно</button></span></div>
      <div class="f b ${good?"ok":"no"}" title="Нажми, чтобы увидеть утверждение"><span class="txt"><span class="verdict">${good?"Правильно!":"Ошибка."}</span> Это ${f[1]?"верно":"неверно"}. ${esc(f[2]||"")}</span></div>
    </div></div>`;}).join("")}</div>
  <div class="pager"><button class="round" id="fPrev" aria-label="Назад">‹</button><span class="count">${st.page+1} / ${pages}</span><button class="round" id="fNext" aria-label="Вперёд">›</button></div>`;
  P.querySelectorAll(".fact").forEach(el=>{
    const i=+el.dataset.i;
    el.querySelectorAll(".tf button").forEach(btn=>btn.onclick=()=>{
      if(st.ans[i]!==undefined) return;
      st.ans[i]=btn.dataset.v==="1"; if(st.ans[i]===b.facts[i][1]) st.right++;
      scores(); renderFacts();
    });
    el.querySelector(".f.b").onclick=()=>el.classList.toggle("flip");
  });
  $("fPrev").onclick=()=>{ st.page=(st.page-1+pages)%pages; renderFacts(); };
  $("fNext").onclick=()=>{ st.page=(st.page+1)%pages; renderFacts(); };
}

/* Text with tap-gaps */
function renderText(){
  const b=B[bi], P=$("pbody"); state.text={right:0, done:0}; scores();
  const html=b.text.s.map((s,i)=>s.replace(/\{([^}]*)\}/,(m,g)=>{ const o=g.split("|"); return `<span class="opt" data-i="${i}">${shuffle(o.map((v,k)=>({v,k}))).map(x=>`<button data-k="${x.k}">${x.v}</button>`).join("")}</span>`; })).join(" ");
  P.innerHTML=`<div class="task"><h3>Прочитай текст и выбери верное слово</h3><span class="score" id="tScore">0 ошибок · 0 / ${b.text.s.length}</span></div>
  <div class="textbox"><h4>${b.text.title}</h4>${html}</div>
  <div class="pager"><button class="btn" id="tAgain">Заново</button></div>`;
  let errs=0;
  P.querySelectorAll(".opt").forEach(g=>g.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{
    if(btn.dataset.k==="0"){ const s=document.createElement("span"); s.className="gap-ok"; s.innerHTML=btn.innerHTML; g.replaceWith(s); state.text.done++; }
    else { if(!btn.classList.contains("x")) errs++; btn.classList.add("x"); }
    $("tScore").textContent=`${errs} ${errs===1?"ошибка":(errs>1&&errs<5?"ошибки":"ошибок")} · ${state.text.done} / ${b.text.s.length}`; scores();
  }));
  $("tAgain").onclick=renderText;
}

/* Pronunciation: choose the stressed syllable */
function stressVariants(ru){
  const syl=ru.split("-"), up=s=>s===s.toUpperCase()&&/[А-ЯЁ]/.test(s);
  const si=syl.findIndex(up);
  const make=k=>syl.map((s,j)=>j===k?s.toUpperCase():s.toLowerCase()).join("-");
  const idx=[...Array(syl.length).keys()].filter(k=>k!==si).sort((a,b)=>Math.abs(a-si)-Math.abs(b-si)).slice(0,2);
  return shuffle([{v:make(si),ok:true}, ...idx.map(k=>({v:make(k),ok:false}))]);
}

    else btn.classList.add("x");

}
